COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEAPP_TITLE="Subir a Microsoft OneDrive (carpeta específica de la aplicación)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEAPP_DESCRIPTION="Sube el archivo de copia de seguridad a Microsoft OneDrive, dentro de la carpeta específica de la aplicación de Akeeba Backup (<code>Apps/Akeeba Backup</code>). Esto es más limitado que las otras opciones de subida a OneDrive, pero es menos probable que cause problemas con algunas cuentas que presentan problemas de autenticación con la otra integración que ofrecemos."
COM_AKEEBA_CONFIG_ONEDRIVEAPP_DIRECTORY_TITLE="Subdirectorio en <code>Apps/Akeeba Backup</code>"
COM_AKEEBA_CONFIG_ONEDRIVEAPP_DIRECTORY_DESCRIPTION="El subdirectorio dentro de la carpeta específica de la aplicación Akeeba Backup (<code>Apps/Akeeba Backup</code>) en su unidad de Microsoft OneDrive en el que se subirán los archivos de copia de seguridad. Utilice barras diagonales (<code>/</code>), no barras invertidas (<code>\\<code>), y coloque siempre una barra diagonal al principio. Correcto: <code>/alguna/ruta</code>. Incorrecto: <code>alguna\\ruta</code>. Una sola barra diagonal significa que los archivos se almacenarán en la raíz de la unidad. ¡NO incluya la ruta a la carpeta específica de la aplicación (<code>Apps/Akeeba Backup</code>); Microsoft OneDrive la añade automáticamente!"

