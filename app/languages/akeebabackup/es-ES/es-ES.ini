COM_AKEEBA_SCHEDULE_LBL_JSONAPI_DISCLAIMER="Akeeba Ltd no respalda, acepta responsabilidad ni ofrece soporte para software o servicios de terceros que interactúen con Akeeba Backup a través de la API JSON. Solo proporcionaremos soporte para realizar copias de seguridad con la API JSON de Akeeba si la clave secreta ha sido generada automáticamente por nuestro software y la solicitud se refiere al uso de nuestro propio software cliente de la API JSON de Akeeba (p. ej., Akeeba Remote CLI)."
