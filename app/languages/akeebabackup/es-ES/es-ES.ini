COM_AKEEBA_CRONS_LBL_CRON_EXPRESSION_TIP="Indica a WP-CRON cuándo y con qué frecuencia ejecutar una copia de seguridad. Las <a href=\"https://en.wikipedia.org/wiki/Cron#Cron_expression\" target=\"_blank\">expresiones CRON</a> son un valor predefinido (por ejemplo, <code>@daily</code>) o cinco campos separados por espacios en este orden: <code>minuto hora día mes díaDeLaSemana</code>. Vea ejemplos y pruebe sus expresiones CRON en la herramienta de terceros <a href=\"https://crontab.guru\" target=\"_blank\">Crontab Guru</a>. Consulte nuestra documentación para más detalles."
