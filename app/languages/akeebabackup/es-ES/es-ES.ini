COM_AKEEBA_CONFWIZ_INTROTEXT="El asistente de configuración ejecuta una serie de pruebas de rendimiento en su servidor para determinar los ajustes óptimos de copia de seguridad para su sitio. No abandone esta página. Es normal que parezca bloqueada durante períodos de hasta tres (3) minutos, dependiendo de la velocidad de su servidor."
