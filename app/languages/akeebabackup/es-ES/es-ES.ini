COM_AKEEBA_CONFIG_WHERE_ARE_THE_FILTERS="Si está buscando los filtros &ndash;por ejemplo, para excluir archivos, directorios y tablas de base de datos&ndash; haga clic en el botón Cancelar para volver a la página del Panel de control, donde puede acceder a estas funciones directamente."
COM_AKEEBA_CONFIG_ZIPCDGLUECHUNKSIZE_DESCRIPTION="Los archivos ZIP se componen de una sección de datos y una sección de «directorio». Akeeba Backup procesa estas secciones en paralelo y las une durante la fase de finalización del archivo. Este parámetro determina la cantidad de datos que se procesarán de una vez durante esta fase. No debería ser necesario modificar este ajuste a menos que tenga graves problemas de agotamiento de memoria."
