COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_1="Su script de restauración de copias de seguridad (ANGIE) solo será accesible si introduce la contraseña que configuró en la página anterior, antes de hacer clic en el botón Hacer copia de seguridad ahora. Si no recuerda haber configurado una contraseña, su navegador ha completado automáticamente la contraseña en la página de configuración <strong>sin preguntarle</strong>. Esto lo hacen muchos gestores de contraseñas y navegadores."
COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_2="Los navegadores modernos y los gestores de contraseñas no nos permiten anular este comportamiento. Hemos incluido una defensa en JavaScript contra este tipo de autocompletado no consensuado del campo de contraseña en la página de configuración. Sin embargo, si guarda la página de configuración en un intervalo de aproximadamente medio segundo tras su carga, esta defensa no tendrá oportunidad de ejecutarse."
