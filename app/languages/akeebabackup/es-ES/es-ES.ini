COM_AKEEBA_CONTROLPANEL_HEAD_LBL_DISCOUNT="Use el código de cupón <strong>%s</strong> para suscribirse con un descuento introductorio del <strong>20%%</strong>."
COM_AKEEBA_CONTROLPANEL_HEAD_LBL_PROUPSELL_1="Añada copias de seguridad programadas, subida automática a más de 40 proveedores de almacenamiento en la nube, restauración integrada, un asistente de transferencia de sitio y mucho más con <strong>Akeeba Backup Professional</strong>."
