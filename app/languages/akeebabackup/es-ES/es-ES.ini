SOLO_SETUP_LBL_USER_PASSWORD2_HELP="Repita la contraseña que introdujo anteriormente. Queremos asegurarnos de que no la escribió incorrectamente por accidente."
SOLO_SETUP_LBL_USER_PASSWORD_HELP="La contraseña que utilizará para iniciar sesión en Akeeba Solo. La contraseña distingue entre mayúsculas y minúsculas, lo que significa que abc, Abc y ABC son tres contraseñas <em>diferentes</em>."
