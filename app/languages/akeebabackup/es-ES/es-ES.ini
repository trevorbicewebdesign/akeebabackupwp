COM_AKEEBA_CPANEL_ERR_FESECRETWORD_BANNED="La clave secreta es una contraseña conocida como insegura. Por favor, no utilice palabras del diccionario, nombres de películas o series, ni los nombres de sus seres queridos o mascotas."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_HEADER="Las funciones de copia de seguridad de interfaz pública y remota están deshabilitadas"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_INTRO="Su <em>clave secreta</em> no es segura y puede adivinarse fácilmente. Para proteger su sitio, Akeeba Backup ha deshabilitado el acceso a las copias de seguridad de interfaz pública y remota hasta que introduzca una clave secreta segura. El problema detectado es:"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_RESET="No se pudo cambiar la clave secreta"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_TOOSHORT="La clave secreta es demasiado corta. Utilice una clave secreta de al menos 8 caracteres."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_TOOSIMPLE="La clave secreta es demasiado simple. Intente usar letras minúsculas y mayúsculas, números y signos de puntuación."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="Como alternativa, haga clic en el botón de abajo para restablecer la clave secreta al valor sugerido <code>%s</code>. En cualquier caso, deberá actualizar sus servicios de copia de seguridad remota y/o tareas CRON con la nueva clave secreta."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_JOOMLA="Haga clic en Opciones, Interfaz pública, e introduzca una clave secreta más compleja."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_SOLO="Haga clic en Configuración del sistema, API pública, e introduzca una clave secreta más compleja."
COM_AKEEBA_CPANEL_ERR_INVALIDDOWNLOADID="Formato de ID de descarga no válido. Siga nuestras instrucciones para obtener su ID de descarga. No introduzca su nombre de usuario, dirección de correo electrónico o contraseña en este campo."
COM_AKEEBA_CPANEL_ERR_MBSTRING_SOLO="<strong>Su versión de PHP no tiene la extensión mbstring instalada o activada</strong>. Tenerla habilitada es un requisito de Akeeba Solo. Es posible que Akeeba Solo no funcione correctamente. Solicite a su proveedor de alojamiento que habilite la extensión mbstring en PHP %s en su servidor."
COM_AKEEBA_CPANEL_ERR_MBSTRING_WORDPRESS="<strong>Su versión de PHP no tiene la extensión mbstring instalada o activada</strong>. Tenerla habilitada es un requisito de WordPress. Es posible que WordPress y Akeeba Backup no funcionen correctamente. Solicite a su proveedor de alojamiento que habilite la extensión mbstring en PHP %s en su servidor."
