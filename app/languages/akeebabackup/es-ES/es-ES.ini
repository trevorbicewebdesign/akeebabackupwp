SOLO_CONFIG_UPDATE_INTEGRATED_WP_DESC="Cuando está habilitado, Akeeba Backup notificará a WordPress sobre la disponibilidad de actualizaciones y la ubicación de los archivos de actualización. Esto permite que WordPress incluya las actualizaciones de Akeeba Backup en el recuento de actualizaciones disponibles y las muestre en la página de Plugins. En muy pocos sitios, esto puede provocar una página en blanco o un error al acceder a la página de Plugins debido a la interacción con plugins de terceros mal programados. En ese caso, deshabilite esta opción y contacte con nosotros indicando la lista de plugins que tiene activados en su sitio y sus versiones."
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_CONSERVATIVE="Conservador"
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_DESCRIPTION="Cuando está habilitado, las copias de seguridad realizadas con WP-CRON tendrán los tiempos de ejecución mínimo y máximo configurados en la sección de Ajuste fino del perfil de copia de seguridad reemplazados. El ajuste «Optimista» intentará usar el mayor tiempo posible en su servidor, hasta 60 segundos, lo que produce copias de seguridad más rápidas pero con mayor riesgo de fallo. El ajuste «Conservador» intentará usar solo la mitad del tiempo que el ajuste Optimista, produciendo copias de seguridad más lentas pero con menos probabilidades de fallo. Algunos servidores pueden requerir establecer esto en «No» y ajustar manualmente la configuración de Ajuste fino para que la copia de seguridad funcione sin fallos."
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_LABEL="Anular los límites de tiempo en WP-CRON"
