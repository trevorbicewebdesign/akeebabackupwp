COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_HEAD="La configuración predeterminada del sistema CRON de WordPress puede provocar problemas en las copias de seguridad programadas"
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P1="Según la <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">documentación de WordPress</a>, las tareas críticas —como las copias de seguridad— programadas con WP-CRON en la configuración predeterminada de WordPress (ejecución de tareas programadas evaluada solo cuando se visita el sitio) pueden no ejecutarse en el momento correcto o no ejecutarse en absoluto. Como resultado de este problema de diseño inherente que WordPress reconoce abiertamente, las copias de seguridad programadas con WP-CRON bajo esta configuración pueden no iniciarse en el momento correcto (o no iniciarse en absoluto), pueden tardar mucho más en ejecutarse, pueden volverse inconsistentes o corruptas, pueden solaparse o pueden iniciarse pero no completarse. Consulte nuestra documentación para obtener información detallada."
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P2="Le <strong>recomendamos muy encarecidamente</strong> seguir la recomendación de la <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">documentación oficial de WordPress</a> para deshabilitar la ejecución predeterminada de tareas basada en la actividad del sitio, usando el Programador de tareas de Windows o el demonio CRON de macOS/Linux para programar la ejecución del auxiliar CRON de WordPress (<code>wp-cron.php</code>) cada minuto. Esta configuración supera el problema de diseño inherente de la configuración predeterminada de WordPress para WP-CRON y hace que sus copias de seguridad programadas sean tan fiables como las copias de seguridad manuales realizadas desde el panel de administración o las copias de seguridad programadas con los métodos de copia de seguridad de interfaz pública o API JSON."
