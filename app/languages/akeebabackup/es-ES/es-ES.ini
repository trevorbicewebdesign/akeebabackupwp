COM_AKEEBA_MIGREIGHT_GO_BACK_PROMPT="Puede volver con seguridad a la página de inicio (panel de control) de Akeeba Backup."
COM_AKEEBA_MIGREIGHT_NOT_NEEDED_TITLE="No es necesaria la migración (¡eso es buena señal!)"
COM_AKEEBA_MIGREIGHT_NOT_NEEDED_INFO="Sus perfiles de copia de seguridad y archivos de copia de seguridad parecen encontrarse fuera de la carpeta del complemento. ¡Estupendo! Puede actualizar Akeeba Backup con seguridad, sin riesgo de perder sus archivos de copia de seguridad."
COM_AKEEBA_MIGREIGHT_NEEDED_TITLE="Migración necesaria"
COM_AKEEBA_MIGREIGHT_NEEDED_WHY="WordPress eliminará siempre la carpeta del complemento cada vez que lo actualice. Como resultado, cualquier archivo de copia de seguridad almacenado dentro de la carpeta del complemento se <em>perderá para siempre</em>. Esto equivaldría a no haber realizado nunca ninguna copia de seguridad."
COM_AKEEBA_MIGREIGHT_NEEDED_WHAT="Akeeba Backup detecta este problema y le permite cambiar automáticamente el directorio de salida de las copias de seguridad para que se encuentre en <code>%s</code>, además de mover sus archivos de copia de seguridad existentes a esa misma carpeta."
