COM_AKEEBA_SCHEDULE_LBL_ALTCLICRON_INFO="Este método se recomienda únicamente si la tarea CRON de línea de comandos habitual no se completa. Este método utiliza internamente el método de copia de seguridad de interfaz pública y es algo más lento que el método CLI nativo."
COM_AKEEBA_SCHEDULE_LBL_CHECK_BACKUPS="Comprobar estado de las copias de seguridad"
COM_AKEEBA_SCHEDULE_LBL_CHECK_UPLOADS="Comprobar estado de las subidas"
COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECK_HEADERINFO="Esta función le permite comprobar si hay copias de seguridad completadas que no se han podido subir al almacenamiento remoto (p. ej., Amazon S3, Dropbox, etc.) y enviar una notificación por correo electrónico a los administradores del sitio."
COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECKUSECLI="Para comprobar si hay subidas fallidas al almacenamiento remoto utilizando el script CLI nativo, use la siguiente línea de comandos:"
COM_AKEEBA_SCHEDULE_LBL_CLICRON="Tareas CRON de línea de comandos (recomendado)"
COM_AKEEBA_SCHEDULE_LBL_CLICRON_INFO="Este es el método recomendado para todos los servidores que admiten tareas CRON de línea de comandos. Este método evita la interfaz web, logrando la máxima velocidad de copia de seguridad."
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICIMPROTANTINFO="Importante"
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICINFO="Recuerde sustituir <em>%s</em> por la ruta real al ejecutable PHP <strong>CLI (Command Line Interface)</strong> de su servidor. Tenga en cuenta que debe usar el ejecutable PHP CLI; aunque el ejecutable PHP CGI (Common Gateway Interface) puede funcionar con nuestros scripts CRON, es propenso a errores de tiempo de espera agotado y fallos en la copia de seguridad. Si no está seguro de qué significa esto, consulte a su proveedor de alojamiento. Ellos son los únicos que pueden proporcionarle la ruta al archivo ejecutable PHP CLI."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP="Función de copia de seguridad de interfaz pública"
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_INFO="Este método utiliza una URL pública y una clave secreta para iniciar una copia de seguridad de su sitio. La copia de seguridad avanza mediante redirecciones HTTP. Tenga en cuenta que la mayoría de las tareas «CRON» basadas en URL de los proveedores de alojamiento, así como la mayoría de los servicios CRON basados en URL de terceros, no admiten redirecciones HTTP. Si los ejemplos con wget y curl que se muestran a continuación no funcionan, utilice la URL de copia de seguridad de interfaz pública con el servicio de terceros webcron.org, que es muy económico."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_MANYMETHODS="La función de copia de seguridad de interfaz pública se puede usar con una gran variedad de métodos. Haga clic en las pestañas siguientes para ver la descripción de cada método. Recuerde que todos ellos se explican con detalle en nuestra documentación."
