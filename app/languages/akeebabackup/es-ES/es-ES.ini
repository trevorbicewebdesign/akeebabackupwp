SOLO_USERS_HEAD_BASIC="Configuración básica"
SOLO_USERS_HEAD_TFA="Autenticación de dos factores"
SOLO_USERS_LBL_ABOUTTFA="La autenticación de dos factores (TFA) añade una capa adicional de seguridad al iniciar sesión en Akeeba Solo. Además de su nombre de usuario y contraseña, también deberá introducir un código secreto para poder iniciar sesión. A diferencia de su nombre de usuario y contraseña, este código secreto no es fijo. Cambia con el tiempo y lo genera su smartphone o un dispositivo dedicado, según el método que elija. La activación de TFA es opcional; Akeeba Solo funciona igual de bien sin ella."
SOLO_USERS_LBL_TFAENABLE="Habilitar la autenticación de dos factores"
SOLO_USERS_LBL_TFAMETHOD="Método de autenticación de dos factores"
SOLO_USERS_LBL_TFASECURITYCODE="Código de seguridad"
SOLO_USERS_TFA_GOOGLE="Google Authenticator"
SOLO_USERS_TFA_GOOGLE_INTRO="Esta función le permite utilizar Google Authenticator, o una aplicación compatible, para la autenticación de dos factores. Además de su nombre de usuario y contraseña, también deberá proporcionar un código de seguridad de seis dígitos generado por Google Authenticator para poder iniciar sesión en Akeeba Solo. El código de seguridad se renueva cada 30 segundos. Esto proporciona protección adicional contra accesos no autorizados a su cuenta, incluso si alguien lograse obtener su contraseña."
SOLO_USERS_TFA_GOOGLE_LBL_STEP1="Paso 1 - Obtener Google Authenticator"
SOLO_USERS_TFA_GOOGLE_LBL_STEP2="Paso 2 - Configurar"
SOLO_USERS_TFA_GOOGLE_LBL_STEP3="Paso 3 - Activar la autenticación de dos factores"
SOLO_USERS_TFA_GOOGLE_SETUP1="Descargue e instale Google Authenticator, o una aplicación compatible, en su smartphone o equipo de escritorio. Utilice una de las siguientes opciones:"
SOLO_USERS_TFA_GOOGLE_SETUP1_WARNING="Recuerde sincronizar el reloj de su dispositivo con un servidor de hora. La desincronización horaria de su dispositivo puede ocasionar que no pueda iniciar sesión en Akeeba Solo."
SOLO_USERS_TFA_GOOGLE_SETUP2A="Deberá introducir la siguiente información en Google Authenticator o en una aplicación compatible."
SOLO_USERS_TFA_GOOGLE_SETUP2A_ACCOUNT="Cuenta"
SOLO_USERS_TFA_GOOGLE_SETUP2A_KEY="Clave"
SOLO_USERS_TFA_GOOGLE_SETUP2B="Como alternativa, puede escanear el siguiente código QR en Google Authenticator."
SOLO_USERS_TFA_GOOGLE_SETUP3="Para verificar que todo está configurado correctamente, introduzca el código de seguridad que aparece en Google Authenticator en el campo de abajo y haga clic en el botón. Si el código es correcto, se activará la función de autenticación de dos factores."
SOLO_USERS_TFA_NONE="Ninguna (no usar autenticación de dos factores)"
SOLO_USERS_TFA_OTEPS_HEAD="Códigos de emergencia de un solo uso"
SOLO_USERS_TFA_OTEPS_INTRO="Imprima ahora una copia de estos códigos y guárdela en un lugar seguro. Si pierde su dispositivo de autenticación de dos factores, no podrá iniciar sesión en Akeeba Solo. En ese caso, utilice una de las siguientes contraseñas de emergencia de un solo uso en lugar de su clave secreta de dos factores para iniciar sesión en Akeeba Solo y restablecer la autenticación de dos factores. Recuerde que estos son códigos de emergencia de un solo uso. Una vez que utilice uno, no podrá volver a usarlo. Si agota todos los códigos de emergencia, deshabilite la autenticación de dos factores y vuélvala a habilitar para generar un nuevo conjunto de 10 códigos."
SOLO_USERS_TFA_YUBIKEY="YubiKey"
SOLO_USERS_TFA_YUBIKEY_INTRO="Esta función le permite utilizar un token de hardware seguro YubiKey para la autenticación de dos factores. Además de su nombre de usuario y contraseña, también deberá insertar su YubiKey en el puerto USB de su equipo, hacer clic dentro del área de clave secreta en la pantalla de inicio de sesión de Akeeba Solo y tocar el botón dorado de YubiKey. El código secreto generado por su YubiKey es único para su dispositivo y cambia constantemente. Esto proporciona protección adicional contra accesos no autorizados a su cuenta, incluso si alguien lograse obtener su contraseña."
SOLO_USERS_TFA_YUBIKEY_SETUP="Inserte su dispositivo YubiKey en el puerto USB de su equipo. Haga clic en el campo Código de seguridad que aparece a continuación. A continuación, toque el botón dorado de su dispositivo YubiKey durante un segundo. Después, guarde su perfil de usuario. Si el código generado por su YubiKey es validado por YubiCloud, se activará la función de autenticación de dos factores y este YubiKey quedará vinculado a su cuenta de usuario."
SOLO_WIZARD_BTN_PYTHIA="Detección automática"
SOLO_WIZARD_BTN_PYTHIA_HELP="Si hace clic en este botón, Akeeba Solo intentará detectar automáticamente el tipo de script, el tipo de instalador y la información de conexión a la base de datos que aparece a continuación. Revise la configuración. La detección automática puede no producir la configuración correcta en determinadas circunstancias."
SOLO_WIZARD_ERR_DIRNOTEXIST="El directorio raíz especificado no existe o Akeeba Solo no puede leerlo"
SOLO_WIZARD_LBL_DBINFO_INTRO="Aquí puede proporcionar la información de conexión a la base de datos que contiene los datos del sitio o aplicación web de la que desea hacer una copia de seguridad."
SOLO_WIZARD_LBL_DBINFO_TITLE="Conexión a la base de datos"
SOLO_WIZARD_LBL_INTRO="En primer lugar, debe indicarnos de qué desea hacer una copia de seguridad. Puede hacerlo definiendo el directorio raíz y la información de conexión a la base de datos del sitio del que desea hacer copia de seguridad. Si su sitio requiere más de una base de datos para funcionar correctamente, podrá añadirlas una vez completado este asistente, mediante la función Definición de bases de datos adicionales en la página principal de la aplicación."
SOLO_WIZARD_LBL_SITEINFO_INTRO="Las siguientes opciones afectan a la forma en que Akeeba Solo hace la copia de seguridad de su sitio y restaura sus copias de seguridad. Si no está seguro de qué introducir aquí, haga clic en el botón Detección automática en la parte superior de la página para que Akeeba Solo detecte automáticamente estos valores."
SOLO_WIZARD_LBL_SITEINFO_TITLE="Información del sitio"
SOLO_WIZARD_LBL_SITEROOT_INTRO="El directorio raíz del sitio es el directorio que contiene todos los archivos del sitio o aplicación web de la que desea hacer una copia de seguridad. Debe encontrarse en el mismo servidor y ser legible por Akeeba Solo."
SOLO_WIZARD_LBL_SITEROOT_TITLE="Directorio raíz del sitio"
SOLO_WIZARD_NO_EXTRADIRS_CORE="La compatibilidad con directorios fuera del directorio raíz web está disponible únicamente en la versión Pro; por lo tanto, la(s) carpeta(s) indicada(s) no se incluirá(n) en su copia de seguridad."
