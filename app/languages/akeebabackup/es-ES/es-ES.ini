COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE_NODOWNLOAD_PHPERRORDISPLAY="La descarga de copias de seguridad a través del navegador está deshabilitada automáticamente"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING="Le recomendamos que cierre este cuadro de diálogo y utilice FTP en modo de transferencia <code>Binario</code> o SFTP para descargar sus archivos de copia de seguridad."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD="<strong>La configuración actual de su servidor puede producir un archivo dañado (o roto) al descargarlo a través del navegador.</strong> La descarga de archivos de copia de seguridad a través del navegador está deshabilitada de forma predeterminada porque es probable que otro complemento o PHP añada datos inesperados al principio o al final del archivo de copia de seguridad. Esto dañaría (rompería) los archivos de copia de seguridad que descargue a través del navegador, imposibilitando su restauración."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_ALTERNATIVE="Puede cerrar este cuadro de diálogo y utilizar FTP en modo de transferencia <code>Binario</code> o SFTP para descargar sus archivos de copia de seguridad desde el servidor."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART="Su archivo de copia de seguridad consta de %u archivos con el nombre <code>%s</code> y las extensiones <code>%s</code>, así como <code>%s</code> a <code>%s</code>. <strong>¡IMPORTANTE!</strong> Debe descargar <em>todos estos</em> archivos. Al restaurar su sitio, suba también todos estos archivos junto con <code>kickstart.php</code>. Si no lo hace, el archivo de copia de seguridad no podrá restaurarse."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_1="El archivo que necesita descargar se llama <code>%s</code>"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_2="Su archivo de copia de seguridad consta de dos archivos con el nombre <code>%s</code> y las extensiones <code>%s</code> y <code>%s</code>. <strong>¡IMPORTANTE!</strong> Debe descargar <em>ambos</em> archivos. Al restaurar su sitio, suba también ambos archivos junto con <code>kickstart.php</code>. Si no lo hace, el archivo de copia de seguridad no podrá restaurarse."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_AKEEBADEBUG="Puede volver a habilitar las descargas desde el navegador editando su archivo <code>%s/defines.php</code> y comentando la línea <code>define('AKEEBADEBUG', 1);</code>."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_ENABLED="<strong>La configuración actual de su servidor puede producir un archivo dañado (o roto) al descargarlo a través del navegador.</strong> La descarga de archivos de copia de seguridad a través del navegador se ha deshabilitado automáticamente porque su servidor está configurado para mostrar avisos, advertencias y errores de PHP en el navegador. Esto causaría que el archivo descargado quedara <em>dañado</em> (roto) e imposible de restaurar. Cierre este cuadro de diálogo y utilice FTP en modo de transferencia <code>Binario</code> o SFTP para descargar sus archivos de copia de seguridad desde el servidor."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_UNKNOWN="<strong>La configuración actual de su servidor puede producir un archivo dañado (o roto) al descargarlo a través del navegador.</strong> La descarga de archivos de copia de seguridad a través del navegador se ha deshabilitado automáticamente porque no es posible determinar si su servidor está configurado para mostrar avisos, advertencias y errores de PHP en el navegador. Cuando PHP muestra avisos, advertencias y errores en el navegador, el archivo descargado queda <em>dañado</em> (roto) e imposible de restaurar. Cierre este cuadro de diálogo y utilice FTP en modo de transferencia <code>Binario</code> o SFTP para descargar sus archivos de copia de seguridad desde el servidor."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_WPDEBUG="Puede volver a habilitar las descargas desde el navegador editando su archivo <code>wp-config.php</code> y estableciendo la constante <code>WP_DEBUG</code> en <code>false</code>."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_REENABLE="Puede habilitar las descargas a través del navegador <em>bajo su propia responsabilidad</em> en la página de Configuración del sistema de Akeeba Backup."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_WORDPRESS="<strong>Ha habilitado manualmente la descarga de copias de seguridad a través del navegador <em>bajo su propia responsabilidad</em>.</strong> Los complementos de terceros y la configuración del servidor pueden causar que el archivo descargado quede truncado (incompleto) o dañado (roto). Si decide descargar sus archivos de copia de seguridad a través del navegador ignorando nuestras advertencias, <strong>usted acepta personalmente toda la responsabilidad y las consecuencias de sus acciones</strong> y reconoce que Akeeba Ltd no es responsable en modo alguno y no le proporcionará ningún tipo de asistencia en caso de que el archivo de copia de seguridad no pueda extraerse o restaurarse."
COM_AKEEBA_BUADMIN_LBL_LOGFILEID="ID del archivo de registro"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD="Descargar"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD_CONFIRM="La descarga de archivos de copia de seguridad a través del navegador es propensa\na fallos, daños y truncamiento de archivos por razones\nobjetivamente fuera de nuestro control (configuración del servidor, del sitio,\ncomplementos de terceros y configuración del navegador).\n\nRecomendamos MUY ENCARECIDAMENTE que siempre descargue\nlos archivos de copia de seguridad mediante FTP en modo de transferencia\nBinario (no use Automático o ASCII; dañaría sus archivos de copia de seguridad)\nutilizando software cliente como FileZilla,\n CyberDuck, WinSCP o similares; o mediante el\nadministrador de archivos del panel de control de alojamiento de su proveedor.\n\nSi continúa con esta descarga, acepta expresamente\nrenunciar a su derecho de recibir asistencia para cualquier problema relacionado\ncon la descarga, extracción o restauración del archivo de copia de seguridad, y entiende\nque dichas solicitudes no recibirán respuesta.\n\n¿Está seguro de que desea continuar?"
