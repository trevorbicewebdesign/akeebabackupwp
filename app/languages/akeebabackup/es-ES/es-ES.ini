COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_TIMEOUT_INFO="180 seg.; si la copia de seguridad no se completa, auméntelo. La mayoría de los sitios funcionarán con un valor de 180 o 600. Si tiene un sitio muy grande cuya copia de seguridad tarda más de 5 minutos, considere usar Akeeba Backup Professional y la tarea CRON CLI nativa, ya que resulta mucho más rentable."
