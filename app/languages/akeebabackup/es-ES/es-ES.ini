SOLO_SETUP_LBL_USER_USERNAME_HELP="El nombre de usuario que utilizará para iniciar sesión en Akeeba Solo. Lo mejor es usar solo letras minúsculas de la a a la z y números del 0 al 9."
SOLO_SETUP_LBL_WELCOME="Antes de poder usar Akeeba Solo debe configurarlo. Este instalador web le guiará a través de todos los pasos necesarios. En esta primera página comprobamos que la configuración de su servidor cumple los requisitos mínimos para Akeeba Solo. Haga clic en el botón <strong>Siguiente</strong> que aparece arriba para continuar a la siguiente página del instalador."
