COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEDB_DESCRIPTION="Cuando está desactivada (opción predeterminada), Akeeba Backup realizará automáticamente la copia de seguridad de la base de datos a la que se conecta el sitio donde está instalado (su base de datos de Joomla!). Cuando está activada, realizará la copia de seguridad de una base de datos diferente, utilizando los datos de conexión que indique a continuación."
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEDB_TITLE="Anular base de datos del sitio"
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEROOT_DESCRIPTION="Cuando está desactivada (opción predeterminada), Akeeba Backup realizará la copia de seguridad de todos los archivos y directorios situados bajo el directorio raíz del sitio donde está instalado. Cuando está activada, realizará la copia de seguridad de los archivos y directorios situados bajo el directorio seleccionado en Forzar directorio raíz del sitio."
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEROOT_TITLE="Anular directorio raíz del sitio"
COM_AKEEBA_CONFIG_PLATFORM_NEWROOT_DESCRIPTION="Cuando ha habilitado la opción Anular directorio raíz del sitio, Akeeba Backup realizará la copia de seguridad de todos los archivos y directorios situados bajo el directorio raíz de este sitio."
COM_AKEEBA_CONFIG_PLATFORM_NEWROOT_TITLE="Forzar directorio raíz del sitio"
COM_AKEEBA_CONFIG_PLATFORM_DBDATABASE_DESCRIPTION="El nombre de la base de datos de la que se realizará la copia de seguridad. Solo se utiliza cuando la casilla Anular base de datos del sitio está marcada."
COM_AKEEBA_CONFIG_PLATFORM_DBDATABASE_TITLE="Nombre de la base de datos"
COM_AKEEBA_CONFIG_PLATFORM_DBDRIVER_DESCRIPTION="Seleccione el controlador de base de datos que se utilizará para conectarse a la base de datos del sitio. Solo se utiliza cuando la casilla Anular base de datos del sitio está marcada."
COM_AKEEBA_CONFIG_PLATFORM_DBDRIVER_TITLE="Controlador de base de datos"
COM_AKEEBA_CONFIG_PLATFORM_DBHOST_DESCRIPTION="El nombre de host o la dirección IP del servidor de base de datos. Normalmente localhost o 127.0.0.1. Solo se utiliza cuando la casilla Anular base de datos del sitio está marcada."
COM_AKEEBA_CONFIG_PLATFORM_DBHOST_TITLE="Nombre de host del servidor de base de datos"
COM_AKEEBA_CONFIG_PLATFORM_DBPASSWORD_DESCRIPTION="La contraseña para conectarse a la base de datos del sitio. Solo se utiliza cuando la casilla Anular base de datos del sitio está marcada."
COM_AKEEBA_CONFIG_PLATFORM_DBPASSWORD_TITLE="Contraseña"
COM_AKEEBA_CONFIG_PLATFORM_DBPORT_DESCRIPTION="(opcional) El puerto en el que escucha el servidor de base de datos. Si no está seguro, deje esta opción vacía para utilizar el puerto predeterminado (3306 para servidores MySQL). Solo se utiliza cuando la casilla Anular base de datos del sitio está marcada."
COM_AKEEBA_CONFIG_PLATFORM_DBPORT_TITLE="Puerto del servidor de base de datos"
COM_AKEEBA_CONFIG_PLATFORM_DBPREFIX_DESCRIPTION="El prefijo de la base de datos de la que se realizará la copia de seguridad, incluyendo el guion bajo, por ejemplo <tt>jos_</tt>. Solo se utiliza cuando la casilla Anular base de datos del sitio está marcada."
COM_AKEEBA_CONFIG_PLATFORM_DBPREFIX_TITLE="Prefijo"
COM_AKEEBA_CONFIG_PLATFORM_DBUSERNAME_DESCRIPTION="El nombre de usuario para conectarse a la base de datos del sitio. Solo se utiliza cuando la casilla Anular base de datos del sitio está marcada."
COM_AKEEBA_CONFIG_PLATFORM_DBUSERNAME_TITLE="Nombre de usuario"

