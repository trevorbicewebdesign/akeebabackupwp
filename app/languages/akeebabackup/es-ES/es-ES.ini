COM_AKEEBA_ALICE_ERR_ANALYZEFAILED_HEADER="El análisis del registro ha fallado"
COM_AKEEBA_ALICE_ERR_ANALYZEFAILED_INFO="El análisis del registro ha sido interrumpido. El analizador de registros ha notificado el siguiente error:"
COM_AKEEBA_ALICE_ERR_CANNOT_OPEN_LOGFILE="El análisis del archivo de registro ha fallado: no se pudo abrir el archivo de registro %s para lectura."
COM_AKEEBA_ALICE_ERR_NOLOGS="No se encontraron archivos de registro de copias de seguridad <strong>fallidas</strong>."
COM_AKEEBA_ALICE_HEAD_ONLYFAILED="ALICE solo funciona con copias de seguridad <em>fallidas</em>"
COM_AKEEBA_ALICE_LBL_ONLYFAILED_IFNOFAILED="Si su copia de seguridad falló pero no la ve en esta página, espere <em>tres (3) minutos</em>, vuelva a la página del Panel de control de Akeeba Backup y luego regrese aquí. Hay una razón para ello. En algunos casos, el fallo de la copia de seguridad es provocado por un error del servidor. En estos casos, la copia de seguridad se marca como aún en curso en lugar de como fallida, ya que PHP deja de ejecutarse y, por tanto, nuestro código PHP que marcaría la copia de seguridad como fallida no tiene oportunidad de ejecutarse. Cuando visite la página del Panel de control, cualquier copia de seguridad marcada como aún en curso durante más de 3 minutos se marcará como fallida. De ahí la necesidad de esperar y <em>luego</em> volver a la página del Panel de control."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_SHOWINGLOGS="ALICE es una herramienta para analizar los archivos de registro de las copias de seguridad <em>fallidas</em> y —en la mayoría de los casos— ofrecerle la causa más probable del fallo. No está diseñada para analizar los archivos de registro de las copias de seguridad exitosas. Hacerlo devolvería resultados sin sentido, engañosos o directamente incorrectos. Por esta razón, solo le mostraremos los archivos de registro de las copias de seguridad <em>fallidas</em>."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_WHATISFAILED="Recuerde que las copias de seguridad que no terminaron de subir el archivo de copia de seguridad al almacenamiento remoto no se consideran fallidas. ALICE tampoco puede detectar la causa raíz de estos problemas. Si tiene este tipo de problema, debe abrir un ticket de soporte en la sección de soporte de nuestro sitio. Si otra persona instaló Akeeba Backup Professional en su sitio, póngase en contacto con esa persona; en ese caso no podrá abrir un ticket de soporte en nuestro sitio."
