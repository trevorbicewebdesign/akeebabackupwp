COM_AKEEBA_CONFWIZ_UI_CANTDBOPT="Akeeba Backup no ha podido determinar los ajustes óptimos de volcado de base de datos. Asegúrese de que su servidor ejecuta MySQL 5.0 o posterior y que su usuario de base de datos tiene permiso para ejecutar el comando SHOW TABLE STATUS antes de volver a ejecutar este asistente."
COM_AKEEBA_CONFWIZ_UI_CANTDETERMINEMINEXEC="No se ha podido determinar el tiempo mínimo de ejecución. Esto indica un problema grave de comunicación con su servidor. Intente configurar Akeeba Backup manualmente."
