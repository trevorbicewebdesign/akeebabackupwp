COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_TITLE="DirectFTP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_DESCRIPTION="Transfiere los archivos del sitio a un servidor SFTP remoto sin archivarlos previamente. Este motor de archivado usa la biblioteca cURL, lo que proporciona una mayor compatibilidad con una amplia gama de servidores FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_TITLE="DirectSFTP over cURL"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_DESCRIPTION="Transfiere los archivos del sitio a un servidor SFTP remoto sin archivarlos previamente. ADVERTENCIA: Su servidor de origen necesita tener instalada la extensión SSL2 de PHP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_TITLE="DirectSFTP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPA_DESCRIPTION="Un formato de archivo de código abierto optimizado para la creación y extracción rápida de archivos comprimidos mediante código PHP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPA_TITLE="Formato JPA (recomendado)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_DESCRIPTION="Crea archivos comprimidos cifrados con el método de cifrado estándar del sector AES-128, en un formato muy similar a JPA. Requiere que alguna de las extensiones PHP mcrypt u openssl esté instalada y activada en su sitio."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_TITLE="Archivos cifrados (JPS)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_DESCRIPTION="El archivo ZIP se creará usando la clase ZipArchive de PHP. IMPORTANTE: Este motor no admite la división de archivos comprimidos ni el manejo de enlaces simbólicos y, por lo tanto, puede provocar problemas en la copia de seguridad. Si obtiene errores de tiempo de espera agotado, errores AJAX o mensajes de error interno del servidor, tendrá que cambiar a un motor de archivado diferente y habilitar la división del archivo comprimido."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_TITLE="ZIP usando la clase ZipArchive"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIP_DESCRIPTION="Archivos ZIP estándar, también conocidos como «carpetas comprimidas», compatibles de forma nativa con todos los principales sistemas operativos"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIP_TITLE="Formato ZIP"
COM_AKEEBA_CONFIG_ENGINE_DUMP_NATIVE_DESCRIPTION="Usa código PHP para producir un volcado de base de datos preciso"
COM_AKEEBA_CONFIG_ENGINE_DUMP_NATIVE_TITLE="Motor nativo de copia de seguridad de MySQL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_AZURE_DESCRIPTION="Sube el archivo de copia de seguridad a Microsoft Windows Azure BLOB Storage."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_AZURE_TITLE="Subir a Microsoft Windows Azure BLOB Storage"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BACKBLAZE_DESCRIPTION="Sube el archivo de copia de seguridad a BackBlaze."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BACKBLAZE_TITLE="Subir a BackBlaze B2"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BOX_DESCRIPTION="Sube el archivo de copia de seguridad a Box.com. Lea la documentación."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BOX_TITLE="Subir a Box.com"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_DESCRIPTION="Sube el archivo de copia de seguridad a RackSpace CloudFiles.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de entre 2 y 30 Mb o se arriesga a que la copia de seguridad falle por tiempo de espera agotado!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_TITLE="Subir a RackSpace CloudFiles"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDME_DESCRIPTION="Sube el archivo de copia de seguridad a CloudMe.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de entre 2 y 30 Mb o se arriesga a que la copia de seguridad falle por tiempo de espera agotado!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDME_TITLE="Subir a CloudMe"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_DESCRIPTION="Sube el archivo de copia de seguridad a DreamObjects.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de entre 2 y 30 Mb o se arriesga a que la copia de seguridad falle por tiempo de espera agotado!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_TITLE="Subir a DreamObjects"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DROPBOX2_DESCRIPTION="Sube el archivo de copia de seguridad a Dropbox usando la API V2 de Dropbox. Esta API es más rápida y le permite conectar fácilmente su cuenta de Dropbox a múltiples sitios."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DROPBOX2_TITLE="Subir a Dropbox (API v2)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_DESCRIPTION="Le envía el archivo de copia de seguridad como adjunto de correo electrónico.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de 1-2 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados y falta de memoria!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_TITLE="Enviar por correo electrónico"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_DESCRIPTION="Sube el archivo de copia de seguridad a un servidor FTP o FTPS (FTP sobre SSL implícito) remoto.<br/>Este motor de postprocesamiento usa la biblioteca cURL, que proporciona mejor compatibilidad con una amplia gama de servidores FTP.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de 2-30 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_TITLE="Subir al servidor FTP remoto usando cURL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_DESCRIPTION="Sube el archivo de copia de seguridad a un servidor FTP o FTPS (FTP sobre SSL implícito) remoto.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de 2-30 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_TITLE="Subir al servidor FTP remoto"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_DESCRIPTION="Sube el archivo de copia de seguridad a Google Drive. Por favor, lea la documentación."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_TITLE="Subir a Google Drive"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_DESCRIPTION="Sube el archivo de copia de seguridad a Google Storage usando la API JSON moderna. Esta es la integración recomendada con Google Storage.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de 2-30 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_TITLE="Subir a Google Storage (API JSON)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_DESCRIPTION="Sube el archivo de copia de seguridad a Google Storage usando la emulación de la API S3 heredada. Esta opción está en desuso y se eliminará en el futuro. Por favor, use la opción de API JSON en su lugar.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de 2-30 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_TITLE="Subir a Google Storage (API S3 heredada)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_NONE_DESCRIPTION="Deja los archivos de copia de seguridad en el servidor"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_NONE_TITLE="Sin postprocesamiento"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_DESCRIPTION="Sube el archivo de copia de seguridad a Microsoft OneDrive o Microsoft OneDrive para empresas."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_TITLE="Subir a Microsoft OneDrive o OneDrive para empresas"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_DESCRIPTION="Sube el archivo de copia de seguridad a Microsoft OneDrive. Solo es compatible con unidades personales creadas con su cuenta personal de Microsoft. No es compatible con OneDrive para empresas ni con cuentas de OneDrive creadas a través de una cuenta escolar o laboral ni mediante una suscripción a Microsoft Office 365. Este método de subida se ELIMINARÁ en una versión futura de Akeeba Backup. Use en su lugar el método «Subir a Microsoft OneDrive»."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_TITLE="Subir a Microsoft OneDrive (HEREDADO)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_DESCRIPTION="Sube el archivo de copia de seguridad a OVH Object Storage. <br/><strong>¡Recuerde establecer un tamaño de parte dividida de 2-30 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_TITLE="Subir a OVH Object Storage"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_DESCRIPTION="Sube el archivo de copia de seguridad a Amazon S3. Permite usar tanto la autenticación nueva (AWS4), requerida para las ubicaciones S3 más recientes, como la antigua (AWS2), requerida para proveedores de almacenamiento de terceros que ofrecen una API compatible con S3.<br/><strong>¡Si deshabilita las subidas multiparte, recuerde establecer un tamaño de parte dividida de 2-30 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados!</strong><br/>Si desea usar Amazon STS en lugar de una clave de acceso y una clave secreta, lea la documentación."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_TITLE="Subir a Amazon S3"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_DESCRIPTION="Sube el archivo de copia de seguridad a un servidor SFTP (SSH) remoto. Se trata de una transferencia de archivos sobre SSH que usa un protocolo llamado SFTP, que es <em>completamente diferente</em> a FTP y FTPS.<br/>Este motor de postprocesamiento usa cURL para la transferencia de datos, una biblioteca compatible con una amplia gama de servidores SFTP.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de 2-30 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_TITLE="Subir al servidor SFTP (SSH) remoto usando cURL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_DESCRIPTION="Sube el archivo de copia de seguridad a un servidor SFTP (SSH) remoto. Se trata de una transferencia de archivos sobre SSH que usa un protocolo llamado SFTP, que es <em>completamente diferente</em> a FTP y FTPS.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de 2-30 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_TITLE="Subir al servidor SFTP (SSH) remoto"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_DESCRIPTION="Sube el archivo de copia de seguridad a SugarSync.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de 2-30 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_TITLE="Subir a SugarSync"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SWIFT_TITLE="Subir al almacenamiento de objetos OpenStack Swift"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_DESCRIPTION="Sube el archivo de copia de seguridad a cualquier servicio de almacenamiento compatible con el protocolo WebDAV.<br/><strong>¡Recuerde establecer un tamaño de parte dividida de 2-30 Mb o arriesga un fallo en la copia de seguridad debido a tiempos de espera agotados!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_TITLE="Subir mediante WebDAV"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_DESCRIPTION="Un analizador de archivos optimizado para realizar copias de seguridad de sitios con directorios que contienen cientos de archivos (p. ej., blogs y portales de noticias)"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_TITLE="Analizador para sitios grandes"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_DESCRIPTION="Equilibra de forma inteligente la velocidad de análisis y la evitación de tiempos de espera agotados"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_TITLE="Analizador inteligente"
COM_AKEEBA_CONFIG_ERR_DECRYPTION="No se pudieron descifrar los ajustes. Su servidor no es compatible con el cifrado de ajustes o el archivo de clave de cifrado ha sido modificado o eliminado."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_DESCRIPTION="Si está marcado, el volcado de la base de datos se realizará con instrucciones INSERT extendidas, es decir, una sola instrucción para restaurar múltiples filas de datos. Se recomienda encarecidamente mantener esta opción habilitada, ya que acelera el proceso de restauración y permite superar los límites de cuota de consultas en servidores restrictivos."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_TITLE="Generar INSERTs extendidos"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_DESC="Enviar correo electrónico a esta dirección (déjelo en blanco para deshabilitar esta función)"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_LABEL="Dirección de correo electrónico"
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_DESC="Déjelo en blanco para usar el predeterminado. Puede usar todas las variables de Solo que puede usar para nombrar los archivos de copia de seguridad, p. ej. [HOST] y [DATE]."
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_LABEL="Cuerpo del correo electrónico"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_DESC="Déjelo en blanco para usar el predeterminado. Puede usar todas las variables de Solo que puede usar para nombrar los archivos de copia de seguridad, p. ej. [HOST] y [DATE]"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_LABEL="Asunto del correo electrónico"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_DESC="Una copia de seguridad se considerará bloqueada (fallida) tras este número de segundos de inactividad.<br/><strong>¡NO MODIFIQUE ESTE VALOR A MENOS QUE SEPA LO QUE ESTÁ HACIENDO!</strong>"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_LABEL="Tiempo de espera por copia de seguridad bloqueada"
COM_AKEEBA_CONFIG_FEEMAILBODY_DESC="Déjelo en blanco para usar el predeterminado. Puede usar todas las variables de Akeeba Backup que puede usar para nombrar los archivos de copia de seguridad, p. ej. [HOST] y [DATE]. También puede usar [PROFILENUMBER] para el número del perfil actual, [PROFILENAME] para el nombre del perfil actual, [PARTCOUNT] para el número total de partes del archivo de copia de seguridad generado, [FILELIST] para una lista de las partes del archivo de copia de seguridad y [REMOTESTATUS] para una indicación de si la subida al almacenamiento remoto se completó correctamente."
COM_AKEEBA_CONFIG_FEEMAILBODY_LABEL="Cuerpo del correo electrónico"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_DESC="Déjelo en blanco para usar el predeterminado. Puede usar todas las variables de Akeeba Backup que puede usar para nombrar los archivos de copia de seguridad, p. ej. [HOST] y [DATE]"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_LABEL="Asunto del correo electrónico"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT="Usar la zona horaria del servidor"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULTGROUP="Predefinidas"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT_WORDPRESS="Usar la zona horaria de WordPress"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DESC="La fecha y hora de la copia de seguridad —tal como se registran en el nombre del archivo, la descripción predeterminada y los correos electrónicos— se expresarán en esta zona horaria. Esta opción afecta a todos los orígenes de copia de seguridad, es decir, a todas las copias de seguridad, independientemente de cómo se realicen (a través de Akeeba Backup, la API JSON remota, etc.)."
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_LABEL="Zona horaria de la copia de seguridad"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_WP_DESC="La fecha y hora de la copia de seguridad —tal como se registran en el nombre del archivo, la descripción predeterminada y los correos electrónicos— se expresarán en esta zona horaria. Esta opción afecta a todos los orígenes de copia de seguridad, es decir, a todas las copias de seguridad, independientemente de cómo se realicen (a través de Akeeba Backup, la API JSON remota, etc.).<br>Tenga en cuenta que la opción «Usar la zona horaria de WordPress» NO funcionará correctamente cuando realice copias de seguridad usando: a. la URL de copia de seguridad de interfaz pública heredada o la API JSON de Akeeba Backup si usa las URL de punto de conexión antiguas (que usaban index.php o remote.php en lugar de wp-cron.php); y b. los scripts de copia de seguridad por CLI (<em>no</em> WP-CLI). En estos casos, la copia de seguridad se ejecuta técnicamente fuera de WordPress, por lo que no existe una «zona horaria de WordPress»; en consecuencia, la copia de seguridad usará la zona horaria GMT. Por este motivo, se recomienda encarecidamente establecer esta opción en su zona horaria local."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_DESC="Enviar un correo electrónico de notificación tras realizar una copia de seguridad con la función de copia de seguridad de interfaz pública (API heredada) o API JSON."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_LABEL="Correo electrónico al completar la copia de seguridad"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_ALWAYS="Siempre"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_DESC="¿Cuándo se debe enviar el correo electrónico al completar la copia de seguridad? «Siempre» significa cada vez que se complete una copia de seguridad. «Subida fallida» significa que el correo electrónico solo se envía si la copia de seguridad está completa pero la subida al almacenamiento remoto no se completó correctamente. Si la copia de seguridad falla, esta función no puede enviar ningún correo electrónico; consulte la página Programar copias de seguridad automáticas para obtener información sobre cómo recibir correos electrónicos sobre copias de seguridad fallidas."
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_FAILEDUPLOAD="Subida fallida"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_LABEL="Cuándo enviar el correo electrónico"
COM_AKEEBA_CONFIG_FTPTEST_BADPREFIX="NO debe añadir el prefijo ftp:// al nombre de host FTP. Por favor, elimine el prefijo ftp:// y vuelva a intentarlo."
COM_AKEEBA_CONFIG_FTPTEST_NOUPLOAD="Akeeba Backup pudo conectarse a su servidor, pero no pudo subir un archivo de prueba. Es posible que la subida de la copia de seguridad falle."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_DESCRIPTION="Se rellena automáticamente al completar el paso 1 de autenticación anterior. Si va a vincular otro sitio a la misma cuenta de Google Drive, NO copie el token de acceso y NO ejecute la autenticación. En su lugar, simplemente copie el token de actualización del sitio anterior a este."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_TITLE="Token de acceso"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_DESCRIPTION="El directorio dentro de Google Drive donde se almacenarán los archivos de copia de seguridad. Use barras diagonales. Correcto: some/thing. Incorrecto: some\thing. Una sola barra diagonal significa que los archivos se almacenarán en la raíz de la unidad. LEA LA DOCUMENTACIÓN: ¡Las rutas en Google Drive son ambiguas!"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTEAMDRIVES_TITLE="Recargar la lista de unidades"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTOKEN_TITLE="Token de actualización"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_DESCRIPTION="La unidad de Google Drive en la que desea almacenar sus archivos. Debe completar la autenticación antes de que se rellene esta lista. Solo tiene sentido si tiene acceso a Google Team Drives (p. ej., usuarios de G Suite de nivel empresarial o corporativo). Si no está seguro, use la opción «Google Drive (personal)»."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_OPT_PERSONAL="Google Drive (personal)"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_TITLE="Unidad"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_TITLE="Subir a carpetas «Compartido conmigo»"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_DESCRIPTION="Cuando está habilitado, Akeeba Backup buscará carpetas en la colección «Compartido conmigo» antes de buscar una carpeta con el mismo nombre en su unidad. Esto es mucho más lento y puede dar lugar a que los archivos se suban a la carpeta incorrecta si existen varias carpetas compartidas con el mismo nombre en su cuenta de Google Drive."
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_DESCRIPTION="Su clave de acceso de Google Storage, disponible en la herramienta de gestión de claves de Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_TITLE="Clave de acceso"
COM_AKEEBA_CONFIG_GOOGLESTORAGEBUCKET_DESCRIPTION="El nombre de su contenedor de Google Storage. Asegúrese de escribirlo exactamente como aparece en la aplicación web del navegador de Google Cloud Storage (https://sandbox.google.com/storage)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEBUCKET_TITLE="Contenedor"
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_DESCRIPTION="El directorio dentro de su contenedor donde se almacenarán los archivos de copia de seguridad. Déjelo en blanco para almacenar los archivos en el directorio raíz del contenedor."
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_DESC="Pegue aquí el contenido del archivo de credenciales JSON que Google Cloud Console generó al configurar la cuenta de servicio para el software de copia de seguridad. Recuerde incluir las llaves al principio y al final del texto."
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_TITLE="Contenido de googlestorage.json (lea la documentación)"
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_DESCRIPTION="Si está habilitado, Akeeba Backup intentará convertir el nombre del contenedor a minúsculas, es decir, MiContenedor se convertirá en micontenedor. Si ha creado un contenedor con letras mayúsculas, por ejemplo, MiNuevoContenedor, desmarque esta opción y asegúrese de que el nombre del contenedor esté escrito exactamente como aparece en la aplicación web del navegador de Google Cloud Storage (https://sandbox.google.com/storage)."
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_TITLE="Nombre del contenedor en minúsculas"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_DESCRIPTION="Su clave secreta de Google Storage, disponible en la herramienta de gestión de claves de Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_TITLE="Clave secreta"
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_DESCRIPTION="Si está habilitado, se utilizará una conexión segura (HTTPS) al subir sus archivos. Aunque aumenta la seguridad de los datos transferidos, también incrementa la posibilidad de que la copia de seguridad falle por tiempo de espera agotado."
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_TITLE="Usar SSL"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_COLDLINE="Almacenamiento Coldline"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_DESCRIPTION="Cambia la clase de almacenamiento de los archivos de copia de seguridad subidos. «Ninguno» significa que los archivos se almacenarán con la clase de almacenamiento predeterminada especificada en su contenedor. Tenga en cuenta que las opciones distintas de Standard pueden ser más baratas para almacenar, pero pueden generar cargos adicionales si los descarga o elimina. Consulte a Google para obtener información sobre precios."
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NEARLINE="Almacenamiento Nearline"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NONE="Ninguno (dejar que el contenedor decida)"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_STANDARD="Almacenamiento Standard"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_TITLE="Clase de almacenamiento"
COM_AKEEBA_CONFIG_HEADER_BASIC="Configuración básica"
COM_AKEEBA_CONFIG_HEADER_CONFWIZ="¿Desea que Akeeba Backup se configure automáticamente?"
COM_AKEEBA_CONFIG_HEADER_OPTIONALFILTERS="Filtros opcionales"
COM_AKEEBA_CONFIG_HEADER_QUOTA="Gestión de cuotas"
COM_AKEEBA_CONFIG_HEADER_TUNING="Ajuste fino"
COM_AKEEBA_CONFIG_INSTALLER_DESCRIPTION="Al realizar una copia de seguridad completa del sitio, Akeeba Backup incrusta el script de restauración definido aquí en el archivo comprimido. Esto permite restaurar su sitio desde cero, sin necesidad de instalar su CMS ni Akeeba Backup, incluso cuando su sitio o servidor esté completamente destruido."
COM_AKEEBA_CONFIG_INSTALLER_TITLE="Script de restauración incrustado"
COM_AKEEBA_CONFIG_JPS_KEY_DESCRIPTION="Esta clave se utilizará para cifrar el contenido de su archivo comprimido. La clave distingue entre mayúsculas y minúsculas, es decir, ABC, abc y Abc son tres contraseñas diferentes. ¡Guarde una copia de la contraseña en un lugar seguro! Si la pierde, no hay forma de recuperarla."
COM_AKEEBA_CONFIG_JPS_KEY_TITLE="Clave de cifrado"
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_DESCRIPTION="Cuando está habilitado (predeterminado), su contraseña se expande a una clave criptográfica utilizada en todo el archivo comprimido. Esto es rápido, pero en el caso extremadamente improbable de que un atacante con abundantes recursos logre realizar ingeniería inversa de la clave criptográfica a partir de un bloque cifrado del archivo —sin realizar fuerza bruta sobre la contraseña en sí—, podría descifrar todo el archivo de copia de seguridad. Cuando está deshabilitado, se derivará una clave criptográfica diferente de su contraseña en cada bloque cifrado, lo que es MUCHO más lento, pero le protege contra este tipo de ataque, ya que obliga al atacante a realizar fuerza bruta sobre la contraseña, lo cual es mucho más lento."
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_TITLE="Expansión de clave para todo el archivo"
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_DESC="La API JSON de Akeeba Backup le permite realizar y gestionar copias de seguridad, así como administrar las opciones de Akeeba Backup de forma remota. Debe habilitar esta opción si planea realizar, descargar o gestionar copias de seguridad, por ejemplo con Akeeba Remote CLI, Akeeba UNiTE y servicios de programación de copias de seguridad.<br><br><strong>Nota de seguridad:</strong> la API JSON se autentica únicamente con la Clave secreta. No interviene ninguna cuenta de usuario, por lo que no se aplica ninguno de los permisos que establece en el Gestor de usuarios: su portador obtiene todos los métodos de la API, sin límite alguno. Puede leer, crear, descargar y eliminar copias de seguridad y cambiar cualquier opción, lo que en la práctica equivale a poseer su contraseña de administrador. Habilítela solo cuando realmente la necesite y use una Clave secreta larga y aleatoria."
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_LABEL="Habilitar la API JSON (copia de seguridad remota)"
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_DESCRIPTION="Cuando un directorio contiene más archivos o directorios que este número, se considera «grande». Por lo tanto, Akeeba Backup intentará volver a analizarlo en el siguiente paso para evitar tiempos de espera agotados en la copia de seguridad. Un valor demasiado pequeño ralentizará considerablemente la copia de seguridad. Auméntelo —a menos que obtenga errores de tiempo de espera agotado— para acelerar la copia de seguridad."
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_TITLE="Umbral de directorio grande"
COM_AKEEBA_CONFIG_LARGEFILE_DESCRIPTION="Los archivos más grandes que este umbral se empaquetarán en su propio paso para evitar la posibilidad de un tiempo de espera agotado. Los valores entre 2 y 10 MB funcionan mejor en la mayoría de los servidores."
COM_AKEEBA_CONFIG_LARGEFILE_TITLE="Umbral de archivo grande"
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_DESCRIPTION="Cuántos directorios se analizan en cada paso. Configuración recomendada: 50. Los valores más altos hacen que la copia de seguridad sea marginalmente más rápida, pero con mayor probabilidad de que se agote el tiempo de espera."
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_TITLE="Tamaño de lote para el análisis de directorios"
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_DESCRIPTION="Cuántos archivos se analizan y comprimen en cada paso. Configuración recomendada: 100. Los valores más altos hacen que la copia de seguridad sea marginalmente más rápida, pero con mayor probabilidad de que se agote el tiempo de espera o de que se quede sin memoria."
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_TITLE="Tamaño de lote para el análisis de archivos"
COM_AKEEBA_CONFIG_LBL_CONFWIZ_AFTER="Una vez que Akeeba Backup haya terminado de configurarse, podrá realizar una copia de seguridad o ajustar su configuración manualmente."
COM_AKEEBA_CONFIG_LBL_CONFWIZ_INTRO="Parece que aún no ha configurado Akeeba Backup. Haga clic en el botón Asistente de configuración que aparece a continuación para permitir que se configure automáticamente."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_DESC="La API de copia de seguridad de interfaz pública (heredada) le permite realizar copias de seguridad programadas mediante herramientas de acceso por URL como wget o curl. Debe habilitar esta opción si tiene previsto realizar copias de seguridad con el servidor CRON de su alojamiento usando wget o curl, o si tiene previsto usar un servicio CRON de terceros como WebCRON.org. Siempre que sea posible, recomendamos usar el script CRON nativo de CLI o la API JSON de Akeeba Backup, ya que son opciones mucho más seguras."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_LABEL="Habilitar la API de copia de seguridad de interfaz pública (tareas CRON remotas)"
COM_AKEEBA_CONFIG_LOGLEVEL_DEBUG="Toda la información y depuración"
COM_AKEEBA_CONFIG_LOGLEVEL_DESCRIPTION="Esta opción determina el nivel de detalle del registro de copia de seguridad."
COM_AKEEBA_CONFIG_LOGLEVEL_ERROR="Solo errores"
COM_AKEEBA_CONFIG_LOGLEVEL_INFO="Toda la información"
COM_AKEEBA_CONFIG_LOGLEVEL_NONE="Ninguno"
COM_AKEEBA_CONFIG_LOGLEVEL_TITLE="Nivel de registro"
COM_AKEEBA_CONFIG_LOGLEVEL_WARNING="Errores y advertencias"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_DESCRIPTION="Elimina automáticamente las copias de seguridad antiguas según el día en que se realizaron. ADVERTENCIA: AL HABILITAR ESTA OPCIÓN, SE IGNORARÁN TODOS LOS DEMÁS AJUSTES DE CUOTA (NÚMERO Y TAMAÑO)."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_TITLE="Habilitar cuotas por antigüedad máxima de la copia de seguridad"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_DESCRIPTION="Las copias de seguridad realizadas en este día del mes no se eliminarán. Deje la configuración predeterminada, 1, para conservar siempre las copias de seguridad realizadas el día 1 del mes."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_TITLE="No eliminar las copias de seguridad realizadas en este día del mes"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_DESCRIPTION="Las copias de seguridad con más días de antigüedad que este número se eliminarán automáticamente. Deje la configuración predeterminada, 31, para conservar todas las copias de seguridad del último mes."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_TITLE="Antigüedad máxima de la copia de seguridad (días)"
COM_AKEEBA_CONFIG_MAXEXECTIME_DESCRIPTION="Cada paso de Akeeba Backup durará <i>como máximo</i> el tiempo definido aquí. Use un valor inferior al tiempo máximo de ejecución de PHP. Generalmente, configurarlo en 10 segundos es suficiente, salvo en servidores muy restrictivos.<b>Consejo</b>: Seleccione Personalizado e introduzca el valor deseado si no aparece en la lista."
COM_AKEEBA_CONFIG_MAXEXECTIME_TITLE="Tiempo máximo de ejecución"
COM_AKEEBA_CONFIG_MAXPACKET_DESCRIPTION="El tamaño máximo, en bytes, de cada instrucción INSERT extendida. Se recomienda mantenerlo suficientemente bajo para que MySQL no genere un error al restaurar el volcado de la base de datos."
COM_AKEEBA_CONFIG_MAXPACKET_TITLE="Tamaño máximo de paquete para INSERT extendidos"
COM_AKEEBA_CONFIG_MINEXECTIME_DESCRIPTION="Cada paso de Akeeba Backup durará <i>al menos</i> el tiempo definido aquí. Esto es necesario para evitar soluciones de seguridad anti-DoS. Si obtiene errores 403 Forbidden o errores AJAX, aumente este valor. Configurarlo en 0 deshabilita esta función.<br/><br/><b>Consejo</b>: Seleccione Personalizado e introduzca el valor deseado si no aparece en la lista."
COM_AKEEBA_CONFIG_MINEXECTIME_TITLE="Tiempo mínimo de ejecución"
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_DESCRIPTION="Cuando está habilitado, Akeeba Backup intentará volcar estas entidades avanzadas de base de datos MySQL 5. Si la copia de seguridad se bloquea durante la fase de copia de seguridad, es posible que deba deshabilitar esta opción."
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_TITLE="Volcar PROCEDUREs, FUNCTIONs y TRIGGERs"
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TIP="Elimina USING BTREE y USING HASH de las definiciones de índices de tablas en los archivos de volcado. Esto es necesario para restaurar en servidores que tienen alguno de los motores de indexación desactivado (p. ej., en las versiones más recientes de XAMPP). ¡ADVERTENCIA! ESTO PUEDE CAUSAR PROBLEMAS DE RESTAURACIÓN EN ALGUNOS SERVIDORES."
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TITLE="Omitir motor de índice"
COM_AKEEBA_CONFIG_NODEPENDENCIES_DESCRIPTION="Cuando está habilitado, Akeeba Backup no realizará el seguimiento de dependencias entre tablas y vistas. Utilice esta opción solo cuando tenga cientos de tablas de base de datos y no esté usando VIEWs, FUNCTIONs, PROCEDUREs, TRIGGERs de MySQL, ni tablas que usen los motores (extremadamente poco frecuentes) TEMPORARY, MEMORY, MERGE o FEDERATED."
COM_AKEEBA_CONFIG_NODEPENDENCIES_TITLE="Sin seguimiento de dependencias"
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_DESCRIPTION="Número total de registros obsoletos (copias de seguridad cuyos archivos han sido eliminados) que se conservarán en la página Gestionar copias de seguridad. Establézcalo en 0 para no tener límite."
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_TITLE="Registros obsoletos a conservar"
COM_AKEEBA_CONFIG_LOGFILES_TITLE="Eliminar archivos de registro obsoletos"
COM_AKEEBA_CONFIG_LOGFILES_DESCRIPTION="Elimina automáticamente los archivos de registro de los registros de copia de seguridad correctos. El archivo de registro del último registro de copia de seguridad participa en los cálculos pero nunca se elimina. Si su perfil de copia de seguridad tiene un motor de postprocesamiento distinto de Ninguno o Enviar por correo electrónico, solo los registros con estado de copia de seguridad remota participan en esta cuota de archivos de registro. Si su perfil de copia de seguridad usa el motor de postprocesamiento Ninguno o Enviar por correo electrónico, solo los registros con estado Correcto o de copia de seguridad remota participan en esta cuota. Esta función se ejecuta después de la cuota de registros obsoletos; la cuota de registros obsoletos también puede eliminar archivos de registro antiguos."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_TITLE="Tipo de cuota de archivos de registro obsoletos"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DESCRIPTION="Elija el método utilizado para determinar qué archivos de registro antiguos eliminar."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_SIZE="Tamaño máximo"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_COUNT="Número"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DAYS="Antigüedad máxima"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_TITLE="Número de archivos de registro"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_DESCRIPTION="Cuántos archivos de registro se conservarán. El archivo de registro de la última copia de seguridad realizada puede participar en el recuento, pero nunca se eliminará. Solo se considerarán para su eliminación los archivos de registro de los registros de copia de seguridad correctos."
COM_AKEEBA_CONFIG_LOGFILES_SIZE_TITLE="Tamaño de los archivos de registro (megabytes)"
COM_AKEEBA_CONFIG_LOGFILES_SIZE_DESCRIPTION="El tamaño total máximo de los archivos de registro a conservar. El archivo de registro de la última copia de seguridad realizada puede participar en el cálculo, pero nunca se eliminará. Solo se considerarán para su eliminación los archivos de registro de los registros de copia de seguridad correctos."
COM_AKEEBA_CONFIG_LOGFILES_DAYS_TITLE="Antigüedad de los archivos de registro (días)"
COM_AKEEBA_CONFIG_LOGFILES_DAYS_DESCRIPTION="La antigüedad máxima en días de los archivos de registro que se conservarán. El archivo de registro de la última copia de seguridad realizada nunca se eliminará. Solo se considerarán para su eliminación los archivos de registro de registros de copia de seguridad correctos."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_DESCRIPTION="Se rellena automáticamente al completar el paso 1 de autenticación anterior. NO comparta el mismo token en varios sitios. En su lugar, autentique cada sitio por separado."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_TITLE="Token de acceso"
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_DESCRIPTION="El directorio dentro de la unidad de Microsoft OneDrive donde se almacenarán los archivos de copia de seguridad. Use barras diagonales, no barras invertidas, y coloque siempre una barra diagonal al principio. Correcto: /algo/directorio. Incorrecto: algo\directorio. Una sola barra diagonal indica que los archivos se almacenarán en la raíz de la unidad."
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_DESCRIPTION="Elija qué unidad (OneDrive personal, OneDrive para empresas o SharePoint) a la que tiene acceso su cuenta se utilizará para almacenar las copias de seguridad. Debe completar la autenticación antes de que se rellene esta lista. Solo tiene sentido si tiene acceso a más de una unidad de OneDrive (p. ej., su cuenta de Microsoft forma parte de la suscripción de una organización). Si no está seguro, use la opción «Unidad predeterminada», que usa su unidad personal predeterminada (normalmente equivalente a la primera opción «Unidad (OneDrive personal)» que aparece a continuación)."
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_OPT_PERSONAL="Unidad predeterminada"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_TITLE="Unidad"
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_DESCRIPTION="Se rellena automáticamente al completar el paso 1 de autenticación anterior. NO comparta el mismo token en varios sitios. En su lugar, autentique cada sitio por separado."
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_TITLE="Token de actualización"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_DESCRIPTION="Este filtro solo se aplica si intenta hacer una copia de seguridad de una instalación de Joomla!, por ejemplo, un sitio Joomla! en un subdirectorio o subdominio de su sitio. En Joomla! 3.9 y versiones posteriores, las acciones de los usuarios se registran en la base de datos, creando una tabla con millones de filas que ralentiza la copia de seguridad. Active esta opción para excluir dichos datos."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_TITLE="Registro de acciones de usuarios de Joomla!"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_DESCRIPTION="Cuando está habilitado, solo se incluirán en la copia de seguridad los archivos modificados después de una fecha y hora específicas."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_TITLE="Filtro condicional por fecha"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_DESCRIPTION="Akeeba Backup hará copia de seguridad de los archivos modificados después de esta fecha y hora. El formato es AAAA-MM-DD hh:mm:ss. Todas las fechas y horas se expresan en la zona horaria de su servidor."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_TITLE="Hacer copia de seguridad de archivos modificados después de"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_DESCRIPTION="Excluir automáticamente los archivos de registro de errores, p. ej. <code>error_log</code>, independientemente de dónde se encuentren en el sitio del que se hace la copia de seguridad. Estos archivos cambian de tamaño mientras la copia de seguridad está en curso, lo que puede generar copias de seguridad corruptas."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_TITLE="Excluir registros de errores"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_DESCRIPTION="Cuando está habilitado, Akeeba Backup excluirá automáticamente las carpetas más comunes específicas del servidor de alojamiento utilizadas para almacenar estadísticas de acceso a su sitio. Estas carpetas son de solo lectura para el usuario web de su sitio, lo que puede causar problemas durante la restauración si se incluyen en la copia de seguridad."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_TITLE="Excluir carpetas de estadísticas específicas del servidor"
COM_AKEEBA_CONFIG_OUTDIR_DESCRIPTION="Este es el directorio de su servidor donde Akeeba Backup almacenará los archivos de copia de seguridad y el archivo de registro. Puede usar las siguientes macros:<ul><li><b>[DEFAULT_OUTPUT]</b> El directorio de salida predeterminado</li><li><b>[SITEROOT]</b> El directorio raíz de su sitio</li><li><b>[ROOTPARENT]</b> Un directorio por encima del directorio raíz de su sitio</li></ul>"
COM_AKEEBA_CONFIG_OUTDIR_TITLE="Directorio de salida"
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_DESCRIPTION="¡ESTO NO ES EL NOMBRE DEL CONTENEDOR DE ALMACENAMIENTO! Acceda al administrador de la nube de OVH, Servidores, expanda su servidor y haga clic en Almacenamiento. Verá la URL del contenedor indicada allí, encima de la lista de sus archivos. Cópiela aquí."
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_TITLE="URL del contenedor"
COM_AKEEBA_CONFIG_OVH_DIRECTORY_DESCRIPTION="El directorio dentro del contenedor de almacenamiento de objetos de OVH donde se almacenarán los archivos de copia de seguridad. Para almacenar todo en la raíz del contenedor, déjelo en blanco."
COM_AKEEBA_CONFIG_OVH_DIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_OVH_PASSWORD_DESCRIPTION="¡ESTA NO ES SU CONTRASEÑA DE ACCESO A OVH! Cree un usuario desde el administrador de la nube de OVH, Servidores, expanda su servidor, haga clic en OpenStack y luego en Añadir usuario. Copie aquí la contraseña del usuario creado."
COM_AKEEBA_CONFIG_OVH_PASSWORD_TITLE="Contraseña de OpenStack"
COM_AKEEBA_CONFIG_OVH_PROJECTID_DESCRIPTION="El ID de proyecto de su servidor en la nube de OVH. En el administrador de la nube de OVH, expanda su servidor y haga clic en el enlace Almacenamiento. En el área principal de la página verá el nombre del servidor y, justo debajo, una cadena alfanumérica de 32 caracteres como a0b1c2d3e4f56789abcdef0123456789. Este es el ID de proyecto que debe introducir aquí."
COM_AKEEBA_CONFIG_OVH_PROJECTID_TITLE="ID de proyecto"
COM_AKEEBA_CONFIG_OVH_USERNAME_DESCRIPTION="¡ESTE NO ES SU NOMBRE DE USUARIO DE ACCESO A OVH! Cree un usuario desde el administrador de la nube de OVH, Servidores, expanda su servidor, haga clic en OpenStack y luego en Añadir usuario. Copie aquí el ID del usuario creado."
COM_AKEEBA_CONFIG_OVH_USERNAME_TITLE="Nombre de usuario de OpenStack"
COM_AKEEBA_CONFIG_PARTSIZE_DESCRIPTION="Akeeba Backup puede crear archivos divididos (multipartes) para evitar restricciones de tamaño en diversas circunstancias. Esta opción define el tamaño máximo de cada parte del archivo. Si lo reduce a 0, la función multipartes queda deshabilitada.</br><b>Importante:</b>Si utiliza un motor de procesamiento de datos que transfiere archivos a una ubicación remota (p. ej., almacenamiento en la nube), use un valor de entre 1 y 5 Mb para obtener resultados óptimos."
COM_AKEEBA_CONFIG_PARTSIZE_TITLE="Tamaño de parte para archivos divididos"
COM_AKEEBA_CONFIG_PERMISSIONS_0600="0600 – Seguridad estricta. Puede causar problemas en servidores de gama baja"
COM_AKEEBA_CONFIG_PERMISSIONS_0644="0644 – Seguridad media, para uso en servidores de un solo sitio"
COM_AKEEBA_CONFIG_PERMISSIONS_0666="0666 – Seguridad relajada, máxima compatibilidad con alojamientos comerciales"
COM_AKEEBA_CONFIG_PERMISSIONS_DESCRIPTION="Configure los permisos de archivo para los archivos de copia de seguridad. Solo se aplica en Linux, macOS, BSD y otros sistemas tipo UNIX (NO en Windows). Si no está seguro, déjelo en 0666. Cambiarlo puede imposibilitar la descarga y/o eliminación de archivos de copia de seguridad mediante FTP y SFTP. Si su servidor usa PHP-FPM o ejecuta PHP bajo el mismo usuario que la cuenta del sistema de su sitio, use 0600 para mayor seguridad."
COM_AKEEBA_CONFIG_PERMISSIONS_TITLE="Permisos del archivo comprimido"
COM_AKEEBA_CONFIG_PGDUMP_PATH_DESCRIPTION="La ruta absoluta en el sistema de archivos a la herramienta de línea de comandos pg_dump en su servidor. Si se deja vacía, Akeeba Backup intentará detectarla automáticamente."
COM_AKEEBA_CONFIG_PGDUMP_PATH_TITLE="Ruta a pg_dump"
COM_AKEEBA_CONFIG_PLATFORM="Anulaciones del sitio"
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_DESCRIPTION="Si está habilitado, Akeeba Backup intentará conectarse a su servidor FTP mediante una conexión cifrada con SSL. <strong>¡Esto no es lo mismo que SFTP, SCP o «FTP seguro»!</strong> Tenga en cuenta que si su servidor no admite este método, obtendrá errores de conexión."
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_TITLE="Usar FTP sobre SSL (FTPS)"
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_DESCRIPTION="Nombre de host del servidor FTP, sin el protocolo. Esto significa que <tt>ftp://example.com</tt> es <b>inválido</b> y <tt>example.com</tt> es válido. Este motor solo admite servidores FTP y FTPS. <u>No</u> admite SFTP, SCP ni otras variantes de SSH."
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_TITLE="Nombre de host"
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_DESCRIPTION="La ruta <b>FTP</b> absoluta al directorio donde se subirán los archivos. Si no está seguro, conéctese a su servidor con FileZilla, navegue hasta el directorio deseado y copie la ruta que aparece en el panel derecho encima de la lista de directorios. Suele ser algo breve, como <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_TITLE="Directorio inicial"
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_DESCRIPTION="La ruta relativa al directorio inicial; se creará si no existe. Déjelo vacío para subir los archivos directamente dentro del directorio inicial. Puede usar las siguientes macros:<ul><li><b>[HOST]</b> El nombre de host. ATENCIÓN: Esta etiqueta no funciona en modo CRON.</li><li><b>[DATE]</b> Fecha actual</li><li><b>[TIME]</b> Hora actual</li></ul>Hay más disponibles; consulte la documentación."
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_TITLE="Subdirectorio"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_DESCRIPTION="Usar el modo pasivo de FTP al transferir datos. Esta opción está habilitada de forma predeterminada, ya que es el único método que funciona a través de los cortafuegos instalados habitualmente en los servidores web. No la desactive a menos que esté seguro de que su servidor web no está detrás de un cortafuegos y que su servidor FTP requiere absolutamente el modo activo de transferencia de archivos."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_TITLE="Usar modo pasivo"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_DESCRIPTION="Contraseña del servidor FTP. Generalmente distingue entre mayúsculas y minúsculas. Si no está seguro, póngase en contacto con su administrador de red."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_TITLE="Contraseña"
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_DESCRIPTION="Puerto del servidor FTP. El valor más habitual es 21. Si no está seguro, póngase en contacto con su administrador de red."
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_TITLE="Puerto"
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_DESCRIPTION="Use este botón para probar la conexión FTP y ver los errores de conexión en caso de fallo."
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_TITLE="Probar conexión FTP"
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_DESCRIPTION="Nombre de usuario del servidor FTP. Generalmente distingue entre mayúsculas y minúsculas. Si no está seguro, póngase en contacto con su administrador de red."
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_TITLE="Nombre de usuario"
COM_AKEEBA_CONFIG_POSTPROCPARTS_DESCRIPTION="Cuando está habilitado, Akeeba Backup ejecutará el motor de postprocesamiento sobre cada parte en cuanto esté completa. Cuando está deshabilitado, Akeeba Backup ejecutará el postprocesamiento de todas las partes al final del proceso de copia de seguridad."
COM_AKEEBA_CONFIG_POSTPROCPARTS_TITLE="Procesar cada parte inmediatamente"
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_DESCRIPTION="Nombre de host del servidor SFTP, sin el protocolo. Esto significa que <tt>sftp://example.com</tt> o <tt>ssh://example.com</tt> son <b>inválidos</b> y NO deben usarse, pero <tt>example.com</tt> es válido y DEBE usarse. Este motor solo admite servidores SFTP (SSH). <u>No</u> admite FTP, FTPS ni ninguna otra variante de FTP. Requiere que la extensión PHP SSH2 esté instalada y habilitada."
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_TITLE="Nombre de host"
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_DESCRIPTION="La ruta <b>SFTP</b> absoluta (generalmente la misma que la ruta del sistema de archivos) al directorio donde se subirán los archivos. Si no está seguro, conéctese a su servidor con FileZilla, navegue hasta el directorio deseado y copie la ruta que aparece en el panel derecho encima de la lista de directorios. Suele ser algo largo, como <tt>/home/miusuario/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_TITLE="Directorio inicial"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_DESCRIPTION="Contraseña del servidor SFTP. Generalmente distingue entre mayúsculas y minúsculas. Si no está seguro, póngase en contacto con su administrador de red."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_TITLE="Contraseña"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_DESCRIPTION="Puerto del servidor SFTP. El valor más habitual es 22. Si no está seguro, póngase en contacto con su administrador de red."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_TITLE="Puerto"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_DESCRIPTION="LEA LA DOCUMENTACIÓN ANTES DE USAR. La ruta absoluta en el sistema de archivos a un archivo de clave privada RSA/DSA utilizado para conectarse al servidor remoto. Si está cifrada, introduzca la frase de contraseña en el campo de contraseña anterior. Si no sabe qué es esto, o si cree que necesita solicitar soporte al respecto, déjelo en blanco y no nos consulte sobre ello."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_TITLE="Archivo de clave privada (avanzado)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_DESCRIPTION="LEA LA DOCUMENTACIÓN ANTES DE USAR. La ruta absoluta en el sistema de archivos a un archivo de clave pública RSA/DSA utilizado para conectarse al servidor remoto. Si no sabe qué es esto, o si cree que necesita solicitar soporte al respecto, déjelo en blanco y no nos consulte sobre ello."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_TITLE="Archivo de clave pública (avanzado)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_DESCRIPTION="Use este botón para probar la conexión SFTP y ver los errores de conexión en caso de fallo."
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_TITLE="Probar conexión SFTP"
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_DESCRIPTION="Nombre de usuario del servidor SFTP. Generalmente distingue entre mayúsculas y minúsculas. Si no está seguro, póngase en contacto con su administrador de red."
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_TITLE="Nombre de usuario"
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_DESCRIPTION="Detiene inmediatamente el proceso de copia de seguridad, marcándolo como fallido, si se produce un error de subida. <strong>Esta opción puede ser engañosa y peligrosa.</strong> Es posible que disponga de una copia de seguridad completa y válida que simplemente no se haya subido total o parcialmente. Habilitar esta opción eliminará los archivos de copia de seguridad restantes de su servidor y dejará atrás cualquier archivo (parcialmente) subido al almacenamiento remoto. En otras palabras, quedará sin ninguna copia de seguridad operativa. Hay muy pocos casos de uso en que esto tenga más sentido que el comportamiento predeterminado, que le permite reanudar la subida del archivo de copia de seguridad desde la página Gestionar copias de seguridad. Por este motivo, recomendamos encarecidamente que esta opción solo sea habilitada por usuarios expertos que comprendan plenamente las implicaciones de hacerlo."
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_TITLE="Marcar la copia de seguridad como fallida si falla la subida"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_DESCRIPTION="La dirección de correo electrónico a la que se enviarán los archivos de copia de seguridad"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_TITLE="Dirección de correo electrónico"
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_DESCRIPTION="El asunto del correo electrónico (opcional). Esta opción está pensada principalmente para ayudarle a distinguir entre las copias de seguridad de varios sitios."
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_TITLE="Asunto del correo electrónico"
COM_AKEEBA_CONFIG_PROCENGINE_DESCRIPTION="Los motores de postprocesamiento permiten a Akeeba Backup transferir las partes finalizadas del archivo de copia de seguridad a otros servidores y proveedores de almacenamiento remoto."
COM_AKEEBA_CONFIG_PROCENGINE_TITLE="Motor de postprocesamiento"
COM_AKEEBA_CONFIG_PROXY_HOST_DESC="Si su sitio necesita conectarse a un servidor proxy para comunicarse con el exterior (proxy de salida), introduzca aquí el nombre de host o la dirección IP del proxy. Déjelo en blanco para no usar un proxy."
COM_AKEEBA_CONFIG_PROXY_HOST_LABEL="Nombre de host / Dirección IP del proxy"
COM_AKEEBA_CONFIG_PROXY_PASS_DESC="Si su servidor proxy requiere autenticación, introduzca aquí la contraseña de autenticación del proxy. No olvide introducir un nombre de usuario no vacío en la opción anterior."
COM_AKEEBA_CONFIG_PROXY_PASS_LABEL="Contraseña del proxy"
COM_AKEEBA_CONFIG_PROXY_PORT_DESC="Introduzca el puerto TCP/IP al que escucha el servidor proxy. Normalmente es 8080 o 3128. Si no está seguro, consulte a su proveedor de alojamiento o administrador de red."
COM_AKEEBA_CONFIG_PROXY_PORT_LABEL="Puerto del proxy"
COM_AKEEBA_CONFIG_PROXY_USER_DESC="Si su servidor proxy requiere autenticación, introduzca aquí el nombre de usuario de autenticación del proxy. Déjelo en blanco para usar un proxy que no requiera autenticación."
COM_AKEEBA_CONFIG_PROXY_USER_LABEL="Nombre de usuario del proxy"
COM_AKEEBA_CONFIG_PUSH_APIKEY_DESC="Vaya a https://www.pushbullet.com/account y copie el token de acceso de esa página en el cuadro de texto. Se utiliza para enviar notificaciones push a su cuenta. Puede pegar varios tokens separados por comas. Nota: el token de acceso es visible para todas las personas que tengan acceso a esta página de configuración."
COM_AKEEBA_CONFIG_PUSH_APIKEY_LABEL="Token de acceso de Pushbullet"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_DESC="¿Debe Akeeba Backup enviarle notificaciones y, en caso afirmativo, cómo?"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_LABEL="Notificaciones push"
COM_AKEEBA_CONFIG_QUICKICON_DESC="Cuando está activado, Akeeba Backup mostrará un icono de copia de seguridad con un clic en la parte superior de la página del Panel de control. Al hacer clic en él se activará este perfil y se realizará una copia de seguridad sin que sea necesaria ninguna acción adicional por su parte."
COM_AKEEBA_CONFIG_QUICKICON_LABEL="Icono de copia de seguridad con un clic"
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_DESCRIPTION="Cuando está habilitado, la copia de seguridad en curso participa en las cuotas de archivos remotos. Esto puede ser problemático: si la copia de seguridad se ha subido parcialmente al almacenamiento remoto y la configuración de cuotas es tal que solo se conserva la copia de seguridad más reciente, podría quedarse sin ninguna copia de seguridad válida almacenada de forma remota. Deshabilitarlo reducirá la probabilidad de quedarse sin una copia de seguridad válida en el almacenamiento remoto, a costa de almacenar un archivo de copia de seguridad adicional de forma remota."
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_TITLE="La copia de seguridad actual participa en las cuotas de archivos remotos"
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_DESCRIPTION="Cuando está habilitado, la configuración de cuotas que se indica a continuación se aplicará a los archivos almacenados en el almacenamiento remoto, como Amazon S3 o servidores FTP remotos."
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_TITLE="Habilitar cuotas de archivos remotos"
COM_AKEEBA_CONFIG_RUNTIMEBIAS_DESCRIPTION="Define cuán conservador será Akeeba Backup al intentar evitar un tiempo de espera agotado. Cuanto menor sea este valor, más conservador será. Si obtiene errores de tiempo de espera agotado, intente reducir tanto el tiempo máximo de ejecución como este ajuste.<b>Sugerencia</b>: seleccione «Personalizado» e introduzca el valor deseado si no aparece en la lista."
COM_AKEEBA_CONFIG_RUNTIMEBIAS_TITLE="Sesgo del tiempo de ejecución"
COM_AKEEBA_CONFIG_S3ACCESSKEY_DESCRIPTION="Su clave de acceso de Amazon S3, disponible en la página de su perfil personal de Amazon Web Services"
COM_AKEEBA_CONFIG_S3ACCESSKEY_TITLE="Clave de acceso"
COM_AKEEBA_CONFIG_S3BUCKET_DESCRIPTION="El nombre de su contenedor de Amazon S3"
COM_AKEEBA_CONFIG_S3BUCKET_TITLE="Contenedor"
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_DESCRIPTION="Para uso con servicios de almacenamiento de terceros que implementen una API compatible con S3. Introduzca el punto de conexión (URL de API) de la API compatible con S3 del servicio de almacenamiento de terceros. IMPORTANTE: si utiliza Amazon S3, <strong>DEBE DEJAR ESTO EN BLANCO</strong>."
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_TITLE="Punto de conexión personalizado"
COM_AKEEBA_CONFIG_S3DIRECTORY_DESCRIPTION="El directorio dentro de su contenedor donde se almacenarán los archivos de copia de seguridad. Déjelo en blanco para almacenar los archivos en la raíz del contenedor."
COM_AKEEBA_CONFIG_S3DIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_S3_ACL_TITLE="Permisos de archivo (ACL)"
COM_AKEEBA_CONFIG_S3_ACL_DESCRIPTION="Elija los permisos del archivo subido. En la mayoría de los casos, «Privado» o «El propietario del contenedor puede leer» son las opciones más adecuadas. Si utiliza un servicio compatible con S3 de terceros, puede que prefiera usar «Privado» en lugar de la configuración predeterminada."
COM_AKEEBA_CONFIG_S3_ACL_PRIVATE="Privado"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ="Cualquiera puede leer"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ_WRITE="Cualquiera puede leer y escribir"
COM_AKEEBA_CONFIG_S3_ACL_AUTHENTICATED_READ="Los usuarios IAM autenticados pueden leer"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_READ="El propietario del contenedor puede leer"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_FULL_CONTROL="El propietario del contenedor tiene control total"
COM_AKEEBA_CONFIG_S3LEGACY_DESCRIPTION="Cuando está habilitado, todas las subidas a Amazon S3 se forzarán a ser de una sola parte. Úselo si obtiene errores RequestTimeout del motor S3 al subir partes de la copia de seguridad."
COM_AKEEBA_CONFIG_S3LEGACY_TITLE="Deshabilitar las subidas multiparte"
COM_AKEEBA_CONFIG_S3RRS_DESCRIPTION="Seleccione la clase de almacenamiento para sus datos. Estándar es el almacenamiento normal para datos críticos del negocio. Consulte la documentación de Amazon S3 para obtener la descripción de cada clase de almacenamiento."
COM_AKEEBA_CONFIG_S3RRS_TITLE="Clase de almacenamiento"
COM_AKEEBA_CONFIG_S3SECRETKEY_DESCRIPTION="Su clave secreta de Amazon S3, disponible en la página de su perfil personal de Amazon Web Services"
COM_AKEEBA_CONFIG_S3SECRETKEY_TITLE="Clave secreta"
COM_AKEEBA_CONFIG_S3USESSL_DESCRIPTION="Si está habilitado, se usará una conexión segura (HTTPS) al subir sus archivos. Aunque aumenta la seguridad de los datos transferidos, también incrementa la posibilidad de que la copia de seguridad falle por tiempo de espera agotado."
COM_AKEEBA_CONFIG_S3USESSL_TITLE="Usar SSL"
COM_AKEEBA_CONFIG_S3_DUALSTACK_DESCRIPTION="¿Se deben usar los puntos de conexión de pila dual para Amazon S3? Esto permite acceder a S3 a través de IPv6 para los servidores que lo admitan. Los servidores sin soporte de IPv6 seguirán pudiendo acceder a S3 a través de IPv4. No tiene efecto si utiliza un punto de conexión personalizado."
COM_AKEEBA_CONFIG_S3_DUALSTACK_TITLE="Habilitar compatibilidad IPv6 (pila dual)"
COM_AKEEBA_CONFIG_S3_ALTERNATEDATEHEADERFORMAT_TITLE="Formato de fecha alternativo"
COM_AKEEBA_CONFIG_S3_ALTERNATEDATEHEADERFORMAT_DESCRIPTION="Solo deshabilite este ajuste si el equipo de soporte se lo indica."
COM_AKEEBA_CONFIG_S3_USEHTTPDATEHEADER_TITLE="Usar la cabecera HTTP Date en lugar de X-Amz-Date"
COM_AKEEBA_CONFIG_S3_USEHTTPDATEHEADER_DESCRIPTION="Solo habilite este ajuste si el equipo de soporte se lo indica."
COM_AKEEBA_CONFIG_S3_PRESIGNEDBUCKETINURL_TITLE="Incluir el nombre del contenedor en las URL prefirmadas v4"
COM_AKEEBA_CONFIG_S3_PRESIGNEDBUCKETINURL_DESCRIPTION="Solo habilite este ajuste si el equipo de soporte se lo indica."

COM_AKEEBA_CONFIG_SAVENEW_DEFAULT_PROFILE_NAME="Nuevo perfil de copia de seguridad"
COM_AKEEBA_CONFIG_SAVE_OK="La configuración se ha guardado"
COM_AKEEBA_CONFIG_SCANENGINE_DESCRIPTION="Define cómo Akeeba Backup analizará los archivos y carpetas de su sitio para determinar cuáles deben incluirse en la copia de seguridad."
COM_AKEEBA_CONFIG_SCANENGINE_TITLE="Motor de análisis del sistema de archivos"
COM_AKEEBA_CONFIG_SECRETWORD_DESC="Esta contraseña se utilizará con las funciones de Copia de seguridad desde el frontend (API heredada) y API JSON para protegerlas frente a accesos no autorizados. Akeeba Backup NO habilitará estas funciones a menos que use aquí una contraseña larga y compleja.<br><br><strong>Nota de seguridad:</strong> la Clave secreta es la única credencial que acepta la API JSON, y es ilimitada. Quien la posea puede cambiar cualquier opción, realizar una copia de seguridad y descargar el archivo resultante, y una copia de seguridad es una copia completa de su sitio, incluidas las credenciales de la base de datos y los registros de usuario. Trátela con el mismo cuidado que su contraseña de administrador. Consulte la documentación para más información."
COM_AKEEBA_CONFIG_SECRETWORD_LABEL="Clave secreta"
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_DESCRIPTION="Cuando está habilitado, los ajustes de configuración se cifran usando el cifrado estándar del sector AES-128."
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_LABEL="Usar cifrado"
COM_AKEEBA_CONFIG_SFTPTEST_BADPREFIX="NO debe añadir el prefijo sftp:// al nombre de host SFTP. Elimine el prefijo sftp:// e inténtelo de nuevo."
COM_AKEEBA_CONFIG_SFTPTEST_NOUPLOAD="Akeeba Backup pudo conectarse a su servidor, pero no pudo subir un archivo de prueba. Es posible que la subida de la copia de seguridad falle."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_DESCRIPTION="Cuando está activado, Akeeba Backup eliminará los archivos de copia de seguridad antiguos si el tamaño total de los archivos de copia de seguridad supera el valor definido a continuación. Este ajuste se aplica <b>por perfil</b>."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_TITLE="Habilitar cuota por tamaño"
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_DESCRIPTION="Si el tamaño total de los archivos de copia de seguridad realizados con el perfil actual supera este límite, las copias de seguridad más antiguas se eliminarán del servidor.<br/><br/><b>Sugerencia</b>: seleccione «Personalizado» e introduzca el valor deseado si no aparece en la lista."
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_TITLE="Cuota por tamaño"
COM_AKEEBA_CONFIG_SPLITDBDUMP_DESCRIPTION="Sus volcados de base de datos se dividirán en archivos pequeños para mejorar la compresión y evitar problemas de tamaño de archivo en ciertos alojamientos económicos. Lo ideal sería usar la mitad del tamaño del umbral de archivos grandes. Establézcalo en 0 para deshabilitar la división y crear un único archivo de volcado de gran tamaño por base de datos."
COM_AKEEBA_CONFIG_SPLITDBDUMP_TITLE="Tamaño para archivos de volcado SQL divididos"
COM_AKEEBA_CONFIG_SUGARSYNC_ACCESS_DESCRIPTION="Introduzca su ID de clave de acceso. Cree una en https://www.sugarsync.com/developer/account"
COM_AKEEBA_CONFIG_SUGARSYNC_ACCESS_TITLE="ID de clave de acceso"
COM_AKEEBA_CONFIG_SUGARSYNC_DIRECTORY_DESCRIPTION="El directorio donde se almacenarán los archivos de copia de seguridad. Si la primera parte del directorio no coincide con el nombre de una carpeta de sincronización de SugarSync, el directorio se creará dentro de su carpeta Magic Briefcase. Puede usar las mismas variables que utiliza para los nombres de archivo de copia de seguridad, por ejemplo [HOST] para el nombre de dominio de su sitio o [DATE] para la fecha actual."
COM_AKEEBA_CONFIG_SUGARSYNC_DIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_SUGARSYNC_EMAIL_DESCRIPTION="La dirección de correo electrónico de su cuenta de SugarSync"
COM_AKEEBA_CONFIG_SUGARSYNC_EMAIL_TITLE="Correo electrónico"
COM_AKEEBA_CONFIG_SUGARSYNC_PASSWORD_DESCRIPTION="La contraseña de su cuenta de SugarSync"
COM_AKEEBA_CONFIG_SUGARSYNC_PASSWORD_TITLE="Contraseña"
COM_AKEEBA_CONFIG_SUGARSYNC_PRIVATE_DESCRIPTION="Introduzca la clave de acceso privada correspondiente a su ID de clave de acceso. Créela en https://www.sugarsync.com/developer/account"
COM_AKEEBA_CONFIG_SUGARSYNC_PRIVATE_TITLE="Clave de acceso privada"
COM_AKEEBA_CONFIG_SWIFT_AUTHURL_DESCRIPTION="El punto de conexión del servicio Keystone de su instalación de OpenStack. INCLUYA la versión. NO incluya el sufijo /token. Ejemplo: https://authentication.example.com/v2.0"
COM_AKEEBA_CONFIG_SWIFT_AUTHURL_TITLE="URL de autenticación"
COM_AKEEBA_CONFIG_SWIFT_CONTAINERURL_DESCRIPTION="El punto de conexión de la API para su contenedor de almacenamiento de objetos, por ejemplo, https://storage.example.com/v1/AUTH_abcdef0123456789abcdef0123456789/my-container"
COM_AKEEBA_CONFIG_SWIFT_CONTAINERURL_TITLE="URL del contenedor"
COM_AKEEBA_CONFIG_SWIFT_DIRECTORY_DESCRIPTION="El directorio dentro del contenedor de almacenamiento de objetos de OpenStack Swift donde se almacenarán los archivos de copia de seguridad. Para almacenar todo en la raíz del contenedor, déjelo en blanco."
COM_AKEEBA_CONFIG_SWIFT_DIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_SWIFT_DOMAIN_DESCRIPTION="Solo se utiliza con la autenticación Keystone v3. Este es el dominio de autenticación del servicio Keystone v3, <strong>NO</strong> el nombre de host del servidor de autenticación de Keystone. En la mayoría de los casos es <code>default</code> o <code>Default</code>. Si no está seguro, consulte con su proveedor de almacenamiento."
COM_AKEEBA_CONFIG_SWIFT_DOMAIN_TITLE="Dominio de autenticación de Keystone v3"
COM_AKEEBA_CONFIG_SWIFT_KEYSTONE_VERSION_DESCRIPTION="Elija qué versión del servicio de autenticación OpenStack Keystone utiliza su proveedor de almacenamiento. Si no está seguro, consulte con su proveedor de almacenamiento."
COM_AKEEBA_CONFIG_SWIFT_KEYSTONE_VERSION_TITLE="Versión de Keystone"
COM_AKEEBA_CONFIG_SWIFT_KEYSTONE_VERSION_V2="Keystone v2 (heredado)"
COM_AKEEBA_CONFIG_SWIFT_KEYSTONE_VERSION_V3="Keystone v3"
COM_AKEEBA_CONFIG_SWIFT_PASSWORD_DESCRIPTION="La contraseña de API de OpenStack para su nube."
COM_AKEEBA_CONFIG_SWIFT_PASSWORD_TITLE="Contraseña de OpenStack"
COM_AKEEBA_CONFIG_SWIFT_TENANTID_DESCRIPTION="Su ID de inquilino de OpenStack (Keystone v2) o ID de proyecto (Keystone v3), por ejemplo, a0b1c2d3e4f56789abcdef0123456789"
COM_AKEEBA_CONFIG_SWIFT_TENANTID_TITLE="ID de inquilino / ID de proyecto"
COM_AKEEBA_CONFIG_SWIFT_USERNAME_DESCRIPTION="El nombre de usuario de API de OpenStack para su nube."
COM_AKEEBA_CONFIG_SWIFT_USERNAME_TITLE="Nombre de usuario de OpenStack"
COM_AKEEBA_CONFIG_UI_AJAXERRORDLG_TEXT="Se ha producido un error mientras se esperaba una respuesta AJAX:"
COM_AKEEBA_CONFIG_UI_AJAXERRORDLG_TITLE="Error AJAX"
COM_AKEEBA_CONFIG_UI_BROWSE="Examinar..."
COM_AKEEBA_CONFIG_UI_BROWSER_TITLE="Explorador de directorios"
COM_AKEEBA_CONFIG_UI_CONFIG="Configurar..."
COM_AKEEBA_CONFIG_UI_FTPBROWSER_TITLE="Explorador de directorios FTP"
COM_AKEEBA_CONFIG_UI_REFRESH="Actualizar"
COM_AKEEBA_CONFIG_UI_ROOTDIR="El uso del directorio raíz del sitio como directorio de salida o almacenamiento temporal provocará un error en la copia de seguridad. Se ha anulado su configuración."
COM_AKEEBA_CONFIG_UI_SETTINGS_NOTSECURED="Su servidor no admite el cifrado de los ajustes de configuración. Le recomendamos encarecidamente que no almacene contraseñas en la configuración."
COM_AKEEBA_CONFIG_UI_SETTINGS_SECURED="Su configuración está protegida con cifrado de 128 bits. Puede almacenar sus contraseñas de forma segura en la configuración."
COM_AKEEBA_CONFIG_UI_SFTPBROWSER_TITLE="Explorador de directorios SFTP"
COM_AKEEBA_CONFIG_UPLOADKICKSTART_DESCRIPTION="Si está activado, se subirá una copia de Akeeba Kickstart Professional al almacenamiento remoto especificado en el motor de postprocesamiento indicado arriba (excepto para los motores Ninguno y Correo electrónico). Esto es útil cuando se usa FTP o SFTP para transferir su sitio a un servidor diferente: tanto el archivo de copia de seguridad como Kickstart, utilizado para extraerlo, se subirán a su servidor remoto. Una vez completada la copia de seguridad, basta con ejecutar Kickstart en el sitio remoto y proceder con la restauración. ¡Tan sencillo!"
COM_AKEEBA_CONFIG_UPLOADKICKSTART_TITLE="Subir Kickstart al almacenamiento remoto"
COM_AKEEBA_CONFIG_USAGESTATS_SOLO_DESC="Ayúdenos a mejorar nuestro software informando de forma anónima y automática sobre sus versiones de PHP y MySQL. Esta información nos ayudará a decidir qué versiones de PHP y MySQL admitir en versiones futuras. Nota: NO recopilamos el nombre de su sitio, dirección IP ni ninguna otra información identificativa directa o indirectamente única."
COM_AKEEBA_CONFIG_USAGESTATS_SOLO_LABEL="Habilitar la notificación anónima de versiones de PHP y MySQL"
COM_AKEEBA_CONFIG_ACCURATE_PHP_CLI_LABEL="Ruta exacta de PHP-CLI"
COM_AKEEBA_CONFIG_ACCURATE_PHP_CLI_DESC="Active esta opción para que Akeeba Solo intente detectar la ruta exacta de PHP-CLI en su servidor. Desactívela si su servidor no lo permite y bloquea su dirección IP durante varios minutos u horas cuando ocurre esto (por ejemplo, IONOS)."
COM_AKEEBA_CONFIG_VIRTUALFOLDER_DESCRIPTION="Si ha configurado directorios externos, su contenido aparecerá en el archivo comprimido como subdirectorios de este directorio virtual. Es virtual porque en realidad no existe en su servidor; solo existe dentro del archivo de copia de seguridad. Asegúrese de que el nombre del directorio virtual no coincida con un directorio existente para evitar la pérdida de datos."
