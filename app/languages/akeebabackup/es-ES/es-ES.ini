COM_AKEEBA_CPANEL_LBL_OUTDIR_CLICKTHEBUTTON="Haga clic en el botón de abajo para solucionar este problema. Esto es lo que hace."
COM_AKEEBA_CPANEL_LBL_OUTDIR_DELETEORBEHACKED="Hasta que lo haga, le <strong>RECOMENDAMOS MUY ENCARECIDAMENTE</strong> que no realice una copia de seguridad de su sitio y, si ya lo ha hecho, que elimine todos los archivos de copia de seguridad y los archivos de registro. <strong>SI NO SIGUE ESTAS INSTRUCCIONES, ES MUY PROBABLE QUE SU SITIO SEA COMPROMETIDO (HACKEADO).</strong>"
COM_AKEEBA_CPANEL_LBL_OUTDIR_FILEREADABLE="Akeeba Backup ha detectado que su directorio de salida de copias de seguridad <code>%s</code> se encuentra dentro de la raíz web de su sitio. Su contenido, incluidos los archivos de copia de seguridad, es accesible a través de la web. Sin embargo, NO es posible listar los archivos del directorio con un navegador web. <strong>Esto puede ser un problema de seguridad</strong>. Un atacante podría adivinar el nombre del archivo de copia de seguridad y descargarlo directamente, eludiendo la seguridad de su sitio."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_RANDOM="El «Nombre del archivo de copia de seguridad» se modificará para incluir la variable <code>[RANDOM]</code>. Esto hace que sea prácticamente imposible adivinar los nombres de los archivos de copia de seguridad, al añadir 16 letras y/o números aleatorios diferentes en el nombre del archivo cada vez que realice una copia de seguridad."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_SECURITYFILES="Se escribirá un archivo <code>.htaccess</code> y un archivo <code>web.config</code> en esa carpeta. En la mayoría de los servidores, esto es suficiente para impedir las descargas web directas de cualquier archivo contenido en ella y deshabilita el listado de sus archivos. También disponemos de una solución para los servidores en los que estos archivos especiales no tienen efecto. Otros tres archivos llamados <code>index.php</code>, <code>index.html</code> e <code>index.htm</code> también se escribirán en esa carpeta. Estos archivos de índice impiden que el servidor web muestre los nombres de los archivos de copia de seguridad y de los archivos de registro."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM="Además, su directorio de salida es igual o es un subdirectorio de una carpeta que su sitio utiliza para almacenar archivos de sistema, accesibles públicamente, o archivos de software de terceros."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM_FIX="Debe ir a la página de Configuración de Akeeba Backup y seleccionar un directorio de salida diferente."
COM_AKEEBA_CPANEL_LBL_OUTDIR_LISTABLE="Akeeba Backup ha detectado que su directorio de salida de copias de seguridad <code>%s</code> se encuentra dentro de la raíz web de su sitio. Su contenido, incluidos los archivos de copia de seguridad, es accesible a través de la web. Además, es posible listar los archivos del directorio, es decir, muestra un listado de sus archivos de copia de seguridad cuando se accede con un navegador web. <strong>Esto es un problema de seguridad grave</strong>. Un atacante puede acceder a esta carpeta desde un navegador web y descargar sus archivos de copia de seguridad directamente, eludiendo la seguridad de su sitio."
COM_AKEEBA_CPANEL_LBL_OUTDIR_TRASHHOST="Lamentablemente, su servidor no admite ningún método razonable para proteger el directorio. Independientemente de lo que se haga, siempre mostrará los nombres de los archivos que contiene y permitirá descargarlos desde un navegador. Su única opción es crear un directorio de salida de copias de seguridad fuera de la raíz de su sitio."
