COM_AKEEBA_CONFIG_ADVANCED="Configuración avanzada"
COM_AKEEBA_CONFIG_ADVANCED_SBALF_DESC="Akeeba Backup interrumpirá el paso de procesamiento después de archivar un archivo de gran tamaño. Al habilitar esta opción, Akeeba Backup funcionará más rápido. Sin embargo, esto puede provocar errores de tiempo de espera agotado o errores internos del servidor."
COM_AKEEBA_CONFIG_ADVANCED_SBALF_LABEL="Deshabilitar la interrupción de paso tras archivos grandes"
COM_AKEEBA_CONFIG_ADVANCED_SBBD_LABEL="Deshabilitar la interrupción de paso entre dominios"
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_DESC="Akeeba Backup interrumpirá el paso de procesamiento antes de archivar un archivo de gran tamaño. Al habilitar esta opción, Akeeba Backup funcionará más rápido. Sin embargo, esto puede provocar errores de tiempo de espera agotado o errores internos del servidor."
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_LABEL="Deshabilitar la interrupción de paso antes de archivos grandes"
COM_AKEEBA_CONFIG_ADVANCED_SBPA_DESC="Akeeba Backup interrumpirá el paso de procesamiento si considera que se quedará sin tiempo antes de archivar un archivo. Este cálculo no es del todo preciso y puede ralentizar las copias de seguridad. Al habilitar esta opción, Akeeba Backup funcionará más rápido. Sin embargo, esto puede provocar errores de tiempo de espera agotado o errores internos del servidor."
COM_AKEEBA_CONFIG_ADVANCED_SBPA_LABEL="Deshabilitar la interrupción proactiva de pasos"
COM_AKEEBA_CONFIG_ADVANCED_SBPP_DESC="Akeeba Backup interrumpirá el paso de procesamiento entre subpasos de la finalización y el postprocesamiento de la copia de seguridad. Esto puede añadir unos 10 segundos al tiempo total de la copia de seguridad. Al habilitar esta opción, Akeeba Backup funcionará más rápido. Sin embargo, esto puede provocar errores de tiempo de espera agotado o errores internos del servidor."
COM_AKEEBA_CONFIG_ADVANCED_SBPP_LABEL="Deshabilitar la interrupción de paso en la finalización"
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_DESC="Indica a Akeeba Backup que intente aumentar el límite de memoria de PHP a un valor muy alto (16 GB). Esto le permite comprimir archivos más grandes y subir archivos de copia de seguridad de mayor tamaño mediante opciones de almacenamiento remoto que requieren mucha memoria, como WebDAV. Nota: esto solo establece el límite máximo de consumo de memoria. En la mayoría de los casos, el motor de copia de seguridad de Akeeba Backup consume <em>mucho menos</em> memoria que eso, normalmente en torno a 20 MB. Comprimir y subir archivos más grandes también requiere modificar otras opciones en la página de Configuración del perfil de copia de seguridad."
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_LABEL="Establecer un límite de memoria alto"
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_DESC="Si su servidor no ejecuta PHP en modo seguro y admite set_time_limit(), Akeeba Backup intentará establecer un tiempo máximo de ejecución de PHP ilimitado para evitar posibles problemas de tiempo de espera agotado"
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_LABEL="Establecer un límite de tiempo PHP ilimitado"
COM_AKEEBA_CONFIG_ANGIE_KEY_DESCRIPTION="Si utiliza el script instalador integrado ANGIE, puede protegerlo opcionalmente con una contraseña para evitar el acceso no autorizado al instalador. Al ejecutar el instalador se le pedirá que introduzca esta contraseña. Tenga en cuenta que la contraseña distingue entre mayúsculas y minúsculas, es decir, ABC, abc y Abc son tres contraseñas diferentes."
COM_AKEEBA_CONFIG_ANGIE_KEY_TITLE="Contraseña de ANGIE"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_DESC="Enviar correo electrónico a esta dirección (déjela en blanco para deshabilitar esta función)"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_LABEL="Dirección de correo electrónico"
COM_AKEEBA_CONFIG_ARCHIVENAME_DESCRIPTION="Plantilla de nombre para el archivo de copia de seguridad, según corresponda. Puede utilizar las siguientes macros:<ul><li><b>[HOST]</b> El nombre del host. ¡ADVERTENCIA! Esta etiqueta no funciona en modo CRON.</li><li><b>[DATE]</b> Fecha actual</li><li><b>[TIME_TZ]</b> Hora actual y zona horaria</li></ul>Hay más disponibles; consulte la documentación."
COM_AKEEBA_CONFIG_ARCHIVENAME_TITLE="Nombre del archivo de copia de seguridad"
COM_AKEEBA_CONFIG_ARCHIVERENGINE_DESCRIPTION="Define el formato de archivo de Akeeba Backup. Algunos motores, como DirectFTP, no generan archivos comprimidos, sino que se encargan de transferir sus archivos a otros servidores."
COM_AKEEBA_CONFIG_ARCHIVERENGINE_TITLE="Motor de archivado"
COM_AKEEBA_CONFIG_AUTORESUME_DESCRIPTION="Cuando esta opción está desmarcada, Akeeba Backup detendrá la copia de seguridad cuando el servidor responda con un error. Cuando esta opción está habilitada, Akeeba Backup intentará reanudar la copia de seguridad repitiendo el último paso. Esto solo se aplica a las copias de seguridad desde la administración. Además, no permitirá reanudar correctamente todas las copias de seguridad que resulten en un error: solo se podrán reanudar los intentos de copia de seguridad bloqueados temporalmente por restricciones de uso de CPU del servidor o problemas de corte de red."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_DESCRIPTION="Cuántas veces debe reintentar Akeeba Backup reanudar la copia de seguridad antes de abandonar definitivamente. De 3 a 5 reintentos funcionan mejor en la mayoría de los servidores."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_TITLE="Número máximo de reintentos de un paso de copia de seguridad tras un error AJAX"
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_DESCRIPTION="Cuántos segundos esperar antes de reanudar la copia de seguridad. Se recomienda establecer este valor en 30 segundos o más (se recomiendan 120 segundos en la mayoría de los casos) para dar al servidor el tiempo necesario para desbloquear el proceso de copia de seguridad antes de que Akeeba Backup intente completarlo."
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_TITLE="Período de espera antes de reintentar el paso de copia de seguridad"
COM_AKEEBA_CONFIG_AUTORESUME_TITLE="Reanudar la copia de seguridad tras producirse un error AJAX"
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_DESCRIPTION="El nombre de su cuenta. Si su punto de conexión es foobar.blob.core.windows.net, entonces el nombre de su cuenta es <b>foobar</b> y debe escribir <em>foobar</em> en este campo."
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_TITLE="Nombre de cuenta"
COM_AKEEBA_CONFIG_AZURE_CONTAINER_DESCRIPTION="El contenedor de Windows Azure BLOB Storage donde se almacenarán los archivos de copia de seguridad. El contenedor debe existir previamente."
COM_AKEEBA_CONFIG_AZURE_CONTAINER_TITLE="Contenedor"
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_DESCRIPTION="El directorio dentro del contenedor de Windows Azure BLOB Storage donde se almacenarán los archivos de copia de seguridad. Para almacenar todo en la raíz del contenedor, déjelo en blanco."
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_AZURE_KEY_DESCRIPTION="Puede encontrar su clave de acceso principal en la página de su cuenta en windows.azure.com. Cópiela y péguela aquí. Siempre termina con dos signos de igual."
COM_AKEEBA_CONFIG_AZURE_KEY_TITLE="Clave de acceso principal"
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_DESCRIPTION="Introduzca el ID de clave de aplicación de BackBlaze. Puede encontrar esta información en <a href='https://secure.backblaze.com/b2_buckets.htm'>la página de su cuenta de BackBlaze</a> tras hacer clic en «Show Account ID and Application Key». Si utiliza su clave maestra, introduzca en su lugar el ID de su cuenta."
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_TITLE="ID de clave de aplicación"
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_DESCRIPTION="Introduzca su clave de aplicación de BackBlaze. Puede encontrar esta información en <a href='https://secure.backblaze.com/b2_buckets.htm'>la página de su cuenta de BackBlaze</a> tras hacer clic en «Show Account ID and Application Key». <strong>ADVERTENCIA</strong>: BackBlaze solo le mostrará esta clave UNA VEZ. Para volver a verla tendrá que regenerar la clave de aplicación, lo que hará que TODAS las instancias de Akeeba Backup vinculadas anteriormente queden desvinculadas hasta que introduzca la <em>nueva</em> clave de aplicación."
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_TITLE="Clave de aplicación"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_DESCRIPTION="El nombre de su contenedor de Backblaze"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_TITLE="Contenedor"
COM_AKEEBA_CONFIG_BACKBLAZE_DIRECTORY_DESCRIPTION="El directorio dentro de su contenedor donde se almacenarán los archivos de copia de seguridad. Déjelo en blanco para almacenar los archivos en la raíz del contenedor."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_DESCRIPTION="Cuando activa esta opción, Akeeba Backup realizará subidas en una sola parte a Backblaze B2. Deberá usar un valor menor en la configuración de Tamaño de parte para archivos divididos del motor de archivado para evitar que la subida agote el tiempo de espera y provoque un error en el proceso de copia de seguridad."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_TITLE="Deshabilitar las subidas multiparte"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_DESC="¿Se debe traducir la hora de inicio de la copia de seguridad a la zona horaria del usuario que ha iniciado sesión en la página Gestionar copias de seguridad? Si se establece en No, todas las horas de inicio de las copias de seguridad se muestran en la zona horaria GMT. Esta opción NO afecta a las variables [DATE] y [TIME] para la denominación de los archivos de copia de seguridad ni a la descripción predeterminada; utilice la opción Zona horaria de la copia de seguridad para cambiar el comportamiento de estas variables."
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_LABEL="Hora local en Gestionar copias de seguridad"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_WP_DESC="Cuando está deshabilitada, la hora de inicio de la copia de seguridad en la página Gestionar copias de seguridad se mostrará en la zona horaria GMT. Cuando está habilitada, la hora de inicio de la copia de seguridad se mostrará en la zona horaria configurada en WordPress (Ajustes, General, Zona horaria)."
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_DESC="¿Se debe mostrar la opción de descargar los archivos de copia de seguridad a través del navegador, aunque no sea recomendable? Tenga en cuenta que esta opción NO estará disponible si ha habilitado WP_DEBUG o si la visualización de errores de PHP está activa, como precaución básica frente a descargas corruptas (incompletas o dañadas). <strong>¡ADVERTENCIA! Al habilitar esta opción, acepta que no recibirá soporte para problemas relacionados con la extracción de archivos de copia de seguridad.</strong>"
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_LABEL="Permitir la descarga de archivos de copia de seguridad a través del navegador"
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_DESC="¿Se debe ofrecer a los usuarios que restauran un sitio la opción de eliminar todo antes de extraer un archivo comprimido? Esta opción solo se aplica a la versión Professional de nuestro software. ADVERTENCIA: ESTO ES EXTREMADAMENTE PELIGROSO. LEA LA DOCUMENTACIÓN MUY DETENIDAMENTE ANTES DE HABILITARLO. SI UTILIZA ESTA FUNCIÓN DURANTE LA RESTAURACIÓN, RENUNCIA A CUALQUIER DERECHO DE SOPORTE Y ASUME TODA LA RESPONSABILIDAD."
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_LABEL="Mostrar la opción «Eliminar todo antes de la extracción»"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_ABBREVIATION="Zona horaria"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_DESC="El sufijo de zona horaria que se muestra junto a la hora de inicio de la copia de seguridad en la página Gestionar copias de seguridad.<br/>Ninguno: no se muestra ningún sufijo (no recomendado).<br/>Zona horaria: una zona horaria abreviada, p. ej. CET para la hora de Europa central.<br/>Diferencia GMT: la diferencia respecto a la zona horaria GMT. Esto puede variar según el horario de verano. Por ejemplo, la zona horaria CET será GMT+01:00 (una hora por delante de GMT) en invierno y GMT+02:00 (dos horas por delante de GMT) en verano."
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_GMTOFFSET="Diferencia GMT"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_LABEL="Sufijo de zona horaria"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_NONE="Ninguno"
COM_AKEEBA_CONFIG_BACKUPTYPE_ALLDB="Todas las bases de datos configuradas (archivo comprimido)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DBONLY="Solo la base de datos principal del sitio (archivo SQL)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DESCRIPTION="Qué tipo de copia de seguridad del sitio desea que realice Akeeba Backup"
COM_AKEEBA_CONFIG_BACKUPTYPE_FILEONLY="Solo archivos del sitio"
COM_AKEEBA_CONFIG_BACKUPTYPE_FULL="Copia de seguridad completa del sitio"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFILE="Solo archivos, incremental"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFULL="Sitio completo, archivos incrementales"
COM_AKEEBA_CONFIG_BACKUPTYPE_TITLE="Tipo de copia de seguridad"
COM_AKEEBA_CONFIG_BACTHSIZE_DESCRIPTION="Reducir este valor conservará memoria y evitará errores HTTP 500 al hacer copias de seguridad de tablas muy grandes"
COM_AKEEBA_CONFIG_BACTHSIZE_TITLE="Número de filas por lote"
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_DESCRIPTION="Los archivos que superen este tamaño se almacenarán sin comprimir o su procesamiento se distribuirá en varios pasos (según el motor de archivado) para evitar tiempos de espera agotados. Se recomienda aumentar este valor únicamente en servidores rápidos y fiables."
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_TITLE="Umbral de archivo grande"
COM_AKEEBA_CONFIG_BLANKOUTPASS_DESCRIPTION="Elimina el nombre de usuario y la contraseña de las conexiones de base de datos de la copia de seguridad"
COM_AKEEBA_CONFIG_BLANKOUTPASS_TITLE="Borrar nombre de usuario/contraseña"
COM_AKEEBA_CONFIG_BOX_ACCESSTOKEN_TITLE="Token de acceso"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_ENABLE="Habilitar subida por fragmentos"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_SIZE="Tamaño de fragmento"
COM_AKEEBA_CONFIG_BOX_DIRECTORY_DESCRIPTION="El directorio dentro de su cuenta de Box.com donde se almacenarán los archivos de copia de seguridad. Déjelo en blanco para almacenar los archivos en la raíz de la carpeta de Box.com."
COM_AKEEBA_CONFIG_BOX_DIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_DESC="Haga clic en este botón para abrir una nueva ventana donde podrá iniciar sesión en su cuenta con el proveedor de almacenamiento. A continuación, cierre la ventana emergente y haga clic en el botón del Paso 2 que aparece a continuación."
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_TITLE="Autenticación - Paso 1"
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_DESCRIPTION="Se completa automáticamente al finalizar el Paso 1 de autenticación indicado anteriormente. NO comparta el mismo token en varios sitios. En su lugar, autentique cada sitio por separado."
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_TITLE="Token de actualización"
COM_AKEEBA_CONFIG_CHUNKSIZE_DESCRIPTION="Akeeba Backup procesa los archivos grandes en pequeños fragmentos para evitar tiempos de espera agotados. Este parámetro define el tamaño máximo de fragmento para este tipo de procesamiento."
COM_AKEEBA_CONFIG_CHUNKSIZE_TITLE="Tamaño de fragmento para el procesamiento de archivos grandes"
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_DESCRIPTION="Cuando esta casilla no está marcada (valor predeterminado) y el paso de copia de seguridad finaliza en menos tiempo que el tiempo mínimo de ejecución configurado, Akeeba Backup hará que el servidor espere hasta alcanzar dicho tiempo. En algunos servidores muy restrictivos, esto puede interrumpir la copia de seguridad. Al marcar esta casilla, el período de espera se implementará en el navegador, evitando esta limitación. IMPORTANTE: Esta opción solo se aplica a las copias de seguridad realizadas desde la administración. Las copias de seguridad de interfaz pública, JSON API (remotas) y desde la línea de comandos (CLI) siempre implementan la espera en el lado del servidor."
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_TITLE="Implementación del tiempo mínimo de ejecución en el lado del cliente"
COM_AKEEBA_CONFIG_CLOUDFILESAPIKEY_DESCRIPTION="Su clave API de CloudFiles"
COM_AKEEBA_CONFIG_CLOUDFILESAPIKEY_TITLE="Clave API"
COM_AKEEBA_CONFIG_CLOUDFILESCONTAINER_DESCRIPTION="El contenedor de CloudFiles donde se almacenarán los archivos de copia de seguridad"
COM_AKEEBA_CONFIG_CLOUDFILESCONTAINER_TITLE="Contenedor"
COM_AKEEBA_CONFIG_CLOUDFILESDIRECTORY_DESCRIPTION="El directorio dentro del contenedor de CloudFiles donde se almacenarán los archivos de copia de seguridad. Para almacenar todo en la raíz del contenedor, déjelo en blanco."
COM_AKEEBA_CONFIG_CLOUDFILESDIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_CLOUDFILESUSERNAME_DESCRIPTION="Su nombre de usuario de CloudFiles"
COM_AKEEBA_CONFIG_CLOUDFILESUSERNAME_TITLE="Nombre de usuario"
COM_AKEEBA_CONFIG_CLOUDME_DIRECTORY_DESCRIPTION="El directorio dentro de su cuenta de CloudMe donde se almacenarán los archivos de copia de seguridad. Déjelo en blanco para almacenar los archivos en la raíz de la carpeta de CloudMe."
COM_AKEEBA_CONFIG_CLOUDME_DIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_CLOUDME_PASSWORD_DESCRIPTION="Contraseña"
COM_AKEEBA_CONFIG_CLOUDME_PASSWORD_TITLE="Contraseña"
COM_AKEEBA_CONFIG_CLOUDME_USERNAME_DESCRIPTION="Nombre de usuario"
COM_AKEEBA_CONFIG_CLOUDME_USERNAME_TITLE="Nombre de usuario"
COM_AKEEBA_CONFIG_COUNTQUOTA_ENABLE_DESCRIPTION="Cuando está habilitada, Akeeba Backup eliminará los archivos de copia de seguridad antiguos si superan el límite definido a continuación."
COM_AKEEBA_CONFIG_COUNTQUOTA_ENABLE_TITLE="Habilitar cuota por número"
COM_AKEEBA_CONFIG_COUNTQUOTA_VALUE_DESCRIPTION="Akeeba Backup eliminará los archivos de copia de seguridad antiguos si superan el límite definido en esta configuración. Las copias de seguridad multiparte se consideran como <i>un</i> único archivo.<br/><br/><b>Consejo</b>: Seleccione Personalizado e introduzca el valor deseado si no aparece en la lista."
COM_AKEEBA_CONFIG_COUNTQUOTA_VALUE_TITLE="Cuota por número"
COM_AKEEBA_CONFIG_DATEFORMAT_DESC="Cambie el formato en que se muestra la fecha y hora de inicio de las copias de seguridad en la página Gestionar copias de seguridad. Déjelo en blanco para usar el formato predeterminado. Puede utilizar las opciones de formato de la función date de PHP; consulte: http://www.php.net/manual/en/function.date.php"
COM_AKEEBA_CONFIG_DATEFORMAT_LABEL="Formato de fecha"
COM_AKEEBA_CONFIG_DELETEAFTER_DESCRIPTION="Si está habilitada, el archivo de copia de seguridad se eliminará de este servidor en cuanto finalice correctamente el postprocesamiento."
COM_AKEEBA_CONFIG_DELETEAFTER_TITLE="Eliminar archivo tras el postprocesamiento"
COM_AKEEBA_CONFIG_DEREFERENCESYMLINKS_DESCRIPTION="Cuando está habilitada, los enlaces simbólicos se seguirán como si fueran archivos y directorios normales. Cuando no está marcada, los enlaces simbólicos no se seguirán. Si utiliza enlaces simbólicos que generan un bucle infinito, desmarque esta opción."
COM_AKEEBA_CONFIG_DEREFERENCESYMLINKS_TITLE="Seguir enlaces simbólicos"
COM_AKEEBA_CONFIG_DESKTOP_NOTIFICATIONS_DESC="¿Se debe solicitar permiso para mostrar notificaciones de escritorio? Las notificaciones de escritorio aparecen cuando la copia de seguridad se inicia, finaliza, genera una advertencia o se detiene. Solo se muestran en navegadores compatibles (habitualmente: Chrome, Safari, Firefox, Opera) si concede a Akeeba Backup el permiso para mostrar notificaciones de escritorio cuando se le solicite en la página del Panel de control. Esta opción solo controla si se debe mostrar dicha solicitud. Una vez que acepte o rechace los permisos de notificaciones de escritorio, esta configuración no tendrá <b>ningún efecto</b>. La única forma de habilitar o deshabilitar las notificaciones de escritorio será a través de la configuración de su navegador."
COM_AKEEBA_CONFIG_DESKTOP_NOTIFICATIONS_LABEL="Solicitar permiso para notificaciones de escritorio"
COM_AKEEBA_CONFIG_DIRECTFTP_FTPS_DESCRIPTION="Si está habilitada, Akeeba Backup intentará conectarse a su servidor FTP mediante una conexión cifrada con SSL. <strong>¡Esto no es lo mismo que SFTP, SCP o «FTP seguro»!</strong> Tenga en cuenta que si su servidor no admite este método, recibirá errores de conexión."
COM_AKEEBA_CONFIG_DIRECTFTP_FTPS_TITLE="Usar FTP sobre SSL (FTPS)"
COM_AKEEBA_CONFIG_DIRECTFTP_HOST_DESCRIPTION="Nombre de host del servidor FTP, sin el protocolo. Esto significa que <tt>ftp://example.com</tt> es <b>inválido</b> y <tt>example.com</tt> es válido. Akeeba Backup solo admite servidores FTP y FTPS. <u>No</u> admite SFTP, SCP ni otras variantes SSH."
COM_AKEEBA_CONFIG_DIRECTFTP_HOST_TITLE="Nombre de host"
COM_AKEEBA_CONFIG_DIRECTFTP_INITDIR_DESCRIPTION="La ruta <b>FTP</b> absoluta al directorio donde se subirán los archivos. Si no está seguro, conéctese a su servidor con FileZilla, navegue hasta el directorio deseado y copie la ruta que aparece en el panel derecho, sobre la lista de directorios. Suele ser una ruta corta como <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_DIRECTFTP_INITDIR_TITLE="Directorio inicial"
COM_AKEEBA_CONFIG_DIRECTFTP_PASSIVE_DESCRIPTION="Usar el modo pasivo de FTP al transferir datos. Está habilitado de forma predeterminada, ya que es el único método que funciona a través de los cortafuegos habituales de los servidores web. No lo deshabilite a menos que esté seguro de que su servidor web no está detrás de un cortafuegos y de que su servidor FTP requiere absolutamente transferencias en modo activo."
COM_AKEEBA_CONFIG_DIRECTFTP_PASSIVE_TITLE="Usar modo pasivo"
COM_AKEEBA_CONFIG_DIRECTFTP_PASSWORD_DESCRIPTION="Contraseña del servidor FTP. Habitualmente distingue entre mayúsculas y minúsculas. Si tiene dudas, póngase en contacto con su administrador de red."
COM_AKEEBA_CONFIG_DIRECTFTP_PASSWORD_TITLE="Contraseña"
COM_AKEEBA_CONFIG_DIRECTFTP_PORT_DESCRIPTION="Puerto del servidor FTP. El valor más habitual es 21. Si tiene dudas, póngase en contacto con su administrador de red."
COM_AKEEBA_CONFIG_DIRECTFTP_PORT_TITLE="Puerto"
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_DESCRIPTION="Use este botón para probar la conexión FTP y ver los errores de conexión en caso de fallo."
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_FAIL="No se pudo conectar al servidor FTP remoto."
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_OK="¡La conexión con el servidor FTP remoto se estableció correctamente!"
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_TITLE="Probar conexión FTP"
COM_AKEEBA_CONFIG_DIRECTFTP_USER_DESCRIPTION="Nombre de usuario del servidor FTP. Normalmente distingue entre mayúsculas y minúsculas. Si no está seguro, póngase en contacto con su administrador de red."
COM_AKEEBA_CONFIG_DIRECTFTP_USER_TITLE="Nombre de usuario"
COM_AKEEBA_CONFIG_DIRECTSFTP_HOST_DESCRIPTION="Introduzca el nombre de host o la dirección IP de su servidor SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_HOST_TITLE="Nombre de host"
COM_AKEEBA_CONFIG_DIRECTSFTP_INITDIR_DESCRIPTION="Introduzca el directorio donde se subirán los archivos. Si no está seguro, use un cliente de escritorio SFTP, conéctese a su servidor, navegue hasta el directorio deseado y copie la ruta que se muestra. La ruta debe estar en formato absoluto, p. ej. /users/miusuario/public_html"
COM_AKEEBA_CONFIG_DIRECTSFTP_INITDIR_TITLE="Directorio inicial"
COM_AKEEBA_CONFIG_DIRECTSFTP_PASSWORD_DESCRIPTION="La contraseña SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_PASSWORD_TITLE="Contraseña"
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_DESCRIPTION="El puerto habitual para conexiones SFTP es el 22. Si su servidor utiliza un puerto diferente, introdúzcalo aquí."
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_TITLE="Puerto"
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_DESCRIPTION="Use este botón para probar la conexión SFTP y ver los errores de conexión en caso de fallo."
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_FAIL="No se pudo conectar al servidor SFTP remoto. El mensaje de error fue:"
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_OK="Se conectó correctamente al servidor SFTP remoto. Nota: la configuración del directorio inicial no fue probada."
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_TITLE="Probar conexión SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_DESCRIPTION="El nombre de usuario SFTP. Tenga en cuenta que su servidor SFTP debe permitir la autenticación con nombre de usuario y contraseña."
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_TITLE="Nombre de usuario"
COM_AKEEBA_CONFIG_DOWNLOADID_DESC="Esto es necesario para habilitar las actualizaciones automáticas de la versión Professional. Visite https://www.akeeba.com/my-subscriptions.html para obtener su ID de descarga personal."
COM_AKEEBA_CONFIG_DOWNLOADID_LABEL="ID de descarga"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_DESCRIPTION="Su clave de acceso de DreamObjects, disponible en el panel de control de DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_TITLE="Clave de acceso"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_DESCRIPTION="El nombre de su contenedor de DreamObjects. Asegúrese de escribirlo tal como aparece en el panel de control de DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_TITLE="Contenedor"
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_DESCRIPTION="El directorio dentro de su contenedor donde se almacenarán los archivos de copia de seguridad. Déjelo en blanco para almacenar los archivos en la raíz del contenedor."
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_DESCRIPTION="Si está habilitado, Akeeba Backup intentará convertir el nombre del contenedor a minúsculas, es decir, MiContenedor se convertirá en micontenedor. Si ha creado un contenedor con letras mayúsculas, p. ej. MiNuevoContenedor, desmarque esta opción y asegúrese de que el nombre del contenedor se escribe exactamente como aparece en su panel de control de DreamHost."
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_TITLE="Nombre del contenedor en minúsculas"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_DESCRIPTION="Su clave secreta de DreamObjects, disponible en el panel de control de DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_TITLE="Clave secreta"
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_DESCRIPTION="Si está habilitado, se usará una conexión segura (HTTPS) al subir sus archivos. Aunque aumenta la seguridad de los datos transferidos, también incrementa la posibilidad de que la copia de seguridad falle por tiempo de espera agotado."
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_TITLE="Usar SSL"
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_DESCRIPTION="El directorio dentro de su cuenta de Dropbox donde se almacenarán los archivos de copia de seguridad. Déjelo en blanco para almacenar los archivos en la raíz."
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_TITLE="Directorio"
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_DESCRIPTION="Este es el token de actualización que conecta Akeeba Backup con Dropbox. Es <strong>específico del sitio</strong> y se utiliza para volver a autorizar la conexión con Dropbox cuando el token de acceso de corta duración expira. Si tiene varios sitios, debe usar los botones del Paso 1 en cada uno de los sitios que desee autorizar. Por favor, <strong>NO</strong> copie el token de acceso o de actualización entre varios sitios. Esto provocará que la autenticación de Dropbox quede desincronizada y tendrá que reconectar todos sus sitios con Dropbox."
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_TITLE="Token de actualización"
COM_AKEEBA_CONFIG_DROPBOXTOKEN_DESCRIPTION="Este token se obtiene automáticamente de Dropbox cuando hace clic en el botón del Paso 2 anterior. Si tiene varios sitios, debe usar los botones del Paso 1 y el Paso 2 únicamente en el PRIMER sitio que desee autorizar. A continuación, copie el token, la clave secreta del token y el ID de usuario del primer sitio a todos los demás sitios que desee conectar a Dropbox."
COM_AKEEBA_CONFIG_DROPBOXTOKEN_TITLE="Token de acceso"
COM_AKEEBA_CONFIG_DROPBOX_TEAM_DESC="Marque esta opción si es miembro de un equipo que utiliza Dropbox for Business y desea usar la carpeta del equipo para almacenar las copias de seguridad. Recuerde anteponer el nombre de la carpeta del equipo al Directorio indicado abajo. Por ejemplo, si la interfaz web de Dropbox muestra una «Acme Corp Team Folder» en la página Archivos y desea colocar sus copias de seguridad en una carpeta llamada «Backups» dentro de ella, deberá usar el nombre de directorio <code>Acme Corp Team Folder/Backups</code>, no solo <code>Backups</code>."
COM_AKEEBA_CONFIG_DROPBOX_TEAM_TITLE="Dropbox for Business"
COM_AKEEBA_CONFIG_DUMPENGINE_DESCRIPTION="Define cómo Akeeba Backup procesará sus bases de datos para producir un archivo de copia de seguridad de base de datos."
COM_AKEEBA_CONFIG_DUMPENGINE_TITLE="Motor de copia de seguridad de base de datos"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_COMMON="Configuración común"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_MYSQL="Configuración de MySQL"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_POSTGRES="Configuración de PostgreSQL"
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_DESCRIPTION="Los correos electrónicos se enviarán a esta dirección en lugar de a la configurada en la página de Configuración del sistema una vez completada o fallida la copia de seguridad, si corresponde. Puede separar varias direcciones de correo electrónico con una coma, p. ej. alicia@ejemplo.com, bob@ejemplo.com."
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_TITLE="Destinatarios del correo electrónico"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_DESCRIPTION="Transfiere los archivos del sitio a un servidor FTP remoto sin archivarlos previamente. Este motor de archivado usa la biblioteca cURL, lo que proporciona una mayor compatibilidad con una amplia gama de servidores FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_DESCRIPTION="Algunos servidores FTP mal configurados o con comportamiento incorrecto devuelven una dirección IP errónea cuando el modo FTP pasivo está habilitado. Active esta opción para forzar a la biblioteca FTP a ignorar la IP incorrecta devuelta por el servidor FTP y usar en su lugar la IP pública del servidor FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_TITLE="Solución alternativa para modo pasivo"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_TITLE="DirectFTP over cURL"
