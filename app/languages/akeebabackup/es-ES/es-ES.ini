SOLO_SETUP_LBL_TIMEZONE_HELP="Seleccione la zona horaria más cercana a la ubicación de su servidor. Aquí es donde su servidor «reside». No es <em>necesariamente</em> donde reside <em>usted</em>."
SOLO_SETUP_LBL_TIMEZONE_WORDPRESS="Esta es la zona horaria utilizada por WordPress. No puede cambiarla en Akeeba Backup. Debe ir a Ajustes, General en la barra lateral de WordPress y cambiarla allí. Si no se selecciona ninguna en esa página, se asume que debe usarse la zona horaria GMT (UTC)."
SOLO_SETUP_LBL_TIMEZONE_WP="Zona horaria de WordPress"
SOLO_SETUP_LBL_USERSETUP="Configuración de inicio de sesión"
SOLO_SETUP_LBL_USERSETUP_TEXT="El acceso a Akeeba Solo está protegido por inicio de sesión. Introduzca a continuación los datos del usuario administrador. Puede crear más usuarios dentro de Akeeba Solo una vez finalizada la instalación."
SOLO_SETUP_LBL_USER_EMAIL="Dirección de correo electrónico"
SOLO_SETUP_LBL_USER_EMAIL_HELP="Introduzca su dirección de correo electrónico. Se utilizará siempre que su instalación de Akeeba Solo deba enviarle un correo electrónico. Esta dirección de correo electrónico, así como toda la información de usuario, <em>no</em> se transmite a los autores de Akeeba Solo."
SOLO_SETUP_LBL_USER_NAME="Nombre completo"
SOLO_SETUP_LBL_USER_NAME_HELP="Introduzca su nombre completo. Se utilizará siempre que su instalación de Akeeba Solo deba enviarle un correo electrónico."
