COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON="Configuración de una tarea de copia de seguridad con WebCron.org:"
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_ALERTS="Alertas"
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_ALERTS_INFO="Si ya ha configurado métodos de alerta en la interfaz de webcron.org, le recomendamos que elija un método de alerta aquí y que no marque la opción «Solo en caso de error» para recibir siempre una notificación cuando se ejecute la tarea CRON de copia de seguridad."
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_EXECUTIONTIME="Tiempo de ejecución"
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_EXECUTIONTIME_INFO="Se trata de la cuadrícula que aparece debajo de las demás opciones. Seleccione cuándo y con qué frecuencia desea que se ejecute la tarea CRON."
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_INFO="Inicie sesión en webcron.org. En el área CRON, haga clic en el botón New Cron. A continuación encontrará lo que debe introducir en la interfaz de webcron.org."
