COM_AKEEBA_TRANSFER_LBL_CHUNKSIZE_INFO="Los archivos de copia de seguridad se transfieren al servidor remoto en pequeños fragmentos. Esto determina el tamaño de dichos fragmentos. Los tamaños demasiado pequeños pueden provocar que el servidor remoto le bloquee, confundiéndole con un abusador, lo que generaría un error de subida. Los tamaños demasiado grandes pueden provocar un error de tiempo de espera agotado en el servidor de origen o en el remoto, lo que generaría un error AJAX. Normalmente, los valores entre 5M y 20M funcionan mejor."
