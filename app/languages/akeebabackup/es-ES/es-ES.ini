SOLO_SETUP_LBL_SESSIONTIMEOUT="Tiempo de espera de sesión (minutos)"
SOLO_SETUP_LBL_SESSIONTIMEOUT_HELP="Permanecerá con la sesión iniciada en Akeeba Solo durante esta cantidad de minutos desde su última actividad en el sistema. El valor predeterminado es 1440 minutos (un día). Le recomendamos cerrar siempre la sesión cuando haya terminado de administrar Akeeba Solo, como medida de seguridad estándar. A pesar de este ajuste, es posible que su sesión se cierre automáticamente si cambia su dirección IP, actualiza su navegador o se modifica la cadena de agente de usuario de su navegador (por ejemplo, al actualizar el sistema operativo, Java, etc.)."
SOLO_SETUP_LBL_SETTING="Ajuste"
