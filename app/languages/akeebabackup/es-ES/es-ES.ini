SOLO_SETUP_LBL_DATABASE_DBSSLCA_HELP="Ruta absoluta al archivo PEM del certificado de la entidad de certificación (CA) de su servidor de base de datos, p. ej. <code>/home/myuser/ca.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT="Archivo de clave pública (certificado) del usuario de la base de datos"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT_HELP="Ruta absoluta al archivo PEM de clave pública (certificado) de su usuario de base de datos, p. ej. <code>/home/myuser/myuser.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER="Métodos de cifrado SSL/TLS"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER_HELP="Introduzca una lista de métodos de cifrado para conectarse con certificados SSL, separados por dos puntos. Si se deja vacío, se utilizará la lista predeterminada (<code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>) (recomendado)."
SOLO_SETUP_LBL_DATABASE_DBSSLKEY="Archivo de clave privada del usuario de la base de datos"
SOLO_SETUP_LBL_DATABASE_DBSSLKEY_HELP="Ruta absoluta al archivo PEM de clave privada de su usuario de base de datos, p. ej. <code>/home/myuser/myuser-key.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT="Verificar certificado del servidor"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT_HELP="Establezca en Sí para verificar el certificado que el servidor nos envía. Esto se verifica con el archivo de la Autoridad de Certificación (CA) que haya especificado. Si obtiene errores de conexión, establézcalo en No; algunas configuraciones (especialmente las generadas por <code>mysql_ssl_rsa_setup</code>) pueden impedir la conexión si la verificación de certificados está habilitada. Si habilita la verificación y el campo del archivo CA se deja en blanco, el certificado del servidor se comprobará con los archivos de Autoridad de Certificación que su servidor conoce; consulte las opciones PHP <code>openssl.cafile</code> y <code>openssl.capath</code>."
SOLO_SETUP_LBL_DATABASE_DRIVER="Tipo de base de datos"
SOLO_SETUP_LBL_DATABASE_DRIVER_HELP="Normalmente es MySQLi (<em>con</em> la «i» final)"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQL="MySQL (controlador obsoleto para MySQL - evite su uso)"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQLI="MySQLi (controlador preferido para MySQL)"
SOLO_SETUP_LBL_DATABASE_DRIVER_NONE="Ninguno"
SOLO_SETUP_LBL_DATABASE_DRIVER_PDO="PDO"
SOLO_SETUP_LBL_DATABASE_DRIVER_PDOMYSQL="MySQL (PDO)"
SOLO_SETUP_LBL_DATABASE_DRIVER_SQLAZURE="Windows Azure SQL Database"
SOLO_SETUP_LBL_DATABASE_DRIVER_SQLITE="SQLite"
SOLO_SETUP_LBL_DATABASE_HOST="Nombre de host del servidor de base de datos"
SOLO_SETUP_LBL_DATABASE_HOST_HELP="El nombre de host o la dirección IP del servidor de base de datos (habitualmente: localhost). Tenga en cuenta que localhost y 127.0.0.1 son <em>muy</em> diferentes en lo que respecta a MySQL; es posible que deba probar ambos para ver cuál funciona con su servidor de base de datos. Si su servidor usa un puerto no estándar, añádalo tras el nombre de host precedido de dos puntos; por ejemplo, 127.0.0.1:1234 para usar un servidor de base de datos en 127.0.0.1 que escuche en el puerto 1234."
SOLO_SETUP_LBL_DATABASE_INFO="Akeeba Solo necesita una base de datos para almacenar su configuración y un registro de todos los intentos de copia de seguridad. Proporcione a continuación los parámetros de conexión a la base de datos. Puede usar la misma base de datos que el sitio del que desea hacer la copia, o una base de datos exclusiva para Akeeba Solo (recomendado)."
SOLO_SETUP_LBL_DATABASE_NAME="Nombre de la base de datos"
SOLO_SETUP_LBL_DATABASE_NAME_HELP="El nombre de su base de datos. La mayoría de los proveedores de alojamiento que usan cPanel, Plesk y otros paneles de control populares asignan nombres de base de datos como abcdef_nombre, donde abcdef es su nombre de usuario del panel de control de alojamiento. Si no está seguro, consulte a su proveedor."
SOLO_SETUP_LBL_DATABASE_PASS="Contraseña"
SOLO_SETUP_LBL_DATABASE_PASS_HELP="La contraseña que utiliza para conectarse a su base de datos."
SOLO_SETUP_LBL_DATABASE_PREFIX="Prefijo de nombre de tablas de la base de datos"
SOLO_SETUP_LBL_DATABASE_PREFIX_HELP="El prefijo común del nombre de todas las tablas de esta instalación de Akeeba Solo. Puede cambiarlo si tiene varias instalaciones de Akeeba Solo que comparten la misma base de datos."
SOLO_SETUP_LBL_DATABASE_USER="Nombre de usuario"
SOLO_SETUP_LBL_DATABASE_USER_HELP="El nombre de usuario que utiliza para conectarse a su base de datos. La mayoría de los proveedores de alojamiento que usan cPanel, Plesk y otros paneles de control populares asignan nombres de usuario como abcdef_nombre, donde abcdef es su nombre de usuario del panel de control de alojamiento. Si no está seguro, consulte a su proveedor."
SOLO_SETUP_LBL_FS_DRIVER="Controlador del sistema de archivos"
SOLO_SETUP_LBL_FS_DRIVER_FILE="Escritura directa en archivos"
SOLO_SETUP_LBL_FS_DRIVER_FTP="Modo FTP - File Transfer Protocol"
SOLO_SETUP_LBL_FS_DRIVER_HELP="En muchos servidores compartidos es necesario usar uno de los modos (S)FTP disponibles en este desplegable —e introducir los parámetros (S)FTP en los campos que aparecerán a continuación si realiza esta elección— para garantizar que Akeeba Solo pueda escribir en sus archivos correctamente. No todos los proveedores de alojamiento admiten SFTP. Se necesita compatibilidad con SFTP en el servidor y que esté instalada la extensión PHP mod_ssh2."
SOLO_SETUP_LBL_FS_DRIVER_SFTP="Modo SFTP - Secure File Transfer Protocol (sobre SSH)"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY="Directorio (S)FTP"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY_HELP="El directorio (S)FTP de la instalación de Akeeba Solo. En los servidores FTP esto no coincide con la ruta del sistema de archivos. Si no está seguro, consulte a su proveedor."
SOLO_SETUP_LBL_FS_FTP_HOST="Nombre de host del servidor (S)FTP"
SOLO_SETUP_LBL_FS_FTP_HOST_HELP="El nombre de host o la dirección IP de su servidor (S)FTP, por ejemplo <code>ftp.example.com</code> o <code>127.0.0.1</code>. DEBE introducirlo <em>sin</em> el prefijo <code>ftp://</code>, <code>sftp://</code> o <code>ssh://</code>. Si no está seguro sobre esto y los demás ajustes FTP, consulte a su proveedor."
SOLO_SETUP_LBL_FS_FTP_PASSIVE="Usar modo pasivo"
SOLO_SETUP_LBL_FS_FTP_PASSIVE_HELP="Solo aplicable a FTP; se ignora en SFTP. Cuando está seleccionado, Akeeba Solo usará el modo pasivo de FTP. La mayoría de los servidores FTP lo requieren. Si su proveedor requiere el modo activo de FTP, desmarque esta casilla. Si no está seguro, consulte a su proveedor."
SOLO_SETUP_LBL_FS_FTP_PASSWORD="Contraseña (S)FTP"
SOLO_SETUP_LBL_FS_FTP_PASSWORD_HELP="La contraseña que utiliza para conectarse a su servidor (S)FTP. Si no está seguro, consulte a su proveedor."
SOLO_SETUP_LBL_FS_FTP_PORT="Puerto del servidor (S)FTP"
SOLO_SETUP_LBL_FS_FTP_PORT_HELP="El número de puerto en el que escucha su servidor (S)FTP. Habitualmente es el 21 para FTP y el 22 para SFTP. Si no está seguro, consulte a su proveedor."
SOLO_SETUP_LBL_FS_FTP_SSL="Usar SSL"
SOLO_SETUP_LBL_FS_FTP_SSL_HELP="Solo aplicable a FTP; se ignora en SFTP. Cuando está seleccionado, Akeeba Solo usará FTP sobre SSL explícito (FTP/S). Tenga en cuenta que esto no debe confundirse con SFTP, que es algo completamente distinto."
SOLO_SETUP_LBL_FS_FTP_USERNAME="Nombre de usuario (S)FTP"
SOLO_SETUP_LBL_FS_FTP_USERNAME_HELP="El nombre de usuario que utiliza para conectarse a su servidor (S)FTP. Si no está seguro, consulte a su proveedor."
SOLO_SETUP_LBL_LIVESITE="URL de Akeeba Solo"
SOLO_SETUP_LBL_LIVESITE_HELP="En la mayoría de los servidores puede dejar este campo vacío y se determinará automáticamente. Si su servidor pertenece a la minoría en que esto no funciona, proporcione manualmente la URL de Akeeba Solo."
SOLO_SETUP_LBL_MANUALCONFIGINSTRUCTIONS="Seleccione todo el texto que aparece a continuación y cópielo en un nuevo archivo de texto sin formato. Asigne al archivo el nombre <code>config.php</code>. A continuación, súbalo al directorio <code>Solo/assets/private</code> dentro del directorio de Akeeba Solo. Después podrá empezar a usar Akeeba Solo con normalidad."
SOLO_SETUP_LBL_RECOMMENDED="Estos ajustes son los recomendados para PHP con el fin de garantizar la plena compatibilidad con Akeeba Solo. No obstante, Akeeba Solo seguirá funcionando aunque su configuración no coincida exactamente con la configuración recomendada."
SOLO_SETUP_LBL_RECOMMENDED_VALUE="Recomendado"
SOLO_SETUP_LBL_REQUIRED="Si alguno de estos elementos no es compatible (marcado como No), tome medidas para corregirlo. No hacerlo podría provocar que su instalación de Akeeba Solo no funcione correctamente."
SOLO_SETUP_LBL_REQUIREDREDTEXT="Algunos de los ajustes requeridos en su servidor parecen ser incompatibles con Akeeba Solo. Puede ignorarlos e intentar continuar, pero es posible que Akeeba Solo no funcione. Si no sabe qué significan ni cómo solucionarlos, consulte a su proveedor."
SOLO_SETUP_LBL_REQ_CONFIGJSON="Solo/assets/private/config.php con permisos de escritura"
