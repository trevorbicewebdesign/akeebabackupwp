COM_AKEEBA_TRANSFER_DESC="Transfiere el archivo comprimido ejecutando el motor de postprocesamiento «%s» sobre dicho archivo."
COM_AKEEBA_TRANSFER_ERR_CANNOTACCESSTESTFILE="Akeeba Backup no puede verificar que la información de conexión introducida corresponda a la URL del sitio que ha indicado. Si está intentando restaurar dentro de un subdirectorio de un sitio existente, significa que el sitio principal está bloqueando el acceso al subdirectorio; contacte con el administrador del sitio. En cualquier otro caso, ha introducido información de conexión incorrecta, probablemente un directorio incorrecto. Contacte con su proveedor de alojamiento y solicítele la información de conexión correcta, <em>incluido el directorio</em>, que corresponde a la URL que ha introducido en este asistente. Después, vuelva aquí, introduzca la información correcta y continúe con la restauración."
COM_AKEEBA_TRANSFER_ERR_CANNOTREADLOCALFILE="Akeeba Backup no puede leer el archivo de copia de seguridad local <code>%s</code>. Este asistente ha fallado. Realice una nueva copia de seguridad e inténtelo de nuevo. Tenga en cuenta que se han dejado archivos en su nuevo servidor; es posible que desee eliminarlos manualmente."
COM_AKEEBA_TRANSFER_ERR_CANNOTRUNKICKSTART="Akeeba Backup no puede ejecutar Akeeba Kickstart en su nuevo sitio. Si está intentando restaurar dentro de un subdirectorio de un sitio existente, significa que el sitio principal está bloqueando el acceso al subdirectorio; contacte con el administrador del sitio. En cualquier otro caso, contacte con su proveedor de alojamiento y verifique que su versión de PHP predeterminada cumple los requisitos mínimos de Kickstart."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADARCHIVE="Akeeba Backup no puede subir el archivo de copia de seguridad <code>%s</code>. Es posible que el servidor de su nuevo sitio se haya quedado sin espacio en disco o que alguna protección del servidor esté bloqueando la transmisión de datos. Intente transferir su sitio seleccionando la opción de transferencia manual. Tenga en cuenta que se han dejado archivos en su nuevo servidor; es posible que desee eliminarlos manualmente."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADKICKSTART="Akeeba Backup no puede subir Akeeba Kickstart al directorio raíz de su nuevo sitio. Compruebe que ha introducido la información de conexión correcta y que el usuario FTP/SFTP puede escribir archivos en el directorio seleccionado. Si ya dispone de kickstart.php y kickstart.transfer.php en el sitio remoto, elimínelos antes de reintentar la transferencia del sitio."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTEMP="Akeeba Backup no puede subir un fragmento de su archivo de copia de seguridad desde el archivo local <code>%s</code> al archivo remoto <code>%s</code>. Compruebe que su servidor remoto permite subir archivos y que dispone de suficiente espacio en disco para su(s) archivo(s) de copia de seguridad."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTESTFILE="Akeeba Backup no puede subir un archivo de prueba llamado <code>%s</code> al directorio raíz de su nuevo sitio. Compruebe que ha introducido la información de conexión correcta y que el usuario FTP/SFTP puede escribir archivos en el directorio seleccionado."
COM_AKEEBA_TRANSFER_ERR_CANNOTWRITEREMOTEFILES="Desafortunadamente, Akeeba Backup ha determinado que no puede escribir directamente en archivos de su servidor remoto. Este asistente no puede continuar. Deberá usar el método de transferencia «Manual»."
COM_AKEEBA_TRANSFER_ERR_CANTCREATETEMPCHUNK="No se puede crear un archivo temporal en este servidor. Compruebe que su directorio temporal está configurado correctamente y tiene permisos de escritura para el usuario con el que se ejecuta el servidor web."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP="No se encuentra ninguna copia de seguridad. Haga clic en el botón Hacer copia de seguridad ahora para realizar una nueva copia de seguridad."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP_SPECIFIC="La copia de seguridad n.º %d no se puede transferir. O bien no es una copia de seguridad completa del sitio, o bien sus archivos ya no están presentes en este servidor."
COM_AKEEBA_TRANSFER_ERR_DNS="El nombre de dominio de la URL introducida (%s) no se puede resolver desde el servidor en el que se ejecuta Akeeba Backup. Si ha registrado o transferido recientemente el nombre de dominio, espere a que los servidores DNS se actualicen (normalmente entre 6 y 48 horas). De lo contrario, compruebe la configuración DNS de su nombre de dominio."
COM_AKEEBA_TRANSFER_ERR_ERRORFROMREMOTE="Akeeba Backup ha recibido un error del servidor remoto al intentar subir el archivo de copia de seguridad. El error fue: %s"
COM_AKEEBA_TRANSFER_ERR_EXISTINGSITE="Ya existe otro sitio en esa ubicación. Elimine el sitio existente antes de transferir uno nuevo. Intentar sobrescribir un sitio existente probablemente resultará en un sitio dañado que no podrá reparar."
COM_AKEEBA_TRANSFER_ERR_HTACCESS="Se encontró un archivo <code>%s</code> en el directorio raíz de su nuevo sitio. Este archivo puede interferir con el proceso de transferencia del sitio. Elimínelo antes de continuar con la transferencia. Tenga en cuenta que el archivo puede estar <em>oculto</em>. Si no lo ve en el explorador de archivos de su panel de control de alojamiento o en su cliente FTP, consulte a su proveedor de alojamiento para obtener más información sobre cómo eliminarlo."
COM_AKEEBA_TRANSFER_ERR_INVALIDID="ID de subida no válido especificado"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN="Comprobar"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN_IGNOREERROR="Deseo ignorar esta advertencia y continuar <strong>bajo mi propia responsabilidad</strong>"
COM_AKEEBA_TRANSFER_ERR_NEWURL_INVALID="La URL introducida no es válida."
COM_AKEEBA_TRANSFER_ERR_NEWURL_NOTEXISTS="Su servidor no puede acceder a la URL introducida. Compruebe que la ha escrito correctamente. Tenga en cuenta también que los nombres de dominio recién asignados o transferidos pueden tardar <strong>hasta 48 horas</strong> en ser visibles para todos los servidores y equipos conectados a Internet."
COM_AKEEBA_TRANSFER_ERR_NEWURL_SAME="La URL introducida es la misma desde la que está restaurando. Esta operación no es compatible con este asistente. Para restaurar una copia de seguridad sin utilizar el asistente, consulte nuestro vídeo tutorial en el enlace que aparece a continuación."
COM_AKEEBA_TRANSFER_ERR_NOTENOUGHSPACE="La transferencia del sitio no puede continuar. Necesita aproximadamente %s de espacio libre, pero su servidor indica que actualmente solo dispone de %s. Libere más espacio en su servidor."
COM_AKEEBA_TRANSFER_ERR_OVERRIDE="Ignorar los errores detectados y transferir el sitio de todos modos"
COM_AKEEBA_TRANSFER_ERR_SAMESITE="Ha introducido la información de conexión del sitio desde el que está transfiriendo. <strong>Su error habría eliminado su propio sitio</strong>. Debe introducir la información de conexión FTP/SFTP del sitio <strong>de destino</strong> (nuevo sitio o nuevo servidor). Corrija la información anterior y vuelva a intentarlo."
COM_AKEEBA_TRANSFER_ERR_SPACE="Solo dispone de <span></span> de espacio libre. Necesita más espacio libre para transferir su sitio. Póngase en contacto con su proveedor de alojamiento."
COM_AKEEBA_TRANSFER_ERR_WRONGSSL="Su sitio tiene un certificado SSL no válido o autofirmado. Por razones de seguridad, la transferencia del sitio no puede continuar. Haga clic en Restablecer para reiniciar la transferencia del sitio y utilice una URL sin <code>https://</code>. Esto es necesario cuando intenta transferir su sitio antes de transferir el nombre de dominio al nuevo proveedor de alojamiento. También puede ponerse en contacto con su proveedor de alojamiento para obtener un certificado SSL válido. Incluso uno gratuito emitido por la autoridad de certificación Let's Encrypt será suficiente."
COM_AKEEBA_TRANSFER_FORCE_BODY="Está ejecutando el Asistente de transferencia de sitio en modo forzado. Esto significa que algunas comprobaciones de integridad que normalmente se ejecutan antes de la transferencia del sitio no se llevarán a cabo. Como resultado, la transferencia podría sobrescribir un sitio existente, terminar en una URL diferente a la esperada o simplemente fallar. <strong>Esta es una función para usuarios avanzados. Por favor, no continúe si no se siente seguro con ello.</strong>"
COM_AKEEBA_TRANSFER_FORCE_HEADER="Modo forzado activado"
