COM_AKEEBA_MIGREIGHT_TITLE="Migration de sauvegarde"
COM_AKEEBA_MIGREIGHT_GO_BACK_PROMPT="Vous pouvez retourner en toute sécurité à la page d'accueil (panneau de contrôle) d'Akeeba Backup."
COM_AKEEBA_MIGREIGHT_NOT_NEEDED_TITLE="Aucune migration nécessaire (c'est une bonne nouvelle !)"
COM_AKEEBA_MIGREIGHT_NOT_NEEDED_INFO="Vos profils de sauvegarde et vos archives de sauvegarde semblent se trouver en dehors du dossier du plugin. C'est parfait ! Vous pouvez mettre à jour Akeeba Backup en toute sécurité, sans risquer de perdre vos archives de sauvegarde."
COM_AKEEBA_MIGREIGHT_NEEDED_TITLE="Migration nécessaire"
COM_AKEEBA_MIGREIGHT_NEEDED_WHY="WordPress supprime toujours le dossier du plugin à chaque mise à jour. Par conséquent, toutes les archives de sauvegarde stockées dans le dossier du plugin seront <em>perdues définitivement</em>. Ce serait comme si vous n'aviez jamais effectué de sauvegarde."
COM_AKEEBA_MIGREIGHT_NEEDED_WHAT="Akeeba Backup détecte ce problème et vous permet de modifier automatiquement le répertoire de sortie des sauvegardes pour qu'il se trouve sous <code>%s</code>, et de déplacer vos fichiers d'archives de sauvegarde existants vers ce même dossier."
COM_AKEEBA_MIGREIGHT_NEEDED_PROFILES_N="Akeeba Backup a détecté %d profils de sauvegarde dont le répertoire de sortie des sauvegardes doit être modifié :"
