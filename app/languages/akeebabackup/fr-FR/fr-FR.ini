COM_AKEEBA_CONFIG="Configuration"
COM_AKEEBA_CONFIG_ADVANCED="Configuration avancée"
COM_AKEEBA_CONFIG_ADVANCED_SBALF_DESC="Akeeba Backup interrompra l'étape de traitement après l'archivage d'un fichier volumineux. Lorsque vous activez cette option, Akeeba Backup fonctionnera plus rapidement. Cependant, cela peut entraîner des erreurs de délai d'expiration ou des erreurs internes du serveur."
COM_AKEEBA_CONFIG_ADVANCED_SBALF_LABEL="Désactiver l'interruption d'étape après les fichiers volumineux"
COM_AKEEBA_CONFIG_ADVANCED_SBBD_LABEL="Désactiver l'interruption d'étape entre les domaines"
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_DESC="Akeeba Backup interrompra l'étape de traitement avant l'archivage d'un fichier volumineux. Lorsque vous activez cette option, Akeeba Backup fonctionnera plus rapidement. Cependant, cela peut entraîner des erreurs de délai d'expiration ou des erreurs internes du serveur."
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_LABEL="Désactiver l'interruption d'étape avant les fichiers volumineux"
COM_AKEEBA_CONFIG_ADVANCED_SBPA_DESC="Akeeba Backup interrompra l'étape de traitement s'il estime qu'il manquera de temps avant d'archiver un fichier. Ce calcul n'est pas entièrement précis et peut entraîner des sauvegardes plus lentes. Lorsque vous activez cette option, Akeeba Backup fonctionnera plus rapidement. Cependant, cela peut entraîner des erreurs de délai d'expiration ou des erreurs internes du serveur."
COM_AKEEBA_CONFIG_ADVANCED_SBPA_LABEL="Désactiver l'interruption d'étape proactive"
COM_AKEEBA_CONFIG_ADVANCED_SBPP_DESC="Akeeba Backup interrompra l'étape de traitement entre les sous-étapes de la finalisation et du post-traitement de la sauvegarde. Cela peut ajouter environ 10 secondes à la durée totale de la sauvegarde. Lorsque vous activez cette option, Akeeba Backup fonctionnera plus rapidement. Cependant, cela peut entraîner des erreurs de délai d'expiration ou des erreurs internes du serveur."
COM_AKEEBA_CONFIG_ADVANCED_SBPP_LABEL="Désactiver l'interruption d'étape lors de la finalisation"
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_DESC="Indique à Akeeba Backup d'essayer d'augmenter la limite de mémoire de PHP à une valeur très élevée (16 Go). Cela vous permet de compresser des fichiers plus volumineux et de téléverser des archives de sauvegarde plus grandes en utilisant des options de stockage distant gourmandes en mémoire, telles que WebDAV. Remarque : cela définit uniquement la limite de consommation mémoire maximale. Dans la plupart des cas, le moteur de sauvegarde d'Akeeba Backup consomme <em>bien moins</em> de mémoire que cela, généralement autour de 20 Mo. La compression et le téléversement de fichiers plus volumineux nécessitent également la modification d'autres options dans la page de Configuration du profil de sauvegarde."
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_LABEL="Définir une limite de mémoire élevée"
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_DESC="Si votre serveur n'exécute pas PHP en mode Safe Mode et prend en charge set_time_limit(), Akeeba Backup tentera de définir un temps d'exécution PHP maximal infini pour contourner les problèmes potentiels de délai d'expiration."
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_LABEL="Définir un délai d'exécution PHP illimité"
COM_AKEEBA_CONFIG_ANGIE_KEY_DESCRIPTION="Si vous utilisez le script d'installation intégré ANGIE, vous pouvez éventuellement le protéger par mot de passe, empêchant ainsi tout accès non autorisé à l'installateur. Lors de l'exécution de l'installateur, vous serez invité à saisir ce mot de passe. Veuillez noter que le mot de passe est sensible à la casse, c'est-à-dire que ABC, abc et Abc sont trois mots de passe différents."
COM_AKEEBA_CONFIG_ANGIE_KEY_TITLE="Mot de passe ANGIE"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_DESC="Envoyer un courriel à cette adresse (laisser vide désactive cette fonctionnalité)"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_LABEL="Adresse courriel"
COM_AKEEBA_CONFIG_ARCHIVENAME_DESCRIPTION="Modèle de nommage pour l'archive de sauvegarde, le cas échéant. Vous pouvez utiliser les macros suivantes :<ul><li><b>[HOST]</b> Le nom d'hôte. AVERTISSEMENT ! Cette balise ne fonctionne pas en mode CRON.</li><li><b>[DATE]</b> Date actuelle</li><li><b>[TIME_TZ]</b> Heure actuelle et fuseau horaire</li></ul>D'autres sont disponibles ; veuillez consulter la documentation."
COM_AKEEBA_CONFIG_ARCHIVENAME_TITLE="Nom de l'archive de sauvegarde"
COM_AKEEBA_CONFIG_ARCHIVERENGINE_DESCRIPTION="Définit le format d'archive d'Akeeba Backup. Certains moteurs, tels que DirectFTP, ne produisent pas réellement d'archives, mais se chargent de transférer vos fichiers vers d'autres serveurs."
COM_AKEEBA_CONFIG_ARCHIVERENGINE_TITLE="Moteur d'archivage"
COM_AKEEBA_CONFIG_AUTORESUME_DESCRIPTION="Lorsque cette option est décochée, Akeeba Backup interrompt la sauvegarde lorsque le serveur répond avec une erreur. Lorsque cette option est activée, Akeeba Backup tentera de reprendre la sauvegarde en répétant la dernière étape. Cela s'applique uniquement aux sauvegardes en interface d'administration. Cela ne permettra pas non plus de reprendre avec succès toutes les sauvegardes qui se terminent par une erreur : seules les tentatives de sauvegarde temporairement bloquées par des restrictions d'utilisation du processeur du serveur ou des problèmes de panne réseau peuvent être reprises."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_DESCRIPTION="Combien de fois Akeeba Backup doit-il tenter de reprendre la sauvegarde avant d'abandonner définitivement. 3 à 5 tentatives fonctionnent mieux sur la plupart des serveurs."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_TITLE="Nombre maximum de tentatives d'une étape de sauvegarde après une erreur AJAX"
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_DESCRIPTION="Combien de secondes attendre avant de reprendre la sauvegarde. Il est conseillé de définir cette valeur à 30 secondes ou plus (120 secondes sont recommandées dans la plupart des cas) pour laisser à votre serveur le temps nécessaire pour débloquer le processus de sauvegarde avant qu'Akeeba Backup ne tente de le terminer."
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_TITLE="Délai d'attente avant de réessayer l'étape de sauvegarde"
COM_AKEEBA_CONFIG_AUTORESUME_TITLE="Reprendre la sauvegarde après une erreur AJAX"
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_DESCRIPTION="Le nom de votre compte. Si votre point de terminaison est foobar.blob.core.windows.net, votre nom de compte est <b>foobar</b> et vous devez saisir <em>foobar</em> dans ce champ."
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_TITLE="Nom du compte"
COM_AKEEBA_CONFIG_AZURE_CONTAINER_DESCRIPTION="Le conteneur Windows Azure BLOB Storage destiné à stocker les archives de sauvegarde. Le conteneur doit déjà exister."
COM_AKEEBA_CONFIG_AZURE_CONTAINER_TITLE="Conteneur"
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_DESCRIPTION="Le répertoire au sein du conteneur Windows Azure BLOB Storage dans lequel stocker les archives de sauvegarde. Pour tout stocker à la racine du conteneur, veuillez laisser ce champ vide."
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_AZURE_KEY_DESCRIPTION="Vous pouvez trouver votre clé d'accès principale sur la page de votre compte sur windows.azure.com. Copiez-la et collez-la ici. Elle se termine toujours par deux signes égal."
COM_AKEEBA_CONFIG_AZURE_KEY_TITLE="Clé d'accès principale"
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_DESCRIPTION="Saisissez l'identifiant de votre clé d'application BackBlaze. Vous pouvez trouver ces informations dans <a href='https://secure.backblaze.com/b2_buckets.htm'>votre page de compte BackBlaze</a> après avoir cliqué sur « Show Account ID and Application Key ». Si vous utilisez votre clé principale, veuillez saisir votre identifiant de compte à la place."
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_TITLE="Identifiant de la clé d'application"
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_DESCRIPTION="Saisissez votre clé d'application BackBlaze. Vous pouvez trouver ces informations dans <a href='https://secure.backblaze.com/b2_buckets.htm'>votre page de compte BackBlaze</a> après avoir cliqué sur « Show Account ID and Application Key ». <strong>AVERTISSEMENT</strong> ! Celle-ci ne vous est affichée qu'UNE SEULE FOIS par BackBlaze. Pour l'afficher à nouveau, vous devrez régénérer la clé d'application, ce qui entraînera la dissociation de TOUTES les instances d'Akeeba Backup précédemment liées jusqu'à ce que vous y saisissiez la <em>nouvelle</em> clé d'application."
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_TITLE="Clé d'application"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_DESCRIPTION="Le nom de votre compartiment Backblaze"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_TITLE="Compartiment"
COM_AKEEBA_CONFIG_BACKBLAZE_DIRECTORY_DESCRIPTION="Le répertoire dans votre compartiment où les archives de sauvegarde seront stockées. Laissez vide pour stocker les fichiers à la racine du compartiment."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_DESCRIPTION="Lorsque vous activez cette option, Akeeba Backup effectue des téléversements en une seule partie vers Backblaze. Vous devrez utiliser une valeur plus petite pour le paramètre Taille des parties pour les archives fractionnées dans la configuration du moteur d'archivage, afin d'éviter que le téléversement n'expire et n'entraîne l'échec de la sauvegarde."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_TITLE="Désactiver les téléversements multipart"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_DESC="Doit-on convertir l'heure de début de sauvegarde dans le fuseau horaire de l'utilisateur actuellement connecté sur la page Gérer les sauvegardes ? Si cette option est désactivée, toutes les heures de début de sauvegarde s'affichent dans le fuseau horaire GMT. Cette option n'affecte PAS les variables [DATE] et [TIME] pour la dénomination des fichiers de sauvegarde ou la description par défaut ; utilisez l'option Fuseau horaire de la sauvegarde pour modifier le comportement de ces variables."
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_LABEL="Heure locale dans Gérer les sauvegardes"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_WP_DESC="Lorsque cette option est désactivée, l'heure de début de sauvegarde sur la page Gérer les sauvegardes s'affiche dans le fuseau horaire GMT. Lorsqu'elle est activée, l'heure de début de sauvegarde est affichée dans le fuseau horaire configuré dans WordPress (Réglages, Général, Fuseau horaire)."
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_DESC="Dois-je afficher l'option de téléchargement des archives de sauvegarde via le navigateur, même si cela est déconseillé ? Veuillez noter que cette option ne sera PAS disponible si WP_DEBUG est activé, ou si l'affichage des erreurs PHP est activé, comme précaution élémentaire contre les téléchargements corrompus (incomplets ou endommagés). <strong>AVERTISSEMENT ! En activant cette option, vous acceptez de ne recevoir aucun support pour les problèmes liés à l'extraction des archives de sauvegarde.</strong>"
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_LABEL="Autoriser le téléchargement des archives de sauvegarde via le navigateur"
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_DESC="Dois-je donner aux utilisateurs qui restaurent un site la possibilité de tout supprimer avant d'extraire une archive ? Cette option s'applique uniquement à la version Professionnelle de notre logiciel. AVERTISSEMENT ! CECI EST EXTRÊMEMENT DANGEREUX. LISEZ ATTENTIVEMENT LA DOCUMENTATION AVANT D'ACTIVER CETTE OPTION. SI VOUS UTILISEZ CETTE FONCTIONNALITÉ LORS DE LA RESTAURATION, VOUS RENONCEZ À TOUT DROIT DE DEMANDER UN SUPPORT ET ASSUMEZ L'ENTIÈRE RESPONSABILITÉ."
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_LABEL="Afficher l'option « Tout supprimer avant l'extraction »"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_ABBREVIATION="Fuseau horaire"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_DESC="Le suffixe de fuseau horaire à afficher à côté de l'heure de début de sauvegarde sur la page Gérer les sauvegardes.<br/>Aucun : aucun suffixe n'est affiché (déconseillé).<br/>Fuseau horaire : un fuseau horaire abrégé, par exemple CET pour Central Europe Time.<br/>Décalage GMT : le décalage par rapport au fuseau horaire GMT. Ce décalage peut varier en fonction de l'heure d'été. Par exemple, le fuseau horaire CET sera GMT+01:00 (une heure en avance sur GMT) en hiver et GMT+02:00 (deux heures en avance sur GMT) en été."
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_GMTOFFSET="Décalage GMT"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_LABEL="Suffixe de fuseau horaire"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_NONE="Aucun"
COM_AKEEBA_CONFIG_BACKUPTYPE_ALLDB="Toutes les bases de données configurées (fichier d'archive)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DBONLY="Base de données principale uniquement (fichier SQL)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DESCRIPTION="Quel type de sauvegarde de site vous souhaitez qu'Akeeba Backup effectue"
COM_AKEEBA_CONFIG_BACKUPTYPE_FILEONLY="Fichiers du site uniquement"
COM_AKEEBA_CONFIG_BACKUPTYPE_FULL="Sauvegarde complète du site"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFILE="Fichiers uniquement, incrémentiel"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFULL="Site complet, fichiers incrémentaux"
COM_AKEEBA_CONFIG_BACKUPTYPE_TITLE="Type de sauvegarde"
COM_AKEEBA_CONFIG_BACTHSIZE_DESCRIPTION="Réduire cette valeur permet d'économiser de la mémoire et d'éviter les erreurs HTTP 500 lors de la sauvegarde de tables très volumineuses"
COM_AKEEBA_CONFIG_BACTHSIZE_TITLE="Nombre de lignes par lot"
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_DESCRIPTION="Les fichiers dépassant cette taille seront stockés sans compression, ou leur traitement s'étendra sur plusieurs étapes (selon le moteur d'archivage) afin d'éviter les délais d'expiration. Nous vous conseillons d'augmenter cette valeur uniquement sur des serveurs rapides et fiables."
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_TITLE="Seuil des fichiers volumineux"
COM_AKEEBA_CONFIG_BLANKOUTPASS_DESCRIPTION="Supprime le nom d'utilisateur et le mot de passe des connexions à la base de données de la sauvegarde"
COM_AKEEBA_CONFIG_BLANKOUTPASS_TITLE="Effacer le nom d'utilisateur/mot de passe"
COM_AKEEBA_CONFIG_BOX_ACCESSTOKEN_TITLE="Jeton d'accès"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_ENABLE="Activer le téléversement par segments"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_SIZE="Taille des segments"
COM_AKEEBA_CONFIG_BOX_DIRECTORY_DESCRIPTION="Le répertoire dans votre compte Box où les archives de sauvegarde seront stockées. Laissez vide pour stocker les fichiers à la racine du dossier Box."
COM_AKEEBA_CONFIG_BOX_DIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_DESC="Cliquez sur ce bouton pour ouvrir une nouvelle fenêtre dans laquelle vous pouvez vous connecter à votre compte chez le fournisseur de stockage. Fermez ensuite la fenêtre contextuelle et cliquez sur le bouton Étape 2 ci-dessous."
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_TITLE="Authentification - Étape 1"
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_DESCRIPTION="Renseigné automatiquement lorsque vous terminez l'étape 1 de l'authentification ci-dessus. Ne partagez PAS le même jeton sur plusieurs sites. Authentifiez chaque site séparément."
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_TITLE="Jeton d'actualisation"
COM_AKEEBA_CONFIG_CHUNKSIZE_DESCRIPTION="Akeeba Backup traite les fichiers volumineux en petits segments, afin d'éviter les délais d'expiration. Ce paramètre définit la taille maximale des segments pour ce type de traitement."
COM_AKEEBA_CONFIG_CHUNKSIZE_TITLE="Taille des segments pour le traitement des fichiers volumineux"
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_DESCRIPTION="Lorsque cette case est décochée (par défaut) et que l'étape de sauvegarde se termine en moins de temps que la durée d'exécution minimale configurée, Akeeba Backup demande au serveur d'attendre jusqu'à ce que cette durée soit atteinte. Cela peut amener certains serveurs très restrictifs à interrompre votre sauvegarde. Cocher cette case permet d'implémenter le temps d'attente côté navigateur, contournant ainsi cette limitation. IMPORTANT : cette option s'applique uniquement aux sauvegardes depuis l'interface d'administration. Les sauvegardes frontales, via l'API JSON (distantes) et en ligne de commande (CLI) implémentent toujours l'attente côté serveur."
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_TITLE="Implémentation côté client de la durée d'exécution minimale"
COM_AKEEBA_CONFIG_CLOUDFILESAPIKEY_DESCRIPTION="Votre clé API CloudFiles"
COM_AKEEBA_CONFIG_CLOUDFILESAPIKEY_TITLE="Clé API"
COM_AKEEBA_CONFIG_CLOUDFILESCONTAINER_DESCRIPTION="Le conteneur CloudFiles destiné à stocker les archives de sauvegarde"
COM_AKEEBA_CONFIG_CLOUDFILESCONTAINER_TITLE="Conteneur"
COM_AKEEBA_CONFIG_CLOUDFILESDIRECTORY_DESCRIPTION="Le répertoire dans le conteneur CloudFiles où stocker les archives de sauvegarde. Pour tout stocker à la racine du conteneur, laissez ce champ vide."
COM_AKEEBA_CONFIG_CLOUDFILESDIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_CLOUDFILESUSERNAME_DESCRIPTION="Votre nom d'utilisateur CloudFiles"
COM_AKEEBA_CONFIG_CLOUDFILESUSERNAME_TITLE="Nom d'utilisateur"
COM_AKEEBA_CONFIG_CLOUDME_DIRECTORY_DESCRIPTION="Le répertoire dans votre compte CloudMe où les archives de sauvegarde seront stockées. Laissez vide pour stocker les fichiers à la racine du dossier CloudMe."
COM_AKEEBA_CONFIG_CLOUDME_DIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_CLOUDME_PASSWORD_DESCRIPTION="Mot de passe"
COM_AKEEBA_CONFIG_CLOUDME_PASSWORD_TITLE="Mot de passe"
COM_AKEEBA_CONFIG_CLOUDME_USERNAME_DESCRIPTION="Nom d'utilisateur"
COM_AKEEBA_CONFIG_CLOUDME_USERNAME_TITLE="Nom d'utilisateur"
COM_AKEEBA_CONFIG_COUNTQUOTA_ENABLE_DESCRIPTION="Lorsque cette option est activée, Akeeba Backup supprimera les anciens fichiers de sauvegarde s'ils dépassent la limite définie ci-dessous."
COM_AKEEBA_CONFIG_COUNTQUOTA_ENABLE_TITLE="Activer le quota par nombre"
COM_AKEEBA_CONFIG_COUNTQUOTA_VALUE_DESCRIPTION="Akeeba Backup supprimera les anciens fichiers de sauvegarde s'ils dépassent la limite définie dans ce paramètre. Les sauvegardes en plusieurs parties sont comptées comme <i>un</i> seul fichier !<br/><br/><b>Conseil</b> : sélectionnez Personnalisé et saisissez la valeur souhaitée si elle n'est pas dans la liste."
COM_AKEEBA_CONFIG_COUNTQUOTA_VALUE_TITLE="Quota par nombre"
COM_AKEEBA_CONFIG_DATEFORMAT_DESC="Modifiez l'affichage de la date/heure de début des sauvegardes sur la page Gérer les sauvegardes. Laissez vide pour utiliser le format par défaut. Vous pouvez utiliser les options de formatage de la fonction date de PHP, voir : http://www.php.net/manual/en/function.date.php"
COM_AKEEBA_CONFIG_DATEFORMAT_LABEL="Format de date"
COM_AKEEBA_CONFIG_DELETEAFTER_DESCRIPTION="Si cette option est activée, l'archive de sauvegarde sera supprimée de ce serveur dès que le post-traitement se termine avec succès."
COM_AKEEBA_CONFIG_DELETEAFTER_TITLE="Supprimer l'archive après traitement"
COM_AKEEBA_CONFIG_DEREFERENCESYMLINKS_DESCRIPTION="Lorsque cette option est activée, les liens symboliques sont suivis comme des fichiers et répertoires normaux. Lorsqu'elle est désactivée, les liens symboliques ne sont pas suivis. Si vous utilisez des liens symboliques créant une boucle infinie, désactivez cette option."
COM_AKEEBA_CONFIG_DEREFERENCESYMLINKS_TITLE="Suivre les liens symboliques"
COM_AKEEBA_CONFIG_DESKTOP_NOTIFICATIONS_DESC="Doit-on vous demander l'autorisation d'afficher des notifications de bureau ? Les notifications de bureau apparaissent lorsqu'une sauvegarde démarre, se termine, génère un avertissement ou s'interrompt. Elles s'affichent uniquement sur les navigateurs compatibles (généralement : Chrome, Safari, Firefox, Opera) si vous accordez à Akeeba Backup la permission d'afficher des notifications de bureau lorsque vous y êtes invité sur la page du Panneau de contrôle. Cette option contrôle uniquement si cette invite doit être affichée. Une fois que vous avez accepté ou refusé les permissions de notifications de bureau, ce paramètre n'a <b>aucun effet</b>. La seule façon d'activer ou de désactiver les notifications de bureau sera via les paramètres de votre navigateur."
COM_AKEEBA_CONFIG_DESKTOP_NOTIFICATIONS_LABEL="Demander les permissions de notifications de bureau"
COM_AKEEBA_CONFIG_DIRECTFTP_FTPS_DESCRIPTION="Si cette option est activée, Akeeba Backup tentera de se connecter à votre serveur FTP en utilisant une connexion chiffrée SSL. <strong>Ceci n'est pas la même chose que SFTP, SCP ou le « FTP sécurisé » !</strong> Veuillez noter que si votre serveur ne prend pas en charge cette méthode, vous obtiendrez des erreurs de connexion."
COM_AKEEBA_CONFIG_DIRECTFTP_FTPS_TITLE="Utiliser FTP via SSL (FTPS)"
COM_AKEEBA_CONFIG_DIRECTFTP_HOST_DESCRIPTION="Le nom d'hôte du serveur FTP, sans le protocole. Cela signifie que <tt>ftp://example.com</tt> est <b>invalide</b> et que <tt>example.com</tt> est valide. Akeeba Backup prend uniquement en charge les serveurs FTP et FTPS. Il <u>ne prend pas</u> en charge SFTP, SCP et autres variantes SSH."
COM_AKEEBA_CONFIG_DIRECTFTP_HOST_TITLE="Nom d'hôte"
COM_AKEEBA_CONFIG_DIRECTFTP_INITDIR_DESCRIPTION="Le chemin <b>FTP</b> absolu vers le répertoire où les fichiers seront téléversés. En cas de doute, connectez-vous à votre serveur avec FileZilla, accédez au répertoire souhaité et copiez le chemin affiché dans le volet droit au-dessus de la liste des répertoires. Il s'agit généralement d'un chemin court, comme <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_DIRECTFTP_INITDIR_TITLE="Répertoire initial"
COM_AKEEBA_CONFIG_DIRECTFTP_PASSIVE_DESCRIPTION="Utiliser le mode passif FTP pour le transfert de données. Cette option est activée par défaut car c'est la seule méthode fonctionnant à travers les pare-feux généralement installés sur les serveurs web. Ne la désactivez pas, sauf si vous êtes certain que votre serveur web n'est pas derrière un pare-feu et que votre serveur FTP requiert absolument les transferts en mode actif."
COM_AKEEBA_CONFIG_DIRECTFTP_PASSIVE_TITLE="Utiliser le mode passif"
COM_AKEEBA_CONFIG_DIRECTFTP_PASSWORD_DESCRIPTION="Le mot de passe du serveur FTP. Il est généralement sensible à la casse. En cas de doute, veuillez contacter votre administrateur réseau."
COM_AKEEBA_CONFIG_DIRECTFTP_PASSWORD_TITLE="Mot de passe"
COM_AKEEBA_CONFIG_DIRECTFTP_PORT_DESCRIPTION="Le port du serveur FTP. Le paramètre le plus courant est 21. En cas de doute, veuillez contacter votre administrateur réseau."
COM_AKEEBA_CONFIG_DIRECTFTP_PORT_TITLE="Port"
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_DESCRIPTION="Utilisez ce bouton pour tester la connexion FTP et afficher les erreurs de connexion en cas d'échec."
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_FAIL="Impossible de se connecter au serveur FTP distant."
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_OK="La connexion au serveur FTP distant a été établie avec succès !"
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_TITLE="Tester la connexion FTP"
COM_AKEEBA_CONFIG_DIRECTFTP_USER_DESCRIPTION="Nom d'utilisateur du serveur FTP. Il est généralement sensible à la casse. En cas de doute, veuillez contacter votre administrateur réseau."
COM_AKEEBA_CONFIG_DIRECTFTP_USER_TITLE="Nom d'utilisateur"
COM_AKEEBA_CONFIG_DIRECTSFTP_HOST_DESCRIPTION="Veuillez saisir le nom d'hôte ou l'adresse IP de votre serveur SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_HOST_TITLE="Nom d'hôte"
COM_AKEEBA_CONFIG_DIRECTSFTP_INITDIR_DESCRIPTION="Veuillez saisir le répertoire dans lequel les fichiers seront téléversés. En cas de doute, utilisez un client SFTP de bureau, connectez-vous à votre serveur, naviguez jusqu'au répertoire souhaité et copiez le chemin affiché ici. Le chemin doit être au format absolu, par exemple /users/monutilisateur/public_html"
COM_AKEEBA_CONFIG_DIRECTSFTP_INITDIR_TITLE="Répertoire initial"
COM_AKEEBA_CONFIG_DIRECTSFTP_PASSWORD_DESCRIPTION="Le mot de passe SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_PASSWORD_TITLE="Mot de passe"
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_DESCRIPTION="Le port habituel pour les connexions SFTP est le 22. Si votre serveur utilise un port différent, veuillez le saisir ici."
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_TITLE="Port"
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_DESCRIPTION="Utilisez ce bouton pour tester la connexion SFTP et afficher les erreurs de connexion en cas d'échec."
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_FAIL="Impossible de se connecter au serveur SFTP distant. Le message d'erreur était :"
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_OK="Connexion au serveur SFTP distant établie avec succès. Remarque : le paramètre de répertoire initial n'a pas été testé."
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_TITLE="Tester la connexion SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_DESCRIPTION="Le nom d'utilisateur SFTP. Veuillez noter que votre serveur SFTP doit autoriser l'authentification par nom d'utilisateur et mot de passe."
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_TITLE="Nom d'utilisateur"
COM_AKEEBA_CONFIG_DOWNLOADID_DESC="Ceci est requis pour activer les mises à jour en direct de la version Professional. Veuillez visiter https://www.akeeba.com/my-subscriptions.html pour obtenir votre identifiant de téléchargement personnel."
COM_AKEEBA_CONFIG_DOWNLOADID_LABEL="Identifiant de téléchargement"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_DESCRIPTION="Votre clé d'accès DreamObjects, disponible dans le panneau de contrôle DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_TITLE="Clé d'accès"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_DESCRIPTION="Le nom de votre compartiment DreamObjects. Assurez-vous de le saisir tel qu'il apparaît dans le panneau de contrôle DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_TITLE="Compartiment"
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_DESCRIPTION="Le répertoire dans votre compartiment où les archives de sauvegarde seront stockées. Laissez vide pour stocker les fichiers à la racine du compartiment."
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_DESCRIPTION="Si activé, Akeeba Backup tentera de convertir le nom du compartiment en minuscules, par exemple MonCompartiment deviendra moncompartiment. Si vous avez créé un compartiment avec des majuscules, par exemple MonNouveauCompartiment, décochez cette option et assurez-vous que le nom du compartiment est orthographié exactement tel qu'il apparaît dans votre panneau de contrôle DreamHost."
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_TITLE="Nom de compartiment en minuscules"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_DESCRIPTION="Votre clé secrète DreamObjects, disponible dans le panneau de contrôle DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_TITLE="Clé secrète"
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_DESCRIPTION="Si activé, une connexion sécurisée (HTTPS) sera utilisée lors du téléversement de vos fichiers. Bien que cela renforce la sécurité des données transférées, cela augmente également le risque d'échec de la sauvegarde en raison de délais d'expiration."
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_TITLE="Utiliser SSL"
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_DESCRIPTION="Le répertoire dans votre compte Dropbox où les archives de sauvegarde seront stockées. Laissez vide pour stocker les fichiers à la racine."
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_DESCRIPTION="Il s'agit du jeton d'actualisation qui connecte Akeeba Backup à Dropbox. Il est <strong>spécifique au site</strong> et sert à ré-autoriser la connexion Dropbox lorsque le jeton d'accès de courte durée expire. Si vous avez plusieurs sites, vous devez utiliser les boutons Étape 1 sur chacun des sites que vous souhaitez autoriser. Veuillez <strong>NE PAS</strong> copier le jeton d'accès ou d'actualisation sur plusieurs sites. Cela désynchronisera l'authentification Dropbox et vous devrez reconnecter tous vos sites avec Dropbox."
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_TITLE="Jeton d'actualisation"
COM_AKEEBA_CONFIG_DROPBOXTOKEN_DESCRIPTION="Il est automatiquement récupéré depuis Dropbox lorsque vous cliquez sur le bouton Étape 2 ci-dessus. Si vous avez plusieurs sites, vous devez utiliser les boutons Étape 1 et Étape 2 uniquement sur le PREMIER site que vous souhaitez autoriser. Copiez ensuite le jeton, la clé secrète du jeton et l'identifiant utilisateur du premier site vers tous les autres sites que vous souhaitez connecter à Dropbox."
COM_AKEEBA_CONFIG_DROPBOXTOKEN_TITLE="Jeton d'accès"
COM_AKEEBA_CONFIG_DROPBOX_TEAM_DESC="Cochez cette option si vous êtes membre d'une équipe utilisant Dropbox for Business et souhaitez utiliser le dossier de votre équipe pour stocker les sauvegardes. N'oubliez pas de préfixer le répertoire ci-dessous par le nom de votre dossier d'équipe. Par exemple, si l'interface web de Dropbox affiche un «Acme Corp Team Folder» dans la page Fichiers et que vous souhaitez placer vos sauvegardes dans un dossier nommé «Backups» à l'intérieur, vous devez utiliser le nom de répertoire <code>Acme Corp Team Folder/Backups</code>, et non simplement <code>Backups</code>."
COM_AKEEBA_CONFIG_DROPBOX_TEAM_TITLE="Dropbox for Business"
COM_AKEEBA_CONFIG_DUMPENGINE_DESCRIPTION="Définit la manière dont Akeeba Backup traitera vos bases de données afin de produire un fichier de sauvegarde de base de données."
COM_AKEEBA_CONFIG_DUMPENGINE_TITLE="Moteur de sauvegarde de base de données"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_COMMON="Paramètres communs"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_MYSQL="Paramètres MySQL"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_POSTGRES="Paramètres PostgreSQL"
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_DESCRIPTION="Les courriels seront envoyés à cette adresse plutôt qu'à celle configurée dans la page Configuration système, une fois la sauvegarde terminée ou en cas d'échec, le cas échéant. Vous pouvez séparer plusieurs adresses courriel par une virgule, par exemple alice@example.com, bob@example.com."
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_TITLE="Destinataires des courriels"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_DESCRIPTION="Transfère les fichiers du site vers un serveur FTP distant, sans les archiver au préalable. Ce moteur d'archivage utilise la bibliothèque cURL qui offre une meilleure compatibilité avec un large éventail de serveurs FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_DESCRIPTION="Certains serveurs FTP mal configurés ou défaillants renvoient une adresse IP incorrecte lorsque le mode passif FTP est activé. Activez cette option pour forcer la bibliothèque FTP à ignorer l'adresse IP incorrecte renvoyée par le serveur FTP et à utiliser à la place l'adresse IP publique du serveur FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_TITLE="Solution de contournement du mode passif"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_TITLE="DirectFTP via cURL"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_DESCRIPTION="Transfère les fichiers du site vers un serveur FTP distant, sans les archiver au préalable"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_TITLE="DirectFTP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_DESCRIPTION="Transfère les fichiers du site vers un serveur SFTP distant, sans les archiver au préalable. Ce moteur d'archivage utilise la bibliothèque cURL qui offre une meilleure compatibilité avec un large éventail de serveurs FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_TITLE="DirectSFTP via cURL"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_DESCRIPTION="Transfère les fichiers du site vers un serveur SFTP distant, sans les archiver au préalable. AVERTISSEMENT : votre serveur source doit avoir l'extension PHP SSL2 installée."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_TITLE="DirectSFTP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPA_DESCRIPTION="Un format d'archive open source optimisé pour la création et l'extraction rapides d'archives à l'aide de code PHP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPA_TITLE="Format JPA (recommandé)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_DESCRIPTION="Crée des archives chiffrées avec la méthode de chiffrement standard AES-128, dans un format très similaire au JPA. Requiert l'installation et l'activation de l'extension PHP mcrypt ou openssl sur votre site."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_TITLE="Archives chiffrées (JPS)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_DESCRIPTION="L'archive ZIP sera créée à l'aide de la classe ZipArchive de PHP. IMPORTANT : ce moteur ne prend pas en charge le fractionnement des archives ni la gestion des liens symboliques et peut donc entraîner des problèmes de sauvegarde. Si vous obtenez des erreurs de délai d'expiration, des erreurs AJAX ou des messages Erreur interne du serveur, vous devrez passer à un autre moteur d'archivage et activer le fractionnement des archives."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_TITLE="ZIP avec la classe ZipArchive"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIP_DESCRIPTION="Fichiers ZIP standard, également appelés «Dossiers compressés», nativement pris en charge par tous les principaux systèmes d'exploitation"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIP_TITLE="Format ZIP"
COM_AKEEBA_CONFIG_ENGINE_DUMP_NATIVE_DESCRIPTION="Utilise du code PHP pour produire un vidage précis de la base de données"
COM_AKEEBA_CONFIG_ENGINE_DUMP_NATIVE_TITLE="Moteur natif de sauvegarde MySQL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_AZURE_DESCRIPTION="Téléverse l'archive de sauvegarde vers Microsoft Windows Azure BLOB Storage."
