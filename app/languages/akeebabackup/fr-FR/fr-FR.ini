SOLO_CONFIG_PLATFORM_SITEURL_DESCRIPTION="(Facultatif) Saisissez l'URL du site que vous allez sauvegarder, par ex. <code>http://www.example.com</code>. Cela permet au script d'installation de déterminer si vous restaurez le site à l'identique ou si vous le clonez / transférez. Si vous ne précisez pas l'URL, le script de restauration vous demandera systématiquement de saisir les informations de connexion à la base de données, ce qui peut être déroutant lors d'une restauration sur le même site."
