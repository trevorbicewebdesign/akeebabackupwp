COM_AKEEBA_TRANSFER_LBL_CHUNKSIZE_INFO="Les fichiers d'archive de sauvegarde sont transférés par petits segments vers le serveur distant. Ce paramètre détermine la taille de ces segments. Des tailles trop petites peuvent amener le serveur distant à vous bloquer, vous prenant pour un utilisateur abusif, ce qui provoque l'affichage d'une erreur de téléversement. Des tailles trop grandes peuvent entraîner une erreur de délai d'expiration sur le serveur source ou distant, provoquant l'affichage d'une erreur AJAX. En général, des valeurs comprises entre 5M et 20M donnent les meilleurs résultats."
