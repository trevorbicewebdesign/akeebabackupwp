SOLO_MANAGE_LBL_HOWDOIRESTORE_CORE="Les utilisateurs de la version gratuite (Core) peuvent uniquement restaurer leurs sauvegardes manuellement à l'aide d'Akeeba Kickstart ou d'Akeeba eXtract Wizard. Pour plus d'informations, veuillez <a href='%s'>consulter notre documentation</a>. Veuillez souscrire à la version Professionnelle pour accéder à la fonctionnalité de restauration intégrée, beaucoup plus simple d'utilisation !"
SOLO_MANAGE_LBL_HOWDOIRESTORE_PRO="Vous pouvez sélectionner une sauvegarde dans la liste ci-dessous et cliquer sur le bouton Restaurer. Pour effectuer une restauration sur un autre serveur ou pour obtenir plus de détails sur la procédure de restauration, veuillez <a href='%s'>consulter notre documentation</a>."
SOLO_MANAGE_TITLE="Gérer les sauvegardes"
