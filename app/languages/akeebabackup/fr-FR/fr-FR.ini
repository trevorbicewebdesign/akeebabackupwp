COM_AKEEBA_CPANEL_LBL_INCLUDEEXCLUDE_CALLOUT="Les options d'inclusion et d'exclusion s'appliquent uniquement au profil de sauvegarde actif."
COM_AKEEBA_CPANEL_LBL_OUTDIR_CLICKTHEBUTTON="Cliquez sur le bouton ci-dessous pour résoudre ce problème. Voici ce qu'il fait."
COM_AKEEBA_CPANEL_LBL_OUTDIR_DELETEORBEHACKED="Jusqu'à ce que vous le fassiez, nous vous <strong>DÉCONSEILLONS TRÈS VIVEMENT</strong> d'effectuer une sauvegarde de votre site et, si vous en avez déjà effectué une, supprimez toutes les archives de sauvegarde et tous les fichiers journaux de sauvegarde. <strong>LE NON-RESPECT DE CES INSTRUCTIONS EXPOSERA TRÈS PROBABLEMENT VOTRE SITE À UNE COMPROMISSION (PIRATAGE).</strong>"
COM_AKEEBA_CPANEL_LBL_OUTDIR_FILEREADABLE="Akeeba Backup a détecté que votre répertoire de sortie de sauvegarde <code>%s</code> se trouve sous la racine web de votre site. Son contenu, y compris vos archives de sauvegarde, est accessible via le web. Cependant, il n'est PAS possible de lister les fichiers du répertoire avec un navigateur web. <strong>Cela peut constituer un problème de sécurité</strong>. Un attaquant peut deviner le nom de l'archive de sauvegarde et la télécharger directement, en contournant la sécurité de votre site."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_RANDOM="Le « Nom de fichier de sortie de sauvegarde » sera modifié pour inclure la variable <code>[RANDOM]</code>. Cela rend la devinette des noms de fichiers de sauvegarde pratiquement impossible en ajoutant 16 lettres et/ou chiffres aléatoires différents dans le nom de l'archive de sauvegarde à chaque sauvegarde effectuée."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_SECURITYFILES="Un fichier <code>.htaccess</code> et un fichier <code>web.config</code> seront écrits dans ce dossier. Sur la plupart des serveurs, cela suffit à empêcher le téléchargement direct via le web de tout fichier qu'il contient et désactive le listage de ses fichiers. Nous avons également une solution pour les serveurs où ces fichiers spéciaux n'ont pas d'effet. Trois autres fichiers appelés <code>index.php</code>, <code>index.html</code> et <code>index.htm</code> seront également écrits dans ce dossier. Ces fichiers index empêchent le serveur web de lister les noms des archives de sauvegarde et des fichiers journaux de sauvegarde."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM="De plus, votre répertoire de sortie est identique à un dossier utilisé par votre site pour héberger des fichiers accessibles publiquement, des fichiers système ou des fichiers de logiciels tiers, ou il en est un sous-répertoire."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM_FIX="Vous devez accéder à la page de configuration d'Akeeba Backup et sélectionner un autre répertoire de sortie."
COM_AKEEBA_CPANEL_LBL_OUTDIR_LISTABLE="Akeeba Backup a détecté que votre répertoire de sortie de sauvegarde <code>%s</code> se trouve sous la racine web de votre site. Son contenu, y compris vos archives de sauvegarde, est accessible via le web. De plus, il est possible de lister les fichiers du répertoire, c'est-à-dire qu'il affiche la liste de vos archives de sauvegarde lorsque vous y accédez avec un navigateur web. <strong>Il s'agit d'un problème de sécurité majeur</strong>. Un attaquant peut accéder à ce dossier depuis un navigateur web et télécharger vos archives de sauvegarde directement, en contournant la sécurité de votre site."
COM_AKEEBA_CPANEL_LBL_OUTDIR_TRASHHOST="Malheureusement, votre serveur ne prend en charge aucune méthode raisonnable pour sécuriser le répertoire. Quelle que soit l'action entreprise, il listera toujours les noms des fichiers qu'il contient et permettra leur téléchargement depuis un navigateur. Votre seule et unique option est de créer un répertoire de sortie de sauvegarde au-dessus de la racine de votre site."
