COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_CORE="<p>Vous pouvez restaurer vos sauvegardes sur n'importe quel serveur, même un serveur différent de celui sur lequel vous avez effectué votre sauvegarde. Suivez notre <a href=\"%s\" target=\"_blank\">tutoriel vidéo</a>. Vous devrez <a href=\"%3$s\" target=\"_blank\">télécharger Akeeba Kickstart Core (gratuit)</a> pour extraire les archives de sauvegarde, comme le tutoriel vous l'indique.</p>"
COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_CORE_INFO_ABOUT_PRO="<strong>Cela <em>peut</em> être plus simple que ça.</strong>Vous pouvez restaurer des archives de sauvegarde sur le même serveur ou sur un serveur différent depuis l'interface d'Akeeba Backup. Pas besoin de transférer les fichiers vous-même. Découvrez ces fonctionnalités et bien d'autres disponibles exclusivement dans <a href=\"%s\">Akeeba Backup Professional</a> !"
COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_PRO="<p>C'est simple ! Cochez la case à côté d'une entrée de sauvegarde. Cliquez ensuite sur le bouton <em>Restaurer</em> dans la barre d'outils.</p><p>Si vous souhaitez restaurer vers un nouveau serveur public, vous pouvez utiliser l'<a href=\"%2$s\">Assistant de transfert de site</a>. Si vous préférez le faire manuellement ou restaurer sur votre propre ordinateur ou sur un intranet, regardez notre <a href=\"%1$s\" target=\"_blank\">tutoriel vidéo</a> et <a href=\"%3$s\" target=\"_blank\">téléchargez Akeeba Kickstart Core (gratuit)</a> pour extraire les archives de sauvegarde.</p>"
