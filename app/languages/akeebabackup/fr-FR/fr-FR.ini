COM_AKEEBA_CONFIG_USAGESTATS_SOLO_DESC="Aidez-nous à améliorer notre logiciel en signalant anonymement et automatiquement vos versions de PHP et MySQL. Ces informations nous aideront à décider quelles versions de PHP et MySQL prendre en charge dans les versions futures. Remarque : nous ne collectons PAS le nom de votre site, votre adresse IP ou toute autre information d'identification directe ou indirecte."
