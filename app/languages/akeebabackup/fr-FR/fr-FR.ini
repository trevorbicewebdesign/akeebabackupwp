COM_AKEEBA_CPANEL_MSG_CLOUDFLARE_WARN1="Nous avons détecté que CloudFlare Rocket Loader est activé sur votre site. Cette fonctionnalité interférera avec le JavaScript de votre site en mélangeant l'ordre de chargement des scripts, provoquant ainsi des erreurs JavaScript. Veuillez désactiver la fonctionnalité Rocket Loader pour permettre au JavaScript d'Akeeba Backup de fonctionner correctement. Pour plus d'informations et d'instructions, veuillez consulter <a href='%s' target='_blank'>la documentation de CloudFlare</a>."
