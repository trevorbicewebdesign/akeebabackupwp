SOLO_USERS_HEAD_BASIC="Configuration de base"
SOLO_USERS_HEAD_TFA="Authentification à deux facteurs"
SOLO_USERS_LBL_ABOUTTFA="L'authentification à deux facteurs (TFA) ajoute une couche de sécurité supplémentaire lors de la connexion à Akeeba Solo. En plus de votre nom d'utilisateur et de votre mot de passe, vous devrez également saisir un code secret pour vous connecter. Contrairement à votre nom d'utilisateur et à votre mot de passe, ce code secret n'est pas fixe. Il change au fil du temps et est généré par votre smartphone ou un appareil dédié, selon la méthode que vous choisissez. L'activation de la TFA est facultative ; Akeeba Solo fonctionnera tout aussi bien sans elle."
SOLO_USERS_LBL_TFAENABLE="Activer l'authentification à deux facteurs"
SOLO_USERS_LBL_TFAMETHOD="Méthode d'authentification à deux facteurs"
SOLO_USERS_LBL_TFASECURITYCODE="Code de sécurité"
SOLO_USERS_TFA_GOOGLE="Google Authenticator"
SOLO_USERS_TFA_GOOGLE_INTRO="Cette fonctionnalité vous permet d'utiliser Google Authenticator, ou une application compatible, pour l'authentification à deux facteurs. En plus de votre nom d'utilisateur et de votre mot de passe, vous devrez également fournir un code de sécurité à six chiffres généré par Google Authenticator pour pouvoir vous connecter à Akeeba Solo. Le code de sécurité est renouvelé toutes les 30 secondes. Cela offre une protection supplémentaire contre les pirates informatiques qui se connecteraient à votre compte même s'ils avaient réussi à obtenir votre mot de passe."
SOLO_USERS_TFA_GOOGLE_LBL_STEP1="Étape 1 - Obtenir Google Authenticator"
SOLO_USERS_TFA_GOOGLE_LBL_STEP2="Étape 2 - Configurer"
SOLO_USERS_TFA_GOOGLE_LBL_STEP3="Étape 3 - Activer l'authentification à deux facteurs"
SOLO_USERS_TFA_GOOGLE_SETUP1="Téléchargez et installez Google Authenticator, ou une application compatible, sur votre smartphone ou votre ordinateur. Utilisez l'une des options suivantes :"
SOLO_USERS_TFA_GOOGLE_SETUP1_WARNING="N'oubliez pas de synchroniser l'horloge de votre appareil avec un serveur de temps. Un décalage horaire sur votre appareil peut entraîner une impossibilité de vous connecter à Akeeba Solo."
SOLO_USERS_TFA_GOOGLE_SETUP2A="Vous devrez saisir les informations suivantes dans Google Authenticator ou une application compatible."
SOLO_USERS_TFA_GOOGLE_SETUP2A_ACCOUNT="Compte"
SOLO_USERS_TFA_GOOGLE_SETUP2A_KEY="Clé"
SOLO_USERS_TFA_GOOGLE_SETUP2B="Vous pouvez également scanner le code QR suivant dans Google Authenticator."
SOLO_USERS_TFA_GOOGLE_SETUP3="Afin de vérifier que tout est correctement configuré, veuillez saisir le code de sécurité affiché dans Google Authenticator dans le champ ci-dessous et cliquer sur le bouton. Si le code est correct, la fonctionnalité d'authentification à deux facteurs sera activée."
SOLO_USERS_TFA_NONE="Aucune (ne pas utiliser l'authentification à deux facteurs)"
SOLO_USERS_TFA_OTEPS_HEAD="Codes d'urgence à usage unique"
SOLO_USERS_TFA_OTEPS_INTRO="Veuillez imprimer une copie de ces codes maintenant et les conserver en lieu sûr. Si vous perdez votre appareil d'authentification à deux facteurs, vous vous trouverez dans l'impossibilité de vous connecter à Akeeba Solo. Si cela se produit, veuillez utiliser l'un des mots de passe d'urgence à usage unique suivants à la place de votre clé secrète à deux facteurs pour vous connecter à Akeeba Solo et réinitialiser l'authentification à deux facteurs. N'oubliez pas que ce sont des codes d'urgence à usage unique. Une fois que vous en avez utilisé un, vous ne pourrez plus jamais l'utiliser. Si vous épuisez vos codes d'urgence, veuillez désactiver l'authentification à deux facteurs et la réactiver pour générer un nouveau jeu de 10 codes."
SOLO_USERS_TFA_YUBIKEY="YubiKey"
SOLO_USERS_TFA_YUBIKEY_INTRO="Cette fonctionnalité vous permet d'utiliser un jeton matériel sécurisé YubiKey pour l'authentification à deux facteurs. En plus de votre nom d'utilisateur et de votre mot de passe, vous devrez également insérer votre YubiKey dans le port USB de votre ordinateur, cliquer dans la zone de clé secrète de la page de connexion d'Akeeba Solo et toucher le bouton doré du YubiKey. Le code secret généré par votre YubiKey est unique à votre appareil et change constamment. Cela offre une protection supplémentaire contre les pirates informatiques qui se connecteraient à votre compte même s'ils avaient réussi à obtenir votre mot de passe."
SOLO_USERS_TFA_YUBIKEY_SETUP="Veuillez insérer votre appareil YubiKey dans le port USB de votre ordinateur. Cliquez sur le champ Code de sécurité ci-dessous. Touchez ensuite le bouton doré de votre appareil YubiKey pendant une seconde. Enregistrez ensuite votre profil utilisateur. Si le code généré par votre YubiKey est validé par YubiCloud, la fonctionnalité d'authentification à deux facteurs sera activée et ce YubiKey sera associé à votre compte utilisateur."
SOLO_WIZARD_BTN_PYTHIA="Détection automatique"
SOLO_WIZARD_BTN_PYTHIA_HELP="Si vous cliquez sur ce bouton, Akeeba Solo tentera de détecter automatiquement le type de script, le type d'installateur et les informations de connexion à la base de données ci-dessous. Veuillez vérifier les paramètres. La détection automatique peut ne pas produire les paramètres corrects dans certaines circonstances."
SOLO_WIZARD_ERR_DIRNOTEXIST="Le répertoire racine spécifié n'existe pas ou n'est pas lisible par Akeeba Solo"
SOLO_WIZARD_LBL_DBINFO_INTRO="Vous pouvez ici fournir les informations de connexion à la base de données contenant les données du site / de l'application web à sauvegarder."
SOLO_WIZARD_LBL_DBINFO_TITLE="Connexion à la base de données"
SOLO_WIZARD_LBL_INTRO="Vous devez d'abord indiquer ce que vous souhaitez sauvegarder. Pour ce faire, définissez le répertoire racine et les informations de connexion à la base de données du site à sauvegarder. Si votre site nécessite plusieurs bases de données pour fonctionner correctement, vous pourrez les ajouter après avoir terminé cet assistant, via la fonctionnalité Définitions de bases de données supplémentaires sur la page principale de l'application."
SOLO_WIZARD_LBL_SITEINFO_INTRO="Les choix suivants influencent la façon dont Akeeba Solo sauvegarde votre site et restaure vos sauvegardes. Si vous n'êtes pas sûr de ce que vous devez indiquer ici, cliquez simplement sur le bouton Détection automatique en haut de la page pour qu'Akeeba Solo détecte automatiquement ces valeurs pour vous."
SOLO_WIZARD_LBL_SITEINFO_TITLE="Informations sur le site"
SOLO_WIZARD_LBL_SITEROOT_INTRO="La racine du site est le répertoire contenant tous les fichiers du site / de l'application web à sauvegarder. Il doit se trouver sur le même serveur et être accessible en lecture par Akeeba Solo."
SOLO_WIZARD_LBL_SITEROOT_TITLE="Racine du site"
SOLO_WIZARD_NO_EXTRADIRS_CORE="La prise en charge des répertoires situés en dehors de la racine web est disponible uniquement dans la version Pro ; le ou les dossiers ci-dessus ne seront donc pas inclus dans votre sauvegarde."
SOLO_WIZARD_TITLE="Assistant de configuration"
SOLO_WP_USERMANAGER_ERR_CANTDELETE="Vous ne pouvez pas supprimer des utilisateurs. Veuillez utiliser la page Utilisateurs dans WordPress à la place."
