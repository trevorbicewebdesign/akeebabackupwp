SOLO_RESTORE_ERR_NOSITEROOT="Aucune racine de site n'est définie. Nous ne pouvons pas restaurer l'archive de sauvegarde sans qu'elle soit définie."
SOLO_RESTORE_LABEL_SUCCESS_INFO="Vous devez maintenant exécuter le script de restauration qui restaurera le contenu de votre base de données et effectuera d'autres opérations de maintenance. Pour ce faire, veuillez visiter l'URL <code>http://www.example.com/installation/index.php</code> où http://www.example.com est l'URL du site que vous restaurez. <strong>IMPORTANT ! Ne fermez pas la fenêtre où ce message apparaît !</strong>. Une fois le script de restauration terminé, fermez sa fenêtre et revenez ici. Cliquez ensuite sur le bouton Finaliser la restauration ci-dessous pour supprimer le répertoire <tt>installation</tt>. Vous pourrez alors commencer à utiliser votre site restauré."
SOLO_RESTORE_LABEL_SUCCESS_INFO_HASURL="Vous devez maintenant exécuter le script de restauration qui restaurera le contenu de votre base de données et effectuera d'autres opérations de maintenance. Pour ce faire, veuillez visiter l'URL <code>%s/installation/index.php</code> où %s est l'URL du site que vous restaurez. Vous pouvez accéder à cette URL en cliquant sur le bouton Exécuter le script de restauration ci-dessous. <strong>IMPORTANT ! Ne fermez pas la fenêtre où ce message apparaît !</strong>. Une fois le script de restauration terminé, fermez sa fenêtre et revenez ici. Cliquez ensuite sur le bouton Finaliser la restauration ci-dessous pour supprimer le répertoire <tt>installation</tt>. Vous pourrez alors commencer à utiliser votre site restauré."
