COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECK_HEADERINFO="Cette fonctionnalité vous permet de vérifier si des sauvegardes terminées n'ont pas pu être téléversées vers le stockage distant (par ex. Amazon S3, Dropbox, etc.) et d'envoyer une notification par courriel aux administrateurs du site."
COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECKUSECLI="Pour vérifier les téléversements échoués vers le stockage distant à l'aide du script CLI natif, utilisez la commande suivante :"
COM_AKEEBA_SCHEDULE_LBL_CLICRON="Tâches CRON en ligne de commande (recommandé)"
COM_AKEEBA_SCHEDULE_LBL_CLICRON_INFO="Il s'agit de la méthode recommandée pour tous les serveurs prenant en charge les tâches CRON en ligne de commande. Cette méthode contourne l'interface web, permettant une vitesse de sauvegarde maximale."
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICIMPROTANTINFO="Important"
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICINFO="N'oubliez pas de remplacer <em>%s</em> par le chemin réel vers l'exécutable PHP <strong>CLI (Interface en ligne de commande)</strong> de votre hébergeur. Rappelez-vous que vous devez utiliser l'exécutable PHP CLI ; même si l'exécutable PHP CGI (Interface de passerelle commune) peut fonctionner avec nos scripts CRON, il est sujet à des erreurs d'expiration et à des échecs de sauvegarde. Si vous n'êtes pas sûr de ce que cela signifie, veuillez consulter votre hébergeur. Ce sont les seules personnes qui peuvent vous fournir le chemin vers le fichier exécutable PHP CLI."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP="Fonctionnalité de sauvegarde frontale"
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_INFO="Cette méthode utilise une URL publique et une clé secrète pour déclencher une sauvegarde de votre site. La sauvegarde progresse au moyen de redirections HTTP. Veuillez noter que la plupart des tâches « CRON » basées sur des URL des hébergeurs, ainsi que la plupart des services CRON tiers basés sur des URL, ne prennent pas en charge les redirections HTTP. Si les exemples avec wget et curl ci-dessous ne fonctionnent pas pour vous, veuillez utiliser l'URL de sauvegarde frontale avec le service tiers très économique webcron.org."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_MANYMETHODS="La fonctionnalité de sauvegarde frontale peut être utilisée avec une grande variété de méthodes. Cliquez sur les onglets ci-dessous pour voir la description de chaque méthode. N'oubliez pas que toutes sont expliquées en détail dans notre documentation."
