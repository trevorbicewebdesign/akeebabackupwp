COM_AKEEBA_S3_ACCESS_DESCRIPTION="La manière dont l'API accédera au compartiment. En cas de doute, utilisez l'hébergement virtuel. L'hébergement virtuel est la méthode recommandée et prise en charge pour Amazon S3, qui utilise une URL de la forme https://BUCKET.ENDPOINT pour accéder au compartiment. L'accès par chemin est une méthode obsolète et non prise en charge qui utilise une URL de la forme https://ENDPOINT/BUCKET pour accéder au compartiment. N'utilisez l'accès par chemin que si un fournisseur de stockage tiers disposant d'une API compatible Amazon S3 vous le demande."
