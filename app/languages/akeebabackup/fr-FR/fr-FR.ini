COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_1="Votre script de restauration (ANGIE) ne sera accessible que si vous fournissez le mot de passe que vous avez configuré sur la page précédente, avant de cliquer sur le bouton Sauvegarder maintenant. Si vous ne vous souvenez pas avoir configuré un mot de passe, votre navigateur a auto-complété le mot de passe sur la page de Configuration <strong>sans vous le demander</strong>. Cela est fait par de nombreux gestionnaires de mots de passe et navigateurs."
COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_2="Les navigateurs et gestionnaires de mots de passe modernes ne nous permettent pas de remplacer ce comportement. Nous avons mis en place une protection JavaScript contre ce type de remplissage automatique non consenti du champ mot de passe sur la page de Configuration. Cependant, si vous enregistrez la page de Configuration dans environ une demi-seconde après son chargement, cette protection n'aura pas le temps de s'exécuter."
