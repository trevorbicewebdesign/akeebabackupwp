SOLO_CONFIG_UNDER_TOOLS_DESCRIPTION="Non : Akeeba Backup apparaît dans le menu latéral de WordPress comme un élément de premier niveau, placé vers le bas. Oui : Akeeba Backup apparaît comme un sous-élément du menu «Outils» dans le menu latéral de WordPress."
SOLO_CONFIG_UNDER_TOOLS_LABEL="Placer sous Outils"
SOLO_CONFIG_UPDATE_INTEGRATED_WP="Afficher la mise à jour d'Akeeba Backup dans la page des extensions"
SOLO_CONFIG_UPDATE_INTEGRATED_WP_DESC="Lorsque cette option est activée, Akeeba Backup notifie WordPress de la disponibilité des mises à jour et de l'emplacement des fichiers de mise à jour. Cela permet à WordPress d'inclure les mises à jour d'Akeeba Backup dans le compteur de mises à jour disponibles et de les afficher dans la page des extensions. Sur de très rares sites, cela peut entraîner l'affichage d'une page vide ou d'une erreur lors de l'accès à la page des extensions, en raison d'interactions avec des extensions tierces mal développées. Dans ce cas, veuillez désactiver cette option et nous contacter en indiquant la liste des extensions activées sur votre site ainsi que leurs versions."
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_CONSERVATIVE="Conservateur"
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_DESCRIPTION="Lorsque cette option est activée, les sauvegardes effectuées via WP-CRON auront les durées d'exécution minimale et maximale définies dans la section Réglage fin du profil de sauvegarde remplacées. Le réglage «Optimiste» tentera d'utiliser le temps maximum disponible sur votre serveur — jusqu'à 60 secondes — pour des sauvegardes plus rapides, mais plus susceptibles d'échouer. Le réglage «Conservateur» utilisera environ la moitié du temps du réglage Optimiste, pour des sauvegardes plus lentes mais moins susceptibles d'échouer. Sur certains serveurs, il peut être nécessaire de définir cette option sur «Non» et d'ajuster manuellement les paramètres de Réglage fin pour que la sauvegarde fonctionne sans échec."
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_LABEL="Remplacer les limites de temps dans WP-CRON"
