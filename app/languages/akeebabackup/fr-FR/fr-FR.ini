COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_HEAD="La configuration par défaut du système CRON de WordPress peut entraîner des problèmes lors des sauvegardes planifiées"
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P1="Conformément à <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">la documentation de WordPress</a>, les tâches critiques —comme les sauvegardes— planifiées avec WP-CRON dans la configuration par défaut de WordPress (exécution des tâches planifiées évaluée uniquement lors de la visite de votre site) peuvent ne pas s'exécuter à l'heure prévue, voire pas du tout. En raison de ce problème de conception inhérent que WordPress reconnaît ouvertement, les sauvegardes planifiées avec WP-CRON dans cette configuration peuvent ne pas démarrer à l'heure prévue (ou pas du tout), peuvent prendre beaucoup plus de temps à s'exécuter, peuvent devenir incohérentes ou corrompues, peuvent se chevaucher, ou peuvent démarrer sans jamais se terminer. Veuillez consulter notre documentation pour des informations détaillées."
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P2="Nous recommandons <strong>très vivement</strong> de suivre la recommandation figurant dans <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">la documentation officielle de WordPress</a> pour désactiver l'exécution des tâches par défaut basée sur l'activité du site, en utilisant le Planificateur de tâches Windows ou le démon CRON de macOS/Linux pour planifier l'exécution du programme d'assistance CRON de WordPress (<code>wp-cron.php</code>) toutes les minutes. Cette configuration surmonte le problème de conception inhérent à la configuration par défaut de WordPress pour WP-CRON et rend vos sauvegardes planifiées aussi fiables que les sauvegardes manuelles effectuées depuis l'interface d'administration, ou les sauvegardes planifiées avec les méthodes de sauvegarde frontale ou d'API JSON."
