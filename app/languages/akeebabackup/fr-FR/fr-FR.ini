COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEAPP_TITLE="Téléverser vers Microsoft OneDrive (dossier spécifique à l'application)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEAPP_DESCRIPTION="Téléverse l'archive de sauvegarde vers Microsoft OneDrive, dans le dossier spécifique à l'application pour Akeeba Backup (<code>Apps/Akeeba Backup</code>). Cette option est plus restrictive que les autres options de téléversement vers OneDrive, mais est moins susceptible de poser des problèmes avec certains comptes qui présentent des difficultés d'authentification avec les autres intégrations proposées."
COM_AKEEBA_CONFIG_ONEDRIVEAPP_DIRECTORY_TITLE="Sous-répertoire dans <code>Apps/Akeeba Backup</code>"
COM_AKEEBA_CONFIG_ONEDRIVEAPP_DIRECTORY_DESCRIPTION="Le sous-répertoire dans le dossier spécifique à l'application Akeeba Backup (<code>Apps/Akeeba Backup</code>) sur votre lecteur Microsoft OneDrive dans lequel les archives de sauvegarde seront téléversées. Veuillez utiliser des barres obliques (<code>/</code>), et non des barres obliques inverses (<code>\\<code>), et toujours placer une barre oblique au début. Correct : <code>/some/thing</code>. Incorrect : <code>some\\thing</code>. Une seule barre oblique signifie que les archives seront stockées à la racine du lecteur. N'incluez PAS le chemin vers le dossier spécifique à l'application (<code>Apps/Akeeba Backup</code>) ; celui-ci est ajouté automatiquement par Microsoft OneDrive !"

