COM_AKEEBA_RESTORE_LABEL_ZAPBEFORE_HELP="Tente de supprimer tous les fichiers et dossiers existants dans le répertoire racine de votre site avant d'extraire l'archive de sauvegarde. Cette fonction ne tient PAS compte des fichiers et dossiers présents dans l'archive de sauvegarde, ni de ceux qui ont été exclus lors de la sauvegarde. Les fichiers et dossiers supprimés par cette fonctionnalité NE PEUVENT PAS être récupérés. <strong>AVERTISSEMENT ! CELA PEUT SUPPRIMER DES FICHIERS ET DES DOSSIERS N'APPARTENANT PAS À VOTRE SITE. CETTE FONCTIONNALITÉ EST DESTINÉE UNIQUEMENT AUX UTILISATEURS TRÈS EXPÉRIMENTÉS QUI COMPRENNENT LES RISQUES. UTILISEZ-LA AVEC UNE EXTRÊME PRUDENCE. EN ACTIVANT CETTE FONCTIONNALITÉ, VOUS ASSUMEZ L'ENTIÈRE RESPONSABILITÉ. EN OUTRE, VOUS RENONCEZ À TOUT DROIT DE DEMANDER UNE ASSISTANCE À AKEEBA LTD.</strong>"
