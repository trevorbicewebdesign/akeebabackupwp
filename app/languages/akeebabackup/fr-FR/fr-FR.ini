COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_TIMEOUT_INFO="180 secondes ; si la sauvegarde ne se termine pas, augmentez cette valeur. La plupart des sites fonctionneront avec une valeur de 180 ou 600 ici. Si vous avez un site très volumineux dont la sauvegarde prend plus de 5 minutes, vous pourriez envisager d'utiliser Akeeba Backup Professional et la tâche CRON CLI native à la place, car elle est bien plus rentable."
