COM_AKEEBA_CONFIG_ZIPCDGLUECHUNKSIZE_DESCRIPTION="Les fichiers ZIP se composent d'une section de données et d'une section «répertoire». Ces sections sont traitées en parallèle par Akeeba Backup et assemblées lors de la phase de finalisation de l'archive. Ce paramètre détermine la quantité de données traitées simultanément lors de cette phase. Vous ne devriez pas avoir besoin de modifier ce paramètre à moins de rencontrer de graves problèmes de mémoire insuffisante."
