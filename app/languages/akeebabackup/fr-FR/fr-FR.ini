COM_AKEEBA_CONFIG_VIRTUALFOLDER_DESCRIPTION="Si vous avez configuré des répertoires hors site, leur contenu apparaîtra dans l'archive sous forme de sous-répertoires de ce répertoire virtuel. Il est virtuel car il n'existe pas réellement sur votre serveur. Il existe uniquement à l'intérieur de l'archive de sauvegarde. Assurez-vous que le nom du répertoire virtuel n'entre pas en conflit avec un répertoire existant afin d'éviter toute perte de données."
