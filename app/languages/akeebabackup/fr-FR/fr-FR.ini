COM_AKEEBA_ALICE_ERR_ANALYZEFAILED_HEADER="L'analyse du journal a échoué"
COM_AKEEBA_ALICE_ERR_ANALYZEFAILED_INFO="L'analyse du journal a été interrompue. L'analyseur de journal a signalé l'erreur suivante :"
COM_AKEEBA_ALICE_ERR_CANNOT_OPEN_LOGFILE="L'analyse du fichier journal a échoué : impossible d'ouvrir le fichier journal %s en lecture."
COM_AKEEBA_ALICE_ERR_NOLOGS="Aucun fichier journal pour les sauvegardes <strong>échouées</strong> n'a été trouvé."
COM_AKEEBA_ALICE_HEAD_ONLYFAILED="ALICE ne fonctionne que sur les sauvegardes <em>échouées</em>"
COM_AKEEBA_ALICE_LBL_ONLYFAILED_IFNOFAILED="Si votre sauvegarde a échoué mais que vous ne la voyez pas sur cette page, veuillez attendre <em>trois (3) minutes</em>, retourner à la page du Panneau de contrôle Akeeba Backup, puis revenir ici. Il y a une raison à cela. Dans certains cas, l'échec de la sauvegarde est causé par une erreur serveur. Dans ces cas, la sauvegarde est marquée comme toujours en cours plutôt que comme échouée, car PHP cesse de fonctionner et notre code PHP qui aurait marqué la sauvegarde comme échouée n'a pas l'occasion de s'exécuter. Lorsque vous visitez la page du Panneau de contrôle, toute sauvegarde marquée comme toujours en cours depuis plus de 3 minutes sera marquée comme échouée. D'où la nécessité d'attendre et <em>ensuite</em> de revenir à la page du Panneau de contrôle."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_SHOWINGLOGS="ALICE est un outil permettant d'analyser les fichiers journaux des sauvegardes <em>échouées</em> et — dans la plupart des cas — de vous indiquer la cause la plus probable de l'échec de la sauvegarde. Il n'est pas destiné à analyser les fichiers journaux des sauvegardes réussies. Cela produirait des résultats dénués de sens, trompeurs ou franchement erronés. Pour cette raison, nous n'afficherons que les fichiers journaux des sauvegardes <em>échouées</em>."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_WHATISFAILED="Veuillez noter que les sauvegardes dont le téléversement de l'archive vers un stockage distant n'est pas terminé ne sont pas considérées comme échouées. La cause première de ces problèmes ne peut de toute façon pas être détectée par ALICE. Si vous rencontrez ce type de problème, vous devez ouvrir un ticket d'assistance dans la section Assistance de notre site. Si quelqu'un d'autre a installé Akeeba Backup Professional sur votre site, veuillez contacter cette personne ; vous ne pourrez pas ouvrir de ticket d'assistance sur notre site dans ce cas."
