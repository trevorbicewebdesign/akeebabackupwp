SOLO_NOTYETRESTORED_BTN_FINISH_RESTORING="Terminer la restauration de la sauvegarde de ce site"
SOLO_NOTYETRESTORED_HEAD_STILLSEETHIS="Vous voyez toujours cette page après avoir restauré votre sauvegarde ?"
SOLO_NOTYETRESTORED_HEAD_WHYSEETHIS="Pourquoi est-ce que je vois cette page au lieu de mon site ?"
SOLO_NOTYETRESTORED_PAGE_TITLE="La restauration de ce site n'est pas terminée"
SOLO_NOTYETRESTORED_STILLSEETHIS_LBL_P1="Veuillez utiliser FTP ou le gestionnaire de fichiers de votre panneau de contrôle pour supprimer le dossier <code>installation</code> de votre site. Cette action permettra de faire disparaître cette page et vous pourrez à nouveau voir votre site."
SOLO_NOTYETRESTORED_STILLSEETHIS_LBL_P2="Si vous venez de le faire et que le dossier « installation » n'existe pas dans le dossier racine de votre site (là où se trouve votre fichier wp-config.php), vous avez probablement un CDN ou un cache devant votre site. Veuillez contacter votre hébergeur et demandez-lui comment vider ou réinitialiser ce type de cache correctement afin de voir votre site à la place de cette page."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P1="Un plugin installé sur votre site a détecté que vous disposez actuellement d'un dossier nommé <code>installation</code> dans le dossier racine de votre site et que ce dossier d'installation contient une copie du script de restauration de sauvegarde ANGIE."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P2="Cela signifie que vous avez extrait, mais pas terminé la restauration, d'une sauvegarde du site. Votre site ne fonctionnera pas correctement pour le moment."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P3="Vous devez terminer la restauration en exécutant le script de restauration situé dans le dossier « installation » de votre site. Si vous ne savez pas comment procéder, veuillez cliquer sur le bouton ci-dessous."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P4="Une fois la restauration du site terminée, veuillez supprimer le dossier « installation » de votre site. Dans la plupart des cas, le script de restauration vous demandera de le faire. S'il signale une erreur lors de cette opération, veuillez lire le reste de cette page."
