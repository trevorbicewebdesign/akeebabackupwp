COM_AKEEBA_CPANEL_ERR_FESECRETWORD_INTRO="Votre <em>Clé secrète</em> est non sécurisée et peut être facilement devinée. Afin de protéger votre site, Akeeba Backup a désactivé l'accès aux sauvegardes frontales et distantes jusqu'à ce que vous saisissiez une clé secrète sécurisée. Le problème détecté est :"
