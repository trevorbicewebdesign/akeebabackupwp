SOLO_SETUP_LBL_ADBLOCK_WARNING="Un bloqueur de publicités ou de scripts est actuellement activé sur ce site. Vous devriez le désactiver pour ce domaine si vous rencontrez des problèmes (par exemple, des boutons de l'interface qui ne fonctionnent pas)"
SOLO_SETUP_LBL_ANCIENTIENOTICE="Vous utilisez une ancienne version non prise en charge d'Internet Explorer. Veuillez mettre à jour vers <a href='%s'>la dernière version</a> d'Internet Explorer. Si elle n'est pas disponible pour votre version de Windows, veuillez utiliser un navigateur moderne et conforme aux standards tel que <a href='%s'>Chrome</a>. Bien que vous puissiez être en mesure de poursuivre l'installation avec votre ancienne version non prise en charge d'Internet Explorer, nous ne pouvons pas garantir une expérience Akeeba Solo sans problème."
SOLO_SETUP_LBL_APPSETUP="Configuration de l'application"
SOLO_SETUP_LBL_BACKUPONUPDATE="Sauvegarde lors de la mise à jour"
SOLO_SETUP_LBL_BACKUPONUPDATE_CORE="Sauvegarde lors d'une mise à jour manuelle de WordPress"
SOLO_SETUP_LBL_BACKUPONUPDATE_CORE_DESC="Effectue automatiquement une sauvegarde chaque fois qu'un utilisateur met à jour manuellement WordPress depuis le tableau de bord"
SOLO_SETUP_LBL_BACKUPONUPDATE_CORE_PROFILE="Profil à utiliser"
SOLO_SETUP_LBL_BACKUPONUPDATE_CORE_PROFILE_DESC="Profil de sauvegarde à utiliser lors des mises à jour manuelles de WordPress"
SOLO_SETUP_LBL_CLICK_TO_SHOW_HIDE="Cliquer pour afficher/masquer"
SOLO_SETUP_LBL_CURRENT_SETTING="Actuel"
SOLO_SETUP_LBL_DATABASE_DBENCRYPTION="Se connecter avec un certificat SSL"
SOLO_SETUP_LBL_DATABASE_DBENCRYPTION_HELP="Faut-il se connecter à la base de données en utilisant un certificat SSL ? Cela peut être utilisé à la place de l'authentification par nom d'utilisateur et mot de passe (connexion chiffrée avec authentification par certificat) ou <em>en plus</em> de l'authentification par nom d'utilisateur et mot de passe (connexion chiffrée avec authentification par mot de passe). Si vous ne savez pas ce que cela signifie, définissez cette option sur Non et ignorez également les quelques options suivantes."
SOLO_SETUP_LBL_DATABASE_DBSSLCA="Fichier de l'autorité de certification (CA)"
SOLO_SETUP_LBL_DATABASE_DBSSLCA_HELP="Chemin absolu vers le fichier PEM du certificat de l'autorité de certification (CA) de votre serveur de base de données, par ex. <code>/home/myuser/ca.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT="Fichier de clé publique (certificat) de l'utilisateur de la base de données"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT_HELP="Chemin absolu vers le fichier PEM de clé publique (certificat) de votre utilisateur de base de données, par ex. <code>/home/myuser/myuser.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER="Méthodes de chiffrement SSL/TLS"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER_HELP="Saisissez une liste de méthodes de chiffrement pour la connexion avec des certificats SSL, séparées par des deux-points. Si ce champ est laissé vide, la liste par défaut (<code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>) sera utilisée (recommandé)."
SOLO_SETUP_LBL_DATABASE_DBSSLKEY="Fichier de clé privée de l'utilisateur de la base de données"
SOLO_SETUP_LBL_DATABASE_DBSSLKEY_HELP="Chemin absolu vers le fichier PEM de clé privée de votre utilisateur de base de données, par ex. <code>/home/myuser/myuser-key.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT="Vérifier le certificat du serveur"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT_HELP="Définissez sur Oui pour vérifier le certificat que le serveur nous renvoie. Ce certificat est vérifié par rapport au fichier d'autorité de certification (CA) que vous avez spécifié. Si vous obtenez des erreurs de connexion, définissez ce paramètre sur Non ; certaines configurations (notamment celles générées par <code>mysql_ssl_rsa_setup</code>) peuvent refuser une connexion si la vérification du certificat est activée. Si vous activez la vérification et que le champ du fichier CA est laissé vide, le certificat du serveur sera vérifié par rapport aux fichiers d'autorité de certification connus de votre serveur ; consultez les options PHP <code>openssl.cafile</code> et <code>openssl.capath</code>."
SOLO_SETUP_LBL_DATABASE_DRIVER="Type de base de données"
SOLO_SETUP_LBL_DATABASE_DRIVER_HELP="Il s'agit généralement de MySQLi (<em>avec</em> le «&nbsp;i&nbsp;» final)"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQL="MySQL (pilote obsolète pour MySQL - à éviter)"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQLI="MySQLi (pilote préféré pour MySQL)"
SOLO_SETUP_LBL_DATABASE_DRIVER_NONE="Aucun"
SOLO_SETUP_LBL_DATABASE_DRIVER_PDO="PDO"
SOLO_SETUP_LBL_DATABASE_DRIVER_PDOMYSQL="MySQL (PDO)"
SOLO_SETUP_LBL_DATABASE_DRIVER_SQLAZURE="Windows Azure SQL Database"
SOLO_SETUP_LBL_DATABASE_DRIVER_SQLITE="SQLite"
SOLO_SETUP_LBL_DATABASE_HOST="Nom d'hôte du serveur de base de données"
SOLO_SETUP_LBL_DATABASE_HOST_HELP="Le nom d'hôte ou l'adresse IP du serveur de base de données (généralement : localhost). Veuillez noter que localhost et 127.0.0.1 sont <em>très</em> différents du point de vue de MySQL ; vous devrez peut-être essayer les deux pour déterminer lequel fonctionne avec votre serveur de base de données. Si votre serveur utilise un port non standard, ajoutez-le après le nom d'hôte en le précédant d'un deux-points, par exemple 127.0.0.1:1234 pour utiliser un serveur de base de données sur 127.0.0.1 écoutant sur le port 1234."
SOLO_SETUP_LBL_DATABASE_INFO="Akeeba Solo a besoin d'une base de données pour stocker ses paramètres de configuration et un journal de toutes les tentatives de sauvegarde. Veuillez fournir les paramètres de connexion à la base de données ci-dessous. Vous pouvez utiliser la même base de données que le site que vous souhaitez sauvegarder, ou une base de données dédiée uniquement à Akeeba Solo (recommandé)."
SOLO_SETUP_LBL_DATABASE_NAME="Nom de la base de données"
SOLO_SETUP_LBL_DATABASE_NAME_HELP="Le nom de votre base de données. La plupart des hébergeurs utilisant cPanel, Plesk et d'autres panneaux d'hébergement majeurs attribuent des noms de bases de données tels que abcdef_nomutilisateur, où abcdef est votre identifiant de panneau de contrôle d'hébergement. En cas de doute, veuillez contacter votre hébergeur."
SOLO_SETUP_LBL_DATABASE_PASS="Mot de passe"
SOLO_SETUP_LBL_DATABASE_PASS_HELP="Le mot de passe que vous utilisez pour vous connecter à votre base de données."
SOLO_SETUP_LBL_DATABASE_PREFIX="Préfixe des noms de tables de la base de données"
SOLO_SETUP_LBL_DATABASE_PREFIX_HELP="Le préfixe commun des noms de tables de toutes les tables de base de données appartenant à cette installation Akeeba Solo. Vous pouvez le modifier si vous avez plusieurs installations Akeeba Solo partageant la même base de données."
SOLO_SETUP_LBL_DATABASE_USER="Nom d'utilisateur"
SOLO_SETUP_LBL_DATABASE_USER_HELP="Le nom d'utilisateur que vous utilisez pour vous connecter à votre base de données. La plupart des hébergeurs utilisant cPanel, Plesk et d'autres panneaux d'hébergement majeurs attribuent des noms d'utilisateurs tels que abcdef_nomutilisateur, où abcdef est votre identifiant de panneau de contrôle d'hébergement. En cas de doute, veuillez contacter votre hébergeur."
SOLO_SETUP_LBL_FS_DRIVER="Pilote de système de fichiers"
SOLO_SETUP_LBL_FS_DRIVER_FILE="Écriture directe dans les fichiers"
SOLO_SETUP_LBL_FS_DRIVER_FTP="Mode FTP - File Transfer Protocol"
SOLO_SETUP_LBL_FS_DRIVER_HELP="Sur de nombreux hébergements mutualisés, vous devez utiliser l'un des modes (S)FTP disponibles dans cette liste déroulante — et saisir vos paramètres (S)FTP dans les champs qui apparaîtront ci-dessous si vous faites ce choix — pour vous assurer qu'Akeeba Solo peut écrire correctement dans ses fichiers. Tous les hébergeurs ne prennent pas en charge SFTP. Vous avez besoin à la fois du support SFTP côté serveur et de l'extension PHP mod_ssh2 installée."
SOLO_SETUP_LBL_FS_DRIVER_SFTP="Mode SFTP - Secure File Transfer Protocol (via SSH)"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY="Répertoire (S)FTP"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY_HELP="Le répertoire (S)FTP menant à l'installation Akeeba Solo. Sur les serveurs FTP, ce chemin est différent du chemin du système de fichiers. En cas de doute, contactez votre hébergeur."
SOLO_SETUP_LBL_FS_FTP_HOST="Nom d'hôte du serveur (S)FTP"
SOLO_SETUP_LBL_FS_FTP_HOST_HELP="Le nom d'hôte ou l'adresse IP de votre serveur (S)FTP, par exemple <code>ftp.example.com</code> ou <code>127.0.0.1</code>. Vous DEVEZ le saisir <em>sans</em> le préfixe <code>ftp://</code>, <code>sftp://</code> ou <code>ssh://</code>. En cas de doute concernant ce paramètre et les autres paramètres FTP, veuillez contacter votre hébergeur."
SOLO_SETUP_LBL_FS_FTP_PASSIVE="Utiliser le mode passif"
SOLO_SETUP_LBL_FS_FTP_PASSIVE_HELP="Applicable uniquement pour FTP, ignoré pour SFTP. Lorsque cette option est sélectionnée, Akeeba Solo utilisera le mode passif FTP. La plupart des serveurs FTP le requièrent. Si votre hébergeur exige le mode actif FTP, décochez cette case. En cas de doute, veuillez contacter votre hébergeur."
SOLO_SETUP_LBL_FS_FTP_PASSWORD="Mot de passe (S)FTP"
SOLO_SETUP_LBL_FS_FTP_PASSWORD_HELP="Le mot de passe que vous utilisez pour vous connecter à votre serveur (S)FTP. En cas de doute, contactez votre hébergeur."
SOLO_SETUP_LBL_FS_FTP_PORT="Port du serveur (S)FTP"
SOLO_SETUP_LBL_FS_FTP_PORT_HELP="Le numéro de port sur lequel votre serveur (S)FTP écoute. Généralement 21 pour FTP et 22 pour SFTP. En cas de doute, contactez votre hébergeur."
SOLO_SETUP_LBL_FS_FTP_SSL="Utiliser SSL"
SOLO_SETUP_LBL_FS_FTP_SSL_HELP="Applicable uniquement pour FTP, ignoré pour SFTP. Lorsque cette option est sélectionnée, Akeeba Solo utilisera FTP sur SSL explicite (FTP/S). Veuillez noter que ceci ne doit pas être confondu avec SFTP, qui est une tout autre chose."
SOLO_SETUP_LBL_FS_FTP_USERNAME="Nom d'utilisateur (S)FTP"
SOLO_SETUP_LBL_FS_FTP_USERNAME_HELP="Le nom d'utilisateur que vous utilisez pour vous connecter à votre serveur (S)FTP. En cas de doute, contactez votre hébergeur."
SOLO_SETUP_LBL_LIVESITE="URL vers Akeeba Solo"
SOLO_SETUP_LBL_LIVESITE_HELP="Sur la plupart des serveurs, vous pouvez laisser ce champ vide et il sera déterminé automatiquement. Si votre serveur fait partie de la minorité où cela ne fonctionne pas, veuillez fournir manuellement l'URL vers Akeeba Solo."
SOLO_SETUP_LBL_MANUALCONFIGINSTRUCTIONS="Sélectionnez tout le texte ci-dessous et copiez-le dans un nouveau fichier texte brut. Nommez ce fichier <code>config.php</code>. Téléversez-le ensuite dans le répertoire <code>Solo/assets/private</code> à l'intérieur du répertoire d'Akeeba Solo. Vous pourrez alors commencer à utiliser Akeeba Solo normalement."
SOLO_SETUP_LBL_RECOMMENDED="Ces paramètres sont recommandés pour PHP afin d'assurer une compatibilité totale avec Akeeba Solo. Cependant, Akeeba Solo fonctionnera même si vos paramètres ne correspondent pas exactement à la configuration recommandée."
SOLO_SETUP_LBL_RECOMMENDED_VALUE="Recommandé"
SOLO_SETUP_LBL_REQUIRED="Si l'un de ces éléments n'est pas pris en charge (indiqué comme Non), veuillez prendre les mesures nécessaires pour y remédier. Ne pas le faire pourrait entraîner un dysfonctionnement de votre installation Akeeba Solo."
SOLO_SETUP_LBL_REQUIREDREDTEXT="Certains des paramètres requis sur votre serveur semblent être incompatibles avec Akeeba Solo. Vous pouvez les ignorer et tenter de continuer, mais Akeeba Solo pourrait ne pas fonctionner. Si vous ne savez pas ce qu'ils signifient et comment les corriger, veuillez contacter votre hébergeur."
SOLO_SETUP_LBL_REQ_CONFIGJSON="Solo/assets/private/config.php accessible en écriture"
SOLO_SETUP_LBL_REQ_DATABASE="Prise en charge des bases de données"
SOLO_SETUP_LBL_REQ_INIPARSER="Prise en charge de l'analyseur INI"
SOLO_SETUP_LBL_REQ_JSON="Prise en charge de JSON"
SOLO_SETUP_LBL_REQ_MCGPCOFF="Magic Quotes GPC désactivé"
SOLO_SETUP_LBL_REQ_PHP_VERSION="Version de PHP >= %s"
SOLO_SETUP_LBL_REQ_REGGLOBALS="Register Globals désactivé"
SOLO_SETUP_LBL_REQ_XML="Prise en charge de XML"
SOLO_SETUP_LBL_REQ_ZLIB="Prise en charge de la compression Zlib"
SOLO_SETUP_LBL_SESSIONTIMEOUT="Délai d'expiration de la session (minutes)"
SOLO_SETUP_LBL_SESSIONTIMEOUT_HELP="Vous resterez connecté à Akeeba Solo pendant ce nombre de minutes depuis votre dernière activité sur le système. La valeur par défaut est 1440 minutes (un jour). Nous vous recommandons de toujours vous déconnecter une fois la gestion d'Akeeba Solo terminée, conformément aux bonnes pratiques de sécurité. Malgré ce paramètre, vous pourriez être déconnecté automatiquement si votre adresse IP change, si votre navigateur est mis à jour ou si la chaîne d'identification de votre navigateur est modifiée (par exemple lors d'une mise à jour du système d'exploitation, de Java, etc.)."
SOLO_SETUP_LBL_SETTING="Paramètre"
SOLO_SETUP_LBL_TIMEZONE="Fuseau horaire du serveur"
SOLO_SETUP_LBL_TIMEZONE_HELP="Veuillez sélectionner le fuseau horaire le plus proche de celui dans lequel se trouve votre serveur. C'est là que votre serveur «&nbsp;réside&nbsp;». Ce n'est <em>pas</em> nécessairement là où <em>vous</em> résidez."
SOLO_SETUP_LBL_TIMEZONE_WORDPRESS="Il s'agit du fuseau horaire utilisé par WordPress. Vous ne pouvez pas le modifier dans Akeeba Backup. Vous devez accéder à Réglages, Général dans la barre latérale WordPress et le modifier là-bas. Si aucun n'est sélectionné sur cette page, nous supposons que le fuseau horaire GMT (UTC) doit être utilisé."
SOLO_SETUP_LBL_TIMEZONE_WP="Fuseau horaire WordPress"
SOLO_SETUP_LBL_USERSETUP="Configuration de la connexion"
SOLO_SETUP_LBL_USERSETUP_TEXT="L'accès à Akeeba Solo est protégé par une connexion. Veuillez saisir ci-dessous les informations de l'utilisateur administrateur. Vous pourrez créer d'autres utilisateurs dans Akeeba Solo une fois l'installation terminée."
SOLO_SETUP_LBL_USER_EMAIL="Adresse e-mail"
SOLO_SETUP_LBL_USER_EMAIL_HELP="Veuillez saisir votre adresse e-mail. Elle sera utilisée chaque fois que votre installation Akeeba Solo devra vous envoyer un message. Cette adresse e-mail, ainsi que toutes les informations de l'utilisateur, n'est <em>pas</em> transmise aux auteurs d'Akeeba Solo."
SOLO_SETUP_LBL_USER_NAME="Nom complet"
SOLO_SETUP_LBL_USER_NAME_HELP="Veuillez saisir votre nom complet. Il sera utilisé chaque fois que votre installation Akeeba Solo devra vous envoyer un message."
SOLO_SETUP_LBL_USER_PASSWORD="Mot de passe"
SOLO_SETUP_LBL_USER_PASSWORD2="Répéter le mot de passe"
SOLO_SETUP_LBL_USER_PASSWORD2_HELP="Veuillez répéter le mot de passe saisi ci-dessus. Nous souhaitons nous assurer que vous ne l'avez pas accidentellement mal saisi."
SOLO_SETUP_LBL_USER_PASSWORD_HELP="Le mot de passe que vous utiliserez pour vous connecter à Akeeba Solo. Le mot de passe est sensible à la casse, ce qui signifie que abc, Abc et ABC sont trois mots de passe <em>différents</em>."
SOLO_SETUP_LBL_USER_USERNAME="Nom d'utilisateur"
SOLO_SETUP_LBL_USER_USERNAME_HELP="Le nom d'utilisateur que vous utiliserez pour vous connecter à Akeeba Solo. Il est préférable de n'utiliser que des lettres minuscules a-z et des chiffres 0-9."
SOLO_SETUP_LBL_WELCOME="Avant de pouvoir utiliser Akeeba Solo, vous devez le configurer. Cet installateur web vous guidera à travers toutes les étapes nécessaires. Sur cette première page, nous vérifions que la configuration de votre serveur correspond aux exigences minimales pour Akeeba Solo. Cliquez sur le bouton <strong>Suivant</strong> ci-dessus pour passer à la page suivante de l'installateur."
SOLO_SETUP_LBL_WELCOME_HEAD="Bienvenue dans Akeeba Solo"
SOLO_SETUP_MSG_CONFIGNOTWRITTEN="Nous n'avons pas pu écrire la configuration d'Akeeba Solo sur le disque. Veuillez suivre les instructions ci-dessous pour l'enregistrer manuellement. Si vous ne le faites pas, Akeeba Solo ne fonctionnera PAS et cet installateur réapparaîtra la prochaine fois que vous tenterez de l'utiliser."
SOLO_SETUP_MSG_CONFIGNOTWRITTEN_HEAD="Akeeba Solo n'est pas encore correctement installé"
SOLO_SETUP_MSG_DONE="Vous avez correctement configuré Akeeba Solo. Vous pouvez maintenant commencer à l'utiliser."
SOLO_SETUP_MSG_NOTICEMBLANGNOTDEFAULT="Le langage PHP mbstring n'est pas défini sur neutre. Cela peut être configuré localement en entrant <strong>php_value mbstring.language neutral</strong> dans votre fichier <code>.htaccess</code>."
SOLO_SETUP_MSG_NOTICEMBSTRINGOVERLOAD="La surcharge de fonctions PHP mbstring est activée. Cela peut être désactivé localement en entrant <strong>php_value mbstring.func_overload 0</strong> dans votre fichier <code>.htaccess</code>."
