COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_PARTS="Votre sauvegarde se compose de %d fichiers parties. Vous <em>devez</em> tous les télécharger et les placer dans le même répertoire pour que l'extraction de l'archive et la restauration de la sauvegarde réussissent."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE="Le téléchargement via votre navigateur peut corrompre les fichiers"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE_NODOWNLOAD="Le téléchargement des sauvegardes via le navigateur est désactivé par défaut"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE_NODOWNLOAD_PHPERRORDISPLAY="Le téléchargement des sauvegardes via le navigateur est automatiquement désactivé"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING="Nous vous recommandons de fermer cette boîte de dialogue et d'utiliser FTP en mode de transfert <code>Binaire</code> ou SFTP pour télécharger vos archives de sauvegarde."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD="<strong>Les paramètres actuels de votre serveur peuvent entraîner un fichier corrompu (ou endommagé) lors du téléchargement via le navigateur.</strong> Le téléchargement des archives de sauvegarde via le navigateur est désactivé par défaut, car il est probable qu'une autre extension ou PHP ajoute des données inattendues au début ou à la fin de l'archive de sauvegarde. Cela corromprait (endommagerait) les archives de sauvegarde téléchargées via le navigateur, les rendant impossibles à restaurer."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_ALTERNATIVE="Vous pouvez fermer cette boîte de dialogue et utiliser FTP en mode de transfert <code>Binaire</code> ou SFTP pour télécharger vos archives de sauvegarde depuis votre serveur."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART="Votre archive de sauvegarde se compose de %u fichiers portant le nom de fichier <code>%s</code> et les extensions <code>%s</code> ainsi que <code>%s</code> à <code>%s</code>. <strong>IMPORTANT !</strong> Vous devez télécharger <em>tous ces</em> fichiers. Lors de la restauration de votre site, veuillez également téléverser tous ces fichiers avec <code>kickstart.php</code>. Si vous ne le faites pas, votre archive de sauvegarde ne pourra pas être restaurée."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_1="Le fichier que vous devez télécharger s'appelle <code>%s</code>"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_2="Votre archive de sauvegarde se compose de deux fichiers portant le nom de fichier <code>%s</code> et les extensions <code>%s</code> et <code>%s</code>. <strong>IMPORTANT !</strong> Vous devez télécharger <em>les deux</em> fichiers. Lors de la restauration de votre site, veuillez également téléverser les deux fichiers avec <code>kickstart.php</code>. Si vous ne le faites pas, votre archive de sauvegarde ne pourra pas être restaurée."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_AKEEBADEBUG="Vous pouvez réactiver les téléchargements via le navigateur en modifiant votre fichier <code>%s/defines.php</code> et en commentant la ligne <code>define('AKEEBADEBUG', 1);</code>."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_ENABLED="<strong>Les paramètres actuels de votre serveur peuvent entraîner un fichier corrompu (ou endommagé) lors du téléchargement via le navigateur.</strong> Le téléchargement des archives de sauvegarde via le navigateur a été automatiquement désactivé car votre serveur est configuré pour afficher les notices, avertissements et erreurs PHP dans le navigateur. Cela rendrait votre archive téléchargée <em>corrompue</em> (endommagée) et impossible à restaurer. Veuillez fermer cette boîte de dialogue et utiliser FTP en mode de transfert <code>Binaire</code> ou SFTP pour télécharger vos archives de sauvegarde depuis votre serveur."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_UNKNOWN="<strong>Les paramètres actuels de votre serveur peuvent entraîner un fichier corrompu (ou endommagé) lors du téléchargement via le navigateur.</strong> Le téléchargement des archives de sauvegarde via le navigateur a été automatiquement désactivé car nous ne pouvons pas déterminer si votre serveur est configuré pour afficher les notices, avertissements et erreurs PHP dans le navigateur. Lorsque les notices, avertissements et erreurs PHP sont affichés dans le navigateur, votre archive téléchargée devient <em>corrompue</em> (endommagée) et impossible à restaurer. Veuillez fermer cette boîte de dialogue et utiliser FTP en mode de transfert <code>Binaire</code> ou SFTP pour télécharger vos archives de sauvegarde depuis votre serveur."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_WPDEBUG="Vous pouvez réactiver les téléchargements via le navigateur en modifiant votre fichier <code>wp-config.php</code> et en définissant la constante <code>WP_DEBUG</code> sur <code>false</code>."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_REENABLE="Vous pouvez activer les téléchargements via le navigateur <em>à vos propres risques</em> dans la page de Configuration système d'Akeeba Backup."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_WORDPRESS="<strong>Vous avez manuellement activé le téléchargement des sauvegardes via le navigateur <em>à vos propres risques</em>.</strong> Les extensions tierces et les paramètres du serveur peuvent provoquer une troncature (fichier incomplet) ou une corruption (fichier endommagé) du fichier téléchargé. Si vous choisissez de télécharger vos archives de sauvegarde via le navigateur malgré nos avertissements, <strong>vous acceptez personnellement l'entière responsabilité et la pleine responsabilité de vos actions</strong> et vous reconnaissez qu'Akeeba Ltd n'est en aucun cas responsable et ne vous fournira aucune assistance si votre archive de sauvegarde ne peut pas être extraite ou restaurée."
COM_AKEEBA_BUADMIN_LBL_LOGFILEID="Identifiant du fichier journal"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD="Télécharger"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD_CONFIRM="Le téléchargement des archives de sauvegarde via votre navigateur est sujet\nà des échecs, des corruptions et des troncatures de fichiers pour des raisons\nobjectivement hors de notre contrôle (configuration du serveur, du site,\ndes extensions tierces et du navigateur).\n\nNous vous recommandons VIVEMENT de télécharger\nles archives de sauvegarde exclusivement via FTP en mode de transfert\nBinaire (n'utilisez pas le mode Auto ou ASCII ; cela corromprait vos\narchives de sauvegarde) à l'aide d'un logiciel client tel que FileZilla,\n CyberDuck, WinSCP ou similaire ; ou en utilisant le gestionnaire\nde fichiers du panneau de contrôle d'hébergement de votre hébergeur.\n\nSi vous continuez ce téléchargement, vous acceptez explicitement\nde renoncer à votre droit à l'assistance pour tout problème de\ntéléchargement, d'extraction ou de restauration d'archive de sauvegarde et vous\ncomprenez que toute demande de ce type ne recevra pas de réponse.\n\nÊtes-vous sûr de vouloir continuer ?"
