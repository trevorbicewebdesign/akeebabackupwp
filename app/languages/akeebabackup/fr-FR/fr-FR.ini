COM_AKEEBA_SCHEDULE_LBL_JSONAPI_DISCLAIMER="Akeeba Ltd n'approuve pas, n'accepte aucune responsabilité et ne fournit aucun support pour les logiciels ou services tiers interfaçant Akeeba Backup via l'API JSON. Nous fournirons un support pour les sauvegardes effectuées avec l'API JSON Akeeba uniquement si la clé secrète est générée automatiquement par nos logiciels et si la demande concerne l'utilisation de notre propre logiciel client de l'API JSON Akeeba (par ex. Akeeba Remote CLI)."
