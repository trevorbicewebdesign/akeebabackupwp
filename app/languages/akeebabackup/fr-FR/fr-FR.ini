COM_AKEEBA_CPANEL_ERR_FESECRETWORD_TOOSIMPLE="La clé secrète est trop simple. Essayez d'utiliser des lettres minuscules et majuscules, des chiffres et des caractères de ponctuation."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="Vous pouvez également cliquer sur le bouton ci-dessous pour réinitialiser la clé secrète à la valeur suggérée <code>%s</code> Dans les deux cas, vous devrez mettre à jour vos services de sauvegarde distante et/ou vos tâches CRON avec la nouvelle clé secrète."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_JOOMLA="Veuillez cliquer sur Options, Frontale, puis saisir une clé secrète plus complexe."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_SOLO="Veuillez cliquer sur Configuration système, API publique, puis saisir une clé secrète plus complexe."
COM_AKEEBA_CPANEL_ERR_INVALIDDOWNLOADID="Format d'ID de téléchargement invalide. Veuillez suivre nos instructions pour obtenir votre ID de téléchargement. Ne saisissez pas votre nom d'utilisateur, votre adresse e-mail ou votre mot de passe dans ce champ."
COM_AKEEBA_CPANEL_ERR_MBSTRING_SOLO="<strong>Votre version de PHP ne dispose pas de l'extension mbstring installée ou activée</strong>. Son activation est requise par Akeeba Solo. Akeeba Solo peut ne pas fonctionner correctement. Veuillez demander à votre hébergeur d'activer l'extension mbstring sur PHP %s s'exécutant sur votre serveur."
COM_AKEEBA_CPANEL_ERR_MBSTRING_WORDPRESS="<strong>Votre version de PHP ne dispose pas de l'extension mbstring installée ou activée</strong>. Son activation est requise par WordPress. WordPress et Akeeba Backup peuvent ne pas fonctionner correctement. Veuillez demander à votre hébergeur d'activer l'extension mbstring sur PHP %s s'exécutant sur votre serveur."
