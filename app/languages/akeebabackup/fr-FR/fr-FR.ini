SOLO_CONFIG_PLATFORM_SCRIPTTYPE_DESCRIPTION="Sélectionnez le type de script / CMS que vous sauvegardez. Cela permet à Akeeba Solo de tenter d'exclure automatiquement le contenu temporaire et en cache qui ne devrait pas être sauvegardé."
