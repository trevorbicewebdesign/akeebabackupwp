COM_AKEEBA_TRANSFER_DESC="Transfère l'archive en exécutant le moteur de post-traitement « %s » sur l'archive."
COM_AKEEBA_TRANSFER_ERR_CANNOTACCESSTESTFILE="Akeeba Backup ne peut pas vérifier que les informations de connexion que vous avez saisies correspondent à l'URL du site que vous avez indiquée. Si vous tentez de restaurer dans un sous-répertoire d'un site existant, cela signifie que le site principal bloque l'accès au sous-répertoire ; veuillez contacter l'administrateur de votre site. Dans tout autre cas, vous avez saisi des informations de connexion incorrectes, probablement un mauvais répertoire. Veuillez contacter votre hébergeur et lui demander les informations de connexion correctes, <em>y compris le répertoire</em>, correspondant à l'URL que vous avez saisie dans cet assistant. Revenez ensuite ici, saisissez les informations correctes et continuez la restauration."
COM_AKEEBA_TRANSFER_ERR_CANNOTREADLOCALFILE="Akeeba Backup ne peut pas lire le fichier de sauvegarde local <code>%s</code>. Cet assistant a échoué. Veuillez effectuer une nouvelle sauvegarde et réessayer. Notez que des fichiers ont été laissés sur votre nouveau serveur ; vous souhaiterez peut-être les supprimer manuellement."
COM_AKEEBA_TRANSFER_ERR_CANNOTRUNKICKSTART="Akeeba Backup ne peut pas exécuter Akeeba Kickstart sur votre nouveau site. Si vous tentez de restaurer dans un sous-répertoire d'un site existant, cela signifie que le site principal bloque l'accès au sous-répertoire ; veuillez contacter l'administrateur de votre site. Dans tout autre cas, vous devez contacter votre hébergeur et vérifier que votre version PHP par défaut correspond aux exigences minimales de Kickstart."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADARCHIVE="Akeeba Backup ne peut pas téléverser le fichier de sauvegarde <code>%s</code>. Il est possible que le serveur de votre nouveau site soit à court d'espace disque ou qu'une protection du serveur bloque la transmission des données. Veuillez essayer de transférer votre site en sélectionnant l'option de transfert manuel. Notez que des fichiers ont été laissés sur votre nouveau serveur ; vous souhaiterez peut-être les supprimer manuellement."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADKICKSTART="Akeeba Backup ne peut pas téléverser Akeeba Kickstart à la racine de votre nouveau site. Veuillez vérifier que vous avez saisi les informations de connexion correctes et qu'il est possible pour l'utilisateur FTP/SFTP d'écrire des fichiers dans le répertoire que vous avez sélectionné. Si kickstart.php et kickstart.transfer.php se trouvent déjà sur le site distant, veuillez les supprimer avant de réessayer le transfert de votre site."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTEMP="Akeeba Backup ne peut pas téléverser un segment de votre archive de sauvegarde depuis le fichier local <code>%s</code> vers le fichier distant <code>%s</code>. Veuillez vérifier que votre serveur distant autorise le téléversement de fichiers et qu'il dispose de suffisamment d'espace disque pour votre ou vos fichiers d'archive de sauvegarde."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTESTFILE="Akeeba Backup ne peut pas téléverser un fichier de test nommé <code>%s</code> à la racine de votre nouveau site. Veuillez vérifier que vous avez saisi les informations de connexion correctes et qu'il est possible pour l'utilisateur FTP/SFTP d'écrire des fichiers dans le répertoire que vous avez sélectionné."
COM_AKEEBA_TRANSFER_ERR_CANNOTWRITEREMOTEFILES="Malheureusement, Akeeba Backup a déterminé qu'il ne peut pas écrire directement dans les fichiers de votre serveur distant. Cet assistant ne peut pas continuer. Vous devrez utiliser la méthode de transfert « Manuel »."
COM_AKEEBA_TRANSFER_ERR_CANTCREATETEMPCHUNK="Impossible de créer un fichier temporaire sur ce serveur. Veuillez vérifier que votre répertoire temporaire est correctement configuré et accessible en écriture par l'utilisateur sous lequel le serveur web s'exécute actuellement."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP="Aucune sauvegarde de ce type n'a été trouvée. Cliquez sur le bouton Sauvegarder maintenant pour effectuer une nouvelle sauvegarde."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP_SPECIFIC="La sauvegarde n°%d ne peut pas être transférée. Soit il ne s'agit pas d'une sauvegarde complète du site, soit ses fichiers d'archive ne sont plus présents sur ce serveur."
COM_AKEEBA_TRANSFER_ERR_DNS="Le nom de domaine de l'URL que vous avez saisie (%s) ne peut pas être résolu depuis le serveur sur lequel Akeeba Backup s'exécute. Si vous avez récemment enregistré ou transféré le nom de domaine, veuillez patienter jusqu'à ce que les serveurs DNS soient mis à jour (généralement 6 à 48 heures). Sinon, veuillez vérifier les paramètres DNS de votre nom de domaine."
COM_AKEEBA_TRANSFER_ERR_ERRORFROMREMOTE="Akeeba Backup a reçu une erreur du serveur distant lors de la tentative de téléversement de l'archive de sauvegarde. L'erreur était : %s"
COM_AKEEBA_TRANSFER_ERR_EXISTINGSITE="Un autre site existe déjà à cet emplacement. Veuillez supprimer le site existant avant de transférer un nouveau site à cet endroit. Tenter d'écraser un site existant entraînera très probablement un site défaillant que vous ne pourrez pas réparer."
COM_AKEEBA_TRANSFER_ERR_HTACCESS="Un fichier <code>%s</code> a été trouvé à la racine de votre nouveau site. Ce fichier peut interférer avec le processus de transfert du site. Veuillez le supprimer avant de procéder au transfert du site. Notez que le fichier peut être <em>masqué</em>. Si vous ne voyez pas ce fichier dans le gestionnaire de fichiers de votre panneau d'hébergement ou dans votre client FTP, veuillez contacter votre hébergeur pour plus d'informations sur la suppression de ce fichier."
COM_AKEEBA_TRANSFER_ERR_INVALIDID="Identifiant de téléversement invalide spécifié"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN="Vérifier"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN_IGNOREERROR="Je souhaite ignorer cet avertissement et continuer <strong>à mes propres risques</strong>"
COM_AKEEBA_TRANSFER_ERR_NEWURL_INVALID="L'URL que vous avez saisie est invalide."
COM_AKEEBA_TRANSFER_ERR_NEWURL_NOTEXISTS="Votre serveur ne peut pas accéder à l'URL que vous avez saisie. Veuillez vérifier que vous l'avez saisie correctement. Notez également que les noms de domaine récemment attribués ou transférés peuvent mettre <strong>jusqu'à 48 heures</strong> avant d'être visibles par tous les serveurs et ordinateurs connectés à Internet."
COM_AKEEBA_TRANSFER_ERR_NEWURL_SAME="L'URL que vous avez saisie est la même que celle depuis laquelle vous effectuez la restauration. Cette opération n'est pas prise en charge par cet assistant. Pour restaurer une sauvegarde sans utiliser l'assistant, veuillez consulter notre tutoriel vidéo en suivant le lien ci-dessous."
COM_AKEEBA_TRANSFER_ERR_NOTENOUGHSPACE="Le transfert du site ne peut pas continuer. Vous avez besoin d'environ %s d'espace libre, mais votre serveur indique que seulement %s est actuellement disponible. Veuillez libérer de l'espace sur votre serveur."
COM_AKEEBA_TRANSFER_ERR_OVERRIDE="Ignorer les erreurs détectées et transférer le site quand même"
COM_AKEEBA_TRANSFER_ERR_SAMESITE="Vous avez saisi les informations de connexion du site depuis lequel vous effectuez le transfert. <strong>Votre erreur aurait supprimé votre propre site</strong>. Vous devez saisir les informations de connexion FTP/SFTP du site vers lequel vous effectuez le transfert <strong>(nouveau site ou nouveau serveur)</strong>. Veuillez corriger les informations ci-dessus et réessayer."
COM_AKEEBA_TRANSFER_ERR_SPACE="Vous ne disposez que de <span></span> d'espace libre. Vous avez besoin de plus d'espace libre pour transférer votre site. Veuillez contacter votre hébergeur."
COM_AKEEBA_TRANSFER_ERR_WRONGSSL="Votre site possède un certificat SSL invalide ou auto-signé. Pour des raisons de sécurité, le transfert du site ne peut pas continuer. Veuillez cliquer sur Réinitialiser pour redémarrer le transfert du site et utiliser une URL sans <code>https://</code>. Cela est nécessaire lorsque vous essayez de transférer votre site avant de transférer votre nom de domaine vers le nouvel hébergeur. Vous pouvez également contacter votre hébergeur pour obtenir un certificat SSL valide. Même un certificat gratuit émis par l'autorité de certification Let's Encrypt fera l'affaire."
COM_AKEEBA_TRANSFER_FORCE_BODY="Vous exécutez l'Assistant de transfert de site en mode forcé. Cela signifie que certaines vérifications de cohérence qui s'exécutent normalement avant le transfert du site ne seront pas effectuées. Par conséquent, le transfert peut écraser un site existant, aboutir à une URL différente de celle attendue ou simplement échouer. <strong>Il s'agit d'une fonctionnalité réservée aux utilisateurs avancés. Veuillez ne pas continuer si vous n'êtes pas à l'aise avec cela.</strong>"
