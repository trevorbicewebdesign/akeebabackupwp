COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BACKBLAZE_DESCRIPTION="Téléverse l'archive de sauvegarde vers BackBlaze."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BACKBLAZE_TITLE="Téléverser vers BackBlaze B2"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BOX_DESCRIPTION="Téléverse l'archive de sauvegarde vers Box.com. Veuillez lire la documentation."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BOX_TITLE="Téléverser vers Box.com"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_DESCRIPTION="Téléverse l'archive de sauvegarde vers RackSpace CloudFiles.<br/><strong>N'oubliez pas de définir une taille d'archive fractionnée de 2 à 30 Mo, sous peine d'un échec de la sauvegarde dû aux délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_TITLE="Téléverser vers RackSpace CloudFiles"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDME_DESCRIPTION="Téléverse l'archive de sauvegarde vers CloudMe.<br/><strong>N'oubliez pas de définir une taille d'archive fractionnée de 2 à 30 Mo, sous peine d'un échec de la sauvegarde dû aux délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDME_TITLE="Téléverser vers CloudMe"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_DESCRIPTION="Téléverse l'archive de sauvegarde vers DreamObjects.<br/><strong>N'oubliez pas de définir une taille d'archive fractionnée de 2 à 30 Mo, sous peine d'un échec de la sauvegarde dû aux délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_TITLE="Téléverser vers DreamObjects"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DROPBOX2_TITLE="Téléverser vers Dropbox (API v2)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_DESCRIPTION="Vous envoie l'archive de sauvegarde en pièce jointe d'un courriel.<br/><strong>N'oubliez pas de définir une taille de fractionnement d'archive de 1 à 2 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration et de mémoire insuffisante !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_TITLE="Envoyer par courriel"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_DESCRIPTION="Téléverse l'archive de sauvegarde vers un serveur FTP ou FTPS (FTP via SSL implicite) distant.<br/>Ce moteur de post-traitement utilise la bibliothèque cURL, qui offre une meilleure compatibilité avec un large éventail de serveurs FTP.<br/><strong>N'oubliez pas de définir une taille de fractionnement d'archive de 2 à 30 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_TITLE="Téléverser vers un serveur FTP distant via cURL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_DESCRIPTION="Téléverse l'archive de sauvegarde vers un serveur FTP ou FTPS (FTP via SSL implicite) distant.<br/><strong>N'oubliez pas de définir une taille de fractionnement d'archive de 2 à 30 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_TITLE="Téléverser vers un serveur FTP distant"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_DESCRIPTION="Téléverse l'archive de sauvegarde vers Google Drive. Veuillez consulter la documentation."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_TITLE="Téléverser vers Google Drive"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_DESCRIPTION="Téléverse l'archive de sauvegarde vers Google Storage en utilisant l'API JSON moderne. Il s'agit de l'intégration recommandée avec Google Storage.<br/><strong>N'oubliez pas de définir une taille de fractionnement d'archive de 2 à 30 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_TITLE="Téléverser vers Google Storage (API JSON)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_DESCRIPTION="Téléverse l'archive de sauvegarde vers Google Storage en utilisant l'émulation de l'ancienne API S3. Cette méthode est déconseillée et sera supprimée dans une version future. Veuillez utiliser l'option API JSON à la place.<br/><strong>N'oubliez pas de définir une taille de fractionnement d'archive de 2 à 30 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_TITLE="Téléverser vers Google Storage (ancienne API S3)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_NONE_DESCRIPTION="Conserve les fichiers de l'archive de sauvegarde sur le serveur"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_NONE_TITLE="Aucun post-traitement"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_DESCRIPTION="Téléverse l'archive de sauvegarde vers Microsoft OneDrive ou Microsoft OneDrive for Business."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_TITLE="Téléverser vers Microsoft OneDrive ou OneDrive for Business"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_DESCRIPTION="Téléverse l'archive de sauvegarde vers Microsoft OneDrive. Cette méthode ne prend en charge que les lecteurs personnels, créés avec votre compte Microsoft personnel. Elle ne prend pas en charge OneDrive for Business ni les comptes OneDrive créés via un compte scolaire/professionnel ou un abonnement Microsoft Office 365. Cette méthode de téléversement sera SUPPRIMÉE dans une version future d'Akeeba Backup. Utilisez plutôt la méthode Téléverser vers Microsoft OneDrive."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_TITLE="Téléverser vers Microsoft OneDrive (HÉRITÉ)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_DESCRIPTION="Téléverse l'archive de sauvegarde vers OVH Object Storage. <br/><strong>N'oubliez pas de définir une taille de fractionnement d'archive de 2 à 30 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_TITLE="Téléverser vers OVH Object Storage"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_DESCRIPTION="Téléverse l'archive de sauvegarde vers Amazon S3. Vous pouvez utiliser la nouvelle authentification (AWS4), requise pour les nouvelles zones S3, ainsi que l'ancienne (AWS2), requise pour les fournisseurs de stockage tiers offrant une API compatible S3.<br/><strong>Si vous désactivez les téléversements multipart, n'oubliez pas de définir une taille de fractionnement d'archive de 2 à 30 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration !</strong><br/>Si vous souhaitez utiliser Amazon STS à la place d'une clé d'accès et d'une clé secrète, veuillez consulter la documentation."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_TITLE="Téléverser vers Amazon S3"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_DESCRIPTION="Téléverse l'archive de sauvegarde vers un serveur SFTP (SSH) distant. Il s'agit d'un transfert de fichiers via SSH utilisant un protocole appelé SFTP, qui est <em>entièrement différent</em> de FTP et FTPS.<br/>Ce moteur de post-traitement utilise cURL pour le transfert de données, une bibliothèque compatible avec un large éventail de serveurs SFTP.<br/><strong>N'oubliez pas de définir une taille de fractionnement d'archive de 2 à 30 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_TITLE="Téléverser vers un serveur SFTP (SSH) distant via cURL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_DESCRIPTION="Téléverse l'archive de sauvegarde vers un serveur SFTP (SSH) distant. Il s'agit d'un transfert de fichiers via SSH utilisant un protocole appelé SFTP, qui est <em>entièrement différent</em> de FTP et FTPS.<br/><strong>N'oubliez pas de définir une taille de fractionnement d'archive de 2 à 30 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_TITLE="Téléverser vers un serveur SFTP (SSH) distant"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_DESCRIPTION="Téléverse l'archive de sauvegarde vers SugarSync.<br/><strong>N'oubliez pas de définir une taille de fractionnement d'archive de 2 à 30 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_TITLE="Téléverser vers SugarSync"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SWIFT_TITLE="Téléverser vers le stockage d'objets OpenStack Swift"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_DESCRIPTION="Téléverse l'archive de sauvegarde vers tout service de stockage prenant en charge le protocole WebDAV.<br/><strong>N'oubliez pas de définir une taille de fractionnement d'archive de 2 à 30 Mo, sinon vous risquez un échec de sauvegarde en raison de délais d'expiration !</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_TITLE="Téléverser via WebDAV"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_DESCRIPTION="Un scanner de fichiers optimisé pour la sauvegarde de sites dont les répertoires contiennent des centaines de fichiers (par exemple, les blogs et les portails d'actualités)"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_TITLE="Scanner de grands sites"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_DESCRIPTION="Équilibre intelligemment la vitesse d'analyse et l'évitement des délais d'expiration"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_TITLE="Scanner intelligent"
COM_AKEEBA_CONFIG_ERR_DECRYPTION="Impossible de déchiffrer les paramètres. Votre serveur ne prend pas en charge le chiffrement des paramètres, ou le fichier de clé de chiffrement a été modifié ou supprimé."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_DESCRIPTION="Si cette option est activée, le vidage de base de données sera constitué d'instructions INSERT étendues, c'est-à-dire une seule instruction pour restaurer plusieurs lignes de données. Il est fortement recommandé de conserver cette option activée, car elle accélère le processus de restauration et contourne les limites de quota de requêtes sur les hébergeurs restrictifs."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_TITLE="Générer des INSERT étendus"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_DESC="Envoyer un courriel à cette adresse (laisser vide pour désactiver cette fonctionnalité)"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_LABEL="Adresse courriel"
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_DESC="Laisser vide pour utiliser le message par défaut. Vous pouvez utiliser toutes les variables de Solo disponibles pour nommer les fichiers d'archive, par ex. [HOST] et [DATE]."
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_LABEL="Corps du courriel"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_DESC="Laisser vide pour utiliser l'objet par défaut. Vous pouvez utiliser toutes les variables de Solo disponibles pour nommer les fichiers d'archive, par ex. [HOST] et [DATE]"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_LABEL="Objet du courriel"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_DESC="Une sauvegarde sera considérée comme bloquée (échouée) après ce nombre de secondes d'inactivité.<br/><strong>NE MODIFIEZ PAS CETTE VALEUR À MOINS DE SAVOIR CE QUE VOUS FAITES !</strong>"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_LABEL="Délai d'expiration de sauvegarde bloquée"
COM_AKEEBA_CONFIG_FEEMAILBODY_DESC="Laisser vide pour utiliser le message par défaut. Vous pouvez utiliser toutes les variables d'Akeeba Backup disponibles pour nommer les fichiers d'archive, par ex. [HOST] et [DATE]. Vous pouvez également utiliser [PROFILENUMBER] pour le numéro du profil actuel, [PROFILENAME] pour le nom du profil actuel, [PARTCOUNT] pour le nombre total de parties de l'archive de sauvegarde générée, [FILELIST] pour la liste des parties de l'archive de sauvegarde et [REMOTESTATUS] pour indiquer si le téléversement vers le stockage distant s'est terminé avec succès."
COM_AKEEBA_CONFIG_FEEMAILBODY_LABEL="Corps du courriel"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_DESC="Laisser vide pour utiliser l'objet par défaut. Vous pouvez utiliser toutes les variables d'Akeeba Backup disponibles pour nommer les fichiers d'archive, par ex. [HOST] et [DATE]"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_LABEL="Objet du courriel"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT="Utiliser le fuseau horaire du serveur"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULTGROUP="Préréglages"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT_WORDPRESS="Utiliser le fuseau horaire de WordPress"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DESC="La date et l'heure de la sauvegarde — telles qu'elles apparaissent dans le nom de fichier, la description par défaut et les courriels — seront exprimées dans ce fuseau horaire. Cette option affecte toutes les origines de sauvegarde, c'est-à-dire toutes les sauvegardes, quelle que soit leur méthode de déclenchement (via Akeeba Backup lui-même, l'API JSON distante, etc.)."
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_LABEL="Fuseau horaire de la sauvegarde"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_WP_DESC="La date et l'heure de la sauvegarde — telles qu'elles apparaissent dans le nom de fichier, la description par défaut et les courriels — seront exprimées dans ce fuseau horaire. Cette option affecte toutes les origines de sauvegarde, c'est-à-dire toutes les sauvegardes, quelle que soit leur méthode de déclenchement (via Akeeba Backup lui-même, l'API JSON distante, etc.).<br>Veuillez noter que l'option «Utiliser le fuseau horaire de WordPress» ne fonctionnera PAS correctement lorsque vous effectuez des sauvegardes via : a. l'URL de sauvegarde frontale héritée ou l'API JSON d'Akeeba Backup si vous utilisez les anciennes URL de point de terminaison (utilisant index.php ou remote.php au lieu de wp-cron.php) ; et b. les scripts de sauvegarde CLI (<em>et non</em> WP-CLI). Dans ces cas, la sauvegarde s'exécute techniquement en dehors de WordPress, et il n'existe donc pas de «fuseau horaire WordPress» ; la sauvegarde utilisera alors le fuseau horaire GMT. Pour cette raison, il est fortement conseillé de définir ce paramètre sur votre fuseau horaire local."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_DESC="Envoyer un courriel de notification après avoir effectué une sauvegarde avec la fonctionnalité Sauvegarde frontale (API héritée) ou API JSON."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_LABEL="Courriel à la fin de la sauvegarde"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_ALWAYS="Toujours"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_DESC="Quand le courriel de fin de sauvegarde doit-il être envoyé ? «Toujours» signifie à chaque fois qu'une sauvegarde est terminée. «Téléversement échoué» signifie que le courriel n'est envoyé que si la sauvegarde est terminée mais que le téléversement vers le stockage distant ne s'est pas terminé avec succès. En cas d'échec de la sauvegarde, aucun courriel ne peut être envoyé par cette fonctionnalité ; consultez la page Planifier les sauvegardes automatiques pour obtenir des informations sur la réception de courriels en cas d'échec de sauvegarde."
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_FAILEDUPLOAD="Téléversement échoué"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_LABEL="Moment d'envoi du courriel"
COM_AKEEBA_CONFIG_FTPTEST_BADPREFIX="Vous ne devez PAS ajouter le préfixe ftp:// à votre nom d'hôte FTP. Veuillez supprimer le préfixe ftp:// et réessayer."
COM_AKEEBA_CONFIG_FTPTEST_NOUPLOAD="Akeeba Backup a pu se connecter à votre serveur, mais n'a pas pu y téléverser un fichier de test. Le téléversement de la sauvegarde risque d'échouer."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_DESCRIPTION="Renseigné automatiquement lorsque vous effectuez l'étape 1 de l'authentification ci-dessus. Si vous liez un autre site au même compte Google Drive, NE copiez PAS le jeton d'accès et N'exécutez PAS l'authentification. Copiez simplement le jeton d'actualisation du site précédent vers celui-ci."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_TITLE="Jeton d'accès"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_DESCRIPTION="Le répertoire dans Google Drive où stocker les archives de sauvegarde. Veuillez utiliser des barres obliques. Correct : some/thing. Incorrect : some\thing. Une seule barre oblique signifie que les archives seront stockées à la racine du lecteur. LISEZ LA DOCUMENTATION : Les chemins dans Google Drive sont ambigus !"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTEAMDRIVES_TITLE="Actualiser la liste des lecteurs"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTOKEN_TITLE="Jeton d'actualisation"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_DESCRIPTION="Le lecteur Google Drive dans lequel vous souhaitez stocker vos fichiers. Vous devez terminer l'authentification avant que cette liste soit renseignée. Cette option n'a de sens que si vous avez accès aux Google Team Drives (par ex. les utilisateurs d'un abonnement G Suite Business ou Enterprise). En cas de doute, utilisez l'option «Google Drive (personnel)»."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_OPT_PERSONAL="Google Drive (personnel)"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_TITLE="Lecteur"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_TITLE="Téléverser dans les dossiers «Partagés avec moi»"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_DESCRIPTION="Lorsque cette option est activée, Akeeba Backup recherche d'abord les dossiers dans la collection «Partagés avec moi» avant de chercher un dossier du même nom dans votre lecteur. Cette méthode est beaucoup plus lente et peut entraîner un téléversement dans le mauvais dossier si plusieurs dossiers partagés portant le même nom existent dans votre compte Google Drive."
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_DESCRIPTION="Votre clé d'accès Google Storage, disponible dans l'outil de gestion des clés Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_TITLE="Clé d'accès"
COM_AKEEBA_CONFIG_GOOGLESTORAGEBUCKET_DESCRIPTION="Le nom de votre compartiment Google Storage. Assurez-vous de le saisir exactement tel qu'il apparaît dans l'application Web de navigation Google Cloud Storage (https://sandbox.google.com/storage)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEBUCKET_TITLE="Compartiment"
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_DESCRIPTION="Le répertoire dans votre compartiment où les archives de sauvegarde seront stockées. Laissez vide pour stocker les fichiers à la racine du compartiment."
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_DESC="Collez ici le contenu du fichier de credentials JSON généré par Google Cloud Console lors de la configuration du compte de service pour le logiciel de sauvegarde. N'oubliez pas d'inclure les accolades au début et à la fin du texte."
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_TITLE="Contenu du fichier googlestorage.json (lisez la documentation)"
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_DESCRIPTION="Si cette option est activée, Akeeba Backup tentera de convertir le nom du compartiment en lettres minuscules, c'est-à-dire que MonCompartiment sera converti en moncompartiment. Si vous avez créé un compartiment avec des majuscules, par exemple MonNouveauCompartiment, décochez cette option et assurez-vous que le nom du compartiment est orthographié exactement tel qu'il apparaît dans votre navigateur web Google Cloud Storage (https://sandbox.google.com/storage)."
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_TITLE="Nom du compartiment en minuscules"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_DESCRIPTION="Votre clé secrète Google Storage, disponible dans l'outil de gestion des clés Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_TITLE="Clé secrète"
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_DESCRIPTION="Si cette option est activée, une connexion sécurisée (HTTPS) sera utilisée lors du téléversement de vos fichiers. Bien qu'elle améliore la sécurité des données transférées, elle augmente également le risque d'échec de la sauvegarde en raison d'un délai d'expiration."
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_TITLE="Utiliser SSL"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_COLDLINE="Stockage Coldline"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_DESCRIPTION="Modifiez la classe de stockage des archives de sauvegarde téléversées. « Aucune » signifie que les fichiers seront stockés avec la classe de stockage par défaut définie dans votre compartiment. Veuillez noter que les options autres que Standard peuvent être moins coûteuses en stockage, mais peuvent entraîner des frais supplémentaires en cas de téléchargement ou de suppression. Veuillez consulter Google pour les informations tarifaires."
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NEARLINE="Stockage Nearline"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NONE="Aucune (laisser le compartiment décider)"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_STANDARD="Stockage Standard"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_TITLE="Classe de stockage"
COM_AKEEBA_CONFIG_HEADER_BASIC="Configuration de base"
COM_AKEEBA_CONFIG_HEADER_CONFWIZ="Laisser Akeeba Backup se configurer automatiquement ?"
COM_AKEEBA_CONFIG_HEADER_OPTIONALFILTERS="Filtres optionnels"
COM_AKEEBA_CONFIG_HEADER_QUOTA="Gestion des quotas"
COM_AKEEBA_CONFIG_HEADER_TUNING="Réglage fin"
COM_AKEEBA_CONFIG_INSTALLER_DESCRIPTION="Lors d'une sauvegarde complète du site, Akeeba Backup intègre dans l'archive le script de restauration défini ici. Cela permet de restaurer votre site depuis zéro, sans avoir à installer votre CMS ou Akeeba Backup, même si votre site ou serveur est complètement détruit."
COM_AKEEBA_CONFIG_INSTALLER_TITLE="Script de restauration intégré"
COM_AKEEBA_CONFIG_JPS_KEY_DESCRIPTION="Cette clé sera utilisée pour chiffrer le contenu de votre archive. La clé est sensible à la casse, c'est-à-dire que ABC, abc et Abc sont trois mots de passe différents. Conservez une copie du mot de passe dans un endroit sûr ! En cas de perte, il est impossible de le récupérer."
COM_AKEEBA_CONFIG_JPS_KEY_TITLE="Clé de chiffrement"
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_DESCRIPTION="Lorsque cette option est activée (par défaut), votre mot de passe est étendu en une clé cryptographique utilisée dans toute l'archive. Cette méthode est rapide, mais dans l'éventualité très improbable qu'un attaquant disposant de ressources importantes parvienne à retrouver la clé cryptographique à partir d'un bloc chiffré dans le fichier — sans avoir à forcer votre mot de passe — il pourrait alors déchiffrer l'intégralité de l'archive de sauvegarde. Lorsque cette option est désactivée, une clé cryptographique différente est dérivée de votre mot de passe pour chaque bloc chiffré, ce qui est BEAUCOUP plus lent mais vous protège contre ce type d'attaque, obligeant l'attaquant à forcer le mot de passe, ce qui est nettement plus difficile."
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_TITLE="Extension de clé à l'échelle de l'archive"
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_DESC="L'API JSON d'Akeeba Backup vous permet de prendre et de gérer des sauvegardes, ainsi que de gérer les options d'Akeeba Backup à distance. Vous devez activer cette option si vous prévoyez de prendre, de télécharger ou de gérer des sauvegardes, par exemple avec Akeeba Remote CLI, Akeeba UNiTE et des services de planification de sauvegardes.<br><br><strong>Note de sécurité :</strong> l'API JSON est authentifiée uniquement par la Clé secrète. Aucun compte utilisateur n'intervient, de sorte qu'aucune des permissions que vous définissez dans le gestionnaire d'utilisateurs ne s'y applique : son porteur obtient toutes les méthodes de l'API, sans aucune limite. Il peut lire, créer, télécharger et supprimer des sauvegardes et modifier toutes les options, ce qui équivaut en pratique à détenir votre mot de passe d'administrateur. Ne l'activez que lorsque vous en avez réellement besoin et utilisez une Clé secrète longue et aléatoire."
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_LABEL="Activer l'API JSON (sauvegarde à distance)"
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_DESCRIPTION="Lorsqu'un répertoire contient plus de ce nombre de fichiers ou de répertoires, il est considéré comme « volumineux ». Par conséquent, Akeeba Backup tentera de le re-parcourir à l'étape suivante afin d'éviter les délais d'expiration lors de la sauvegarde. Une valeur trop faible ralentira considérablement la sauvegarde. Augmentez cette valeur — sauf si vous obtenez des erreurs de délai d'expiration — pour accélérer la sauvegarde."
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_TITLE="Seuil des répertoires volumineux"
COM_AKEEBA_CONFIG_LARGEFILE_DESCRIPTION="Les fichiers dépassant ce seuil seront compressés dans leur propre étape afin d'éviter tout délai d'expiration. Des valeurs comprises entre 2 et 10 Mo fonctionnent le mieux sur la plupart des serveurs."
COM_AKEEBA_CONFIG_LARGEFILE_TITLE="Seuil des fichiers volumineux"
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_DESCRIPTION="Nombre de répertoires à analyser à chaque étape. Valeur recommandée : 50. Des valeurs plus élevées rendent la sauvegarde légèrement plus rapide, mais augmentent le risque de délai d'expiration."
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_TITLE="Taille du lot d'analyse des répertoires"
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_DESCRIPTION="Nombre de fichiers à analyser et à compresser à chaque étape. Valeur recommandée : 100. Des valeurs plus élevées rendent la sauvegarde légèrement plus rapide, mais augmentent le risque de délai d'expiration ou de manque de mémoire."
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_TITLE="Taille du lot d'analyse des fichiers"
COM_AKEEBA_CONFIG_LBL_CONFWIZ_AFTER="Une fois qu'Akeeba Backup a terminé de se configurer, vous pouvez effectuer une sauvegarde ou affiner manuellement sa configuration."
COM_AKEEBA_CONFIG_LBL_CONFWIZ_INTRO="Il semble que vous n'ayez pas encore configuré Akeeba Backup. Cliquez sur le bouton Assistant de configuration ci-dessous pour qu'il se configure automatiquement."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_DESC="L'API de sauvegarde frontale héritée vous permet d'effectuer des sauvegardes planifiées à l'aide d'outils d'accès URL tels que wget ou curl. Vous devez activer cette option si vous prévoyez d'effectuer des sauvegardes avec le serveur CRON de votre hébergeur en utilisant wget ou curl, ou si vous prévoyez d'utiliser un service CRON tiers tel que WebCRON.org. Dans la mesure du possible, nous recommandons d'utiliser plutôt le script CRON CLI natif ou l'API JSON Akeeba Backup, car ces options sont bien plus sécurisées."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_LABEL="Activer l'API de sauvegarde frontale héritée (tâches CRON à distance)"
COM_AKEEBA_CONFIG_LOGLEVEL_DEBUG="Toutes les informations et le débogage"
COM_AKEEBA_CONFIG_LOGLEVEL_DESCRIPTION="Cette option détermine le niveau de détail du journal de sauvegarde."
COM_AKEEBA_CONFIG_LOGLEVEL_ERROR="Erreurs uniquement"
COM_AKEEBA_CONFIG_LOGLEVEL_INFO="Toutes les informations"
COM_AKEEBA_CONFIG_LOGLEVEL_NONE="Aucun"
COM_AKEEBA_CONFIG_LOGLEVEL_TITLE="Niveau de journalisation"
COM_AKEEBA_CONFIG_LOGLEVEL_WARNING="Erreurs et avertissements"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_DESCRIPTION="Supprimer automatiquement les anciennes sauvegardes en fonction de leur date d'exécution. AVERTISSEMENT : L'ACTIVATION DE CETTE OPTION ENTRAÎNERA L'IGNORANCE DE TOUS LES AUTRES PARAMÈTRES DE QUOTA (NOMBRE ET TAILLE)."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_TITLE="Activer les quotas d'âge maximal des sauvegardes"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_DESCRIPTION="Les sauvegardes effectuées ce jour du mois ne seront pas supprimées. Conservez le paramètre par défaut, 1, pour toujours préserver les sauvegardes effectuées le 1er du mois."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_TITLE="Ne pas supprimer les sauvegardes effectuées ce jour du mois"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_DESCRIPTION="Les sauvegardes plus anciennes que ce nombre de jours seront automatiquement supprimées. Conservez le paramètre par défaut, 31, pour conserver toutes les sauvegardes du mois précédent."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_TITLE="Âge maximal des sauvegardes, en jours"
COM_AKEEBA_CONFIG_MAXEXECTIME_DESCRIPTION="Chaque étape d'Akeeba Backup durera <i>au maximum</i> aussi longtemps que défini ici. Utilisez une valeur inférieure à la durée d'exécution maximale de PHP. En général, 10 secondes est une valeur adéquate, sauf sur les hébergements très restrictifs.<b>Conseil</b> : sélectionnez Personnalisé et saisissez la valeur souhaitée si elle ne figure pas dans la liste."
COM_AKEEBA_CONFIG_MAXEXECTIME_TITLE="Durée d'exécution maximale"
COM_AKEEBA_CONFIG_MAXPACKET_DESCRIPTION="La taille maximale, en octets, de chaque instruction INSERT étendue. Il est recommandé de la maintenir suffisamment faible pour que MySQL ne génère pas d'erreur lors de la restauration de votre vidage de base de données."
COM_AKEEBA_CONFIG_MAXPACKET_TITLE="Taille maximale des paquets pour les INSERT étendus"
COM_AKEEBA_CONFIG_MINEXECTIME_DESCRIPTION="Chaque étape d'Akeeba Backup durera <i>au minimum</i> aussi longtemps que défini ici. Cela est nécessaire pour contourner les solutions de sécurité anti-DoS. Si vous obtenez des erreurs 403 Forbidden ou des erreurs AJAX, veuillez augmenter ce paramètre. Une valeur de 0 désactive cette fonctionnalité.<br/><br/><b>Conseil</b> : sélectionnez Personnalisé et saisissez la valeur souhaitée si elle ne figure pas dans la liste."
COM_AKEEBA_CONFIG_MINEXECTIME_TITLE="Durée d'exécution minimale"
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_DESCRIPTION="Lorsque cette option est activée, Akeeba Backup tentera de vider ces entités avancées de base de données MySQL 5. Si votre sauvegarde se bloque pendant l'étape de sauvegarde, vous devrez peut-être désactiver cette option."
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_TITLE="Vider les PROCEDUREs, FUNCTIONs et TRIGGERs"
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TIP="Supprime USING BTREE et USING HASH des définitions d'index de table dans les fichiers de vidage. Cela est nécessaire pour la restauration sur des serveurs dont l'un des moteurs d'indexation est désactivé (par exemple sur les versions récentes de XAMPP). AVERTISSEMENT ! CELA PEUT ENTRAÎNER DES PROBLÈMES DE RESTAURATION SUR CERTAINS SERVEURS."
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TITLE="Ignorer le moteur d'index"
COM_AKEEBA_CONFIG_NODEPENDENCIES_DESCRIPTION="Lorsque cette option est activée, Akeeba Backup ne suivra pas les dépendances entre les tables et les vues. N'utilisez cette option que si vous disposez de centaines de tables de base de données et que vous n'utilisez pas de VIEWs, FUNCTIONs, PROCEDUREs, TRIGGERs MySQL, ni de tables utilisant les moteurs TEMPORARY, MEMORY, MERGE ou FEDERATED (extrêmement rarement utilisés)."
COM_AKEEBA_CONFIG_NODEPENDENCIES_TITLE="Désactiver le suivi des dépendances"
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_DESCRIPTION="Nombre total d'enregistrements obsolètes (sauvegardes dont les fichiers ont été supprimés) à conserver dans la page Gérer les sauvegardes. Saisissez 0 pour ne pas appliquer de limite."
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_TITLE="Enregistrements obsolètes à conserver"
COM_AKEEBA_CONFIG_LOGFILES_TITLE="Supprimer les fichiers journaux obsolètes"
COM_AKEEBA_CONFIG_LOGFILES_DESCRIPTION="Supprime automatiquement les fichiers journaux des enregistrements de sauvegarde réussis. Le fichier journal du dernier enregistrement de sauvegarde participe aux calculs mais n'est jamais supprimé. Si votre profil de sauvegarde dispose d'un moteur de post-traitement autre que Aucun ou Envoyer par courriel, seuls les enregistrements avec le statut Sauvegarde distante participent à ce paramètre de quota des fichiers journaux. Si votre profil de sauvegarde dispose du moteur de post-traitement Aucun ou Envoyer par courriel, seuls les enregistrements avec le statut OK ou Sauvegarde distante participent à ce paramètre de quota des fichiers journaux. Cette fonctionnalité s'exécute après le quota des enregistrements obsolètes ; ce quota peut également supprimer d'anciens fichiers journaux."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_TITLE="Type de quota des fichiers journaux obsolètes"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DESCRIPTION="Choisissez la méthode utilisée pour déterminer quels anciens fichiers journaux supprimer."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_SIZE="Taille maximale"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_COUNT="Nombre"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DAYS="Âge maximal"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_TITLE="Nombre de fichiers journaux"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_DESCRIPTION="Nombre de fichiers journaux à conserver. Le fichier journal de la dernière sauvegarde effectuée peut être pris en compte dans le décompte mais ne sera jamais supprimé. Seuls les fichiers journaux des enregistrements de sauvegarde réussis seront pris en compte pour la suppression."
COM_AKEEBA_CONFIG_LOGFILES_SIZE_TITLE="Taille des fichiers journaux (mégaoctets)"
COM_AKEEBA_CONFIG_LOGFILES_SIZE_DESCRIPTION="La taille totale maximale des fichiers journaux à conserver. Le fichier journal de la dernière sauvegarde effectuée peut être pris en compte dans le calcul mais ne sera jamais supprimé. Seuls les fichiers journaux des enregistrements de sauvegarde réussis seront pris en compte pour la suppression."
COM_AKEEBA_CONFIG_LOGFILES_DAYS_TITLE="Durée de conservation des fichiers journaux (jours)"
COM_AKEEBA_CONFIG_LOGFILES_DAYS_DESCRIPTION="La durée maximale en jours de conservation des fichiers journaux. Le fichier journal de la dernière sauvegarde effectuée ne sera jamais supprimé. Seuls les fichiers journaux des enregistrements de sauvegarde réussis seront pris en compte pour la suppression."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_DESCRIPTION="Rempli automatiquement lorsque vous effectuez l'étape 1 de l'authentification ci-dessus. Ne partagez PAS le même jeton sur plusieurs sites. Authentifiez chaque site séparément."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_TITLE="Jeton d'accès"
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_DESCRIPTION="Le répertoire dans lequel stocker les archives de sauvegarde sur le lecteur Microsoft OneDrive. Veuillez utiliser des barres obliques (/) et non des barres obliques inverses, et commencer toujours par une barre oblique. Correct : /some/thing. Incorrect : some\thing. Une seule barre oblique signifie que les archives seront stockées à la racine du lecteur."
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_DESCRIPTION="Choisissez le lecteur (OneDrive Personnel, OneDrive for Business ou SharePoint) auquel votre compte a accès et qui sera utilisé pour stocker les sauvegardes. Vous devez terminer l'authentification avant que cette liste soit remplie. Cette option n'a de sens que si vous avez accès à plusieurs lecteurs OneDrive (par exemple, votre compte Microsoft fait partie de l'abonnement d'une organisation). En cas de doute, utilisez l'option « Lecteur par défaut » qui utilise votre lecteur personnel par défaut — généralement équivalent à la première option « Lecteur (OneDrive Personnel) » affichée ci-dessous."
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_OPT_PERSONAL="Lecteur par défaut"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_TITLE="Lecteur"
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_DESCRIPTION="Rempli automatiquement lorsque vous effectuez l'étape 1 de l'authentification ci-dessus. Ne partagez PAS le même jeton sur plusieurs sites. Authentifiez chaque site séparément."
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_TITLE="Jeton d'actualisation"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_DESCRIPTION="Ce filtre s'applique uniquement si vous tentez de sauvegarder une installation Joomla!, par exemple un site Joomla! dans un sous-répertoire ou sous-domaine de votre site. Dans Joomla! 3.9 et versions ultérieures, les actions des utilisateurs sont enregistrées dans la base de données, créant une table avec des millions de lignes et ralentissant votre sauvegarde. Cochez cette option pour exclure ces données."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_TITLE="Journal des actions utilisateurs Joomla!"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_DESCRIPTION="Lorsque cette option est activée, seuls les fichiers modifiés après une date et une heure spécifiques seront sauvegardés."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_TITLE="Filtre conditionnel par date"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_DESCRIPTION="Akeeba Backup sauvegardera les fichiers modifiés après cette date et cette heure. Le format est YYYY-MM-DD hh:mm:ss. Toutes les dates et heures sont exprimées dans le fuseau horaire de votre serveur."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_TITLE="Sauvegarder les fichiers modifiés après"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_DESCRIPTION="Exclure automatiquement les fichiers journaux d'erreurs, par exemple <code>error_log</code>, quel que soit leur emplacement sur le site en cours de sauvegarde. Ces fichiers changent de taille pendant la sauvegarde, ce qui peut entraîner des sauvegardes corrompues."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_TITLE="Exclure les journaux d'erreurs"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_DESCRIPTION="Lorsque cette option est activée, Akeeba Backup exclura automatiquement les dossiers les plus courants propres à l'hébergeur pour le stockage des statistiques d'accès de votre site. Ces dossiers sont en lecture seule pour l'utilisateur de votre site web, ce qui peut causer des problèmes de restauration s'ils sont sauvegardés."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_TITLE="Exclure les dossiers de statistiques propres à l'hébergeur"
COM_AKEEBA_CONFIG_OUTDIR_DESCRIPTION="Il s'agit du répertoire sur votre serveur où Akeeba Backup stockera les archives de sauvegarde et le fichier journal. Vous pouvez utiliser les macros suivantes :<ul><li><b>[DEFAULT_OUTPUT]</b> Le répertoire de sortie par défaut</li><li><b>[SITEROOT]</b> Le répertoire racine de votre site</li><li><b>[ROOTPARENT]</b> Le répertoire situé un niveau au-dessus de la racine de votre site</li></ul>"
COM_AKEEBA_CONFIG_OUTDIR_TITLE="Répertoire de sortie"
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_DESCRIPTION="CE N'EST PAS LE NOM DU CONTENEUR DE STOCKAGE ! Accédez à votre gestionnaire de cloud OVH, Serveurs, développez votre serveur, cliquez sur Stockage. Vous y verrez l'URL du conteneur affichée au-dessus de la liste de vos fichiers. Copiez-la ici."
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_TITLE="URL du conteneur"
COM_AKEEBA_CONFIG_OVH_DIRECTORY_DESCRIPTION="Le répertoire dans lequel stocker les archives de sauvegarde dans le conteneur de stockage d'objets OVH. Pour tout stocker à la racine du conteneur, laissez ce champ vide."
COM_AKEEBA_CONFIG_OVH_DIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_OVH_PASSWORD_DESCRIPTION="CE N'EST PAS VOTRE MOT DE PASSE DE CONNEXION OVH ! Créez un utilisateur depuis votre gestionnaire de cloud OVH, Serveurs, développez votre serveur, cliquez sur OpenStack, puis sur Ajouter un utilisateur. Copiez ici le mot de passe de l'utilisateur créé."
COM_AKEEBA_CONFIG_OVH_PASSWORD_TITLE="Mot de passe OpenStack"
COM_AKEEBA_CONFIG_OVH_PROJECTID_DESCRIPTION="L'identifiant de projet de votre serveur cloud OVH. Dans le gestionnaire cloud d'OVH, développez votre serveur et cliquez sur le lien Stockage. Dans la zone principale de la page, vous voyez le nom du serveur et juste en dessous une chaîne alphanumérique de 32 caractères telle que a0b1c2d3e4f56789abcdef0123456789. Il s'agit de l'identifiant de projet que vous devez saisir ici."
COM_AKEEBA_CONFIG_OVH_PROJECTID_TITLE="Identifiant de projet"
COM_AKEEBA_CONFIG_OVH_USERNAME_DESCRIPTION="CE N'EST PAS VOTRE NOM D'UTILISATEUR DE CONNEXION OVH ! Créez un utilisateur depuis votre gestionnaire de cloud OVH, Serveurs, développez votre serveur, cliquez sur OpenStack, puis sur Ajouter un utilisateur. Copiez ici l'identifiant de l'utilisateur créé."
COM_AKEEBA_CONFIG_OVH_USERNAME_TITLE="Nom d'utilisateur OpenStack"
COM_AKEEBA_CONFIG_PARTSIZE_DESCRIPTION="Akeeba Backup peut créer des archives fractionnées (multiparties) afin de contourner les restrictions de taille dans diverses situations. Cette option définit la taille maximale de chaque partie de l'archive. Si vous la réduisez à 0, la fonctionnalité multipartie est désactivée.</br><b>Important :</b> Si vous utilisez un moteur de traitement des données qui transfère les archives vers un emplacement distant (par exemple, un stockage en nuage), utilisez une valeur d'environ 1 à 5 Mo pour des résultats optimaux."
COM_AKEEBA_CONFIG_PARTSIZE_TITLE="Taille des parties pour les archives fractionnées"
COM_AKEEBA_CONFIG_PERMISSIONS_0600="0600 – Sécurité renforcée, peut causer des problèmes sur les serveurs d'entrée de gamme"
COM_AKEEBA_CONFIG_PERMISSIONS_0644="0644 – Sécurité moyenne, pour les serveurs hébergeant un seul site"
COM_AKEEBA_CONFIG_PERMISSIONS_0666="0666 – Sécurité assouplie, compatibilité maximale avec les hébergeurs commerciaux"
COM_AKEEBA_CONFIG_PERMISSIONS_DESCRIPTION="Définissez les permissions des fichiers d'archives de sauvegarde. S'applique uniquement sous Linux, macOS, BSD et autres systèmes de type UNIX (PAS Windows). En cas de doute, laissez la valeur 0666. La modifier peut rendre impossible le téléchargement et/ou la suppression des fichiers d'archives de sauvegarde via FTP et SFTP. Si votre serveur utilise PHP-FPM ou fait tourner PHP sous le même utilisateur que le compte système de votre site, utilisez 0600 pour une sécurité optimale."
COM_AKEEBA_CONFIG_PERMISSIONS_TITLE="Permissions des archives"
COM_AKEEBA_CONFIG_PGDUMP_PATH_DESCRIPTION="Le chemin absolu dans le système de fichiers vers l'outil en ligne de commande pg_dump sur votre serveur. S'il est laissé vide, Akeeba Backup essaiera de le détecter automatiquement."
COM_AKEEBA_CONFIG_PGDUMP_PATH_TITLE="Chemin vers pg_dump"
COM_AKEEBA_CONFIG_PLATFORM="Remplacements du site"
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_DESCRIPTION="Si activée, Akeeba Backup tentera de se connecter à votre serveur FTP en utilisant une connexion chiffrée SSL. <strong>Ce n'est pas la même chose que SFTP, SCP ou le « FTP sécurisé » !</strong> Notez que si votre serveur ne prend pas en charge cette méthode, vous obtiendrez des erreurs de connexion."
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_TITLE="Utiliser FTP sur SSL (FTPS)"
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_DESCRIPTION="Le nom d'hôte du serveur FTP, sans le protocole. Cela signifie que <tt>ftp://example.com</tt> est <b>invalide</b> et que <tt>example.com</tt> est valide. Ce moteur ne prend en charge que les serveurs FTP et FTPS. Il <u>ne prend pas</u> en charge SFTP, SCP et autres variantes SSH."
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_TITLE="Nom d'hôte"
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_DESCRIPTION="Le chemin <b>FTP</b> absolu vers le répertoire où les fichiers seront téléversés. En cas de doute, connectez-vous à votre serveur avec FileZilla, naviguez jusqu'au répertoire souhaité et copiez le chemin affiché dans le volet de droite au-dessus de la liste des répertoires. Il s'agit généralement d'un chemin court, comme <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_TITLE="Répertoire initial"
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_DESCRIPTION="Le chemin relatif au répertoire initial, il sera créé s'il n'existe pas. Laissez vide pour téléverser les archives directement dans le répertoire initial. Vous pouvez utiliser les macros suivantes :<ul><li><b>[HOST]</b> Le nom d'hôte. ATTENTION ! Cette balise ne fonctionne pas en mode CRON.</li><li><b>[DATE]</b> La date actuelle</li><li><b>[TIME]</b> L'heure actuelle</li></ul>D'autres macros sont disponibles ; veuillez consulter la documentation."
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_TITLE="Sous-répertoire"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_DESCRIPTION="Utiliser le mode passif FTP lors des transferts de données. Cette option est activée par défaut car il s'agit de la seule méthode fonctionnant à travers les pare-feu généralement installés sur les serveurs web. Ne la désactivez pas, sauf si vous êtes certain que votre serveur web n'est pas derrière un pare-feu et que votre serveur FTP exige absolument les transferts en mode actif."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_TITLE="Utiliser le mode passif"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_DESCRIPTION="Le mot de passe du serveur FTP. Il est généralement sensible à la casse. En cas de doute, veuillez contacter votre administrateur réseau."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_TITLE="Mot de passe"
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_DESCRIPTION="Le port du serveur FTP. Le paramètre le plus courant est 21. En cas de doute, veuillez contacter votre administrateur réseau."
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_TITLE="Port"
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_DESCRIPTION="Utilisez ce bouton pour tester la connexion FTP et afficher les erreurs de connexion en cas d'échec."
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_TITLE="Tester la connexion FTP"
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_DESCRIPTION="Le nom d'utilisateur du serveur FTP. Il est généralement sensible à la casse. En cas de doute, veuillez contacter votre administrateur réseau."
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_TITLE="Nom d'utilisateur"
COM_AKEEBA_CONFIG_POSTPROCPARTS_DESCRIPTION="Lorsque cette option est activée, Akeeba Backup exécutera le moteur de post-traitement sur chaque partie dès qu'elle est terminée. Lorsqu'elle est désactivée, Akeeba Backup effectuera le post-traitement de toutes les parties à la fin du processus de sauvegarde."
COM_AKEEBA_CONFIG_POSTPROCPARTS_TITLE="Traiter chaque partie immédiatement"
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_DESCRIPTION="Le nom d'hôte du serveur SFTP, sans le protocole. Cela signifie que <tt>sftp://example.com</tt> ou <tt>ssh://example.com</tt> est <b>invalide</b> et ne doit PAS être utilisé, mais que <tt>example.com</tt> est valide et DOIT être utilisé. Ce moteur ne prend en charge que les serveurs SFTP (SSH). Il <u>ne prend pas</u> en charge FTP, FTPS ou toute autre variante FTP. Il nécessite que l'extension PHP SSH2 soit installée et activée."
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_TITLE="Nom d'hôte"
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_DESCRIPTION="Le chemin <b>SFTP</b> absolu (généralement identique au chemin du système de fichiers) vers le répertoire où les fichiers seront téléversés. En cas de doute, connectez-vous à votre serveur avec FileZilla, naviguez jusqu'au répertoire souhaité et copiez le chemin affiché dans le volet de droite au-dessus de la liste des répertoires. Il s'agit généralement d'un chemin long, comme <tt>/home/myuser/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_TITLE="Répertoire initial"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_DESCRIPTION="Le mot de passe du serveur SFTP. Il est généralement sensible à la casse. En cas de doute, veuillez contacter votre administrateur réseau."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_TITLE="Mot de passe"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_DESCRIPTION="Le port du serveur SFTP. Le paramètre le plus courant est 22. En cas de doute, veuillez contacter votre administrateur réseau."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_TITLE="Port"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_DESCRIPTION="LISEZ LA DOCUMENTATION AVANT UTILISATION. Le chemin absolu dans le système de fichiers vers un fichier de clé privée RSA/DSA utilisé pour se connecter au serveur distant. S'il est chiffré, saisissez la phrase secrète dans le champ mot de passe ci-dessus. Si vous ne savez pas ce que c'est, ou si vous pensez devoir demander de l'aide à ce sujet, laissez ce champ vide et ne nous contactez pas à ce sujet."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_TITLE="Fichier de clé privée (avancé)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_DESCRIPTION="LISEZ LA DOCUMENTATION AVANT UTILISATION. Le chemin absolu dans le système de fichiers vers un fichier de clé publique RSA/DSA utilisé pour se connecter au serveur distant. Si vous ne savez pas ce que c'est, ou si vous pensez devoir demander de l'aide à ce sujet, laissez ce champ vide et ne nous contactez pas à ce sujet."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_TITLE="Fichier de clé publique (avancé)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_DESCRIPTION="Utilisez ce bouton pour tester la connexion SFTP et afficher les erreurs de connexion en cas d'échec."
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_TITLE="Tester la connexion SFTP"
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_DESCRIPTION="Le nom d'utilisateur du serveur SFTP. Il est généralement sensible à la casse. En cas de doute, veuillez contacter votre administrateur réseau."
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_TITLE="Nom d'utilisateur"
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_DESCRIPTION="Arrête immédiatement le processus de sauvegarde, en le marquant comme échoué, si une erreur de téléversement se produit. <strong>Cette option peut être trompeuse et dangereuse.</strong> Il est possible que vous disposiez d'une sauvegarde complète et valide qui n'a tout simplement pas pu être téléversée en tout ou en partie. L'activation de cette option supprimera les fichiers d'archives de sauvegarde restants de votre serveur et laissera sur le stockage distant les fichiers d'archives (partiellement) téléversés. En d'autres termes, vous vous retrouvez sans sauvegarde fonctionnelle. Il n'existe que très peu de cas d'usage où cela est plus judicieux que le comportement par défaut, qui vous permet de reprendre le téléversement des fichiers d'archives via la page Gérer les sauvegardes. En conséquence, nous recommandons vivement que cette option ne soit activée que par des utilisateurs experts qui comprennent pleinement les implications d'une telle action."
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_TITLE="Faire échouer la sauvegarde en cas d'erreur de téléversement"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_DESCRIPTION="L'adresse courriel à laquelle les fichiers de sauvegarde seront envoyés"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_TITLE="Adresse courriel"
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_DESCRIPTION="L'objet du courriel (facultatif). Cette option est principalement utile pour distinguer les sauvegardes provenant de plusieurs sites."
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_TITLE="Objet du courriel"
COM_AKEEBA_CONFIG_PROCENGINE_DESCRIPTION="Les moteurs de post-traitement permettent à Akeeba Backup de transférer les parties finalisées des archives de sauvegarde vers d'autres serveurs et fournisseurs de stockage distant."
COM_AKEEBA_CONFIG_PROCENGINE_TITLE="Moteur de post-traitement"
COM_AKEEBA_CONFIG_PROXY_HOST_DESC="Si votre site doit se connecter à un serveur mandataire (proxy sortant) pour communiquer avec l'extérieur, saisissez ici le nom d'hôte ou l'adresse IP du proxy. Laissez ce champ vide pour ne pas utiliser de proxy."
COM_AKEEBA_CONFIG_PROXY_HOST_LABEL="Nom d'hôte / adresse IP du proxy"
COM_AKEEBA_CONFIG_PROXY_PASS_DESC="Si votre serveur mandataire requiert une authentification, saisissez ici le mot de passe d'authentification. N'oubliez pas de renseigner un nom d'utilisateur non vide dans l'option ci-dessus."
COM_AKEEBA_CONFIG_PROXY_PASS_LABEL="Mot de passe du proxy"
COM_AKEEBA_CONFIG_PROXY_PORT_DESC="Saisissez le port TCP/IP sur lequel le serveur mandataire est à l'écoute. En général, il s'agit du port 8080 ou 3128. En cas de doute, contactez votre hébergeur ou votre administrateur réseau."
COM_AKEEBA_CONFIG_PROXY_PORT_LABEL="Port du proxy"
COM_AKEEBA_CONFIG_PROXY_USER_DESC="Si votre serveur mandataire requiert une authentification, saisissez ici le nom d'utilisateur d'authentification. Laissez ce champ vide pour utiliser un proxy ne nécessitant pas d'authentification."
COM_AKEEBA_CONFIG_PROXY_USER_LABEL="Nom d'utilisateur du proxy"
COM_AKEEBA_CONFIG_PUSH_APIKEY_DESC="Accédez à https://www.pushbullet.com/account et copiez le jeton d'accès affiché sur cette page dans le champ ci-dessous. Il est utilisé pour envoyer des notifications push à votre compte. Vous pouvez coller plusieurs jetons séparés par des virgules. Remarque : le jeton d'accès est visible par toutes les personnes ayant accès à cette page de configuration."
COM_AKEEBA_CONFIG_PUSH_APIKEY_LABEL="Jeton d'accès Pushbullet"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_DESC="Akeeba Backup doit-il vous envoyer des notifications et, si oui, de quelle manière ?"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_LABEL="Notifications push"
COM_AKEEBA_CONFIG_QUICKICON_DESC="Lorsque cette option est activée, Akeeba Backup affiche une icône de sauvegarde en un clic en haut de la page du panneau de contrôle. Cliquer dessus active ce profil et lance une sauvegarde sans aucune autre action de votre part."
COM_AKEEBA_CONFIG_QUICKICON_LABEL="Icône de sauvegarde en un clic"
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_DESCRIPTION="Lorsque cette option est activée, la sauvegarde en cours participe aux quotas des fichiers distants. Cela peut être problématique : si la sauvegarde est partiellement téléversée vers le stockage distant et que les paramètres de quota sont tels que seule la dernière sauvegarde est conservée, vous risquez de vous retrouver sans sauvegarde valide stockée à distance. La désactiver réduit ce risque, au prix du stockage d'une archive de sauvegarde supplémentaire à distance."
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_TITLE="La sauvegarde en cours participe aux quotas des fichiers distants"
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_DESCRIPTION="Lorsque cette option est activée, les paramètres de quota ci-dessous s'appliquent aux fichiers stockés sur un stockage distant, tel qu'Amazon S3 ou des serveurs FTP distants."
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_TITLE="Activer les quotas pour les fichiers distants"
COM_AKEEBA_CONFIG_RUNTIMEBIAS_DESCRIPTION="Ce paramètre définit le degré de prudence d'Akeeba Backup pour éviter une expiration de délai. Plus cette valeur est faible, plus le comportement est conservateur. Si vous obtenez des erreurs d'expiration de délai, essayez de réduire à la fois la durée d'exécution maximale et ce paramètre.<b>Conseil</b> : sélectionnez Personnalisé et saisissez la valeur souhaitée si elle ne figure pas dans la liste."
COM_AKEEBA_CONFIG_RUNTIMEBIAS_TITLE="Marge d'exécution"
COM_AKEEBA_CONFIG_S3ACCESSKEY_DESCRIPTION="Votre clé d'accès Amazon S3, disponible sur la page de votre profil personnel Amazon Web Services"
COM_AKEEBA_CONFIG_S3ACCESSKEY_TITLE="Clé d'accès"
COM_AKEEBA_CONFIG_S3BUCKET_DESCRIPTION="Le nom de votre compartiment Amazon S3"
COM_AKEEBA_CONFIG_S3BUCKET_TITLE="Compartiment"
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_DESCRIPTION="Pour une utilisation avec des services de stockage tiers implémentant une API compatible S3. Saisissez le point de terminaison (URL de l'API) de l'API compatible S3 du service de stockage tiers. IMPORTANT : si vous utilisez Amazon S3, vous <strong>DEVEZ LAISSER CE CHAMP VIDE</strong>."
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_TITLE="Point de terminaison personnalisé"
COM_AKEEBA_CONFIG_S3DIRECTORY_DESCRIPTION="Le répertoire au sein de votre compartiment où les archives de sauvegarde seront stockées. Laissez ce champ vide pour stocker les fichiers à la racine du compartiment."
COM_AKEEBA_CONFIG_S3DIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_S3_ACL_TITLE="Permissions des fichiers (ACL)"
COM_AKEEBA_CONFIG_S3_ACL_DESCRIPTION="Choisissez les permissions du fichier téléversé. Dans la plupart des cas, «Privé» ou «Le propriétaire du compartiment peut lire» sont les choix les plus appropriés. Si vous utilisez un service tiers compatible S3, il est conseillé de choisir «Privé» plutôt que le paramètre par défaut."
COM_AKEEBA_CONFIG_S3_ACL_PRIVATE="Privé"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ="Tout le monde peut lire"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ_WRITE="Tout le monde peut lire et écrire"
COM_AKEEBA_CONFIG_S3_ACL_AUTHENTICATED_READ="Les utilisateurs IAM authentifiés peuvent lire"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_READ="Le propriétaire du compartiment peut lire"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_FULL_CONTROL="Le propriétaire du compartiment dispose d'un contrôle total"
COM_AKEEBA_CONFIG_S3LEGACY_DESCRIPTION="Lorsque cette option est activée, tous les téléversements vers Amazon S3 sont forcés en mode partie unique. Utilisez cette option si vous obtenez des erreurs RequestTimeout du moteur S3 lors du téléversement de parties de sauvegarde."
COM_AKEEBA_CONFIG_S3LEGACY_TITLE="Désactiver les téléversements multipart"
COM_AKEEBA_CONFIG_S3RRS_DESCRIPTION="Sélectionnez la classe de stockage pour vos données. Standard est le stockage habituel pour les données critiques. Veuillez consulter la documentation Amazon S3 pour la description de chaque classe de stockage."
COM_AKEEBA_CONFIG_S3RRS_TITLE="Classe de stockage"
COM_AKEEBA_CONFIG_S3SECRETKEY_DESCRIPTION="Votre clé secrète Amazon S3, disponible sur la page de votre profil personnel Amazon Web Services"
COM_AKEEBA_CONFIG_S3SECRETKEY_TITLE="Clé secrète"
COM_AKEEBA_CONFIG_S3USESSL_DESCRIPTION="Si cette option est activée, une connexion sécurisée (HTTPS) sera utilisée lors du téléversement de vos fichiers. Bien qu'elle renforce la sécurité des données transférées, elle augmente également le risque d'échec de la sauvegarde en raison d'une expiration de délai."
COM_AKEEBA_CONFIG_S3USESSL_TITLE="Utiliser SSL"
COM_AKEEBA_CONFIG_S3_DUALSTACK_DESCRIPTION="Faut-il utiliser les points de terminaison dual-stack pour Amazon S3 ? Cela permet d'accéder à S3 via IPv6 pour les serveurs qui prennent en charge IPv6. Les serveurs sans prise en charge IPv6 pourront toujours accéder à S3 via IPv4. Cette option n'a aucun effet si vous utilisez un point de terminaison personnalisé."
COM_AKEEBA_CONFIG_S3_DUALSTACK_TITLE="Activer la prise en charge IPv6 (dual-stack)"
COM_AKEEBA_CONFIG_S3_ALTERNATEDATEHEADERFORMAT_TITLE="Format de date alternatif"
COM_AKEEBA_CONFIG_S3_ALTERNATEDATEHEADERFORMAT_DESCRIPTION="Ne désactivez ce paramètre que si le support vous le demande."
COM_AKEEBA_CONFIG_S3_USEHTTPDATEHEADER_TITLE="Utiliser l'en-tête HTTP Date au lieu de X-Amz-Date"
COM_AKEEBA_CONFIG_S3_USEHTTPDATEHEADER_DESCRIPTION="N'activez ce paramètre que si le support vous le demande."
COM_AKEEBA_CONFIG_S3_PRESIGNEDBUCKETINURL_TITLE="Inclure le nom du compartiment dans les URL pré-signées v4"
COM_AKEEBA_CONFIG_S3_PRESIGNEDBUCKETINURL_DESCRIPTION="N'activez ce paramètre que si le support vous le demande."

COM_AKEEBA_CONFIG_SAVENEW_DEFAULT_PROFILE_NAME="Nouveau profil de sauvegarde"
COM_AKEEBA_CONFIG_SAVE_OK="La configuration a été enregistrée"
COM_AKEEBA_CONFIG_SCANENGINE_DESCRIPTION="Définit la manière dont Akeeba Backup parcourt les fichiers et répertoires de votre site afin de déterminer lesquels doivent être sauvegardés."
COM_AKEEBA_CONFIG_SCANENGINE_TITLE="Moteur d'analyse du système de fichiers"
COM_AKEEBA_CONFIG_SECRETWORD_DESC="Ce mot de passe sera utilisé avec les fonctionnalités de sauvegarde frontale (API héritée) et d'API JSON pour les protéger contre les accès non autorisés. Akeeba Backup N'ACTIVERA PAS ces fonctionnalités sans l'utilisation d'un mot de passe long et complexe.<br><br><strong>Note de sécurité :</strong> la Clé secrète est le seul identifiant accepté par l'API JSON, et il est illimité. Quiconque la détient peut modifier toutes les options, prendre une sauvegarde et en télécharger l'archive — et une archive de sauvegarde est une copie complète de votre site, identifiants de base de données et comptes utilisateurs compris. Traitez-la avec le même soin que votre mot de passe d'administrateur. Consultez la documentation pour plus d'informations."
COM_AKEEBA_CONFIG_SECRETWORD_LABEL="Clé secrète"
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_DESCRIPTION="Lorsque cette option est activée, les paramètres de configuration sont chiffrés à l'aide du chiffrement standard AES-128."
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_LABEL="Utiliser le chiffrement"
COM_AKEEBA_CONFIG_SFTPTEST_BADPREFIX="Vous ne devez PAS ajouter le préfixe sftp:// au nom d'hôte SFTP. Veuillez supprimer le préfixe sftp:// et réessayer."
COM_AKEEBA_CONFIG_SFTPTEST_NOUPLOAD="Akeeba Backup a pu se connecter à votre serveur, mais n'a pas pu y téléverser un fichier de test. Le téléversement de la sauvegarde pourrait échouer."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_DESCRIPTION="Lorsque cette option est activée, Akeeba Backup supprime les anciens fichiers de sauvegarde si la taille totale des archives de sauvegarde dépasse la valeur définie ci-dessous. Ce paramètre s'applique <b>par profil</b>."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_TITLE="Activer le quota par taille"
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_DESCRIPTION="Si la taille totale des archives de sauvegarde prises avec le profil actuel dépasse cette limite, les sauvegardes les plus anciennes seront supprimées du serveur.<br/><br/><b>Conseil</b> : sélectionnez Personnalisé et saisissez la valeur souhaitée si elle ne figure pas dans la liste."
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_TITLE="Quota par taille"
COM_AKEEBA_CONFIG_SPLITDBDUMP_DESCRIPTION="Les vidages de vos bases de données seront fractionnés en petits fichiers afin d'améliorer la compression et d'éviter des problèmes de taille de fichier sur certains hébergements économiques. Idéalement, utilisez la moitié de la taille de votre seuil de fichiers volumineux. Définissez à 0 pour désactiver le fractionnement et créer un seul fichier de vidage par base de données."
COM_AKEEBA_CONFIG_SPLITDBDUMP_TITLE="Taille pour les fichiers SQL de vidage fractionnés"
COM_AKEEBA_CONFIG_SUGARSYNC_ACCESS_DESCRIPTION="Saisissez votre identifiant de clé d'accès. Créez-en un sur https://www.sugarsync.com/developer/account"
COM_AKEEBA_CONFIG_SUGARSYNC_ACCESS_TITLE="Identifiant de clé d'accès"
COM_AKEEBA_CONFIG_SUGARSYNC_DIRECTORY_DESCRIPTION="Le répertoire dans lequel stocker les fichiers de sauvegarde. Si la première partie du répertoire ne correspond pas au nom d'un dossier de synchronisation SugarSync, le répertoire sera créé dans votre dossier Magic Briefcase. Vous pouvez utiliser les mêmes variables que pour les noms d'archives de sauvegarde, par exemple [HOST] pour le nom de domaine de votre site ou [DATE] pour la date actuelle."
COM_AKEEBA_CONFIG_SUGARSYNC_DIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_SUGARSYNC_EMAIL_DESCRIPTION="L'adresse courriel de votre compte SugarSync"
COM_AKEEBA_CONFIG_SUGARSYNC_EMAIL_TITLE="Courriel"
COM_AKEEBA_CONFIG_SUGARSYNC_PASSWORD_TITLE="Mot de passe"
COM_AKEEBA_CONFIG_SUGARSYNC_PRIVATE_DESCRIPTION="Saisissez la clé d'accès privée correspondant à votre identifiant de clé d'accès. Créez-en une sur https://www.sugarsync.com/developer/account"
COM_AKEEBA_CONFIG_SUGARSYNC_PRIVATE_TITLE="Clé d'accès privée"
COM_AKEEBA_CONFIG_SWIFT_AUTHURL_DESCRIPTION="Le point de terminaison du service Keystone de votre installation OpenStack. Incluez bien la version. N'incluez PAS le suffixe /token. Exemple : https://authentication.example.com/v2.0"
COM_AKEEBA_CONFIG_SWIFT_AUTHURL_TITLE="URL d'authentification"
COM_AKEEBA_CONFIG_SWIFT_CONTAINERURL_DESCRIPTION="Le point de terminaison API de votre conteneur de stockage d'objets, par exemple https://storage.example.com/v1/AUTH_abcdef0123456789abcdef0123456789/my-container"
COM_AKEEBA_CONFIG_SWIFT_CONTAINERURL_TITLE="URL du conteneur"
COM_AKEEBA_CONFIG_SWIFT_DIRECTORY_DESCRIPTION="Le répertoire au sein du conteneur de stockage d'objets OpenStack Swift dans lequel stocker les archives de sauvegarde. Pour tout stocker à la racine du conteneur, laissez ce champ vide."
COM_AKEEBA_CONFIG_SWIFT_DIRECTORY_TITLE="Répertoire"
COM_AKEEBA_CONFIG_SWIFT_DOMAIN_DESCRIPTION="Utilisé uniquement avec l'authentification Keystone v3. Il s'agit du domaine d'authentification pour le service Keystone v3, <strong>PAS</strong> le nom d'hôte du serveur d'authentification Keystone. Dans la plupart des cas, il s'agit de <code>default</code> ou <code>Default</code>. En cas de doute, veuillez consulter votre fournisseur de stockage."
