COM_AKEEBA_CONFIG_UPLOADKICKSTART_DESCRIPTION="Lorsque cette option est activée, une copie d'Akeeba Kickstart Professional sera téléversée vers le stockage distant spécifié dans le moteur de post-traitement ci-dessus (à l'exception des moteurs Aucun et Courriel). Cela est utile lors de l'utilisation de FTP ou SFTP pour transférer votre site vers un autre serveur : votre archive de sauvegarde et Kickstart, utilisé pour l'extraire, seront tous deux téléversés sur votre serveur distant. Une fois la sauvegarde terminée, il vous suffira de lancer Kickstart sur le site distant et de procéder à la restauration. Si simple !"
