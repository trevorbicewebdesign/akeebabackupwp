COM_AKEEBA_TRANSFER_DESC="Trasferisce l'archivio eseguendo il motore di post-elaborazione \"%s\" sull'archivio."
COM_AKEEBA_TRANSFER_ERR_CANNOTACCESSTESTFILE="Akeeba Backup non riesce a verificare che le informazioni di connessione inserite corrispondano all'URL del sito indicato. Se si sta tentando di ripristinare in una sottodirectory di un sito esistente, significa che il sito principale sta bloccando l'accesso alla sottodirectory; contattare l'amministratore del sito. In tutti gli altri casi sono state inserite informazioni di connessione errate, molto probabilmente una directory sbagliata. Contattare il proprio host e richiedere le informazioni di connessione corrette, <em>inclusa la directory</em>, corrispondenti all'URL inserito in questa procedura guidata. Tornare quindi qui, inserire le informazioni corrette e continuare con il ripristino."
COM_AKEEBA_TRANSFER_ERR_CANNOTREADLOCALFILE="Akeeba Backup non riesce a leggere il file di backup locale <code>%s</code>. Questa procedura guidata non è riuscita. Eseguire un nuovo backup e riprovare. Notare che sono stati lasciati dei file sul nuovo server; potrebbe essere necessario rimuoverli manualmente."
COM_AKEEBA_TRANSFER_ERR_CANNOTRUNKICKSTART="Akeeba Backup non riesce a eseguire Akeeba Kickstart sul nuovo sito. Se si sta tentando di ripristinare in una sottodirectory di un sito esistente, significa che il sito principale sta bloccando l'accesso alla sottodirectory; contattare l'amministratore del sito. In tutti gli altri casi è necessario contattare il proprio host e verificare che la versione predefinita di PHP soddisfi i requisiti minimi di Kickstart."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADARCHIVE="Akeeba Backup non riesce a caricare il file di backup <code>%s</code>. È possibile che il server del nuovo sito abbia esaurito lo spazio su disco o che una protezione del server stia bloccando la trasmissione dei dati. Provare a trasferire il sito selezionando l'opzione di trasferimento manuale. Notare che sono stati lasciati dei file sul nuovo server; potrebbe essere necessario rimuoverli manualmente."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADKICKSTART="Akeeba Backup non riesce a caricare Akeeba Kickstart nella radice del nuovo sito. Verificare di aver inserito le informazioni di connessione corrette e che l'utente FTP/SFTP possa scrivere file nella directory selezionata. Se sul sito remoto sono già presenti kickstart.php e kickstart.transfer.php, rimuoverli prima di ripetere il trasferimento del sito."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTEMP="Akeeba Backup non riesce a caricare un blocco dell'archivio di backup dal file locale <code>%s</code> al file remoto <code>%s</code>. Verificare che il server remoto consenta il caricamento di file e che vi sia spazio su disco sufficiente per il/i file dell'archivio di backup."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTESTFILE="Akeeba Backup non riesce a caricare un file di test denominato <code>%s</code> nella radice del nuovo sito. Verificare di aver inserito le informazioni di connessione corrette e che l'utente FTP/SFTP possa scrivere file nella directory selezionata."
COM_AKEEBA_TRANSFER_ERR_CANNOTWRITEREMOTEFILES="Purtroppo Akeeba Backup ha rilevato che non è possibile scrivere direttamente i file sul server remoto. Questa procedura guidata non può procedere. Sarà necessario utilizzare il metodo di trasferimento «Manuale»."
COM_AKEEBA_TRANSFER_ERR_CANTCREATETEMPCHUNK="Impossibile creare un file temporaneo su questo server. Verificare che la directory temporanea sia configurata correttamente e sia accessibile in scrittura dall'utente con cui è in esecuzione il server web."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP="Nessun backup trovato. Fare clic sul pulsante Esegui backup ora per eseguire un nuovo backup."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP_SPECIFIC="Il backup #%d non può essere trasferito. O non è un backup completo dell'intero sito, oppure i suoi file di archivio non sono più presenti su questo server."
COM_AKEEBA_TRANSFER_ERR_DNS="Il nome di dominio dell'URL inserito (%s) non può essere risolto dal server su cui è in esecuzione Akeeba Backup. Se il nome di dominio è stato registrato o trasferito di recente, attendere che i server DNS vengano aggiornati (in genere da 6 a 48 ore). In caso contrario, verificare le impostazioni DNS del nome di dominio."
COM_AKEEBA_TRANSFER_ERR_ERRORFROMREMOTE="Akeeba Backup ha ricevuto un errore dal server remoto durante il tentativo di caricamento dell'archivio di backup. L'errore era: %s"
COM_AKEEBA_TRANSFER_ERR_EXISTINGSITE="In quella posizione esiste già un altro sito. Rimuovere il sito esistente prima di trasferire un nuovo sito. Tentare di sovrascrivere un sito esistente causerà molto probabilmente un sito danneggiato che non sarà possibile riparare."
COM_AKEEBA_TRANSFER_ERR_HTACCESS="È stato trovato un file <code>%s</code> nella radice del nuovo sito. Questo file può interferire con il processo di trasferimento del sito. Rimuoverlo prima di procedere con il trasferimento del sito. Notare che il file potrebbe essere <em>nascosto</em>. Se non è visibile nel browser di file del pannello di controllo dell'hosting o nel client FTP, contattare il proprio host per ulteriori informazioni su come rimuoverlo."
COM_AKEEBA_TRANSFER_ERR_INVALIDID="ID di caricamento specificato non valido"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN="Verifica"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN_IGNOREERROR="Desidero ignorare questo avviso e procedere <strong>a mio rischio e pericolo</strong>"
COM_AKEEBA_TRANSFER_ERR_NEWURL_INVALID="L'URL inserito non è valido."
COM_AKEEBA_TRANSFER_ERR_NEWURL_NOTEXISTS="Il server non riesce ad accedere all'URL inserito. Verificare che sia stato digitato correttamente. Si noti inoltre che i nomi di dominio appena assegnati o trasferiti potrebbero richiedere <strong>fino a 48 ore</strong> prima di essere visibili a tutti i server e computer connessi a Internet."
COM_AKEEBA_TRANSFER_ERR_NEWURL_SAME="L'URL inserito è lo stesso da cui si sta eseguendo il ripristino. Questa procedura guidata non supporta questa operazione. Per il ripristino del backup senza utilizzare la procedura guidata, consultare il video tutorial tramite il collegamento sottostante."
COM_AKEEBA_TRANSFER_ERR_NOTENOUGHSPACE="Il trasferimento del sito non può procedere. Sono necessari circa %s di spazio libero, ma il server indica che al momento sono disponibili solo %s. Liberare più spazio sul server."
COM_AKEEBA_TRANSFER_ERR_OVERRIDE="Ignora gli errori rilevati e trasferisci il sito comunque"
COM_AKEEBA_TRANSFER_ERR_SAMESITE="Sono state inserite le informazioni di connessione al sito da cui si sta eseguendo il trasferimento. <strong>Questo errore avrebbe eliminato il proprio sito</strong>. È necessario inserire le informazioni di connessione FTP/SFTP al sito di destinazione <strong>destinazione</strong> (nuovo sito o nuovo server). Correggere le informazioni soprastanti e riprovare."
COM_AKEEBA_TRANSFER_ERR_SPACE="Sono disponibili solo <span></span> di spazio libero. È necessario più spazio libero per trasferire il sito. Contattare il proprio host."
COM_AKEEBA_TRANSFER_ERR_WRONGSSL="Il sito ha un certificato SSL non valido o auto-firmato. Per motivi di sicurezza il trasferimento del sito non può procedere. Fare clic su Reimposta per riavviare il trasferimento del sito e utilizzare un URL senza <code>https://</code>. Ciò è necessario quando si cerca di trasferire il sito prima di trasferire il nome di dominio al nuovo host. In alternativa, contattare il proprio host per ottenere un certificato SSL valido. Sarà sufficiente anche uno gratuito rilasciato dall'autorità di certificazione senza costi Let's Encrypt."
COM_AKEEBA_TRANSFER_FORCE_BODY="La Procedura guidata di trasferimento sito è in esecuzione in modalità forzata. Ciò significa che alcuni controlli di integrità che normalmente vengono eseguiti prima del trasferimento del sito non verranno eseguiti. Di conseguenza, il trasferimento potrebbe sovrascrivere un sito esistente, concludersi con un URL diverso da quello previsto o semplicemente non riuscire. <strong>Questa è una funzionalità per utenti avanzati. Non continuare se non ci si sente a proprio agio con essa.</strong>"
