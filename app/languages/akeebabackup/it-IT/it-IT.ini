COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BOX_DESCRIPTION="Carica l'archivio di backup su Box.com. Leggere la documentazione."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BOX_TITLE="Carica su Box.com"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_DESCRIPTION="Carica l'archivio di backup su RackSpace CloudFiles.<br/><strong>Ricordarsi di impostare una dimensione di suddivisione dell'archivio di 2-30 MB o si rischiano errori di backup per timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_TITLE="Carica su RackSpace CloudFiles"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDME_DESCRIPTION="Carica l'archivio di backup su CloudMe.<br/><strong>Ricordarsi di impostare una dimensione di suddivisione dell'archivio di 2-30 MB o si rischiano errori di backup per timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDME_TITLE="Carica su CloudMe"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_DESCRIPTION="Carica l'archivio di backup su DreamObjects.<br/><strong>Ricordarsi di impostare una dimensione di suddivisione dell'archivio di 2-30 MB o si rischiano errori di backup per timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_TITLE="Carica su DreamObjects"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DROPBOX2_DESCRIPTION="Carica l'archivio di backup su Dropbox utilizzando l'API Dropbox V2. Questa API è più veloce e consente di collegare facilmente il proprio account Dropbox a più siti."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DROPBOX2_TITLE="Carica su Dropbox (API v2)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_DESCRIPTION="Invia l'archivio di backup come allegato e-mail.<br/><strong>Ricordare di impostare una dimensione di suddivisione dell'archivio di 1-2 MB, altrimenti si rischia un errore di backup a causa di timeout e insufficienza di memoria!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_TITLE="Invia tramite e-mail"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_DESCRIPTION="Carica l'archivio di backup su un server FTP o FTPS (FTP su SSL implicito) remoto.<br/>Questo motore di post-elaborazione utilizza la libreria cURL, che garantisce una migliore compatibilità con un'ampia gamma di server FTP.<br/><strong>Ricordare di impostare una dimensione di suddivisione dell'archivio di 2-30 MB, altrimenti si rischia un errore di backup a causa di timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_TITLE="Carica su server FTP remoto tramite cURL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_DESCRIPTION="Carica l'archivio di backup su un server FTP o FTPS (FTP su SSL implicito) remoto.<br/><strong>Ricordare di impostare una dimensione di suddivisione dell'archivio di 2-30 MB, altrimenti si rischia un errore di backup a causa di timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_TITLE="Carica su server FTP remoto"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_DESCRIPTION="Carica l'archivio di backup su Google Drive. Si prega di leggere la documentazione."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_TITLE="Carica su Google Drive"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_DESCRIPTION="Carica l'archivio di backup su Google Storage utilizzando la moderna API JSON. Questa è l'integrazione consigliata con Google Storage.<br/><strong>Ricordare di impostare una dimensione di suddivisione dell'archivio di 2-30 MB, altrimenti si rischia un errore di backup a causa di timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_TITLE="Carica su Google Storage (API JSON)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_DESCRIPTION="Carica l'archivio di backup su Google Storage utilizzando l'emulazione legacy dell'API S3. Questa opzione è deprecata e verrà rimossa in futuro. Si consiglia di utilizzare invece l'opzione API JSON.<br/><strong>Ricordare di impostare una dimensione di suddivisione dell'archivio di 2-30 MB, altrimenti si rischia un errore di backup a causa di timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_TITLE="Carica su Google Storage (API S3 legacy)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_NONE_DESCRIPTION="Lascia i file dell'archivio di backup sul server"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_NONE_TITLE="Nessuna post-elaborazione"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_DESCRIPTION="Carica l'archivio di backup su Microsoft OneDrive o Microsoft OneDrive for Business."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_TITLE="Carica su Microsoft OneDrive o OneDrive for Business"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_DESCRIPTION="Carica l'archivio di backup su Microsoft OneDrive. Supporta solo le unità personali create con un account Microsoft personale. Non supporta OneDrive for Business né gli account OneDrive creati tramite un account scolastico/aziendale o un abbonamento Microsoft Office 365. Questo metodo di caricamento verrà RIMOSSO in una versione futura di Akeeba Backup. Utilizzare invece il metodo Carica su Microsoft OneDrive."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_TITLE="Carica su Microsoft OneDrive (LEGACY)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_DESCRIPTION="Carica l'archivio di backup su OVH Object Storage. <br/><strong>Ricordare di impostare una dimensione di suddivisione dell'archivio di 2-30 MB, altrimenti si rischia un errore di backup a causa di timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_TITLE="Carica su OVH Object Storage"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_DESCRIPTION="Carica l'archivio di backup su Amazon S3. Consente di utilizzare sia la nuova autenticazione (AWS4), richiesta per le aree S3 più recenti, sia quella precedente (AWS2), necessaria per i provider di archiviazione di terze parti che offrono un'API compatibile con S3.<br/><strong>Se si disabilitano i caricamenti multiparte, ricordare di impostare una dimensione di suddivisione dell'archivio di 2-30 MB, altrimenti si rischia un errore di backup a causa di timeout!</strong><br/>Per utilizzare Amazon STS anziché una chiave di accesso e una chiave segreta, si prega di leggere la documentazione."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_TITLE="Carica su Amazon S3"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_DESCRIPTION="Carica l'archivio di backup su un server SFTP (SSH) remoto. Si tratta di un trasferimento di file tramite SSH utilizzando un protocollo chiamato SFTP, che è <em>completamente diverso</em> da FTP e FTPS.<br/>Questo motore di post-elaborazione utilizza cURL per il trasferimento dei dati, una libreria compatibile con un'ampia gamma di server SFTP.<br/><strong>Ricordare di impostare una dimensione di suddivisione dell'archivio di 2-30 MB, altrimenti si rischia un errore di backup a causa di timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_TITLE="Carica su server SFTP (SSH) remoto tramite cURL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_DESCRIPTION="Carica l'archivio di backup su un server SFTP (SSH) remoto. Si tratta di un trasferimento di file tramite SSH utilizzando un protocollo chiamato SFTP, che è <em>completamente diverso</em> da FTP e FTPS.<br/><strong>Ricordare di impostare una dimensione di suddivisione dell'archivio di 2-30 MB, altrimenti si rischia un errore di backup a causa di timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_TITLE="Carica su server SFTP (SSH) remoto"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_DESCRIPTION="Carica l'archivio di backup su SugarSync.<br/><strong>Ricordare di impostare una dimensione di suddivisione dell'archivio di 2-30 MB, altrimenti si rischia un errore di backup a causa di timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_TITLE="Carica su SugarSync"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SWIFT_TITLE="Carica su OpenStack Swift object storage"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_DESCRIPTION="Carica l'archivio di backup su qualsiasi servizio di archiviazione che supporti il protocollo WebDAV.<br/><strong>Ricordare di impostare una dimensione di suddivisione dell'archivio di 2-30 MB, altrimenti si rischia un errore di backup a causa di timeout!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_TITLE="Carica tramite WebDAV"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_DESCRIPTION="Uno scanner di file ottimizzato per il backup di siti con directory contenenti centinaia di file (ad es. blog e portali di notizie)"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_TITLE="Scanner per siti di grandi dimensioni"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_DESCRIPTION="Bilancia in modo intelligente la velocità di scansione e l'elusione dei timeout"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_TITLE="Scanner intelligente"
COM_AKEEBA_CONFIG_ERR_DECRYPTION="Impossibile decifrare le impostazioni. Il server non supporta la cifratura delle impostazioni oppure il file della chiave di cifratura è stato modificato o eliminato."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_DESCRIPTION="Se selezionata, il dump del database verrà composto da istruzioni INSERT estese, ovvero un'unica istruzione per ripristinare più righe di dati. Si consiglia vivamente di mantenere questa opzione abilitata, in quanto accelera il processo di ripristino e aggira i limiti di quota sulle query degli host più restrittivi."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_TITLE="Genera INSERT estesi"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_DESC="Invia l'e-mail a questo indirizzo (lasciare vuoto per disabilitare questa funzione)"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_LABEL="Indirizzo e-mail"
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_DESC="Lasciare vuoto per utilizzare il testo predefinito. È possibile utilizzare tutte le variabili di Solo disponibili per la denominazione dei file di archivio, ad es. [HOST] e [DATE]."
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_LABEL="Corpo dell'e-mail"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_DESC="Lasciare vuoto per utilizzare l'oggetto predefinito. È possibile utilizzare tutte le variabili di Solo disponibili per la denominazione dei file di archivio, ad es. [HOST] e [DATE]"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_LABEL="Oggetto dell'e-mail"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_DESC="Un backup verrà considerato bloccato (non riuscito) dopo questo numero di secondi di inattività.<br/><strong>NON MODIFICARE QUESTO VALORE SE NON SI SA COSA SI STA FACENDO!</strong>"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_LABEL="Timeout backup bloccato"
COM_AKEEBA_CONFIG_FEEMAILBODY_DESC="Lasciare vuoto per utilizzare il testo predefinito. È possibile utilizzare tutte le variabili di Akeeba Backup disponibili per la denominazione dei file di archivio, ad es. [HOST] e [DATE]. È inoltre possibile utilizzare [PROFILENUMBER] per il numero del profilo corrente, [PROFILENAME] per il nome del profilo corrente, [PARTCOUNT] per il numero totale delle parti dell'archivio di backup generato, [FILELIST] per un elenco delle parti dell'archivio di backup e [REMOTESTATUS] per un'indicazione sull'esito del caricamento nell'archiviazione remota."
COM_AKEEBA_CONFIG_FEEMAILBODY_LABEL="Corpo dell'e-mail"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_DESC="Lasciare vuoto per utilizzare l'oggetto predefinito. È possibile utilizzare tutte le variabili di Akeeba Backup disponibili per la denominazione dei file di archivio, ad es. [HOST] e [DATE]"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_LABEL="Oggetto dell'e-mail"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT="Usa il fuso orario del server"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULTGROUP="Predefiniti"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT_WORDPRESS="Usa il fuso orario di WordPress"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DESC="La data e l'ora del backup — come registrate nel nome file, nella descrizione predefinita e nelle e-mail — verranno espresse in questo fuso orario. Questa opzione riguarda tutte le origini di backup, ovvero tutti i backup indipendentemente da come vengono eseguiti (tramite Akeeba Backup stesso, l'API JSON remota ecc.)."
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_LABEL="Fuso orario del backup"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_WP_DESC="La data e l'ora del backup — come registrate nel nome file, nella descrizione predefinita e nelle e-mail — verranno espresse in questo fuso orario. Questa opzione riguarda tutte le origini di backup, ovvero tutti i backup indipendentemente da come vengono eseguiti (tramite Akeeba Backup stesso, l'API JSON remota ecc.).<br>Si noti che l'opzione «Usa il fuso orario di WordPress» NON funzionerà correttamente quando si eseguono backup tramite: a. l'URL legacy per il backup frontend o l'API JSON di Akeeba Backup se si utilizzano i vecchi URL endpoint (che usavano index.php o remote.php anziché wp-cron.php); e b. gli script di backup CLI (<em>non</em> WP-CLI). In questi casi il backup viene eseguito tecnicamente al di fuori di WordPress, pertanto non esiste un «fuso orario di WordPress»; il backup utilizzerà quindi il fuso orario GMT. Per questo motivo, si consiglia vivamente di impostare questa opzione sul proprio fuso orario locale."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_DESC="Invia un'e-mail di notifica al termine di un backup eseguito con la funzione Backup frontend (API legacy) o API JSON."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_LABEL="E-mail al completamento del backup"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_ALWAYS="Sempre"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_DESC="Quando inviare l'e-mail al completamento del backup? «Sempre» significa ogni volta che un backup viene completato. «Caricamento non riuscito» significa che l'e-mail viene inviata solo se il backup è completato ma il caricamento nell'archiviazione remota non si è concluso con successo. Se il backup non riesce, nessuna e-mail può essere inviata da questa funzione; consultare la pagina Pianifica backup automatici per informazioni sulla ricezione di e-mail relative ai backup non riusciti."
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_FAILEDUPLOAD="Caricamento non riuscito"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_LABEL="Quando inviare l'e-mail"
COM_AKEEBA_CONFIG_FTPTEST_BADPREFIX="NON aggiungere il prefisso ftp:// al nome host FTP. Rimuovere il prefisso ftp:// e riprovare."
COM_AKEEBA_CONFIG_FTPTEST_NOUPLOAD="Akeeba Backup è riuscito a connettersi al server, ma non è stato possibile caricare un file di prova. Il caricamento del backup potrebbe non riuscire."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_DESCRIPTION="Viene compilato automaticamente al termine del Passaggio 1 di autenticazione precedente. Se si collega un altro sito allo stesso account Google Drive, NON copiare il token di accesso e NON eseguire l'autenticazione. Copiare invece il Token di aggiornamento dal sito precedente a questo."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_TITLE="Token di accesso"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_DESCRIPTION="La directory all'interno di Google Drive in cui archiviare gli archivi di backup. Utilizzare le barre oblique. Corretto: some/thing. Errato: some\thing. Una singola barra oblique indica che gli archivi verranno archiviati nella radice dell'unità. LEGGERE LA DOCUMENTAZIONE: i percorsi in Google Drive sono ambigui!"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTEAMDRIVES_TITLE="Ricarica l'elenco delle unità"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTOKEN_TITLE="Token di aggiornamento"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_DESCRIPTION="Quale Google Drive si desidera utilizzare per archiviare i file. È necessario completare l'autenticazione prima che questo elenco venga popolato. Ha senso solo se si dispone di accesso a Google Team Drives (ad es. utenti con piano aziendale o enterprise G Suite). In caso di dubbio, utilizzare l'opzione «Google Drive (personale)»."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_OPT_PERSONAL="Google Drive (personale)"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_TITLE="Unità"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_TITLE="Carica nelle cartelle «Condivisi con me»"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_DESCRIPTION="Se abilitata, Akeeba Backup cercherà le cartelle nella raccolta Condivisi con me prima di cercare una cartella con lo stesso nome nell'unità. Questo è molto più lento e potrebbe portare al caricamento nella cartella sbagliata se nell'account Google Drive esistono più cartelle condivise con lo stesso nome."
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_DESCRIPTION="La chiave di accesso a Google Storage, disponibile nello strumento di gestione delle chiavi di Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_TITLE="Chiave di accesso"
COM_AKEEBA_CONFIG_GOOGLESTORAGEBUCKET_DESCRIPTION="Il nome del bucket Google Storage. Assicurarsi che sia digitato come mostrato nell'applicazione web browser di Google Cloud Storage (https://sandbox.google.com/storage)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEBUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_DESCRIPTION="La directory all'interno del bucket in cui verranno archiviati gli archivi di backup. Lasciare vuoto per archiviare i file nella radice del bucket."
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_DESC="Incollare qui il contenuto del file di credenziali JSON prodotto da Google Cloud Console durante la configurazione dell'account di servizio per il software di backup. Ricordarsi di includere le parentesi graffe all'inizio e alla fine del testo."
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_TITLE="Contenuto di googlestorage.json (leggere la documentazione)"
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_DESCRIPTION="Se abilitato, Akeeba Backup tenterà di convertire il nome del bucket in lettere minuscole, ad es. MioBucket verrà convertito in miobucket. Se è stato creato un bucket con lettere maiuscole, ad es. MioNuovoBucket, deselezionare questa opzione e assicurarsi che il nome del bucket sia scritto esattamente come appare nell'applicazione web Google Cloud Storage (https://sandbox.google.com/storage)."
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_TITLE="Nome bucket in minuscolo"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_DESCRIPTION="La chiave segreta di Google Storage, disponibile nello strumento di gestione chiavi di Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_TITLE="Chiave segreta"
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_DESCRIPTION="Se abilitato, verrà utilizzata una connessione sicura (HTTPS) durante il caricamento dei file. Sebbene aumenti la sicurezza dei dati trasferiti, aumenta anche la possibilità di errori di backup per timeout."
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_TITLE="Usa SSL"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_COLDLINE="Coldline Storage"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_DESCRIPTION="Modifica la classe di archiviazione degli archivi di backup caricati. «Nessuno» significa che i file verranno archiviati con la classe di archiviazione predefinita specificata nel bucket. Si noti che le opzioni diverse da Standard possono essere meno costose per l'archiviazione, ma potrebbero comportare costi aggiuntivi in caso di download o eliminazione. Consultare Google per informazioni sui prezzi."
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NEARLINE="Nearline Storage"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NONE="Nessuno (lascia decidere al bucket)"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_STANDARD="Standard Storage"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_TITLE="Classe di archiviazione"
COM_AKEEBA_CONFIG_HEADER_BASIC="Configurazione di base"
COM_AKEEBA_CONFIG_HEADER_CONFWIZ="Lasciare che Akeeba Backup si configuri automaticamente?"
COM_AKEEBA_CONFIG_HEADER_OPTIONALFILTERS="Filtri opzionali"
COM_AKEEBA_CONFIG_HEADER_QUOTA="Gestione quote"
COM_AKEEBA_CONFIG_HEADER_TUNING="Ottimizzazione"
COM_AKEEBA_CONFIG_INSTALLER_DESCRIPTION="Quando si esegue un backup completo del sito, Akeeba Backup incorpora nell'archivio lo script di ripristino definito qui. Ciò consente di ripristinare il sito da zero, senza dover installare il CMS o Akeeba Backup, anche quando il sito o il server sono completamente distrutti"
COM_AKEEBA_CONFIG_INSTALLER_TITLE="Script di ripristino integrato"
COM_AKEEBA_CONFIG_JPS_KEY_DESCRIPTION="Questa chiave verrà utilizzata per cifrare il contenuto dell'archivio. La chiave distingue tra maiuscole e minuscole, ad es. ABC, abc e Abc sono tre password diverse. Conservare una copia della password in un luogo sicuro! Se viene persa non è possibile recuperarla."
COM_AKEEBA_CONFIG_JPS_KEY_TITLE="Chiave di cifratura"
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_DESCRIPTION="Se abilitato (impostazione predefinita), la password verrà espansa in una chiave crittografica utilizzata per l'intero archivio. Questo è rapido, ma nell'improbabile eventualità che un aggressore con risorse sufficienti riesca a fare reverse engineering della chiave crittografica da un blocco cifrato del file — senza effettuare un attacco brute force sulla password stessa — potrà decifrare l'intero archivio di backup. Se disabilitato, verrà derivata una chiave crittografica diversa dalla password per ogni blocco cifrato, il che è MOLTO più lento ma protegge da questo tipo di attacco, costringendo l'aggressore a un attacco brute force sulla password, che è molto più lento."
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_TITLE="Espansione della chiave per l'intero archivio"
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_DESC="L'API JSON di Akeeba Backup consente di eseguire e gestire backup, nonché di gestire le opzioni di Akeeba Backup da remoto. È necessario abilitare questa opzione se si prevede di eseguire, scaricare o gestire backup, ad esempio con Akeeba Remote CLI, Akeeba UNiTE e servizi di pianificazione dei backup.<br><br><strong>Nota sulla sicurezza:</strong> l'API JSON viene autenticata unicamente tramite la Chiave segreta. Non è coinvolto alcun account utente, pertanto non si applica nessuno dei permessi impostati nella gestione utenti: chi la possiede ottiene tutti i metodi dell'API, senza alcun limite. Può leggere, creare, scaricare ed eliminare backup e modificare qualsiasi opzione, il che equivale in pratica a possedere la password dell'amministratore. Abilitare questa opzione solo quando serve realmente e utilizzare una Chiave segreta lunga e casuale."
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_LABEL="Abilita JSON API (backup remoto)"
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_DESCRIPTION="Quando una directory contiene più file o directory di questa soglia, viene considerata «grande». Di conseguenza, Akeeba Backup tenterà di riscansionarla nella fase successiva per evitare timeout durante il backup. Un valore troppo basso rallenterà notevolmente il backup. Aumentare il valore — a meno che non si verifichino errori di timeout — per velocizzare il backup."
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_TITLE="Soglia directory grande"
COM_AKEEBA_CONFIG_LARGEFILE_DESCRIPTION="I file più grandi di questa soglia verranno compressi in una fase separata per evitare possibili timeout. Valori tra 2 e 10 MB funzionano al meglio sulla maggior parte dei server."
COM_AKEEBA_CONFIG_LARGEFILE_TITLE="Soglia file grande"
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_DESCRIPTION="Numero di directory da scansionare in ogni fase. Impostazione consigliata: 50. Valori più alti rendono il backup marginalmente più veloce, ma aumentano la probabilità di timeout."
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_TITLE="Dimensione batch scansione directory"
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_DESCRIPTION="Numero di file da scansionare e comprimere in ogni fase. Impostazione consigliata: 100. Valori più alti rendono il backup marginalmente più veloce, ma aumentano la probabilità di timeout o di esaurimento della memoria."
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_TITLE="Dimensione batch scansione file"
COM_AKEEBA_CONFIG_LBL_CONFWIZ_AFTER="Al termine della configurazione automatica di Akeeba Backup è possibile eseguire un backup o ottimizzare manualmente la configurazione."
COM_AKEEBA_CONFIG_LBL_CONFWIZ_INTRO="Sembra che Akeeba Backup non sia ancora stato configurato. Fare clic sul pulsante Configurazione guidata qui sotto per permettergli di configurarsi automaticamente."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_DESC="L'API legacy per backup da front-end consente di eseguire backup pianificati tramite strumenti di accesso URL come wget o curl. È necessario abilitare questa opzione se si prevede di eseguire backup con il server CRON del proprio host usando wget o curl, oppure quando si intende utilizzare un servizio CRON di terze parti come WebCRON.org. Quando possibile, si raccomanda di utilizzare in alternativa lo script CLI nativo o l'API JSON di Akeeba Backup, in quanto sono opzioni molto più sicure."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_LABEL="Abilita API legacy per backup da front-end (CRON job remoti)"
COM_AKEEBA_CONFIG_LOGLEVEL_DEBUG="Tutte le informazioni e debug"
COM_AKEEBA_CONFIG_LOGLEVEL_DESCRIPTION="Questa opzione determina il livello di dettaglio del registro di backup."
COM_AKEEBA_CONFIG_LOGLEVEL_ERROR="Solo errori"
COM_AKEEBA_CONFIG_LOGLEVEL_INFO="Tutte le informazioni"
COM_AKEEBA_CONFIG_LOGLEVEL_NONE="Nessuno"
COM_AKEEBA_CONFIG_LOGLEVEL_TITLE="Livello di registro"
COM_AKEEBA_CONFIG_LOGLEVEL_WARNING="Errori e avvisi"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_DESCRIPTION="Rimuove automaticamente i backup obsoleti in base al giorno in cui sono stati eseguiti. ATTENZIONE: L'ABILITAZIONE DI QUESTA OPZIONE CAUSERÀ L'ESCLUSIONE DI TUTTE LE ALTRE IMPOSTAZIONI DI QUOTA (CONTEGGIO E DIMENSIONE)."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_TITLE="Abilita quote per età massima del backup"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_DESCRIPTION="I backup eseguiti in questo giorno del mese non verranno eliminati. Lasciare l'impostazione predefinita, 1, per conservare sempre i backup eseguiti il 1° giorno del mese"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_TITLE="Non eliminare i backup eseguiti in questo giorno del mese"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_DESCRIPTION="I backup più vecchi di questo numero di giorni verranno eliminati automaticamente. Lasciare l'impostazione predefinita, 31, per conservare tutti i backup dell'ultimo mese"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_TITLE="Età massima del backup, in giorni"
COM_AKEEBA_CONFIG_MAXEXECTIME_DESCRIPTION="Ogni fase di Akeeba Backup durerà <i>al massimo</i> quanto definito qui. Utilizzare un valore inferiore al tempo massimo di esecuzione PHP. In genere, impostare questo valore a 10 secondi è sufficiente, tranne su host molto restrittivi.<b>Suggerimento</b>: Selezionare Personalizzato e digitare il valore desiderato se non è presente nell'elenco."
COM_AKEEBA_CONFIG_MAXEXECTIME_TITLE="Tempo massimo di esecuzione"
COM_AKEEBA_CONFIG_MAXPACKET_DESCRIPTION="La dimensione massima, in byte, di ogni istruzione INSERT estesa. Si consiglia di mantenerla sufficientemente bassa da evitare errori MySQL durante il ripristino del dump del database."
COM_AKEEBA_CONFIG_MAXPACKET_TITLE="Dimensione massima pacchetto per INSERT estesi"
COM_AKEEBA_CONFIG_MINEXECTIME_DESCRIPTION="Ogni fase di Akeeba Backup durerà <i>almeno</i> quanto definito qui. Questo è necessario per aggirare soluzioni di sicurezza anti-DoS. In caso di errori 403 Forbidden o errori AJAX, aumentare questa impostazione. Impostare il valore a 0 disabilita questa funzionalità.<br/><br/><b>Suggerimento</b>: Selezionare Personalizzato e digitare il valore desiderato se non è presente nell'elenco."
COM_AKEEBA_CONFIG_MINEXECTIME_TITLE="Tempo minimo di esecuzione"
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_DESCRIPTION="Se abilitato, Akeeba Backup tenterà di esportare queste entità avanzate del database MySQL 5. Se il backup si blocca durante la fase di backup, potrebbe essere necessario disabilitare questa opzione."
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_TITLE="Esporta PROCEDUREs, FUNCTIONs e TRIGGERs"
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TIP="Rimuove USING BTREE e USING HASH dalle definizioni degli indici di tabella nei file dump. Questo è necessario per il ripristino su server in cui uno dei due motori di indicizzazione è disabilitato (ad es. nelle versioni più recenti di XAMPP). ATTENZIONE! QUESTO POTREBBE CAUSARE PROBLEMI DI RIPRISTINO SU ALCUNI SERVER."
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TITLE="Ignora motore indice"
COM_AKEEBA_CONFIG_NODEPENDENCIES_DESCRIPTION="Se abilitato, Akeeba Backup non terrà traccia delle dipendenze tra tabelle e viste. Utilizzare questa opzione solo quando si dispone di centinaia di tabelle di database e non si utilizzano VIEWs, FUNCTIONs, PROCEDUREs, TRIGGERs MySQL o tabelle con i motori (rarissimamente utilizzati) TEMPORARY, MEMORY, MERGE o FEDERATED."
COM_AKEEBA_CONFIG_NODEPENDENCIES_TITLE="Nessun tracciamento delle dipendenze"
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_DESCRIPTION="Numero totale di record obsoleti (backup i cui file sono stati eliminati) da conservare nella pagina Gestione backup. Impostare a 0 per nessun limite."
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_TITLE="Record obsoleti da conservare"
COM_AKEEBA_CONFIG_LOGFILES_TITLE="Elimina file di registro obsoleti"
COM_AKEEBA_CONFIG_LOGFILES_DESCRIPTION="Elimina automaticamente i file di registro dei record di backup completati con successo. Il file di registro dell'ultimo record di backup partecipa ai calcoli ma non viene mai rimosso. Se il profilo di backup utilizza un motore di post-elaborazione diverso da Nessuno o Invia tramite e-mail, solo i record con stato di backup remoto partecipano a questa impostazione di quota dei file di registro. Se il profilo di backup utilizza il motore di post-elaborazione Nessuno o Invia tramite e-mail, solo i record con stato OK o backup remoto partecipano a questa impostazione di quota dei file di registro. Questa funzionalità viene eseguita dopo la quota dei record obsoleti; la quota dei record obsoleti potrebbe rimuovere anche i vecchi file di registro."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_TITLE="Tipo di quota file di registro obsoleti"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DESCRIPTION="Scegliere il metodo utilizzato per determinare quali vecchi file di registro rimuovere."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_SIZE="Dimensione massima"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_COUNT="Conteggio"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DAYS="Età massima"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_TITLE="Numero di file di registro"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_DESCRIPTION="Numero di file di registro da conservare. Il file di registro dell'ultimo backup eseguito potrebbe essere incluso nel conteggio ma non verrà mai eliminato. Solo i file di registro dei record di backup completati con successo verranno considerati per la rimozione."
COM_AKEEBA_CONFIG_LOGFILES_SIZE_TITLE="Dimensione file di registro (Megabyte)"
COM_AKEEBA_CONFIG_LOGFILES_SIZE_DESCRIPTION="La dimensione totale massima dei file di registro da conservare. Il file di registro dell'ultimo backup eseguito potrebbe essere incluso nel calcolo ma non verrà mai eliminato. Solo i file di registro dei record di backup completati con successo verranno considerati per la rimozione."
COM_AKEEBA_CONFIG_LOGFILES_DAYS_TITLE="Durata dei file di registro (giorni)"
COM_AKEEBA_CONFIG_LOGFILES_DAYS_DESCRIPTION="La durata massima in giorni dei file di registro da conservare. Il file di registro dell'ultimo backup eseguito non verrà mai eliminato. Solo i file di registro dei record di backup completati con successo saranno considerati per la rimozione."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_DESCRIPTION="Compilato automaticamente al termine della fase 1 dell'autenticazione. NON condividere lo stesso token su più siti. Autenticare invece ogni sito separatamente."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_TITLE="Token di accesso"
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_DESCRIPTION="La directory all'interno del drive Microsoft OneDrive in cui archiviare gli archivi di backup. Utilizzare le barre diritte, non le barre inverse, e anteporre sempre una barra diritta. Corretto: /qualcosa/cosa. Errato: qualcosa\cosa. Una singola barra diritta indica che gli archivi verranno archiviati nella radice del drive."
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_DESCRIPTION="Scegliere quale Drive (OneDrive Personal, OneDrive for Business o SharePoint) accessibile con il proprio account verrà utilizzato per archiviare i backup. È necessario completare l'autenticazione prima che questo elenco venga popolato. Ha senso solo quando si ha accesso a più di un drive OneDrive (ad es. il proprio account Microsoft fa parte della sottoscrizione di un'organizzazione). In caso di dubbio, utilizzare l'opzione «Drive predefinito» che usa il drive personale predefinito — tipicamente equivalente alla prima opzione «Drive (OneDrive Personal)» nell'elenco sottostante."
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_OPT_PERSONAL="Drive predefinito"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_TITLE="Drive"
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_DESCRIPTION="Compilato automaticamente al termine della fase 1 dell'autenticazione. NON condividere lo stesso token su più siti. Autenticare invece ogni sito separatamente."
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_TITLE="Token di aggiornamento"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_DESCRIPTION="Questo filtro si applica solo se si tenta di eseguire il backup di un'installazione Joomla!, ad es. un sito Joomla! in una sottodirectory o sottodominio del proprio sito. In Joomla! 3.9 e versioni successive, le azioni degli utenti vengono registrate nel database, creando una tabella con milioni di righe che rallenta il backup. Selezionare questa opzione per escludere tali dati."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_TITLE="Registro azioni utente di Joomla!"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_DESCRIPTION="Se abilitato, verranno inclusi nel backup solo i file modificati dopo una data e un'ora specifiche."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_TITLE="Filtro condizionale per data"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_DESCRIPTION="Akeeba Backup eseguirà il backup dei file modificati dopo questa data e ora. Il formato è YYYY-MM-DD hh:mm:ss. Tutte le date e gli orari sono espressi nel fuso orario del server."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_TITLE="Esegui il backup dei file modificati dopo"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_DESCRIPTION="Esclude automaticamente i file di registro degli errori, ad es. <code>error_log</code>, indipendentemente dalla loro posizione nel sito di cui si esegue il backup. Questi file cambiano dimensione mentre il backup è in corso, il che può portare a backup corrotti."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_TITLE="Escludi i registri degli errori"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_DESCRIPTION="Se abilitato, Akeeba Backup escluderà automaticamente le cartelle specifiche dell'host più comuni utilizzate per archiviare le statistiche di accesso al sito. Queste cartelle sono di sola lettura per l'utente del sito web, causando problemi di ripristino se vengono incluse nel backup."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_TITLE="Escludi le cartelle delle statistiche specifiche dell'host"
COM_AKEEBA_CONFIG_OUTDIR_DESCRIPTION="Questa è la directory sul server in cui Akeeba Backup archivierà gli archivi di backup e il file di registro del backup. È possibile utilizzare le seguenti macro:<ul><li><b>[DEFAULT_OUTPUT]</b> La directory di output predefinita</li><li><b>[SITEROOT]</b> La directory radice del sito</li><li><b>[ROOTPARENT]</b> La directory superiore rispetto alla radice del sito</li></ul>"
COM_AKEEBA_CONFIG_OUTDIR_TITLE="Directory di output"
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_DESCRIPTION="QUESTO NON È IL NOME DEL CONTAINER DI ARCHIVIAZIONE! Accedere al gestore cloud OVH, Servers, espandere il proprio server, fare clic su Storage. L'URL del Container sarà visibile sopra l'elenco dei propri file. Copiarlo qui."
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_TITLE="URL del Container"
COM_AKEEBA_CONFIG_OVH_DIRECTORY_DESCRIPTION="La directory all'interno del container di archiviazione oggetti OVH in cui archiviare gli archivi di backup. Per archiviare tutto nella radice del container, lasciare vuoto."
COM_AKEEBA_CONFIG_OVH_DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_OVH_PASSWORD_DESCRIPTION="QUESTA NON È LA PASSWORD DI ACCESSO OVH! Creare un utente dal gestore cloud OVH, Servers, espandere il proprio server, fare clic su OpenStack, quindi su Aggiungi utente. Copiare qui la Password dell'utente creato."
COM_AKEEBA_CONFIG_OVH_PASSWORD_TITLE="Password OpenStack"
COM_AKEEBA_CONFIG_OVH_PROJECTID_DESCRIPTION="L'ID del progetto del server cloud OVH. Nel gestore cloud OVH, espandere il proprio Server e fare clic sul collegamento Storage. Nell'area principale della pagina si vede il nome del server e subito sotto una stringa alfanumerica di 32 caratteri come a0b1c2d3e4f56789abcdef0123456789. Questo è l'ID del progetto da inserire qui."
COM_AKEEBA_CONFIG_OVH_PROJECTID_TITLE="ID progetto"
COM_AKEEBA_CONFIG_OVH_USERNAME_DESCRIPTION="QUESTO NON È IL NOME UTENTE DI ACCESSO OVH! Creare un utente dal gestore cloud OVH, Servers, espandere il proprio server, fare clic su OpenStack, quindi su Aggiungi utente. Copiare qui l'ID dell'utente creato."
COM_AKEEBA_CONFIG_OVH_USERNAME_TITLE="Nome utente OpenStack"
COM_AKEEBA_CONFIG_PARTSIZE_DESCRIPTION="Akeeba Backup può creare archivi suddivisi (multi-parte) per aggirare le restrizioni di dimensione in varie circostanze. Questa opzione definisce la dimensione massima di ciascuna parte dell'archivio. Se viene ridotta a 0, la funzionalità multi-parte è disabilitata.</br><b>Importante:</b> Se si utilizza un motore di elaborazione dati che trasferisce gli archivi in una posizione remota (ad es. archiviazione cloud), utilizzare un valore tra 1 e 5 MB per risultati ottimali."
COM_AKEEBA_CONFIG_PARTSIZE_TITLE="Dimensione delle parti per gli archivi suddivisi"
COM_AKEEBA_CONFIG_PERMISSIONS_0600="0600 – Sicurezza elevata, potrebbe causare problemi su server di fascia bassa"
COM_AKEEBA_CONFIG_PERMISSIONS_0644="0644 – Sicurezza media, per l'uso su server a sito singolo"
COM_AKEEBA_CONFIG_PERMISSIONS_0666="0666 – Sicurezza minima, massima compatibilità con host commerciali"
COM_AKEEBA_CONFIG_PERMISSIONS_DESCRIPTION="Imposta i permessi sui file degli archivi di backup. Si applica solo su Linux, macOS, BSD e altri host in stile UNIX (NON Windows). In caso di dubbio, lasciare 0666. La modifica potrebbe rendere impossibile scaricare e/o eliminare i file degli archivi di backup tramite FTP e SFTP. Se il server utilizza PHP-FPM o esegue PHP con lo stesso utente dell'account di sistema del sito, utilizzare 0600 per la massima sicurezza."
COM_AKEEBA_CONFIG_PERMISSIONS_TITLE="Permessi dell'archivio"
COM_AKEEBA_CONFIG_PGDUMP_PATH_DESCRIPTION="Il percorso assoluto nel file system dello strumento a riga di comando pg_dump sul server. Se lasciato vuoto, Akeeba Backup tenterà di rilevarlo automaticamente."
COM_AKEEBA_CONFIG_PGDUMP_PATH_TITLE="Percorso di pg_dump"
COM_AKEEBA_CONFIG_PLATFORM="Sostituzioni del sito"
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_DESCRIPTION="Se abilitato, Akeeba Backup tenterà di connettersi al server FTP utilizzando una connessione cifrata SSL. <strong>Questo non equivale a SFTP, SCP o «Secure FTP»!</strong> Si noti che se il server non supporta questo metodo si verificheranno errori di connessione."
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_TITLE="Usa FTP over SSL (FTPS)"
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_DESCRIPTION="Nome host del server FTP, senza il protocollo. Questo significa che <tt>ftp://example.com</tt> è <b>non valido</b> mentre <tt>example.com</tt> è valido. Questo motore supporta solo server FTP e FTPS. <u>Non</u> supporta SFTP, SCP e altre varianti SSH."
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_TITLE="Nome host"
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_DESCRIPTION="Il percorso <b>FTP</b> assoluto della directory in cui verranno caricati i file. In caso di dubbio, connettersi al server con FileZilla, sfogliare la directory desiderata e copiare il percorso visualizzato nel pannello di destra sopra l'elenco delle directory. Di solito è qualcosa di breve, come <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_TITLE="Directory iniziale"
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_DESCRIPTION="Il percorso relativo rispetto alla directory iniziale; verrà creato se non esiste. Lasciare vuoto per caricare gli archivi direttamente nella directory iniziale. È possibile utilizzare le seguenti macro:<ul><li><b>[HOST]</b> Il nome host. ATTENZIONE: questo tag non funziona in modalità CRON.</li><li><b>[DATE]</b> Data corrente</li><li><b>[TIME]</b> Ora corrente</li></ul>Altre sono disponibili; consultare la documentazione."
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_TITLE="Sottodirectory"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_DESCRIPTION="Usa la modalità passiva FTP durante il trasferimento dei dati. È abilitata per impostazione predefinita poiché è l'unico metodo che funziona attraverso i firewall comunemente installati sui server web. Non disattivare a meno che non si sia certi che il proprio server web non sia dietro un firewall e che il server FTP richieda assolutamente trasferimenti in modalità Attiva."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_TITLE="Usa modalità passiva"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_DESCRIPTION="Password del server FTP. Di solito fa distinzione tra maiuscole e minuscole. In caso di dubbio, contattare l'amministratore di rete."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_TITLE="Password"
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_DESCRIPTION="Porta del server FTP. L'impostazione più comune è 21. In caso di dubbio, contattare l'amministratore di rete."
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_TITLE="Porta"
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_DESCRIPTION="Utilizzare questo pulsante per testare la connessione FTP e visualizzare gli errori di connessione in caso di fallimento."
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_TITLE="Testa la connessione FTP"
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_DESCRIPTION="Nome utente del server FTP. Di solito fa distinzione tra maiuscole e minuscole. In caso di dubbio, contattare l'amministratore di rete."
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_TITLE="Nome utente"
COM_AKEEBA_CONFIG_POSTPROCPARTS_DESCRIPTION="Se abilitato, Akeeba Backup eseguirà il motore di post-elaborazione su ciascuna parte non appena completata. Se disabilitato, Akeeba Backup eseguirà la post-elaborazione per tutte le parti al termine del processo di backup."
COM_AKEEBA_CONFIG_POSTPROCPARTS_TITLE="Elabora ogni parte immediatamente"
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_DESCRIPTION="Nome host del server SFTP, senza il protocollo. Questo significa che <tt>sftp://example.com</tt> o <tt>ssh://example.com</tt> sono <b>non validi</b> e NON devono essere utilizzati, mentre <tt>example.com</tt> è valido e DEVE essere utilizzato. Questo motore supporta solo server SFTP (SSH). <u>Non</u> supporta FTP, FTPS o qualsiasi altra variante FTP. Richiede che l'estensione PHP SSH2 sia installata e abilitata."
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_TITLE="Nome host"
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_DESCRIPTION="Il percorso <b>SFTP</b> assoluto (di solito uguale al percorso del file system) della directory in cui verranno caricati i file. In caso di dubbio, connettersi al server con FileZilla, sfogliare la directory desiderata e copiare il percorso visualizzato nel pannello di destra sopra l'elenco delle directory. Di solito è qualcosa di lungo, come <tt>/home/myuser/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_TITLE="Directory iniziale"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_DESCRIPTION="Password del server SFTP. Di solito fa distinzione tra maiuscole e minuscole. In caso di dubbio, contattare l'amministratore di rete."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_TITLE="Password"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_DESCRIPTION="Porta del server SFTP. L'impostazione più comune è 22. In caso di dubbio, contattare l'amministratore di rete."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_TITLE="Porta"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_DESCRIPTION="LEGGERE LA DOCUMENTAZIONE PRIMA DI UTILIZZARE. Il percorso assoluto nel file system di un file di chiave privata RSA/DSA utilizzato per connettersi al server remoto. Se è cifrato, inserire la passphrase nel campo password sopra. Se non si sa cosa sia, o se si pensa di dover chiedere assistenza al riguardo, lasciare vuoto e non contattarci al riguardo."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_TITLE="File di chiave privata (avanzato)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_DESCRIPTION="LEGGERE LA DOCUMENTAZIONE PRIMA DI UTILIZZARE. Il percorso assoluto nel file system di un file di chiave pubblica RSA/DSA utilizzato per connettersi al server remoto. Se non si sa cosa sia, o se si pensa di dover chiedere assistenza al riguardo, lasciare vuoto e non contattarci al riguardo."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_TITLE="File di chiave pubblica (avanzato)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_DESCRIPTION="Utilizzare questo pulsante per testare la connessione SFTP e visualizzare gli errori di connessione in caso di fallimento."
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_TITLE="Testa la connessione SFTP"
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_DESCRIPTION="Nome utente del server SFTP. Di solito fa distinzione tra maiuscole e minuscole. In caso di dubbio, contattare l'amministratore di rete."
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_TITLE="Nome utente"
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_DESCRIPTION="Interrompe immediatamente il processo di backup, contrassegnandolo come non riuscito, se si verifica un errore di caricamento. <strong>Questa opzione può essere fuorviante e pericolosa.</strong> È possibile avere un backup completo e valido che semplicemente non è stato caricato in tutto o in parte. L'abilitazione di questa opzione rimuoverà i file dell'archivio di backup rimanenti dal server e lascerà qualsiasi file dell'archivio (parzialmente) caricato nell'archiviazione remota. In altre parole, si rimarrà senza un backup funzionante. Esistono solo pochissimi casi d'uso in cui ciò ha più senso del comportamento predefinito, che consente di riprendere il caricamento dei file dell'archivio di backup tramite la pagina Gestione backup. Di conseguenza, si raccomanda vivamente di abilitare questa opzione solo agli utenti esperti che comprendono appieno le implicazioni di tale scelta."
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_TITLE="Segna il backup come non riuscito in caso di errore di caricamento"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_DESCRIPTION="L'indirizzo e-mail a cui verranno inviati i file di backup"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_TITLE="Indirizzo e-mail"
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_DESCRIPTION="L'oggetto dell'e-mail (facoltativo). Questa opzione serve principalmente per distinguere i backup provenienti da più siti."
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_TITLE="Oggetto dell'e-mail"
COM_AKEEBA_CONFIG_PROCENGINE_DESCRIPTION="I motori di post-elaborazione consentono ad Akeeba Backup di trasferire le parti degli archivi di backup completati ad altri server e provider di archiviazione remota."
COM_AKEEBA_CONFIG_PROCENGINE_TITLE="Motore di post-elaborazione"
COM_AKEEBA_CONFIG_PROXY_HOST_DESC="Se il sito deve connettersi a un server proxy per comunicare con l'esterno (proxy in uscita), inserire qui il nome host o l'indirizzo IP del proxy. Lasciare vuoto per non utilizzare un proxy."
COM_AKEEBA_CONFIG_PROXY_HOST_LABEL="Nome host / indirizzo IP del proxy"
COM_AKEEBA_CONFIG_PROXY_PASS_DESC="Se il server proxy richiede autenticazione, inserire qui la password di autenticazione del proxy. Non dimenticare di inserire un nome utente non vuoto nell'opzione precedente."
COM_AKEEBA_CONFIG_PROXY_PASS_LABEL="Password del proxy"
COM_AKEEBA_CONFIG_PROXY_PORT_DESC="Inserire la porta TCP/IP su cui è in ascolto il server proxy. Di solito è 8080 o 3128. In caso di dubbio, contattare il proprio host o l'amministratore di rete."
COM_AKEEBA_CONFIG_PROXY_PORT_LABEL="Porta del proxy"
COM_AKEEBA_CONFIG_PROXY_USER_DESC="Se il server proxy richiede autenticazione, inserire qui il nome utente di autenticazione del proxy. Lasciare vuoto per utilizzare un proxy che non richiede autenticazione."
COM_AKEEBA_CONFIG_PROXY_USER_LABEL="Nome utente del proxy"
COM_AKEEBA_CONFIG_PUSH_APIKEY_DESC="Accedere a https://www.pushbullet.com/account e copiare il token di accesso dalla pagina nella casella di testo qui sotto. Viene utilizzato per inviare messaggi push al proprio account. È possibile incollare più token separati da virgole. Nota: il token di accesso è visibile a tutte le persone che hanno accesso a questa pagina di configurazione."
COM_AKEEBA_CONFIG_PUSH_APIKEY_LABEL="Token di accesso Pushbullet"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_DESC="Akeeba Backup deve inviare notifiche e, in caso affermativo, in quale modalità?"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_LABEL="Notifiche push"
COM_AKEEBA_CONFIG_QUICKICON_DESC="Se selezionato, Akeeba Backup mostrerà un'icona di backup con un clic nella parte superiore della pagina del Pannello di controllo. Facendo clic su di essa verrà attivato questo profilo e verrà eseguito un backup senza ulteriori azioni da parte dell'utente."
COM_AKEEBA_CONFIG_QUICKICON_LABEL="Icona di backup con un clic"
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_DESCRIPTION="Quando abilitato, il backup in corso partecipa alle quote dei file remoti. Ciò può essere problematico: se il backup è stato caricato parzialmente nell'archiviazione remota e le impostazioni della quota prevedono la conservazione solo dell'ultimo backup, si potrebbe finire senza un backup valido archiviato in remoto. Disabilitare questa opzione riduce la probabilità di rimanere senza un backup valido nell'archiviazione remota, al costo di conservare un archivio di backup aggiuntivo in remoto."
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_TITLE="Il backup corrente partecipa alle quote dei file remoti"
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_DESCRIPTION="Quando abilitato, le impostazioni della quota riportate di seguito vengono applicate ai file archiviati in remoto, ad esempio su Amazon S3 o su server FTP remoti."
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_TITLE="Abilita le quote dei file remoti"
COM_AKEEBA_CONFIG_RUNTIMEBIAS_DESCRIPTION="Definisce quanto Akeeba Backup sarà prudente nel tentare di evitare un timeout. Più basso è questo valore, più prudente sarà il comportamento. In caso di errori di timeout, provare a ridurre sia il Tempo massimo di esecuzione che questa impostazione.<b>Suggerimento</b>: selezionare Personalizzato e digitare il valore desiderato se non è presente nell'elenco."
COM_AKEEBA_CONFIG_RUNTIMEBIAS_TITLE="Bias del tempo di esecuzione"
COM_AKEEBA_CONFIG_S3ACCESSKEY_DESCRIPTION="La chiave di accesso Amazon S3, disponibile nella pagina del profilo personale di Amazon Web Services"
COM_AKEEBA_CONFIG_S3ACCESSKEY_TITLE="Chiave di accesso"
COM_AKEEBA_CONFIG_S3BUCKET_DESCRIPTION="Il nome del bucket Amazon S3"
COM_AKEEBA_CONFIG_S3BUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_DESCRIPTION="Da utilizzare con servizi di archiviazione di terze parti che implementano un'API compatibile con S3. Inserire l'endpoint (URL dell'API) dell'API compatibile con S3 del servizio di archiviazione di terze parti. IMPORTANTE: se si utilizza Amazon S3 <strong>QUESTO CAMPO DEVE ESSERE LASCIATO VUOTO</strong>."
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_TITLE="Endpoint personalizzato"
COM_AKEEBA_CONFIG_S3DIRECTORY_DESCRIPTION="La directory all'interno del bucket in cui verranno archiviati gli archivi di backup. Lasciare vuoto per archiviare i file nella radice del bucket."
COM_AKEEBA_CONFIG_S3DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_S3_ACL_TITLE="Permessi file (ACL)"
COM_AKEEBA_CONFIG_S3_ACL_DESCRIPTION="Scegliere i permessi per il file caricato. Nella maggior parte dei casi «Privato» o «Il proprietario del bucket può leggere» sono le scelte più appropriate. Se si utilizza un servizio di terze parti compatibile con S3, potrebbe essere preferibile usare «Privato» anziché l'impostazione predefinita."
COM_AKEEBA_CONFIG_S3_ACL_PRIVATE="Privato"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ="Chiunque può leggere"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ_WRITE="Chiunque può leggere e scrivere"
COM_AKEEBA_CONFIG_S3_ACL_AUTHENTICATED_READ="Gli utenti IAM autenticati possono leggere"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_READ="Il proprietario del bucket può leggere"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_FULL_CONTROL="Il proprietario del bucket ha il pieno controllo"
COM_AKEEBA_CONFIG_S3LEGACY_DESCRIPTION="Quando abilitato, tutti i caricamenti su Amazon S3 saranno forzati ad avvenire in parte singola. Utilizzare questa opzione se si riscontrano errori RequestTimeout dal motore S3 durante il caricamento delle parti di backup."
COM_AKEEBA_CONFIG_S3LEGACY_TITLE="Disabilita i caricamenti multiparte"
COM_AKEEBA_CONFIG_S3RRS_DESCRIPTION="Selezionare la classe di archiviazione per i propri dati. Standard è l'archiviazione ordinaria per i dati critici per l'azienda. Consultare la documentazione di Amazon S3 per la descrizione di ciascuna classe di archiviazione."
COM_AKEEBA_CONFIG_S3RRS_TITLE="Classe di archiviazione"
COM_AKEEBA_CONFIG_S3SECRETKEY_DESCRIPTION="La chiave segreta Amazon S3, disponibile nella pagina del profilo personale di Amazon Web Services"
COM_AKEEBA_CONFIG_S3SECRETKEY_TITLE="Chiave segreta"
COM_AKEEBA_CONFIG_S3USESSL_DESCRIPTION="Se abilitato, verrà utilizzata una connessione sicura (HTTPS) per il caricamento dei file. Pur aumentando la sicurezza dei dati trasferiti, aumenta anche la possibilità di errori di backup dovuti a timeout."
COM_AKEEBA_CONFIG_S3USESSL_TITLE="Usa SSL"
COM_AKEEBA_CONFIG_S3_DUALSTACK_DESCRIPTION="Utilizzare gli endpoint dual-stack per Amazon S3? Questo consente di accedere a S3 tramite IPv6 per i server che supportano IPv6. I server privi di supporto IPv6 potranno comunque accedere a S3 tramite IPv4. Non ha effetto se si utilizza un endpoint personalizzato."
COM_AKEEBA_CONFIG_S3_DUALSTACK_TITLE="Abilita il supporto IPv6 (dual-stack)"
COM_AKEEBA_CONFIG_S3_ALTERNATEDATEHEADERFORMAT_TITLE="Formato data alternativo"
COM_AKEEBA_CONFIG_S3_ALTERNATEDATEHEADERFORMAT_DESCRIPTION="Disabilitare questa impostazione solo se richiesto dal supporto tecnico."
COM_AKEEBA_CONFIG_S3_USEHTTPDATEHEADER_TITLE="Usa l'intestazione HTTP Date al posto di X-Amz-Date"
COM_AKEEBA_CONFIG_S3_USEHTTPDATEHEADER_DESCRIPTION="Abilitare questa impostazione solo se richiesto dal supporto tecnico."
COM_AKEEBA_CONFIG_S3_PRESIGNEDBUCKETINURL_TITLE="Includi il nome del bucket negli URL pre-firmati v4"
COM_AKEEBA_CONFIG_S3_PRESIGNEDBUCKETINURL_DESCRIPTION="Abilitare questa impostazione solo se richiesto dal supporto tecnico."

COM_AKEEBA_CONFIG_SAVENEW_DEFAULT_PROFILE_NAME="Nuovo profilo di backup"
COM_AKEEBA_CONFIG_SAVE_OK="La configurazione è stata salvata"
COM_AKEEBA_CONFIG_SCANENGINE_DESCRIPTION="Definisce il modo in cui Akeeba Backup eseguirà la scansione dei file e delle directory del sito per determinare quali devono essere inclusi nel backup."
COM_AKEEBA_CONFIG_SCANENGINE_TITLE="Motore di scansione del file system"
COM_AKEEBA_CONFIG_SECRETWORD_DESC="Questa password verrà utilizzata con le funzionalità Backup front-end (API legacy) e API JSON per proteggerle dagli accessi non autorizzati. Akeeba Backup NON abiliterà queste funzionalità a meno che non venga impostata qui una password lunga e complessa.<br><br><strong>Nota sulla sicurezza:</strong> la Chiave segreta è l'unica credenziale accettata dall'API JSON, ed è illimitata. Chiunque la possieda può modificare qualsiasi opzione, eseguire un backup e scaricarne l'archivio, e un archivio di backup è una copia completa del sito, comprese le credenziali del database e i record degli utenti. Trattarla con la stessa cura della password dell'amministratore. Consultare la documentazione per ulteriori informazioni."
COM_AKEEBA_CONFIG_SECRETWORD_LABEL="Chiave segreta"
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_DESCRIPTION="Quando abilitato, le impostazioni di configurazione vengono cifrate utilizzando la cifratura AES-128 standard del settore."
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_LABEL="Usa cifratura"
COM_AKEEBA_CONFIG_SFTPTEST_BADPREFIX="NON aggiungere il prefisso sftp:// al nome host SFTP. Rimuovere il prefisso sftp:// e riprovare."
COM_AKEEBA_CONFIG_SFTPTEST_NOUPLOAD="Akeeba Backup è riuscito a connettersi al server, ma non è riuscito a caricare un file di prova. Il caricamento del backup potrebbe non riuscire."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_DESCRIPTION="Quando attivato, Akeeba Backup eliminerà i vecchi file di backup se la dimensione totale degli archivi di backup supera il valore definito di seguito. Questa impostazione viene applicata <b>per profilo</b>."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_TITLE="Abilita quota dimensione"
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_DESCRIPTION="Se la dimensione totale degli archivi di backup eseguiti con il profilo corrente supera questo limite, i backup più vecchi verranno eliminati dal server.<br/><br/><b>Suggerimento</b>: selezionare Personalizzato e digitare il valore desiderato se non è presente nell'elenco."
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_TITLE="Quota dimensione"
COM_AKEEBA_CONFIG_SPLITDBDUMP_DESCRIPTION="I dump del database verranno suddivisi in file di piccole dimensioni per migliorare la compressione ed evitare problemi di dimensione dei file su certi host economici. Idealmente, si dovrebbe usare la metà della dimensione della Soglia file grandi. Impostare a 0 per disabilitare la suddivisione e creare un unico grande file di dump per ciascun database."
COM_AKEEBA_CONFIG_SPLITDBDUMP_TITLE="Dimensione per i file SQL dump suddivisi"
COM_AKEEBA_CONFIG_SUGARSYNC_ACCESS_DESCRIPTION="Inserire il proprio ID chiave di accesso. Crearne uno su https://www.sugarsync.com/developer/account"
COM_AKEEBA_CONFIG_SUGARSYNC_ACCESS_TITLE="ID chiave di accesso"
COM_AKEEBA_CONFIG_SUGARSYNC_DIRECTORY_DESCRIPTION="Directory in cui archiviare i file di backup. Se la prima parte della directory non corrisponde al nome di una cartella di sincronizzazione SugarSync, la directory verrà creata all'interno della cartella Magic Briefcase. È possibile utilizzare le stesse variabili usate per i nomi degli archivi di backup, ad es. [HOST] per il nome di dominio del sito o [DATE] per la data corrente."
COM_AKEEBA_CONFIG_SUGARSYNC_DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_SUGARSYNC_EMAIL_DESCRIPTION="L'indirizzo e-mail associato al proprio account SugarSync"
COM_AKEEBA_CONFIG_SUGARSYNC_EMAIL_TITLE="E-mail"
COM_AKEEBA_CONFIG_SUGARSYNC_PASSWORD_TITLE="Password"
COM_AKEEBA_CONFIG_SUGARSYNC_PRIVATE_DESCRIPTION="Inserisci la Chiave di Accesso Privata corrispondente al tuo ID Chiave di Accesso. Creane una su https://www.sugarsync.com/developer/account"
COM_AKEEBA_CONFIG_SUGARSYNC_PRIVATE_TITLE="Chiave di Accesso Privata"
COM_AKEEBA_CONFIG_SWIFT_AUTHURL_DESCRIPTION="L'endpoint per il servizio Keystone della tua installazione OpenStack. INCLUDI la versione. NON includere il suffisso /token. Esempio: https://authentication.example.com/v2.0"
COM_AKEEBA_CONFIG_SWIFT_AUTHURL_TITLE="URL di autenticazione"
COM_AKEEBA_CONFIG_SWIFT_CONTAINERURL_DESCRIPTION="L'endpoint API per il tuo container di object storage, ad es. https://storage.example.com/v1/AUTH_abcdef0123456789abcdef0123456789/my-container"
COM_AKEEBA_CONFIG_SWIFT_CONTAINERURL_TITLE="URL del container"
COM_AKEEBA_CONFIG_SWIFT_DIRECTORY_DESCRIPTION="La directory all'interno del container di object storage OpenStack Swift in cui archiviare gli archivi di backup. Per archiviare tutto nella radice del container, lasciare vuoto."
COM_AKEEBA_CONFIG_SWIFT_DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_SWIFT_DOMAIN_DESCRIPTION="Utilizzato solo con l'autenticazione Keystone v3. Si tratta del dominio di autenticazione per il servizio Keystone v3, <strong>NON</strong> il nome host del server di autenticazione Keystone. Nella maggior parte dei casi è <code>default</code> o <code>Default</code>. In caso di dubbio, contatta il tuo provider di storage."
COM_AKEEBA_CONFIG_SWIFT_DOMAIN_TITLE="Dominio di autenticazione Keystone v3"
COM_AKEEBA_CONFIG_SWIFT_KEYSTONE_VERSION_DESCRIPTION="Scegli quale versione del servizio di autenticazione OpenStack Keystone è utilizzata dal tuo provider di storage. In caso di dubbio, contatta il tuo provider di storage."
COM_AKEEBA_CONFIG_SWIFT_KEYSTONE_VERSION_TITLE="Versione Keystone"
