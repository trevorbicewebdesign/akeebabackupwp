COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_1="Lo script di ripristino del backup (ANGIE) sarà accessibile solo fornendo la password impostata nella pagina precedente, prima di fare clic sul pulsante Esegui backup ora. Se non si ricorda di aver impostato una password, il browser ha compilato automaticamente la password nella pagina di Configurazione <strong>senza chiedere conferma</strong>. Questo comportamento è adottato da molti gestori di password e browser."
COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_2="I browser e i gestori di password moderni non consentono di ignorare questo comportamento. Nella pagina di Configurazione è stata inserita una protezione JavaScript contro questo tipo di compilazione automatica non consensuale del campo password. Tuttavia, se si salva la pagina di Configurazione entro circa mezzo secondo dal caricamento, questa protezione potrebbe non avere il tempo di essere eseguita."
