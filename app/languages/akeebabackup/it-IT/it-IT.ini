SOLO_MAIN_LBL_WHYSUBSCRIBE="Akeeba Solo Professional dispone di molte funzionalità aggiuntive utili, tra cui il <b>ripristino integrato dei backup</b>, l'importazione di archivi di backup da Amazon S3 o dal proprio server, il <b>trasferimento automatico dei backup su cloud storage (Amazon S3, Dropbox, Box.com e oltre 40 altri servizi)</b>, filtri avanzati di inclusione/esclusione e molto altro! Gli abbonati alla versione Professional ricevono inoltre supporto prioritario dagli sviluppatori del software sul nostro sito."
