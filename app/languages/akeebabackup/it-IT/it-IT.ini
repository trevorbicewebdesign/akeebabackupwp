SOLO_CONFIG_UNDER_TOOLS_DESCRIPTION="No: Akeeba Backup appare nel menu laterale di WordPress come elemento di primo livello, posizionato verso il basso. Sì: Akeeba Backup appare come sottomenu nella voce di menu «Strumenti» del menu laterale di WordPress."
SOLO_CONFIG_UNDER_TOOLS_LABEL="Posiziona sotto Strumenti"
SOLO_CONFIG_UPDATE_INTEGRATED_WP="Mostra gli aggiornamenti di Akeeba Backup nella pagina Plugin"
SOLO_CONFIG_UPDATE_INTEGRATED_WP_DESC="Quando abilitato, Akeeba Backup notificherà a WordPress la disponibilità di aggiornamenti e la posizione dei file di aggiornamento. Ciò consente a WordPress di includere gli aggiornamenti di Akeeba Backup nel conteggio degli aggiornamenti disponibili e di mostrarli nella pagina Plugin. Su pochissimi siti questo potrebbe causare una pagina vuota o un errore durante l'accesso alla pagina Plugin, a causa dell'interazione con plugin di terze parti scritti male. In tal caso, disabilitare questa opzione e contattarci con l'elenco dei plugin attivati sul sito e le relative versioni."
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_CONSERVATIVE="Conservativo"
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_DESCRIPTION="Quando abilitato, i backup eseguiti con WP-CRON avranno i limiti di tempo minimo e massimo impostati nella sezione di configurazione Ottimizzazione del profilo di backup sovrascritti. L'impostazione «Ottimistico» cercherà di utilizzare il tempo massimo possibile sul server — fino a 60 secondi — rendendo i backup più veloci ma soggetti a errori. L'impostazione «Conservativo» cercherà di utilizzare solo la metà del tempo rispetto all'impostazione Ottimistico, rendendo i backup più lenti ma meno soggetti a errori. Alcuni server potrebbero richiedere di impostare questa opzione su «No» e di regolare manualmente le impostazioni di Ottimizzazione per far funzionare il backup senza errori."
