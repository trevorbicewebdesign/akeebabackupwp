COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECK_HEADERINFO="Questa funzionalità consente di verificare se ci sono backup completati che non sono stati caricati sull'archiviazione remota (ad es. Amazon S3, Dropbox, ecc.) e di inviare una notifica via e-mail agli amministratori del sito."
COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECKUSECLI="Per verificare i caricamenti non riusciti sull'archiviazione remota utilizzando lo script CLI nativo, usare il seguente comando:"
COM_AKEEBA_SCHEDULE_LBL_CLICRON="CRON job da riga di comando (consigliato)"
COM_AKEEBA_SCHEDULE_LBL_CLICRON_INFO="Questo è il metodo consigliato per tutti i server che supportano i CRON job da riga di comando. Questo metodo bypassa l'interfaccia web, ottenendo la massima velocità di backup."
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICIMPROTANTINFO="Importante"
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICINFO="Ricordarsi di sostituire <em>%s</em> con il percorso reale dell'eseguibile PHP <strong>CLI (Command Line Interface)</strong> del proprio host. Tenere presente che è necessario utilizzare l'eseguibile PHP CLI; anche se l'eseguibile PHP CGI (Common Gateway Interface) potrebbe funzionare con i nostri script CRON, è soggetto a errori di timeout e fallimenti del backup. In caso di dubbi sul significato di ciò, contattare il proprio host. Sono gli unici in grado di fornire il percorso del file eseguibile PHP CLI."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP="Funzionalità di backup front-end"
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_INFO="Questo metodo utilizza un URL pubblico e una chiave segreta per avviare un backup del sito. Il backup avanza tramite reindirizzamenti HTTP. Si noti che la maggior parte dei servizi CRON basati su URL degli host, così come la maggior parte dei servizi CRON di terze parti basati su URL, non supportano i reindirizzamenti HTTP. Se gli esempi con wget e curl seguenti non funzionano, si consiglia di utilizzare l'URL di backup front-end con il servizio di terze parti webcron.org, molto economico."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_MANYMETHODS="La funzionalità di backup front-end può essere utilizzata con un'ampia varietà di metodi. Fare clic sulle schede seguenti per vedere la descrizione di ciascun metodo. Si ricorda che tutti sono spiegati in dettaglio nella nostra documentazione."
