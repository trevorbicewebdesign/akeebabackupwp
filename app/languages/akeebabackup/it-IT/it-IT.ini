COM_AKEEBA_CONFIG="Configurazione"
COM_AKEEBA_CONFIG_ADVANCED="Configurazione avanzata"
COM_AKEEBA_CONFIG_ADVANCED_SBALF_DESC="Akeeba Backup interromperà la fase di elaborazione dopo aver archiviato un file di grandi dimensioni. Abilitando questa opzione, Akeeba Backup funzionerà più velocemente. Tuttavia, ciò potrebbe causare errori di timeout o errori interni del server."
COM_AKEEBA_CONFIG_ADVANCED_SBALF_LABEL="Disabilita interruzione di fase dopo file di grandi dimensioni"
COM_AKEEBA_CONFIG_ADVANCED_SBBD_LABEL="Disabilita interruzione di fase tra domini"
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_DESC="Akeeba Backup interromperà la fase di elaborazione prima di archiviare un file di grandi dimensioni. Abilitando questa opzione, Akeeba Backup funzionerà più velocemente. Tuttavia, ciò potrebbe causare errori di timeout o errori interni del server."
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_LABEL="Disabilita interruzione di fase prima dei file di grandi dimensioni"
COM_AKEEBA_CONFIG_ADVANCED_SBPA_DESC="Akeeba Backup interromperà la fase di elaborazione se ritiene che il tempo disponibile non sia sufficiente per archiviare un file. Questo calcolo non è del tutto preciso e potrebbe rallentare i backup. Abilitando questa opzione, Akeeba Backup funzionerà più velocemente. Tuttavia, ciò potrebbe causare errori di timeout o errori interni del server."
COM_AKEEBA_CONFIG_ADVANCED_SBPA_LABEL="Disabilita interruzione proattiva delle fasi"
COM_AKEEBA_CONFIG_ADVANCED_SBPP_DESC="Akeeba Backup interromperà la fase di elaborazione tra le sottofasi di finalizzazione e post-elaborazione del backup. Ciò può aggiungere circa 10 secondi al tempo totale del backup. Abilitando questa opzione, Akeeba Backup funzionerà più velocemente. Tuttavia, ciò potrebbe causare errori di timeout o errori interni del server."
COM_AKEEBA_CONFIG_ADVANCED_SBPP_LABEL="Disabilita interruzione di fase nella finalizzazione"
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_DESC="Indica ad Akeeba Backup di tentare di aumentare il limite di memoria di PHP a un valore molto elevato (16 GB). Ciò consente di comprimere file più grandi e caricare archivi di backup più grandi tramite opzioni di archiviazione remota che richiedono molta memoria, come WebDAV. Nota: questo imposta solo il limite massimo di consumo della memoria. Nella maggior parte dei casi, il motore di backup di Akeeba Backup consuma <em>molto meno</em> memoria di tale limite, tipicamente nell'ordine di 20 MB. La compressione e il caricamento di file più grandi richiedono anche la modifica di altre opzioni nella pagina Configurazione del profilo di backup."
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_LABEL="Imposta un limite di memoria elevato"
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_DESC="Se il server non esegue PHP in modalità provvisoria e supporta set_time_limit(), Akeeba Backup tenterà di impostare un tempo massimo di esecuzione PHP illimitato per aggirare potenziali problemi di timeout"
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_LABEL="Imposta un limite di tempo PHP illimitato"
COM_AKEEBA_CONFIG_ANGIE_KEY_DESCRIPTION="Se si utilizza lo script di installazione integrato ANGIE, è possibile proteggerlo con una password opzionale, impedendo l'accesso non autorizzato all'installer. All'avvio dell'installer verrà richiesto di inserire questa password. Si noti che la password è sensibile alle maiuscole e minuscole, ad esempio ABC, abc e Abc sono tre password diverse."
COM_AKEEBA_CONFIG_ANGIE_KEY_TITLE="Password ANGIE"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_DESC="Invia e-mail a questo indirizzo (lasciare vuoto per disabilitare questa funzionalità)"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_LABEL="Indirizzo e-mail"
COM_AKEEBA_CONFIG_ARCHIVENAME_DESCRIPTION="Modello di denominazione per l'archivio di backup, dove applicabile. È possibile usare le seguenti macro:<ul><li><b>[HOST]</b> Il nome host. ATTENZIONE! Questo tag non funziona in modalità CRON.</li><li><b>[DATE]</b> Data corrente</li><li><b>[TIME_TZ]</b> Ora corrente e fuso orario</li></ul>Sono disponibili altre macro; consultare la documentazione."
COM_AKEEBA_CONFIG_ARCHIVENAME_TITLE="Nome dell'archivio di backup"
COM_AKEEBA_CONFIG_ARCHIVERENGINE_DESCRIPTION="Definisce il formato di archivio di Akeeba Backup. Alcuni motori, come DirectFTP, non producono effettivamente archivi, ma si occupano del trasferimento dei file verso altri server."
COM_AKEEBA_CONFIG_ARCHIVERENGINE_TITLE="Motore di archiviazione"
COM_AKEEBA_CONFIG_AUTORESUME_DESCRIPTION="Quando questa opzione è deselezionata, Akeeba Backup interromperà il backup quando il server risponde con un errore. Quando questa opzione è abilitata, Akeeba Backup tenterà di riprendere il backup ripetendo l'ultima fase. Ciò si applica solo ai backup back-end. Non consente di riprendere con successo tutti i backup che risultano in un errore: solo i tentativi di backup temporaneamente bloccati da restrizioni sull'utilizzo della CPU del server o problemi di interruzione della rete possono essere ripresi."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_DESCRIPTION="Quante volte Akeeba Backup deve riprovare a riprendere il backup prima di rinunciare definitivamente. Da 3 a 5 tentativi funzionano meglio sulla maggior parte dei server."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_TITLE="Numero massimo di tentativi di una fase di backup dopo un errore AJAX"
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_DESCRIPTION="Quanti secondi attendere prima di riprendere il backup. Si consiglia di impostare questo valore su 30 secondi o più (120 secondi è consigliato nella maggior parte dei casi) per dare al server il tempo necessario a sbloccare il processo di backup prima che Akeeba Backup tenti di completarlo."
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_TITLE="Periodo di attesa prima di riprovare la fase di backup"
COM_AKEEBA_CONFIG_AUTORESUME_TITLE="Riprendi il backup dopo che si è verificato un errore AJAX"
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_DESCRIPTION="Il nome dell'account. Se l'endpoint è foobar.blob.core.windows.net, il nome dell'account è <b>foobar</b> e occorre digitare <em>foobar</em> in questo campo."
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_TITLE="Nome account"
COM_AKEEBA_CONFIG_AZURE_CONTAINER_DESCRIPTION="Il container Windows Azure BLOB Storage in cui conservare gli archivi di backup. Il container deve già esistere."
COM_AKEEBA_CONFIG_AZURE_CONTAINER_TITLE="Container"
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_DESCRIPTION="La directory all'interno del container Windows Azure BLOB Storage in cui archiviare gli archivi di backup. Per archiviare tutto nella radice del container, lasciare vuoto."
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_AZURE_KEY_DESCRIPTION="La chiave di accesso primaria è disponibile nella pagina del proprio account su windows.azure.com. Copiarla e incollarla qui. Termina sempre con due segni di uguale."
COM_AKEEBA_CONFIG_AZURE_KEY_TITLE="Chiave di accesso primaria"
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_DESCRIPTION="Inserire l'ID chiave applicazione di BackBlaze. Questa informazione è disponibile nella <a href='https://secure.backblaze.com/b2_buckets.htm'>pagina del proprio account BackBlaze</a> dopo aver fatto clic su «Show Account ID and Application Key». Se si utilizza la chiave master, inserire invece l'ID account."
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_TITLE="ID chiave applicazione"
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_DESCRIPTION="Inserire la chiave applicazione di BackBlaze. Questa informazione è disponibile nella <a href='https://secure.backblaze.com/b2_buckets.htm'>pagina del proprio account BackBlaze</a> dopo aver fatto clic su «Show Account ID and Application Key». <strong>ATTENZIONE</strong>! Questa chiave viene mostrata solo UNA VOLTA da BackBlaze. Per visualizzarla nuovamente sarà necessario rigenerare la chiave applicazione, causando lo scollegamento di TUTTE le istanze di Akeeba Backup precedentemente collegate, finché non verrà inserita la <em>nuova</em> chiave applicazione."
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_TITLE="Chiave applicazione"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_DESCRIPTION="Il nome del bucket Backblaze"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_BACKBLAZE_DIRECTORY_DESCRIPTION="La directory all'interno del tuo bucket in cui verranno archiviati gli archivi di backup. Lascia vuoto per archiviare i file nella radice del bucket."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_DESCRIPTION="Quando si abilita questa opzione, Akeeba Backup eseguirà caricamenti in parte singola su Backblaze B2. Sarà necessario utilizzare un valore più piccolo per l'impostazione Dimensione parte degli archivi suddivisi nella configurazione del motore di archiviazione, per evitare che il caricamento vada in timeout causando il fallimento del processo di backup."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_TITLE="Disabilita i caricamenti multiparte"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_DESC="L'ora di avvio del backup deve essere convertita nel fuso orario dell'utente attualmente connesso nella pagina Gestione backup? Se impostato su No, tutte le ore di avvio del backup vengono visualizzate nel fuso orario GMT. Questa opzione NON influisce sulle variabili [DATE] e [TIME] per la denominazione dei file di backup o sulla descrizione predefinita; usa l'opzione Fuso orario del backup per modificare il funzionamento di queste variabili."
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_LABEL="Ora locale in Gestione backup"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_WP_DESC="Se disabilitata, l'ora di avvio del backup nella pagina Gestione backup verrà visualizzata nel fuso orario GMT. Se abilitata, l'ora di avvio del backup verrà visualizzata nel fuso orario configurato in WordPress stesso (Impostazioni, Generali, Fuso orario)."
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_DESC="Mostrare l'opzione per scaricare gli archivi di backup tramite il browser, anche se sconsigliato? Si noti che questa opzione NON sarà disponibile se è abilitato WP_DEBUG o se la visualizzazione degli errori PHP è attiva, come precauzione di base contro download corrotti (incompleti o danneggiati). <strong>ATTENZIONE! Abilitando questa opzione si accetta di non ricevere alcun supporto per problemi relativi all'estrazione degli archivi di backup.</strong>"
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_LABEL="Consenti il download degli archivi di backup tramite il browser"
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_DESC="Dare agli utenti che ripristinano un sito l'opzione di eliminare tutto prima di estrarre un archivio? Questa opzione si applica solo alla versione Professional del software. ATTENZIONE! QUESTA OPERAZIONE È ESTREMAMENTE PERICOLOSA. LEGGERE ATTENTAMENTE LA DOCUMENTAZIONE PRIMA DI ABILITARLA. SE SI UTILIZZA QUESTA FUNZIONE DURANTE IL RIPRISTINO SI RINUNCIA A QUALSIASI DIRITTO DI RICHIEDERE SUPPORTO E SI ASSUMONO TUTTE LE RESPONSABILITÀ E GLI OBBLIGHI."
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_LABEL="Mostra l'opzione «Elimina tutto prima dell'estrazione»"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_ABBREVIATION="Fuso orario"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_DESC="Il suffisso del fuso orario da visualizzare accanto all'ora di avvio del backup nella pagina Gestione backup.<br/>Nessuno: non viene visualizzato alcun suffisso (sconsigliato).<br/>Fuso orario: un fuso orario abbreviato, ad esempio CET per l'ora dell'Europa centrale.<br/>Offset GMT: lo scostamento dal fuso orario GMT. Questo valore può cambiare in base all'ora legale. Ad esempio, il fuso orario CET sarà GMT+01:00 (un'ora avanti rispetto al GMT) in inverno e GMT+02:00 (due ore avanti rispetto al GMT) in estate."
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_GMTOFFSET="Offset GMT"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_LABEL="Suffisso fuso orario"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_NONE="Nessuno"
COM_AKEEBA_CONFIG_BACKUPTYPE_ALLDB="Tutti i database configurati (file archivio)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DBONLY="Solo il database principale del sito (file SQL)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DESCRIPTION="Il tipo di backup del sito che si desidera eseguire con Akeeba Backup"
COM_AKEEBA_CONFIG_BACKUPTYPE_FILEONLY="Solo i file del sito"
COM_AKEEBA_CONFIG_BACKUPTYPE_FULL="Backup completo del sito"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFILE="Solo file, incrementale"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFULL="Sito completo, file incrementali"
COM_AKEEBA_CONFIG_BACKUPTYPE_TITLE="Tipo di backup"
COM_AKEEBA_CONFIG_BACTHSIZE_DESCRIPTION="Ridurre questo valore per ridurre l'utilizzo di memoria ed evitare errori HTTP 500 durante il backup di tabelle di grandi dimensioni"
COM_AKEEBA_CONFIG_BACTHSIZE_TITLE="Numero di righe per blocco"
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_DESCRIPTION="I file di dimensioni superiori a questo valore verranno archiviati senza compressione, oppure la loro elaborazione verrà suddivisa in più fasi (a seconda del motore di archiviazione) per evitare timeout. Si consiglia di aumentare questo valore solo su server veloci e affidabili."
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_TITLE="Soglia file di grandi dimensioni"
COM_AKEEBA_CONFIG_BLANKOUTPASS_DESCRIPTION="Rimuove il nome utente e la password delle connessioni al database dal backup"
COM_AKEEBA_CONFIG_BLANKOUTPASS_TITLE="Oscura nome utente/password"
COM_AKEEBA_CONFIG_BOX_ACCESSTOKEN_TITLE="Token di accesso"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_ENABLE="Abilita il caricamento a blocchi"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_SIZE="Dimensione blocco"
COM_AKEEBA_CONFIG_BOX_DIRECTORY_DESCRIPTION="La directory all'interno del tuo account Box in cui verranno archiviati gli archivi di backup. Lascia vuoto per archiviare i file nella radice della cartella Box."
COM_AKEEBA_CONFIG_BOX_DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_DESC="Fai clic su questo pulsante per aprire una nuova finestra in cui puoi accedere al tuo account con il provider di archiviazione. Successivamente, chiudi la finestra popup e fai clic sul pulsante Fase 2 in basso."
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_TITLE="Autenticazione - Fase 1"
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_DESCRIPTION="Compilato automaticamente al completamento della Fase 1 di autenticazione. NON condividere lo stesso token su più siti. Autentica ciascun sito separatamente."
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_TITLE="Token di aggiornamento"
COM_AKEEBA_CONFIG_CHUNKSIZE_DESCRIPTION="Akeeba Backup elabora i file di grandi dimensioni in piccoli blocchi per evitare timeout. Questo parametro definisce la dimensione massima del blocco per questo tipo di elaborazione."
COM_AKEEBA_CONFIG_CHUNKSIZE_TITLE="Dimensione blocco per l'elaborazione di file di grandi dimensioni"
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_DESCRIPTION="Quando questa casella è deselezionata (impostazione predefinita) e la fase di backup termina in meno tempo rispetto al tempo minimo di esecuzione configurato, Akeeba Backup farà attendere il server fino al raggiungimento di tale tempo. Ciò potrebbe causare l'interruzione del backup su alcuni server con restrizioni molto severe. Selezionando questa casella, il periodo di attesa verrà implementato sul browser, agirando questa limitazione. IMPORTANTE: questa opzione si applica solo ai backup dal back-end. I backup front-end, tramite JSON API (remoto) e da riga di comando (CLI) implementano sempre l'attesa lato server."
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_TITLE="Implementazione lato client del tempo minimo di esecuzione"
COM_AKEEBA_CONFIG_CLOUDFILESAPIKEY_DESCRIPTION="La tua chiave API CloudFiles"
COM_AKEEBA_CONFIG_CLOUDFILESAPIKEY_TITLE="Chiave API"
COM_AKEEBA_CONFIG_CLOUDFILESCONTAINER_DESCRIPTION="Il container CloudFiles in cui archiviare gli archivi di backup"
COM_AKEEBA_CONFIG_CLOUDFILESCONTAINER_TITLE="Container"
COM_AKEEBA_CONFIG_CLOUDFILESDIRECTORY_DESCRIPTION="La directory all'interno del container CloudFiles in cui archiviare gli archivi di backup. Per archiviare tutto nella radice del container, lascia vuoto."
COM_AKEEBA_CONFIG_CLOUDFILESDIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_CLOUDFILESUSERNAME_DESCRIPTION="Il tuo nome utente CloudFiles"
COM_AKEEBA_CONFIG_CLOUDFILESUSERNAME_TITLE="Nome utente"
COM_AKEEBA_CONFIG_CLOUDME_DIRECTORY_DESCRIPTION="La directory all'interno del tuo account CloudMe in cui verranno archiviati gli archivi di backup. Lascia vuoto per archiviare i file nella radice della cartella CloudMe."
COM_AKEEBA_CONFIG_CLOUDME_DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_CLOUDME_PASSWORD_DESCRIPTION="Password"
COM_AKEEBA_CONFIG_CLOUDME_PASSWORD_TITLE="Password"
COM_AKEEBA_CONFIG_CLOUDME_USERNAME_DESCRIPTION="Nome utente"
COM_AKEEBA_CONFIG_CLOUDME_USERNAME_TITLE="Nome utente"
COM_AKEEBA_CONFIG_COUNTQUOTA_ENABLE_DESCRIPTION="Se abilitata, Akeeba Backup eliminerà i vecchi file di backup se il loro numero supera il limite definito di seguito."
COM_AKEEBA_CONFIG_COUNTQUOTA_ENABLE_TITLE="Abilita quota per numero"
COM_AKEEBA_CONFIG_COUNTQUOTA_VALUE_DESCRIPTION="Akeeba Backup eliminerà i vecchi file di backup se il loro numero supera il limite definito in questa impostazione. I backup multiparte sono considerati come <i>un</i> unico file!<br/><br/><b>Suggerimento</b>: seleziona Personalizzato e digita il valore desiderato se non è presente nell'elenco."
COM_AKEEBA_CONFIG_COUNTQUOTA_VALUE_TITLE="Quota per numero"
COM_AKEEBA_CONFIG_DATEFORMAT_DESC="Modifica il modo in cui la data/ora di avvio dei backup viene visualizzata nella pagina Gestione backup. Lascia vuoto per utilizzare la formattazione predefinita. È possibile utilizzare le opzioni di formattazione della funzione date di PHP, vedere: http://www.php.net/manual/en/function.date.php"
COM_AKEEBA_CONFIG_DATEFORMAT_LABEL="Formato data"
COM_AKEEBA_CONFIG_DELETEAFTER_DESCRIPTION="Se abilitata, l'archivio di backup verrà rimosso da questo server non appena la post-elaborazione sarà completata con successo."
COM_AKEEBA_CONFIG_DELETEAFTER_TITLE="Elimina l'archivio dopo l'elaborazione"
COM_AKEEBA_CONFIG_DEREFERENCESYMLINKS_DESCRIPTION="Se abilitata, i collegamenti simbolici verranno seguiti esattamente come file e directory normali. Se deselezionata, i collegamenti simbolici non verranno seguiti. Se si utilizzano collegamenti simbolici che portano a un ciclo di collegamento infinito, deselezionare questa opzione."
COM_AKEEBA_CONFIG_DEREFERENCESYMLINKS_TITLE="Dereferenzia i collegamenti simbolici"
COM_AKEEBA_CONFIG_DESKTOP_NOTIFICATIONS_DESC="Chiedere il permesso di visualizzare le notifiche desktop? Le notifiche desktop vengono visualizzate quando il backup inizia, termina, genera un avviso o si interrompe. Vengono mostrate solo su browser compatibili (tipicamente: Chrome, Safari, Firefox, Opera) se si concede ad Akeeba Backup il permesso di visualizzare notifiche desktop quando richiesto nella pagina del Pannello di controllo. Questa opzione controlla solo se tale richiesta deve essere visualizzata. Una volta accettato o rifiutato il permesso per le notifiche desktop, questa impostazione non ha <b>alcun effetto</b>. L'unico modo per abilitare o disabilitare le notifiche desktop sarà attraverso le impostazioni del browser."
COM_AKEEBA_CONFIG_DESKTOP_NOTIFICATIONS_LABEL="Richiedi il permesso per le notifiche desktop"
COM_AKEEBA_CONFIG_DIRECTFTP_FTPS_DESCRIPTION="Se abilitata, Akeeba Backup tenterà di connettersi al server FTP utilizzando una connessione cifrata SSL. <strong>Questo non è lo stesso di SFTP, SCP o «Secure FTP»!</strong> Si noti che se il server non supporta questo metodo si riceveranno errori di connessione."
COM_AKEEBA_CONFIG_DIRECTFTP_FTPS_TITLE="Usa FTP over SSL (FTPS)"
COM_AKEEBA_CONFIG_DIRECTFTP_HOST_DESCRIPTION="Nome host del server FTP, senza il protocollo. Ciò significa che <tt>ftp://example.com</tt> è <b>non valido</b> e <tt>example.com</tt> è valido. Akeeba Backup supporta solo server FTP e FTPS. <u>Non</u> supporta SFTP, SCP e altre varianti SSH."
COM_AKEEBA_CONFIG_DIRECTFTP_HOST_TITLE="Nome host"
COM_AKEEBA_CONFIG_DIRECTFTP_INITDIR_DESCRIPTION="Il percorso <b>FTP</b> assoluto della directory in cui verranno caricati i file. Se non si è sicuri, connettersi al server con FileZilla, navigare fino alla directory desiderata e copiare il percorso visualizzato nel riquadro di destra sopra l'elenco delle directory. Di solito è qualcosa di breve, come <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_DIRECTFTP_INITDIR_TITLE="Directory iniziale"
COM_AKEEBA_CONFIG_DIRECTFTP_PASSIVE_DESCRIPTION="Usa la modalità passiva FTP durante il trasferimento dei dati. Questa opzione è abilitata per impostazione predefinita in quanto è l'unico metodo che funziona attraverso i firewall comunemente installati sui server web. Non disabilitarla a meno che non si sia certi che il server web non si trovi dietro un firewall e che il server FTP richieda assolutamente trasferimenti in modalità attiva."
COM_AKEEBA_CONFIG_DIRECTFTP_PASSIVE_TITLE="Usa modalità passiva"
COM_AKEEBA_CONFIG_DIRECTFTP_PASSWORD_DESCRIPTION="Password del server FTP. Di solito è sensibile alle maiuscole/minuscole. In caso di dubbi, contattare l'amministratore di rete."
COM_AKEEBA_CONFIG_DIRECTFTP_PASSWORD_TITLE="Password"
COM_AKEEBA_CONFIG_DIRECTFTP_PORT_DESCRIPTION="Porta del server FTP. L'impostazione più comune è 21. In caso di dubbi, contattare l'amministratore di rete."
COM_AKEEBA_CONFIG_DIRECTFTP_PORT_TITLE="Porta"
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_DESCRIPTION="Usa questo pulsante per testare la connessione FTP e visualizzare gli errori di connessione in caso di errore."
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_FAIL="Impossibile connettersi al server FTP remoto."
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_OK="Connessione al server FTP remoto stabilita con successo!"
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_TITLE="Testa la connessione FTP"
COM_AKEEBA_CONFIG_DIRECTFTP_USER_DESCRIPTION="Nome utente del server FTP. Di solito è sensibile alle maiuscole. In caso di dubbi, contattare l'amministratore di rete."
COM_AKEEBA_CONFIG_DIRECTFTP_USER_TITLE="Nome utente"
COM_AKEEBA_CONFIG_DIRECTSFTP_HOST_DESCRIPTION="Inserire il nome host o l'indirizzo IP del server SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_HOST_TITLE="Nome host"
COM_AKEEBA_CONFIG_DIRECTSFTP_INITDIR_DESCRIPTION="Inserire la directory in cui verranno caricati i file. In caso di dubbi, utilizzare un client SFTP desktop, connettersi al server, navigare fino alla directory desiderata e copiare il percorso visualizzato. Il percorso deve essere in formato assoluto, ad es. /users/myusername/public_html"
COM_AKEEBA_CONFIG_DIRECTSFTP_INITDIR_TITLE="Directory iniziale"
COM_AKEEBA_CONFIG_DIRECTSFTP_PASSWORD_DESCRIPTION="La password SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_PASSWORD_TITLE="Password"
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_DESCRIPTION="La porta predefinita per le connessioni SFTP è la 22. Se il server utilizza una porta diversa, inserirla qui."
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_TITLE="Porta"
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_DESCRIPTION="Usa questo pulsante per testare la connessione SFTP e visualizzare gli errori di connessione in caso di errore."
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_FAIL="Impossibile connettersi al server SFTP remoto. Il messaggio di errore è:"
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_OK="Connessione al server SFTP remoto stabilita con successo. Nota: l'impostazione della directory iniziale non è stata verificata."
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_TITLE="Testa la connessione SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_DESCRIPTION="Il nome utente SFTP. Si noti che il server SFTP deve consentire l'autenticazione tramite nome utente e password."
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_TITLE="Nome utente"
COM_AKEEBA_CONFIG_DOWNLOADID_DESC="Questo è necessario per abilitare gli aggiornamenti in tempo reale della versione Professional. Visitare https://www.akeeba.com/my-subscriptions.html per ottenere il proprio Download ID personale."
COM_AKEEBA_CONFIG_DOWNLOADID_LABEL="Download ID"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_DESCRIPTION="La chiave di accesso DreamObjects, disponibile nel pannello di controllo DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_TITLE="Chiave di accesso"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_DESCRIPTION="Il nome del bucket DreamObjects. Assicurarsi che sia scritto esattamente come indicato nel pannello di controllo DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_DESCRIPTION="La directory all'interno del bucket in cui verranno archiviati gli archivi di backup. Lasciare vuoto per archiviare i file nella radice del bucket."
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_DESCRIPTION="Se abilitato, Akeeba Backup tenterà di convertire il nome del bucket in lettere minuscole, ad es. MyBucket verrà convertito in mybucket. Se è stato creato un bucket con lettere maiuscole, ad es. MyNewBucket, deselezionare questa opzione e assicurarsi che il nome del bucket sia scritto esattamente come appare nel pannello di controllo DreamHost."
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_TITLE="Nome bucket in minuscolo"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_DESCRIPTION="La chiave segreta DreamObjects, disponibile nel pannello di controllo DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_TITLE="Chiave segreta"
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_DESCRIPTION="Se abilitato, verrà utilizzata una connessione sicura (HTTPS) durante il caricamento dei file. Pur aumentando la sicurezza dei dati trasferiti, aumenta anche la possibilità di errore del backup per timeout."
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_TITLE="Usa SSL"
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_DESCRIPTION="La directory all'interno del proprio account Dropbox in cui verranno archiviati gli archivi di backup. Lasciare vuoto per archiviare i file nella radice."
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_DESCRIPTION="Questo è il Refresh Token che connette Akeeba Backup a Dropbox. È <strong>specifico per sito</strong> e viene utilizzato per riautorizzare la connessione a Dropbox quando l'Access Token di breve durata scade. Se si dispone di più siti, è necessario utilizzare i pulsanti del Passaggio 1 su ciascun sito che si desidera autorizzare. Si prega di <strong>NON</strong> copiare l'access token o il refresh token su più siti. Ciò causerà la desincronizzazione dell'autenticazione Dropbox e sarà necessario riconnettere tutti i siti con Dropbox."
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_TITLE="Refresh Token"
COM_AKEEBA_CONFIG_DROPBOXTOKEN_DESCRIPTION="Questo viene recuperato automaticamente da Dropbox quando si fa clic sul pulsante Passaggio 2 qui sopra. Se si dispone di più siti, è necessario utilizzare i pulsanti Passaggio 1 e Passaggio 2 solo sul PRIMO sito che si desidera autorizzare. Quindi copiare il Token, la Chiave Token Segreta e l'ID Utente dal primo sito a tutti gli altri siti che si desidera connettere a Dropbox."
COM_AKEEBA_CONFIG_DROPBOXTOKEN_TITLE="Access Token"
COM_AKEEBA_CONFIG_DROPBOX_TEAM_DESC="Selezionare se si è membri di un team che utilizza Dropbox for Business e si desidera utilizzare la cartella del team per archiviare i backup. Ricordarsi di aggiungere come prefisso alla Directory qui sotto il nome della cartella del team. Ad esempio, se l'interfaccia web di Dropbox mostra una "Acme Corp Team Folder" nella pagina File e si desidera inserire i backup in una cartella chiamata "Backups" al suo interno, si deve utilizzare il nome Directory <code>Acme Corp Team Folder/Backups</code>, non solo <code>Backups</code>."
COM_AKEEBA_CONFIG_DROPBOX_TEAM_TITLE="Dropbox for Business"
COM_AKEEBA_CONFIG_DUMPENGINE_DESCRIPTION="Definisce come Akeeba Backup elaborerà i database per produrre un file di backup del database."
COM_AKEEBA_CONFIG_DUMPENGINE_TITLE="Motore di backup del database"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_COMMON="Impostazioni comuni"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_MYSQL="Impostazioni MySQL"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_POSTGRES="Impostazioni PostgreSQL"
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_DESCRIPTION="Le e-mail verranno inviate a questo indirizzo anziché a quello configurato nella pagina di Configurazione di sistema al termine del backup o in caso di errore, se applicabile. È possibile separare più indirizzi e-mail con una virgola, ad es. alice@example.com, bob@example.com."
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_TITLE="Destinatari e-mail"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_DESCRIPTION="Trasferisce i file del sito su un server FTP remoto, senza archiviarli prima. Questo motore di archiviazione utilizza la libreria cURL che garantisce una migliore compatibilità con un'ampia gamma di server FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_DESCRIPTION="Alcuni server FTP configurati in modo errato o non funzionanti correttamente restituiscono un indirizzo IP errato quando la modalità passiva FTP è abilitata. Abilitare questa opzione per forzare la libreria FTP a ignorare l'IP errato restituito dal server FTP, utilizzando invece l'IP pubblico del server FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_TITLE="Soluzione alternativa per la modalità passiva"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_TITLE="DirectFTP over cURL"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_DESCRIPTION="Trasferisce i file del sito su un server FTP remoto, senza archiviarli prima"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_TITLE="DirectFTP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_DESCRIPTION="Trasferisce i file del sito su un server SFTP remoto, senza archiviarli prima. Questo motore di archiviazione utilizza la libreria cURL che garantisce una migliore compatibilità con un'ampia gamma di server FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_TITLE="DirectSFTP over cURL"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_DESCRIPTION="Trasferisce i file del sito su un server SFTP remoto, senza archiviarli prima. AVVISO: il server di origine deve avere installata l'estensione SSL2 di PHP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_TITLE="DirectSFTP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPA_DESCRIPTION="Un formato di archivio open-source ottimizzato per la creazione e l'estrazione rapida degli archivi tramite codice PHP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPA_TITLE="Formato JPA (consigliato)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_DESCRIPTION="Crea archivi cifrati con il metodo di cifratura standard AES-128, in un formato molto simile a JPA. Richiede che una delle estensioni PHP mcrypt o openssl sia installata e attivata sul sito."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_TITLE="Archivi cifrati (JPS)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_DESCRIPTION="L'archivio ZIP verrà creato utilizzando la classe ZipArchive di PHP. IMPORTANTE: questo motore non supporta la suddivisione degli archivi né la gestione dei collegamenti simbolici e può, pertanto, causare problemi di backup. Se si ricevono errori di timeout, errori AJAX o messaggi di Internal Server Error, sarà necessario passare a un motore di archiviazione diverso e abilitare la suddivisione degli archivi."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_TITLE="ZIP con classe ZipArchive"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIP_DESCRIPTION="File ZIP standard, noti anche come \"Cartelle compresse\", supportati nativamente da tutti i principali sistemi operativi"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIP_TITLE="Formato ZIP"
