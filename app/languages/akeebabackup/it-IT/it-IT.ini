COM_AKEEBA_TRANSFER_LBL_CHUNKSIZE_INFO="I file dell'archivio di backup vengono trasferiti al server remoto in piccoli blocchi. Questa impostazione determina la dimensione di questi blocchi. Dimensioni troppo piccole potrebbero indurre il server remoto a bloccare la connessione, scambiandola per un abuso, causando la visualizzazione di un errore di caricamento. Dimensioni troppo grandi potrebbero causare un errore di timeout sul server di origine o su quello remoto, con la visualizzazione di un errore AJAX. In genere, valori compresi tra 5M e 20M offrono i migliori risultati."
