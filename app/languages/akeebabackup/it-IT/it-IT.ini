COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEAPP_TITLE="Carica su Microsoft OneDrive (cartella specifica dell'applicazione)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEAPP_DESCRIPTION="Carica l'archivio di backup su Microsoft OneDrive, nella cartella specifica dell'applicazione per Akeeba Backup (<code>Apps/Akeeba Backup</code>). Questa opzione è più limitata rispetto alle altre opzioni di caricamento su OneDrive, ma è meno probabile che causi problemi con alcuni account che presentano difficoltà di autenticazione con l'altra integrazione disponibile."
COM_AKEEBA_CONFIG_ONEDRIVEAPP_DIRECTORY_TITLE="Sottodirectory in <code>Apps/Akeeba Backup</code>"
COM_AKEEBA_CONFIG_ONEDRIVEAPP_DIRECTORY_DESCRIPTION="La sottodirectory all'interno della cartella specifica di Akeeba Backup (<code>Apps/Akeeba Backup</code>) nel proprio Microsoft OneDrive in cui verranno caricati gli archivi di backup. Utilizzare le barre oblique (<code>/</code>), non le barre rovesciate (<code>\\<code>), e inserire sempre una barra oblique all'inizio. Corretto: <code>/some/thing</code>. Errato: <code>some\\thing</code>. Una singola barra oblique indica che gli archivi verranno memorizzati nella radice del drive. NON includere il percorso della cartella specifica dell'applicazione (<code>Apps/Akeeba Backup</code>); questo viene aggiunto automaticamente da Microsoft OneDrive!"

