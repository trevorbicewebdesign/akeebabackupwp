SOLO_USERS_HEAD_BASIC="Configurazione di base"
SOLO_USERS_HEAD_TFA="Autenticazione a due fattori"
SOLO_USERS_LBL_ABOUTTFA="L'autenticazione a due fattori (TFA) aggiunge un ulteriore livello di sicurezza durante l'accesso ad Akeeba Solo. Oltre al nome utente e alla password, sarà necessario inserire un codice segreto per effettuare il login. A differenza del nome utente e della password, questo codice segreto non è fisso: cambia nel tempo e viene generato dallo smartphone o da un dispositivo dedicato, a seconda del metodo scelto. L'abilitazione della TFA è facoltativa; Akeeba Solo funziona altrettanto bene anche senza."
SOLO_USERS_LBL_TFAENABLE="Abilita autenticazione a due fattori"
SOLO_USERS_LBL_TFAMETHOD="Metodo di autenticazione a due fattori"
SOLO_USERS_LBL_TFASECURITYCODE="Codice di sicurezza"
SOLO_USERS_TFA_GOOGLE="Google Authenticator"
SOLO_USERS_TFA_GOOGLE_INTRO="Questa funzionalità consente di utilizzare Google Authenticator, o un'applicazione compatibile, per l'autenticazione a due fattori. Oltre al nome utente e alla password, sarà necessario fornire un codice di sicurezza di sei cifre generato da Google Authenticator per poter accedere ad Akeeba Solo. Il codice di sicurezza viene rinnovato ogni 30 secondi. Questo offre una protezione aggiuntiva contro l'accesso non autorizzato al proprio account anche nel caso in cui la password venga compromessa."
SOLO_USERS_TFA_GOOGLE_LBL_STEP1="Fase 1 - Ottieni Google Authenticator"
SOLO_USERS_TFA_GOOGLE_LBL_STEP2="Fase 2 - Configurazione"
SOLO_USERS_TFA_GOOGLE_LBL_STEP3="Fase 3 - Attiva l'autenticazione a due fattori"
SOLO_USERS_TFA_GOOGLE_SETUP1="Scarica e installa Google Authenticator, o un'applicazione compatibile, sullo smartphone o sul computer. Usa una delle seguenti opzioni:"
SOLO_USERS_TFA_GOOGLE_SETUP1_WARNING="Ricorda di sincronizzare l'orologio del dispositivo con un server di riferimento temporale. La deriva dell'orologio del dispositivo potrebbe impedire l'accesso ad Akeeba Solo."
SOLO_USERS_TFA_GOOGLE_SETUP2A="Sarà necessario inserire le seguenti informazioni in Google Authenticator o in un'app compatibile."
SOLO_USERS_TFA_GOOGLE_SETUP2A_ACCOUNT="Account"
SOLO_USERS_TFA_GOOGLE_SETUP2A_KEY="Chiave"
SOLO_USERS_TFA_GOOGLE_SETUP2B="In alternativa, puoi scansionare il seguente codice QR in Google Authenticator."
SOLO_USERS_TFA_GOOGLE_SETUP3="Per verificare che tutto sia configurato correttamente, inserisci il codice di sicurezza visualizzato in Google Authenticator nel campo sottostante e fai clic sul pulsante. Se il codice è corretto, la funzionalità di autenticazione a due fattori verrà abilitata."
SOLO_USERS_TFA_NONE="Nessuna (non utilizzare l'autenticazione a due fattori)"
SOLO_USERS_TFA_OTEPS_HEAD="Codici di emergenza monouso"
SOLO_USERS_TFA_OTEPS_INTRO="Stampa una copia di questi codici e conservala in un luogo sicuro. Se perdi il dispositivo di autenticazione a due fattori, non potrai accedere ad Akeeba Solo. In tal caso, utilizza uno dei seguenti codici di emergenza monouso al posto della tua chiave segreta a due fattori per accedere ad Akeeba Solo e reimpostare l'autenticazione a due fattori. Tieni presente che si tratta di codici di emergenza monouso: una volta utilizzato un codice, non potrà essere riutilizzato. Se esaurisci i codici di emergenza, disabilita l'autenticazione a due fattori e riabilitala per generare un nuovo set di 10 codici."
SOLO_USERS_TFA_YUBIKEY="YubiKey"
SOLO_USERS_TFA_YUBIKEY_INTRO="Questa funzionalità consente di utilizzare un token hardware sicuro YubiKey per l'autenticazione a due fattori. Oltre al nome utente e alla password, sarà necessario inserire il YubiKey nella porta USB del computer, fare clic nell'area Chiave segreta della schermata di login di Akeeba Solo e toccare il pulsante dorato del YubiKey. Il codice segreto generato dal YubiKey è unico per ogni dispositivo e cambia costantemente. Questo offre una protezione aggiuntiva contro l'accesso non autorizzato al proprio account anche nel caso in cui la password venga compromessa."
SOLO_USERS_TFA_YUBIKEY_SETUP="Inserire il dispositivo YubiKey nella porta USB del computer. Fare clic sul campo Codice di sicurezza in basso. Quindi toccare il pulsante dorato del dispositivo YubiKey per un secondo. Successivamente, salvare il profilo utente. Se il codice generato dal YubiKey viene convalidato da YubiCloud, la funzionalità di autenticazione a due fattori verrà abilitata e questo YubiKey verrà collegato all'account utente."
SOLO_WIZARD_BTN_PYTHIA="Rilevamento automatico"
SOLO_WIZARD_BTN_PYTHIA_HELP="Facendo clic su questo pulsante, Akeeba Solo tenterà di rilevare automaticamente il tipo di script, il tipo di programma di installazione e le informazioni di connessione al database in basso. Si prega di verificare le impostazioni. Il rilevamento automatico potrebbe non produrre le impostazioni corrette in alcune circostanze."
SOLO_WIZARD_ERR_DIRNOTEXIST="La directory radice specificata non esiste o non è leggibile da Akeeba Solo"
SOLO_WIZARD_LBL_DBINFO_INTRO="Qui è possibile fornire le informazioni di connessione al database che contiene i dati del sito / applicazione web di cui eseguire il backup."
SOLO_WIZARD_LBL_DBINFO_TITLE="Connessione al database"
SOLO_WIZARD_LBL_INTRO="Prima di tutto è necessario indicare di cosa si vuole eseguire il backup. È possibile farlo definendo la directory radice e le informazioni di connessione al database del sito di cui eseguire il backup. Se il sito richiede più di un database per funzionare correttamente, è possibile aggiungerli al termine di questa procedura guidata, tramite la funzione Definizione di database aggiuntivi nella pagina principale dell'applicazione."
SOLO_WIZARD_LBL_SITEINFO_INTRO="Le seguenti scelte influenzano il modo in cui Akeeba Solo esegue il backup del sito e ripristina i backup. Se non si è sicuri su cosa inserire, fare clic sul pulsante Rilevamento automatico nella parte superiore della pagina per far rilevare automaticamente questi valori ad Akeeba Solo."
SOLO_WIZARD_LBL_SITEINFO_TITLE="Informazioni sul sito"
SOLO_WIZARD_LBL_SITEROOT_INTRO="La radice del sito è la directory che contiene tutti i file del sito / applicazione web di cui eseguire il backup. Deve trovarsi sullo stesso server ed essere leggibile da Akeeba Solo."
SOLO_WIZARD_LBL_SITEROOT_TITLE="Radice del sito"
SOLO_WIZARD_NO_EXTRADIRS_CORE="Il supporto per le directory esterne al webroot è disponibile solo nella versione Pro; pertanto le cartelle sopra indicate non verranno incluse nel backup"
SOLO_WIZARD_TITLE="Configurazione guidata"
SOLO_WP_USERMANAGER_ERR_CANTDELETE="Non è possibile eliminare gli utenti. Utilizzare la pagina Utenti di WordPress."
