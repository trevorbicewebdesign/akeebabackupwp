COM_AKEEBA_CPANEL_ERR_FESECRETWORD_INTRO="La <em>Chiave segreta</em> non è sicura e può essere facilmente indovinata. Per proteggere il sito, Akeeba Backup ha disabilitato l'accesso al backup front-end e remoto finché non si inserisce una chiave segreta sicura. Il problema rilevato è:"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_RESET="Impossibile modificare la chiave segreta"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_TOOSHORT="La chiave segreta è troppo corta. Utilizzare una chiave segreta di almeno 8 caratteri."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_TOOSIMPLE="La chiave segreta è troppo semplice. Provare a utilizzare lettere maiuscole e minuscole, numeri e caratteri di punteggiatura."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="In alternativa, fare clic sul pulsante in basso per reimpostare la chiave segreta al valore suggerito <code>%s</code>. In entrambi i casi, sarà necessario aggiornare i servizi di backup remoto e/o i job CRON con la nuova chiave segreta."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_JOOMLA="Fare clic su Opzioni, Front-end e inserire una chiave segreta più complessa."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_SOLO="Fare clic su Configurazione di sistema, API pubblica e inserire una chiave segreta più complessa."
COM_AKEEBA_CPANEL_ERR_INVALIDDOWNLOADID="Formato del Download ID non valido. Seguire le istruzioni per ottenere il proprio Download ID. Non inserire in questo campo il nome utente, l'indirizzo e-mail o la password."
COM_AKEEBA_CPANEL_ERR_MBSTRING_SOLO="<strong>La versione di PHP in uso non ha l'estensione mbstring installata o attivata</strong>. La sua abilitazione è un requisito di Akeeba Solo. Akeeba Solo potrebbe non funzionare correttamente. Chiedere al proprio hosting provider di abilitare l'estensione mbstring su PHP %s in esecuzione sul server."
COM_AKEEBA_CPANEL_ERR_MBSTRING_WORDPRESS="<strong>La versione di PHP in uso non ha l'estensione mbstring installata o attivata</strong>. La sua abilitazione è un requisito di WordPress. WordPress e Akeeba Backup potrebbero non funzionare correttamente. Chiedere al proprio hosting provider di abilitare l'estensione mbstring su PHP %s in esecuzione sul server."
