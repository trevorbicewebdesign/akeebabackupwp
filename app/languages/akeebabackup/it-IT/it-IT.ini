COM_AKEEBA_CPANEL_LBL_INCLUDEEXCLUDE_CALLOUT="Le opzioni di inclusione ed esclusione vengono applicate solo al profilo di backup attivo."
COM_AKEEBA_CPANEL_LBL_OUTDIR_CLICKTHEBUTTON="Fare clic sul pulsante in basso per risolvere il problema. Ecco cosa fa."
COM_AKEEBA_CPANEL_LBL_OUTDIR_DELETEORBEHACKED="Fino a quando non si provvede, <strong>SI RACCOMANDA VIVAMENTE</strong> di non eseguire un backup del sito e, nel caso in cui siano già stati eseguiti, di eliminare tutti gli archivi di backup e i file di registro. <strong>IL MANCATO RISPETTO DI QUESTE ISTRUZIONI POTREBBE COMPROMETTERE (HACKERARE) IL SITO.</strong>"
COM_AKEEBA_CPANEL_LBL_OUTDIR_FILEREADABLE="Akeeba Backup ha rilevato che la directory di output dei backup <code>%s</code> si trova nella web root del sito. Il suo contenuto, compresi gli archivi di backup, è accessibile via web. Tuttavia, NON è possibile elencare i file nella directory tramite un browser web. <strong>Ciò può costituire un problema di sicurezza</strong>. Un malintenzionato potrebbe indovinare il nome dell'archivio di backup e scaricarlo direttamente, aggirando la sicurezza del sito."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_RANDOM="Il «Nome del file di output del backup» verrà modificato per includere la variabile <code>[RANDOM]</code>. Ciò rende praticamente impossibile indovinare i nomi dei file di backup, aggiungendo 16 lettere e/o numeri casuali diversi nel nome del file di archivio ad ogni backup eseguito."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_SECURITYFILES="Nella cartella verranno scritti un file <code>.htaccess</code> e un file <code>web.config</code>. Sulla maggior parte dei server ciò è sufficiente a impedire il download diretto via web di qualsiasi file al suo interno e a disabilitare l'elenco dei file. È disponibile anche una soluzione per i server in cui questi file speciali non hanno effetto. Nella cartella verranno scritti anche altri tre file denominati <code>index.php</code>, <code>index.html</code> e <code>index.htm</code>. Questi file di indice impediscono al server web di elencare i nomi degli archivi di backup e dei file di registro."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM="Inoltre, la directory di output coincide con una cartella utilizzata dal sito per contenere file di sistema o di software di terze parti accessibili pubblicamente, oppure è una sua sottodirectory."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM_FIX="È necessario accedere alla pagina Configurazione di Akeeba Backup e selezionare una directory di output diversa."
COM_AKEEBA_CPANEL_LBL_OUTDIR_LISTABLE="Akeeba Backup ha rilevato che la directory di output dei backup <code>%s</code> si trova nella web root del sito. Il suo contenuto, compresi gli archivi di backup, è accessibile via web. Inoltre, è possibile elencare i file nella directory, ovvero mostra un elenco degli archivi di backup quando vi si accede tramite un browser web. <strong>Si tratta di un grave problema di sicurezza</strong>. Un malintenzionato può accedere a questa cartella da un browser web e scaricare direttamente gli archivi di backup, aggirando la sicurezza del sito."
COM_AKEEBA_CPANEL_LBL_OUTDIR_TRASHHOST="Purtroppo, il server non supporta alcun metodo ragionevole per mettere in sicurezza la directory. Indipendentemente da ciò che si fa, continuerà a elencare i nomi dei file che contiene e a consentirne il download da un browser. L'unica opzione disponibile è creare una directory di output dei backup al di sopra della root del sito."
