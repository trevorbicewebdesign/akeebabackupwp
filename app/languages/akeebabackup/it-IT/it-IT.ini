COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_CORE="<p>È possibile ripristinare i backup su qualsiasi server, anche diverso da quello su cui è stato eseguito il backup. Seguire il nostro <a href=\"%s\" target=\"_blank\">tutorial video</a>. Sarà necessario <a href=\"%3$s\" target=\"_blank\">scaricare Akeeba Kickstart Core (gratuitamente)</a> per estrarre gli archivi di backup, come indicato nel tutorial.</p>"
COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_CORE_INFO_ABOUT_PRO="<strong>Può <em>essere</em> più semplice di così.</strong>È possibile ripristinare gli archivi di backup sullo stesso server o su uno diverso tramite l'interfaccia di Akeeba Backup, senza necessità di trasferire i file manualmente. Scopri queste e molte altre funzionalità disponibili esclusivamente in <a href=\"%s\">Akeeba Backup Professional</a>!"
COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_PRO="<p>È semplice! Selezionare la casella accanto a una voce di backup. Quindi fare clic sul pulsante <em>Ripristino</em> nella barra degli strumenti.</p><p>Se si desidera ripristinare su un nuovo server pubblico, è possibile utilizzare la <a href=\"%2$s\">Procedura guidata di trasferimento sito</a>. Se si preferisce procedere manualmente o ripristinare sul proprio computer o su una Intranet, guardare il <a href=\"%1$s\" target=\"_blank\">tutorial video</a> e <a href=\"%3$s\" target=\"_blank\">scaricare Akeeba Kickstart Core (gratuitamente)</a> per estrarre gli archivi di backup.</p>"
