SOLO_NOTYETRESTORED_STILLSEETHIS_LBL_P1="Utilizzare FTP o il gestore file del pannello di controllo del sito per rimuovere la cartella <code>installation</code> dal sito. In questo modo la pagina non verrà più visualizzata e sarà possibile accedere nuovamente al sito."
SOLO_NOTYETRESTORED_STILLSEETHIS_LBL_P2="Se si è appena eseguita questa operazione e la cartella «installation» non esiste nella cartella radice del sito (dove si trova il file wp-config.php), è probabile che sia presente un CDN o una cache davanti al sito. Contattare il proprio host e chiedere le istruzioni corrette per svuotare o reimpostare questo tipo di cache in modo da visualizzare il sito al posto di questa pagina."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P1="Un plugin installato sul sito ha rilevato la presenza di una cartella denominata <code>installation</code> nella cartella radice del sito e che questa cartella di installazione contiene una copia dello script di ripristino del backup ANGIE."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P2="Ciò significa che è stato estratto, ma non completato, il ripristino di un backup del sito. Il sito non funzionerà correttamente ancora."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P3="È necessario completare il ripristino eseguendo lo script di ripristino situato nella cartella «installation» del sito. Se non si è sicuri di come procedere, fare clic sul pulsante in basso."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P4="Al termine del ripristino del sito, rimuovere la cartella «installation» del sito. Nella maggior parte dei casi, lo script di ripristino chiederà di eseguire questa operazione automaticamente. Se viene segnalato un errore durante il tentativo, leggere il resto di questa pagina."
