COM_AKEEBA_CRONS_LBL_CRON_EXPRESSION_TIP="Indica a WP-CRON quando e con quale frequenza eseguire un backup. Le <a href=\"https://en.wikipedia.org/wiki/Cron#Cron_expression\" target=\"_blank\">espressioni CRON</a> sono una preimpostazione (ad es. <code>@daily</code>) oppure cinque campi separati da spazi nel seguente ordine: <code>minuto ora giorno mese giornodellaSettimana</code>. Consultare esempi e testare le espressioni CRON con lo strumento di terze parti <a href=\"https://crontab.guru\" target=\"_blank\">Crontab Guru</a>. Per ulteriori dettagli consultare la documentazione."
