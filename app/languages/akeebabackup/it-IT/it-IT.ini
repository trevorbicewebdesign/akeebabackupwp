SOLO_MANAGE_LBL_HOWDOIRESTORE_CORE="Gli utenti della versione gratuita (Core) possono ripristinare i propri backup solo manualmente utilizzando Akeeba Kickstart o Akeeba eXtract Wizard. Per ulteriori informazioni, <a href='%s'>consultare la documentazione</a>. Sottoscrivere un abbonamento alla versione Professional per accedere alla funzionalità di ripristino integrato, molto più semplice da utilizzare!"
SOLO_MANAGE_LBL_HOWDOIRESTORE_PRO="È possibile selezionare un backup dall'elenco sottostante e fare clic sul pulsante Ripristina. Per il ripristino su un server diverso o per ulteriori dettagli sulla procedura di ripristino, <a href='%s'>consultare la documentazione</a>."
