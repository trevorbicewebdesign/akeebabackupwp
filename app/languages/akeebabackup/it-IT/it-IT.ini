SOLO_RESTORE_ERR_NOSITEROOT="Nessuna radice del sito è definita. Impossibile ripristinare l'archivio di backup senza che essa sia definita."
SOLO_RESTORE_LABEL_SUCCESS_INFO="È ora necessario eseguire lo script di ripristino che ripristinerà il contenuto del database ed eseguirà altre operazioni di manutenzione. A tale scopo, visitare l'URL <code>http://www.example.com/installation/index.php</code> dove http://www.example.com è l'URL del sito su cui si sta eseguendo il ripristino. <strong>IMPORTANTE! Non chiudere la finestra in cui appare questo messaggio!</strong>. Al termine dello script di ripristino, chiudere la relativa finestra e tornare qui. Quindi fare clic sul pulsante Finalizza ripristino in basso per rimuovere la directory <tt>installation</tt>. Successivamente sarà possibile iniziare a utilizzare il sito ripristinato."
SOLO_RESTORE_LABEL_SUCCESS_INFO_HASURL="È ora necessario eseguire lo script di ripristino che ripristinerà il contenuto del database ed eseguirà altre operazioni di manutenzione. A tale scopo, visitare l'URL <code>%s/installation/index.php</code> dove %s è l'URL del sito su cui si sta eseguendo il ripristino. È possibile visitare questo URL facendo clic sul pulsante Esegui script di ripristino in basso. <strong>IMPORTANTE! Non chiudere la finestra in cui appare questo messaggio!</strong>. Al termine dello script di ripristino, chiudere la relativa finestra e tornare qui. Quindi fare clic sul pulsante Finalizza ripristino in basso per rimuovere la directory <tt>installation</tt>. Successivamente sarà possibile iniziare a utilizzare il sito ripristinato."
