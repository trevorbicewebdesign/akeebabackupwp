COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_PARTS="Il backup è composto da %d file parte. È <em>necessario</em> scaricarli tutti e inserirli nella stessa directory affinché l'estrazione dell'archivio e il ripristino del backup abbiano successo."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE="Il download tramite browser può danneggiare i file"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE_NODOWNLOAD="Il download dei backup tramite browser è disabilitato per impostazione predefinita"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE_NODOWNLOAD_PHPERRORDISPLAY="Il download dei backup tramite browser è disabilitato automaticamente"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING="Si consiglia di chiudere questa finestra di dialogo e di usare FTP in modalità di trasferimento <code>Binary</code> o SFTP per scaricare gli archivi di backup."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD="<strong>Le impostazioni attuali del server potrebbero produrre un file danneggiato (o non funzionante) durante il download tramite browser.</strong> Il download degli archivi di backup tramite browser è disabilitato per impostazione predefinita, poiché è probabile che un altro plugin o PHP aggiunga dati inattesi all'inizio o alla fine dell'archivio di backup. Ciò danneggerebbe (romperebbe) gli archivi di backup scaricati tramite browser, rendendoli impossibili da ripristinare."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_ALTERNATIVE="È possibile chiudere questa finestra di dialogo e usare FTP in modalità di trasferimento <code>Binary</code> o SFTP per scaricare gli archivi di backup dal server."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART="L'archivio di backup è composto da %u file con il nome file <code>%s</code> e le estensioni <code>%s</code> nonché da <code>%s</code> a <code>%s</code>. <strong>IMPORTANTE!</strong> È necessario scaricare <em>tutti questi</em> file. Durante il ripristino del sito, caricare anche tutti questi file insieme a <code>kickstart.php</code>. Se non lo si fa, l'archivio di backup non potrà essere ripristinato."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_1="Il file da scaricare si chiama <code>%s</code>"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_2="L'archivio di backup è composto da due file con il nome file <code>%s</code> e le estensioni <code>%s</code> e <code>%s</code>. <strong>IMPORTANTE!</strong> È necessario scaricare <em>entrambi</em> i file. Durante il ripristino del sito, caricare entrambi i file insieme a <code>kickstart.php</code>. Se non lo si fa, l'archivio di backup non potrà essere ripristinato."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_AKEEBADEBUG="È possibile riabilitare i download tramite browser modificando il file <code>%s/defines.php</code> e commentando la riga <code>define('AKEEBADEBUG', 1);</code>."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_ENABLED="<strong>Le impostazioni attuali del server potrebbero produrre un file danneggiato (o non funzionante) durante il download tramite browser.</strong> Il download degli archivi di backup tramite browser è stato disabilitato automaticamente perché il server è configurato per inviare avvisi, messaggi di attenzione ed errori PHP al browser. Ciò causerebbe il <em>danneggiamento</em> (rottura) dell'archivio scaricato, rendendolo impossibile da ripristinare. Si prega di chiudere questa finestra di dialogo e di usare FTP in modalità di trasferimento <code>Binary</code> o SFTP per scaricare gli archivi di backup dal server."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_UNKNOWN="<strong>Le impostazioni attuali del server potrebbero produrre un file danneggiato (o non funzionante) durante il download tramite browser.</strong> Il download degli archivi di backup tramite browser è stato disabilitato automaticamente perché non è possibile determinare se il server sia configurato per inviare avvisi, messaggi di attenzione ed errori PHP al browser. Quando PHP invia avvisi, messaggi di attenzione ed errori al browser, l'archivio scaricato diventa <em>danneggiato</em> (rotto) e impossibile da ripristinare. Si prega di chiudere questa finestra di dialogo e di usare FTP in modalità di trasferimento <code>Binary</code> o SFTP per scaricare gli archivi di backup dal server."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_WPDEBUG="È possibile riabilitare i download tramite browser modificando il file <code>wp-config.php</code> e impostando la costante <code>WP_DEBUG</code> su <code>false</code>."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_REENABLE="È possibile abilitare i download tramite browser <em>a proprio rischio</em> nella pagina Configurazione di sistema di Akeeba Backup."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_WORDPRESS="<strong>L'utente ha abilitato manualmente il download dei backup tramite browser <em>a proprio rischio</em>.</strong> Plugin di terze parti e impostazioni del server possono causare che il file scaricato sia troncato (incompleto) o danneggiato (rotto). Scegliendo di scaricare gli archivi di backup tramite browser nonostante i nostri avvisi, <strong>l'utente accetta personalmente la piena responsabilità e gli oneri derivanti dalle proprie azioni</strong> e riconosce che Akeeba Ltd non è responsabile in alcun modo e non fornirà alcun supporto nel caso in cui l'archivio di backup non possa essere estratto o ripristinato."
COM_AKEEBA_BUADMIN_LBL_LOGFILEID="ID file di registro"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD="Scarica"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD_CONFIRM="Il download degli archivi di backup tramite browser è soggetto\na errori, danneggiamenti e troncamenti del file per ragioni\noggettivamente al di fuori del nostro controllo (configurazione del server, configurazione del sito,\nplugin di terze parti e configurazione del browser).\n\nSi consiglia VIVAMENTE di scaricare gli archivi\ndi backup esclusivamente tramite FTP in modalità di trasferimento Binary\n(non usare Auto o ASCII: danneggerebbero gli archivi\ndi backup) usando software client come FileZilla,\n CyberDuck, WinSCP o simili; oppure tramite la\nfunzionalità di gestione file del pannello di controllo del proprio hosting.\n\nProcedendo con il download, l'utente acconsente esplicitamente\na rinunciare al diritto di assistenza per qualsiasi problema di download,\nestrazione o ripristino dell'archivio di backup e riconosce\nche tali richieste non riceveranno risposta.\n\nSi è sicuri di voler continuare?"
