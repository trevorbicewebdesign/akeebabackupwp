COM_AKEEBA_INCLUDEFOLDER_LABEL_DIRECTORY_HELP="La directory sul server che verrà inclusa nel backup. Questa funzionalità è destinata esclusivamente alle directory situate al di fuori della radice del sito. Le directory all'interno della radice del sito vengono sempre incluse automaticamente nel backup, a meno che non vengano escluse tramite la funzione Esclusione di file e directory."
