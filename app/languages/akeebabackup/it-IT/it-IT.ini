COM_AKEEBA_CONFIG_SWIFT_PASSWORD_TITLE="Password OpenStack"
COM_AKEEBA_CONFIG_SWIFT_TENANTID_DESCRIPTION="Il tuo tenant ID OpenStack (Keystone v2) o project ID (Keystone v3), ad es. a0b1c2d3e4f56789abcdef0123456789"
COM_AKEEBA_CONFIG_SWIFT_TENANTID_TITLE="Tenant ID / Project ID"
COM_AKEEBA_CONFIG_SWIFT_USERNAME_DESCRIPTION="Il nome utente API OpenStack per il tuo cloud."
COM_AKEEBA_CONFIG_SWIFT_USERNAME_TITLE="Nome utente OpenStack"
COM_AKEEBA_CONFIG_UI_AJAXERRORDLG_TEXT="Si è verificato un errore durante l'attesa di una risposta AJAX:"
COM_AKEEBA_CONFIG_UI_AJAXERRORDLG_TITLE="Errore AJAX"
COM_AKEEBA_CONFIG_UI_BROWSE="Sfoglia…"
COM_AKEEBA_CONFIG_UI_BROWSER_TITLE="Browser directory"
COM_AKEEBA_CONFIG_UI_CONFIG="Configura…"
COM_AKEEBA_CONFIG_UI_FTPBROWSER_TITLE="Browser directory FTP"
COM_AKEEBA_CONFIG_UI_REFRESH="Aggiorna"
COM_AKEEBA_CONFIG_UI_ROOTDIR="L'utilizzo della radice del sito come directory di output del backup o come archivio temporaneo causerà un errore nel backup. L'impostazione è stata sovrascritta."
COM_AKEEBA_CONFIG_UI_SETTINGS_NOTSECURED="Il server non supporta la cifratura delle impostazioni di configurazione. Si consiglia vivamente di non archiviare password nella configurazione."
COM_AKEEBA_CONFIG_UI_SETTINGS_SECURED="Le impostazioni sono protette da cifratura a 128 bit. È possibile archiviare le password nella configurazione in tutta sicurezza."
COM_AKEEBA_CONFIG_UI_SFTPBROWSER_TITLE="Browser directory SFTP"
COM_AKEEBA_CONFIG_UPLOADKICKSTART_DESCRIPTION="Se selezionato, una copia di Akeeba Kickstart Professional verrà caricata nell'archivio remoto specificato nel Motore di Post-elaborazione sopra (ad eccezione dei motori Nessuno ed E-mail). Questa opzione è utile quando si utilizza FTP o SFTP per trasferire il sito su un server diverso: sia l'archivio di backup che Kickstart, utilizzato per estrarlo, verranno caricati sul server remoto. Al termine del backup sarà sufficiente avviare Kickstart sul sito remoto e procedere con il ripristino. Così semplice!"
COM_AKEEBA_CONFIG_UPLOADKICKSTART_TITLE="Carica Kickstart nell'archivio remoto"
COM_AKEEBA_CONFIG_USAGESTATS_SOLO_DESC="Aiutaci a migliorare il software segnalando in modo anonimo e automatico le versioni di PHP e MySQL in uso. Queste informazioni ci aiuteranno a decidere quali versioni di PHP e MySQL supportare nelle versioni future. Nota: NON raccogliamo il nome del sito, l'indirizzo IP o qualsiasi altra informazione di identificazione diretta o indiretta."
COM_AKEEBA_CONFIG_USAGESTATS_SOLO_LABEL="Abilita la segnalazione anonima delle versioni di PHP e MySQL"
COM_AKEEBA_CONFIG_ACCURATE_PHP_CLI_LABEL="Percorso PHP-CLI accurato"
COM_AKEEBA_CONFIG_ACCURATE_PHP_CLI_DESC="Abilita questa opzione per fare in modo che Akeeba Solo tenti di rilevare il percorso PHP-CLI accurato sul server. Disabilita se il server non lo consente, bloccando il tuo indirizzo IP per diversi minuti o ore quando ciò accade (ad esempio IONOS)."
COM_AKEEBA_CONFIG_VIRTUALFOLDER_DESCRIPTION="Se hai configurato delle directory esterne al sito, i loro contenuti appariranno nell'archivio come sottodirectory di questa directory virtuale. È virtuale perché non esiste fisicamente sul server: esiste solo all'interno dell'archivio di backup. Assicurati che il nome della directory virtuale non coincida con una directory esistente per evitare la perdita di dati."
COM_AKEEBA_CONFIG_VIRTUALFOLDER_TITLE="Directory virtuale per i file esterni al sito"
COM_AKEEBA_CONFIG_WEBDAV_DIRECTORY_DESCRIPTION="Directory"
COM_AKEEBA_CONFIG_WEBDAV_DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFIG_WEBDAV_PASSWORD_DESCRIPTION="Password"
COM_AKEEBA_CONFIG_WEBDAV_PASSWORD_TITLE="Password"
COM_AKEEBA_CONFIG_WEBDAV_URL_DESCRIPTION="URL base WebDAV"
COM_AKEEBA_CONFIG_WEBDAV_URL_TITLE="URL base WebDAV"
COM_AKEEBA_CONFIG_WEBDAV_USERNAME_DESCRIPTION="Nome utente"
COM_AKEEBA_CONFIG_WEBDAV_USERNAME_TITLE="Nome utente"
COM_AKEEBA_CONFIG_WHERE_ARE_THE_FILTERS="Se stai cercando i filtri &ndash;ad es. per escludere file, directory e tabelle del database&ndash; fai clic sul pulsante Annulla per tornare alla pagina del Pannello di controllo, da cui puoi accedere direttamente a queste funzionalità."
COM_AKEEBA_CONFIG_ZIPCDGLUECHUNKSIZE_DESCRIPTION="I file ZIP sono composti da una sezione dati e una sezione «directory». Queste sezioni vengono elaborate in parallelo da Akeeba Backup e unite durante la fase di finalizzazione dell'archivio. Questo parametro determina quanti dati verranno elaborati contemporaneamente durante questa fase. Non dovrebbe essere necessario modificare questa impostazione a meno che non si riscontrino gravi problemi di esaurimento della memoria."
COM_AKEEBA_CONFIG_ZIPCDGLUECHUNKSIZE_TITLE="Dimensione blocco per l'elaborazione della directory centrale"
COM_AKEEBA_CONFIG__BACKBLAZE_DIRECTORY_TITLE="Directory"
COM_AKEEBA_CONFWIZ="Configurazione guidata"
COM_AKEEBA_CONFWIZ_CONGRATS="Congratulazioni! Hai completato la procedura guidata di configurazione automatica. Ora puoi testare la nuova configurazione eseguendo un backup, oppure perfezionarla nella pagina Configurazione."
COM_AKEEBA_CONFWIZ_DBOPT="Ottimizzazione delle impostazioni del motore di dump del database"
COM_AKEEBA_CONFWIZ_DIRECTORY="Analisi della directory di output"
COM_AKEEBA_CONFWIZ_HEADER_FAILED="Errore della configurazione guidata"
COM_AKEEBA_CONFWIZ_HEADER_FINISHED="Benchmarking completato"
COM_AKEEBA_CONFWIZ_INTROTEXT="La Configurazione guidata esegue una serie di benchmark sul server per determinare le impostazioni di backup ottimali per il sito. Non navigare altrove durante questa operazione. È normale che la pagina sembri bloccata per periodi fino a tre (3) minuti, a seconda della velocità del server."
COM_AKEEBA_CONFWIZ_MAXEXEC="Ottimizzazione del tempo massimo di esecuzione"
COM_AKEEBA_CONFWIZ_MINEXEC="Ottimizzazione del tempo minimo di esecuzione"
COM_AKEEBA_CONFWIZ_PROGRESS="Benchmarking in corso"
COM_AKEEBA_CONFWIZ_SPLITSIZE="Determinazione della dimensione parte richiesta per gli archivi suddivisi"
COM_AKEEBA_CONFWIZ_UI_CANTDBOPT="Akeeba Backup non è riuscito a determinare le impostazioni ottimali per il dump del database. Assicurati che il server utilizzi MySQL 5.0 o versione successiva e che l'utente del database sia autorizzato a eseguire il comando SHOW TABLE STATUS prima di avviare nuovamente questa procedura guidata."
COM_AKEEBA_CONFWIZ_UI_CANTDETERMINEMINEXEC="Impossibile determinare il tempo minimo di esecuzione. Ciò indica un grave problema di comunicazione con il server. Prova a configurare Akeeba Backup manualmente."
COM_AKEEBA_CONFWIZ_UI_CANTDETERMINEPARTSIZE="Akeeba Backup non è riuscito a determinare una dimensione parte adatta al server. Assicurati di avere spazio libero sufficiente nel tuo account e avvia nuovamente questa procedura guidata."
COM_AKEEBA_CONFWIZ_UI_CANTFIXDIRECTORIES="Akeeba Backup non ha trovato una directory di output scrivibile. Concedi i permessi di scrittura alla directory dei backup all'interno della cartella dell'applicazione e avvia nuovamente questa procedura guidata."
COM_AKEEBA_CONFWIZ_UI_CANTSAVEMAXEXEC="Akeeba Backup non è riuscito a salvare le preferenze del tempo massimo di esecuzione. Sarà necessario configurarlo manualmente."
COM_AKEEBA_CONFWIZ_UI_CANTSAVEMINEXEC="Impossibile salvare la preferenza del tempo minimo di esecuzione. Sarà necessario configurare Akeeba Backup manualmente."
COM_AKEEBA_CONFWIZ_UI_EXECTOOLOW="Akeeba Backup ha rilevato che il server richiede un tempo massimo di esecuzione troppo basso per essere pratico. Sarebbe opportuno cambiare provider di hosting o chiedere al provider di aumentare il tempo massimo di esecuzione di PHP e rimuovere le limitazioni sull'utilizzo della CPU dal proprio account."
COM_AKEEBA_CONFWIZ_UI_MINEXECTRY="Tentativo con %s secondi"
