COM_AKEEBA_MIGREIGHT_TITLE="Migrazione del backup"
COM_AKEEBA_MIGREIGHT_GO_BACK_PROMPT="È possibile tornare in sicurezza alla pagina iniziale (pannello di controllo) di Akeeba Backup."
COM_AKEEBA_MIGREIGHT_NOT_NEEDED_TITLE="Migrazione non necessaria (è una buona cosa!)"
COM_AKEEBA_MIGREIGHT_NOT_NEEDED_INFO="I profili di backup e gli archivi di backup risultano essere al di fuori della cartella del plugin. Ottimo! È possibile aggiornare Akeeba Backup in sicurezza, senza rischiare di perdere gli archivi di backup."
COM_AKEEBA_MIGREIGHT_NEEDED_TITLE="Migrazione necessaria"
COM_AKEEBA_MIGREIGHT_NEEDED_WHY="WordPress elimina sempre la cartella del plugin ogni volta che viene aggiornato. Di conseguenza, gli archivi di backup memorizzati nella cartella del plugin andranno <em>persi per sempre</em>. Sarebbe come non aver mai eseguito alcun backup."
COM_AKEEBA_MIGREIGHT_NEEDED_WHAT="Akeeba Backup rileva questo problema e consente di modificare automaticamente la directory di output del backup in modo che si trovi sotto <code>%s</code>, nonché di spostare gli archivi di backup esistenti nella stessa cartella."
