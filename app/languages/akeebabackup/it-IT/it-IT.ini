COM_AKEEBA_ALICE_ERR_ANALYZEFAILED_HEADER="Analisi del registro non riuscita"
COM_AKEEBA_ALICE_ERR_ANALYZEFAILED_INFO="L'analisi del registro è stata interrotta. L'analizzatore del registro ha segnalato il seguente errore:"
COM_AKEEBA_ALICE_ERR_CANNOT_OPEN_LOGFILE="Analisi del file di registro non riuscita: impossibile aprire il file di registro %s in lettura."
COM_AKEEBA_ALICE_ERR_NOLOGS="Non sono stati trovati file di registro per i backup <strong>non riusciti</strong>."
COM_AKEEBA_ALICE_HEAD_ONLYFAILED="ALICE funziona solo con i backup <em>non riusciti</em>"
COM_AKEEBA_ALICE_LBL_ONLYFAILED_IFNOFAILED="Se il backup non è riuscito ma non compare in questa pagina, attendere <em>tre (3) minuti</em>, tornare alla pagina del Pannello di controllo di Akeeba Backup e quindi tornare qui. Il motivo è il seguente: in alcuni casi l'errore del backup è causato da un errore del server. In questi casi il backup viene contrassegnato come ancora in corso anziché come non riuscito, poiché PHP smette di essere eseguito e pertanto il codice PHP che dovrebbe contrassegnare il backup come non riuscito non ha la possibilità di essere eseguito. Quando si visita la pagina del Pannello di controllo, qualsiasi backup contrassegnato come ancora in corso da più di 3 minuti viene contrassegnato come non riuscito. Da qui la necessità di attendere e <em>poi</em> tornare alla pagina del Pannello di controllo."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_SHOWINGLOGS="ALICE è uno strumento per analizzare i file di registro dei backup <em>non riusciti</em> e — nella maggior parte dei casi — fornire la causa più probabile dell'errore di backup. Non è concepito per analizzare i file di registro dei backup riusciti. In tal caso verrebbero restituiti risultati privi di senso, fuorvianti o del tutto errati. Per questo motivo verranno mostrati solo i file di registro dei backup <em>non riusciti</em>."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_WHATISFAILED="Ricordare che i backup che non hanno completato il caricamento dell'archivio di backup nell'archiviazione remota non sono considerati non riusciti. La causa principale di questi problemi non può essere rilevata da ALICE. In caso di questo tipo di problema, aprire un ticket di supporto nella sezione Supporto del nostro sito. Se Akeeba Backup Professional è stato installato da un'altra persona sul sito, contattare direttamente tale persona; in questo caso non sarà possibile aprire un ticket di supporto sul nostro sito."
