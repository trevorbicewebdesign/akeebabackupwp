COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_HEAD="La configurazione predefinita del sistema CRON di WordPress potrebbe causare problemi con i backup pianificati"
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P1="Come indicato nella <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">documentazione di WordPress</a>, le attività critiche — come i backup — pianificate con WP-CRON nella configurazione predefinita di WordPress (esecuzione delle attività pianificate valutata solo quando il sito viene visitato) potrebbero non essere eseguite al momento corretto o non essere eseguite affatto. A causa di questo problema strutturale che WordPress stessa riconosce apertamente, i backup pianificati con WP-CRON in questa configurazione potrebbero non avviarsi al momento corretto (o non avviarsi affatto), richiedere molto più tempo del previsto, risultare incoerenti o corrotti, sovrapporsi o avviarsi senza completarsi. Consultare la documentazione per informazioni dettagliate."
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P2="Si raccomanda <strong>vivamente</strong> di seguire le indicazioni della <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">documentazione ufficiale di WordPress</a> per disabilitare l'esecuzione predefinita delle attività in base all'attività del sito, utilizzando l'Utilità di pianificazione di Windows o il demone CRON di macOS/Linux per pianificare l'esecuzione dell'helper CRON di WordPress (<code>wp-cron.php</code>) ogni minuto. Questa configurazione supera il problema strutturale della configurazione predefinita di WordPress per WP-CRON e rende i backup pianificati affidabili quanto i backup manuali eseguiti dal backend o i backup pianificati con i metodi di backup front-end o API JSON."
