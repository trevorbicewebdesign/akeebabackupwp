SOLO_MAIN_LBL_NEEDSUPGRADE="<strong>L'inserimento del Download ID non è sufficiente per abilitare le funzionalità avanzate di Akeeba Solo Professional</strong>. Sarà necessario scaricare e installare il pacchetto Akeeba Solo Professional sul proprio sito, sopra Akeeba Solo Core, senza disinstallare la versione Core."
