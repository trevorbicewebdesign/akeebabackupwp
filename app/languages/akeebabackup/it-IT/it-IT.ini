SOLO_SETUP_LBL_DATABASE_DBENCRYPTION="Connetti con un certificato SSL"
SOLO_SETUP_LBL_DATABASE_DBENCRYPTION_HELP="Connettere al database utilizzando un certificato SSL? Può essere utilizzato in sostituzione dell'autenticazione con nome utente e password (connessione cifrata con autenticazione tramite certificato) oppure <em>in aggiunta a</em> nome utente e password (connessione cifrata con autenticazione tramite password). Se non si sa cosa significhi, impostare questa opzione su No e ignorare anche le opzioni successive."
SOLO_SETUP_LBL_DATABASE_DBSSLCA="File dell'Autorità di certificazione (CA)"
SOLO_SETUP_LBL_DATABASE_DBSSLCA_HELP="Percorso assoluto del file PEM del certificato dell'Autorità di certificazione (CA) del server database, ad es. <code>/home/myuser/ca.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT="File della chiave pubblica (certificato) dell'utente del database"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT_HELP="Percorso assoluto del file PEM della chiave pubblica (certificato) dell'utente del database, ad es. <code>/home/myuser/myuser.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER="Metodi di cifratura SSL/TLS"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER_HELP="Inserire un elenco di metodi di cifratura per la connessione con certificati SSL, separati da due punti. Se lasciato vuoto, verrà utilizzato l'elenco predefinito (<code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>) (consigliato)."
SOLO_SETUP_LBL_DATABASE_DBSSLKEY="File della chiave privata dell'utente del database"
SOLO_SETUP_LBL_DATABASE_DBSSLKEY_HELP="Percorso assoluto del file PEM della chiave privata dell'utente del database, ad es. <code>/home/myuser/myuser-key.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT="Verifica certificato del server"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT_HELP="Impostare su Sì per verificare il certificato che il server ci invia. La verifica viene effettuata rispetto al file dell'Autorità di Certificazione (CA) specificato. In caso di errori di connessione impostare su No; alcune configurazioni (in particolare quelle generate da <code>mysql_ssl_rsa_setup</code>) potrebbero rifiutare la connessione se la verifica del certificato è abilitata. Se si abilita la verifica e il campo del file CA è lasciato vuoto, il certificato del server verrà controllato rispetto ai file delle Autorità di Certificazione noti al server, vedere le opzioni PHP <code>openssl.cafile</code> e <code>openssl.capath</code>."
SOLO_SETUP_LBL_DATABASE_DRIVER="Tipo di database"
SOLO_SETUP_LBL_DATABASE_DRIVER_HELP="Di solito si tratta di MySQLi (<em>con</em> la \"i\" finale)"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQL="MySQL (driver obsoleto per MySQL - evitare l'uso)"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQLI="MySQLi (driver preferito per MySQL)"
SOLO_SETUP_LBL_DATABASE_DRIVER_NONE="Nessuno"
SOLO_SETUP_LBL_DATABASE_DRIVER_PDO="PDO"
SOLO_SETUP_LBL_DATABASE_DRIVER_PDOMYSQL="MySQL (PDO)"
SOLO_SETUP_LBL_DATABASE_DRIVER_SQLAZURE="Windows Azure SQL Database"
SOLO_SETUP_LBL_DATABASE_DRIVER_SQLITE="SQLite"
SOLO_SETUP_LBL_DATABASE_HOST="Nome host del server database"
SOLO_SETUP_LBL_DATABASE_HOST_HELP="Il nome host o l'indirizzo IP del server database (di solito: localhost). Si noti che localhost e 127.0.0.1 sono <em>molto</em> diversi per MySQL; potrebbe essere necessario provarli entrambi per vedere quale funziona con il proprio server database. Se il server utilizza una porta non standard, aggiungerla dopo il nome host preceduta da due punti, ad esempio 127.0.0.1:1234 per usare un server database su 127.0.0.1 in ascolto sulla porta 1234."
SOLO_SETUP_LBL_DATABASE_INFO="Akeeba Solo richiede un database per memorizzare le impostazioni di configurazione e un registro di tutti i tentativi di backup. Fornire i parametri di connessione al database qui di seguito. È possibile utilizzare lo stesso database del sito di cui si vuole eseguire il backup oppure un database dedicato esclusivamente ad Akeeba Solo (consigliato)."
SOLO_SETUP_LBL_DATABASE_NAME="Nome del database"
SOLO_SETUP_LBL_DATABASE_NAME_HELP="Il nome del proprio database. La maggior parte degli host che utilizzano cPanel, Plesk e altri pannelli di hosting principali assegna nomi di database come abcdef_nomeutente, dove abcdef è il nome utente del pannello di controllo hosting. In caso di dubbi, contattare il proprio host."
SOLO_SETUP_LBL_DATABASE_PASS="Password"
SOLO_SETUP_LBL_DATABASE_PASS_HELP="La password utilizzata per connettersi al proprio database."
SOLO_SETUP_LBL_DATABASE_PREFIX="Prefisso del nome delle tabelle del database"
SOLO_SETUP_LBL_DATABASE_PREFIX_HELP="Il prefisso comune per i nomi di tutte le tabelle del database appartenenti a questa installazione di Akeeba Solo. È possibile modificarlo se si hanno più installazioni di Akeeba Solo che condividono lo stesso database."
SOLO_SETUP_LBL_DATABASE_USER="Nome utente"
SOLO_SETUP_LBL_DATABASE_USER_HELP="Il nome utente utilizzato per connettersi al proprio database. La maggior parte degli host che utilizzano cPanel, Plesk e altri pannelli di hosting principali assegna nomi utente come abcdef_nomeutente, dove abcdef è il nome utente del pannello di controllo hosting. In caso di dubbi, contattare il proprio host."
SOLO_SETUP_LBL_FS_DRIVER="Driver del file system"
SOLO_SETUP_LBL_FS_DRIVER_FILE="Scrittura diretta su file"
SOLO_SETUP_LBL_FS_DRIVER_FTP="Modalità FTP - File Transfer Protocol"
SOLO_SETUP_LBL_FS_DRIVER_HELP="Su molti hosting condivisi è necessario utilizzare una delle modalità (S)FTP disponibili in questo menu a discesa — e inserire i parametri (S)FTP nei campi che appariranno qui sotto se si effettua questa scelta — per assicurarsi che Akeeba Solo possa scrivere correttamente sui propri file. Non tutti gli host supportano SFTP. Sono necessari sia il supporto SFTP sul server sia l'estensione PHP mod_ssh2 installata."
SOLO_SETUP_LBL_FS_DRIVER_SFTP="Modalità SFTP - Secure File Transfer Protocol (tramite SSH)"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY="Directory (S)FTP"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY_HELP="La directory (S)FTP dell'installazione di Akeeba Solo. Sui server FTP questa non coincide con il percorso del file system. In caso di dubbi, contattare il proprio host."
SOLO_SETUP_LBL_FS_FTP_HOST="Nome host del server (S)FTP"
SOLO_SETUP_LBL_FS_FTP_HOST_HELP="Il nome host o l'indirizzo IP del proprio server (S)FTP, ad es. <code>ftp.example.com</code> oppure <code>127.0.0.1</code>. È NECESSARIO inserirlo <em>senza</em> il prefisso <code>ftp://</code>, <code>sftp://</code> o <code>ssh://</code>. In caso di dubbi su questa e le altre impostazioni FTP, contattare il proprio host."
SOLO_SETUP_LBL_FS_FTP_PASSIVE="Usa modalità passiva"
SOLO_SETUP_LBL_FS_FTP_PASSIVE_HELP="Applicabile solo per FTP, ignorato per SFTP. Se selezionato, Akeeba Solo utilizzerà la modalità passiva FTP. La maggior parte dei server FTP la richiede. Se il proprio host richiede la modalità attiva FTP, deselezionare questa casella. In caso di dubbi, contattare il proprio host."
SOLO_SETUP_LBL_FS_FTP_PASSWORD="Password (S)FTP"
SOLO_SETUP_LBL_FS_FTP_PASSWORD_HELP="La password utilizzata per connettersi al proprio server (S)FTP. In caso di dubbi, contattare il proprio host."
SOLO_SETUP_LBL_FS_FTP_PORT="Porta del server (S)FTP"
SOLO_SETUP_LBL_FS_FTP_PORT_HELP="Il numero di porta su cui è in ascolto il proprio server (S)FTP. Di solito è 21 per FTP e 22 per SFTP. In caso di dubbi, contattare il proprio host."
SOLO_SETUP_LBL_FS_FTP_SSL="Usa SSL"
SOLO_SETUP_LBL_FS_FTP_SSL_HELP="Applicabile solo per FTP, ignorato per SFTP. Se selezionato, Akeeba Solo utilizzerà FTP su SSL esplicito (FTP/S). Si noti che questo non va confuso con SFTP, che è una cosa completamente diversa."
SOLO_SETUP_LBL_FS_FTP_USERNAME="Nome utente (S)FTP"
SOLO_SETUP_LBL_FS_FTP_USERNAME_HELP="Il nome utente utilizzato per connettersi al proprio server (S)FTP. In caso di dubbi, contattare il proprio host."
SOLO_SETUP_LBL_LIVESITE="URL di Akeeba Solo"
SOLO_SETUP_LBL_LIVESITE_HELP="Sulla maggior parte dei server è possibile lasciare questo campo vuoto e verrà determinato automaticamente. Se il proprio server fa parte della minoranza in cui ciò non funziona, fornire manualmente l'URL di Akeeba Solo."
SOLO_SETUP_LBL_MANUALCONFIGINSTRUCTIONS="Selezionare tutto il testo qui sotto e copiarlo in un nuovo file di testo normale. Nominare il file <code>config.php</code>. Quindi caricarlo nella directory <code>Solo/assets/private</code> all'interno della directory di Akeeba Solo. Sarà quindi possibile iniziare a utilizzare Akeeba Solo normalmente."
