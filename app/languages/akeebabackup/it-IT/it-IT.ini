COM_AKEEBA_SCHEDULE_LBL_JSONAPI_DISCLAIMER="Akeeba Ltd non avvalla, non si assume responsabilità e non fornisce supporto per software o servizi di terze parti che si interfacciano con Akeeba Backup tramite JSON API. Il supporto per l'esecuzione di backup con Akeeba JSON API verrà fornito solo se la chiave segreta è generata automaticamente dal nostro software e la richiesta riguarda l'utilizzo del nostro client software Akeeba JSON API (ad es. Akeeba Remote CLI)."
