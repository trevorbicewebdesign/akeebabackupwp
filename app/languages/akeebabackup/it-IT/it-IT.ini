COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_ALERTS_INFO="Se sono già stati configurati metodi di avviso nell'interfaccia di webcron.org, si consiglia di scegliere un metodo di avviso qui e di non selezionare «Solo in caso di errore», in modo da ricevere sempre una notifica quando viene eseguito il CRON job di backup."
