COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEDB_DESCRIPTION="Se non selezionata (impostazione predefinita), Akeeba Backup eseguirà automaticamente il backup del database a cui è connesso il sito in cui è installato (il database Joomla!). Se selezionata, eseguirà il backup di un database diverso, utilizzando i dettagli di connessione forniti di seguito."
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEDB_TITLE="Override del database del sito"
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEROOT_DESCRIPTION="Se non selezionata (impostazione predefinita), Akeeba Backup eseguirà il backup di tutti i file e le directory sotto la radice del sito in cui è installato. Se abilitata, eseguirà il backup di file e directory sotto la directory selezionata in Forza radice del sito."
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEROOT_TITLE="Override della radice del sito"
COM_AKEEBA_CONFIG_PLATFORM_NEWROOT_DESCRIPTION="Quando l'opzione Override della radice del sito è abilitata, Akeeba Backup eseguirà il backup di tutti i file e le directory sotto la radice di questo sito"
COM_AKEEBA_CONFIG_PLATFORM_NEWROOT_TITLE="Forza radice del sito"
COM_AKEEBA_CONFIG_PLATFORM_DBDATABASE_DESCRIPTION="Il nome del database di cui eseguire il backup. Utilizzato solo quando la casella Override del database del sito è selezionata."
COM_AKEEBA_CONFIG_PLATFORM_DBDATABASE_TITLE="Nome del database"
COM_AKEEBA_CONFIG_PLATFORM_DBDRIVER_DESCRIPTION="Selezionare il driver del database da utilizzare per la connessione al database del sito. Utilizzato solo quando la casella Override del database del sito è selezionata."
COM_AKEEBA_CONFIG_PLATFORM_DBDRIVER_TITLE="Driver del database"
COM_AKEEBA_CONFIG_PLATFORM_DBHOST_DESCRIPTION="Il nome host o l'indirizzo IP del server del database. Di solito localhost o 127.0.0.1. Utilizzato solo quando la casella Override del database del sito è selezionata."
COM_AKEEBA_CONFIG_PLATFORM_DBHOST_TITLE="Nome host del server del database"
COM_AKEEBA_CONFIG_PLATFORM_DBPASSWORD_DESCRIPTION="La password per connettersi al database del sito. Utilizzata solo quando la casella Override del database del sito è selezionata."
COM_AKEEBA_CONFIG_PLATFORM_DBPASSWORD_TITLE="Password"
COM_AKEEBA_CONFIG_PLATFORM_DBPORT_DESCRIPTION="(opzionale) La porta su cui è in ascolto il server del database. Se non si è sicuri, lasciare vuota questa opzione per utilizzare la porta predefinita (3306 per i server MySQL). Utilizzata solo quando la casella Override del database del sito è selezionata."
COM_AKEEBA_CONFIG_PLATFORM_DBPORT_TITLE="Porta del server del database"
COM_AKEEBA_CONFIG_PLATFORM_DBPREFIX_DESCRIPTION="Il prefisso del database di cui eseguire il backup, incluso il trattino basso, ad esempio <tt>jos_</tt>. Utilizzato solo quando la casella Override del database del sito è selezionata."
COM_AKEEBA_CONFIG_PLATFORM_DBPREFIX_TITLE="Prefisso"
