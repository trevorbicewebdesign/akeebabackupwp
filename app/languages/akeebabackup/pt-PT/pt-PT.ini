COM_AKEEBA_CPANEL_ERR_FESECRETWORD_TOOSIMPLE="A chave secreta é demasiado simples. Tente utilizar letras minúsculas e maiúsculas, números e pontuação."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="Em alternativa, clique no botão abaixo para repor a chave secreta para o valor sugerido <code>%s</code>. Em qualquer dos casos, terá de actualizar os seus serviços de cópia de segurança remota e/ou tarefas CRON com a nova Chave Secreta."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_JOOMLA="Por favor, clique em Opções, Frontend e introduza uma chave secreta mais complexa."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_SOLO="Por favor, clique em Configuração do Sistema, API Pública e introduza uma chave secreta mais complexa."
