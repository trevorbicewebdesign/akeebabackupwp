COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BACKBLAZE_TITLE="Carregar para o BackBlaze B2"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BOX_DESCRIPTION="Carrega o arquivo de cópia de segurança para o Box.com. Por favor leia a documentação."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BOX_TITLE="Carregar para o Box.com"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_DESCRIPTION="Carrega o arquivo de cópia de segurança para o RackSpace CloudFiles.<br/><strong>Lembre-se de definir um tamanho de divisão de arquivo entre 2 e 30 MB ou arrisca falha da cópia de segurança por tempo limite excedido!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_TITLE="Carregar para o RackSpace CloudFiles"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDME_DESCRIPTION="Carrega o arquivo de cópia de segurança para o CloudMe.<br/><strong>Lembre-se de definir um tamanho de divisão de arquivo entre 2 e 30 MB ou arrisca falha da cópia de segurança por tempo limite excedido!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDME_TITLE="Carregar para o CloudMe"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_DESCRIPTION="Carrega o arquivo de cópia de segurança para o DreamObjects.<br/><strong>Lembre-se de definir um tamanho de divisão de arquivo entre 2 e 30 MB ou arrisca falha da cópia de segurança por tempo limite excedido!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_TITLE="Carregar para o DreamObjects"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DROPBOX2_DESCRIPTION="Carrega o arquivo de cópia de segurança para o Dropbox utilizando a API V2 do Dropbox. Esta API é mais rápida e permite ligar facilmente a sua conta Dropbox a vários sítios."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DROPBOX2_TITLE="Carregar para o Dropbox (API v2)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_DESCRIPTION="Envia-lhe o arquivo de cópia de segurança como anexo de correio electrónico.<br/><strong>Lembre-se de definir um tamanho de arquivo dividido de 1-2 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos e falta de memória!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_TITLE="Enviar por Correio Electrónico"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_DESCRIPTION="Carrega o arquivo de cópia de segurança para um servidor FTP ou FTPS (FTP sobre SSL Implícito) remoto.<br/>Este motor de pós-processamento utiliza a biblioteca cURL, que oferece maior compatibilidade com uma vasta gama de servidores FTP.<br/><strong>Lembre-se de definir um tamanho de arquivo dividido de 2-30 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_TITLE="Carregar para servidor FTP remoto usando cURL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_DESCRIPTION="Carrega o arquivo de cópia de segurança para um servidor FTP ou FTPS (FTP sobre SSL Implícito) remoto.<br/><strong>Lembre-se de definir um tamanho de arquivo dividido de 2-30 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_TITLE="Carregar para servidor FTP remoto"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_DESCRIPTION="Carrega o arquivo de cópia de segurança para o Google Drive. Por favor leia a documentação."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_TITLE="Carregar para o Google Drive"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_DESCRIPTION="Carrega o arquivo de cópia de segurança para o Google Storage utilizando a API JSON moderna. Esta é a integração recomendada com o Google Storage.<br/><strong>Lembre-se de definir um tamanho de arquivo dividido de 2-30 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_TITLE="Carregar para o Google Storage (API JSON)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_DESCRIPTION="Carrega o arquivo de cópia de segurança para o Google Storage utilizando a emulação da API S3 legada. Esta opção está descontinuada e será removida no futuro. Utilize a opção da API JSON em alternativa.<br/><strong>Lembre-se de definir um tamanho de arquivo dividido de 2-30 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_TITLE="Carregar para o Google Storage (API S3 Legada)"
