COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_PARTS="A sua cópia de segurança é composta por %d ficheiros de parte. <em>Tem de</em> transferir todos eles e colocá-los no mesmo directório para que a extracção do arquivo e o restauro da cópia de segurança sejam bem-sucedidos."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE="A transferência através do browser pode corromper os ficheiros"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE_NODOWNLOAD="A transferência de cópias de segurança através do browser está desactivada por defeito"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE_NODOWNLOAD_PHPERRORDISPLAY="A transferência de cópias de segurança através do browser está automaticamente desactivada"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING="Recomendamos que feche esta janela e utilize FTP em modo de transferência <code>Binário</code> ou SFTP para transferir os seus arquivos de cópia de segurança."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD="<strong>As definições actuais do seu servidor podem resultar num ficheiro corrompido (ou danificado) ao transferir através do browser.</strong> A transferência de arquivos de cópia de segurança através do browser está desactivada por defeito porque é provável que outro plugin ou o PHP adicione dados inesperados no início ou no fim do arquivo de cópia de segurança. Isto corromperia (danificaria) os arquivos de cópia de segurança que transfere através do browser, tornando-os impossíveis de restaurar."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_ALTERNATIVE="Pode fechar esta janela e utilizar FTP em modo de transferência <code>Binário</code> ou SFTP para transferir os seus arquivos de cópia de segurança do seu servidor."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART="O seu arquivo de cópia de segurança é composto por %u ficheiros com o nome <code>%s</code> e as extensões <code>%s</code> bem como <code>%s</code> até <code>%s</code>. <strong>IMPORTANTE!</strong> Tem de transferir <em>todos estes</em> ficheiros. Ao restaurar o seu sítio, carregue também todos estes ficheiros juntamente com <code>kickstart.php</code>. Se não o fizer, o arquivo de cópia de segurança não poderá ser restaurado."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_1="O ficheiro que precisa de transferir chama-se <code>%s</code>"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_2="O seu arquivo de cópia de segurança é composto por dois ficheiros com o nome <code>%s</code> e as extensões <code>%s</code> e <code>%s</code>. <strong>IMPORTANTE!</strong> Tem de transferir <em>ambos</em> os ficheiros. Ao restaurar o seu sítio, carregue também ambos os ficheiros juntamente com <code>kickstart.php</code>. Se não o fizer, o arquivo de cópia de segurança não poderá ser restaurado."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_AKEEBADEBUG="Pode reactivar as transferências pelo browser editando o ficheiro <code>%s/defines.php</code> e comentando a linha <code>define('AKEEBADEBUG', 1);</code>."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_ENABLED="<strong>As definições actuais do seu servidor podem resultar num ficheiro corrompido (ou danificado) ao transferir através do browser.</strong> A transferência de arquivos de cópia de segurança através do browser foi desactivada automaticamente porque o seu servidor está configurado para enviar avisos, alertas e erros de PHP para o browser. Isso faria com que o arquivo transferido ficasse <em>corrompido</em> (danificado) e impossível de restaurar. Por favor, feche esta janela e utilize FTP em modo de transferência <code>Binário</code> ou SFTP para transferir os seus arquivos de cópia de segurança do seu servidor."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_UNKNOWN="<strong>As definições actuais do seu servidor podem resultar num ficheiro corrompido (ou danificado) ao transferir através do browser.</strong> A transferência de arquivos de cópia de segurança através do browser foi desactivada automaticamente porque não é possível determinar se o seu servidor está configurado para enviar avisos, alertas e erros de PHP para o browser. Quando os avisos, alertas e erros de PHP são enviados para o browser, o arquivo transferido fica <em>corrompido</em> (danificado) e impossível de restaurar. Por favor, feche esta janela e utilize FTP em modo de transferência <code>Binário</code> ou SFTP para transferir os seus arquivos de cópia de segurança do seu servidor."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_WPDEBUG="Pode reactivar as transferências pelo browser editando o ficheiro <code>wp-config.php</code> e definindo a constante <code>WP_DEBUG</code> como <code>false</code>."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_REENABLE="Pode activar as transferências através do browser <em>por sua conta e risco</em> na página de Configuração do Sistema do Akeeba Backup."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_WORDPRESS="<strong>Activou manualmente a transferência de cópias de segurança através do browser <em>por sua conta e risco</em>.</strong> Plugins de terceiros e definições do servidor podem fazer com que o ficheiro transferido fique truncado (incompleto) ou corrompido (danificado). Se optar por transferir os seus arquivos de cópia de segurança através do browser, contrariando os nossos avisos, <strong>aceita pessoalmente a responsabilidade total pelas suas acções</strong> e concorda que a Akeeba Ltd não é responsável de forma alguma e não lhe prestará qualquer tipo de suporte caso o seu arquivo de cópia de segurança não possa ser extraído ou restaurado."
