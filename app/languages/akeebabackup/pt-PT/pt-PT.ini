COM_AKEEBA_CPANEL_ERR_FESECRETWORD_INTRO="A sua <em>Chave Secreta</em> é insegura e pode ser facilmente adivinhada. De modo a proteger o seu sítio, o Akeeba Backup desactivou o acesso às funcionalidades de cópia de segurança via frontend e remota até introduzir uma Chave Secreta segura. O problema detectado é:"
