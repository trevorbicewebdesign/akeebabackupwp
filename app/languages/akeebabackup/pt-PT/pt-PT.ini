COM_AKEEBA_SCHEDULE_LBL_JSONAPI_DISCLAIMER="A Akeeba Ltd não endossa, aceita responsabilidade nem presta suporte para software ou serviços de terceiros que se interligam com o Akeeba Backup através da JSON API. Apenas forneceremos suporte para a realização de cópias de segurança com a JSON API do Akeeba se a Chave Secreta for gerada automaticamente pelo nosso software e o pedido se referir à utilização do nosso próprio software cliente da JSON API do Akeeba (por ex. Akeeba Remote CLI)."
