COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_HEAD="A configuração predefinida do sistema CRON do WordPress pode resultar em problemas nas cópias de segurança agendadas"
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P1="De acordo com a <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">documentação do WordPress</a>, tarefas críticas — como cópias de segurança — agendadas com WP-CRON na configuração predefinida do WordPress (execução de tarefas agendadas avaliada apenas quando o seu sítio é visitado) podem não ser executadas no momento correcto, ou de todo. Como resultado deste problema de design inerente que o WordPress admite abertamente, as cópias de segurança agendadas com WP-CRON sob esta configuração podem não iniciar no momento correcto (ou de todo), podem demorar muito mais tempo a executar, podem tornar-se inconsistentes ou corrompidas, podem sobrepor-se, ou podem iniciar mas não terminar. Por favor, leia a nossa documentação para informação detalhada."
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P2="Recomendamos <strong>muito vivamente</strong> que siga a recomendação da <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">documentação oficial do WordPress</a> para desactivar a execução predefinida de tarefas baseada na actividade do sítio, utilizando o Agendador de Tarefas do Windows ou o daemon CRON do macOS/Linux para agendar a execução do auxiliar CRON do WordPress (<code>wp-cron.php</code>) a cada minuto. Esta configuração supera o problema de design inerente à configuração predefinida do WordPress para WP-CRON e torna as suas cópias de segurança agendadas tão fiáveis como as cópias de segurança manuais efectuadas no backend, ou as cópias de segurança agendadas com os métodos de cópia de segurança via frontend ou JSON API."
