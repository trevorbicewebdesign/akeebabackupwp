SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P2="Isto significa que extraiu, mas não concluiu o restauro, de uma cópia de segurança do sítio. O seu sítio ainda não funcionará correctamente."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P3="Precisa de concluir o restauro executando o script de restauro localizado na pasta «installation» do seu sítio. Se não tem a certeza de como fazê-lo, por favor clique no botão abaixo."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P4="Depois de concluir o restauro do sítio, por favor remova a pasta «installation» do seu sítio. Na maioria dos casos, o script de restauro pedirá para fazer isso por si. Se reportar um erro ao tentar fazê-lo, por favor leia o resto desta página."
