COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_CORE="<p>Pode restaurar as suas cópias de segurança em qualquer servidor, mesmo num diferente daquele onde efectuou a cópia de segurança. Siga o nosso <a href=\"%s\" target=\"_blank\">tutorial em vídeo</a>. Necessitará de <a href=\"%3$s\" target=\"_blank\">transferir o Akeeba Kickstart Core (gratuito)</a> para extrair os arquivos de cópia de segurança, tal como o tutorial indica.</p>"
