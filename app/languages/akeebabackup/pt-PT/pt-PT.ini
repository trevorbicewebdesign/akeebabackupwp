SOLO_CONFIG_UNDER_TOOLS_DESCRIPTION="Não: O Akeeba Backup aparece no menu lateral do WordPress como item de nível superior, colocado próximo do fundo. Sim: O Akeeba Backup aparece como item de submenu sob o item de menu «Ferramentas» no menu lateral do WordPress."
