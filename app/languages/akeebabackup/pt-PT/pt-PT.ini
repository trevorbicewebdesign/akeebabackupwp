COM_AKEEBA_CONFIG_ADVANCED="Configuração avançada"
COM_AKEEBA_CONFIG_ADVANCED_SBALF_DESC="O Akeeba Backup interromperá o passo de processamento após arquivar um ficheiro de grande dimensão. Ao activar esta opção, o Akeeba Backup funcionará mais rapidamente. No entanto, isto pode resultar em erros de tempo limite ou de Servidor Interno."
COM_AKEEBA_CONFIG_ADVANCED_SBALF_LABEL="Desactivar interrupção de passo após ficheiros de grande dimensão"
COM_AKEEBA_CONFIG_ADVANCED_SBBD_LABEL="Desactivar interrupção de passo entre domínios"
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_DESC="O Akeeba Backup interromperá o passo de processamento antes de arquivar um ficheiro de grande dimensão. Ao activar esta opção, o Akeeba Backup funcionará mais rapidamente. No entanto, isto pode resultar em erros de tempo limite ou de Servidor Interno."
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_LABEL="Desactivar interrupção de passo antes de ficheiros de grande dimensão"
COM_AKEEBA_CONFIG_ADVANCED_SBPA_DESC="O Akeeba Backup interromperá o passo de processamento se considerar que ficará sem tempo antes de arquivar um ficheiro. Este cálculo não é totalmente preciso e pode resultar em cópias de segurança mais lentas. Ao activar esta opção, o Akeeba Backup funcionará mais rapidamente. No entanto, isto pode resultar em erros de tempo limite ou de Servidor Interno."
COM_AKEEBA_CONFIG_ADVANCED_SBPA_LABEL="Desactivar interrupção proactiva de passo"
COM_AKEEBA_CONFIG_ADVANCED_SBPP_DESC="O Akeeba Backup interromperá o passo de processamento entre sub-passos da finalização e pós-processamento da cópia de segurança. Isto pode acrescentar cerca de 10 segundos ao tempo total de cópia de segurança. Ao activar esta opção, o Akeeba Backup funcionará mais rapidamente. No entanto, isto pode resultar em erros de tempo limite ou de Servidor Interno."
COM_AKEEBA_CONFIG_ADVANCED_SBPP_LABEL="Desactivar interrupção de passo na finalização"
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_DESC="Indica ao Akeeba Backup que tente aumentar o limite de memória do PHP para um valor extremamente alto (16 GB). Isto permite-lhe comprimir ficheiros maiores e carregar arquivos de cópia de segurança maiores utilizando opções de armazenamento remoto que consomem muita memória, como WebDAV. Nota: isto apenas define o limite máximo de consumo de memória. Na maioria dos casos, o motor de cópia de segurança do Akeeba Backup consome <em>muito menos</em> memória do que isso, tipicamente cerca de 20 MB. A compressão e o carregamento de ficheiros maiores requerem também a alteração de outras opções na página de Configuração do perfil de cópia de segurança."
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_LABEL="Definir um limite de memória elevado"
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_DESC="Se o seu servidor não executar o PHP em Modo Seguro e suportar set_time_limit(), o Akeeba Backup tentará definir um tempo máximo de execução do PHP ilimitado para contornar possíveis problemas de tempo limite"
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_LABEL="Definir um limite de tempo PHP ilimitado"
COM_AKEEBA_CONFIG_ANGIE_KEY_DESCRIPTION="Se estiver a utilizar o script de instalação incorporado ANGIE, pode opcionalmente protegê-lo com palavra-passe, impedindo o acesso não autorizado ao instalador. Quando executar o instalador, ser-lhe-á pedido que introduza esta palavra-passe. Note que a palavra-passe é sensível a maiúsculas e minúsculas, ou seja, ABC, abc e Abc são três palavras-passe diferentes."
COM_AKEEBA_CONFIG_ANGIE_KEY_TITLE="Palavra-passe ANGIE"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_DESC="Enviar correio electrónico para este endereço (deixar em branco desactiva esta funcionalidade)"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_LABEL="Endereço de correio electrónico"
COM_AKEEBA_CONFIG_ARCHIVENAME_DESCRIPTION="Modelo de nomenclatura para o arquivo de cópia de segurança, quando aplicável. Pode utilizar as seguintes macros:<ul><li><b>[HOST]</b> O nome do servidor. ATENÇÃO! Esta etiqueta não funciona em modo CRON.</li><li><b>[DATE]</b> Data actual</li><li><b>[TIME_TZ]</b> Hora actual e fuso horário</li></ul>Existem mais macros disponíveis; consulte a documentação."
COM_AKEEBA_CONFIG_ARCHIVENAME_TITLE="Nome do arquivo de cópia de segurança"
COM_AKEEBA_CONFIG_ARCHIVERENGINE_DESCRIPTION="Define o formato de arquivo do Akeeba Backup. Alguns motores, como o DirectFTP, não produzem efectivamente arquivos, mas tratam da transferência dos seus ficheiros para outros servidores."
COM_AKEEBA_CONFIG_ARCHIVERENGINE_TITLE="Motor de arquivo"
COM_AKEEBA_CONFIG_AUTORESUME_DESCRIPTION="Quando esta opção está desmarcada, o Akeeba Backup interrompe a cópia de segurança quando o servidor responde com um erro. Quando esta opção está activada, o Akeeba Backup tentará retomar a cópia de segurança repetindo o último passo. Isto aplica-se apenas a cópias de segurança via backend. Também não permite retomar com êxito todas as cópias de segurança que resultam em erro: apenas as tentativas de cópia de segurança temporariamente bloqueadas por restrições de utilização de CPU do servidor ou problemas de falha de rede podem ser retomadas."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_DESCRIPTION="Quantas vezes deve o Akeeba Backup tentar retomar a cópia de segurança antes de desistir definitivamente. Entre 3 a 5 tentativas funcionam melhor na maioria dos servidores."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_TITLE="Número máximo de tentativas de um passo de cópia de segurança após um erro AJAX"
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_DESCRIPTION="Quantos segundos aguardar antes de retomar a cópia de segurança. Recomenda-se definir este valor para 30 segundos ou mais (120 segundos é recomendado na maioria dos casos) para dar ao servidor o tempo necessário para desbloquear o processo de cópia de segurança antes de o Akeeba Backup tentar concluí-lo."
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_TITLE="Período de espera antes de repetir o passo de cópia de segurança"
COM_AKEEBA_CONFIG_AUTORESUME_TITLE="Retomar a cópia de segurança após ocorrer um erro AJAX"
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_DESCRIPTION="O nome da sua conta. Se o seu ponto de acesso for foobar.blob.core.windows.net, o nome da sua conta é <b>foobar</b> e deve escrever <em>foobar</em> neste campo."
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_TITLE="Nome da conta"
COM_AKEEBA_CONFIG_AZURE_CONTAINER_DESCRIPTION="O contentor do Windows Azure BLOB Storage para armazenar os arquivos de cópia de segurança. O contentor já deve existir."
COM_AKEEBA_CONFIG_AZURE_CONTAINER_TITLE="Contentor"
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_DESCRIPTION="O directório dentro do contentor do Windows Azure BLOB Storage para armazenar os arquivos de cópia de segurança. Para armazenar tudo na raiz do contentor, deixe em branco."
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_AZURE_KEY_DESCRIPTION="Pode encontrar a sua Chave de Acesso Primária na página da sua conta em windows.azure.com. Copie e cole-a aqui. Termina sempre com dois sinais de igual."
COM_AKEEBA_CONFIG_AZURE_KEY_TITLE="Chave de Acesso Primária"
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_DESCRIPTION="Introduza o ID da chave de aplicação do BackBlaze. Pode encontrar esta informação na <a href='https://secure.backblaze.com/b2_buckets.htm'>página da sua conta BackBlaze</a> após clicar em 'Show Account ID and Application Key'. Se estiver a utilizar a sua chave principal, introduza o ID da sua conta."
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_TITLE="ID da Chave de Aplicação"
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_DESCRIPTION="Introduza a sua chave de aplicação do BackBlaze. Pode encontrar esta informação na <a href='https://secure.backblaze.com/b2_buckets.htm'>página da sua conta BackBlaze</a> após clicar em 'Show Account ID and Application Key'. <strong>ATENÇÃO</strong>! Esta informação é mostrada apenas UMA VEZ pelo BackBlaze. Para a visualizar novamente, terá de regenerar a Chave de Aplicação, fazendo com que TODAS as instâncias do Akeeba Backup previamente ligadas fiquem desligadas até introduzir a <em>nova</em> Chave de Aplicação."
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_TITLE="Chave de Aplicação"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_DESCRIPTION="O nome do seu bucket do Backblaze"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_BACKBLAZE_DIRECTORY_DESCRIPTION="O directório dentro do seu bucket onde os arquivos de cópia de segurança serão armazenados. Deixe em branco para armazenar os ficheiros na raiz do bucket."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_DESCRIPTION="Ao activar esta opção, o Akeeba Backup efectuará carregamentos de parte única para o Backblaze B2. Precisará de utilizar um Tamanho de Parte menor na configuração do Motor de Arquivo de Arquivos Divididos para evitar que o carregamento expire, causando a falha do processo de cópia de segurança."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_TITLE="Desactivar carregamentos multipart"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_DESC="Deve traduzir-se a hora de início da cópia de segurança para o fuso horário do utilizador com sessão iniciada, na página Gerir Cópias de Segurança? Se definido como Não, todas as horas de início de cópia de segurança aparecem no fuso horário GMT. Esta opção NÃO afecta as variáveis [DATE] e [TIME] para a nomeação de ficheiros de cópia de segurança ou a descrição predefinida; utilize a opção Fuso horário da cópia de segurança para alterar o funcionamento dessas variáveis."
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_LABEL="Hora local em Gerir Cópias de Segurança"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_WP_DESC="Quando desactivado, a hora de início da cópia de segurança na página Gerir Cópias de Segurança será apresentada no fuso horário GMT. Quando activado, a hora de início da cópia de segurança será apresentada no fuso horário configurado no próprio WordPress (Definições, Geral, Fuso Horário)."
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_DESC="Deve mostrar a opção de transferir os arquivos de cópia de segurança através do navegador, mesmo sendo desaconselhável? Note que esta opção NÃO estará disponível se tiver o WP_DEBUG activado, ou se a apresentação de erros PHP estiver activada, como precaução básica contra transferências corrompidas (quebradas ou incompletas). <strong>AVISO! Ao activar esta opção, concorda em não receber qualquer suporte para problemas relacionados com a extracção de arquivos de cópia de segurança.</strong>"
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_LABEL="Permitir transferências de arquivos de cópia de segurança através do navegador"
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_DESC="Deve dar aos utilizadores que restauram um sítio a opção de apagar tudo antes de extrair um arquivo? Esta opção aplica-se apenas à versão Profissional do nosso software. AVISO! ISTO É EXTREMAMENTE PERIGOSO. LEIA A DOCUMENTAÇÃO COM MUITO CUIDADO ANTES DE ACTIVAR. SE UTILIZAR ESTA FUNCIONALIDADE DURANTE O RESTAURO, RENUNCIA A QUALQUER DIREITO DE SOLICITAR SUPORTE E ASSUME TODA A RESPONSABILIDADE."
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_LABEL="Mostrar a opção \"Apagar tudo antes da extracção\""
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_ABBREVIATION="Fuso Horário"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_DESC="O sufixo de fuso horário a apresentar junto à hora de início da cópia de segurança na página Gerir Cópias de Segurança.<br/>Nenhum: nenhum sufixo é apresentado (não recomendado).<br/>Fuso Horário: um fuso horário abreviado, por exemplo CET para Hora da Europa Central.<br/>Deslocamento GMT: o deslocamento em relação ao fuso horário GMT. Este pode variar consoante o horário de Verão. Por exemplo, o fuso horário CET será GMT+01:00 (uma hora à frente do GMT) no inverno e GMT+02:00 (duas horas à frente do GMT) no verão."
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_GMTOFFSET="Deslocamento GMT"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_LABEL="Sufixo de fuso horário"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_NONE="Nenhum"
COM_AKEEBA_CONFIG_BACKUPTYPE_ALLDB="Todas as bases de dados configuradas (ficheiro de arquivo)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DBONLY="Apenas a base de dados principal do sítio (ficheiro SQL)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DESCRIPTION="O tipo de cópia de segurança do sítio que deseja que o Akeeba Backup efectue"
COM_AKEEBA_CONFIG_BACKUPTYPE_FILEONLY="Apenas ficheiros do sítio"
COM_AKEEBA_CONFIG_BACKUPTYPE_FULL="Cópia de segurança completa do sítio"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFILE="Apenas ficheiros, incremental"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFULL="Sítio completo, ficheiros incrementais"
COM_AKEEBA_CONFIG_BACKUPTYPE_TITLE="Tipo de Cópia de Segurança"
COM_AKEEBA_CONFIG_BACTHSIZE_DESCRIPTION="Reduzir este valor irá conservar memória e evitar erros HTTP 500 durante a cópia de segurança de tabelas muito grandes"
COM_AKEEBA_CONFIG_BACTHSIZE_TITLE="Número de linhas por lote"
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_DESCRIPTION="Os ficheiros acima deste tamanho serão armazenados sem compressão, ou o seu processamento será distribuído por múltiplos passos (dependendo do motor de arquivo) para evitar erros de tempo limite. Sugerimos aumentar este valor apenas em servidores rápidos e fiáveis."
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_TITLE="Limite para ficheiros grandes"
COM_AKEEBA_CONFIG_BLANKOUTPASS_DESCRIPTION="Remove o nome de utilizador e a palavra-passe das ligações à base de dados da cópia de segurança"
COM_AKEEBA_CONFIG_BLANKOUTPASS_TITLE="Apagar nome de utilizador/palavra-passe"
COM_AKEEBA_CONFIG_BOX_ACCESSTOKEN_TITLE="Token de Acesso"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_ENABLE="Activar carregamento por blocos"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_SIZE="Tamanho do bloco"
COM_AKEEBA_CONFIG_BOX_DIRECTORY_DESCRIPTION="O directório dentro da sua conta Box onde os arquivos de cópia de segurança serão armazenados. Deixe em branco para armazenar os ficheiros na raiz da pasta Box."
COM_AKEEBA_CONFIG_BOX_DIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_DESC="Clique neste botão para abrir uma nova janela onde pode iniciar sessão na sua conta com o fornecedor de armazenamento. De seguida, feche a janela de pop-up e clique no botão do Passo 2 abaixo."
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_TITLE="Autenticação - Passo 1"
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_DESCRIPTION="Preenchido automaticamente quando conclui a Autenticação do Passo 1 acima. NÃO partilhe o mesmo token em vários sítios. Em vez disso, autentique cada sítio separadamente."
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_TITLE="Token de Actualização"
COM_AKEEBA_CONFIG_CHUNKSIZE_DESCRIPTION="O Akeeba Backup processa ficheiros grandes em pequenos blocos, para evitar erros de tempo limite. Este parâmetro define o tamanho máximo do bloco para este tipo de processamento."
COM_AKEEBA_CONFIG_CHUNKSIZE_TITLE="Tamanho do bloco para processamento de ficheiros grandes"
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_DESCRIPTION="Quando esta opção está desmarcada (predefinição) e o passo de cópia de segurança termina em menos tempo do que o tempo mínimo de execução configurado, o Akeeba Backup fará o servidor aguardar até esse tempo ser atingido. Isto pode fazer com que alguns servidores muito restritivos interrompam a cópia de segurança. Marcar esta opção implementará o período de espera no navegador, contornando esta limitação. IMPORTANTE: Esta opção aplica-se apenas a cópias de segurança no backend. As cópias de segurança via frontend, JSON API (remota) e linha de comandos (CLI) implementam sempre a espera no lado do servidor."
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_TITLE="Implementação do tempo mínimo de execução no lado do cliente"
COM_AKEEBA_CONFIG_CLOUDFILESAPIKEY_DESCRIPTION="A sua chave API do CloudFiles"
COM_AKEEBA_CONFIG_CLOUDFILESAPIKEY_TITLE="Chave API"
COM_AKEEBA_CONFIG_CLOUDFILESCONTAINER_DESCRIPTION="O contentor CloudFiles para armazenar os arquivos de cópia de segurança"
COM_AKEEBA_CONFIG_CLOUDFILESCONTAINER_TITLE="Contentor"
COM_AKEEBA_CONFIG_CLOUDFILESDIRECTORY_DESCRIPTION="O directório dentro do contentor CloudFiles onde armazenar os arquivos de cópia de segurança. Para armazenar tudo na raiz do contentor, deixe em branco."
COM_AKEEBA_CONFIG_CLOUDFILESDIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_CLOUDFILESUSERNAME_DESCRIPTION="O seu nome de utilizador do CloudFiles"
COM_AKEEBA_CONFIG_CLOUDFILESUSERNAME_TITLE="Nome de utilizador"
COM_AKEEBA_CONFIG_CLOUDME_DIRECTORY_DESCRIPTION="O directório dentro da sua conta CloudMe onde os arquivos de cópia de segurança serão armazenados. Deixe em branco para armazenar os ficheiros na raiz da pasta CloudMe."
COM_AKEEBA_CONFIG_CLOUDME_DIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_CLOUDME_PASSWORD_DESCRIPTION="Palavra-passe"
COM_AKEEBA_CONFIG_CLOUDME_PASSWORD_TITLE="Palavra-passe"
COM_AKEEBA_CONFIG_CLOUDME_USERNAME_DESCRIPTION="Nome de utilizador"
COM_AKEEBA_CONFIG_CLOUDME_USERNAME_TITLE="Nome de utilizador"
COM_AKEEBA_CONFIG_COUNTQUOTA_ENABLE_DESCRIPTION="Quando activado, o Akeeba Backup eliminará ficheiros de cópia de segurança antigos se excederem o limite definido abaixo."
COM_AKEEBA_CONFIG_COUNTQUOTA_ENABLE_TITLE="Activar quota por número"
COM_AKEEBA_CONFIG_COUNTQUOTA_VALUE_DESCRIPTION="O Akeeba Backup eliminará ficheiros de cópia de segurança antigos se excederem o limite definido nesta definição. As cópias de segurança multipart são consideradas como <i>um</i> ficheiro!<br/><br/><b>Sugestão</b>: Seleccione Personalizado e escreva o valor pretendido se não estiver na lista."
COM_AKEEBA_CONFIG_COUNTQUOTA_VALUE_TITLE="Quota por número"
COM_AKEEBA_CONFIG_DATEFORMAT_DESC="Altere a forma como a Data/hora de início das cópias de segurança é apresentada na página Gerir Cópias de Segurança. Deixe em branco para utilizar a formatação predefinida. Pode utilizar as opções de formatação da função date do PHP, consulte: http://www.php.net/manual/en/function.date.php"
COM_AKEEBA_CONFIG_DATEFORMAT_LABEL="Formato de data"
COM_AKEEBA_CONFIG_DELETEAFTER_DESCRIPTION="Se activado, o arquivo de cópia de segurança será removido deste servidor assim que o pós-processamento terminar com êxito."
COM_AKEEBA_CONFIG_DELETEAFTER_TITLE="Apagar arquivo após processamento"
COM_AKEEBA_CONFIG_DEREFERENCESYMLINKS_DESCRIPTION="Quando activado, as ligações simbólicas serão seguidas tal como ficheiros e directórios normais. Quando não está marcado, as ligações simbólicas não serão seguidas. Se estiver a utilizar ligações simbólicas que levam a um ciclo de ligações infinito, desmarque esta opção."
COM_AKEEBA_CONFIG_DEREFERENCESYMLINKS_TITLE="Desreferenciar ligações simbólicas"
COM_AKEEBA_CONFIG_DESKTOP_NOTIFICATIONS_DESC="Deve ser solicitada permissão para mostrar notificações no ambiente de trabalho? As notificações do ambiente de trabalho aparecem quando a cópia de segurança é iniciada, concluída, emite um aviso ou é interrompida. São exibidas apenas em navegadores compatíveis (normalmente: Chrome, Safari, Firefox, Opera) se conceder ao Akeeba Backup permissão para apresentar notificações do ambiente de trabalho quando solicitado na página do Painel de Controlo. Esta opção controla apenas se este pedido deve ser apresentado. Assim que aceite ou recuse as permissões de notificação do ambiente de trabalho, esta definição não tem <b>qualquer efeito</b>. A única forma de activar ou desactivar as notificações do ambiente de trabalho será através das definições do seu navegador."
COM_AKEEBA_CONFIG_DESKTOP_NOTIFICATIONS_LABEL="Solicitar permissões de Notificações do Ambiente de Trabalho"
COM_AKEEBA_CONFIG_DIRECTFTP_FTPS_DESCRIPTION="Se activado, o Akeeba Backup tentará ligar-se ao servidor FTP utilizando uma ligação encriptada por SSL. <strong>Isto não é o mesmo que SFTP, SCP ou \"FTP Seguro\"!</strong> Note que se o seu servidor não suportar este método, ocorrerão erros de ligação."
COM_AKEEBA_CONFIG_DIRECTFTP_FTPS_TITLE="Utilizar FTP sobre SSL (FTPS)"
COM_AKEEBA_CONFIG_DIRECTFTP_HOST_DESCRIPTION="O nome do servidor FTP, sem o protocolo. Isto significa que <tt>ftp://example.com</tt> é <b>inválido</b> e <tt>example.com</tt> é válido. O Akeeba Backup suporta apenas servidores FTP e FTPS. <u>Não</u> suporta SFTP, SCP e outras variantes SSH."
COM_AKEEBA_CONFIG_DIRECTFTP_HOST_TITLE="Nome do servidor"
COM_AKEEBA_CONFIG_DIRECTFTP_INITDIR_DESCRIPTION="O caminho <b>FTP</b> absoluto para o directório onde os ficheiros serão carregados. Se não tiver a certeza, ligue-se ao servidor com o FileZilla, navegue até ao directório pretendido e copie o caminho que aparece no painel direito acima da lista de directórios. Normalmente é algo curto, como <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_DIRECTFTP_INITDIR_TITLE="Directório inicial"
COM_AKEEBA_CONFIG_DIRECTFTP_PASSIVE_DESCRIPTION="Utilizar o modo passivo FTP na transferência de dados. Está activado por predefinição, pois é o único método que funciona através das firewalls normalmente instaladas em servidores web. Não desactive a menos que tenha a certeza de que o seu servidor web não está protegido por uma firewall e que o seu servidor FTP requer absolutamente transferências de ficheiros em modo activo."
COM_AKEEBA_CONFIG_DIRECTFTP_PASSIVE_TITLE="Utilizar modo passivo"
COM_AKEEBA_CONFIG_DIRECTFTP_PASSWORD_DESCRIPTION="A palavra-passe do servidor FTP. Normalmente é sensível a maiúsculas e minúsculas. Se não tiver a certeza, contacte o administrador da rede."
COM_AKEEBA_CONFIG_DIRECTFTP_PASSWORD_TITLE="Palavra-passe"
COM_AKEEBA_CONFIG_DIRECTFTP_PORT_DESCRIPTION="A porta do servidor FTP. A definição mais comum é 21. Se não tiver a certeza, contacte o administrador da rede."
COM_AKEEBA_CONFIG_DIRECTFTP_PORT_TITLE="Porta"
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_DESCRIPTION="Utilize este botão para testar a ligação FTP e ver os erros de ligação em caso de falha."
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_FAIL="Não foi possível ligar ao servidor FTP remoto."
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_OK="A ligação ao servidor FTP remoto foi estabelecida com êxito!"
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_TITLE="Testar ligação FTP"
COM_AKEEBA_CONFIG_DIRECTFTP_USER_DESCRIPTION="Nome de utilizador do servidor FTP. Normalmente é sensível a maiúsculas e minúsculas. Em caso de dúvida, contacte o administrador da rede."
COM_AKEEBA_CONFIG_DIRECTFTP_USER_TITLE="Nome de utilizador"
COM_AKEEBA_CONFIG_DIRECTSFTP_HOST_DESCRIPTION="Introduza o nome do servidor ou o endereço IP do seu servidor SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_HOST_TITLE="Nome do servidor"
COM_AKEEBA_CONFIG_DIRECTSFTP_INITDIR_DESCRIPTION="Introduza o directório para onde os ficheiros serão carregados. Em caso de dúvida, utilize um cliente SFTP de ambiente de trabalho, ligue ao seu servidor, navegue até ao directório pretendido e copie o caminho aqui apresentado. O caminho deve estar em formato absoluto, por exemplo /users/omeutilizador/public_html"
COM_AKEEBA_CONFIG_DIRECTSFTP_INITDIR_TITLE="Directório inicial"
COM_AKEEBA_CONFIG_DIRECTSFTP_PASSWORD_DESCRIPTION="A palavra-passe SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_PASSWORD_TITLE="Palavra-passe"
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_DESCRIPTION="A porta habitual para ligações SFTP é a 22. Se o seu servidor utilizar uma porta diferente, introduza-a aqui."
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_TITLE="Porta"
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_DESCRIPTION="Utilize este botão para testar a ligação SFTP e ver os erros de ligação em caso de falha."
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_FAIL="Não foi possível ligar ao servidor SFTP remoto. A mensagem de erro foi:"
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_OK="Ligação ao servidor SFTP remoto estabelecida com êxito. Nota: a definição do directório inicial não foi testada."
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_TITLE="Testar ligação SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_DESCRIPTION="O nome de utilizador SFTP. Tenha em atenção que o seu servidor SFTP deve permitir autenticação por nome de utilizador/palavra-passe."
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_TITLE="Nome de utilizador"
COM_AKEEBA_CONFIG_DOWNLOADID_DESC="Este campo é necessário para activar as actualizações automáticas da versão Profissional. Visite https://www.akeeba.com/my-subscriptions.html para obter o seu Download ID pessoal."
COM_AKEEBA_CONFIG_DOWNLOADID_LABEL="Download ID"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_DESCRIPTION="A sua Chave de Acesso do DreamObjects, disponibilizada no painel de controlo do DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_TITLE="Chave de Acesso"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_DESCRIPTION="O nome do bucket do DreamObjects. Certifique-se de que é escrito exactamente como aparece no painel de controlo do DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_DESCRIPTION="O directório dentro do seu bucket onde os arquivos de cópia de segurança serão armazenados. Deixe em branco para armazenar os ficheiros na raiz do bucket."
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_DESCRIPTION="Se activado, o Akeeba Backup tentará converter o nome do bucket para letras minúsculas, ou seja, MeuBucket será convertido para meubucket. Se criou um bucket com letras maiúsculas, por exemplo MeuNovoBucket, desmarque esta opção e certifique-se de que o nome do bucket está escrito exactamente como aparece no painel de controlo do DreamHost."
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_TITLE="Nome do bucket em minúsculas"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_DESCRIPTION="A sua Chave Secreta do DreamObjects, disponibilizada no painel de controlo do DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_TITLE="Chave Secreta"
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_DESCRIPTION="Se activado, será utilizada uma ligação segura (HTTPS) ao carregar os seus ficheiros. Embora aumente a segurança dos dados transferidos, também aumenta a possibilidade de falha da cópia de segurança devido a tempo limite excedido."
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_TITLE="Utilizar SSL"
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_DESCRIPTION="O directório dentro da sua conta Dropbox onde os arquivos de cópia de segurança serão armazenados. Deixe em branco para armazenar os ficheiros na raiz."
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_DESCRIPTION="Este é o Token de Actualização que liga o Akeeba Backup ao Dropbox. É <strong>específico do sítio</strong> e utilizado para reautorizar a ligação ao Dropbox quando o Token de Acesso de curta duração expirar. Se tiver vários sítios, deve utilizar os botões do Passo 1 em cada um dos sítios que pretende autorizar. Por favor <strong>NÃO</strong> copie o token de acesso ou de actualização entre vários sítios. Isso fará com que a autenticação do Dropbox fique dessincronizada e terá de reconectar todos os seus sítios com o Dropbox."
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_TITLE="Token de Actualização"
COM_AKEEBA_CONFIG_DROPBOXTOKEN_DESCRIPTION="Este token é obtido automaticamente do Dropbox quando clica no botão do Passo 2 acima. Se tiver vários sítios, deve utilizar os botões do Passo 1 e do Passo 2 apenas no PRIMEIRO sítio que pretende autorizar. Em seguida, copie o Token, a Chave Secreta do Token e o ID de Utilizador do primeiro sítio para todos os outros sítios que pretende ligar ao Dropbox."
COM_AKEEBA_CONFIG_DROPBOXTOKEN_TITLE="Token de Acesso"
COM_AKEEBA_CONFIG_DROPBOX_TEAM_DESC="Marque esta opção se for membro de uma equipa que utiliza o Dropbox for Business e pretender utilizar a pasta da equipa para armazenar cópias de segurança. Lembre-se de prefixar o Directório abaixo com o nome da sua pasta de equipa. Por exemplo, se a interface web do Dropbox mostrar uma "Pasta de Equipa Acme Corp" na página Ficheiros e pretender colocar as suas cópias de segurança numa pasta chamada "Cópias de Segurança" dentro dela, deve utilizar o nome de Directório <code>Acme Corp Team Folder/Backups</code>, e não apenas <code>Backups</code>."
COM_AKEEBA_CONFIG_DROPBOX_TEAM_TITLE="Dropbox for Business"
COM_AKEEBA_CONFIG_DUMPENGINE_DESCRIPTION="Define como o Akeeba Backup processará as suas bases de dados para produzir um ficheiro de cópia de segurança da base de dados."
COM_AKEEBA_CONFIG_DUMPENGINE_TITLE="Motor de cópia de segurança da base de dados"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_COMMON="Definições Comuns"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_MYSQL="Definições MySQL"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_POSTGRES="Definições PostgreSQL"
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_DESCRIPTION="Os e-mails serão enviados para este endereço em vez do configurado na página de Configuração do Sistema após a conclusão ou falha da cópia de segurança, se aplicável. Pode separar vários endereços de correio electrónico com uma vírgula, por exemplo alice@example.com, bob@example.com."
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_TITLE="Destinatários de e-mail"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_DESCRIPTION="Transfere os ficheiros do sítio para um servidor FTP remoto, sem os arquivar primeiro. Este motor de arquivo utiliza a biblioteca cURL, que proporciona melhor compatibilidade com uma vasta gama de servidores FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_DESCRIPTION="Alguns servidores FTP mal configurados ou com comportamento incorrecto devolvem o endereço IP errado quando o modo passivo FTP está activado. Active esta opção para forçar a biblioteca FTP a ignorar o IP incorrecto devolvido pelo servidor FTP, utilizando em vez disso o IP público do servidor FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_TITLE="Solução para o modo passivo"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_TITLE="DirectFTP over cURL"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_DESCRIPTION="Transfere os ficheiros do sítio para um servidor FTP remoto, sem os arquivar primeiro"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_TITLE="DirectFTP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_DESCRIPTION="Transfere os ficheiros do sítio para um servidor SFTP remoto, sem os arquivar primeiro. Este motor de arquivo utiliza a biblioteca cURL, que proporciona melhor compatibilidade com uma vasta gama de servidores FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_TITLE="DirectSFTP over cURL"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_DESCRIPTION="Transfere os ficheiros do sítio para um servidor SFTP remoto, sem os arquivar primeiro. AVISO: O seu servidor de origem necessita de ter a extensão SSL2 do PHP instalada."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_TITLE="DirectSFTP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPA_DESCRIPTION="Um formato de arquivo de código aberto optimizado para criação e extracção rápidas de arquivos utilizando código PHP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPA_TITLE="Formato JPA (recomendado)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_DESCRIPTION="Cria arquivos encriptados com o método de encriptação AES-128, padrão da indústria, num formato muito semelhante ao JPA. Requer que a extensão PHP mcrypt ou openssl esteja instalada e activada no seu sítio."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_TITLE="Arquivos Encriptados (JPS)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_DESCRIPTION="O arquivo ZIP será criado utilizando a classe ZipArchive do PHP. IMPORTANTE: Este motor não suporta divisão de arquivos nem tratamento de ligações simbólicas e pode, por isso, originar problemas na cópia de segurança. Se obtiver erros de tempo limite, erros AJAX ou mensagens de Erro Interno do Servidor, terá de mudar para um motor de arquivo diferente e activar a divisão de arquivos."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_TITLE="ZIP utilizando a classe ZipArchive"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIP_DESCRIPTION="Ficheiros ZIP padrão, também conhecidos como \"Pastas Comprimidas\", suportados nativamente por todos os principais sistemas operativos"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIP_TITLE="Formato ZIP"
COM_AKEEBA_CONFIG_ENGINE_DUMP_NATIVE_DESCRIPTION="Utiliza código PHP para produzir uma exportação precisa da base de dados"
COM_AKEEBA_CONFIG_ENGINE_DUMP_NATIVE_TITLE="Motor nativo de cópia de segurança MySQL"
