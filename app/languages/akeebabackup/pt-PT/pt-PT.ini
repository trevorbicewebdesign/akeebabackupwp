COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECK_HEADERINFO="Esta funcionalidade permite-lhe verificar se existem cópias de segurança concluídas que não foram carregadas para o armazenamento remoto (por ex. Amazon S3, Dropbox, etc.) e enviar uma notificação por correio electrónico aos administradores do sítio."
COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECKUSECLI="Para verificar carregamentos falhados para armazenamento remoto utilizando o script CLI nativo, utilize a seguinte linha de comandos:"
COM_AKEEBA_SCHEDULE_LBL_CLICRON="Tarefas CRON de linha de comandos (recomendado)"
COM_AKEEBA_SCHEDULE_LBL_CLICRON_INFO="Este é o método recomendado para todos os servidores que suportam tarefas CRON de linha de comandos. Este método contorna a interface web, alcançando a velocidade máxima de cópia de segurança."
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICIMPROTANTINFO="Importante"
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICINFO="Lembre-se de substituir <em>%s</em> pelo caminho real para o executável PHP <strong>CLI (Interface de Linha de Comandos)</strong> do seu servidor. Deve usar o executável PHP CLI; embora o executável PHP CGI (Common Gateway Interface) possa funcionar com os nossos scripts CRON, é propenso a erros de tempo limite e falhas na cópia de segurança. Se não tiver a certeza do que isto significa, consulte o seu servidor de alojamento. São a única entidade que pode fornecer o caminho para o ficheiro executável PHP CLI."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP="Funcionalidade de Cópia de Segurança via Frontend"
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_INFO="Este método utiliza um URL público e uma chave secreta para desencadear uma cópia de segurança do seu sítio. A cópia de segurança avança por meio de redireccionamentos HTTP. Tenha em atenção que a maioria das tarefas 'CRON' baseadas em URL dos servidores de alojamento, bem como a maioria dos serviços CRON de terceiros baseados em URL, não suportam redireccionamentos HTTP. Se os exemplos com wget e curl abaixo não funcionarem, utilize o URL de cópia de segurança via frontend com o serviço de terceiros muito económico webcron.org."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_MANYMETHODS="A funcionalidade de cópia de segurança via frontend pode ser utilizada com uma grande variedade de métodos. Clique nos separadores abaixo para ver a descrição de cada método. Lembre-se de que todos eles são explicados em detalhe na nossa documentação."
