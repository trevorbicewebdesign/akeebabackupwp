SOLO_SETUP_LBL_DATABASE_DBENCRYPTION="Ligar com um certificado SSL"
SOLO_SETUP_LBL_DATABASE_DBENCRYPTION_HELP="Deve ligar-se à base de dados usando um certificado SSL? Isto pode ser utilizado em substituição da autenticação por nome de utilizador e palavra-passe (ligação encriptada com autenticação por certificado) ou <em>adicionalmente à</em> autenticação por nome de utilizador e palavra-passe (ligação encriptada com autenticação por palavra-passe). Se não sabe o que isto significa, defina esta opção como Não e ignore também as próximas opções."
SOLO_SETUP_LBL_DATABASE_DBSSLCA="Ficheiro da Autoridade de Certificação (CA)"
SOLO_SETUP_LBL_DATABASE_DBSSLCA_HELP="Caminho absoluto para o ficheiro PEM do certificado da Autoridade de Certificação (CA) do seu servidor de base de dados, por ex. <code>/home/myuser/ca.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT="Ficheiro de Chave Pública (Certificado) do utilizador da base de dados"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT_HELP="Caminho absoluto para o ficheiro PEM de chave pública (certificado) do utilizador da sua base de dados, por ex. <code>/home/myuser/myuser.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER="Métodos de Encriptação SSL/TLS"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER_HELP="Introduza uma lista de métodos de encriptação para ligar com certificados SSL, separados por dois pontos. Se deixado vazio, será utilizada a lista predefinida (<code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>) (recomendado)."
SOLO_SETUP_LBL_DATABASE_DBSSLKEY="Ficheiro de Chave Privada do utilizador da base de dados"
SOLO_SETUP_LBL_DATABASE_DBSSLKEY_HELP="Caminho absoluto para o ficheiro PEM de chave privada do utilizador da sua base de dados, por ex. <code>/home/myuser/myuser-key.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT="Verificar certificado do servidor"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT_HELP="Defina como Sim para verificar o certificado que o servidor nos envia. Este é verificado em relação ao ficheiro da Autoridade de Certificação (CA) que especificou. Se obtiver erros de ligação, defina como Não; algumas configurações (especialmente as geradas pelo <code>mysql_ssl_rsa_setup</code>) podem impedir uma ligação se a verificação de certificado estiver activada. Se activar a verificação e o campo do ficheiro CA ficar em branco, o certificado do servidor será verificado em relação aos ficheiros da Autoridade de Certificação conhecidos pelo seu servidor; consulte as opções PHP <code>openssl.cafile</code> e <code>openssl.capath</code>."
SOLO_SETUP_LBL_DATABASE_DRIVER="Tipo de base de dados"
SOLO_SETUP_LBL_DATABASE_DRIVER_HELP="Normalmente é MySQLi (<em>com</em> o \"i\" final)"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQL="MySQL (controlador obsoleto para MySQL - evite utilizar)"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQLI="MySQLi (controlador preferido para MySQL)"
SOLO_SETUP_LBL_DATABASE_DRIVER_NONE="Nenhum"
SOLO_SETUP_LBL_DATABASE_DRIVER_PDO="PDO"
SOLO_SETUP_LBL_DATABASE_DRIVER_PDOMYSQL="MySQL (PDO)"
SOLO_SETUP_LBL_DATABASE_DRIVER_SQLAZURE="Windows Azure SQL Database"
SOLO_SETUP_LBL_DATABASE_DRIVER_SQLITE="SQLite"
SOLO_SETUP_LBL_DATABASE_HOST="Nome do servidor da base de dados"
SOLO_SETUP_LBL_DATABASE_HOST_HELP="O nome do servidor ou endereço IP do servidor da base de dados (normalmente: localhost). Note que localhost e 127.0.0.1 são <em>muito</em> diferentes no que diz respeito ao MySQL; poderá ter de experimentar ambos para ver qual funciona com o seu servidor de base de dados. Se o seu servidor utilizar uma porta não padrão, acrescente-a após o nome do servidor precedida de dois pontos, por exemplo 127.0.0.1:1234 para utilizar um servidor de base de dados em 127.0.0.1 a escutar na porta 1234."
SOLO_SETUP_LBL_DATABASE_INFO="O Akeeba Solo necessita de uma base de dados para armazenar as suas definições de configuração e um registo de todas as tentativas de cópia de segurança. Forneça abaixo os parâmetros de ligação à base de dados. Pode utilizar a mesma base de dados do sítio que pretende salvaguardar ou uma base de dados dedicada exclusivamente ao Akeeba Solo (recomendado)."
SOLO_SETUP_LBL_DATABASE_NAME="Nome da base de dados"
SOLO_SETUP_LBL_DATABASE_NAME_HELP="O nome da sua base de dados. A maioria dos alojamentos que utilizam cPanel, Plesk e outros painéis de alojamento principais atribuem nomes de base de dados como abcdef_username, em que abcdef é o seu nome de utilizador no painel de controlo do alojamento. Em caso de dúvida, contacte o seu fornecedor de alojamento."
SOLO_SETUP_LBL_DATABASE_PASS="Palavra-passe"
SOLO_SETUP_LBL_DATABASE_PASS_HELP="A palavra-passe que utiliza para ligar à sua base de dados."
SOLO_SETUP_LBL_DATABASE_PREFIX="Prefixo do nome das tabelas da base de dados"
SOLO_SETUP_LBL_DATABASE_PREFIX_HELP="O prefixo comum do nome de todas as tabelas da base de dados pertencentes a esta instalação do Akeeba Solo. Poderá querer alterá-lo se tiver múltiplas instalações do Akeeba Solo a partilhar a mesma base de dados."
SOLO_SETUP_LBL_DATABASE_USER="Nome de utilizador"
SOLO_SETUP_LBL_DATABASE_USER_HELP="O nome de utilizador que utiliza para ligar à sua base de dados. A maioria dos alojamentos que utilizam cPanel, Plesk e outros painéis de alojamento principais atribuem nomes de utilizador como abcdef_username, em que abcdef é o seu nome de utilizador no painel de controlo do alojamento. Em caso de dúvida, contacte o seu fornecedor de alojamento."
SOLO_SETUP_LBL_FS_DRIVER="Controlador do sistema de ficheiros"
SOLO_SETUP_LBL_FS_DRIVER_FILE="Escrita Directa em Ficheiros"
SOLO_SETUP_LBL_FS_DRIVER_FTP="Modo FTP - File Transfer Protocol"
SOLO_SETUP_LBL_FS_DRIVER_HELP="Em muitos alojamentos partilhados é necessário utilizar um dos modos (S)FTP disponíveis nesta lista pendente –e introduzir os parâmetros (S)FTP nos campos que aparecerão abaixo se fizer esta escolha– para garantir que o Akeeba Solo consegue escrever correctamente nos seus ficheiros. Nem todos os alojamentos suportam SFTP. São necessários tanto suporte SFTP no servidor como a extensão PHP mod_ssh2 instalada."
SOLO_SETUP_LBL_FS_DRIVER_SFTP="Modo SFTP - Secure File Transfer Protocol (sobre SSH)"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY="Directório (S)FTP"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY_HELP="O directório (S)FTP para a instalação do Akeeba Solo. Em servidores FTP, este não é o mesmo que o caminho do sistema de ficheiros. Em caso de dúvida, contacte o seu fornecedor de alojamento."
SOLO_SETUP_LBL_FS_FTP_HOST="Nome do servidor (S)FTP"
SOLO_SETUP_LBL_FS_FTP_HOST_HELP="O nome do servidor ou endereço IP do seu servidor (S)FTP, por exemplo <code>ftp.example.com</code> ou <code>127.0.0.1</code>. DEVE introduzir isto <em>sem</em> o prefixo <code>ftp://</code>, <code>sftp://</code> ou <code>ssh://</code>. Em caso de dúvida sobre este e os restantes parâmetros FTP, contacte o seu fornecedor de alojamento."
SOLO_SETUP_LBL_FS_FTP_PASSIVE="Utilizar modo passivo"
SOLO_SETUP_LBL_FS_FTP_PASSIVE_HELP="Aplicável apenas para FTP, ignorado para SFTP. Quando seleccionado, o Akeeba Solo utilizará o modo passivo FTP. A maioria dos servidores FTP requer este modo. Se o seu alojamento requer o modo activo FTP, desmarque esta caixa. Em caso de dúvida, contacte o seu fornecedor de alojamento."
SOLO_SETUP_LBL_FS_FTP_PASSWORD="Palavra-passe (S)FTP"
SOLO_SETUP_LBL_FS_FTP_PASSWORD_HELP="A palavra-passe que utiliza para ligar ao seu servidor (S)FTP. Em caso de dúvida, contacte o seu fornecedor de alojamento."
SOLO_SETUP_LBL_FS_FTP_PORT="Porta do servidor (S)FTP"
SOLO_SETUP_LBL_FS_FTP_PORT_HELP="O número da porta em que o seu servidor (S)FTP escuta. Normalmente é 21 para FTP e 22 para SFTP. Em caso de dúvida, contacte o seu fornecedor de alojamento."
SOLO_SETUP_LBL_FS_FTP_SSL="Utilizar SSL"
SOLO_SETUP_LBL_FS_FTP_SSL_HELP="Aplicável apenas para FTP, ignorado para SFTP. Quando seleccionado, o Akeeba Solo utilizará FTP sobre SSL Explícito (FTP/S). Note que isto não deve ser confundido com SFTP, que é algo completamente diferente."
SOLO_SETUP_LBL_FS_FTP_USERNAME="Nome de utilizador (S)FTP"
SOLO_SETUP_LBL_FS_FTP_USERNAME_HELP="O nome de utilizador que utiliza para ligar ao seu servidor (S)FTP. Em caso de dúvida, contacte o seu fornecedor de alojamento."
SOLO_SETUP_LBL_LIVESITE="URL para o Akeeba Solo"
SOLO_SETUP_LBL_LIVESITE_HELP="Na maioria dos servidores pode deixar este campo vazio e será determinado automaticamente. Se o seu servidor pertencer à minoria em que isto não funciona, forneça manualmente o URL para o Akeeba Solo."
SOLO_SETUP_LBL_MANUALCONFIGINSTRUCTIONS="Seleccione todo o texto abaixo e copie-o para um novo ficheiro de texto simples. Dê ao ficheiro o nome <code>config.php</code>. Em seguida, carregue-o para o directório <code>Solo/assets/private</code> dentro do directório do Akeeba Solo. Pode então começar a utilizar o Akeeba Solo normalmente."
SOLO_SETUP_LBL_RECOMMENDED="Estas definições são recomendadas para PHP de modo a garantir total compatibilidade com o Akeeba Solo. No entanto, o Akeeba Solo continuará a funcionar mesmo que as suas definições não correspondam exactamente à configuração recomendada."
SOLO_SETUP_LBL_RECOMMENDED_VALUE="Recomendado"
SOLO_SETUP_LBL_REQUIRED="Se algum destes itens não for suportado (marcado como Não), tome medidas para os corrigir. Não o fazer poderá levar a que a sua instalação do Akeeba Solo não funcione correctamente."
SOLO_SETUP_LBL_REQUIREDREDTEXT="Algumas das definições obrigatórias no seu servidor parecem ser incompatíveis com o Akeeba Solo. Pode ignorá-las e tentar prosseguir, mas o Akeeba Solo poderá não funcionar. Se não tiver a certeza do que significam e de como as pode corrigir, contacte o seu fornecedor de alojamento."
SOLO_SETUP_LBL_REQ_CONFIGJSON="Solo/assets/private/config.php com permissão de escrita"
SOLO_SETUP_LBL_REQ_DATABASE="Suporte para Base de Dados"
SOLO_SETUP_LBL_REQ_INIPARSER="Suporte para o Analisador INI"
SOLO_SETUP_LBL_REQ_JSON="Suporte para JSON"
SOLO_SETUP_LBL_REQ_MCGPCOFF="Magic Quotes GPC Desactivado"
SOLO_SETUP_LBL_REQ_PHP_VERSION="Versão PHP >= %s"
SOLO_SETUP_LBL_REQ_REGGLOBALS="Register Globals Desactivado"
SOLO_SETUP_LBL_REQ_XML="Suporte para XML"
SOLO_SETUP_LBL_REQ_ZLIB="Suporte para Compressão Zlib"
SOLO_SETUP_LBL_SESSIONTIMEOUT="Tempo limite da sessão (minutos)"
SOLO_SETUP_LBL_SESSIONTIMEOUT_HELP="Permanecerá com a sessão iniciada no Akeeba Solo durante este número de minutos desde a sua última actividade no sistema. O valor predefinido é 1440 minutos (um dia). Recomendamos que termine sempre a sessão depois de concluir a gestão do Akeeba Solo como prática de segurança padrão. Apesar desta definição, a sua sessão poderá ser terminada automaticamente se o seu IP mudar, o seu navegador for actualizado ou a cadeia de identificação do seu navegador for modificada (por exemplo, actualização do sistema operativo, actualização do Java, etc.)."
SOLO_SETUP_LBL_SETTING="Definição"
SOLO_SETUP_LBL_TIMEZONE="Fuso horário do servidor"
SOLO_SETUP_LBL_TIMEZONE_HELP="Seleccione o fuso horário mais próximo do local onde o seu servidor se encontra. É onde o seu servidor \"reside\". <em>Não</em> é necessariamente onde <em>você</em> reside."
SOLO_SETUP_LBL_TIMEZONE_WORDPRESS="Este é o fuso horário utilizado pelo WordPress. Não o pode alterar no Akeeba Backup. Tem de aceder a Definições, Geral na barra lateral do WordPress e alterá-lo aí. Se não estiver nenhum seleccionado nessa página, assumimos que é necessário utilizar o fuso horário GMT (UTC)."
SOLO_SETUP_LBL_TIMEZONE_WP="Fuso Horário do WordPress"
SOLO_SETUP_LBL_USERSETUP="Configuração de início de sessão"
SOLO_SETUP_LBL_USERSETUP_TEXT="O acesso ao Akeeba Solo está protegido por um início de sessão. Introduza abaixo os detalhes do utilizador administrador. Pode criar mais utilizadores dentro do Akeeba Solo após concluir a instalação."
SOLO_SETUP_LBL_USER_EMAIL="Endereço de correio electrónico"
SOLO_SETUP_LBL_USER_EMAIL_HELP="Introduza o seu endereço de correio electrónico. Será utilizado sempre que a sua instalação do Akeeba Solo necessite de lhe enviar uma mensagem. Este endereço de correio electrónico, bem como todas as informações do utilizador, <em>não</em> são transmitidos aos autores do Akeeba Solo."
SOLO_SETUP_LBL_USER_NAME="Nome completo"
SOLO_SETUP_LBL_USER_NAME_HELP="Introduza o seu nome completo. Será utilizado sempre que a sua instalação do Akeeba Solo necessite de lhe enviar uma mensagem."
SOLO_SETUP_LBL_USER_PASSWORD="Palavra-passe"
SOLO_SETUP_LBL_USER_PASSWORD2="Repetir Palavra-passe"
SOLO_SETUP_LBL_USER_PASSWORD2_HELP="Repita a palavra-passe que introduziu acima. Queremos garantir que não a escreveu incorrectamente por engano."
SOLO_SETUP_LBL_USER_PASSWORD_HELP="A palavra-passe que utilizará para iniciar sessão no Akeeba Solo. A palavra-passe é sensível a maiúsculas e minúsculas, o que significa que abc, Abc e ABC são três palavras-passe <em>diferentes</em>."
SOLO_SETUP_LBL_USER_USERNAME="Nome de utilizador"
SOLO_SETUP_LBL_USER_USERNAME_HELP="O nome de utilizador que utilizará para iniciar sessão no Akeeba Solo. É preferível utilizar apenas letras minúsculas a-z e números 0-9."
SOLO_SETUP_LBL_WELCOME="Antes de poder utilizar o Akeeba Solo, terá de o configurar. Este instalador web irá guiá-lo por todos os passos necessários. Nesta primeira página estamos a verificar se a configuração do seu servidor corresponde aos requisitos mínimos para o Akeeba Solo. Clique no botão <strong>Seguinte</strong> acima para prosseguir para a próxima página do instalador."
SOLO_SETUP_LBL_WELCOME_HEAD="Bem-vindo ao Akeeba Solo"
SOLO_SETUP_MSG_CONFIGNOTWRITTEN="Não foi possível guardar a configuração do Akeeba Solo no disco. Siga as instruções abaixo para a guardar manualmente. Se não o fizer, o Akeeba Solo NÃO funcionará e este instalador aparecerá novamente na próxima vez que tentar utilizá-lo."
SOLO_SETUP_MSG_CONFIGNOTWRITTEN_HEAD="O Akeeba Solo ainda não está correctamente instalado"
