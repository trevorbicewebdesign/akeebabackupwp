SOLO_SETUP_MSG_NOTICEMBLANGNOTDEFAULT="O idioma PHP mbstring não está definido como neutro. Pode ser definido localmente introduzindo <strong>php_value mbstring.language neutral</strong> no seu ficheiro <code>.htaccess</code>."
SOLO_SETUP_MSG_NOTICEMBSTRINGOVERLOAD="A sobrecarga de funções PHP mbstring está activa. Pode ser desactivada localmente introduzindo <strong>php_value mbstring.func_overload 0</strong> no seu ficheiro <code>.htaccess</code>."
