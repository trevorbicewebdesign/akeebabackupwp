COM_AKEEBA_TRANSFER_ERR_WRONGSSL="O seu sítio tem um certificado SSL inválido ou auto-assinado. Por razões de segurança, a transferência do sítio não pode prosseguir. Por favor, clique em Repor para reiniciar a transferência do sítio e utilize um URL sem <code>https://</code>. Isto é necessário quando está a tentar transferir o seu sítio antes de transferir o seu nome de domínio para o novo servidor. Em alternativa, contacte o seu fornecedor de alojamento para obter um certificado SSL válido. Mesmo um gratuito emitido pela autoridade de certificação Let's Encrypt, que não tem custos, será suficiente."
COM_AKEEBA_TRANSFER_FORCE_BODY="Está a executar o Assistente de Transferência de Sítio em Modo Forçado. Isto significa que algumas verificações de sanidade que normalmente são executadas antes da transferência do sítio não serão realizadas. Como resultado, a transferência pode sobrescrever um sítio existente, terminar num URL diferente do esperado ou simplesmente falhar. <strong>Esta é uma funcionalidade para utilizadores avançados. Por favor, não continue se não se sentir confortável com isto.</strong>"
