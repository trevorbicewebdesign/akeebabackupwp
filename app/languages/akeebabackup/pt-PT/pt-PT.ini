COM_AKEEBA_SCHEDULE_LBL_ALTCLICRON_INFO="Este método é recomendado apenas se a tarefa CRON de linha de comandos normal não for concluída. Este método utiliza internamente o método de cópia de segurança via frontend e é um pouco mais lento do que o método CLI nativo."
