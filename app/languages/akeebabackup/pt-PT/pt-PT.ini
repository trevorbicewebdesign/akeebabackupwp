COM_AKEEBA_BUADMIN_LOG_DOWNLOAD="Transferir"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD_CONFIRM="A transferência de arquivos de cópia de segurança através do browser\néstá sujeita a falhas, corrupção e truncagem de ficheiros por razões\nobjectivamente fora do nosso controlo (configuração do servidor,\nconfiguração do sítio, plugins de terceiros e configuração do browser).\n\nRecomendamos MUITO ENFATICAMENTE que transfira\narquivos de cópia de segurança exclusivamente via FTP em modo\nde transferência Binário (não utilize Auto ou ASCII;\nisso corromperá os seus arquivos de cópia de segurança)\nutilizando software como FileZilla, CyberDuck,\nWinSCP ou similar; ou através do gestor de ficheiros\ndo painel de controlo de alojamento do seu fornecedor.\n\nSe continuar com esta transferência, está a concordar expressamente\nque está a abdicar do seu direito a suporte para qualquer problema\nde transferência, extracção ou restauro de arquivo de cópia de segurança\ne compreende que tais pedidos não serão respondidos.\n\nTem a certeza de que pretende continuar?"
