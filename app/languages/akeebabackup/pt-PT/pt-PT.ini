COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_ALERTS_INFO="Se já configurou métodos de alerta na interface do webcron.org, recomendamos que escolha aqui um método de alerta e não marque a opção 'Apenas em caso de erro', para que receba sempre uma notificação quando a tarefa CRON de cópia de segurança for executada."
