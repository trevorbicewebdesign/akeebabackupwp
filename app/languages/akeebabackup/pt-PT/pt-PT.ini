COM_AKEEBA_CONFIG_ZIPCDGLUECHUNKSIZE_DESCRIPTION="Os ficheiros ZIP são compostos por uma secção de dados e uma secção de \"directório\". Essas secções são processadas em paralelo pelo Akeeba Backup e unidas durante a fase de finalização do arquivo. Este parâmetro determina a quantidade de dados que será processada de cada vez durante esta fase. Não deverá necessitar de alterar esta definição a menos que tenha graves problemas de esgotamento de memória."
