COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEAPP_TITLE="Carregar para Microsoft OneDrive (Pasta Específica da Aplicação)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEAPP_DESCRIPTION="Carrega o arquivo de cópia de segurança para o Microsoft OneDrive, na pasta específica da aplicação do Akeeba Backup (<code>Apps/Akeeba Backup</code>). Esta opção é mais limitada do que as outras opções de carregamento para OneDrive, mas é menos provável que cause problemas com algumas contas que apresentam problemas de autenticação com a outra integração que oferecemos."
COM_AKEEBA_CONFIG_ONEDRIVEAPP_DIRECTORY_TITLE="Subdirectório em <code>Apps/Akeeba Backup</code>"
COM_AKEEBA_CONFIG_ONEDRIVEAPP_DIRECTORY_DESCRIPTION="O subdirectório dentro da pasta específica da aplicação Akeeba Backup (<code>Apps/Akeeba Backup</code>) na sua unidade Microsoft OneDrive para o qual os arquivos de cópia de segurança serão carregados. Utilize barras normais (<code>/</code>), não barras invertidas (<code>\\<code>), e coloque sempre uma barra normal no início. Correcto: <code>/alguma/coisa</code>. Errado: <code>alguma\\coisa</code>. Uma única barra normal significa que os arquivos serão armazenados na raiz da unidade. NÃO inclua o caminho para a pasta específica da aplicação (<code>Apps/Akeeba Backup</code>); este é adicionado automaticamente pelo próprio Microsoft OneDrive!"

