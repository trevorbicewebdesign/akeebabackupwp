COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_DESCRIPTION="Carrega o arquivo de cópia de segurança para o Microsoft OneDrive ou Microsoft OneDrive para Empresas."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_TITLE="Carregar para o Microsoft OneDrive ou OneDrive para Empresas"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_DESCRIPTION="Carrega o arquivo de cópia de segurança para o Microsoft OneDrive. Suporta apenas unidades pessoais, criadas com a sua conta Microsoft pessoal. Não suporta o OneDrive para Empresas nem contas OneDrive criadas através de uma conta escolar/profissional ou de uma subscrição do Microsoft Office 365. Este método de carregamento será REMOVIDO numa versão futura do Akeeba Backup. Utilize o método Carregar para o Microsoft OneDrive em alternativa."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_TITLE="Carregar para o Microsoft OneDrive (LEGADO)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_DESCRIPTION="Carrega o arquivo de cópia de segurança para o OVH Object Storage. <br/><strong>Lembre-se de definir um tamanho de arquivo dividido de 2-30 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_TITLE="Carregar para o OVH Object Storage"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_DESCRIPTION="Carrega o arquivo de cópia de segurança para o Amazon S3. Permite utilizar tanto a autenticação nova (AWS4), necessária para localizações S3 mais recentes, como a autenticação antiga (AWS2), necessária para fornecedores de armazenamento de terceiros que oferecem uma API compatível com S3.<br/><strong>Se desactivar os carregamentos multipart, lembre-se de definir um tamanho de arquivo dividido de 2-30 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos!</strong><br/>Se pretender utilizar o Amazon STS em vez de uma Chave de Acesso e Chave Secreta, leia a documentação."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_TITLE="Carregar para o Amazon S3"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_DESCRIPTION="Carrega o arquivo de cópia de segurança para um servidor SFTP (SSH) remoto. Trata-se de uma transferência de ficheiros sobre SSH usando um protocolo denominado SFTP, que é <em>completamente diferente</em> do FTP e do FTPS.<br/>Este motor de pós-processamento utiliza cURL para a transferência de dados, uma biblioteca compatível com uma vasta gama de servidores SFTP.<br/><strong>Lembre-se de definir um tamanho de arquivo dividido de 2-30 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_TITLE="Carregar para servidor SFTP (SSH) remoto usando cURL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_DESCRIPTION="Carrega o arquivo de cópia de segurança para um servidor SFTP (SSH) remoto. Trata-se de uma transferência de ficheiros sobre SSH usando um protocolo denominado SFTP, que é <em>completamente diferente</em> do FTP e do FTPS.<br/><strong>Lembre-se de definir um tamanho de arquivo dividido de 2-30 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_TITLE="Carregar para servidor SFTP (SSH) remoto"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_DESCRIPTION="Carrega o arquivo de cópia de segurança para o SugarSync.<br/><strong>Lembre-se de definir um tamanho de arquivo dividido de 2-30 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_TITLE="Carregar para o SugarSync"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SWIFT_TITLE="Carregar para o armazenamento de objectos OpenStack Swift"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_DESCRIPTION="Carrega o arquivo de cópia de segurança para qualquer serviço de armazenamento que suporte o protocolo WebDAV.<br/><strong>Lembre-se de definir um tamanho de arquivo dividido de 2-30 MB ou arrisca falha na cópia de segurança devido a tempos limite excedidos!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_TITLE="Carregar usando WebDAV"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_DESCRIPTION="Um analisador de ficheiros optimizado para fazer cópia de segurança de sítios com directórios que contêm centenas de ficheiros (por ex., blogues e portais de notícias)"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_TITLE="Analisador para Sítios de Grande Dimensão"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_DESCRIPTION="Equilibra de forma inteligente a velocidade de análise e a prevenção de tempos limite excedidos"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_TITLE="Analisador inteligente"
COM_AKEEBA_CONFIG_ERR_DECRYPTION="Não foi possível desencriptar as definições. O seu servidor não suporta encriptação de definições ou o ficheiro de chave de encriptação foi modificado ou eliminado."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_DESCRIPTION="Se activado, o ficheiro de exportação da base de dados será composto por instruções INSERT extendidas, ou seja, uma única instrução para restaurar múltiplas linhas de dados. É altamente recomendado manter esta opção activada, pois acelera o processo de restauro e contorna os limites de quota de consultas em servidores mais restritivos."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_TITLE="Gerar INSERTs extendidos"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_DESC="Enviar correio electrónico para este endereço (deixe em branco para desactivar esta funcionalidade)"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_LABEL="Endereço de correio electrónico"
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_DESC="Deixe em branco para usar o predefinido. Pode utilizar todas as variáveis do Solo que pode usar para nomear ficheiros de arquivo, por ex. [HOST] e [DATE]."
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_LABEL="Corpo do Correio Electrónico"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_DESC="Deixe em branco para usar o predefinido. Pode utilizar todas as variáveis do Solo que pode usar para nomear ficheiros de arquivo, por ex. [HOST] e [DATE]"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_LABEL="Assunto do Correio Electrónico"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_DESC="Uma cópia de segurança será considerada bloqueada (falhada) após este número de segundos de inactividade.<br/><strong>NÃO ALTERE ESTE VALOR A MENOS QUE SAIBA O QUE ESTÁ A FAZER!</strong>"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_LABEL="Tempo limite de cópia de segurança bloqueada"
COM_AKEEBA_CONFIG_FEEMAILBODY_DESC="Deixe em branco para usar o predefinido. Pode utilizar todas as variáveis do Akeeba Backup que pode usar para nomear ficheiros de arquivo, por ex. [HOST] e [DATE]. Pode também utilizar [PROFILENUMBER] para o número do perfil actual, [PROFILENAME] para o nome do perfil actual, [PARTCOUNT] para o número total de partes do arquivo de cópia de segurança geradas, [FILELIST] para uma lista das partes do arquivo de cópia de segurança e [REMOTESTATUS] para indicar se o carregamento para armazenamento remoto foi concluído com êxito."
COM_AKEEBA_CONFIG_FEEMAILBODY_LABEL="Corpo do Correio Electrónico"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_DESC="Deixe em branco para usar o predefinido. Pode utilizar todas as variáveis do Akeeba Backup que pode usar para nomear ficheiros de arquivo, por ex. [HOST] e [DATE]"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_LABEL="Assunto do Correio Electrónico"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT="Usar fuso horário do servidor"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULTGROUP="Predefinições"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT_WORDPRESS="Usar fuso horário do WordPress"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DESC="A data e hora da cópia de segurança —tal como registada no nome do ficheiro, na descrição predefinida e nos e-mails— será expressa neste fuso horário. Esta opção afecta todas as origens de cópia de segurança, ou seja, todas as cópias de segurança, independentemente de como são efectuadas (através do próprio Akeeba Backup, da API JSON remota, etc.)."
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_LABEL="Fuso horário da cópia de segurança"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_WP_DESC="A data e hora da cópia de segurança —tal como registada no nome do ficheiro, na descrição predefinida e nos e-mails— será expressa neste fuso horário. Esta opção afecta todas as origens de cópia de segurança, ou seja, todas as cópias de segurança, independentemente de como são efectuadas (através do próprio Akeeba Backup, da API JSON remota, etc.).<br>Tenha em atenção que a opção «Usar fuso horário do WordPress» NÃO funcionará correctamente quando estiver a efectuar cópias de segurança utilizando: a. o URL legado de cópia de segurança via frontend ou a API JSON do Akeeba Backup se estiver a usar os URLs de ponto de acesso antigos (que usavam index.php ou remote.php em vez de wp-cron.php); e b. os scripts CLI de cópia de segurança (<em>não</em> WP-CLI). Nestes casos, a cópia de segurança é tecnicamente executada fora do WordPress, pelo que não existe «fuso horário do WordPress»; a cópia de segurança utilizará então o fuso horário GMT. Por este motivo, é fortemente aconselhável definir esta opção para o seu fuso horário local."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_DESC="Enviar um e-mail de notificação após efectuar uma cópia de segurança com a funcionalidade de Cópia de Segurança via Frontend (API Legada) ou API JSON."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_LABEL="Correio electrónico na conclusão da cópia de segurança"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_ALWAYS="Sempre"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_DESC="Quando devo enviar o correio electrónico na conclusão da cópia de segurança? Sempre significa cada vez que uma cópia de segurança é concluída. Carregamento Falhado significa que o correio electrónico só é enviado se a cópia de segurança estiver concluída mas o carregamento para armazenamento remoto não tiver sido concluído com êxito. Se a cópia de segurança falhar, nenhum correio electrónico pode ser enviado por esta funcionalidade; consulte a página Agendar Cópias de Segurança Automáticas para obter informações sobre como receber correio electrónico acerca de cópias de segurança falhadas."
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_FAILEDUPLOAD="Carregamento Falhado"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_LABEL="Quando enviar o correio electrónico"
COM_AKEEBA_CONFIG_FTPTEST_BADPREFIX="NÃO deve adicionar o prefixo ftp:// ao Nome do Servidor FTP. Remova o prefixo ftp:// e tente novamente."
COM_AKEEBA_CONFIG_FTPTEST_NOUPLOAD="O Akeeba Backup conseguiu ligar ao seu servidor, mas não conseguiu carregar um ficheiro de teste. O carregamento da cópia de segurança poderá falhar."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_DESCRIPTION="Preenchido automaticamente quando concluir o passo 1 de autenticação acima. Se estiver a ligar outro sítio à mesma conta do Google Drive, NÃO copie o token de acesso e NÃO execute a autenticação. Em vez disso, copie simplesmente o Token de Actualização do sítio anterior para este."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_TITLE="Token de Acesso"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_DESCRIPTION="O directório dentro do Google Drive onde serão armazenados os arquivos de cópia de segurança. Utilize barras oblíquas. Correcto: alguma/coisa. Errado: alguma\coisa. Uma única barra oblíqua significa que os arquivos serão armazenados na raiz da unidade. LEIA A DOCUMENTAÇÃO: Os caminhos no Google Drive são ambíguos!"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTEAMDRIVES_TITLE="Recarregar a lista de Unidades"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTOKEN_TITLE="Token de Actualização"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_DESCRIPTION="Qual o Google Drive onde pretende armazenar os seus ficheiros. É necessário concluir a autenticação antes de esta lista ser preenchida. Só faz sentido quando tem acesso ao Google Team Drives (por ex., utilizadores do plano empresarial ou corporativo do G Suite). Se não tiver a certeza, use a opção «Google Drive (pessoal)»."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_OPT_PERSONAL="Google Drive (pessoal)"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_TITLE="Unidade"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_TITLE="Carregar para pastas «Partilhado Comigo»"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_DESCRIPTION="Quando activado, o Akeeba Backup procurará pastas na colecção «Partilhado Comigo» antes de procurar uma pasta com o mesmo nome na sua Unidade. Isto é muito mais lento e pode levar ao carregamento para a pasta errada se existirem várias pastas partilhadas com o mesmo nome na sua conta do Google Drive."
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_DESCRIPTION="A sua Chave de Acesso do Google Storage, disponibilizada na ferramenta de gestão de chaves do Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_TITLE="Chave de Acesso"
COM_AKEEBA_CONFIG_GOOGLESTORAGEBUCKET_DESCRIPTION="O nome do seu bucket do Google Storage. Certifique-se de que é escrito conforme indicado na aplicação web do navegador do Google Cloud Storage (https://sandbox.google.com/storage)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEBUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_DESCRIPTION="O directório dentro do seu bucket onde os arquivos de cópia de segurança serão armazenados. Deixe em branco para guardar os ficheiros na raiz do bucket."
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_DESC="Cole aqui o conteúdo do ficheiro de credenciais JSON produzido pela Google Cloud Console ao configurar a Conta de Serviço para o software de cópia de segurança. Lembre-se de incluir as chavetas no início e no fim do texto."
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_TITLE="Conteúdo do googlestorage.json (leia a documentação)"
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_DESCRIPTION="Se activado, o Akeeba Backup tentará converter o nome do bucket para letras minúsculas, ou seja, MyBucket será convertido para mybucket. Se criou um bucket com letras maiúsculas, por ex. MyNewBucket, desmarque esta opção e certifique-se de que o nome do bucket está escrito exactamente como aparece no navegador web do Google Cloud Storage (https://sandbox.google.com/storage)."
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_TITLE="Nome do bucket em minúsculas"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_DESCRIPTION="A sua Chave Secreta do Google Storage, disponibilizada através da ferramenta de gestão de chaves do Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_TITLE="Chave Secreta"
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_DESCRIPTION="Se activado, será utilizada uma ligação segura (HTTPS) ao carregar os ficheiros. Embora aumente a segurança dos dados transferidos, também aumenta a possibilidade de falha da cópia de segurança por esgotamento do tempo limite."
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_TITLE="Utilizar SSL"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_COLDLINE="Armazenamento Coldline"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_DESCRIPTION="Altere a classe de armazenamento dos arquivos de cópia de segurança carregados. «Nenhum» significa que os ficheiros serão armazenados com a classe de armazenamento predefinida especificada no seu bucket. Tenha em atenção que as opções diferentes de Standard podem ser mais económicas para armazenar, mas podem incorrer em custos adicionais se os descarregar ou apagar. Consulte a Google para informações sobre preços."
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NEARLINE="Armazenamento Nearline"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NONE="Nenhum (deixar o bucket decidir)"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_STANDARD="Armazenamento Standard"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_TITLE="Classe de Armazenamento"
COM_AKEEBA_CONFIG_HEADER_BASIC="Configuração Básica"
COM_AKEEBA_CONFIG_HEADER_CONFWIZ="Deixar o Akeeba Backup configurar-se automaticamente?"
COM_AKEEBA_CONFIG_HEADER_OPTIONALFILTERS="Filtros opcionais"
COM_AKEEBA_CONFIG_HEADER_QUOTA="Gestão de quotas"
COM_AKEEBA_CONFIG_HEADER_TUNING="Ajuste fino"
COM_AKEEBA_CONFIG_INSTALLER_DESCRIPTION="Ao efectuar uma cópia de segurança completa do sítio, o Akeeba Backup incorpora no arquivo o script de restauro aqui definido. Isto permite restaurar o sítio a partir do zero, sem ter de instalar o CMS ou o Akeeba Backup, mesmo quando o sítio ou servidor estiver completamente destruído"
COM_AKEEBA_CONFIG_INSTALLER_TITLE="Script de restauro incorporado"
COM_AKEEBA_CONFIG_JPS_KEY_DESCRIPTION="Esta chave será utilizada para encriptar o conteúdo do arquivo. A chave é sensível a maiúsculas e minúsculas, ou seja, ABC, abc e Abc são três palavras-passe diferentes. Guarde uma cópia da palavra-passe num local seguro! Se a perder, não há forma de a recuperar."
COM_AKEEBA_CONFIG_JPS_KEY_TITLE="Chave de encriptação"
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_DESCRIPTION="Quando activado (predefinição), a palavra-passe será expandida para uma chave criptográfica utilizada em todo o arquivo. Isto é rápido, mas no caso muito improvável de um atacante com recursos suficientes conseguir fazer engenharia inversa da chave criptográfica a partir de um bloco encriptado no ficheiro — sem forçar a sua palavra-passe —, poderá desencriptar o arquivo de cópia de segurança inteiro. Quando desactivado, uma chave criptográfica diferente será derivada da sua palavra-passe em cada bloco encriptado, o que é MUITO mais lento mas protege contra este tipo de ataque, exigindo que o atacante force a palavra-passe por força bruta, o que é muito mais lento."
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_TITLE="Expansão de chave a nível do arquivo"
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_DESC="A JSON API do Akeeba Backup permite-lhe realizar e gerir cópias de segurança, bem como gerir as opções do Akeeba Backup remotamente. Precisa de activar esta opção se planeia realizar, transferir ou gerir cópias de segurança, por exemplo com o Akeeba Remote CLI, o Akeeba UNiTE e serviços de agendamento de cópias de segurança.<br><br><strong>Nota de segurança:</strong> a JSON API é autenticada apenas pela Chave Secreta. Não está envolvida qualquer conta de utilizador, pelo que nenhuma das permissões que define no gestor de utilizadores se lhe aplica: quem a detém obtém todos os métodos da API, sem qualquer limite. Pode ler, criar, transferir e eliminar cópias de segurança e alterar todas as opções, o que na prática equivale a deter a sua palavra-passe de administrador. Active-a apenas quando precisar realmente dela e use uma Chave Secreta longa e aleatória."
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_LABEL="Activar JSON API (cópia de segurança remota)"
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_DESCRIPTION="Quando um directório contém mais do que este número de ficheiros ou directórios, é considerado «grande». Por isso, o Akeeba Backup tentará reanalisá-lo no passo seguinte para evitar esgotamentos do tempo limite durante a cópia de segurança. Um valor demasiado pequeno fará com que a cópia de segurança abrande consideravelmente. Aumente — a não ser que obtenha erros de tempo limite — para acelerar a cópia de segurança."
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_TITLE="Limiar de directório grande"
COM_AKEEBA_CONFIG_LARGEFILE_DESCRIPTION="Os ficheiros maiores do que este limiar serão compactados no seu próprio passo para evitar a possibilidade de esgotamento do tempo limite. Valores entre 2 e 10 MB funcionam melhor na maioria dos servidores."
COM_AKEEBA_CONFIG_LARGEFILE_TITLE="Limiar de ficheiro grande"
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_DESCRIPTION="Quantos directórios analisar em cada passo. Definição recomendada: 50. Valores maiores tornam a cópia de segurança marginalmente mais rápida, mas com maior probabilidade de esgotamento do tempo limite."
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_TITLE="Tamanho do lote de análise de directórios"
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_DESCRIPTION="Quantos ficheiros analisar e comprimir em cada passo. Definição recomendada: 100. Valores maiores tornam a cópia de segurança marginalmente mais rápida, mas com maior probabilidade de esgotamento do tempo limite ou de falta de memória."
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_TITLE="Tamanho do lote de análise de ficheiros"
COM_AKEEBA_CONFIG_LBL_CONFWIZ_AFTER="Após o Akeeba Backup concluir a sua configuração automática, pode efectuar uma cópia de segurança ou ajustar manualmente a configuração."
COM_AKEEBA_CONFIG_LBL_CONFWIZ_INTRO="Parece que ainda não configurou o Akeeba Backup. Clique no botão Assistente de Configuração abaixo para deixá-lo configurar-se automaticamente."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_DESC="A API de Cópia de Segurança via Frontend Legada permite efectuar cópias de segurança agendadas utilizando ferramentas de acesso por URL como wget ou curl. É necessário activar esta opção se planeia efectuar cópias de segurança com o servidor CRON do seu alojamento usando wget ou curl; ou quando planeia utilizar um serviço CRON de terceiros como o WebCRON.org. Sempre que possível, recomendamos utilizar o script CRON CLI Nativo ou a JSON API do Akeeba Backup, pois são opções muito mais seguras."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_LABEL="Activar API de Cópia de Segurança via Frontend Legada (tarefas CRON remotas)"
COM_AKEEBA_CONFIG_LOGLEVEL_DEBUG="Toda a informação e depuração"
COM_AKEEBA_CONFIG_LOGLEVEL_DESCRIPTION="Esta opção determina o nível de detalhe do registo de cópia de segurança."
COM_AKEEBA_CONFIG_LOGLEVEL_ERROR="Apenas erros"
COM_AKEEBA_CONFIG_LOGLEVEL_INFO="Toda a informação"
COM_AKEEBA_CONFIG_LOGLEVEL_NONE="Nenhum"
COM_AKEEBA_CONFIG_LOGLEVEL_TITLE="Nível de Registo"
COM_AKEEBA_CONFIG_LOGLEVEL_WARNING="Erros e avisos"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_DESCRIPTION="Remover automaticamente cópias de segurança antigas com base no dia em que foram efectuadas. AVISO: ACTIVAR ESTA OPÇÃO FAZ COM QUE TODAS AS OUTRAS DEFINIÇÕES DE QUOTA (NÚMERO E TAMANHO) SEJAM IGNORADAS."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_TITLE="Activar quotas de idade máxima da cópia de segurança"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_DESCRIPTION="As cópias de segurança efectuadas neste dia do mês não serão apagadas. Mantenha a definição predefinida, 1, para preservar sempre as cópias de segurança efectuadas no dia 1 do mês"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_TITLE="Não apagar cópias de segurança efectuadas neste dia do mês"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_DESCRIPTION="As cópias de segurança com mais de este número de dias serão automaticamente apagadas. Mantenha a definição predefinida, 31, para conservar todas as cópias de segurança do último mês"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_TITLE="Idade máxima da cópia de segurança, em dias"
COM_AKEEBA_CONFIG_MAXEXECTIME_DESCRIPTION="Cada passo do Akeeba Backup durará <i>no máximo</i> o tempo aqui definido. Utilize um valor inferior ao tempo máximo de execução do PHP. Normalmente, definir isto para 10 segundos é adequado, excepto em servidores muito restritivos.<b>Sugestão</b>: Seleccione Personalizado e introduza o valor pretendido se não estiver na lista."
COM_AKEEBA_CONFIG_MAXEXECTIME_TITLE="Tempo máximo de execução"
COM_AKEEBA_CONFIG_MAXPACKET_DESCRIPTION="O tamanho máximo, em bytes, de cada instrução INSERT extendida. Recomenda-se que seja suficientemente baixo para que o MySQL não devolva um erro ao restaurar a exportação da base de dados."
COM_AKEEBA_CONFIG_MAXPACKET_TITLE="Tamanho máximo de pacote para INSERTs extendidos"
COM_AKEEBA_CONFIG_MINEXECTIME_DESCRIPTION="Cada passo do Akeeba Backup durará <i>no mínimo</i> o tempo aqui definido. Isto é necessário para contornar soluções de segurança anti-DoS. Se obtiver erros 403 Proibido ou erros AJAX, aumente esta definição. Definir como 0 desactiva esta funcionalidade.<br/><br/><b>Sugestão</b>: Seleccione Personalizado e introduza o valor pretendido se não estiver na lista."
COM_AKEEBA_CONFIG_MINEXECTIME_TITLE="Tempo mínimo de execução"
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_DESCRIPTION="Quando activado, o Akeeba Backup tentará exportar estas entidades avançadas da base de dados MySQL 5. Se a cópia de segurança ficar suspensa durante a fase de cópia de segurança, pode ter de desactivar esta opção."
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_TITLE="Exportar PROCEDUREs, FUNCTIONs e TRIGGERs"
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TIP="Remove USING BTREE e USING HASH das definições de índice de tabelas nos ficheiros de exportação. Isto é necessário para restaurar em servidores que tenham um dos motores de indexação desactivado (por ex. nas versões mais recentes do XAMPP). AVISO! ISTO PODE CAUSAR PROBLEMAS DE RESTAURO EM ALGUNS SERVIDORES."
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TITLE="Ignorar motor de índice"
COM_AKEEBA_CONFIG_NODEPENDENCIES_DESCRIPTION="Quando activado, o Akeeba Backup não rastreará dependências entre tabelas e vistas. Utilize apenas quando tiver centenas de tabelas na base de dados e não estiver a utilizar VIEWs, FUNCTIONs, PROCEDUREs, TRIGGERs do MySQL ou tabelas com os motores (extremamente raramente utilizados) TEMPORARY, MEMORY, MERGE ou FEDERATED."
COM_AKEEBA_CONFIG_NODEPENDENCIES_TITLE="Sem rastreio de dependências"
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_DESCRIPTION="Número total de registos obsoletos (cópias de segurança cujos ficheiros foram apagados) a manter na página Gerir Cópias de Segurança. Defina como 0 para sem limite."
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_TITLE="Registos obsoletos a manter"
COM_AKEEBA_CONFIG_LOGFILES_TITLE="Apagar ficheiros de registo obsoletos"
COM_AKEEBA_CONFIG_LOGFILES_DESCRIPTION="Apaga automaticamente os ficheiros de registo de registos de cópia de segurança bem-sucedidos. O ficheiro de registo do registo de cópia de segurança mais recente participa nos cálculos, mas nunca é removido. Se o perfil de cópia de segurança tiver um motor de pós-processamento diferente de Nenhum ou Enviar por E-mail, apenas os registos com o estado de cópia de segurança Remota participam nesta definição de quota de ficheiros de registo. Se o perfil de cópia de segurança tiver o motor de pós-processamento Nenhum ou Enviar por E-mail, apenas os registos com o estado OK ou Remota participam nesta definição de quota de ficheiros de registo. Esta funcionalidade é executada após a quota de registos obsoletos; a quota de registos obsoletos também pode remover ficheiros de registo antigos."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_TITLE="Tipo de quota de ficheiros de registo obsoletos"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DESCRIPTION="Escolha o método utilizado para determinar quais os ficheiros de registo antigos a remover."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_SIZE="Tamanho Máximo"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_COUNT="Número"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DAYS="Idade Máxima"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_TITLE="Número de ficheiros de registo"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_DESCRIPTION="Quantos ficheiros de registo manter. O ficheiro de registo da cópia de segurança mais recente pode participar na contagem, mas nunca será apagado. Apenas os ficheiros de registo de registos de cópia de segurança bem-sucedidos serão considerados para remoção."
COM_AKEEBA_CONFIG_LOGFILES_SIZE_TITLE="Tamanho dos ficheiros de registo (Megabytes)"
COM_AKEEBA_CONFIG_LOGFILES_SIZE_DESCRIPTION="O tamanho total máximo dos ficheiros de registo a manter. O ficheiro de registo da cópia de segurança mais recente pode participar no cálculo, mas nunca será apagado. Apenas os ficheiros de registo de registos de cópia de segurança bem-sucedidos serão considerados para remoção."
COM_AKEEBA_CONFIG_LOGFILES_DAYS_TITLE="Antiguidade dos ficheiros de registo (dias)"
COM_AKEEBA_CONFIG_LOGFILES_DAYS_DESCRIPTION="A antiguidade máxima em dias dos ficheiros de registo a manter. O ficheiro de registo da cópia de segurança mais recente nunca será apagado. Apenas os ficheiros de registo de registos de cópias de segurança bem-sucedidas serão considerados para remoção."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_DESCRIPTION="Preenchido automaticamente quando conclui o Passo 1 de autenticação acima. NÃO partilhe o mesmo token em vários sítios. Em vez disso, autentique cada sítio separadamente."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_TITLE="Token de Acesso"
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_DESCRIPTION="O directório dentro da unidade Microsoft OneDrive onde serão armazenados os arquivos de cópia de segurança. Por favor, utilize barras oblíquas e não barras invertidas, e coloque sempre uma barra oblíqua no início. Correcto: /alguma/coisa. Errado: alguma\coisa. Uma única barra oblíqua significa que os arquivos serão armazenados na raiz da unidade."
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_DESCRIPTION="Escolha qual a Unidade (OneDrive Personal, OneDrive for Business ou SharePoint) à qual a sua conta tem acesso e que será utilizada para armazenar as cópias de segurança. É necessário concluir a autenticação antes de esta lista ser preenchida. Só faz sentido quando tem acesso a mais do que uma unidade OneDrive (por exemplo, a sua conta Microsoft faz parte da subscrição de uma organização). Em caso de dúvida, utilize a opção «Unidade Predefinida» que usa a sua unidade pessoal predefinida — normalmente equivalente à primeira opção «Unidade (OneDrive Personal)» que vê abaixo."
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_OPT_PERSONAL="Unidade Predefinida"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_TITLE="Unidade"
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_DESCRIPTION="Preenchido automaticamente quando conclui o Passo 1 de autenticação acima. NÃO partilhe o mesmo token em vários sítios. Em vez disso, autentique cada sítio separadamente."
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_TITLE="Token de Actualização"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_DESCRIPTION="Este filtro apenas se aplica se estiver a tentar fazer uma cópia de segurança de uma instalação Joomla!, por exemplo, um sítio Joomla! num subdirectório / subdomínio do seu sítio. No Joomla! 3.9 e versões posteriores, as acções dos utilizadores são registadas na base de dados, criando uma tabela com milhões de linhas e tornando a cópia de segurança mais lenta. Marque esta opção para excluir esses dados."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_TITLE="Registo de Acções de Utilizadores do Joomla!"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_DESCRIPTION="Quando activado, apenas os ficheiros modificados após uma data e hora específicas serão incluídos na cópia de segurança."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_TITLE="Filtro condicional por data"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_DESCRIPTION="O Akeeba Backup incluirá na cópia de segurança os ficheiros modificados após esta data e hora. O formato é AAAA-MM-DD hh:mm:ss. Todas as datas e horas são expressas no fuso horário do seu servidor."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_TITLE="Incluir ficheiros modificados após"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_DESCRIPTION="Exclui automaticamente ficheiros de registo de erros, por exemplo <code>error_log</code>, independentemente do local onde se encontrem no sítio a ser submetido a cópia de segurança. Estes ficheiros alteram o seu tamanho durante a cópia de segurança, o que pode resultar em arquivos corrompidos."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_TITLE="Excluir registos de erros"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_DESCRIPTION="Quando activado, o Akeeba Backup excluirá automaticamente as pastas específicas do servidor de alojamento mais comuns para armazenar estatísticas de acesso ao seu sítio. Estas pastas são de apenas leitura para o utilizador do sítio web, o que pode causar problemas durante o restauro se forem incluídas na cópia de segurança."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_TITLE="Excluir pastas de estatísticas específicas do servidor"
COM_AKEEBA_CONFIG_OUTDIR_DESCRIPTION="Este é o directório no seu servidor onde o Akeeba Backup armazenará os arquivos de cópia de segurança e o ficheiro de registo da cópia de segurança. Pode utilizar as seguintes macros:<ul><li><b>[DEFAULT_OUTPUT]</b> O directório de saída predefinido</li><li><b>[SITEROOT]</b> O directório raiz do seu sítio</li><li><b>[ROOTPARENT]</b> O directório imediatamente acima da raiz do seu sítio</li></ul>"
COM_AKEEBA_CONFIG_OUTDIR_TITLE="Directório de Saída"
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_DESCRIPTION="ISTO NÃO É O NOME DO CONTENTOR DE ARMAZENAMENTO! Aceda ao seu gestor de nuvem OVH, Servidores, expanda o seu servidor, clique em Armazenamento. Verá o URL do Contentor indicado acima da lista de ficheiros. Copie-o aqui."
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_TITLE="URL do Contentor"
COM_AKEEBA_CONFIG_OVH_DIRECTORY_DESCRIPTION="O directório dentro do contentor de armazenamento de objectos OVH onde serão armazenados os arquivos de cópia de segurança. Para armazenar tudo na raiz do contentor, deixe em branco."
COM_AKEEBA_CONFIG_OVH_DIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_OVH_PASSWORD_DESCRIPTION="ISTO NÃO É A SUA PALAVRA-PASSE DE INÍCIO DE SESSÃO OVH! Crie um utilizador a partir do seu gestor de nuvem OVH, Servidores, expanda o seu servidor, clique em OpenStack, clique em Adicionar Utilizador. Copie a Palavra-passe do utilizador criado aqui."
COM_AKEEBA_CONFIG_OVH_PASSWORD_TITLE="Palavra-passe OpenStack"
COM_AKEEBA_CONFIG_OVH_PROJECTID_DESCRIPTION="O ID do projecto do seu servidor de nuvem OVH. No gestor de nuvem OVH, expanda o seu Servidor e clique na ligação Armazenamento. Na área principal da página, vê o nome do servidor e imediatamente abaixo existe uma cadeia alfanumérica de 32 caracteres, como a0b1c2d3e4f56789abcdef0123456789. Este é o ID de Projecto que precisa de introduzir aqui."
COM_AKEEBA_CONFIG_OVH_PROJECTID_TITLE="ID do Projecto"
COM_AKEEBA_CONFIG_OVH_USERNAME_DESCRIPTION="ISTO NÃO É O SEU NOME DE UTILIZADOR DE INÍCIO DE SESSÃO OVH! Crie um utilizador a partir do seu gestor de nuvem OVH, Servidores, expanda o seu servidor, clique em OpenStack, clique em Adicionar Utilizador. Copie o ID do utilizador criado aqui."
COM_AKEEBA_CONFIG_OVH_USERNAME_TITLE="Nome de Utilizador OpenStack"
COM_AKEEBA_CONFIG_PARTSIZE_DESCRIPTION="O Akeeba Backup pode criar arquivos divididos (multi-parte) de forma a contornar restrições de tamanho em diversas circunstâncias. Esta opção define o tamanho máximo de cada parte do arquivo. Se reduzir para 0, a funcionalidade multi-parte é desactivada.</br><b>Importante:</b>Se estiver a utilizar um motor de processamento de dados que transfere arquivos para uma localização remota (por exemplo, armazenamento na nuvem), utilize um valor entre 1 e 5 MB para resultados óptimos."
COM_AKEEBA_CONFIG_PARTSIZE_TITLE="Tamanho de parte para arquivos divididos"
COM_AKEEBA_CONFIG_PERMISSIONS_0600="0600 – Segurança elevada. Pode causar problemas em servidores de baixo desempenho"
COM_AKEEBA_CONFIG_PERMISSIONS_0644="0644 – Segurança média, para utilização em servidores de sítio único"
COM_AKEEBA_CONFIG_PERMISSIONS_0666="0666 – Segurança reduzida, compatibilidade máxima com servidores de alojamento comercial"
COM_AKEEBA_CONFIG_PERMISSIONS_DESCRIPTION="Define as permissões de ficheiro para os arquivos de cópia de segurança. Aplica-se apenas em Linux, macOS, BSD e outros servidores do tipo UNIX (NÃO Windows). Em caso de dúvida, deixe como 0666. Alterar este valor pode impossibilitar a transferência e/ou eliminação de arquivos de cópia de segurança via FTP e SFTP. Se o seu servidor utilizar PHP-FPM ou executar o PHP sob o mesmo utilizador que a conta do sistema do seu sítio, utilize 0600 para maior segurança."
COM_AKEEBA_CONFIG_PERMISSIONS_TITLE="Permissões do arquivo"
COM_AKEEBA_CONFIG_PGDUMP_PATH_DESCRIPTION="O caminho absoluto no sistema de ficheiros para a ferramenta de linha de comandos pg_dump no seu servidor. Se for deixado vazio, o Akeeba Backup tentará detectá-lo automaticamente."
COM_AKEEBA_CONFIG_PGDUMP_PATH_TITLE="Caminho para o pg_dump"
COM_AKEEBA_CONFIG_PLATFORM="Substituições do sítio"
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_DESCRIPTION="Se activado, o Akeeba Backup tentará ligar ao seu servidor FTP utilizando uma ligação encriptada com SSL. <strong>Isto não é o mesmo que SFTP, SCP ou «FTP Seguro»!</strong> Tenha em atenção que, se o seu servidor não suportar este método, obterá erros de ligação."
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_TITLE="Utilizar FTP sobre SSL (FTPS)"
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_DESCRIPTION="Nome do servidor FTP, sem o protocolo. Isto significa que <tt>ftp://example.com</tt> é <b>inválido</b> e <tt>example.com</tt> é válido. Este motor apenas suporta servidores FTP e FTPS. <u>Não</u> suporta SFTP, SCP e outras variantes SSH."
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_TITLE="Nome do servidor"
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_DESCRIPTION="O caminho <b>FTP</b> absoluto para o directório onde os ficheiros serão carregados. Em caso de dúvida, ligue ao seu servidor com o FileZilla, navegue até ao directório pretendido e copie o caminho que aparece no painel direito acima da lista de directórios. Normalmente é algo curto, como <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_TITLE="Directório inicial"
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_DESCRIPTION="O caminho relativo para o directório inicial; será criado se não existir. Deixe em branco para carregar os arquivos directamente dentro do directório inicial. Pode utilizar as seguintes macros:<ul><li><b>[HOST]</b> O nome do servidor. ATENÇÃO! Esta macro não funciona no modo CRON.</li><li><b>[DATE]</b> Data actual</li><li><b>[TIME]</b> Hora actual</li></ul>Estão disponíveis mais macros; consulte a documentação."
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_TITLE="Subdirectório"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_DESCRIPTION="Utiliza o modo passivo FTP ao transferir dados. Esta opção está activada por predefinição, pois é o único método que funciona através de firewalls normalmente instaladas em servidores web. Não desactive a menos que tenha a certeza de que o seu servidor web não está protegido por uma firewall e de que o seu servidor FTP requer absolutamente transferências de ficheiros em modo activo."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_TITLE="Utilizar modo passivo"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_DESCRIPTION="Palavra-passe do servidor FTP. Normalmente é sensível a maiúsculas e minúsculas. Em caso de dúvida, contacte o administrador da sua rede."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_TITLE="Palavra-passe"
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_DESCRIPTION="Porta do servidor FTP. A definição mais comum é 21. Em caso de dúvida, contacte o administrador da sua rede."
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_TITLE="Porta"
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_DESCRIPTION="Utilize este botão para testar a ligação FTP e ver os erros de ligação em caso de falha."
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_TITLE="Testar ligação FTP"
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_DESCRIPTION="Nome de utilizador do servidor FTP. Normalmente é sensível a maiúsculas e minúsculas. Em caso de dúvida, contacte o administrador da sua rede."
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_TITLE="Nome de utilizador"
COM_AKEEBA_CONFIG_POSTPROCPARTS_DESCRIPTION="Quando activado, o Akeeba Backup executará o motor de pós-processamento em cada parte assim que estiver concluída. Quando desactivado, o Akeeba Backup executará o pós-processamento de todas as partes no final do processo de cópia de segurança."
COM_AKEEBA_CONFIG_POSTPROCPARTS_TITLE="Processar cada parte imediatamente"
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_DESCRIPTION="Nome do servidor SFTP, sem o protocolo. Isto significa que <tt>sftp://example.com</tt> ou <tt>ssh://example.com</tt> é <b>inválido</b> e NÃO deve ser utilizado, mas <tt>example.com</tt> é válido e DEVE ser utilizado. Este motor apenas suporta servidores SFTP (SSH). <u>Não</u> suporta FTP, FTPS nem qualquer outra variante FTP. Requer a extensão PHP SSH2 instalada e activada."
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_TITLE="Nome do servidor"
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_DESCRIPTION="O caminho <b>SFTP</b> absoluto (normalmente o mesmo que o caminho do sistema de ficheiros) para o directório onde os ficheiros serão carregados. Em caso de dúvida, ligue ao seu servidor com o FileZilla, navegue até ao directório pretendido e copie o caminho que aparece no painel direito acima da lista de directórios. Normalmente é algo longo, como <tt>/home/myuser/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_TITLE="Directório inicial"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_DESCRIPTION="Palavra-passe do servidor SFTP. Normalmente é sensível a maiúsculas e minúsculas. Em caso de dúvida, contacte o administrador da sua rede."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_TITLE="Palavra-passe"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_DESCRIPTION="Porta do servidor SFTP. A definição mais comum é 22. Em caso de dúvida, contacte o administrador da sua rede."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_TITLE="Porta"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_DESCRIPTION="LEIA A DOCUMENTAÇÃO ANTES DE UTILIZAR. O caminho absoluto no sistema de ficheiros para um ficheiro de chave privada RSA / DSA utilizado para ligar ao servidor remoto. Se estiver encriptado, introduza a frase-passe no campo de palavra-passe acima. Se não sabe o que isto é, ou se acha que terá de pedir suporte sobre o assunto, deixe em branco e não nos questione sobre isso."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_TITLE="Ficheiro de Chave Privada (avançado)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_DESCRIPTION="LEIA A DOCUMENTAÇÃO ANTES DE UTILIZAR. O caminho absoluto no sistema de ficheiros para um ficheiro de chave pública RSA / DSA utilizado para ligar ao servidor remoto. Se não sabe o que isto é, ou se acha que terá de pedir suporte sobre o assunto, deixe em branco e não nos questione sobre isso."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_TITLE="Ficheiro de Chave Pública (avançado)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_DESCRIPTION="Utilize este botão para testar a ligação SFTP e ver os erros de ligação em caso de falha."
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_TITLE="Testar ligação SFTP"
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_DESCRIPTION="Nome de utilizador do servidor SFTP. Normalmente é sensível a maiúsculas e minúsculas. Em caso de dúvida, contacte o administrador da sua rede."
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_TITLE="Nome de utilizador"
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_DESCRIPTION="Para imediatamente o processo de cópia de segurança, marcando-a como falhada, se ocorrer um erro de carregamento. <strong>Esta opção pode ser enganosa e perigosa.</strong> Pode ter uma cópia de segurança completa e válida que simplesmente falhou no carregamento total ou parcial. Activar esta opção removerá os ficheiros de arquivo de cópia de segurança restantes do seu servidor e deixará para trás quaisquer ficheiros de arquivo (parcialmente) carregados para o armazenamento remoto. Por outras palavras, ficará sem nenhuma cópia de segurança funcional. Existem apenas muito poucos casos de uso em que isto faz mais sentido do que o comportamento predefinido, que lhe permite retomar o carregamento do ficheiro de arquivo de cópia de segurança através da página Gerir Cópias de Segurança. Por conseguinte, recomendamos vivamente que esta opção seja activada apenas por utilizadores experientes que compreendam plenamente as implicações de o fazer."
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_TITLE="Marcar cópia de segurança como falhada em caso de erro de carregamento"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_DESCRIPTION="O endereço de correio electrónico para onde os ficheiros de cópia de segurança serão enviados"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_TITLE="Endereço de correio electrónico"
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_DESCRIPTION="O assunto do correio electrónico (opcional). Esta opção destina-se principalmente a ajudá-lo a distinguir entre cópias de segurança de vários sítios."
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_TITLE="Assunto do correio electrónico"
COM_AKEEBA_CONFIG_PROCENGINE_DESCRIPTION="Os motores de pós-processamento permitem ao Akeeba Backup transferir as partes finalizadas do arquivo de cópia de segurança para outros servidores e fornecedores de armazenamento remoto."
COM_AKEEBA_CONFIG_PROCENGINE_TITLE="Motor de pós-processamento"
COM_AKEEBA_CONFIG_PROXY_HOST_DESC="Se o seu sítio necessitar de se ligar a um servidor proxy para comunicar com o exterior (proxy de saída), introduza aqui o nome do servidor ou o endereço IP do proxy. Deixe em branco para não utilizar um proxy."
COM_AKEEBA_CONFIG_PROXY_HOST_LABEL="Nome do servidor proxy / Endereço IP"
COM_AKEEBA_CONFIG_PROXY_PASS_DESC="Se o seu servidor proxy exigir autenticação, introduza aqui a palavra-passe de autenticação do proxy. Não se esqueça de introduzir um nome de utilizador não vazio na opção acima."
COM_AKEEBA_CONFIG_PROXY_PASS_LABEL="Palavra-passe do proxy"
COM_AKEEBA_CONFIG_PROXY_PORT_DESC="Introduza a porta TCP/IP em que o servidor proxy está a escutar. Normalmente é 8080 ou 3128. Em caso de dúvida, contacte o seu fornecedor de alojamento ou o administrador de rede."
COM_AKEEBA_CONFIG_PROXY_PORT_LABEL="Porta do proxy"
COM_AKEEBA_CONFIG_PROXY_USER_DESC="Se o seu servidor proxy exigir autenticação, introduza aqui o nome de utilizador de autenticação do proxy. Deixe em branco para utilizar um proxy que não exige autenticação."
COM_AKEEBA_CONFIG_PROXY_USER_LABEL="Nome de utilizador do proxy"
COM_AKEEBA_CONFIG_PUSH_APIKEY_DESC="Aceda a https://www.pushbullet.com/account e copie o Token de Acesso dessa página para a caixa de texto aqui. É utilizado para enviar mensagens push para a sua conta. Pode colar vários tokens separados por vírgulas. Nota: o Token de Acesso é visível para todas as pessoas que tenham acesso a esta página de configuração."
COM_AKEEBA_CONFIG_PUSH_APIKEY_LABEL="Token de Acesso Pushbullet"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_DESC="O Akeeba Backup deve enviar-lhe notificações e, se sim, de que forma?"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_LABEL="Notificações push"
COM_AKEEBA_CONFIG_QUICKICON_DESC="Quando activado, o Akeeba Backup apresentará um ícone de cópia de segurança com um clique no topo da página do Painel de Controlo. Ao clicar nele, activará este perfil e efectuará uma cópia de segurança sem qualquer acção adicional da sua parte."
COM_AKEEBA_CONFIG_QUICKICON_LABEL="Ícone de cópia de segurança com um clique"
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_DESCRIPTION="Quando activado, a cópia de segurança em curso participa nas quotas de ficheiros remotos. Isto pode ser problemático; se a cópia de segurança for parcialmente carregada para o armazenamento remoto e as definições de quota forem tais que apenas a cópia de segurança mais recente seja preservada, pode ficar sem uma cópia de segurança válida armazenada remotamente. Ao desactivar esta opção, reduz-se a probabilidade de ficar sem uma cópia de segurança válida no armazenamento remoto, à custa de armazenar remotamente mais um arquivo de cópia de segurança."
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_TITLE="A cópia de segurança actual participa nas quotas de ficheiros remotos"
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_DESCRIPTION="Quando activado, as definições de quota abaixo serão aplicadas aos ficheiros armazenados em armazenamento remoto, como o Amazon S3 ou servidores FTP remotos."
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_TITLE="Activar quotas de ficheiros remotos"
COM_AKEEBA_CONFIG_RUNTIMEBIAS_DESCRIPTION="Define a margem de segurança que o Akeeba Backup utilizará ao tentar evitar um tempo limite. Quanto menor for este valor, mais conservador será o comportamento. Se ocorrerem erros de tempo limite, tente diminuir tanto o Tempo Máximo de Execução como esta definição.<b>Sugestão</b>: Seleccione Personalizado e introduza o valor pretendido se não estiver na lista."
COM_AKEEBA_CONFIG_RUNTIMEBIAS_TITLE="Margem de tempo de execução"
COM_AKEEBA_CONFIG_S3ACCESSKEY_DESCRIPTION="A sua Chave de Acesso do Amazon S3, disponibilizada na página do seu perfil pessoal do Amazon Web Services"
COM_AKEEBA_CONFIG_S3ACCESSKEY_TITLE="Chave de Acesso"
COM_AKEEBA_CONFIG_S3BUCKET_DESCRIPTION="O nome do seu bucket do Amazon S3"
COM_AKEEBA_CONFIG_S3BUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_DESCRIPTION="Para utilização com serviços de armazenamento de terceiros que implementem uma API compatível com S3. Introduza o endpoint (URL da API) da API compatível com S3 do serviço de armazenamento de terceiros. IMPORTANTE: Se estiver a utilizar o Amazon S3, <strong>DEVE DEIXAR ESTE CAMPO EM BRANCO</strong>."
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_TITLE="Endpoint personalizado"
COM_AKEEBA_CONFIG_S3DIRECTORY_DESCRIPTION="O directório dentro do seu bucket onde os arquivos de cópia de segurança serão armazenados. Deixe em branco para armazenar os ficheiros na raiz do bucket."
COM_AKEEBA_CONFIG_S3DIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_S3_ACL_TITLE="Permissões de ficheiro (ACLs)"
COM_AKEEBA_CONFIG_S3_ACL_DESCRIPTION="Escolha as permissões do ficheiro carregado. Na maioria dos casos, "Privado" ou "O proprietário do bucket pode ler" são as opções mais adequadas. Se estiver a utilizar um serviço de terceiros compatível com S3, poderá preferir utilizar "Privado" em vez da definição predefinida."
COM_AKEEBA_CONFIG_S3_ACL_PRIVATE="Privado"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ="Qualquer pessoa pode ler"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ_WRITE="Qualquer pessoa pode ler e escrever"
COM_AKEEBA_CONFIG_S3_ACL_AUTHENTICATED_READ="Os utilizadores IAM autenticados podem ler"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_READ="O proprietário do bucket pode ler"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_FULL_CONTROL="O proprietário do bucket tem controlo total"
COM_AKEEBA_CONFIG_S3LEGACY_DESCRIPTION="Quando activado, todos os carregamentos para o Amazon S3 serão forçados a ser de parte única. Utilize esta opção se obtiver erros RequestTimeout do motor S3 ao carregar partes de cópia de segurança."
COM_AKEEBA_CONFIG_S3LEGACY_TITLE="Desactivar carregamentos multipart"
COM_AKEEBA_CONFIG_S3RRS_DESCRIPTION="Seleccione a classe de armazenamento para os seus dados. Standard é o armazenamento regular para dados de negócio críticos. Consulte a documentação do Amazon S3 para a descrição de cada classe de armazenamento."
COM_AKEEBA_CONFIG_S3RRS_TITLE="Classe de armazenamento"
COM_AKEEBA_CONFIG_S3SECRETKEY_DESCRIPTION="A sua Chave Secreta do Amazon S3, disponibilizada na página do seu perfil pessoal do Amazon Web Services"
COM_AKEEBA_CONFIG_S3SECRETKEY_TITLE="Chave Secreta"
COM_AKEEBA_CONFIG_S3USESSL_DESCRIPTION="Se activado, será utilizada uma ligação segura (HTTPS) ao carregar os seus ficheiros. Embora aumente a segurança dos dados transferidos, também aumenta a possibilidade de falha da cópia de segurança por tempo limite."
COM_AKEEBA_CONFIG_S3USESSL_TITLE="Utilizar SSL"
COM_AKEEBA_CONFIG_S3_DUALSTACK_DESCRIPTION="Deve utilizar os endpoints dual-stack para o Amazon S3? Isto permite aceder ao S3 através de IPv6 em servidores que suportam IPv6. Os servidores sem suporte a IPv6 continuarão a poder aceder ao S3 através de IPv4. Não tem efeito se estiver a utilizar um endpoint personalizado."
COM_AKEEBA_CONFIG_S3_DUALSTACK_TITLE="Activar suporte IPv6 (dual-stack)"
COM_AKEEBA_CONFIG_S3_ALTERNATEDATEHEADERFORMAT_TITLE="Formato de data alternativo"
COM_AKEEBA_CONFIG_S3_ALTERNATEDATEHEADERFORMAT_DESCRIPTION="Só desactive esta definição se o suporte técnico o solicitar."
COM_AKEEBA_CONFIG_S3_USEHTTPDATEHEADER_TITLE="Utilizar o cabeçalho HTTP Date em vez de X-Amz-Date"
COM_AKEEBA_CONFIG_S3_USEHTTPDATEHEADER_DESCRIPTION="Só active esta definição se o suporte técnico o solicitar."
COM_AKEEBA_CONFIG_S3_PRESIGNEDBUCKETINURL_TITLE="Incluir o nome do bucket em URLs pré-assinados v4"
COM_AKEEBA_CONFIG_S3_PRESIGNEDBUCKETINURL_DESCRIPTION="Só active esta definição se o suporte técnico o solicitar."

COM_AKEEBA_CONFIG_SAVENEW_DEFAULT_PROFILE_NAME="Novo perfil de cópia de segurança"
COM_AKEEBA_CONFIG_SAVE_OK="A configuração foi guardada"
COM_AKEEBA_CONFIG_SCANENGINE_DESCRIPTION="Define a forma como o Akeeba Backup percorrerá os ficheiros e pastas do seu sítio para determinar quais deles devem ser incluídos na cópia de segurança."
COM_AKEEBA_CONFIG_SCANENGINE_TITLE="Motor de análise do sistema de ficheiros"
COM_AKEEBA_CONFIG_SECRETWORD_DESC="Esta palavra-passe será utilizada com as funcionalidades de Cópia de Segurança via Frontend (API Legada) e JSON API para as proteger contra acessos não autorizados. O Akeeba Backup NÃO activará estas funcionalidades a menos que utilize aqui uma palavra-passe longa e complexa.<br><br><strong>Nota de segurança:</strong> a Chave Secreta é a única credencial aceite pela JSON API, e é ilimitada. Quem a detiver pode alterar todas as opções, realizar uma cópia de segurança e transferir o arquivo resultante — e uma cópia de segurança é uma cópia completa do seu site, incluindo as credenciais da base de dados e os registos de utilizador. Trate-a com o mesmo cuidado que a sua palavra-passe de administrador. Consulte a documentação para mais informações."
COM_AKEEBA_CONFIG_SECRETWORD_LABEL="Chave Secreta"
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_DESCRIPTION="Quando activado, as definições de configuração são encriptadas utilizando a encriptação AES-128 padrão da indústria."
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_LABEL="Utilizar encriptação"
COM_AKEEBA_CONFIG_SFTPTEST_BADPREFIX="NÃO deve adicionar o prefixo sftp:// ao Nome do Servidor SFTP. Remova o prefixo sftp:// e tente novamente."
COM_AKEEBA_CONFIG_SFTPTEST_NOUPLOAD="O Akeeba Backup conseguiu ligar-se ao seu servidor, mas não conseguiu carregar um ficheiro de teste. O carregamento da cópia de segurança poderá falhar."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_DESCRIPTION="Quando activado, o Akeeba Backup eliminará os ficheiros de cópia de segurança antigos se o tamanho total dos arquivos de cópia de segurança exceder o valor definido abaixo. Esta definição é aplicada <b>por perfil</b>."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_TITLE="Activar quota por tamanho"
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_DESCRIPTION="Se o tamanho total dos arquivos de cópia de segurança efectuados com o perfil actual exceder este limite, as cópias de segurança mais antigas serão eliminadas do servidor.<br/><br/><b>Sugestão</b>: Seleccione Personalizado e introduza o valor pretendido se não estiver na lista."
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_TITLE="Quota por tamanho"
COM_AKEEBA_CONFIG_SPLITDBDUMP_DESCRIPTION="Os seus ficheiros de exportação da base de dados serão divididos em pequenos ficheiros para melhorar a compressão e evitar problemas com o tamanho dos ficheiros em certos alojamentos de baixo custo. Idealmente, deve utilizar metade do tamanho do seu Limiar de Ficheiro Grande. Defina como 0 para desactivar a divisão e criar um único ficheiro de exportação SQL de grande dimensão por base de dados."
COM_AKEEBA_CONFIG_SPLITDBDUMP_TITLE="Tamanho para ficheiros SQL de exportação divididos"
COM_AKEEBA_CONFIG_SUGARSYNC_ACCESS_DESCRIPTION="Introduza o seu ID de Chave de Acesso. Crie um em https://www.sugarsync.com/developer/account"
COM_AKEEBA_CONFIG_SUGARSYNC_ACCESS_TITLE="ID de Chave de Acesso"
COM_AKEEBA_CONFIG_SUGARSYNC_DIRECTORY_DESCRIPTION="Em que directório armazenar os ficheiros de cópia de segurança. Se a primeira parte do directório não corresponder ao nome de uma pasta de sincronização SugarSync, o directório será criado dentro da sua pasta Magic Briefcase. Pode utilizar as mesmas variáveis que utiliza nos nomes dos arquivos de cópia de segurança, por exemplo [HOST] para o nome de domínio do seu sítio ou [DATE] para a data actual."
COM_AKEEBA_CONFIG_SUGARSYNC_DIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_SUGARSYNC_EMAIL_DESCRIPTION="O endereço de correio electrónico da sua conta SugarSync"
COM_AKEEBA_CONFIG_SUGARSYNC_EMAIL_TITLE="Correio electrónico"
COM_AKEEBA_CONFIG_SUGARSYNC_PASSWORD_TITLE="Palavra-passe"
COM_AKEEBA_CONFIG_SUGARSYNC_PRIVATE_DESCRIPTION="Introduza a Chave de Acesso Privada correspondente ao seu ID de Chave de Acesso. Crie uma em https://www.sugarsync.com/developer/account"
COM_AKEEBA_CONFIG_SUGARSYNC_PRIVATE_TITLE="Chave de Acesso Privada"
COM_AKEEBA_CONFIG_SWIFT_AUTHURL_DESCRIPTION="O ponto de acesso para o serviço Keystone da sua instalação OpenStack. INCLUA a versão. NÃO inclua o sufixo /token. Exemplo: https://authentication.example.com/v2.0"
COM_AKEEBA_CONFIG_SWIFT_AUTHURL_TITLE="URL de Autenticação"
COM_AKEEBA_CONFIG_SWIFT_CONTAINERURL_DESCRIPTION="O ponto de acesso da API para o seu contentor de armazenamento de objectos, por exemplo https://storage.example.com/v1/AUTH_abcdef0123456789abcdef0123456789/my-container"
COM_AKEEBA_CONFIG_SWIFT_CONTAINERURL_TITLE="URL do Contentor"
COM_AKEEBA_CONFIG_SWIFT_DIRECTORY_DESCRIPTION="O directório dentro do contentor de armazenamento de objectos OpenStack Swift onde serão armazenados os arquivos de cópia de segurança. Para armazenar tudo na raiz do contentor, deixe em branco."
COM_AKEEBA_CONFIG_SWIFT_DIRECTORY_TITLE="Directório"
COM_AKEEBA_CONFIG_SWIFT_DOMAIN_DESCRIPTION="Utilizado apenas com autenticação Keystone v3. Este é o domínio de autenticação para o serviço Keystone v3, <strong>NÃO</strong> o nome do servidor de autenticação Keystone. Na maioria dos casos é <code>default</code> ou <code>Default</code>. Em caso de dúvida, consulte o seu fornecedor de armazenamento."
COM_AKEEBA_CONFIG_SWIFT_DOMAIN_TITLE="Domínio de Autenticação Keystone v3"
COM_AKEEBA_CONFIG_SWIFT_KEYSTONE_VERSION_DESCRIPTION="Escolha qual a versão do serviço de autenticação OpenStack Keystone utilizada pelo seu fornecedor de armazenamento. Em caso de dúvida, consulte o seu fornecedor de armazenamento."
