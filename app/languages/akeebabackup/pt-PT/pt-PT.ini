SOLO_CONFIG_UPDATE_INTEGRATED_WP="Mostrar actualização do Akeeba Backup na página de Plugins"
SOLO_CONFIG_UPDATE_INTEGRATED_WP_DESC="Quando activado, o Akeeba Backup notificará o WordPress sobre a disponibilidade de actualizações e a localização dos ficheiros de actualização. Isto permite ao WordPress incluir as actualizações do Akeeba Backup na contagem de actualizações disponíveis e mostrar as actualizações do Akeeba Backup na página de Plugins. Em muito poucos sítios isto pode resultar numa página em branco ou erro ao tentar aceder à página de Plugins, devido à interacção com plugins de terceiros mal desenvolvidos. Nesse caso, desactive esta opção e contacte-nos com uma lista dos plugins que tem activados no seu sítio e as respectivas versões."
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_CONSERVATIVE="Conservador"
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_DESCRIPTION="Quando activado, as cópias de segurança efectuadas com WP-CRON terão os limites mínimo e máximo de tempo de execução definidos na secção de Optimização da configuração do perfil de cópia de segurança substituídos. A definição «Optimista» tentará utilizar o máximo de tempo possível no seu servidor — até 60 segundos — resultando em cópias de segurança mais rápidas, mas mais propensas a falhar. A definição «Conservadora» tentará utilizar apenas metade do tempo da definição Optimista, resultando em cópias de segurança mais lentas, mas com menor probabilidade de falhar. Alguns servidores podem exigir que esta opção seja definida como «Não» e que ajuste as definições de Optimização para que a cópia de segurança funcione sem falhar."
