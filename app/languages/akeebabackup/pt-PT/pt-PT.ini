SOLO_SETUP_SESSION_LBL_WARNING_BODY="O Akeeba Solo detectou que o caminho de gravação da sessão não tem permissões de escrita. É necessário um caminho de gravação de sessão com permissões de escrita para que o Akeeba Solo funcione. Vamos tentar criar um caminho de gravação de sessão com permissões de escrita em <code>%s</code>. Antes de o fazer, precisamos que forneça os dados de ligação (S)FTP à raiz do seu sítio. Se não tiver a certeza destas definições, contacte o seu fornecedor de alojamento."
