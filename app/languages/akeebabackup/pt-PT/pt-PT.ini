COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_PRO="<p>É fácil! Seleccione a caixa de verificação junto a uma entrada de cópia de segurança. Agora clique no botão <em>Restaurar</em> na barra de ferramentas.</p><p>Se pretender restaurar para um novo servidor público, pode utilizar o <a href=\"%2$s\">Assistente de Transferência de Sítio</a>. Se preferir fazê-lo manualmente ou restaurar para o seu próprio computador ou Intranet, veja o nosso <a href=\"%1$s\" target=\"_blank\">tutorial em vídeo</a> e <a href=\"%3$s\" target=\"_blank\">transfira o Akeeba Kickstart Core (gratuito)</a> para extrair os arquivos de cópia de segurança.</p>"
