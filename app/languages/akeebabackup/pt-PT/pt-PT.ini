COM_AKEEBA_CPANEL_LBL_OUTDIR_DELETEORBEHACKED="Até que o faça, <strong>RECOMENDAMOS MUITO VIVAMENTE</strong> que não efectue uma cópia de segurança do seu sítio e, se já o tiver feito, apague todos os arquivos de cópia de segurança e ficheiros de registo de cópia de segurança. <strong>O NÃO CUMPRIMENTO DESTAS INSTRUÇÕES PODERÁ MUITO PROVAVELMENTE RESULTAR NO COMPROMETIMENTO (PIRATARIA) DO SEU SÍTIO.</strong>"
COM_AKEEBA_CPANEL_LBL_OUTDIR_FILEREADABLE="O Akeeba Backup detectou que o seu directório de saída de cópias de segurança <code>%s</code> está sob a raiz web do seu sítio. O seu conteúdo, incluindo os seus arquivos de cópia de segurança, é acessível pela web. No entanto, NÃO é possível listar os ficheiros no directório com um navegador web. <strong>Isto pode ser um problema de segurança</strong>. Um atacante pode adivinhar o nome do arquivo de cópia de segurança e transferi-lo directamente, contornando a segurança do seu sítio."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_RANDOM="O seu «Nome do ficheiro de saída de cópia de segurança» será alterado para incluir a variável <code>[RANDOM]</code>. Isto torna praticamente impossível adivinhar os nomes dos ficheiros de cópia de segurança, adicionando 16 letras e/ou números aleatórios e diferentes no nome do ficheiro de arquivo de cópia de segurança cada vez que efectua uma cópia de segurança."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_SECURITYFILES="Um ficheiro <code>.htaccess</code> e um ficheiro <code>web.config</code> serão escritos nessa pasta. Na maioria dos servidores, isto é suficiente para impedir transferências directas pela web de qualquer ficheiro no seu interior e desactiva a listagem dos seus ficheiros. Também temos uma solução para os servidores onde estes ficheiros especiais não têm efeito. Outros três ficheiros chamados <code>index.php</code>, <code>index.html</code> e <code>index.htm</code> serão igualmente escritos nessa pasta. Estes ficheiros de índice impedem o servidor web de listar os nomes dos arquivos de cópia de segurança e dos ficheiros de registo de cópia de segurança."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM="Além disso, o seu directório de saída é o mesmo que uma pasta utilizada pelo seu sítio para armazenar ficheiros de sistema ou de software de terceiros acessíveis publicamente, ou um subdirectório dessa pasta."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM_FIX="Tem de aceder à página de Configuração do Akeeba Backup e seleccionar um directório de saída diferente."
COM_AKEEBA_CPANEL_LBL_OUTDIR_LISTABLE="O Akeeba Backup detectou que o seu directório de saída de cópias de segurança <code>%s</code> está sob a raiz web do seu sítio. O seu conteúdo, incluindo os seus arquivos de cópia de segurança, é acessível pela web. Além disso, é possível listar os ficheiros no directório, ou seja, apresenta uma listagem dos seus arquivos de cópia de segurança quando acede a ele com um navegador web. <strong>Este é um problema de segurança grave</strong>. Um atacante pode aceder a esta pasta a partir de um navegador web e transferir os seus arquivos de cópia de segurança directamente, contornando a segurança do seu sítio."
COM_AKEEBA_CPANEL_LBL_OUTDIR_TRASHHOST="Infelizmente, o seu servidor não suporta nenhum método razoável para proteger o directório. Independentemente do que seja feito, irá sempre listar os nomes dos ficheiros que contém e permitir que os transfira a partir de um navegador. A sua única e exclusiva opção é criar um directório de saída de cópias de segurança acima da raiz do seu sítio."
