COM_AKEEBA_CONFIG_UPLOADKICKSTART_DESCRIPTION="Quando activada, uma cópia do Akeeba Kickstart Professional será carregada para o armazenamento remoto especificado no Motor de Pós-processamento acima (excepto para os motores Nenhum e E-mail). Isto é útil quando se utiliza FTP ou SFTP para transferir o sítio para um servidor diferente: tanto o arquivo de cópia de segurança como o Kickstart, utilizado para o extrair, serão carregados para o servidor remoto. Após a conclusão da cópia de segurança, basta iniciar o Kickstart no sítio remoto e prosseguir com o restauro. Tão simples!"
