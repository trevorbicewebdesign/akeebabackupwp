SOLO_USERS_HEAD_BASIC="Configuração básica"
SOLO_USERS_HEAD_TFA="Autenticação de dois factores"
SOLO_USERS_LBL_ABOUTTFA="A Autenticação de Dois Factores (TFA) adiciona uma camada extra de segurança ao iniciar sessão no Akeeba Solo. Para além do seu nome de utilizador e palavra-passe, também terá de introduzir um código secreto para iniciar sessão. Ao contrário do seu nome de utilizador e palavra-passe, este código secreto não é fixo. Muda ao longo do tempo e é gerado pelo seu smartphone ou por um dispositivo dedicado, consoante o método que escolher. A activação da TFA é opcional; o Akeeba Solo funciona igualmente bem sem ela."
SOLO_USERS_LBL_TFAENABLE="Activar Autenticação de Dois Factores"
SOLO_USERS_LBL_TFAMETHOD="Método de Autenticação de Dois Factores"
SOLO_USERS_LBL_TFASECURITYCODE="Código de Segurança"
SOLO_USERS_TFA_GOOGLE="Google Authenticator"
SOLO_USERS_TFA_GOOGLE_INTRO="Esta funcionalidade permite-lhe utilizar o Google Authenticator, ou uma aplicação compatível, para autenticação de dois factores. Para além do seu nome de utilizador e palavra-passe, também terá de fornecer um código de segurança de seis dígitos gerado pelo Google Authenticator para poder iniciar sessão no Akeeba Solo. O código de segurança é renovado a cada 30 segundos. Isto proporciona protecção extra contra intrusos que tentem iniciar sessão na sua conta, mesmo que tenham conseguido obter a sua palavra-passe."
SOLO_USERS_TFA_GOOGLE_LBL_STEP1="Passo 1 - Obter o Google Authenticator"
SOLO_USERS_TFA_GOOGLE_LBL_STEP2="Passo 2 - Configurar"
SOLO_USERS_TFA_GOOGLE_LBL_STEP3="Passo 3 - Activar a Autenticação de Dois Factores"
SOLO_USERS_TFA_GOOGLE_SETUP1="Transfira e instale o Google Authenticator, ou uma aplicação compatível, no seu smartphone ou computador. Utilize uma das seguintes opções:"
SOLO_USERS_TFA_GOOGLE_SETUP1_WARNING="Lembre-se de sincronizar o relógio do seu dispositivo com um servidor de tempo. A deriva horária no seu dispositivo pode causar a impossibilidade de iniciar sessão no Akeeba Solo."
SOLO_USERS_TFA_GOOGLE_SETUP2A="Terá de introduzir as seguintes informações no Google Authenticator ou numa aplicação compatível."
SOLO_USERS_TFA_GOOGLE_SETUP2A_ACCOUNT="Conta"
SOLO_USERS_TFA_GOOGLE_SETUP2A_KEY="Chave"
SOLO_USERS_TFA_GOOGLE_SETUP2B="Em alternativa, pode digitalizar o seguinte código QR no Google Authenticator."
SOLO_USERS_TFA_GOOGLE_SETUP3="Para verificar que tudo está configurado correctamente, introduza o código de segurança apresentado no Google Authenticator no campo abaixo e clique no botão. Se o código estiver correcto, a funcionalidade de Autenticação de Dois Factores será activada."
SOLO_USERS_TFA_NONE="Nenhuma (não utilizar autenticação de dois factores)"
SOLO_USERS_TFA_OTEPS_HEAD="Códigos de Emergência de Utilização Única"
SOLO_USERS_TFA_OTEPS_INTRO="Imprima uma cópia destes códigos agora e guarde-a num local seguro. Se perder o seu dispositivo de autenticação de dois factores, não conseguirá iniciar sessão no Akeeba Solo. Se isso acontecer, utilize uma das seguintes palavras-passe de emergência de utilização única em vez da sua Chave Secreta de dois factores para iniciar sessão no Akeeba Solo e repor a autenticação de dois factores. Lembre-se de que estes são códigos de emergência de utilização única. Depois de utilizar um deles, nunca mais poderá utilizá-lo novamente. Se ficar sem códigos de emergência, desactive a autenticação de dois factores e reactive-a para gerar um novo conjunto de 10 códigos."
SOLO_USERS_TFA_YUBIKEY="YubiKey"
SOLO_USERS_TFA_YUBIKEY_INTRO="Esta funcionalidade permite-lhe utilizar um token de hardware seguro YubiKey para autenticação de dois factores. Para além do seu nome de utilizador e palavra-passe, também terá de inserir o seu YubiKey na porta USB do computador, clicar dentro da área da Chave Secreta na área de início de sessão do Akeeba Solo e tocar no botão dourado do YubiKey. O código secreto gerado pelo seu YubiKey é único para o seu dispositivo e muda constantemente. Isto proporciona protecção extra contra intrusos que tentem iniciar sessão na sua conta, mesmo que tenham conseguido obter a sua palavra-passe."
SOLO_USERS_TFA_YUBIKEY_SETUP="Insira o seu dispositivo YubiKey na porta USB do computador. Clique no campo Código de Segurança abaixo. Em seguida, toque no botão dourado do seu dispositivo YubiKey durante um segundo. Depois, guarde o seu perfil de utilizador. Se o código gerado pelo seu YubiKey for validado pelo YubiCloud, a funcionalidade de Autenticação de Dois Factores será activada e este YubiKey ficará associado à sua conta de utilizador."
SOLO_WIZARD_BTN_PYTHIA="Detectar automaticamente"
SOLO_WIZARD_BTN_PYTHIA_HELP="Se clicar neste botão, o Akeeba Solo tentará detectar automaticamente o tipo de script, o tipo de instalador e as informações de ligação à base de dados abaixo. Reveja as definições. A detecção automática pode não produzir as definições correctas em algumas circunstâncias."
SOLO_WIZARD_ERR_DIRNOTEXIST="O directório raiz especificado não existe ou não é legível pelo Akeeba Solo"
SOLO_WIZARD_LBL_DBINFO_INTRO="Aqui pode fornecer as informações de ligação à base de dados que contém os dados do sítio / aplicação web para a qual pretende efectuar a cópia de segurança."
SOLO_WIZARD_LBL_DBINFO_TITLE="Ligação à base de dados"
SOLO_WIZARD_LBL_INTRO="Em primeiro lugar, tem de nos indicar o que pretende incluir na cópia de segurança. Pode fazê-lo definindo o directório raiz e as informações de ligação à base de dados do sítio a incluir. Se o seu sítio necessitar de mais do que uma base de dados para funcionar correctamente, pode adicioná-las após a conclusão deste assistente, através da funcionalidade Definições de Múltiplas Bases de Dados na página principal da aplicação."
SOLO_WIZARD_LBL_SITEINFO_INTRO="As seguintes opções afectam a forma como o Akeeba Solo efectua a cópia de segurança do seu sítio e restaura as suas cópias de segurança. Se não tiver a certeza do que colocar aqui, basta clicar no botão Detecção automática no topo da página para que o Akeeba Solo detecte automaticamente estes valores."
SOLO_WIZARD_LBL_SITEINFO_TITLE="Informações do sítio"
SOLO_WIZARD_LBL_SITEROOT_INTRO="A raiz do sítio é o directório que contém todos os ficheiros do sítio / aplicação web para a qual pretende efectuar a cópia de segurança. Deve estar no mesmo servidor e ser legível pelo Akeeba Solo."
