COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEDB_DESCRIPTION="Quando está desmarcada (predefinição), o Akeeba Backup efectua automaticamente a cópia de segurança da base de dados à qual o sítio onde está instalado se liga (a sua base de dados Joomla!). Quando está marcada, efectua a cópia de segurança de uma base de dados diferente, utilizando os detalhes de ligação que fornecer abaixo."
