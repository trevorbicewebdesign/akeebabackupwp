COM_AKEEBA_CPANEL_ERR_MBSTRING_SOLO="<strong>A sua versão de PHP não tem a extensão mbstring instalada ou activada</strong>. Ter esta extensão activada é um requisito do Akeeba Solo. O Akeeba Solo pode não funcionar correctamente. Por favor, solicite ao seu alojamento que active a extensão mbstring no PHP %s em execução no seu servidor."
COM_AKEEBA_CPANEL_ERR_MBSTRING_WORDPRESS="<strong>A sua versão de PHP não tem a extensão mbstring instalada ou activada</strong>. Ter esta extensão activada é um requisito do WordPress. O WordPress e o Akeeba Backup podem não funcionar correctamente. Por favor, solicite ao seu alojamento que active a extensão mbstring no PHP %s em execução no seu servidor."
