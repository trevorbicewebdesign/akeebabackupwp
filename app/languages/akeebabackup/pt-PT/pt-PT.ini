COM_AKEEBA_ALICE_ERR_ANALYZEFAILED_HEADER="A análise do registo falhou"
COM_AKEEBA_ALICE_ERR_ANALYZEFAILED_INFO="A análise do registo foi interrompida. O analisador de registos comunicou o seguinte erro:"
COM_AKEEBA_ALICE_ERR_CANNOT_OPEN_LOGFILE="A análise do ficheiro de registo falhou: não foi possível abrir o ficheiro de registo %s para leitura."
COM_AKEEBA_ALICE_ERR_NOLOGS="Não foram encontrados ficheiros de registo de cópias de segurança <strong>falhadas</strong>."
COM_AKEEBA_ALICE_HEAD_ONLYFAILED="O ALICE apenas funciona em cópias de segurança <em>falhadas</em>"
COM_AKEEBA_ALICE_LBL_ONLYFAILED_IFNOFAILED="Se a sua cópia de segurança falhou mas não a vê nesta página, por favor aguarde <em>três (3) minutos</em>, volte à página do Painel de Controlo do Akeeba Backup e depois regresse aqui. Há uma razão para isso. Em alguns casos, a falha da cópia de segurança é causada por um erro do servidor. Nesses casos, a cópia de segurança é marcada como ainda em curso em vez de falhada, uma vez que o PHP para de executar e, portanto, o nosso código PHP que a marcaria como falhada não tem oportunidade de ser executado. Quando visitar a página do Painel de Controlo, qualquer cópia de segurança marcada como ainda em curso há mais de 3 minutos será marcada como falhada. Daí a necessidade de aguardar e <em>depois</em> voltar à página do Painel de Controlo."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_SHOWINGLOGS="O ALICE é uma ferramenta para analisar os ficheiros de registo de cópias de segurança <em>falhadas</em> e — na maioria dos casos — indicar-lhe a causa mais provável da falha da cópia de segurança. Não se destina a analisar os ficheiros de registo de cópias de segurança bem-sucedidas. Fazê-lo produziria resultados sem sentido, enganosos ou completamente errados. Por esta razão, apenas serão apresentados os ficheiros de registo de cópias de segurança <em>falhadas</em>."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_WHATISFAILED="Lembre-se de que as cópias de segurança que não terminaram o carregamento do arquivo de cópia de segurança para armazenamento remoto não são consideradas falhadas. A causa raiz destes problemas não pode ser detectada pelo ALICE de qualquer forma. Se tiver este tipo de problema, deverá abrir um pedido de suporte na secção de Suporte do nosso sítio. Se outra pessoa instalou o Akeeba Backup Professional no seu sítio, contacte essa pessoa; nesse caso não poderá abrir um pedido de suporte no nosso sítio."
COM_AKEEBA_BACKUP="Fazer Cópia de Segurança Agora"
COM_AKEEBA_BACKUP_ANALYSELOG="Analisar Ficheiro de Registo (ALICE)"
COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_1="O seu script de restauro (ANGIE) apenas será acessível se fornecer a palavra-passe que definiu na página anterior, antes de clicar no botão Fazer Cópia de Segurança Agora. Se não se lembra de ter definido uma palavra-passe, o seu navegador preencheu automaticamente a palavra-passe na página de Configuração <strong>sem o informar</strong>. Isto é feito por muitos gestores de palavras-passe e navegadores."
COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_2="Os navegadores e gestores de palavras-passe modernos não nos permitem substituir este comportamento. Implementámos uma defesa em JavaScript contra este tipo de preenchimento automático não consensual do campo de palavra-passe na página de Configuração. No entanto, se guardar a página de Configuração aproximadamente meio segundo após o seu carregamento, esta defesa não terá oportunidade de ser executada."
