COM_AKEEBA_TRANSFER_BTN_RESET="Repor"
COM_AKEEBA_TRANSFER_DESC="Transfere o arquivo executando o motor de pós-processamento \"%s\" sobre o arquivo."
COM_AKEEBA_TRANSFER_ERR_CANNOTACCESSTESTFILE="O Akeeba Backup não consegue verificar se as informações de ligação que introduziu correspondem ao URL do sítio que introduziu. Se estiver a tentar restaurar dentro de um subdirectório de um sítio existente, tal significa que o sítio principal está a bloquear o acesso ao subdirectório; contacte o administrador do seu sítio. Em qualquer outro caso, introduziu informações de ligação incorrectas, provavelmente um directório errado. Contacte o seu servidor de alojamento e peça-lhes as informações de ligação correctas, <em>incluindo o directório</em>, que corresponde ao URL que introduziu neste assistente. Em seguida, volte aqui, introduza as informações correctas e continue com o restauro."
COM_AKEEBA_TRANSFER_ERR_CANNOTREADLOCALFILE="O Akeeba Backup não consegue ler o ficheiro de cópia de segurança local <code>%s</code>. Este assistente falhou. Por favor, efectue uma nova cópia de segurança e tente novamente. Note que foram deixados ficheiros no seu novo servidor; poderá querer removê-los manualmente."
COM_AKEEBA_TRANSFER_ERR_CANNOTRUNKICKSTART="O Akeeba Backup não consegue executar o Akeeba Kickstart no seu novo sítio. Se estiver a tentar restaurar dentro de um subdirectório de um sítio existente, tal significa que o sítio principal está a bloquear o acesso ao subdirectório; contacte o administrador do seu sítio. Em qualquer outro caso, precisa de contactar o seu servidor de alojamento e verificar que a sua versão PHP padrão cumpre os requisitos mínimos do Kickstart."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADARCHIVE="O Akeeba Backup não consegue carregar o ficheiro de cópia de segurança <code>%s</code>. É possível que o servidor do seu novo sítio tenha ficado sem espaço em disco ou que uma protecção do servidor esteja a bloquear a transmissão dos dados. Por favor, tente transferir o seu sítio seleccionando a opção de transferência manual. Note que foram deixados ficheiros no seu novo servidor; poderá querer removê-los manualmente."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADKICKSTART="O Akeeba Backup não consegue carregar o Akeeba Kickstart para a raiz do seu novo sítio. Verifique que introduziu as informações de ligação correctas e que é possível ao utilizador FTP/SFTP escrever ficheiros no directório que seleccionou. Se já tiver kickstart.php e kickstart.transfer.php no sítio remoto, remova-os antes de tentar novamente transferir o seu sítio."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTEMP="O Akeeba Backup não consegue carregar um bloco do seu arquivo de cópia de segurança do ficheiro local <code>%s</code> para o ficheiro remoto <code>%s</code>. Verifique que o seu servidor remoto permite o carregamento de ficheiros e que existe espaço em disco suficiente para o(s) ficheiro(s) do arquivo de cópia de segurança."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTESTFILE="O Akeeba Backup não consegue carregar um ficheiro de teste com o nome <code>%s</code> para a raiz do seu novo sítio. Verifique que introduziu as informações de ligação correctas e que é possível ao utilizador FTP/SFTP escrever ficheiros no directório que seleccionou."
COM_AKEEBA_TRANSFER_ERR_CANNOTWRITEREMOTEFILES="Infelizmente, o Akeeba Backup determinou que não consegue escrever directamente em ficheiros no seu servidor remoto. Este assistente não pode prosseguir. Terá de utilizar o método de transferência \"Manual\"."
COM_AKEEBA_TRANSFER_ERR_CANTCREATETEMPCHUNK="Não é possível criar um ficheiro temporário neste servidor. Verifique que o seu directório temporário está correctamente configurado e que pode ser escrito pelo utilizador sob o qual o servidor web está actualmente a ser executado."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP="Não foi encontrada nenhuma cópia de segurança. Clique no botão Fazer Cópia de Segurança Agora para efectuar uma nova cópia de segurança."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP_SPECIFIC="A cópia de segurança n.º %d não pode ser transferida. Ou não é uma cópia de segurança completa do sítio, ou os seus ficheiros de arquivo já não se encontram neste servidor."
COM_AKEEBA_TRANSFER_ERR_DNS="O nome de domínio do URL que introduziu (%s) não pode ser resolvido a partir do servidor onde o Akeeba Backup está a ser executado. Se registou ou transferiu recentemente o nome de domínio, aguarde mais tempo até os servidores DNS serem actualizados (tipicamente 6 a 48 horas). Caso contrário, verifique as definições DNS do seu nome de domínio."
COM_AKEEBA_TRANSFER_ERR_ERRORFROMREMOTE="O Akeeba Backup recebeu um erro do servidor remoto ao tentar carregar o arquivo de cópia de segurança. O erro foi: %s"
COM_AKEEBA_TRANSFER_ERR_EXISTINGSITE="Já existe outro sítio nessa localização. Remova o sítio existente antes de transferir um novo sítio para lá. Tentar sobrescrever um sítio existente resultará muito provavelmente num sítio danificado que não conseguirá corrigir."
COM_AKEEBA_TRANSFER_ERR_HTACCESS="Foi encontrado um ficheiro <code>%s</code> na raiz do seu novo sítio. Este ficheiro pode interferir com o processo de transferência do sítio. Remova-o antes de prosseguir com a transferência do sítio. Note que o ficheiro pode estar <em>oculto</em>. Se não vir este ficheiro no gestor de ficheiros do painel de controlo do seu alojamento ou no software cliente FTP, peça mais informações ao seu servidor de alojamento sobre como remover este ficheiro."
COM_AKEEBA_TRANSFER_ERR_INVALIDID="ID de carregamento inválido especificado"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN="Verificar"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN_IGNOREERROR="Pretendo ignorar este aviso e prosseguir <strong>por minha conta e risco</strong>"
COM_AKEEBA_TRANSFER_ERR_NEWURL_INVALID="O URL que introduziu é inválido."
COM_AKEEBA_TRANSFER_ERR_NEWURL_NOTEXISTS="O seu servidor não consegue aceder ao URL que introduziu. Por favor, verifique se o digitou correctamente. Tenha também em atenção que nomes de domínio recentemente atribuídos ou transferidos podem demorar <strong>até 48 horas</strong> antes de estarem visíveis para todos os servidores e computadores ligados à Internet."
COM_AKEEBA_TRANSFER_ERR_NEWURL_SAME="O URL que introduziu é igual ao do sítio a partir do qual está a restaurar. Isto não é suportado por este assistente. Para restaurar uma cópia de segurança sem utilizar o assistente, consulte o nosso tutorial em vídeo através da ligação abaixo."
COM_AKEEBA_TRANSFER_ERR_NOTENOUGHSPACE="A transferência do sítio não pode prosseguir. Necessita de aproximadamente %s de espaço livre, mas o seu servidor indica que apenas %s está actualmente disponível. Por favor, liberte mais espaço no seu servidor."
COM_AKEEBA_TRANSFER_ERR_OVERRIDE="Ignorar erros detectados e transferir o sítio na mesma"
