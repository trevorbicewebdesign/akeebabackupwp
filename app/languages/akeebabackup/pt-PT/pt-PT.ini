SOLO_RESTORE_ERR_NOSITEROOT="Nenhuma raiz do sítio está definida. Não é possível restaurar o arquivo de cópia de segurança sem que seja definida."
SOLO_RESTORE_LABEL_SUCCESS_INFO="Deverá agora executar o script de restauro que irá restaurar o conteúdo da sua base de dados e efectuar outras operações de manutenção. Para tal, por favor visite o URL <code>http://www.example.com/installation/index.php</code> onde http://www.example.com é o URL do sítio para o qual está a fazer o restauro. <strong>IMPORTANTE! Não feche a janela onde esta mensagem aparece!</strong>. Após o script de restauro terminar, feche a sua janela e regresse aqui. Em seguida, clique no botão Finalizar Restauro abaixo para remover o directório <tt>installation</tt>. Depois poderá começar a utilizar o sítio restaurado."
SOLO_RESTORE_LABEL_SUCCESS_INFO_HASURL="Deverá agora executar o script de restauro que irá restaurar o conteúdo da sua base de dados e efectuar outras operações de manutenção. Para tal, por favor visite o URL <code>%s/installation/index.php</code> onde %s é o URL do sítio para o qual está a fazer o restauro. Pode visitar este URL clicando no botão Executar Script de Restauro abaixo. <strong>IMPORTANTE! Não feche a janela onde esta mensagem aparece!</strong>. Após o script de restauro terminar, feche a sua janela e regresse aqui. Em seguida, clique no botão Finalizar Restauro abaixo para remover o directório <tt>installation</tt>. Depois poderá começar a utilizar o sítio restaurado."
