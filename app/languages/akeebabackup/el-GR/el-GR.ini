SOLO_MAIN_ERR_CONFIGREADABLE_BODY="Εντοπίστηκε ότι το αρχείο διαμόρφωσης του Akeeba Solo είναι προσβάσιμο μέσω διαδικτύου στη διεύθυνση URL <code>%s</code>. Αυτό ενδέχεται να αποτελεί <strong>εξαιρετικά σοβαρό</strong> κίνδυνο ασφαλείας. Σας συνιστούμε ανεπιφύλακτα να ακολουθήσετε τις οδηγίες της τεκμηρίωσής μας για να ασφαλίσετε τον φάκελο που περιέχει αυτό το αρχείο."
