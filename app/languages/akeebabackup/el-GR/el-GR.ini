SOLO_SETUP_LBL_ADBLOCK_WARNING="Ένα πρόγραμμα αποκλεισμού διαφημίσεων ή δεσμών ενεργειών είναι αυτήν τη στιγμή ενεργοποιημένο σε αυτό τον ιστότοπο. Θα πρέπει να το απενεργοποιήσετε σε αυτό το domain εάν αντιμετωπίζετε προβλήματα (για παράδειγμα, τα κουμπιά διεπαφής δεν λειτουργούν)"
SOLO_SETUP_LBL_ANCIENTIENOTICE="Χρησιμοποιείτε μια παλιά, μη υποστηριζόμενη έκδοση του Internet Explorer. Παρακαλώ ενημερώστε στην <a href='%s'>τελευταία έκδοση</a> του Internet Explorer. Εάν δεν είναι διαθέσιμη για την έκδοση Windows που χρησιμοποιείτε, παρακαλώ χρησιμοποιήστε ένα σύγχρονο πρόγραμμα περιήγησης συμβατό με πρότυπα όπως το <a href='%s'>Chrome</a>. Παρόλο που μπορεί να είναι δυνατή η συνέχιση της εγκατάστασης με την παλιά, μη υποστηριζόμενη έκδοση του Internet Explorer, δεν μπορούμε να εγγυηθούμε ότι η εμπειρία χρήσης του Akeeba Solo θα είναι χωρίς προβλήματα."
