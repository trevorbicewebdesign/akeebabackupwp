COM_AKEEBA_SCHEDULE_LBL_JSONAPI_INTRO="Εάν χρησιμοποιείτε το Akeeba UNiTE ή άλλο λογισμικό που χρησιμοποιεί το απομακρυσμένο JSON API, θα πρέπει να παρέχετε τις ακόλουθες πληροφορίες."
COM_AKEEBA_SCHEDULE_LBL_JSONAPI_OTHER="Άλλα εργαλεία"
