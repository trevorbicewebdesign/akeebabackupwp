COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας στο RackSpace CloudFiles.<br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμηματικού αρχείου 2-30Mb ή διακινδυνεύετε αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong>"
