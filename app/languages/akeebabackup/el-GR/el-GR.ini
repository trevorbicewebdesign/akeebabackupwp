COM_AKEEBA_CONFIG_WHERE_ARE_THE_FILTERS="Εάν αναζητάτε τα φίλτρα &ndash;π.χ. για εξαίρεση αρχείων, φακέλων και πινάκων βάσης δεδομένων&ndash; κάντε κλικ στο κουμπί Άκυρο για να επιστρέψετε στη σελίδα Πίνακα ελέγχου όπου μπορείτε να αποκτήσετε πρόσβαση σε αυτές τις λειτουργίες απευθείας."
COM_AKEEBA_CONFIG_ZIPCDGLUECHUNKSIZE_DESCRIPTION="Τα αρχεία ZIP αποτελούνται από ένα τμήμα δεδομένων και ένα τμήμα \"καταλόγου\". Αυτά τα τμήματα επεξεργάζονται παράλληλα από το Akeeba Backup και ενώνονται κατά το στάδιο οριστικοποίησης του αρχείου. Αυτή η παράμετρος καθορίζει πόσα δεδομένα θα επεξεργάζονται κάθε φορά κατά αυτό το στάδιο. Δεν χρειάζεται να αλλάξετε αυτή τη ρύθμιση εκτός εάν αντιμετωπίζετε σοβαρά προβλήματα εξάντλησης μνήμης."
