COM_AKEEBA_SCHEDULE_LBL_JSONAPI_ARCCLI_DOCKER="Για να δημιουργήσετε αντίγραφο ασφαλείας χρησιμοποιώντας το Akeeba Remote CLI μέσω <strong>Docker</strong> εκτελέστε την ακόλουθη εντολή:"
COM_AKEEBA_SCHEDULE_LBL_JSONAPI_ARCCLI_INTRO="Μπορείτε να χρησιμοποιήσετε την εφαρμογή γραμμής εντολών Akeeba Remote CLI για να δημιουργείτε αντίγραφα ασφαλείας των ιστότοπών σας εξ αποστάσεως. Μπορείτε να προγραμματίσετε αυτές τις εντολές στον υπολογιστή σας ή σε έναν άλλο διακομιστή, για να αυτοματοποιήσετε τα αντίγραφα ασφαλείας σας."
COM_AKEEBA_SCHEDULE_LBL_JSONAPI_ARCCLI_PHAR="Για να δημιουργήσετε αντίγραφο ασφαλείας χρησιμοποιώντας το Akeeba Remote CLI μέσω του <strong>αρχείου PHAR</strong> που μπορείτε να κατεβάσετε από τον ιστότοπό μας, εκτελέστε την ακόλουθη εντολή:"
COM_AKEEBA_SCHEDULE_LBL_JSONAPI_DISABLED="Παρακαλώ μεταβείτε στη σελίδα του Πίνακα ελέγχου, κάντε κλικ στη Διαμόρφωση συστήματος, και μετά στην καρτέλα Δημόσιο API. Ορίστε το «Ενεργοποίηση JSON API (απομακρυσμένο αντίγραφο ασφαλείας)» σε Ναι για να ενεργοποιήσετε αυτή τη λειτουργία."
COM_AKEEBA_SCHEDULE_LBL_JSONAPI_DISCLAIMER="Η Akeeba Ltd δεν εγκρίνει, δεν αναλαμβάνει ευθύνη, ούτε παρέχει υποστήριξη για λογισμικό ή υπηρεσίες τρίτων που διασυνδέονται με το Akeeba Backup μέσω του JSON API. Θα παρέχουμε υποστήριξη για τη δημιουργία αντιγράφων ασφαλείας με το Akeeba JSON API μόνο εάν το μυστικό κλειδί έχει δημιουργηθεί αυτόματα από το λογισμικό μας και το αίτημα αφορά τη χρήση του δικού μας λογισμικού-πελάτη Akeeba JSON API (π.χ. Akeeba Remote CLI)."
