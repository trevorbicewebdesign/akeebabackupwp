SOLO_SETUP_LBL_SESSIONTIMEOUT="Λήξη συνεδρίας (λεπτά)"
SOLO_SETUP_LBL_SESSIONTIMEOUT_HELP="Θα παραμένετε συνδεδεμένος/η στο Akeeba Solo για αυτά τα λεπτά από την τελευταία σας δραστηριότητα στο σύστημα. Η προεπιλογή είναι 1440 λεπτά (μία ημέρα). Συνιστούμε να αποσυνδέεστε πάντα μετά τη διαχείριση του Akeeba Solo ως τυπική πρακτική ασφαλείας. Παρά αυτή τη ρύθμιση, ενδέχεται να αποσυνδεθείτε αυτόματα εάν αλλάξει η IP σας, ενημερωθεί το πρόγραμμα περιήγησής σας ή τροποποιηθεί η συμβολοσειρά user agent του προγράμματος περιήγησής σας (π.χ. ενημέρωση λειτουργικού συστήματος, ενημέρωση Java κ.λπ.)."
