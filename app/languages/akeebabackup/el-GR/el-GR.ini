COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_CORE="<p>Μπορείτε να επαναφέρετε τα αντίγραφα ασφαλείας σας σε οποιονδήποτε διακομιστή, ακόμα και σε διαφορετικό από αυτόν όπου δημιουργήθηκε το αντίγραφο. Ακολουθήστε το <a href=\"%s\" target=\"_blank\">βίντεο εκπαιδευτικό υλικό</a> μας. Θα χρειαστείτε να <a href=\"%3$s\" target=\"_blank\">κατεβάσετε το Akeeba Kickstart Core (δωρεάν)</a> για να αποσυμπιέσετε τα αρχεία αντιγράφων ασφαλείας, όπως ακριβώς σας δείχνει το εκπαιδευτικό υλικό.</p>"
COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_CORE_INFO_ABOUT_PRO="<strong>Μπορεί <em>να είναι</em> ευκολότερο από αυτό.</strong>Μπορείτε να επαναφέρετε αρχεία αντιγράφων ασφαλείας στον ίδιο ή σε διαφορετικό διακομιστή μέσα από τη διεπαφή του Akeeba Backup. Δεν χρειάζεται να μεταφέρετε αρχεία μόνοι σας. Μάθετε για αυτές και πολλές άλλες λειτουργίες που διατίθενται αποκλειστικά στο <a href=\"%s\">Akeeba Backup Professional</a>!"
COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_PRO="<p>Είναι εύκολο! Επιλέξτε το πλαίσιο ελέγχου δίπλα σε μια εγγραφή αντιγράφου ασφαλείας. Στη συνέχεια κάντε κλικ στο κουμπί <em>Επαναφορά</em> στη γραμμή εργαλείων.</p><p>Εάν θέλετε να επαναφέρετε σε έναν νέο, δημόσιο διακομιστή, μπορείτε να χρησιμοποιήσετε τον <a href=\"%2$s\">Οδηγό μεταφοράς ιστότοπου</a>. Εάν προτιμάτε να το κάνετε χειροκίνητα ή να επαναφέρετε στον υπολογιστή σας ή στο Intranet, παρακαλώ παρακολουθήστε το <a href=\"%1$s\" target=\"_blank\">βίντεο εκπαιδευτικό υλικό</a> μας και <a href=\"%3$s\" target=\"_blank\">κατεβάστε το Akeeba Kickstart Core (δωρεάν)</a> για να αποσυμπιέσετε τα αρχεία αντιγράφων ασφαλείας.</p>"
