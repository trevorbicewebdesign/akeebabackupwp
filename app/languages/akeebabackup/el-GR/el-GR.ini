COM_AKEEBA_CRONS_LBL_CRON_EXPRESSION_TIP="Ορίζει στο WP-CRON πότε και πόσο συχνά να εκτελεί αντίγραφο ασφαλείας. Οι <a href=\"https://en.wikipedia.org/wiki/Cron#Cron_expression\" target=\"_blank\">εκφράσεις CRON</a> είναι είτε προκαθορισμένες (π.χ. <code>@daily</code>), είτε πέντε πεδία διαχωρισμένα με κενό με αυτή τη σειρά: <code>λεπτό ώρα ημέρα μήνας ημέρα_εβδομάδας</code>. Δείτε παραδείγματα και δοκιμάστε τις εκφράσεις CRON σας στο εργαλείο τρίτου μέρους <a href=\"https://crontab.guru\" target=\"_blank\">Crontab Guru</a>. Συμβουλευτείτε την τεκμηρίωσή μας για περισσότερες λεπτομέρειες."
