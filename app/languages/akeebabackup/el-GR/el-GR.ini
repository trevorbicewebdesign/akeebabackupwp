COM_AKEEBA_CPANEL_LBL_INCLUDEEXCLUDE_CALLOUT="Οι επιλογές συμπερίληψης και εξαίρεσης εφαρμόζονται μόνο στο ενεργό προφίλ αντιγράφου ασφαλείας."
COM_AKEEBA_CPANEL_LBL_OUTDIR_CLICKTHEBUTTON="Κάντε κλικ στο παρακάτω κουμπί για να διορθώσετε αυτό το πρόβλημα. Δείτε τι κάνει."
COM_AKEEBA_CPANEL_LBL_OUTDIR_DELETEORBEHACKED="Μέχρι να το κάνετε αυτό, <strong>ΣΥΝΙΣΤΑΤΑΙ ΕΝΤΟΝΑ</strong> να μην δημιουργείτε αντίγραφο ασφαλείας του ιστότοπού σας και, εάν έχετε ήδη κάνει, να διαγράψετε όλα τα αρχεία αντιγράφου ασφαλείας και τα αρχεία καταγραφής. <strong>Η ΜΗ ΤΗΡΗΣΗ ΑΥΤΩΝ ΤΩΝ ΟΔΗΓΙΩΝ ΕΙΝΑΙ ΠΟΛΥ ΠΙΘΑΝΟ ΝΑ ΟΔΗΓΗΣΕΙ ΣΕ ΠΑΡΑΒΙΑΣΗ (HACKING) ΤΟΥ ΙΣΤΟΤΟΠΟΥ ΣΑΣ.</strong>"
COM_AKEEBA_CPANEL_LBL_OUTDIR_FILEREADABLE="Το Akeeba Backup εντόπισε ότι ο φάκελος εξόδου αντιγράφου ασφαλείας <code>%s</code> βρίσκεται κάτω από τον κατάλογο root του ιστότοπού σας. Τα περιεχόμενά του, συμπεριλαμβανομένων των αρχείων αντιγράφου ασφαλείας, είναι προσβάσιμα μέσω του web. Ωστόσο, ΔΕΝ είναι δυνατή η καταχώριση των αρχείων του φακέλου με πρόγραμμα περιήγησης. <strong>Αυτό μπορεί να αποτελεί πρόβλημα ασφαλείας</strong>. Ένας εισβολέας μπορεί να μαντέψει το όνομα του αρχείου αντιγράφου ασφαλείας και να το κατεβάσει απευθείας, παρακάμπτοντας την ασφάλεια του ιστότοπού σας."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_RANDOM="Το «Όνομα αρχείου εξόδου αντιγράφου ασφαλείας» θα τροποποιηθεί ώστε να συμπεριλαμβάνει τη μεταβλητή <code>[RANDOM]</code>. Αυτό καθιστά πρακτικά αδύνατη την εικασία ονομάτων αρχείων αντιγράφου ασφαλείας, προσθέτοντας 16 διαφορετικά, τυχαία γράμματα ή/και αριθμούς στο όνομα αρχείου αντιγράφου ασφαλείας κάθε φορά που δημιουργείτε αντίγραφο ασφαλείας."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_SECURITYFILES="Ένα αρχείο <code>.htaccess</code> και ένα αρχείο <code>web.config</code> θα εγγραφούν σε αυτόν τον φάκελο. Στους περισσότερους διακομιστές αυτό αρκεί για να αποτρέψει την άμεση λήψη οποιουδήποτε αρχείου μέσω web και απενεργοποιεί την καταχώριση των αρχείων του. Διαθέτουμε επίσης λύση για τους διακομιστές όπου αυτά τα ειδικά αρχεία δεν έχουν αποτέλεσμα. Τρία ακόμα αρχεία με ονόματα <code>index.php</code>, <code>index.html</code> και <code>index.htm</code> θα εγγραφούν επίσης σε αυτόν τον φάκελο. Αυτά τα αρχεία ευρετηρίου αποτρέπουν τον διακομιστή web από το να εμφανίζει τα ονόματα των αρχείων αντιγράφου ασφαλείας και των αρχείων καταγραφής."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM="Επιπλέον, ο φάκελος εξόδου σας είναι ίδιος ή υποφάκελος ενός φακέλου που χρησιμοποιείται από τον ιστότοπό σας για δημοσίως προσβάσιμα αρχεία συστήματος ή τρίτων."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM_FIX="Μεταβείτε στη σελίδα Διαμόρφωσης του Akeeba Backup και επιλέξτε διαφορετικό φάκελο εξόδου."
COM_AKEEBA_CPANEL_LBL_OUTDIR_LISTABLE="Το Akeeba Backup εντόπισε ότι ο φάκελος εξόδου αντιγράφου ασφαλείας <code>%s</code> βρίσκεται κάτω από τον κατάλογο root του ιστότοπού σας. Τα περιεχόμενά του, συμπεριλαμβανομένων των αρχείων αντιγράφου ασφαλείας, είναι προσβάσιμα μέσω του web. Επιπλέον, είναι δυνατή η καταχώριση των αρχείων του φακέλου, δηλαδή εμφανίζει λίστα αρχείων αντιγράφου ασφαλείας όταν προσπελάζεται με πρόγραμμα περιήγησης. <strong>Αυτό αποτελεί σοβαρό πρόβλημα ασφαλείας</strong>. Ένας εισβολέας μπορεί να αποκτήσει πρόσβαση σε αυτόν τον φάκελο μέσω προγράμματος περιήγησης και να κατεβάσει απευθείας τα αρχεία αντιγράφου ασφαλείας, παρακάμπτοντας την ασφάλεια του ιστότοπού σας."
COM_AKEEBA_CPANEL_LBL_OUTDIR_TRASHHOST="Δυστυχώς, ο διακομιστής σας δεν υποστηρίζει καμία εύλογη μέθοδο για την ασφάλεια του φακέλου. Ανεξάρτητα από τις ενέργειές μας, θα εμφανίζει πάντα τα ονόματα των αρχείων που περιέχει και θα επιτρέπει τη λήψη τους από πρόγραμμα περιήγησης. Η μοναδική σας επιλογή είναι να δημιουργήσετε φάκελο εξόδου αντιγράφου ασφαλείας πάνω από τον κατάλογο root του ιστότοπού σας."
