SOLO_CONFIG_QUICKBACKUP_PROFILE_DESCRIPTION="Το προφίλ αντιγράφου ασφαλείας που θα χρησιμοποιείται με το γρήγορο εικονίδιο γρήγορου αντιγράφου ασφαλείας στον πίνακα ελέγχου WordPress."
SOLO_CONFIG_QUICKBACKUP_PROFILE_LABEL="Προφίλ εικονιδίου γρήγορου αντιγράφου ασφαλείας"
SOLO_CONFIG_UNDER_TOOLS_DESCRIPTION="Όχι: Το Akeeba Backup εμφανίζεται στο πλαϊνό μενού του WordPress ως στοιχείο ανώτατου επιπέδου, τοποθετημένο κοντά στο κάτω μέρος. Ναι: Το Akeeba Backup εμφανίζεται ως στοιχείο υπομενού κάτω από το στοιχείο μενού «Εργαλεία» του WordPress στο πλαϊνό μενού."
SOLO_CONFIG_UNDER_TOOLS_LABEL="Τοποθέτηση κάτω από τα Εργαλεία"
SOLO_CONFIG_UPDATE_INTEGRATED_WP="Εμφάνιση ενημέρωσης Akeeba Backup στη σελίδα Πρόσθετα"
SOLO_CONFIG_UPDATE_INTEGRATED_WP_DESC="Όταν είναι ενεργοποιημένο, το Akeeba Backup θα ειδοποιεί το WordPress σχετικά με τη διαθεσιμότητα ενημερώσεων και την τοποθεσία των αρχείων ενημέρωσης. Αυτό επιτρέπει στο WordPress να συμπεριλαμβάνει τις ενημερώσεις Akeeba Backup στον αριθμό διαθέσιμων ενημερώσεων και να εμφανίζει τις ενημερώσεις Akeeba Backup στη σελίδα Πρόσθετα. Σε ελάχιστους ιστότοπους, αυτό μπορεί να οδηγήσει σε κενή σελίδα ή σφάλμα κατά την προσπάθεια πρόσβασης στη σελίδα Πρόσθετα, λόγω αλληλεπίδρασης με κακώς γραμμένα πρόσθετα τρίτων. Σε αυτήν την περίπτωση, απενεργοποιήστε αυτήν την επιλογή και επικοινωνήστε μαζί μας με λίστα των ενεργοποιημένων προσθέτων και τις εκδόσεις τους."
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_CONSERVATIVE="Συντηρητικό"
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_DESCRIPTION="Όταν είναι ενεργοποιημένο, τα αντίγραφα ασφαλείας που εκτελούνται μέσω WP-CRON θα έχουν τα όρια ελάχιστου και μέγιστου χρόνου εκτέλεσης που έχουν οριστεί στην ενότητα Βελτιστοποίηση του προφίλ αντιγράφου ασφαλείας παρακαμπτόμενα. Η ρύθμιση «Αισιόδοξο» θα προσπαθήσει να χρησιμοποιήσει τον μέγιστο δυνατό χρόνο στον διακομιστή σας — έως 60 δευτερόλεπτα — δημιουργώντας γρηγορότερα, αλλά πιο επιρρεπή σε αποτυχία, αντίγραφα ασφαλείας. Η ρύθμιση «Συντηρητικό» θα προσπαθήσει να χρησιμοποιήσει μόνο το μισό χρόνο σε σχέση με τη ρύθμιση «Αισιόδοξο», δημιουργώντας πιο αργά, αλλά λιγότερο πιθανό να αποτύχουν, αντίγραφα ασφαλείας. Ορισμένοι διακομιστές ενδέχεται να απαιτούν τη ρύθμιση «Όχι» και τη χειροκίνητη προσαρμογή των ρυθμίσεων Βελτιστοποίησης για τη σωστή λειτουργία του αντιγράφου ασφαλείας."
