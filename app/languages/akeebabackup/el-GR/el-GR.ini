COM_AKEEBA_RESTORE_LABEL_ZAPBEFORE_HELP="Προσπαθεί να διαγράψει όλα τα υπάρχοντα αρχεία και φακέλους στον ριζικό κατάλογο του ιστότοπού σας πριν από την αποσυμπίεση του αρχείου αντιγράφου ασφαλείας. ΔΕΝ λαμβάνει υπόψη ποια αρχεία και φάκελοι υπάρχουν στο αρχείο αντιγράφου ή ποια αρχεία και φάκελοι εξαιρέθηκαν κατά την δημιουργία αντιγράφου ασφαλείας. Τα αρχεία και οι φάκελοι που διαγράφονται από αυτή τη λειτουργία ΔΕΝ ΜΠΟΡΟΥΝ να ανακτηθούν. <strong>ΠΡΟΕΙΔΟΠΟΙΗΣΗ! ΑΥΤΟ ΜΠΟΡΕΙ ΝΑ ΔΙΑΓΡΑΨΕΙ ΑΡΧΕΙΑ ΚΑΙ ΦΑΚΕΛΟΥΣ ΠΟΥ ΔΕΝ ΑΝΗΚΟΥΝ ΣΤΟΝ ΙΣΤΟΤΟΠΟ ΣΑΣ. Η ΛΕΙΤΟΥΡΓΙΑ ΑΥΤΗ ΠΡΟΟΡΙΖΕΤΑΙ ΜΟΝΟ ΓΙΑ ΕΞΑΙΡΕΤΙΚΑ ΕΜΠΕΙΡΟΥΣ ΧΡΗΣΤΕΣ ΠΟΥ ΚΑΤΑΝΟΟΥΝ ΤΟΥΣ ΚΙΝΔΥΝΟΥΣ. ΧΡΗΣΙΜΟΠΟΙΕΙΤΕ ΜΕ ΑΚΡΑΤΗ ΠΡΟΣΟΧΗ. ΕΝΕΡΓΟΠΟΙΩΝΤΑΣ ΑΥΤΗ ΤΗ ΛΕΙΤΟΥΡΓΙΑ ΑΝΑΛΑΜΒΑΝΕΤΕ ΠΛΗΡΗ ΕΥΘΥΝΗ ΚΑΙ ΥΠΟΧΡΕΩΣΗ. ΕΠΙΠΛΕΟΝ ΠΑΡΑΙΤΕΙΣΤΕ ΑΠΟ ΚΑΘΕ ΔΙΚΑΙΩΜΑ ΖΗΤΗΣΗΣ ΥΠΟΣΤΗΡΙΞΗΣ ΑΠΟ ΤΗΝ Akeeba Ltd.</strong>"
