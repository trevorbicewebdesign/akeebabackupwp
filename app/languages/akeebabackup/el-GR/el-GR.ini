COM_AKEEBA_S3_REGION_DESCRIPTION="Επιλέξτε την περιοχή S3 στην οποία βρίσκεται το bucket σας. Συμβουλευτείτε το http://docs.aws.amazon.com/general/latest/gr/rande.html#s3_region <strong>ΠΡΟΣΟΧΗ! Λόγω του API της Amazon, ΠΡΕΠΕΙ να επιλέξετε την τοποθεσία του bucket σας όταν χρησιμοποιείτε τη μέθοδο υπογραφής v4. Η μέθοδος υπογραφής v4 είναι ΥΠΟΧΡΕΩΤΙΚΗ για όλα τα buckets που δημιουργήθηκαν σε οποιαδήποτε περιοχή η οποία ενεργοποιήθηκε μετά τον Ιανουάριο 2014, όπως η Φρανκφούρτη και το Σάο Πάολο.</strong> Αυτός είναι περιορισμός της Amazon, όχι του Akeeba Backup. Σας ευχαριστούμε για την κατανόησή σας."
