SOLO_CONFIG_PLATFORM_SITEURL_DESCRIPTION="(Προαιρετικό) Εισάγετε το URL του ιστότοπου για τον οποίο θα δημιουργήσετε αντίγραφο ασφαλείας, π.χ. <code>http://www.example.com</code>. Αυτό επιτρέπει στη δέσμη ενεργειών εγκατάστασης να προσδιορίσει εάν εκτελείτε επαναφορά στον ίδιο ιστότοπο ή εάν κλωνοποιείτε / μεταφέρετε τον ιστότοπο. Εάν δεν καθορίσετε το URL, η δέσμη ενεργειών επαναφοράς θα σας ζητά πάντα να εισάγετε εκ νέου τα στοιχεία σύνδεσης βάσης δεδομένων, κάτι που μπορεί να δημιουργεί σύγχυση κατά την επαναφορά ενός αντιγράφου ασφαλείας στον ιστότοπο από τον οποίο ελήφθη."
