COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_DESCRIPTION="Δημιουργεί αρχεία κρυπτογραφημένα με τη μέθοδο κρυπτογράφησης AES-128 βιομηχανικού προτύπου, σε μορφή πολύ παρόμοια με JPA. Απαιτεί εγκατεστημένη και ενεργοποιημένη στον ιστότοπό σας την επέκταση PHP mcrypt ή openssl."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_TITLE="Κρυπτογραφημένα αρχεία (JPS)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_DESCRIPTION="Το αρχείο ZIP θα δημιουργηθεί χρησιμοποιώντας την κλάση ZipArchive της PHP. ΣΗΜΑΝΤΙΚΟ: Αυτή η μηχανή δεν υποστηρίζει διαχωρισμό αρχείων ή διαχείριση συμβολικών συνδέσμων και μπορεί, επομένως, να οδηγήσει σε προβλήματα αντιγράφου ασφαλείας. Εάν εμφανίζονται σφάλματα υπέρβασης χρονικού ορίου, σφάλματα AJAX ή μηνύματα εσωτερικού σφάλματος διακομιστή, θα πρέπει να μεταβείτε σε διαφορετική μηχανή αρχειοθέτησης και να ενεργοποιήσετε τον διαχωρισμό αρχείων."
