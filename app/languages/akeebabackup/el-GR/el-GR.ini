COM_AKEEBA_CONFIG_UI_ROOTDIR="Η χρήση του κορυφαίου φακέλου του ιστότοπου για έξοδο αντιγράφων ασφαλείας ή προσωρινή αποθήκευση αρχείων θα οδηγήσει σε αποτυχία του αντιγράφου ασφαλείας. Αγνοείται η ρύθμισή σας."
COM_AKEEBA_CONFIG_UI_SETTINGS_NOTSECURED="Ο διακομιστής σας δεν υποστηρίζει κρυπτογράφηση των ρυθμίσεων διαμόρφωσής σας. Σας συνιστούμε ανεπιφύλακτα να μην αποθηκεύετε κωδικούς πρόσβασης στη διαμόρφωση."
COM_AKEEBA_CONFIG_UI_SETTINGS_SECURED="Οι ρυθμίσεις σας προστατεύονται με κρυπτογράφηση 128-bit. Μπορείτε να αποθηκεύσετε με ασφάλεια τους κωδικούς πρόσβασής σας στη διαμόρφωση."
COM_AKEEBA_CONFIG_UI_SFTPBROWSER_TITLE="Περιηγητής Φακέλων SFTP"
COM_AKEEBA_CONFIG_UPLOADKICKSTART_DESCRIPTION="Όταν είναι ενεργοποιημένο, ένα αντίγραφο του Akeeba Kickstart Professional θα αποστέλλεται στην απομακρυσμένη αποθήκη που έχει οριστεί στη Μηχανή Μετά-επεξεργασίας παραπάνω (εκτός από τις μηχανές Καμία και Email). Αυτό είναι χρήσιμο όταν χρησιμοποιείτε FTP ή SFTP για τη μεταφορά του ιστότοπού σας σε διαφορετικό διακομιστή: τόσο το αρχείο αντιγράφου ασφαλείας όσο και το Kickstart, που χρησιμοποιείται για την αποσυμπίεσή του, θα αποσταλούν στον απομακρυσμένο διακομιστή σας. Μετά την ολοκλήρωση του αντιγράφου ασφαλείας, μπορείτε απλώς να εκκινήσετε το Kickstart στον απομακρυσμένο ιστότοπο και να προχωρήσετε με την επαναφορά του. Τόσο απλό!"
COM_AKEEBA_CONFIG_UPLOADKICKSTART_TITLE="Αποστολή Kickstart στην απομακρυσμένη αποθήκη"
COM_AKEEBA_CONFIG_USAGESTATS_SOLO_DESC="Βοηθήστε μας να βελτιώσουμε το λογισμικό μας με ανώνυμη και αυτόματη αναφορά των εκδόσεών σας PHP και MySQL. Αυτές οι πληροφορίες θα μας βοηθήσουν να αποφασίσουμε ποιες εκδόσεις PHP και MySQL θα υποστηρίξουμε σε μελλοντικές εκδόσεις. Σημείωση: ΔΕΝ συλλέγουμε το όνομα του ιστότοπου, τη διεύθυνση IP ή οποιεσδήποτε άλλες άμεσα ή έμμεσα μοναδικές πληροφορίες ταυτοποίησης."
COM_AKEEBA_CONFIG_USAGESTATS_SOLO_LABEL="Ενεργοποίηση ανώνυμης αναφοράς έκδοσης PHP και MySQL"
COM_AKEEBA_CONFIG_ACCURATE_PHP_CLI_LABEL="Ακριβής διαδρομή PHP-CLI"
COM_AKEEBA_CONFIG_ACCURATE_PHP_CLI_DESC="Ενεργοποιήστε για να επιχειρήσει το Akeeba Solo να εντοπίσει την ακριβή διαδρομή PHP-CLI στον διακομιστή σας. Απενεργοποιήστε εάν ο διακομιστής σας δεν το επιτρέπει, κλειδώνοντας τη διεύθυνση IP σας έξω από τον ιστότοπό σας για αρκετά λεπτά έως ώρες όταν συμβεί αυτό (για παράδειγμα IONOS)."
COM_AKEEBA_CONFIG_VIRTUALFOLDER_DESCRIPTION="Εάν έχετε διαμορφώσει εξωτερικούς φακέλους, τα περιεχόμενά τους θα εμφανίζονται μέσα στο αρχείο ως υποφάκελοι αυτού του εικονικού φακέλου. Είναι εικονικός επειδή δεν υπάρχει πραγματικά στον διακομιστή σας. Υπάρχει μόνο μέσα στο αρχείο αντιγράφου ασφαλείας. Βεβαιωθείτε ότι το όνομα του εικονικού φακέλου δεν συγκρούεται με έναν υπάρχοντα φάκελο για να αποφύγετε απώλεια δεδομένων."
COM_AKEEBA_CONFIG_VIRTUALFOLDER_TITLE="Εικονικός φάκελος για εξωτερικά αρχεία"
