SOLO_WP_SITEHEALTH_BACKUP_OUT_OF_DATE_DESCRIPTION="Δεν έχετε δημιουργήσει αντίγραφο ασφαλείας του ιστότοπού σας με το Akeeba Backup εδώ και καιρό. Συνιστάται ιδιαίτερα η τακτική δημιουργία αντιγράφων ασφαλείας. Τα αντίγραφα ασφαλείας μπορούν να χρησιμοποιηθούν για να επαναφέρετε τον ιστότοπό σας σε προηγούμενη, γνωστή κατάσταση λειτουργίας."
SOLO_WP_SITEHEALTH_BACKUP_FAILED_DESCRIPTION="Το τελευταίο αντίγραφο ασφαλείας που προσπαθήσατε να δημιουργήσετε με το Akeeba Backup απέτυχε. Πρέπει να ελέγξετε την αιτία της αποτυχίας και να την αντιμετωπίσετε το συντομότερο δυνατό."
