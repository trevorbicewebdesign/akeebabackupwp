SOLO_SETUP_LBL_DATABASE_HOST="Όνομα κεντρικού υπολογιστή διακομιστή βάσης δεδομένων"
SOLO_SETUP_LBL_DATABASE_HOST_HELP="Το όνομα κεντρικού υπολογιστή ή η διεύθυνση IP του διακομιστή βάσης δεδομένων (συνήθως: localhost). Σημειώστε ότι το localhost και το 127.0.0.1 είναι <em>πολύ</em> διαφορετικά για τη MySQL· ίσως χρειαστεί να δοκιμάσετε και τα δύο για να δείτε ποιο λειτουργεί με τον διακομιστή βάσης δεδομένων σας. Εάν ο διακομιστής σας χρησιμοποιεί μη τυπική θύρα, προσθέστε την μετά το όνομα κεντρικού υπολογιστή με πρόθεμα άνω-κάτω τελεία, π.χ. 127.0.0.1:1234 για χρήση διακομιστή βάσης δεδομένων στο 127.0.0.1 που ακούει στη θύρα 1234."
SOLO_SETUP_LBL_DATABASE_INFO="Το Akeeba Solo χρειάζεται μια βάση δεδομένων για την αποθήκευση των ρυθμίσεων διαμόρφωσής του και ενός αρχείου καταγραφής όλων των προσπαθειών δημιουργίας αντιγράφων ασφαλείας. Παρακαλούμε δώστε τις παραμέτρους σύνδεσης στη βάση δεδομένων παρακάτω. Μπορείτε να χρησιμοποιήσετε είτε την ίδια βάση δεδομένων με τον ιστότοπο του οποίου θέλετε να δημιουργήσετε αντίγραφο ασφαλείας, είτε μια αποκλειστική βάση δεδομένων αποκλειστικά για το Akeeba Solo (συνιστάται)."
SOLO_SETUP_LBL_DATABASE_NAME="Όνομα βάσης δεδομένων"
SOLO_SETUP_LBL_DATABASE_NAME_HELP="Το όνομα της βάσης δεδομένων σας. Οι περισσότεροι πάροχοι που χρησιμοποιούν cPanel, Plesk και άλλα κύρια πάνελ φιλοξενίας δίνουν ονόματα βάσεων δεδομένων όπως abcdef_username, όπου abcdef είναι το όνομα χρήστη του πάνελ ελέγχου φιλοξενίας σας. Εάν δεν είστε σίγουρος/η, ρωτήστε τον πάροχο φιλοξενίας σας."
SOLO_SETUP_LBL_DATABASE_PASS="Κωδικός πρόσβασης"
SOLO_SETUP_LBL_DATABASE_PASS_HELP="Ο κωδικός πρόσβασης που χρησιμοποιείτε για σύνδεση στη βάση δεδομένων σας."
SOLO_SETUP_LBL_DATABASE_PREFIX="Πρόθεμα ονόματος πίνακα βάσης δεδομένων"
SOLO_SETUP_LBL_DATABASE_PREFIX_HELP="Το κοινό πρόθεμα ονόματος πίνακα για όλους τους πίνακες βάσης δεδομένων που ανήκουν σε αυτή την εγκατάσταση Akeeba Solo. Μπορείτε να το αλλάξετε εάν έχετε πολλαπλές εγκαταστάσεις Akeeba Solo που μοιράζονται την ίδια βάση δεδομένων."
SOLO_SETUP_LBL_DATABASE_USER="Όνομα χρήστη"
SOLO_SETUP_LBL_DATABASE_USER_HELP="Το όνομα χρήστη που χρησιμοποιείτε για σύνδεση στη βάση δεδομένων σας. Οι περισσότεροι πάροχοι που χρησιμοποιούν cPanel, Plesk και άλλα κύρια πάνελ φιλοξενίας δίνουν ονόματα χρήστη όπως abcdef_username, όπου abcdef είναι το όνομα χρήστη του πάνελ ελέγχου φιλοξενίας σας. Εάν δεν είστε σίγουρος/η, ρωτήστε τον πάροχο φιλοξενίας σας."
SOLO_SETUP_LBL_FS_DRIVER="Πρόγραμμα οδήγησης συστήματος αρχείων"
SOLO_SETUP_LBL_FS_DRIVER_FILE="Άμεση εγγραφή αρχείων"
SOLO_SETUP_LBL_FS_DRIVER_FTP="Λειτουργία FTP - Πρωτόκολλο μεταφοράς αρχείων"
SOLO_SETUP_LBL_FS_DRIVER_HELP="Σε πολλούς κοινόχρηστους διακομιστές χρειάζεται να χρησιμοποιήσετε μία από τις διαθέσιμες λειτουργίες (S)FTP στο αναπτυσσόμενο μενού –και να εισαγάγετε τις παραμέτρους (S)FTP σας στα πεδία που εμφανίζονται παρακάτω αν κάνετε αυτή την επιλογή– για να βεβαιωθείτε ότι το Akeeba Solo μπορεί να γράψει σωστά στα αρχεία του. Δεν υποστηρίζουν όλοι οι διακομιστές SFTP. Χρειάζεστε και υποστήριξη SFTP στον διακομιστή και την επέκταση PHP mod_ssh2 εγκατεστημένη."
SOLO_SETUP_LBL_FS_DRIVER_SFTP="Λειτουργία SFTP - Ασφαλές πρωτόκολλο μεταφοράς αρχείων (μέσω SSH)"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY="Φάκελος (S)FTP"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY_HELP="Ο φάκελος (S)FTP της εγκατάστασης Akeeba Solo. Στους διακομιστές FTP, αυτός δεν είναι ίδιος με τη διαδρομή του συστήματος αρχείων. Εάν δεν είστε σίγουρος/η, ρωτήστε τον πάροχο φιλοξενίας σας."
SOLO_SETUP_LBL_FS_FTP_HOST="Όνομα κεντρικού υπολογιστή διακομιστή (S)FTP"
SOLO_SETUP_LBL_FS_FTP_HOST_HELP="Το όνομα κεντρικού υπολογιστή ή η διεύθυνση IP του διακομιστή (S)FTP, π.χ. <code>ftp.example.com</code> ή <code>127.0.0.1</code>. ΠΡΕΠΕΙ να το εισαγάγετε <em>χωρίς</em> το πρόθεμα <code>ftp://</code>, <code>sftp://</code> ή <code>ssh://</code>. Εάν δεν είστε σίγουρος/η για αυτό και τις άλλες ρυθμίσεις FTP, ρωτήστε τον πάροχο φιλοξενίας σας."
SOLO_SETUP_LBL_FS_FTP_PASSIVE="Χρήση παθητικής λειτουργίας"
SOLO_SETUP_LBL_FS_FTP_PASSIVE_HELP="Ισχύει μόνο για FTP, αγνοείται για SFTP. Όταν επιλεγεί, το Akeeba Solo θα χρησιμοποιεί την παθητική λειτουργία FTP. Οι περισσότεροι διακομιστές FTP την απαιτούν. Εάν ο πάροχός σας απαιτεί ενεργητική λειτουργία FTP, αποεπιλέξτε αυτό το πλαίσιο. Εάν δεν είστε σίγουρος/η, ρωτήστε τον πάροχο φιλοξενίας σας."
SOLO_SETUP_LBL_FS_FTP_PASSWORD="Κωδικός πρόσβασης (S)FTP"
SOLO_SETUP_LBL_FS_FTP_PASSWORD_HELP="Ο κωδικός πρόσβασης που χρησιμοποιείτε για σύνδεση στον διακομιστή (S)FTP. Εάν δεν είστε σίγουρος/η, ρωτήστε τον πάροχο φιλοξενίας σας."
SOLO_SETUP_LBL_FS_FTP_PORT="Θύρα διακομιστή (S)FTP"
SOLO_SETUP_LBL_FS_FTP_PORT_HELP="Ο αριθμός θύρας στην οποία ακούει ο διακομιστής (S)FTP. Συνήθως είναι 21 για FTP και 22 για SFTP. Εάν δεν είστε σίγουρος/η, ρωτήστε τον πάροχο φιλοξενίας σας."
SOLO_SETUP_LBL_FS_FTP_SSL="Χρήση SSL"
SOLO_SETUP_LBL_FS_FTP_SSL_HELP="Ισχύει μόνο για FTP, αγνοείται για SFTP. Όταν επιλεγεί, το Akeeba Solo θα χρησιμοποιεί FTP μέσω Ρητού SSL (FTP/S). Σημειώστε ότι αυτό δεν πρέπει να συγχέεται με το SFTP, το οποίο είναι εντελώς διαφορετικό πράγμα."
SOLO_SETUP_LBL_FS_FTP_USERNAME="Όνομα χρήστη (S)FTP"
SOLO_SETUP_LBL_FS_FTP_USERNAME_HELP="Το όνομα χρήστη που χρησιμοποιείτε για σύνδεση στον διακομιστή (S)FTP. Εάν δεν είστε σίγουρος/η, ρωτήστε τον πάροχο φιλοξενίας σας."
SOLO_SETUP_LBL_LIVESITE="URL προς το Akeeba Solo"
SOLO_SETUP_LBL_LIVESITE_HELP="Στους περισσότερους διακομιστές μπορείτε να αφήσετε αυτό κενό και θα καθοριστεί αυτόματα. Εάν ο διακομιστής σας ανήκει στη μειοψηφία όπου αυτό δεν λειτουργεί, παρακαλούμε δώστε χειροκίνητα το URL προς το Akeeba Solo."
SOLO_SETUP_LBL_MANUALCONFIGINSTRUCTIONS="Επιλέξτε όλο το κείμενο παρακάτω και αντιγράψτε το σε ένα νέο αρχείο απλού κειμένου. Ονομάστε το αρχείο <code>config.php</code>. Στη συνέχεια, ανεβάστε το στον φάκελο <code>Solo/assets/private</code> μέσα στον φάκελο του Akeeba Solo. Μπορείτε στη συνέχεια να αρχίσετε να χρησιμοποιείτε κανονικά το Akeeba Solo."
SOLO_SETUP_LBL_RECOMMENDED="Αυτές οι ρυθμίσεις συνιστώνται για PHP για να εξασφαλιστεί πλήρης συμβατότητα με το Akeeba Solo. Ωστόσο, το Akeeba Solo θα λειτουργεί ακόμα και αν οι ρυθμίσεις σας δεν ταιριάζουν πλήρως με τη συνιστώμενη διαμόρφωση."
SOLO_SETUP_LBL_RECOMMENDED_VALUE="Συνιστάται"
SOLO_SETUP_LBL_REQUIRED="Εάν κάποιο από αυτά τα στοιχεία δεν υποστηρίζεται (επισημαίνεται ως Όχι), λάβετε μέτρα για τη διόρθωσή τους. Η αποτυχία να το κάνετε ενδέχεται να οδηγήσει σε μη σωστή λειτουργία της εγκατάστασης Akeeba Solo."
SOLO_SETUP_LBL_REQUIREDREDTEXT="Ορισμένες από τις απαιτούμενες ρυθμίσεις του διακομιστή σας φαίνεται να μην είναι συμβατές με το Akeeba Solo. Μπορείτε να τις αγνοήσετε και να προσπαθήσετε να συνεχίσετε, αλλά το Akeeba Solo ενδέχεται να μην λειτουργεί. Εάν δεν είστε σίγουρος/η για το τι σημαίνουν και πώς μπορείτε να τα διορθώσετε, ρωτήστε τον πάροχο φιλοξενίας σας."
SOLO_SETUP_LBL_REQ_CONFIGJSON="Solo/assets/private/config.php Εγγράψιμο"
SOLO_SETUP_LBL_REQ_DATABASE="Υποστήριξη βάσης δεδομένων"
SOLO_SETUP_LBL_REQ_INIPARSER="Υποστήριξη ανάλυσης INI"
SOLO_SETUP_LBL_REQ_JSON="Υποστήριξη JSON"
