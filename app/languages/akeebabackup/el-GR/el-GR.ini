COM_AKEEBA_TRANSFER_LBL_CHUNKSIZE_INFO="Τα αρχεία αντιγράφου ασφαλείας μεταφέρονται σε μικρά τμήματα στον απομακρυσμένο διακομιστή. Αυτό καθορίζει το μέγεθος αυτών των τμημάτων. Πολύ μικρά μεγέθη ενδέχεται να προκαλέσουν αποκλεισμό από τον απομακρυσμένο διακομιστή, εκλαμβάνοντάς σας λανθασμένα ως κακόβουλο χρήστη, προκαλώντας σφάλμα αποστολής. Πολύ μεγάλα μεγέθη ενδέχεται να προκαλέσουν σφάλμα υπέρβασης χρονικού ορίου είτε στον διακομιστή προέλευσης είτε στον απομακρυσμένο διακομιστή, προκαλώντας εμφάνιση σφάλματος AJAX. Συνήθως, τιμές μεταξύ 5M και 20M λειτουργούν καλύτερα."
