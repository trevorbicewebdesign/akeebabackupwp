COM_AKEEBA_SCHEDULE_LBL_ALTCLICRON_INFO="Αυτή η μέθοδος συνιστάται μόνο εάν η κανονική εργασία CRON γραμμής εντολών δεν ολοκληρώνεται. Αυτή η μέθοδος χρησιμοποιεί εσωτερικά τη μέθοδο αντιγράφου ασφαλείας μπροστινού άκρου και είναι ελαφρώς πιο αργή από την εγγενή μέθοδο CLI."
COM_AKEEBA_SCHEDULE_LBL_CHECK_BACKUPS="Έλεγχος κατάστασης αντιγράφων ασφαλείας"
COM_AKEEBA_SCHEDULE_LBL_CHECK_UPLOADS="Έλεγχος κατάστασης αποστολών"
COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECK_HEADERINFO="Αυτή η λειτουργία σάς επιτρέπει να ελέγχετε αν υπάρχουν ολοκληρωμένα αντίγραφα ασφαλείας που απέτυχε να αποσταλούν σε απομακρυσμένη αποθήκευση (π.χ. Amazon S3, Dropbox, κ.λπ.) και να αποστέλλετε ειδοποίηση μέσω email στους διαχειριστές του ιστότοπου."
COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECKUSECLI="Για να ελέγξετε για αποτυχημένες αποστολές σε απομακρυσμένη αποθήκευση χρησιμοποιώντας το εγγενές CLI script, χρησιμοποιήστε την ακόλουθη γραμμή εντολών:"
COM_AKEEBA_SCHEDULE_LBL_CLICRON="Εργασίες CRON γραμμής εντολών (συνιστάται)"
COM_AKEEBA_SCHEDULE_LBL_CLICRON_INFO="Αυτή είναι η συνιστώμενη μέθοδος για όλους τους διακομιστές που υποστηρίζουν εργασίες CRON γραμμής εντολών. Αυτή η μέθοδος παρακάμπτει τη διεπαφή ιστού, επιτυγχάνοντας μέγιστη ταχύτητα δημιουργίας αντιγράφων ασφαλείας."
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICIMPROTANTINFO="Σημαντικό"
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICINFO="Θυμηθείτε να αντικαταστήσετε το <em>%s</em> με την πραγματική διαδρομή προς το εκτελέσιμο αρχείο PHP <strong>CLI (Διεπαφή Γραμμής Εντολών)</strong> του παρόχου φιλοξενίας σας. Λάβετε υπόψη ότι πρέπει να χρησιμοποιείτε το εκτελέσιμο αρχείο PHP CLI· παρόλο που το εκτελέσιμο αρχείο PHP CGI (Common Gateway Interface) ενδέχεται να λειτουργεί με τα scripts CRON μας, είναι επιρρεπές σε σφάλματα υπέρβασης χρονικού ορίου και αποτυχίες αντιγράφων ασφαλείας. Εάν δεν είστε σίγουροι για το τι σημαίνει αυτό, παρακαλώ επικοινωνήστε με τον πάροχο φιλοξενίας σας. Μόνο αυτοί μπορούν να σας παρέχουν τη διαδρομή προς το εκτελέσιμο αρχείο PHP CLI."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP="Λειτουργία αντιγράφου ασφαλείας μπροστινού άκρου"
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_INFO="Αυτή η μέθοδος χρησιμοποιεί μια δημόσια URL και ένα μυστικό κλειδί για την ενεργοποίηση αντιγράφου ασφαλείας του ιστότοπού σας. Η δημιουργία αντιγράφου ασφαλείας προχωρά μέσω ανακατευθύνσεων HTTP. Παρακαλώ σημειώστε ότι οι περισσότερες υπηρεσίες CRON βάσει URL των παρόχων φιλοξενίας, καθώς και οι περισσότερες υπηρεσίες CRON τρίτων βάσει URL, δεν υποστηρίζουν ανακατευθύνσεις HTTP. Εάν τα παραδείγματα με wget και curl παρακάτω δεν λειτουργούν για εσάς, παρακαλώ χρησιμοποιήστε την URL αντιγράφου ασφαλείας μπροστινού άκρου με την οικονομική υπηρεσία τρίτου μέρους webcron.org."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_MANYMETHODS="Η λειτουργία αντιγράφου ασφαλείας μπροστινού άκρου μπορεί να χρησιμοποιηθεί με μεγάλη ποικιλία μεθόδων. Κάντε κλικ στις καρτέλες παρακάτω για να δείτε την περιγραφή κάθε μεθόδου. Θυμηθείτε ότι όλες εξηγούνται λεπτομερώς στην τεκμηρίωσή μας."
