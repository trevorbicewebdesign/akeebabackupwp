COM_AKEEBA_CONFIG_SWIFT_DOMAIN_DESCRIPTION="Χρησιμοποιείται μόνο με έλεγχο ταυτότητας Keystone v3. Αυτός είναι ο τομέας ελέγχου ταυτότητας για την υπηρεσία Keystone v3, <strong>ΟΧΙ</strong> το όνομα κεντρικού υπολογιστή του διακομιστή ελέγχου ταυτότητας Keystone. Στις περισσότερες περιπτώσεις είναι <code>default</code> ή <code>Default</code>. Εάν δεν είστε σίγουροι, ρωτήστε τον πάροχο αποθήκευσής σας."
COM_AKEEBA_CONFIG_SWIFT_DOMAIN_TITLE="Τομέας ελέγχου ταυτότητας Keystone v3"
COM_AKEEBA_CONFIG_SWIFT_KEYSTONE_VERSION_DESCRIPTION="Επιλέξτε ποια έκδοση της υπηρεσίας ελέγχου ταυτότητας OpenStack Keystone χρησιμοποιεί ο πάροχος αποθήκευσής σας. Εάν δεν είστε σίγουροι, ρωτήστε τον πάροχο αποθήκευσής σας."
