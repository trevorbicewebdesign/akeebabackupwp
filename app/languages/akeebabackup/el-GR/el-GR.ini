SOLO_SETUP_LBL_CLICK_TO_SHOW_HIDE="Κάντε κλικ για εμφάνιση/απόκρυψη"
SOLO_SETUP_LBL_CURRENT_SETTING="Τρέχουσα"
SOLO_SETUP_LBL_DATABASE_DBENCRYPTION="Σύνδεση με πιστοποιητικό SSL"
SOLO_SETUP_LBL_DATABASE_DBENCRYPTION_HELP="Θα πρέπει να συνδεόμαστε στη βάση δεδομένων χρησιμοποιώντας πιστοποιητικό SSL; Αυτό μπορεί να χρησιμοποιηθεί αντί για έλεγχο ταυτότητας με όνομα χρήστη και κωδικό πρόσβασης (κρυπτογραφημένη σύνδεση με έλεγχο ταυτότητας πιστοποιητικού) ή <em>επιπλέον</em> του ελέγχου ταυτότητας με όνομα χρήστη και κωδικό πρόσβασης (κρυπτογραφημένη σύνδεση με έλεγχο ταυτότητας κωδικού). Εάν δεν γνωρίζετε τι σημαίνει αυτό, ορίστε αυτή την επιλογή σε Όχι και αγνοήστε τις επόμενες λίγες επιλογές επίσης."
SOLO_SETUP_LBL_DATABASE_DBSSLCA="Αρχείο Αρχής Πιστοποίησης (CA)"
SOLO_SETUP_LBL_DATABASE_DBSSLCA_HELP="Απόλυτη διαδρομή αρχείου προς το αρχείο PEM πιστοποιητικού Αρχής Πιστοποίησης (CA) του διακομιστή βάσης δεδομένων σας, π.χ. <code>/home/myuser/ca.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT="Αρχείο Δημόσιου Κλειδιού (Πιστοποιητικό) χρήστη βάσης δεδομένων"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT_HELP="Απόλυτη διαδρομή αρχείου προς το αρχείο PEM δημόσιου κλειδιού (πιστοποιητικού) του χρήστη βάσης δεδομένων σας, π.χ. <code>/home/myuser/myuser.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER="Μέθοδοι Κρυπτογράφησης SSL/TLS"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER_HELP="Εισαγάγετε μια λίστα μεθόδων κρυπτογράφησης για σύνδεση με πιστοποιητικά SSL, διαχωρισμένες με άνω και κάτω τελεία. Εάν αφεθεί κενό, θα χρησιμοποιηθεί η προεπιλεγμένη λίστα (<code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>) (συνιστάται)."
SOLO_SETUP_LBL_DATABASE_DBSSLKEY="Αρχείο Ιδιωτικού Κλειδιού χρήστη βάσης δεδομένων"
SOLO_SETUP_LBL_DATABASE_DBSSLKEY_HELP="Απόλυτη διαδρομή αρχείου προς το αρχείο PEM ιδιωτικού κλειδιού του χρήστη βάσης δεδομένων σας, π.χ. <code>/home/myuser/myuser-key.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT="Επαλήθευση πιστοποιητικού διακομιστή"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT_HELP="Ορίστε σε Ναι για να επαληθεύσετε το πιστοποιητικό που στέλνει ο διακομιστής. Η επαλήθευση γίνεται με βάση το αρχείο Αρχής Πιστοποίησης (CA) που έχετε ορίσει. Εάν λαμβάνετε σφάλματα σύνδεσης, ορίστε σε Όχι· ορισμένες ρυθμίσεις (ειδικά αυτές που δημιουργούνται από το <code>mysql_ssl_rsa_setup</code>) ενδέχεται να απαγορεύουν τη σύνδεση εάν η επαλήθευση πιστοποιητικού είναι ενεργοποιημένη. Εάν ενεργοποιήσετε την επαλήθευση και το πεδίο αρχείου CA είναι κενό, το πιστοποιητικό του διακομιστή θα ελεγχθεί έναντι των αρχείων Αρχής Πιστοποίησης που γνωρίζει ο διακομιστής σας, βλέπε τις επιλογές PHP <code>openssl.cafile</code> και <code>openssl.capath</code>."
SOLO_SETUP_LBL_DATABASE_DRIVER="Τύπος βάσης δεδομένων"
SOLO_SETUP_LBL_DATABASE_DRIVER_HELP="Συνήθως είναι MySQLi (<em>με</em> το τελικό \"i\")"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQL="MySQL (παρωχημένο πρόγραμμα οδήγησης για MySQL - αποφύγετε τη χρήση)"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQLI="MySQLi (προτεινόμενο πρόγραμμα οδήγησης για MySQL)"
