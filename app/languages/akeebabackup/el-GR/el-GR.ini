SOLO_SETUP_LBL_WELCOME="Πριν μπορέσετε να χρησιμοποιήσετε το Akeeba Solo θα χρειαστεί να το ρυθμίσετε. Αυτός ο διαδικτυακός οδηγός εγκατάστασης θα σας καθοδηγήσει σε όλα τα απαραίτητα βήματα. Σε αυτή την πρώτη σελίδα ελέγχουμε ότι η διαμόρφωση του διακομιστή σας πληροί τις ελάχιστες απαιτήσεις για το Akeeba Solo. Κάντε κλικ στο κουμπί <strong>Επόμενο</strong> παραπάνω για να προχωρήσετε στην επόμενη σελίδα του οδηγού εγκατάστασης."
SOLO_SETUP_LBL_WELCOME_HEAD="Καλώς ήλθατε στο Akeeba Solo"
