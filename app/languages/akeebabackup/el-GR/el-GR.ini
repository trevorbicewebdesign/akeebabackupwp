COM_AKEEBA_CONFIG_SWIFT_DIRECTORY_DESCRIPTION="Ο φάκελος εντός του κοντέινερ αποθήκευσης αντικειμένων OpenStack Swift όπου θα αποθηκεύονται τα αρχεία αντιγράφων ασφαλείας. Για να αποθηκεύετε τα πάντα στον κορυφαίο φάκελο του κοντέινερ, αφήστε το πεδίο κενό."
