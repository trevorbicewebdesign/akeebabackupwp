COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_HEAD="Η προεπιλεγμένη διαμόρφωση του συστήματος CRON του WordPress ενδέχεται να προκαλέσει προβλήματα με προγραμματισμένα αντίγραφα ασφαλείας"
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P1="Σύμφωνα με την <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">τεκμηρίωση του WordPress</a>, κρίσιμες εργασίες —όπως τα αντίγραφα ασφαλείας— που έχουν προγραμματιστεί με WP-CRON στην προεπιλεγμένη διαμόρφωση του WordPress (αξιολόγηση εκτέλεσης προγραμματισμένης εργασίας μόνο κατά την επίσκεψη στον ιστότοπο) ενδέχεται να μην εκτελεστούν στη σωστή ώρα ή καθόλου. Ως αποτέλεσμα αυτού του εγγενούς σχεδιαστικού ζητήματος που το WordPress αναγνωρίζει ανοιχτά, τα αντίγραφα ασφαλείας που έχουν προγραμματιστεί με WP-CRON σε αυτή τη διαμόρφωση ενδέχεται να μην ξεκινήσουν στη σωστή ώρα (ή καθόλου), να χρειαστούν πολύ περισσότερο χρόνο για εκτέλεση, να γίνουν ασυνεπή ή κατεστραμμένα, να επικαλύπτονται μεταξύ τους, ή να ξεκινήσουν αλλά να μην ολοκληρωθούν. Ανατρέξτε στην τεκμηρίωσή μας για λεπτομερείς πληροφορίες."
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P2="<strong>Συνιστούμε ανεπιφύλακτα</strong> να ακολουθήσετε τη σύσταση της <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">επίσημης τεκμηρίωσης του WordPress</a> για απενεργοποίηση της προεπιλεγμένης εκτέλεσης εργασιών βάσει δραστηριότητας ιστότοπου, χρησιμοποιώντας τον Windows Task Scheduler ή τον δαίμονα CRON του macOS/Linux για προγραμματισμό εκτέλεσης του βοηθητικού CRON του WordPress (<code>wp-cron.php</code>) κάθε λεπτό. Αυτή η διαμόρφωση υπερνικά το εγγενές σχεδιαστικό ζήτημα της προεπιλεγμένης διαμόρφωσης WP-CRON του WordPress και καθιστά τα προγραμματισμένα αντίγραφα ασφαλείας εξίσου αξιόπιστα με τα χειροκίνητα αντίγραφα ασφαλείας από το πίσω άκρο, ή αντίγραφα ασφαλείας που προγραμματίζονται με τις μεθόδους αντιγράφου ασφαλείας μπροστινού άκρου ή JSON API."
