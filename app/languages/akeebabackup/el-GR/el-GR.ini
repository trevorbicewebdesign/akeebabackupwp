SOLO_SETUP_LBL_USER_PASSWORD_HELP="Ο κωδικός πρόσβασης που θα χρησιμοποιείτε για σύνδεση στο Akeeba Solo. Ο κωδικός πρόσβασης κάνει διάκριση πεζών-κεφαλαίων, που σημαίνει ότι τα abc, Abc και ABC είναι τρεις <em>διαφορετικοί</em> κωδικοί πρόσβασης."
