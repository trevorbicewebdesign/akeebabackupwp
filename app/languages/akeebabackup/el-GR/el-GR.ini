COM_AKEEBA_CPANEL_ERR_FESECRETWORD_HEADER="Οι λειτουργίες αντιγράφου ασφαλείας μπροστινού άκρου και απομακρυσμένου αντιγράφου είναι απενεργοποιημένες"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_INTRO="Το <em>μυστικό κλειδί</em> σας δεν είναι ασφαλές και μπορεί να μαντευτεί εύκολα. Για την προστασία του ιστότοπού σας, το Akeeba Backup έχει απενεργοποιήσει την πρόσβαση στο αντίγραφο ασφαλείας μπροστινού άκρου και απομακρυσμένου αντιγράφου μέχρι να εισάγετε ένα ασφαλές μυστικό κλειδί. Το εντοπισμένο πρόβλημα είναι:"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_RESET="Δεν ήταν δυνατή η αλλαγή του μυστικού κλειδιού"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_TOOSHORT="Το μυστικό κλειδί είναι πολύ σύντομο. Χρησιμοποιήστε μυστικό κλειδί τουλάχιστον 8 χαρακτήρων."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_TOOSIMPLE="Το μυστικό κλειδί είναι πολύ απλό. Δοκιμάστε να χρησιμοποιήσετε πεζά και κεφαλαία γράμματα, αριθμούς και σημεία στίξης."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="Εναλλακτικά, κάντε κλικ στο παρακάτω κουμπί για επαναφορά του μυστικού κλειδιού στην προτεινόμενη τιμή <code>%s</code>. Σε κάθε περίπτωση θα πρέπει να ενημερώσετε τις απομακρυσμένες υπηρεσίες αντιγράφου ασφαλείας ή/και τις εργασίες CRON με το νέο μυστικό κλειδί."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_JOOMLA="Κάντε κλικ στις Επιλογές, Μπροστινό άκρο και εισάγετε ένα πιο σύνθετο μυστικό κλειδί."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_SOLO="Κάντε κλικ στη Διαμόρφωση συστήματος, Δημόσιο API και εισάγετε ένα πιο σύνθετο μυστικό κλειδί."
COM_AKEEBA_CPANEL_ERR_INVALIDDOWNLOADID="Μη έγκυρη μορφή αναγνωριστικού λήψης. Ακολουθήστε τις οδηγίες μας για να αποκτήσετε το αναγνωριστικό λήψης σας. Μην εισάγετε το όνομα χρήστη, τη διεύθυνση email ή τον κωδικό πρόσβασής σας σε αυτό το πεδίο."
COM_AKEEBA_CPANEL_ERR_MBSTRING_SOLO="<strong>Η έκδοση PHP δεν έχει εγκατεστημένη ή ενεργοποιημένη την επέκταση mbstring</strong>. Η ενεργοποίησή της αποτελεί απαίτηση του Akeeba Solo. Το Akeeba Solo ενδέχεται να μην λειτουργεί σωστά. Επικοινωνήστε με τον πάροχο φιλοξενίας σας για να ενεργοποιήσει την επέκταση mbstring στην PHP %s που εκτελείται στον διακομιστή σας."
COM_AKEEBA_CPANEL_ERR_MBSTRING_WORDPRESS="<strong>Η έκδοση PHP δεν έχει εγκατεστημένη ή ενεργοποιημένη την επέκταση mbstring</strong>. Η ενεργοποίησή της αποτελεί απαίτηση του WordPress. Το WordPress και το Akeeba Backup ενδέχεται να μην λειτουργούν σωστά. Επικοινωνήστε με τον πάροχο φιλοξενίας σας για να ενεργοποιήσει την επέκταση mbstring στην PHP %s που εκτελείται στον διακομιστή σας."
COM_AKEEBA_CPANEL_ERR_UPDATE_STUCK="Εντοπίστηκε ότι ένας ή περισσότεροι πίνακες με πρόθεμα <strong>%sak_</strong> είναι κατεστραμμένοι. Το Akeeba Backup δεν θα λειτουργεί σωστά. Επικοινωνήστε με τον πάροχο φιλοξενίας σας για να επιδιορθώσει αυτούς τους πίνακες και στη συνέχεια <a href='%s'>κάντε κλικ εδώ</a> για να επιτρέψετε στο Akeeba Backup να ενημερώσει τους πίνακες της βάσης δεδομένων του."
