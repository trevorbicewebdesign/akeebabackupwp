SOLO_MAIN_LBL_WHYSUBSCRIBE="Το Akeeba Solo Professional διαθέτει πολλές επιπλέον, χρήσιμες λειτουργίες όπως <b>ενσωματωμένη επαναφορά αντιγράφων ασφαλείας</b>, εισαγωγή αρχείων αντιγράφων από Amazon S3 ή τον διακομιστή σας, <b>αυτόματη μεταφορά αντιγράφων ασφαλείας σε αποθήκευση cloud (Amazon S3, Dropbox, Box.com και 40+ άλλες υπηρεσίες)</b>, προηγμένα φίλτρα συμπερίληψης / εξαίρεσης και πολλά ακόμα! Οι συνδρομητές στην επαγγελματική έκδοση λαμβάνουν επίσης υποστήριξη προτεραιότητας από τους προγραμματιστές του λογισμικού στον ιστότοπό μας."
