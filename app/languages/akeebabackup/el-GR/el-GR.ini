COM_AKEEBA_SCHEDULE_LBL_HEADERINFO="Το Akeeba Backup προσφέρει αρκετές μεθόδους χρονοπρογραμματισμού. Θα βρείτε περισσότερες πληροφορίες για κάθε μέθοδο χρονοπρογραμματισμού παρακάτω. Παρακαλώ διαβάστε την τεκμηρίωση κάθε μεθόδου χρονοπρογραμματισμού. Θα απαντήσει σε πολλές από τις ερωτήσεις σας και θα σας βοηθήσει να προγραμματίσετε τα αντίγραφα ασφαλείας σας πιο εύκολα."
COM_AKEEBA_SCHEDULE_LBL_JSONAPIBACKUP="Λειτουργία απομακρυσμένου αντιγράφου ασφαλείας (JSON API)"
