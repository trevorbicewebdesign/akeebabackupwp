COM_AKEEBA_CONFWIZ_UI_CANTSAVEMINEXEC="Δεν ήταν δυνατή η αποθήκευση της προτίμησης ελάχιστου χρόνου εκτέλεσης. Θα πρέπει να διαμορφώσετε το Akeeba Backup χειροκίνητα."
