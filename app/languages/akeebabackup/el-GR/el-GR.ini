SOLO_UPDATE_STUCK_INFO="Η ενημέρωση διαπίστωσε ότι κατέρρευσε την τελευταία φορά που προσπάθησε να επικοινωνήσει με τον διακομιστή ενημερώσεων. Αυτό συνήθως υποδεικνύει έναν πάροχο που αποκλείει ενεργά τις επικοινωνίες με εξωτερικούς ιστότοπους. Αν θέλετε να επαναλάβετε τη λήψη των πληροφοριών ενημέρωσης, κάντε κλικ στο κουμπί «Ανανέωση πληροφοριών ενημέρωσης» παρακάτω. Αν αυτό έχει ως αποτέλεσμα μια κενή σελίδα, επικοινωνήστε με τον πάροχο φιλοξενίας σας και αναφέρετε αυτό το ζήτημα."
