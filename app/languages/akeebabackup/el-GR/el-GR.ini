COM_AKEEBA_ALICE_ERR_NOLOGS="Δεν βρέθηκαν αρχεία καταγραφής για <strong>αποτυχημένα</strong> αντίγραφα ασφαλείας."
COM_AKEEBA_ALICE_HEAD_ONLYFAILED="Το ALICE λειτουργεί μόνο σε <em>αποτυχημένα</em> αντίγραφα ασφαλείας"
COM_AKEEBA_ALICE_LBL_ONLYFAILED_IFNOFAILED="Εάν το αντίγραφο ασφαλείας σας απέτυχε αλλά δεν το βλέπετε σε αυτή τη σελίδα, παρακαλώ αναμείνετε <em>τρία (3) λεπτά</em>, επιστρέψτε στη σελίδα του Πίνακα ελέγχου του Akeeba Backup και στη συνέχεια επιστρέψτε εδώ. Υπάρχει λόγος γι' αυτό. Σε ορισμένες περιπτώσεις η αποτυχία αντιγράφου ασφαλείας προκαλείται από σφάλμα διακομιστή. Σε αυτές τις περιπτώσεις το αντίγραφο ασφαλείας επισημαίνεται ως σε εξέλιξη αντί για αποτυχημένο, καθώς η PHP σταματά να εκτελείται και ο κώδικας PHP που θα επισήμαινε το αντίγραφο ασφαλείας ως αποτυχημένο δεν έχει την ευκαιρία να εκτελεστεί. Όταν επισκεφθείτε τη σελίδα του Πίνακα ελέγχου, κάθε αντίγραφο ασφαλείας που επισημαίνεται ως σε εξέλιξη για περισσότερο από 3 λεπτά θα επισημανθεί ως αποτυχημένο. Εξ ου και η ανάγκη να αναμείνετε και <em>στη συνέχεια</em> να επιστρέψετε στη σελίδα του Πίνακα ελέγχου."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_SHOWINGLOGS="Το ALICE είναι ένα εργαλείο για την ανάλυση αρχείων καταγραφής <em>αποτυχημένων</em> αντιγράφων ασφαλείας και — στις περισσότερες περιπτώσεις — για την παροχή της πιο πιθανής αιτίας αποτυχίας του αντιγράφου ασφαλείας. Δεν προορίζεται για την ανάλυση αρχείων καταγραφής επιτυχημένων αντιγράφων ασφαλείας. Κάτι τέτοιο θα απέδιδε ανοήτα, παραπλανητικά ή εντελώς λανθασμένα αποτελέσματα. Για τον λόγο αυτό θα εμφανίζουμε μόνο τα αρχεία καταγραφής <em>αποτυχημένων</em> αντιγράφων ασφαλείας."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_WHATISFAILED="Παρακαλώ να θυμάστε ότι τα αντίγραφα ασφαλείας που δεν ολοκλήρωσαν τη μεταφόρτωση του αρχείου αντιγράφου ασφαλείας σε απομακρυσμένη αποθήκη δεν θεωρούνται αποτυχημένα. Η βαθύτερη αιτία αυτών των προβλημάτων δεν μπορεί να εντοπιστεί από το ALICE. Εάν αντιμετωπίζετε αυτό το είδος προβλήματος, χρειάζεται να υποβάλετε αίτημα υποστήριξης στην ενότητα Υποστήριξης του ιστότοπού μας. Εάν κάποιος άλλος εγκατέστησε το Akeeba Backup Professional για λογαριασμό σας στον ιστότοπό σας, παρακαλώ επικοινωνήστε με εκείνο το άτομο· σε αυτή την περίπτωση δεν θα μπορείτε να υποβάλετε αίτημα υποστήριξης στον ιστότοπό μας."
COM_AKEEBA_BACKUP="Δημιουργία αντιγράφου ασφαλείας τώρα"
COM_AKEEBA_BACKUP_ANALYSELOG="Ανάλυση αρχείου καταγραφής (ALICE)"
COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_1="Η δέσμη ενεργειών επαναφοράς (ANGIE) θα είναι προσβάσιμη μόνο εάν παράσχετε τον κωδικό πρόσβασης που ορίσατε στην προηγούμενη σελίδα, πριν κάνετε κλικ στο κουμπί Δημιουργία αντιγράφου ασφαλείας τώρα. Εάν δεν θυμάστε να έχετε ορίσει κωδικό πρόσβασης, το πρόγραμμα περιήγησής σας έχει συμπληρώσει αυτόματα τον κωδικό πρόσβασης στη σελίδα Διαμόρφωσης <strong>χωρίς να σας ρωτήσει</strong>. Αυτό γίνεται από πολλούς διαχειριστές κωδικών πρόσβασης και προγράμματα περιήγησης."
COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_2="Τα σύγχρονα προγράμματα περιήγησης και οι διαχειριστές κωδικών πρόσβασης δεν μας επιτρέπουν να παρακάμπτουμε αυτή τη συμπεριφορά. Έχουμε τοποθετήσει μια άμυνα JavaScript κατά αυτού του είδους της αυτόματης συμπλήρωσης του πεδίου κωδικού πρόσβασης στη σελίδα Διαμόρφωσης. Ωστόσο, εάν αποθηκεύσετε τη σελίδα Διαμόρφωσης εντός περίπου μισού δευτερολέπτου από τη φόρτωσή της, αυτή η άμυνα δεν θα έχει την ευκαιρία να εκτελεστεί."
