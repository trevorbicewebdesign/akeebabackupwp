COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_TIMEOUT_INFO="180 δευτερόλεπτα· εάν το αντίγραφο ασφαλείας δεν ολοκληρώνεται, αυξήστε την τιμή. Οι περισσότεροι ιστότοποι λειτουργούν με ρύθμιση 180 ή 600. Εάν έχετε έναν πολύ μεγάλο ιστότοπο που χρειάζεται περισσότερα από 5 λεπτά για τη δημιουργία αντιγράφου ασφαλείας, ενδέχεται να εξετάσετε τη χρήση του Akeeba Backup Professional και της εγγενούς εργασίας CRON CLI, καθώς είναι πολύ πιο αποδοτική."
