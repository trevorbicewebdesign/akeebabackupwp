COM_AKEEBA_CONFWIZ_CONGRATS="Συγχαρητήρια! Ολοκληρώσατε τον αυτόματο οδηγό διαμόρφωσης. Τώρα μπορείτε να δοκιμάσετε τη νέα σας διαμόρφωση εκτελώντας ένα αντίγραφο ασφαλείας ή να τη βελτιοποιήσετε στη σελίδα Διαμόρφωσης."
