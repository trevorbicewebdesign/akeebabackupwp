COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DROPBOX2_TITLE="Αποστολή στο Dropbox (v2 API)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας ως συνημμένο email.<br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 1-2MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου και εξάντλησης μνήμης!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_TITLE="Αποστολή μέσω Email"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας σε απομακρυσμένο διακομιστή FTP ή FTPS (FTP over Implicit SSL).<br/>Αυτή η μηχανή μετά-επεξεργασίας χρησιμοποιεί τη βιβλιοθήκη cURL που παρέχει καλύτερη συμβατότητα με ευρύ φάσμα διακομιστών FTP.<br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 2-30MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong>"
