COM_AKEEBA_COMMON_EMAIL_BODY_OK="Το Akeeba Backup ολοκλήρωσε τη δημιουργία αντιγράφου ασφαλείας του ιστότοπού σας χρησιμοποιώντας τη λειτουργία αντιγράφου ασφαλείας μπροστινού άκρου. Μπορείτε να επισκεφθείτε την ενότητα διαχειριστή του ιστότοπου για να κατεβάσετε το αντίγραφο ασφαλείας."
