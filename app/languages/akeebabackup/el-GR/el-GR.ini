COM_AKEEBA_COMMON_EMAIL_SUBJECT_OK="Το Akeeba Backup δημιούργησε ένα νέο αντίγραφο ασφαλείας"
COM_AKEEBA_CONFIG="Διαμόρφωση"
COM_AKEEBA_CONFIG_ADVANCED="Προηγμένη διαμόρφωση"
COM_AKEEBA_CONFIG_ADVANCED_SBALF_DESC="Το Akeeba Backup θα διακόπτει το βήμα επεξεργασίας μετά την αρχειοθέτηση ενός μεγάλου αρχείου. Όταν ενεργοποιείτε αυτή την επιλογή, το Akeeba Backup θα λειτουργεί ταχύτερα. Ωστόσο, αυτό ενδέχεται να προκαλέσει σφάλματα υπέρβασης χρονικού ορίου ή Εσωτερικού Σφάλματος Διακομιστή."
COM_AKEEBA_CONFIG_ADVANCED_SBALF_LABEL="Απενεργοποίηση διακοπής βήματος μετά από μεγάλα αρχεία"
COM_AKEEBA_CONFIG_ADVANCED_SBBD_LABEL="Απενεργοποίηση διακοπής βήματος μεταξύ τομέων"
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_DESC="Το Akeeba Backup θα διακόπτει το βήμα επεξεργασίας πριν την αρχειοθέτηση ενός μεγάλου αρχείου. Όταν ενεργοποιείτε αυτή την επιλογή, το Akeeba Backup θα λειτουργεί ταχύτερα. Ωστόσο, αυτό ενδέχεται να προκαλέσει σφάλματα υπέρβασης χρονικού ορίου ή Εσωτερικού Σφάλματος Διακομιστή."
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_LABEL="Απενεργοποίηση διακοπής βήματος πριν από μεγάλα αρχεία"
COM_AKEEBA_CONFIG_ADVANCED_SBPA_DESC="Το Akeeba Backup θα διακόπτει το βήμα επεξεργασίας εάν εκτιμά ότι θα εξαντληθεί ο χρόνος πριν αρχειοθετήσει ένα αρχείο. Αυτός ο υπολογισμός δεν είναι απολύτως ακριβής και ενδέχεται να οδηγήσει σε πιο αργά αντίγραφα ασφαλείας. Όταν ενεργοποιείτε αυτή την επιλογή, το Akeeba Backup θα λειτουργεί ταχύτερα. Ωστόσο, αυτό ενδέχεται να προκαλέσει σφάλματα υπέρβασης χρονικού ορίου ή Εσωτερικού Σφάλματος Διακομιστή."
COM_AKEEBA_CONFIG_ADVANCED_SBPA_LABEL="Απενεργοποίηση προληπτικής διακοπής βήματος"
COM_AKEEBA_CONFIG_ADVANCED_SBPP_DESC="Το Akeeba Backup θα διακόπτει το βήμα επεξεργασίας μεταξύ υποβημάτων της οριστικοποίησης αντιγράφου ασφαλείας και μετά-επεξεργασίας. Αυτό μπορεί να προσθέσει περίπου 10 δευτερόλεπτα στο συνολικό χρόνο δημιουργίας αντιγράφου ασφαλείας. Όταν ενεργοποιείτε αυτή την επιλογή, το Akeeba Backup θα λειτουργεί ταχύτερα. Ωστόσο, αυτό ενδέχεται να προκαλέσει σφάλματα υπέρβασης χρονικού ορίου ή Εσωτερικού Σφάλματος Διακομιστή."
COM_AKEEBA_CONFIG_ADVANCED_SBPP_LABEL="Απενεργοποίηση διακοπής βήματος κατά την οριστικοποίηση"
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_DESC="Ενημερώνει το Akeeba Backup να προσπαθεί να αυξήσει το όριο μνήμης της PHP σε υπερβολικά υψηλή τιμή (16 GB). Αυτό σας επιτρέπει να συμπιέζετε μεγαλύτερα αρχεία και να ανεβάζετε μεγαλύτερα αρχεία αντιγράφων ασφαλείας χρησιμοποιώντας επιλογές απομακρυσμένης αποθήκευσης υψηλής κατανάλωσης μνήμης όπως το WebDAV. Σημείωση: αυτό ορίζει μόνο το ανώτατο όριο κατανάλωσης μνήμης. Στις περισσότερες περιπτώσεις, η μηχανή αντιγράφων ασφαλείας του Akeeba Backup καταναλώνει <em>πολύ λιγότερη</em> μνήμη από αυτό, συνήθως στα χαμηλά 20 MB. Η συμπίεση και η αποστολή μεγαλύτερων αρχείων απαιτεί επίσης αλλαγή άλλων επιλογών στη σελίδα Διαμόρφωσης του προφίλ αντιγράφου ασφαλείας."
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_LABEL="Ορισμός μεγάλου ορίου μνήμης"
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_DESC="Εάν ο διακομιστής σας δεν εκτελεί PHP σε Safe Mode και υποστηρίζει set_time_limit(), το Akeeba Backup θα προσπαθήσει να ορίσει απεριόριστο μέγιστο χρόνο εκτέλεσης PHP για να παρακάμψει πιθανά προβλήματα υπέρβασης χρονικού ορίου"
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_LABEL="Ορισμός απεριόριστου χρονικού ορίου PHP"
COM_AKEEBA_CONFIG_ANGIE_KEY_DESCRIPTION="Εάν χρησιμοποιείτε το ενσωματωμένο πρόγραμμα εγκατάστασης ANGIE, μπορείτε προαιρετικά να το προστατεύσετε με κωδικό πρόσβασης, αποτρέποντας τη μη εξουσιοδοτημένη πρόσβαση στο πρόγραμμα εγκατάστασης. Κατά την εκτέλεση του προγράμματος εγκατάστασης θα σας ζητηθεί να εισαγάγετε αυτόν τον κωδικό πρόσβασης. Σημειώστε ότι ο κωδικός πρόσβασης κάνει διάκριση πεζών-κεφαλαίων, δηλαδή τα ABC, abc και Abc είναι τρεις διαφορετικοί κωδικοί πρόσβασης."
COM_AKEEBA_CONFIG_ANGIE_KEY_TITLE="Κωδικός πρόσβασης ANGIE"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_DESC="Αποστολή μηνύματος ηλεκτρονικού ταχυδρομείου σε αυτή τη διεύθυνση (αφήνοντάς την κενή απενεργοποιείται αυτή η λειτουργία)"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_LABEL="Διεύθυνση ηλεκτρονικού ταχυδρομείου"
COM_AKEEBA_CONFIG_ARCHIVENAME_DESCRIPTION="Πρότυπο ονοματοδοσίας για το αρχείο αντιγράφου ασφαλείας, όπου ισχύει. Μπορείτε να χρησιμοποιήσετε τις ακόλουθες μακροεντολές:<ul><li><b>[HOST]</b> Το όνομα κεντρικού υπολογιστή. ΠΡΟΕΙΔΟΠΟΙΗΣΗ! Αυτή η ετικέτα δεν λειτουργεί σε λειτουργία CRON.</li><li><b>[DATE]</b> Τρέχουσα ημερομηνία</li><li><b>[TIME_TZ]</b> Τρέχουσα ώρα και ζώνη ώρας</li></ul>Υπάρχουν περισσότερες· συμβουλευθείτε την τεκμηρίωση."
COM_AKEEBA_CONFIG_ARCHIVENAME_TITLE="Ονομασία αρχείου αντιγράφου ασφαλείας"
COM_AKEEBA_CONFIG_ARCHIVERENGINE_DESCRIPTION="Ορίζει τη μορφή αρχείου αντιγράφου ασφαλείας του Akeeba Backup. Ορισμένες μηχανές, όπως το DirectFTP, δεν δημιουργούν στην πραγματικότητα αρχεία, αλλά αναλαμβάνουν τη μεταφορά των αρχείων σας σε άλλους διακομιστές."
COM_AKEEBA_CONFIG_ARCHIVERENGINE_TITLE="Μηχανή αρχειοθέτησης"
COM_AKEEBA_CONFIG_AUTORESUME_DESCRIPTION="Όταν αυτή η επιλογή είναι απενεργοποιημένη, το Akeeba Backup θα διακόπτει το αντίγραφο ασφαλείας όταν ο διακομιστής αποκρίνεται με σφάλμα. Όταν αυτή η επιλογή είναι ενεργοποιημένη, το Akeeba Backup θα προσπαθεί να συνεχίσει το αντίγραφο ασφαλείας επαναλαμβάνοντας το τελευταίο βήμα. Αυτό ισχύει μόνο για αντίγραφα ασφαλείας πίσω άκρου. Επίσης δεν θα σας επιτρέψει να συνεχίσετε επιτυχώς όλα τα αντίγραφα ασφαλείας που οδηγούν σε σφάλμα: μόνο οι απόπειρες αντιγράφου ασφαλείας που αποκλείονται προσωρινά από περιορισμούς χρήσης CPU του διακομιστή ή ζητήματα διακοπής δικτύου μπορούν να συνεχιστούν."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_DESCRIPTION="Πόσες φορές θα πρέπει το Akeeba Backup να επαναλαμβάνει τη συνέχιση του αντιγράφου ασφαλείας πριν τελικά εγκαταλείψει. Οι 3 έως 5 επαναλήψεις λειτουργούν καλύτερα στους περισσότερους διακομιστές."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_TITLE="Μέγιστες επαναλήψεις βήματος αντιγράφου ασφαλείας μετά από σφάλμα AJAX"
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_DESCRIPTION="Πόσα δευτερόλεπτα να αναμένετε πριν συνεχιστεί το αντίγραφο ασφαλείας. Συνιστάται να ορίσετε αυτή την τιμή σε 30 δευτερόλεπτα ή περισσότερο (συνιστώνται 120 δευτερόλεπτα στις περισσότερες περιπτώσεις) για να δώσετε στον διακομιστή σας τον απαραίτητο χρόνο να αποδεσμεύσει τη διαδικασία αντιγράφου ασφαλείας πριν το Akeeba Backup επαναλάβει την ολοκλήρωσή της."
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_TITLE="Περίοδος αναμονής πριν από την επανάληψη του βήματος αντιγράφου ασφαλείας"
COM_AKEEBA_CONFIG_AUTORESUME_TITLE="Συνέχιση αντιγράφου ασφαλείας μετά από σφάλμα AJAX"
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_DESCRIPTION="Το όνομα του λογαριασμού σας. Εάν το endpoint σας είναι foobar.blob.core.windows.net, τότε το όνομα λογαριασμού σας είναι <b>foobar</b> και πρέπει να πληκτρολογήσετε <em>foobar</em> σε αυτό το πεδίο."
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_TITLE="Όνομα λογαριασμού"
COM_AKEEBA_CONFIG_AZURE_CONTAINER_DESCRIPTION="Το κοντέινερ Windows Azure BLOB Storage για την αποθήκευση των αρχείων αντιγράφων ασφαλείας. Το κοντέινερ πρέπει να υπάρχει ήδη."
COM_AKEEBA_CONFIG_AZURE_CONTAINER_TITLE="Κοντέινερ"
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_DESCRIPTION="Ο φάκελος εντός του κοντέινερ Windows Azure BLOB Storage για αποθήκευση των αρχείων αντιγράφων ασφαλείας. Για να αποθηκεύσετε τα πάντα στον ριζικό κατάλογο του κοντέινερ, αφήστε το κενό."
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_TITLE="Φάκελος"
COM_AKEEBA_CONFIG_AZURE_KEY_DESCRIPTION="Μπορείτε να βρείτε το Πρωτεύον Κλειδί Πρόσβασης στη σελίδα λογαριασμού σας στο windows.azure.com. Αντιγράψτε και επικολλήστε το εδώ. Πάντα τελειώνει με δύο σύμβολα ίσον."
COM_AKEEBA_CONFIG_AZURE_KEY_TITLE="Πρωτεύον Κλειδί Πρόσβασης"
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_DESCRIPTION="Εισαγάγετε το αναγνωριστικό κλειδιού εφαρμογής σας για το BackBlaze. Μπορείτε να βρείτε αυτές τις πληροφορίες στη <a href='https://secure.backblaze.com/b2_buckets.htm'>σελίδα λογαριασμού σας στο BackBlaze</a> αφού κάνετε κλικ στο «Show Account ID and Application Key». Εάν χρησιμοποιείτε το κύριο κλειδί, εισαγάγετε αντ' αυτού το Αναγνωριστικό Λογαριασμού σας."
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_TITLE="Αναγνωριστικό κλειδιού εφαρμογής"
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_DESCRIPTION="Εισαγάγετε το κλειδί εφαρμογής σας για το BackBlaze. Μπορείτε να βρείτε αυτές τις πληροφορίες στη <a href='https://secure.backblaze.com/b2_buckets.htm'>σελίδα λογαριασμού σας στο BackBlaze</a> αφού κάνετε κλικ στο «Show Account ID and Application Key». <strong>ΠΡΟΕΙΔΟΠΟΙΗΣΗ</strong>! Αυτό εμφανίζεται σε εσάς ΜΟΝΟ ΜΙΑ ΦΟΡΑ από το BackBlaze. Για να το εμφανίσετε ξανά θα πρέπει να αναδημιουργήσετε το Κλειδί Εφαρμογής, προκαλώντας την αποσύνδεση ΟΛΩΝ των προηγουμένως συνδεδεμένων περιπτώσεων του Akeeba Backup μέχρι να εισαγάγετε εκεί το <em>νέο</em> Κλειδί Εφαρμογής."
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_TITLE="Κλειδί εφαρμογής"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_DESCRIPTION="Το όνομα του κάδου Backblaze"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_TITLE="Κάδος"
COM_AKEEBA_CONFIG_BACKBLAZE_DIRECTORY_DESCRIPTION="Ο φάκελος εντός του κάδου σας όπου θα αποθηκεύονται τα αρχεία αντιγράφων ασφαλείας. Αφήστε κενό για αποθήκευση αρχείων στον ριζικό φάκελο του κάδου."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_DESCRIPTION="Όταν ενεργοποιείτε αυτήν την επιλογή, το Akeeba Backup θα εκτελεί αποστολές σε ένα μόνο μέρος στο Backblaze B2. Θα χρειαστεί να χρησιμοποιήσετε μικρότερη τιμή στη ρύθμιση Μέγεθος τμήματος για τμηματικά αρχεία στη διαμόρφωση της μηχανής αρχειοθέτησης, ώστε να αποτρέψετε την υπέρβαση χρονικού ορίου κατά την αποστολή, που θα οδηγούσε σε αποτυχία της διαδικασίας δημιουργίας αντιγράφου ασφαλείας."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_TITLE="Απενεργοποίηση αποστολών πολλαπλών μερών"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_DESC="Να μετατρέπεται η ώρα έναρξης αντιγράφου ασφαλείας στη ζώνη ώρας του συνδεδεμένου χρήστη στη σελίδα Διαχείριση αντιγράφων ασφαλείας; Εάν οριστεί σε Όχι, όλες οι ώρες έναρξης εμφανίζονται στη ζώνη ώρας GMT. Αυτή η επιλογή ΔΕΝ επηρεάζει τις μεταβλητές [DATE] και [TIME] για την ονομασία αρχείων αντιγράφων ασφαλείας ή την προεπιλεγμένη περιγραφή. Χρησιμοποιήστε την επιλογή Ζώνη ώρας αντιγράφου ασφαλείας για να αλλάξετε τον τρόπο λειτουργίας αυτών των μεταβλητών."
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_LABEL="Τοπική ώρα στη Διαχείριση αντιγράφων ασφαλείας"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_WP_DESC="Όταν είναι απενεργοποιημένο, η ώρα έναρξης αντιγράφου ασφαλείας στη σελίδα Διαχείριση αντιγράφων ασφαλείας θα εμφανίζεται στη ζώνη ώρας GMT. Όταν είναι ενεργοποιημένο, η ώρα έναρξης αντιγράφου ασφαλείας θα εμφανίζεται στη ζώνη ώρας που έχετε ορίσει στο ίδιο το WordPress (Ρυθμίσεις, Γενικά, Ζώνη ώρας)."
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_DESC="Να εμφανίζεται η επιλογή λήψης αρχείων αντιγράφων ασφαλείας μέσω του προγράμματος περιήγησης, παρόλο που δεν συνιστάται; Σημειώστε ότι αυτή η επιλογή ΔΕΝ θα είναι διαθέσιμη εάν έχετε ενεργοποιήσει το WP_DEBUG ή η εμφάνιση σφαλμάτων PHP είναι αλλιώς ενεργοποιημένη, ως βασική προφύλαξη κατά της καταστροφής (ελλιπείς ή ατελείς) λήψεων. <strong>ΠΡΟΕΙΔΟΠΟΙΗΣΗ! Ενεργοποιώντας αυτήν την επιλογή συμφωνείτε να μην λαμβάνετε υποστήριξη για προβλήματα σχετικά με την αποσυμπίεση αρχείων αντιγράφων ασφαλείας.</strong>"
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_LABEL="Να επιτρέπεται η λήψη αρχείων αντιγράφων ασφαλείας μέσω του προγράμματος περιήγησης"
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_DESC="Να δίνεται στους χρήστες που επαναφέρουν έναν ιστότοπο η επιλογή διαγραφής όλων των αρχείων πριν από την αποσυμπίεση ενός αρχείου; Αυτή η επιλογή ισχύει μόνο για την επαγγελματική έκδοση του λογισμικού μας. ΠΡΟΕΙΔΟΠΟΙΗΣΗ! ΑΥΤΟ ΕΙΝΑΙ ΕΞΑΙΡΕΤΙΚΑ ΕΠΙΚΙΝΔΥΝΟ. ΔΙΑΒΑΣΤΕ ΤΗΝ ΤΕΚΜΗΡΙΩΣΗ ΠΟΛΥ ΠΡΟΣΕΚΤΙΚΑ ΠΡΙΝ ΤΗΝ ΕΝΕΡΓΟΠΟΙΗΣΕΤΕ. ΕΑΝ ΧΡΗΣΙΜΟΠΟΙΗΣΕΤΕ ΑΥΤΗ ΤΗ ΛΕΙΤΟΥΡΓΙΑ ΚΑΤΑ ΤΗΝ ΕΠΑΝΑΦΟΡΑ, ΠΑΡΑΙΤΕΙΣΘΕ ΑΠΟ ΚΑΘΕ ΔΙΚΑΙΩΜΑ ΖΗΤΗΣΗΣ ΥΠΟΣΤΗΡΙΞΗΣ ΚΑΙ ΑΝΑΛΑΜΒΑΝΕΤΕ ΤΗΝ ΠΛΗΡΗ ΕΥΘΥΝΗ."
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_LABEL="Εμφάνιση της επιλογής «Διαγραφή όλων πριν από την αποσυμπίεση»"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_ABBREVIATION="Ζώνη ώρας"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_DESC="Η επίθεση ζώνης ώρας που εμφανίζεται δίπλα στην ώρα έναρξης αντιγράφου ασφαλείας στη σελίδα Διαχείριση αντιγράφων ασφαλείας.<br/>Κανένα: δεν εμφανίζεται καμία επίθεση (δεν συνιστάται).<br/>Ζώνη ώρας: συντομευμένη ζώνη ώρας, π.χ. CET για Κεντρoευρωπαϊκή ώρα.<br/>Μετατόπιση GMT: η απόκλιση από τη ζώνη ώρας GMT. Αυτό μπορεί να αλλάξει ανάλογα με τη θερινή ώρα. Για παράδειγμα, η ζώνη ώρας CET θα είναι GMT+01:00 (μία ώρα μπροστά από το GMT) τον χειμώνα και GMT+02:00 (δύο ώρες μπροστά από το GMT) το καλοκαίρι."
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_GMTOFFSET="Μετατόπιση GMT"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_LABEL="Επίθεση ζώνης ώρας"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_NONE="Κανένα"
COM_AKEEBA_CONFIG_BACKUPTYPE_ALLDB="Όλες οι διαμορφωμένες βάσεις δεδομένων (αρχείο αντιγράφου)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DBONLY="Μόνο η κύρια βάση δεδομένων ιστότοπου (αρχείο SQL)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DESCRIPTION="Τον τύπο αντιγράφου ασφαλείας ιστότοπου που θέλετε να εκτελεί το Akeeba Backup"
COM_AKEEBA_CONFIG_BACKUPTYPE_FILEONLY="Μόνο αρχεία ιστότοπου"
COM_AKEEBA_CONFIG_BACKUPTYPE_FULL="Πλήρες αντίγραφο ασφαλείας ιστότοπου"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFILE="Μόνο αρχεία, σταδιακό"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFULL="Πλήρης ιστότοπος, σταδιακά αρχεία"
COM_AKEEBA_CONFIG_BACKUPTYPE_TITLE="Τύπος αντιγράφου ασφαλείας"
COM_AKEEBA_CONFIG_BACTHSIZE_DESCRIPTION="Η μείωση αυτής της τιμής θα εξοικονομεί μνήμη και θα αποφεύγει σφάλματα HTTP 500 κατά τη δημιουργία αντιγράφων ασφαλείας μεγάλων πινάκων"
COM_AKEEBA_CONFIG_BACTHSIZE_TITLE="Αριθμός γραμμών ανά παρτίδα"
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_DESCRIPTION="Τα αρχεία που υπερβαίνουν αυτό το μέγεθος θα αποθηκεύονται ασυμπίεστα ή η επεξεργασία τους θα κατανέμεται σε πολλαπλά βήματα (ανάλογα με τη μηχανή αρχειοθέτησης), ώστε να αποφεύγεται η υπέρβαση χρονικού ορίου. Σας προτείνουμε να αυξάνετε αυτήν την τιμή μόνο σε γρήγορους και αξιόπιστους διακομιστές."
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_TITLE="Κατώφλι μεγάλων αρχείων"
COM_AKEEBA_CONFIG_BLANKOUTPASS_DESCRIPTION="Αφαιρεί το όνομα χρήστη και τον κωδικό πρόσβασης των συνδέσεων βάσης δεδομένων από το αντίγραφο ασφαλείας"
COM_AKEEBA_CONFIG_BLANKOUTPASS_TITLE="Εκκαθάριση ονόματος χρήστη/κωδικού πρόσβασης"
COM_AKEEBA_CONFIG_BOX_ACCESSTOKEN_TITLE="Διακριτικό πρόσβασης"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_ENABLE="Ενεργοποίηση αποστολής σε τμήματα"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_SIZE="Μέγεθος τμήματος"
COM_AKEEBA_CONFIG_BOX_DIRECTORY_DESCRIPTION="Ο φάκελος εντός του λογαριασμού Box.com όπου θα αποθηκεύονται τα αρχεία αντιγράφων ασφαλείας. Αφήστε κενό για αποθήκευση αρχείων στον ριζικό φάκελο Box."
COM_AKEEBA_CONFIG_BOX_DIRECTORY_TITLE="Φάκελος"
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_DESC="Κάντε κλικ σε αυτό το κουμπί για να ανοίξετε ένα νέο παράθυρο στο οποίο μπορείτε να συνδεθείτε στον λογαριασμό σας με τον πάροχο αποθήκευσης. Στη συνέχεια, κλείστε το αναδυόμενο παράθυρο και κάντε κλικ στο κουμπί Βήμα 2 παρακάτω."
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_TITLE="Έλεγχος ταυτότητας - Βήμα 1"
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_DESCRIPTION="Συμπληρώνεται αυτόματα όταν ολοκληρώσετε το Βήμα 1 ελέγχου ταυτότητας παραπάνω. ΜΗΝ μοιράζεστε το ίδιο διακριτικό σε πολλούς ιστότοπους. Αντ' αυτού, πραγματοποιήστε έλεγχο ταυτότητας για κάθε ιστότοπο ξεχωριστά."
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_TITLE="Διακριτικό ανανέωσης"
COM_AKEEBA_CONFIG_CHUNKSIZE_DESCRIPTION="Το Akeeba Backup επεξεργάζεται μεγάλα αρχεία σε μικρά τμήματα, ώστε να αποφεύγεται η υπέρβαση χρονικού ορίου. Αυτή η παράμετρος ορίζει το μέγιστο μέγεθος τμήματος για αυτόν τον τύπο επεξεργασίας."
COM_AKEEBA_CONFIG_CHUNKSIZE_TITLE="Μέγεθος τμήματος για επεξεργασία μεγάλων αρχείων"
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_DESCRIPTION="Όταν αυτό το πλαίσιο δεν είναι επιλεγμένο (προεπιλογή) και το βήμα αντιγράφου ασφαλείας ολοκληρώνεται σε λιγότερο χρόνο από τον ελάχιστο χρόνο εκτέλεσης που έχει ρυθμιστεί, το Akeeba Backup θα αναμένει από τον διακομιστή μέχρι να συμπληρωθεί αυτός ο χρόνος. Αυτό μπορεί να προκαλέσει σε ορισμένους περιοριστικούς διακομιστές να τερματίσουν το αντίγραφο ασφαλείας σας. Η επιλογή αυτού του πλαισίου θα υλοποιήσει την περίοδο αναμονής στο πρόγραμμα περιήγησης, παρακάμπτοντας αυτόν τον περιορισμό. ΣΗΜΑΝΤΙΚΟ: Αυτή η επιλογή ισχύει μόνο για αντίγραφα ασφαλείας πίσω άκρου. Τα αντίγραφα ασφαλείας μπροστινού άκρου, JSON API (απομακρυσμένα) και γραμμής εντολών (CLI) υλοποιούν πάντα την αναμονή στην πλευρά του διακομιστή."
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_TITLE="Υλοποίηση ελάχιστου χρόνου εκτέλεσης από την πλευρά του πελάτη"
