COM_AKEEBA_CONFWIZ_UI_CANTDETERMINEPARTSIZE="Το Akeeba Backup δεν κατάφερε να καθορίσει κατάλληλο μέγεθος τμήματος για τον διακομιστή σας. Βεβαιωθείτε ότι έχετε επαρκή ελεύθερο χώρο στον λογαριασμό σας και εκτελέστε ξανά αυτόν τον οδηγό."
