SOLO_RESTORE_LABEL_SUCCESS_INFO="Θα πρέπει τώρα να εκτελέσετε τη δέσμη ενεργειών επαναφοράς η οποία θα επαναφέρει τα περιεχόμενα της βάσης δεδομένων σας και θα εκτελέσει άλλες εργασίες συντήρησης. Για να το κάνετε αυτό, παρακαλώ επισκεφθείτε τη διεύθυνση URL <code>http://www.example.com/installation/index.php</code> όπου http://www.example.com είναι η διεύθυνση URL του ιστότοπου στον οποίο κάνετε επαναφορά. <strong>ΣΗΜΑΝΤΙΚΟ! Μην κλείσετε το παράθυρο όπου εμφανίζεται αυτό το μήνυμα!</strong>. Αφού ολοκληρωθεί η δέσμη ενεργειών επαναφοράς, κλείστε το παράθυρό της και επιστρέψτε εδώ. Στη συνέχεια κάντε κλικ στο κουμπί Οριστικοποίηση Επαναφοράς παρακάτω για να αφαιρέσετε τον κατάλογο <tt>installation</tt>. Στη συνέχεια μπορείτε να αρχίσετε να χρησιμοποιείτε τον ανακτημένο ιστότοπό σας."
SOLO_RESTORE_LABEL_SUCCESS_INFO_HASURL="Θα πρέπει τώρα να εκτελέσετε τη δέσμη ενεργειών επαναφοράς η οποία θα επαναφέρει τα περιεχόμενα της βάσης δεδομένων σας και θα εκτελέσει άλλες εργασίες συντήρησης. Για να το κάνετε αυτό, παρακαλώ επισκεφθείτε τη διεύθυνση URL <code>%s/installation/index.php</code> όπου %s είναι η διεύθυνση URL του ιστότοπου στον οποίο κάνετε επαναφορά. Μπορείτε να επισκεφθείτε αυτή τη διεύθυνση URL κάνοντας κλικ στο κουμπί Εκτέλεση Δέσμης Ενεργειών Επαναφοράς παρακάτω. <strong>ΣΗΜΑΝΤΙΚΟ! Μην κλείσετε το παράθυρο όπου εμφανίζεται αυτό το μήνυμα!</strong>. Αφού ολοκληρωθεί η δέσμη ενεργειών επαναφοράς, κλείστε το παράθυρό της και επιστρέψτε εδώ. Στη συνέχεια κάντε κλικ στο κουμπί Οριστικοποίηση Επαναφοράς παρακάτω για να αφαιρέσετε τον κατάλογο <tt>installation</tt>. Στη συνέχεια μπορείτε να αρχίσετε να χρησιμοποιείτε τον ανακτημένο ιστότοπό σας."
