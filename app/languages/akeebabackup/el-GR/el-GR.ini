COM_AKEEBA_CONFIG_SAVENEW_DEFAULT_PROFILE_NAME="Νέο προφίλ αντιγράφου ασφαλείας"
COM_AKEEBA_CONFIG_SAVE_OK="Η διαμόρφωση έχει αποθηκευτεί"
COM_AKEEBA_CONFIG_SCANENGINE_DESCRIPTION="Ορίζει τον τρόπο με τον οποίο το Akeeba Backup θα σαρώνει τα αρχεία και τους φακέλους του ιστότοπού σας για να προσδιορίσει ποια από αυτά πρέπει να συμπεριληφθούν στο αντίγραφο ασφαλείας."
COM_AKEEBA_CONFIG_SCANENGINE_TITLE="Μηχανή σάρωσης συστήματος αρχείων"
COM_AKEEBA_CONFIG_SECRETWORD_DESC="Αυτός ο κωδικός θα χρησιμοποιηθεί με τις λειτουργίες Αντίγραφο ασφαλείας από το frontend (Legacy API) και JSON API, ώστε να προστατεύονται από μη εξουσιοδοτημένη πρόσβαση. Το Akeeba Backup ΔΕΝ θα ενεργοποιήσει αυτές τις λειτουργίες αν δεν χρησιμοποιήσετε εδώ έναν μακρύ και σύνθετο κωδικό.<br><br><strong>Σημείωση ασφαλείας:</strong> το Μυστικό κλειδί είναι το μοναδικό διαπιστευτήριο που δέχεται το JSON API, και είναι απεριόριστο. Όποιος το κατέχει μπορεί να αλλάξει κάθε επιλογή, να λάβει αντίγραφο ασφαλείας και να το κατεβάσει — και ένα αντίγραφο ασφαλείας είναι πλήρες αντίγραφο του ιστοτόπου σας, μαζί με τα διαπιστευτήρια της βάσης δεδομένων και τις εγγραφές των χρηστών. Αντιμετωπίστε το με την ίδια προσοχή όπως τον κωδικό του διαχειριστή σας. Συμβουλευτείτε την τεκμηρίωση για περισσότερες πληροφορίες."
COM_AKEEBA_CONFIG_SECRETWORD_LABEL="Μυστικό κλειδί"
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_DESCRIPTION="Όταν είναι ενεργοποιημένο, οι ρυθμίσεις διαμόρφωσης κρυπτογραφούνται χρησιμοποιώντας την κρυπτογράφηση AES-128 βιομηχανικού προτύπου."
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_LABEL="Χρήση κρυπτογράφησης"
COM_AKEEBA_CONFIG_SFTPTEST_BADPREFIX="ΔΕΝ πρέπει να προσθέτετε το πρόθεμα sftp:// στο όνομα κεντρικού υπολογιστή SFTP. Αφαιρέστε το πρόθεμα sftp:// και δοκιμάστε ξανά."
COM_AKEEBA_CONFIG_SFTPTEST_NOUPLOAD="Το Akeeba Backup κατάφερε να συνδεθεί με τον διακομιστή σας, αλλά δεν κατάφερε να μεταφορτώσει ένα δοκιμαστικό αρχείο. Η μεταφόρτωση αντιγράφου ασφαλείας ενδέχεται να αποτύχει."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_DESCRIPTION="Όταν ενεργοποιείται, το Akeeba Backup θα διαγράφει παλαιά αρχεία αντιγράφου ασφαλείας εάν το συνολικό μέγεθος των αρχείων αντιγράφου ασφαλείας υπερβαίνει την τιμή που ορίζεται παρακάτω. Αυτή η ρύθμιση εφαρμόζεται <b>ανά προφίλ</b>."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_TITLE="Ενεργοποίηση ορίου μεγέθους"
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_DESCRIPTION="Εάν το συνολικό μέγεθος των αρχείων αντιγράφου ασφαλείας που έχουν ληφθεί με το τρέχον προφίλ υπερβαίνει αυτό το όριο, τα παλαιότερα αντίγραφα ασφαλείας θα διαγραφούν από τον διακομιστή.<br/><br/><b>Συμβουλή</b>: Επιλέξτε Προσαρμοσμένο και πληκτρολογήστε την επιθυμητή τιμή εάν δεν βρίσκεται στη λίστα."
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_TITLE="Όριο μεγέθους"
COM_AKEEBA_CONFIG_SPLITDBDUMP_DESCRIPTION="Τα αποθέματα βάσης δεδομένων σας θα χωρίζονται σε μικρά αρχεία για βελτίωση της συμπίεσης και αποφυγή προβλημάτων μεγέθους αρχείων σε ορισμένους οικονομικούς παρόχους φιλοξενίας. Ιδανικά, θα πρέπει να χρησιμοποιείτε το μισό μέγεθος του Ορίου μεγάλου αρχείου. Ορίστε το σε 0 για απενεργοποίηση του διαχωρισμού και δημιουργία ενός μόνο τεράστιου αρχείου αποθέματος ανά βάση δεδομένων."
COM_AKEEBA_CONFIG_SPLITDBDUMP_TITLE="Μέγεθος για τμηματοποιημένα αρχεία SQL"
COM_AKEEBA_CONFIG_SUGARSYNC_ACCESS_DESCRIPTION="Εισάγετε το Αναγνωριστικό κλειδιού πρόσβασης. Δημιουργήστε ένα στη διεύθυνση https://www.sugarsync.com/developer/account"
COM_AKEEBA_CONFIG_SUGARSYNC_ACCESS_TITLE="Αναγνωριστικό κλειδιού πρόσβασης"
COM_AKEEBA_CONFIG_SUGARSYNC_DIRECTORY_DESCRIPTION="Ο φάκελος στον οποίο θα αποθηκεύονται τα αρχεία αντιγράφου ασφαλείας. Εάν το πρώτο τμήμα του φακέλου δεν αντιστοιχεί στο όνομα ενός φακέλου συγχρονισμού SugarSync, ο φάκελος θα δημιουργηθεί μέσα στον φάκελο Magic Briefcase. Μπορείτε να χρησιμοποιήσετε τις ίδιες μεταβλητές που χρησιμοποιείτε για ονόματα αρχείων αντιγράφου ασφαλείας, π.χ. [HOST] για το domain name του ιστότοπού σας ή [DATE] για την τρέχουσα ημερομηνία."
COM_AKEEBA_CONFIG_SUGARSYNC_DIRECTORY_TITLE="Φάκελος"
