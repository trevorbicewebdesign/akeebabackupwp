COM_AKEEBA_SCHEDULE_LBL_FRONTEND_CUSTOMSCRIPT="Προσαρμοσμένο PHP script για εκτέλεση αντιγράφου ασφαλείας μπροστινού άκρου:"
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_RAWURL="URL για χρήση με τα δικά σας scripts και υπηρεσίες τρίτων:"
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_SECRET="Το μυστικό κλειδί είναι κενό. Δεν μπορείτε να χρησιμοποιήσετε αυτή τη μέθοδο χρονοπρογραμματισμού χωρίς να δημιουργήσετε ένα μυστικό κλειδί. Παρακαλώ μεταβείτε στον Πίνακα ελέγχου του Akeeba Backup και κάντε κλικ στο κουμπί «Εφαρμογή του προτεινόμενου μυστικού κλειδιού» στο μήνυμα στην κορυφή της σελίδας για να εφαρμόσετε ένα αυτόματα δημιουργημένο μυστικό κλειδί."
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON="Διαμόρφωση εργασίας αντιγράφου ασφαλείας με WebCron.org:"
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_ALERTS="Ειδοποιήσεις"
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_ALERTS_INFO="Εάν έχετε ήδη ρυθμίσει μεθόδους ειδοποίησης στη διεπαφή του webcron.org, συνιστούμε να επιλέξετε μια μέθοδο ειδοποίησης εδώ και να μην επιλέξετε το «Μόνο σε σφάλμα» ώστε να λαμβάνετε πάντα ειδοποίηση όταν εκτελείται η εργασία CRON αντιγράφου ασφαλείας."
