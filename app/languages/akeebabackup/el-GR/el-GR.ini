COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_EXECUTIONTIME_INFO="Αυτό είναι το πλέγμα κάτω από τις άλλες επιλογές. Επιλέξτε πότε και πόσο συχνά θέλετε να εκτελείται η εργασία CRON."
COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_INFO="Συνδεθείτε στο webcron.org. Στην περιοχή CRON, κάντε κλικ στο κουμπί Νέο Cron. Παρακάτω θα βρείτε τι πρέπει να εισαγάγετε στη διεπαφή του webcron.org."
