SOLO_USERS_HEAD_TFA="Έλεγχος ταυτότητας δύο παραγόντων"
SOLO_USERS_LBL_ABOUTTFA="Ο έλεγχος ταυτότητας δύο παραγόντων (TFA) προσθέτει ένα επιπλέον επίπεδο ασφάλειας κατά τη σύνδεση στο Akeeba Solo. Εκτός από το όνομα χρήστη και τον κωδικό πρόσβασης, θα χρειαστεί επίσης να εισάγετε έναν μυστικό κωδικό για τη σύνδεση. Σε αντίθεση με το όνομα χρήστη και τον κωδικό πρόσβασής σας, αυτός ο μυστικός κωδικός δεν είναι σταθερός. Αλλάζει με την πάροδο του χρόνου και δημιουργείται από το smartphone σας ή μια ειδική συσκευή, ανάλογα με τη μέθοδο που επιλέγετε. Η ενεργοποίηση του TFA είναι προαιρετική· το Akeeba Solo λειτουργεί εξίσου καλά και χωρίς αυτό."
SOLO_USERS_LBL_TFAENABLE="Ενεργοποίηση ελέγχου ταυτότητας δύο παραγόντων"
SOLO_USERS_LBL_TFAMETHOD="Μέθοδος ελέγχου ταυτότητας δύο παραγόντων"
SOLO_USERS_LBL_TFASECURITYCODE="Κωδικός ασφαλείας"
SOLO_USERS_TFA_GOOGLE="Google Authenticator"
SOLO_USERS_TFA_GOOGLE_INTRO="Αυτή η δυνατότητα σάς επιτρέπει να χρησιμοποιείτε το Google Authenticator ή μια συμβατή εφαρμογή για έλεγχο ταυτότητας δύο παραγόντων. Εκτός από το όνομα χρήστη και τον κωδικό πρόσβασης, θα χρειαστεί επίσης να δώσετε έναν εξαψήφιο κωδικό ασφαλείας που δημιουργείται από το Google Authenticator για να μπορέσετε να συνδεθείτε στο Akeeba Solo. Ο κωδικός ασφαλείας ανανεώνεται κάθε 30 δευτερόλεπτα. Αυτό παρέχει επιπλέον προστασία έναντι χάκερ που προσπαθούν να συνδεθούν στον λογαριασμό σας, ακόμα και αν κατόρθωσαν να αποκτήσουν τον κωδικό πρόσβασής σας."
SOLO_USERS_TFA_GOOGLE_LBL_STEP1="Βήμα 1 - Αποκτήστε το Google Authenticator"
SOLO_USERS_TFA_GOOGLE_LBL_STEP2="Βήμα 2 - Ρύθμιση"
SOLO_USERS_TFA_GOOGLE_LBL_STEP3="Βήμα 3 - Ενεργοποίηση ελέγχου ταυτότητας δύο παραγόντων"
SOLO_USERS_TFA_GOOGLE_SETUP1="Κατεβάστε και εγκαταστήστε το Google Authenticator ή μια συμβατή εφαρμογή στο smartphone ή στον υπολογιστή σας. Χρησιμοποιήστε ένα από τα παρακάτω:"
SOLO_USERS_TFA_GOOGLE_SETUP1_WARNING="Να θυμάστε να συγχρονίζετε το ρολόι της συσκευής σας με έναν διακομιστή ώρας. Η χρονική απόκλιση στη συσκευή σας ενδέχεται να προκαλέσει αδυναμία σύνδεσης στο Akeeba Solo."
SOLO_USERS_TFA_GOOGLE_SETUP2A="Θα χρειαστεί να εισάγετε τις ακόλουθες πληροφορίες στο Google Authenticator ή σε μια συμβατή εφαρμογή."
SOLO_USERS_TFA_GOOGLE_SETUP2A_ACCOUNT="Λογαριασμός"
SOLO_USERS_TFA_GOOGLE_SETUP2A_KEY="Κλειδί"
SOLO_USERS_TFA_GOOGLE_SETUP2B="Εναλλακτικά, μπορείτε να σαρώσετε τον ακόλουθο κωδικό QR στο Google Authenticator."
SOLO_USERS_TFA_GOOGLE_SETUP3="Για να επαληθεύσετε ότι όλα έχουν ρυθμιστεί σωστά, εισάγετε τον κωδικό ασφαλείας που εμφανίζεται στο Google Authenticator στο παρακάτω πεδίο και κάντε κλικ στο κουμπί. Αν ο κωδικός είναι σωστός, η δυνατότητα ελέγχου ταυτότητας δύο παραγόντων θα ενεργοποιηθεί."
SOLO_USERS_TFA_NONE="Κανένας (χωρίς χρήση ελέγχου ταυτότητας δύο παραγόντων)"
SOLO_USERS_TFA_OTEPS_HEAD="Κωδικοί έκτακτης ανάγκης μίας χρήσης"
SOLO_USERS_TFA_OTEPS_INTRO="Εκτυπώστε αμέσως ένα αντίγραφο αυτών των κωδικών και φυλάξτε τους σε ασφαλές μέρος. Αν χάσετε τη συσκευή ελέγχου ταυτότητας δύο παραγόντων σας, δεν θα μπορείτε να συνδεθείτε στο Akeeba Solo. Σε αυτήν την περίπτωση, χρησιμοποιήστε έναν από τους ακόλουθους κωδικούς έκτακτης ανάγκης μίας χρήσης αντί του μυστικού κλειδιού δύο παραγόντων για να συνδεθείτε στο Akeeba Solo και να επαναφέρετε τον έλεγχο ταυτότητας δύο παραγόντων. Να θυμάστε ότι αυτοί είναι κωδικοί έκτακτης ανάγκης μίας χρήσης. Μόλις χρησιμοποιήσετε έναν από αυτούς, δεν μπορείτε να τον χρησιμοποιήσετε ξανά. Αν εξαντλήσετε τους κωδικούς έκτακτης ανάγκης, απενεργοποιήστε τον έλεγχο ταυτότητας δύο παραγόντων και ενεργοποιήστε τον εκ νέου για να δημιουργήσετε ένα νέο σύνολο 10 κωδικών."
SOLO_USERS_TFA_YUBIKEY="YubiKey"
SOLO_USERS_TFA_YUBIKEY_INTRO="Αυτή η δυνατότητα σάς επιτρέπει να χρησιμοποιείτε ένα ασφαλές κλειδί υλικού YubiKey για έλεγχο ταυτότητας δύο παραγόντων. Εκτός από το όνομα χρήστη και τον κωδικό πρόσβασης, θα χρειαστεί επίσης να εισάγετε το YubiKey σας στη θύρα USB του υπολογιστή σας, να κάνετε κλικ μέσα στην περιοχή Μυστικού κλειδιού της περιοχής σύνδεσης του Akeeba Solo και να αγγίξετε το χρυσό κουμπί του YubiKey. Ο μυστικός κωδικός που δημιουργείται από το YubiKey σας είναι μοναδικός για τη συσκευή σας και αλλάζει συνεχώς. Αυτό παρέχει επιπλέον προστασία έναντι χάκερ που προσπαθούν να συνδεθούν στον λογαριασμό σας, ακόμα και αν κατόρθωσαν να αποκτήσουν τον κωδικό πρόσβασής σας."
SOLO_USERS_TFA_YUBIKEY_SETUP="Εισάγετε τη συσκευή YubiKey σας στη θύρα USB του υπολογιστή σας. Κάντε κλικ στο πεδίο Κωδικός ασφαλείας παρακάτω. Στη συνέχεια, αγγίξτε το χρυσό κουμπί στη συσκευή YubiKey για ένα δευτερόλεπτο. Έπειτα, αποθηκεύστε το προφίλ χρήστη σας. Αν ο κωδικός που δημιουργήθηκε από το YubiKey επαληθευτεί από το YubiCloud, η δυνατότητα ελέγχου ταυτότητας δύο παραγόντων θα ενεργοποιηθεί και αυτό το YubiKey θα συνδεθεί με τον λογαριασμό χρήστη σας."
SOLO_WIZARD_BTN_PYTHIA="Αυτόματος εντοπισμός"
SOLO_WIZARD_BTN_PYTHIA_HELP="Αν κάνετε κλικ σε αυτό το κουμπί, το Akeeba Solo θα προσπαθήσει να εντοπίσει αυτόματα τον τύπο σεναρίου, τον τύπο εγκατάστασης και τις πληροφορίες σύνδεσης βάσης δεδομένων παρακάτω. Ελέγξτε τις ρυθμίσεις. Ο αυτόματος εντοπισμός ενδέχεται να αποτύχει να παράγει τις σωστές ρυθμίσεις σε ορισμένες περιστάσεις."
SOLO_WIZARD_ERR_DIRNOTEXIST="Ο καθορισμένος ριζικός φάκελος δεν υπάρχει ή δεν είναι αναγνώσιμος από το Akeeba Solo"
SOLO_WIZARD_LBL_DBINFO_INTRO="Εδώ μπορείτε να παράσχετε τα στοιχεία σύνδεσης στη βάση δεδομένων που περιέχει τα δεδομένα του ιστότοπου / εφαρμογής ιστού για δημιουργία αντιγράφου ασφαλείας."
SOLO_WIZARD_LBL_DBINFO_TITLE="Σύνδεση βάσης δεδομένων"
SOLO_WIZARD_LBL_INTRO="Αρχικά, πρέπει να μας πείτε τι θέλετε να συμπεριλάβετε στο αντίγραφο ασφαλείας. Μπορείτε να το κάνετε ορίζοντας τον ριζικό φάκελο και τα στοιχεία σύνδεσης στη βάση δεδομένων του ιστότοπου για τον οποίο θέλετε να δημιουργήσετε αντίγραφο ασφαλείας. Εάν ο ιστότοπός σας απαιτεί περισσότερες από μία βάσεις δεδομένων για να λειτουργεί σωστά, μπορείτε να τις προσθέσετε μετά την ολοκλήρωση αυτού του οδηγού, μέσω της δυνατότητας Ορισμοί πολλαπλών βάσεων δεδομένων στην κύρια σελίδα της εφαρμογής."
SOLO_WIZARD_LBL_SITEINFO_INTRO="Οι παρακάτω επιλογές επηρεάζουν τον τρόπο με τον οποίο το Akeeba Solo δημιουργεί αντίγραφα ασφαλείας του ιστότοπού σας και επαναφέρει τα αντίγραφα ασφαλείας σας. Εάν δεν είστε σίγουροι/ες για το τι να εισαγάγετε εδώ, απλώς κάντε κλικ στο κουμπί Αυτόματος εντοπισμός στην κορυφή της σελίδας, ώστε το Akeeba Solo να εντοπίσει αυτόματα αυτές τις τιμές για εσάς."
SOLO_WIZARD_LBL_SITEINFO_TITLE="Πληροφορίες ιστότοπου"
SOLO_WIZARD_LBL_SITEROOT_INTRO="Ο ριζικός φάκελος του ιστότοπου είναι ο φάκελος που περιέχει όλα τα αρχεία του ιστότοπου / εφαρμογής ιστού για τη δημιουργία αντιγράφου ασφαλείας. Πρέπει να βρίσκεται στον ίδιο διακομιστή και να είναι προσβάσιμος από το Akeeba Solo."
SOLO_WIZARD_LBL_SITEROOT_TITLE="Ριζικός φάκελος ιστότοπου"
SOLO_WIZARD_NO_EXTRADIRS_CORE="Η υποστήριξη για φακέλους εκτός του ριζικού φακέλου ιστού είναι διαθέσιμη μόνο στην έκδοση Pro, επομένως ο/οι παραπάνω φάκελος/οι δεν θα συμπεριληφθεί/ούν στο αντίγραφο ασφαλείας σας"
SOLO_WIZARD_TITLE="Οδηγός διαμόρφωσης"
SOLO_WP_USERMANAGER_ERR_CANTDELETE="Δεν είναι δυνατή η διαγραφή χρηστών. Χρησιμοποιήστε τη σελίδα Χρήστες στο WordPress."
SOLO_YES="Ναι"

COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEDB_DESCRIPTION="Όταν είναι απεπιλεγμένο (προεπιλογή), το Akeeba Backup θα δημιουργεί αυτόματα αντίγραφο ασφαλείας της βάσης δεδομένων στην οποία συνδέεται ο ιστότοπος που είναι εγκατεστημένο (η βάση δεδομένων Joomla!). Όταν είναι επιλεγμένο, θα δημιουργεί αντίγραφο ασφαλείας μιας διαφορετικής βάσης δεδομένων, χρησιμοποιώντας τα στοιχεία σύνδεσης που παρέχετε παρακάτω."
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEDB_TITLE="Παράκαμψη βάσης δεδομένων ιστότοπου"
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEROOT_DESCRIPTION="Όταν είναι απεπιλεγμένο (προεπιλογή), το Akeeba Backup θα δημιουργεί αντίγραφο ασφαλείας όλων των αρχείων και φακέλων κάτω από τον ριζικό φάκελο του ιστότοπου στον οποίο είναι εγκατεστημένο. Όταν είναι ενεργοποιημένο, θα δημιουργεί αντίγραφο ασφαλείας των αρχείων και φακέλων κάτω από τον φάκελο που επιλέγεται στο πεδίο Εξαναγκασμός ριζικού φακέλου ιστότοπου παρακάτω."
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEROOT_TITLE="Παράκαμψη ριζικού φακέλου ιστότοπου"
COM_AKEEBA_CONFIG_PLATFORM_NEWROOT_DESCRIPTION="Όταν έχετε ενεργοποιήσει την επιλογή Παράκαμψη ριζικού φακέλου ιστότοπου παραπάνω, το Akeeba Backup θα δημιουργεί αντίγραφο ασφαλείας όλων των αρχείων και φακέλων κάτω από τον ριζικό φάκελο αυτού του ιστότοπου"
COM_AKEEBA_CONFIG_PLATFORM_NEWROOT_TITLE="Εξαναγκασμός ριζικού φακέλου ιστότοπου"
COM_AKEEBA_CONFIG_PLATFORM_DBDATABASE_DESCRIPTION="Το όνομα της βάσης δεδομένων για τη δημιουργία αντιγράφου ασφαλείας. Χρησιμοποιείται μόνο όταν είναι επιλεγμένο το πλαίσιο ελέγχου παράκαμψης βάσης δεδομένων ιστότοπου."
COM_AKEEBA_CONFIG_PLATFORM_DBDATABASE_TITLE="Όνομα βάσης δεδομένων"
COM_AKEEBA_CONFIG_PLATFORM_DBDRIVER_DESCRIPTION="Επιλέξτε το πρόγραμμα οδήγησης βάσης δεδομένων που θα χρησιμοποιηθεί κατά τη σύνδεση στη βάση δεδομένων του ιστότοπου. Χρησιμοποιείται μόνο όταν είναι επιλεγμένο το πλαίσιο ελέγχου παράκαμψης βάσης δεδομένων ιστότοπου."
COM_AKEEBA_CONFIG_PLATFORM_DBDRIVER_TITLE="Πρόγραμμα οδήγησης βάσης δεδομένων"
COM_AKEEBA_CONFIG_PLATFORM_DBHOST_DESCRIPTION="Το όνομα κεντρικού υπολογιστή ή η διεύθυνση IP του διακομιστή βάσης δεδομένων. Συνήθως localhost ή 127.0.0.1. Χρησιμοποιείται μόνο όταν είναι επιλεγμένο το πλαίσιο ελέγχου παράκαμψης βάσης δεδομένων ιστότοπου."
COM_AKEEBA_CONFIG_PLATFORM_DBHOST_TITLE="Όνομα κεντρικού υπολογιστή διακομιστή βάσης δεδομένων"
COM_AKEEBA_CONFIG_PLATFORM_DBPASSWORD_DESCRIPTION="Ο κωδικός πρόσβασης για τη σύνδεση στη βάση δεδομένων του ιστότοπου. Χρησιμοποιείται μόνο όταν είναι επιλεγμένο το πλαίσιο ελέγχου παράκαμψης βάσης δεδομένων ιστότοπου."
COM_AKEEBA_CONFIG_PLATFORM_DBPASSWORD_TITLE="Κωδικός πρόσβασης"
COM_AKEEBA_CONFIG_PLATFORM_DBPORT_DESCRIPTION="(προαιρετικό) Η θύρα στην οποία ακούει ο διακομιστής βάσης δεδομένων. Εάν δεν είστε σίγουροι/ες, αφήστε αυτή την επιλογή κενή για να χρησιμοποιηθεί η προεπιλεγμένη θύρα (3306 για διακομιστές MySQL). Χρησιμοποιείται μόνο όταν είναι επιλεγμένο το πλαίσιο ελέγχου παράκαμψης βάσης δεδομένων ιστότοπου."
COM_AKEEBA_CONFIG_PLATFORM_DBPORT_TITLE="Θύρα διακομιστή βάσης δεδομένων"
COM_AKEEBA_CONFIG_PLATFORM_DBPREFIX_DESCRIPTION="Το πρόθεμα της βάσης δεδομένων για τη δημιουργία αντιγράφου ασφαλείας συμπεριλαμβανομένης της κάτω παύλας, π.χ. <tt>jos_</tt>. Χρησιμοποιείται μόνο όταν είναι επιλεγμένο το πλαίσιο ελέγχου παράκαμψης βάσης δεδομένων ιστότοπου."
COM_AKEEBA_CONFIG_PLATFORM_DBPREFIX_TITLE="Πρόθεμα"
COM_AKEEBA_CONFIG_PLATFORM_DBUSERNAME_DESCRIPTION="Το όνομα χρήστη για τη σύνδεση στη βάση δεδομένων του ιστότοπου. Χρησιμοποιείται μόνο όταν είναι επιλεγμένο το πλαίσιο ελέγχου παράκαμψης βάσης δεδομένων ιστότοπου."
COM_AKEEBA_CONFIG_PLATFORM_DBUSERNAME_TITLE="Όνομα χρήστη"

COM_AKEEBA_MIGREIGHT_TITLE="Μεταφορά αντιγράφου ασφαλείας"
COM_AKEEBA_MIGREIGHT_GO_BACK_PROMPT="Μπορείτε να επιστρέψετε με ασφάλεια στην αρχική σελίδα (πίνακα ελέγχου) του Akeeba Backup."
COM_AKEEBA_MIGREIGHT_NOT_NEEDED_TITLE="Δεν απαιτείται μεταφορά (αυτό είναι καλό!)"
COM_AKEEBA_MIGREIGHT_NOT_NEEDED_INFO="Τα προφίλ αντιγράφων ασφαλείας και τα αρχεία αντιγράφων ασφαλείας σας φαίνεται να βρίσκονται εκτός του φακέλου του προσθέτου. Αυτό είναι εξαιρετικό! Μπορείτε να ενημερώσετε με ασφάλεια το Akeeba Backup, χωρίς κίνδυνο απώλειας των αρχείων αντιγράφων ασφαλείας σας."
COM_AKEEBA_MIGREIGHT_NEEDED_TITLE="Απαιτείται μεταφορά"
COM_AKEEBA_MIGREIGHT_NEEDED_WHY="Το WordPress θα διαγράφει πάντα τον φάκελο του προσθέτου κάθε φορά που το ενημερώνετε. Ως αποτέλεσμα, τυχόν αρχεία αντιγράφων ασφαλείας που είναι αποθηκευμένα στον φάκελο του προσθέτου θα <em>χαθούν για πάντα</em>. Αυτό θα ισοδυναμούσε με το να μην έχετε δημιουργήσει ποτέ αντίγραφο ασφαλείας."
COM_AKEEBA_MIGREIGHT_NEEDED_WHAT="Το Akeeba Backup εντοπίζει αυτό το ζήτημα και σας επιτρέπει να αλλάξετε αυτόματα τον φάκελο εξόδου αντιγράφων ασφαλείας ώστε να βρίσκεται κάτω από τον <code>%s</code>, καθώς και να μεταφέρετε τα υπάρχοντα αρχεία αντιγράφων ασφαλείας στον ίδιο φάκελο."
COM_AKEEBA_MIGREIGHT_NEEDED_PROFILES_N="Το Akeeba Backup εντόπισε %d προφίλ αντιγράφων ασφαλείας που χρειάζεται να αλλάξουν τον φάκελο εξόδου αντιγράφων ασφαλείας τους:"
