COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_TITLE="Δοκιμή σύνδεσης SFTP"
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_DESCRIPTION="Το όνομα χρήστη SFTP. Σημειώστε ότι ο διακομιστής SFTP σας πρέπει να επιτρέπει έλεγχο ταυτότητας με όνομα χρήστη/κωδικό πρόσβασης."
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_TITLE="Όνομα χρήστη"
COM_AKEEBA_CONFIG_DOWNLOADID_DESC="Αυτό απαιτείται για την ενεργοποίηση των άμεσων ενημερώσεων της έκδοσης Professional. Επισκεφθείτε τη διεύθυνση https://www.akeeba.com/my-subscriptions.html για να λάβετε το προσωπικό σας Αναγνωριστικό λήψης."
COM_AKEEBA_CONFIG_DOWNLOADID_LABEL="Αναγνωριστικό λήψης"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_DESCRIPTION="Το κλειδί πρόσβασης DreamObjects, διαθέσιμο στον πίνακα ελέγχου DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_TITLE="Κλειδί πρόσβασης"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_DESCRIPTION="Το όνομα του bucket DreamObjects σας. Βεβαιωθείτε ότι έχει πληκτρολογηθεί ακριβώς όπως εμφανίζεται στον πίνακα ελέγχου DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_DESCRIPTION="Ο φάκελος εντός του bucket όπου θα αποθηκεύονται τα αρχεία αντιγράφων ασφαλείας. Αφήστε κενό για αποθήκευση στον ριζικό φάκελο του bucket."
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_TITLE="Φάκελος"
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_DESCRIPTION="Εάν είναι ενεργοποιημένο, το Akeeba Backup θα προσπαθήσει να μετατρέψει το όνομα του bucket σε πεζά γράμματα, π.χ. το MyBucket θα μετατραπεί σε mybucket. Εάν έχετε δημιουργήσει ένα bucket με κεφαλαία γράμματα, π.χ. MyNewBucket, απενεργοποιήστε αυτή την επιλογή και βεβαιωθείτε ότι το όνομα του bucket έχει πληκτρολογηθεί ακριβώς όπως εμφανίζεται στον πίνακα ελέγχου DreamHost."
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_TITLE="Όνομα bucket με πεζά γράμματα"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_DESCRIPTION="Το μυστικό κλειδί DreamObjects, διαθέσιμο στον πίνακα ελέγχου DreamHost"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_TITLE="Μυστικό κλειδί"
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_DESCRIPTION="Εάν είναι ενεργοποιημένο, θα χρησιμοποιείται ασφαλής σύνδεση (HTTPS) κατά την αποστολή των αρχείων σας. Αν και αυξάνει την ασφάλεια των μεταφερόμενων δεδομένων, αυξάνει επίσης την πιθανότητα αποτυχίας αντιγράφου λόγω υπέρβασης χρονικού ορίου."
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_TITLE="Χρήση SSL"
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_DESCRIPTION="Ο φάκελος εντός του λογαριασμού σας Dropbox όπου θα αποθηκεύονται τα αρχεία αντιγράφων ασφαλείας. Αφήστε κενό για αποθήκευση στον ριζικό φάκελο."
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_TITLE="Φάκελος"
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_DESCRIPTION="Αυτό είναι το Διακριτικό ανανέωσης που συνδέει το Akeeba Backup με το Dropbox. Είναι <strong>ειδικό για τον ιστότοπο</strong> και χρησιμοποιείται για την εκ νέου έγκριση της σύνδεσης Dropbox όταν λήξει το βραχύβιο Διακριτικό πρόσβασης. Εάν διαθέτετε πολλούς ιστότοπους, πρέπει να χρησιμοποιήσετε τα κουμπιά Βήμα 1 σε κάθε ιστότοπο που θέλετε να εξουσιοδοτήσετε. <strong>ΜΗΝ</strong> αντιγράφετε το διακριτικό πρόσβασης ή ανανέωσης σε πολλούς ιστότοπους. Αυτό θα προκαλέσει αποσυγχρονισμό του ελέγχου ταυτότητας Dropbox και θα χρειαστεί να επανασυνδέσετε όλους τους ιστότοπούς σας με το Dropbox."
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_TITLE="Διακριτικό ανανέωσης"
COM_AKEEBA_CONFIG_DROPBOXTOKEN_DESCRIPTION="Αυτό ανακτάται αυτόματα από το Dropbox όταν κάνετε κλικ στο κουμπί Βήμα 2 παραπάνω. Εάν διαθέτετε πολλούς ιστότοπους, πρέπει να χρησιμοποιήσετε τα κουμπιά Βήμα 1 και Βήμα 2 μόνο στον ΠΡΩΤΟ ιστότοπο που θέλετε να εξουσιοδοτήσετε. Στη συνέχεια, αντιγράψτε το Διακριτικό, το Μυστικό κλειδί διακριτικού και το Αναγνωριστικό χρήστη από τον πρώτο ιστότοπο σε όλους τους άλλους ιστότοπους που θέλετε να συνδέσετε με το Dropbox."
COM_AKEEBA_CONFIG_DROPBOXTOKEN_TITLE="Διακριτικό πρόσβασης"
COM_AKEEBA_CONFIG_DROPBOX_TEAM_DESC="Επιλέξτε εάν είστε μέλος ομάδας που χρησιμοποιεί Dropbox for Business και θέλετε να χρησιμοποιήσετε τον φάκελο της ομάδας σας για την αποθήκευση αντιγράφων ασφαλείας. Θυμηθείτε να προτάξετε στον Φάκελο παρακάτω το όνομα του φακέλου της ομάδας σας. Για παράδειγμα, εάν η διαδικτυακή διεπαφή του Dropbox εμφανίζει έναν "Acme Corp Team Folder" στη σελίδα Αρχεία και θέλετε να τοποθετήσετε τα αντίγραφά σας σε έναν φάκελο με όνομα "Backups" μέσα σε αυτόν, θα πρέπει να χρησιμοποιήσετε το όνομα φακέλου <code>Acme Corp Team Folder/Backups</code>, όχι απλώς <code>Backups</code>."
COM_AKEEBA_CONFIG_DROPBOX_TEAM_TITLE="Dropbox for Business"
COM_AKEEBA_CONFIG_DUMPENGINE_DESCRIPTION="Καθορίζει τον τρόπο με τον οποίο το Akeeba Backup θα επεξεργάζεται τις βάσεις δεδομένων σας για να δημιουργεί αρχείο αντιγράφου βάσης δεδομένων."
COM_AKEEBA_CONFIG_DUMPENGINE_TITLE="Μηχανή αντιγράφου βάσης δεδομένων"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_COMMON="Κοινές ρυθμίσεις"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_MYSQL="Ρυθμίσεις MySQL"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_POSTGRES="Ρυθμίσεις PostgreSQL"
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_DESCRIPTION="Τα μηνύματα ηλεκτρονικού ταχυδρομείου θα αποστέλλονται σε αυτή τη διεύθυνση αντί για αυτή που έχει ρυθμιστεί στη σελίδα Διαμόρφωσης συστήματος μετά την ολοκλήρωση ή αποτυχία του αντιγράφου ασφαλείας, εφόσον ισχύει. Μπορείτε να διαχωρίσετε πολλές διευθύνσεις ηλεκτρονικού ταχυδρομείου με κόμμα, π.χ. alice@example.com, bob@example.com."
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_TITLE="Παραλήπτες ηλεκτρονικού ταχυδρομείου"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_DESCRIPTION="Μεταφέρει τα αρχεία του ιστότοπου σε απομακρυσμένο διακομιστή FTP, χωρίς προηγούμενη αρχειοθέτησή τους. Αυτή η μηχανή αρχειοθέτησης χρησιμοποιεί τη βιβλιοθήκη cURL που παρέχει καλύτερη συμβατότητα με ένα ευρύ φάσμα διακομιστών FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_DESCRIPTION="Ορισμένοι κακώς ρυθμισμένοι ή δυσλειτουργικοί διακομιστές FTP επιστρέφουν λανθασμένη διεύθυνση IP όταν είναι ενεργοποιημένη η παθητική λειτουργία FTP. Ενεργοποιήστε αυτή την επιλογή για να αναγκάσετε τη βιβλιοθήκη FTP να αγνοεί τη λανθασμένη IP που επιστρέφει ο διακομιστής FTP και να χρησιμοποιεί αντ' αυτής τη δημόσια IP του διακομιστή FTP."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_TITLE="Αντιμετώπιση προβλήματος παθητικής λειτουργίας"
