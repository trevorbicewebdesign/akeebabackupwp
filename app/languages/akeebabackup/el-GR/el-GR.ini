SOLO_SETUP_MSG_CONFIGURATIONPHP="Μπορείτε να συνεχίσετε την εγκατάσταση καθώς οι ρυθμίσεις διαμόρφωσης θα εμφανιστούν στο τέλος. Θα πρέπει να ανεβάσετε τον κώδικα χειροκίνητα. Στο τέλος της εγκατάστασης, κάντε κλικ στο πεδίο κειμένου για να επισημάνετε όλο τον κώδικα και στη συνέχεια επικολλήστε τον σε ένα νέο αρχείο κειμένου. Ονομάστε αυτό το αρχείο 'config.php' και ανεβάστε το στον φάκελο Solo/assets/private μέσα στην εγκατάσταση Akeeba Solo."
