COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_DESCRIPTION="Η συνηθισμένη θύρα για συνδέσεις SFTP είναι η 22. Εάν ο διακομιστής σας χρησιμοποιεί διαφορετική θύρα, εισαγάγετέ την εδώ."
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_TITLE="Θύρα"
