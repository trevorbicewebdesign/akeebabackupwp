COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας σε απομακρυσμένο διακομιστή FTP ή FTPS (FTP over Implicit SSL).<br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 2-30MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_TITLE="Αποστολή σε απομακρυσμένο διακομιστή FTP"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας στο Google Drive. Διαβάστε την τεκμηρίωση."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_TITLE="Αποστολή στο Google Drive"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας στο Google Storage χρησιμοποιώντας το σύγχρονο JSON API. Αυτή είναι η συνιστώμενη ενσωμάτωση με το Google Storage.<br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 2-30MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_TITLE="Αποστολή στο Google Storage (JSON API)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας στο Google Storage χρησιμοποιώντας το παλαιό S3 API emulation. Αυτή η μέθοδος είναι καταργημένη και θα αφαιρεθεί στο μέλλον. Χρησιμοποιήστε αντί αυτής την επιλογή JSON API.<br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 2-30MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_TITLE="Αποστολή στο Google Storage (Παλαιό S3 API)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_NONE_DESCRIPTION="Διατηρεί τα αρχεία αντιγράφου ασφαλείας στον διακομιστή"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_NONE_TITLE="Χωρίς μετά-επεξεργασία"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας στο Microsoft OneDrive ή στο Microsoft OneDrive for Business."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_TITLE="Αποστολή στο Microsoft OneDrive ή OneDrive for Business"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας στο Microsoft OneDrive. Υποστηρίζει μόνο προσωπικές μονάδες δίσκου που δημιουργήθηκαν με προσωπικό λογαριασμό Microsoft. Δεν υποστηρίζει OneDrive for Business και λογαριασμούς OneDrive που δημιουργήθηκαν μέσω σχολικού/εταιρικού λογαριασμού ή συνδρομής Microsoft Office 365. Αυτή η μέθοδος αποστολής θα ΑΦΑΙΡΕΘΕΙ σε μελλοντική έκδοση του Akeeba Backup. Χρησιμοποιήστε αντί αυτής τη μέθοδο «Αποστολή στο Microsoft OneDrive»."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_TITLE="Αποστολή στο Microsoft OneDrive (ΠΑΛΑΙΟ)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας στο OVH Object Storage. <br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 2-30MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_TITLE="Αποστολή στο OVH Object Storage"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας στο Amazon S3. Σας επιτρέπει να χρησιμοποιείτε τόσο τον νέο έλεγχο ταυτότητας (AWS4) που απαιτείται για νεότερες τοποθεσίες S3 όσο και τον παλαιό (AWS2) που απαιτείται για τρίτους παρόχους αποθήκευσης που προσφέρουν API συμβατό με S3.<br/><strong>Εάν απενεργοποιήσετε τις πολυμερείς αποστολές, θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 2-30MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong><br/>Εάν θέλετε να χρησιμοποιήσετε Amazon STS αντί για κλειδί πρόσβασης και μυστικό κλειδί, διαβάστε την τεκμηρίωση."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_TITLE="Αποστολή στο Amazon S3"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας σε απομακρυσμένο διακομιστή SFTP (SSH). Πρόκειται για μεταφορά αρχείου μέσω SSH χρησιμοποιώντας ένα πρωτόκολλο που ονομάζεται SFTP και είναι <em>εντελώς διαφορετικό</em> από το FTP και το FTPS.<br/>Αυτή η μηχανή μετά-επεξεργασίας χρησιμοποιεί cURL για τη μεταφορά δεδομένων, μια βιβλιοθήκη συμβατή με ευρύ φάσμα διακομιστών SFTP.<br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 2-30MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_TITLE="Αποστολή σε απομακρυσμένο διακομιστή SFTP (SSH) μέσω cURL"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας σε απομακρυσμένο διακομιστή SFTP (SSH). Πρόκειται για μεταφορά αρχείου μέσω SSH χρησιμοποιώντας ένα πρωτόκολλο που ονομάζεται SFTP και είναι <em>εντελώς διαφορετικό</em> από το FTP και το FTPS.<br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 2-30MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_TITLE="Αποστολή σε απομακρυσμένο διακομιστή SFTP (SSH)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας στο SugarSync.<br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 2-30MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_TITLE="Αποστολή στο SugarSync"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SWIFT_TITLE="Αποστολή στο OpenStack Swift object storage"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_DESCRIPTION="Αποστέλλει το αρχείο αντιγράφου ασφαλείας σε οποιαδήποτε υπηρεσία αποθήκευσης που υποστηρίζει το πρωτόκολλο WebDAV.<br/><strong>Θυμηθείτε να ορίσετε μέγεθος τμήματος αρχείου 2-30MB, διαφορετικά κινδυνεύετε με αποτυχία αντιγράφου λόγω υπέρβασης χρονικού ορίου!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_TITLE="Αποστολή μέσω WebDAV"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_DESCRIPTION="Μηχανή σάρωσης αρχείων βελτιστοποιημένη για τη δημιουργία αντιγράφων ιστότοπων με φακέλους που περιέχουν εκατοντάδες αρχεία (π.χ. ιστολόγια και ειδησεογραφικές πύλες)"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_TITLE="Σαρωτής μεγάλου ιστότοπου"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_DESCRIPTION="Εξισορροπεί έξυπνα την ταχύτητα σάρωσης και την αποφυγή υπέρβασης χρονικού ορίου"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_TITLE="Έξυπνος σαρωτής"
COM_AKEEBA_CONFIG_ERR_DECRYPTION="Δεν ήταν δυνατή η αποκρυπτογράφηση των ρυθμίσεων. Ο διακομιστής σας δεν υποστηρίζει κρυπτογράφηση ρυθμίσεων ή το αρχείο κλειδιού κρυπτογράφησης έχει τροποποιηθεί ή διαγραφεί."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_DESCRIPTION="Εάν είναι επιλεγμένο, το αντίγραφο της βάσης δεδομένων θα αποτελείται από εκτεταμένες εντολές INSERT, δηλαδή μία εντολή για την επαναφορά πολλαπλών γραμμών δεδομένων. Συνιστάται να διατηρείτε αυτή την επιλογή ενεργοποιημένη καθώς επιταχύνει τη διαδικασία επαναφοράς και παρακάμπτει τα όρια ποσόστωσης ερωτημάτων σε περιοριστικούς κεντρικούς υπολογιστές."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_TITLE="Δημιουργία εκτεταμένων INSERT"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_DESC="Αποστολή email σε αυτή τη διεύθυνση (αφήστε κενό για απενεργοποίηση αυτής της λειτουργίας)"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_LABEL="Διεύθυνση email"
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_DESC="Αφήστε κενό για χρήση του προεπιλεγμένου. Μπορείτε να χρησιμοποιήσετε όλες τις μεταβλητές του Solo που χρησιμοποιείτε για ονοματοδοσία αρχείων αντιγράφων, π.χ. [HOST] και [DATE]."
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_LABEL="Σώμα Email"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_DESC="Αφήστε κενό για χρήση του προεπιλεγμένου. Μπορείτε να χρησιμοποιήσετε όλες τις μεταβλητές του Solo που χρησιμοποιείτε για ονοματοδοσία αρχείων αντιγράφων, π.χ. [HOST] και [DATE]"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_LABEL="Θέμα Email"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_DESC="Ένα αντίγραφο ασφαλείας θα θεωρηθεί κολλημένο (αποτυχημένο) μετά από τόσα δευτερόλεπτα αδράνειας.<br/><strong>ΜΗΝ ΑΛΛΑΞΕΤΕ ΑΥΤΗ ΤΗΝ ΤΙΜΗ ΑΝ ΔΕΝ ΓΝΩΡΙΖΕΤΕ ΤΙ ΚΑΝΕΤΕ!</strong>"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_LABEL="Χρονικό όριο κολλημένου αντιγράφου"
COM_AKEEBA_CONFIG_FEEMAILBODY_DESC="Αφήστε κενό για χρήση της προεπιλογής. Μπορείτε να χρησιμοποιήσετε όλες τις μεταβλητές του Akeeba Backup για ονοματοδοσία αρχείων αντιγράφων, π.χ. [HOST] και [DATE]. Μπορείτε επίσης να χρησιμοποιήσετε [PROFILENUMBER] για τον αριθμό του τρέχοντος προφίλ, [PROFILENAME] για το όνομα του τρέχοντος προφίλ, [PARTCOUNT] για τον συνολικό αριθμό τμημάτων του αρχείου αντιγράφου ασφαλείας, [FILELIST] για τη λίστα των τμημάτων του αρχείου αντιγράφου και [REMOTESTATUS] για ένδειξη σχετικά με το αν η αποστολή σε απομακρυσμένη αποθήκη ολοκληρώθηκε με επιτυχία."
COM_AKEEBA_CONFIG_FEEMAILBODY_LABEL="Σώμα Email"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_DESC="Αφήστε κενό για χρήση της προεπιλογής. Μπορείτε να χρησιμοποιήσετε όλες τις μεταβλητές του Akeeba Backup για ονοματοδοσία αρχείων αντιγράφων, π.χ. [HOST] και [DATE]"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_LABEL="Θέμα Email"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT="Χρήση ζώνης ώρας διακομιστή"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULTGROUP="Προεπιλογές"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT_WORDPRESS="Χρήση ζώνης ώρας WordPress"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DESC="Η ημερομηνία και ώρα αντιγράφου ασφαλείας —όπως καταγράφεται στο όνομα αρχείου, στην προεπιλεγμένη περιγραφή και στα emails— θα εκφράζεται σε αυτή τη ζώνη ώρας. Αυτή η επιλογή επηρεάζει όλες τις προελεύσεις αντιγράφων, δηλαδή όλα τα αντίγραφα ασφαλείας, ανεξάρτητα από τον τρόπο λήψης τους (μέσω του ίδιου του Akeeba Backup, του απομακρυσμένου JSON API κ.λπ.)."
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_LABEL="Ζώνη ώρας αντιγράφου ασφαλείας"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_WP_DESC="Η ημερομηνία και ώρα αντιγράφου ασφαλείας —όπως καταγράφεται στο όνομα αρχείου, στην προεπιλεγμένη περιγραφή και στα emails— θα εκφράζεται σε αυτή τη ζώνη ώρας. Αυτή η επιλογή επηρεάζει όλες τις προελεύσεις αντιγράφων, δηλαδή όλα τα αντίγραφα ασφαλείας, ανεξάρτητα από τον τρόπο λήψης τους (μέσω του ίδιου του Akeeba Backup, του απομακρυσμένου JSON API κ.λπ.).<br>Σημειώστε ότι η επιλογή «Χρήση ζώνης ώρας WordPress» ΔΕΝ θα λειτουργεί σωστά όταν εκτελείτε αντίγραφα ασφαλείας χρησιμοποιώντας α. το παλαιό URL frontend αντιγράφου ή το JSON API του Akeeba Backup αν χρησιμοποιείτε τα παλαιά URLs τελικού σημείου (που χρησιμοποιούσαν index.php ή remote.php αντί για wp-cron.php)· και β. τα σενάρια αντιγράφου CLI (<em>όχι</em> WP-CLI). Σε αυτές τις περιπτώσεις το αντίγραφο εκτελείται τεχνικά εκτός WordPress, οπότε δεν υπάρχει «ζώνη ώρας WordPress»· το αντίγραφο θα χρησιμοποιεί τη ζώνη ώρας GMT. Για αυτό τον λόγο, συνιστάται ανεπιφύλακτα να ορίσετε τη ζώνη ώρας της τοπικής σας περιοχής."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_DESC="Αποστολή email ειδοποίησης μετά τη λήψη αντιγράφου ασφαλείας με τη λειτουργία Front-end Backup (Legacy API) ή JSON API."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_LABEL="Email κατά την ολοκλήρωση αντιγράφου"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_ALWAYS="Πάντα"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_DESC="Πότε να αποστέλλεται το email κατά την ολοκλήρωση αντιγράφου ασφαλείας; «Πάντα» σημαίνει κάθε φορά που ολοκληρώνεται ένα αντίγραφο. «Αποτυχία αποστολής» σημαίνει ότι το email αποστέλλεται μόνο αν το αντίγραφο ολοκληρώθηκε αλλά η αποστολή σε απομακρυσμένη αποθήκη δεν ολοκληρώθηκε με επιτυχία. Εάν το αντίγραφο αποτύχει, δεν είναι δυνατή η αποστολή email μέσω αυτής της λειτουργίας. Ελέγξτε τη σελίδα Προγραμματισμός Αυτόματων Αντιγράφων για πληροφορίες σχετικά με λήψη email για αποτυχημένα αντίγραφα."
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_FAILEDUPLOAD="Αποτυχία αποστολής"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_LABEL="Πότε να αποσταλεί το email"
COM_AKEEBA_CONFIG_FTPTEST_BADPREFIX="ΔΕΝ πρέπει να προσθέτετε το πρόθεμα ftp:// στο όνομα κεντρικού υπολογιστή FTP. Αφαιρέστε το πρόθεμα ftp:// και δοκιμάστε ξανά."
COM_AKEEBA_CONFIG_FTPTEST_NOUPLOAD="Το Akeeba Backup μπόρεσε να συνδεθεί στον διακομιστή σας, αλλά δεν μπόρεσε να αποστείλει ένα αρχείο δοκιμής. Η αποστολή αντιγράφου ασφαλείας ενδέχεται να αποτύχει."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_DESCRIPTION="Συμπληρώνεται αυτόματα όταν ολοκληρώσετε το Βήμα 1 ελέγχου ταυτότητας παραπάνω. Εάν συνδέετε άλλον ιστότοπο στον ίδιο λογαριασμό Google Drive, ΜΗΝ αντιγράψετε το διακριτικό πρόσβασης και ΜΗΝ εκτελέσετε τον έλεγχο ταυτότητας. Αντίθετα, απλώς αντιγράψτε το Διακριτικό ανανέωσης από τον προηγούμενο ιστότοπο σε αυτόν."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_TITLE="Διακριτικό πρόσβασης"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_DESCRIPTION="Ο φάκελος εντός του Google Drive για αποθήκευση των αρχείων αντιγράφου ασφαλείας. Χρησιμοποιείτε κάθετους. Σωστό: some/thing. Λάθος: some\thing. Μία μόνο κάθετος σημαίνει ότι τα αρχεία θα αποθηκευτούν στον ριζικό φάκελο της μονάδας. ΔΙΑΒΑΣΤΕ ΤΗΝ ΤΕΚΜΗΡΙΩΣΗ: Τα μονοπάτια στο Google Drive είναι ασαφή!"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_TITLE="Φάκελος"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTEAMDRIVES_TITLE="Ανανέωση της λίστας μονάδων"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTOKEN_TITLE="Διακριτικό ανανέωσης"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_DESCRIPTION="Ποιο Google Drive θέλετε να αποθηκεύονται τα αρχεία σας. Πρέπει να ολοκληρώσετε τον έλεγχο ταυτότητας πριν συμπληρωθεί αυτή η λίστα. Έχει νόημα μόνο όταν έχετε πρόσβαση σε Google Team Drives (π.χ. χρήστες επαγγελματικού ή εταιρικού πλάνου G Suite). Εάν δεν είστε σίγουροι, χρησιμοποιήστε την επιλογή «Google Drive (personal)»."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_OPT_PERSONAL="Google Drive (personal)"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_TITLE="Μονάδα"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_TITLE="Αποστολή σε φακέλους «Κοινοποιήθηκαν μαζί μου»"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_DESCRIPTION="Όταν είναι ενεργοποιημένο, το Akeeba Backup θα αναζητά φακέλους στη συλλογή «Κοινοποιήθηκαν μαζί μου» πριν αναζητήσει φάκελο με το ίδιο όνομα στη μονάδα σας. Αυτό είναι πολύ πιο αργό και μπορεί να οδηγήσει σε αποστολή στον λάθος φάκελο εάν υπάρχουν πολλοί κοινόχρηστοι φάκελοι με το ίδιο όνομα στον λογαριασμό σας Google Drive."
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_DESCRIPTION="Το κλειδί πρόσβασης Google Storage, το οποίο διατίθεται μέσω του εργαλείου διαχείρισης κλειδιών του Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_TITLE="Κλειδί πρόσβασης"
COM_AKEEBA_CONFIG_GOOGLESTORAGEBUCKET_DESCRIPTION="Το όνομα bucket του Google Storage. Βεβαιωθείτε ότι έχει πληκτρολογηθεί όπως εμφανίζεται στην εφαρμογή web περιηγητή Google Cloud Storage (https://sandbox.google.com/storage)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_DESCRIPTION="Ο φάκελος μέσα στο bucket σας όπου θα αποθηκεύονται τα αρχεία αντιγράφων ασφαλείας. Αφήστε κενό για αποθήκευση αρχείων στον ριζικό κατάλογο του bucket."
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_TITLE="Φάκελος"
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_DESC="Επικολλήστε εδώ το περιεχόμενο του αρχείου διαπιστευτηρίων JSON που δημιούργησε το Google Cloud Console κατά τη ρύθμιση του Λογαριασμού Υπηρεσίας για το λογισμικό αντιγράφων ασφαλείας. Θυμηθείτε να συμπεριλάβετε τις αγκύλες στην αρχή και στο τέλος του κειμένου."
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_TITLE="Περιεχόμενο αρχείου googlestorage.json (διαβάστε την τεκμηρίωση)"
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_DESCRIPTION="Εάν είναι ενεργοποιημένο, το Akeeba Backup θα προσπαθήσει να μετατρέψει το όνομα του bucket σε πεζά γράμματα, δηλ. το MyBucket θα μετατραπεί σε mybucket. Εάν έχετε δημιουργήσει ένα bucket με κεφαλαία γράμματα, π.χ. MyNewBucket, αποεπιλέξτε αυτή την επιλογή και βεβαιωθείτε ότι το όνομα του bucket είναι γραμμένο ακριβώς όπως εμφανίζεται στην εφαρμογή ιστού Google Cloud Storage (https://sandbox.google.com/storage)."
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_TITLE="Όνομα bucket με πεζά γράμματα"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_DESCRIPTION="Το μυστικό κλειδί Google Storage, που διατίθεται μέσω του εργαλείου διαχείρισης κλειδιών Google Cloud Storage (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_TITLE="Μυστικό κλειδί"
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_DESCRIPTION="Εάν είναι ενεργοποιημένο, θα χρησιμοποιηθεί ασφαλής σύνδεση (HTTPS) κατά την αποστολή των αρχείων σας. Αν και αυξάνει την ασφάλεια των μεταφερόμενων δεδομένων, αυξάνει επίσης την πιθανότητα αποτυχίας αντιγράφου ασφαλείας λόγω υπέρβασης χρονικού ορίου."
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_TITLE="Χρήση SSL"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_COLDLINE="Coldline Storage"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_DESCRIPTION="Αλλάξτε την κλάση αποθήκευσης των αποσταλμένων αρχείων αντιγράφων ασφαλείας. Το «Κανένα» σημαίνει ότι τα αρχεία θα αποθηκευτούν με την προεπιλεγμένη κλάση αποθήκευσης που έχει οριστεί στο bucket σας. Σημειώστε ότι επιλογές διαφορετικές από την Standard ενδέχεται να είναι φθηνότερες για αποθήκευση, αλλά μπορεί να επιβαρυνθείτε με πρόσθετες χρεώσεις εάν τα κατεβάσετε ή τα διαγράψετε. Συμβουλευτείτε την Google για πληροφορίες τιμολόγησης."
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NEARLINE="Nearline Storage"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NONE="Κανένα (αφήστε το bucket να αποφασίσει)"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_STANDARD="Standard Storage"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_TITLE="Κλάση αποθήκευσης"
COM_AKEEBA_CONFIG_HEADER_BASIC="Βασική διαμόρφωση"
COM_AKEEBA_CONFIG_HEADER_CONFWIZ="Να διαμορφώσει το Akeeba Backup τον εαυτό του αυτόματα;"
COM_AKEEBA_CONFIG_HEADER_OPTIONALFILTERS="Προαιρετικά φίλτρα"
COM_AKEEBA_CONFIG_HEADER_QUOTA="Διαχείριση ορίων"
COM_AKEEBA_CONFIG_HEADER_TUNING="Λεπτομερής ρύθμιση"
COM_AKEEBA_CONFIG_INSTALLER_DESCRIPTION="Κατά την εκτέλεση πλήρους αντιγράφου ασφαλείας ιστότοπου, το Akeeba Backup ενσωματώνει στο αρχείο τη δέσμη ενεργειών επαναφοράς που ορίζεται εδώ. Αυτό επιτρέπει την επαναφορά του ιστότοπού σας από μηδενική βάση, χωρίς να χρειαστεί να εγκαταστήσετε το CMS ή το Akeeba Backup, ακόμα και όταν ο ιστότοπος ή ο διακομιστής σας καταστραφεί εντελώς."
COM_AKEEBA_CONFIG_INSTALLER_TITLE="Ενσωματωμένη δέσμη ενεργειών επαναφοράς"
COM_AKEEBA_CONFIG_JPS_KEY_DESCRIPTION="Αυτό το κλειδί θα χρησιμοποιηθεί για την κρυπτογράφηση των περιεχομένων του αρχείου σας. Το κλειδί είναι διακριτικό πεζών/κεφαλαίων, δηλ. τα ABC, abc και Abc αποτελούν τρεις διαφορετικούς κωδικούς πρόσβασης. Κρατήστε ένα αντίγραφο του κωδικού πρόσβασης σε ασφαλές μέρος! Εάν τον χάσετε, δεν υπάρχει τρόπος ανάκτησής του."
COM_AKEEBA_CONFIG_JPS_KEY_TITLE="Κλειδί κρυπτογράφησης"
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_DESCRIPTION="Όταν είναι ενεργοποιημένο (προεπιλογή), ο κωδικός πρόσβασής σας επεκτείνεται σε ένα κρυπτογραφικό κλειδί που χρησιμοποιείται σε ολόκληρο το αρχείο. Αυτό είναι γρήγορο, αλλά στη μάλλον απίθανη περίπτωση που ένας εισβολέας με επαρκείς πόρους καταφέρει να αντιστρέψει μηχανικά το κρυπτογραφικό κλειδί από ένα κρυπτογραφημένο μπλοκ στο αρχείο —χωρίς να επιχειρήσει εκ νέου τον κωδικό πρόσβασης— μπορεί να αποκρυπτογραφήσει ολόκληρο το αρχείο αντιγράφου ασφαλείας. Όταν είναι απενεργοποιημένο, ένα διαφορετικό κρυπτογραφικό κλειδί θα παράγεται από τον κωδικό πρόσβασής σας σε κάθε κρυπτογραφημένο μπλοκ, κάτι που είναι ΠΟΛΥ πιο αργό αλλά σας προστατεύει από αυτόν τον τύπο επίθεσης, απαιτώντας από τον εισβολέα να επιχειρήσει εκ βίας τον κωδικό πρόσβασης, κάτι που είναι πολύ πιο αργό."
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_TITLE="Επέκταση κλειδιού σε επίπεδο αρχείου"
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_DESC="Το Akeeba Backup JSON API σας επιτρέπει να λαμβάνετε και να διαχειρίζεστε αντίγραφα ασφαλείας, καθώς και να διαχειρίζεστε τις επιλογές του Akeeba Backup απομακρυσμένα. Πρέπει να ενεργοποιήσετε αυτή την επιλογή αν σκοπεύετε να λαμβάνετε, να κατεβάζετε ή να διαχειρίζεστε αντίγραφα ασφαλείας, για παράδειγμα με το Akeeba Remote CLI, το Akeeba UNiTE και υπηρεσίες προγραμματισμού αντιγράφων ασφαλείας.<br><br><strong>Σημείωση ασφαλείας:</strong> το JSON API ταυτοποιείται αποκλειστικά με το Μυστικό κλειδί. Δεν εμπλέκεται κανένας λογαριασμός χρήστη, επομένως δεν ισχύει κανένα από τα δικαιώματα που ορίζετε στη Διαχείριση χρηστών — ο κάτοχός του αποκτά κάθε μέθοδο του API, χωρίς περιορισμό. Μπορεί να διαβάζει, να δημιουργεί, να κατεβάζει και να διαγράφει αντίγραφα ασφαλείας και να αλλάζει κάθε επιλογή, κάτι που πρακτικά ισοδυναμεί με την κατοχή του κωδικού του διαχειριστή σας. Ενεργοποιήστε το μόνο όταν το χρειάζεστε πραγματικά και χρησιμοποιήστε ένα μακρύ, τυχαίο Μυστικό κλειδί."
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_LABEL="Ενεργοποίηση JSON API (απομακρυσμένο αντίγραφο ασφαλείας)"
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_DESCRIPTION="Όταν ένας φάκελος περιέχει περισσότερα αρχεία ή φακέλους από αυτόν τον αριθμό, θεωρείται «μεγάλος». Ως εκ τούτου, το Akeeba Backup θα προσπαθήσει να τον σαρώσει εκ νέου στο επόμενο βήμα για να αποφύγει υπερβάσεις χρονικού ορίου. Μια πολύ μικρή τιμή θα προκαλέσει σημαντική επιβράδυνση του αντιγράφου ασφαλείας. Αυξήστε —εκτός αν λαμβάνετε σφάλματα υπέρβασης χρονικού ορίου— για επιτάχυνση του αντιγράφου ασφαλείας."
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_TITLE="Κατώφλι μεγάλου φακέλου"
COM_AKEEBA_CONFIG_LARGEFILE_DESCRIPTION="Τα αρχεία μεγαλύτερα από αυτό το κατώφλι θα συμπιεστούν στο δικό τους βήμα για να αποτραπεί η πιθανότητα υπέρβασης χρονικού ορίου. Τιμές μεταξύ 2 και 10 MB λειτουργούν καλύτερα στους περισσότερους διακομιστές."
COM_AKEEBA_CONFIG_LARGEFILE_TITLE="Κατώφλι μεγάλου αρχείου"
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_DESCRIPTION="Πόσοι φάκελοι θα σαρώνονται σε κάθε βήμα. Συνιστώμενη ρύθμιση: 50. Μεγαλύτερες τιμές κάνουν το αντίγραφο ασφαλείας οριακά πιο γρήγορο αλλά πιο πιθανό να υπερβεί το χρονικό όριο."
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_TITLE="Μέγεθος παρτίδας σάρωσης φακέλων"
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_DESCRIPTION="Πόσα αρχεία θα σαρώνονται και συμπιέζονται σε κάθε βήμα. Συνιστώμενη ρύθμιση: 100. Μεγαλύτερες τιμές κάνουν το αντίγραφο ασφαλείας οριακά πιο γρήγορο αλλά πιο πιθανό να υπερβεί το χρονικό όριο ή να εξαντλήσει τη μνήμη."
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_TITLE="Μέγεθος παρτίδας σάρωσης αρχείων"
COM_AKEEBA_CONFIG_LBL_CONFWIZ_AFTER="Αφού ολοκληρωθεί η αυτόματη διαμόρφωση του Akeeba Backup, μπορείτε να δημιουργήσετε ένα αντίγραφο ασφαλείας ή να προσαρμόσετε τη διαμόρφωσή του χειροκίνητα."
COM_AKEEBA_CONFIG_LBL_CONFWIZ_INTRO="Φαίνεται ότι δεν έχετε ακόμα διαμορφώσει το Akeeba Backup. Κάντε κλικ στο κουμπί Οδηγός διαμόρφωσης παρακάτω για να το αφήσετε να διαμορφωθεί μόνο του."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_DESC="Το Legacy Front-end Backup API σάς επιτρέπει να πραγματοποιείτε προγραμματισμένα αντίγραφα ασφαλείας χρησιμοποιώντας εργαλεία πρόσβασης URL όπως το wget και το curl. Πρέπει να ενεργοποιήσετε αυτή την επιλογή εάν σκοπεύετε να δημιουργείτε αντίγραφα ασφαλείας μέσω CRON του παρόχου σας χρησιμοποιώντας wget ή curl, ή εάν σχεδιάζετε να χρησιμοποιήσετε μια υπηρεσία CRON τρίτου μέρους όπως το WebCRON.org. Όπου είναι δυνατόν, συνιστούμε να χρησιμοποιείτε αντί αυτού το εγγενές CLI CRON script ή το JSON API του Akeeba Backup, καθώς αποτελούν πολύ πιο ασφαλείς επιλογές."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_LABEL="Ενεργοποίηση Legacy Front-end Backup API (απομακρυσμένες εργασίες CRON)"
COM_AKEEBA_CONFIG_LOGLEVEL_DEBUG="Όλες οι πληροφορίες και αποσφαλμάτωση"
COM_AKEEBA_CONFIG_LOGLEVEL_DESCRIPTION="Αυτή η επιλογή καθορίζει πόσο αναλυτικό θα είναι το αρχείο καταγραφής αντιγράφου ασφαλείας."
COM_AKEEBA_CONFIG_LOGLEVEL_ERROR="Μόνο σφάλματα"
COM_AKEEBA_CONFIG_LOGLEVEL_INFO="Όλες οι πληροφορίες"
COM_AKEEBA_CONFIG_LOGLEVEL_NONE="Κανένα"
COM_AKEEBA_CONFIG_LOGLEVEL_TITLE="Επίπεδο καταγραφής"
COM_AKEEBA_CONFIG_LOGLEVEL_WARNING="Σφάλματα και προειδοποιήσεις"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_DESCRIPTION="Αυτόματη κατάργηση παλαιών αντιγράφων ασφαλείας βάσει της ημέρας που δημιουργήθηκαν. ΠΡΟΕΙΔΟΠΟΙΗΣΗ: Η ΕΝΕΡΓΟΠΟΙΗΣΗ ΑΥΤΗΣ ΤΗΣ ΕΠΙΛΟΓΗΣ ΘΑ ΠΡΟΚΑΛΕΣΕΙ ΤΗΝ ΑΓΝΟΗΣΗ ΟΛΩΝ ΤΩΝ ΑΛΛΩΝ ΡΥΘΜΙΣΕΩΝ ΟΡΙΩΝ (ΠΛΗΘΟΣ ΚΑΙ ΜΕΓΕΘΟΣ)."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_TITLE="Ενεργοποίηση ορίων μέγιστης ηλικίας αντιγράφων ασφαλείας"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_DESCRIPTION="Τα αντίγραφα ασφαλείας που δημιουργήθηκαν αυτή την ημέρα του μήνα δεν θα διαγραφούν. Αφήστε την προεπιλεγμένη ρύθμιση, 1, για να διατηρούνται πάντα τα αντίγραφα ασφαλείας που δημιουργήθηκαν την 1η ημέρα του μήνα."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_TITLE="Να μην διαγράφονται τα αντίγραφα ασφαλείας που δημιουργήθηκαν αυτή την ημέρα του μήνα"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_DESCRIPTION="Τα αντίγραφα ασφαλείας παλαιότερα από αυτόν τον αριθμό ημερών θα διαγράφονται αυτόματα. Αφήστε την προεπιλεγμένη ρύθμιση, 31, για να διατηρούνται όλα τα αντίγραφα ασφαλείας από τον τελευταίο μήνα."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_TITLE="Μέγιστη ηλικία αντιγράφου ασφαλείας, σε ημέρες"
COM_AKEEBA_CONFIG_MAXEXECTIME_DESCRIPTION="Κάθε βήμα του Akeeba Backup θα διαρκεί <i>το πολύ</i> όσο ορίζεται εδώ. Χρησιμοποιήστε τιμή χαμηλότερη από τον μέγιστο χρόνο εκτέλεσης PHP. Συνήθως, η ρύθμιση αυτή στα 10 δευτερόλεπτα είναι επαρκής, εκτός από πολύ περιοριστικούς παρόχους.<b>Συμβουλή</b>: Επιλέξτε Προσαρμοσμένο και πληκτρολογήστε την επιθυμητή τιμή εάν δεν υπάρχει στη λίστα."
COM_AKEEBA_CONFIG_MAXEXECTIME_TITLE="Μέγιστος χρόνος εκτέλεσης"
COM_AKEEBA_CONFIG_MAXPACKET_DESCRIPTION="Το μέγιστο μέγεθος, σε bytes, κάθε εκτεταμένης εντολής INSERT. Συνιστάται να το διατηρείτε αρκετά χαμηλό ώστε η MySQL να μην εμφανίζει σφάλμα κατά την επαναφορά του αντιγράφου βάσης δεδομένων."
COM_AKEEBA_CONFIG_MAXPACKET_TITLE="Μέγιστο μέγεθος πακέτου για εκτεταμένα INSERT"
COM_AKEEBA_CONFIG_MINEXECTIME_DESCRIPTION="Κάθε βήμα του Akeeba Backup θα διαρκεί <i>τουλάχιστον</i> όσο ορίζεται εδώ. Αυτό απαιτείται για παράκαμψη λύσεων ασφαλείας anti-DoS. Εάν λαμβάνετε σφάλματα 403 Forbidden ή AJAX, αυξήστε αυτή τη ρύθμιση. Η ρύθμιση στο 0 απενεργοποιεί αυτή τη λειτουργία.<br/><br/><b>Συμβουλή</b>: Επιλέξτε Προσαρμοσμένο και πληκτρολογήστε την επιθυμητή τιμή εάν δεν υπάρχει στη λίστα."
COM_AKEEBA_CONFIG_MINEXECTIME_TITLE="Ελάχιστος χρόνος εκτέλεσης"
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_DESCRIPTION="Όταν είναι ενεργοποιημένο, το Akeeba Backup θα προσπαθήσει να αποθηκεύσει αυτές τις προηγμένες οντότητες βάσης δεδομένων MySQL 5. Εάν το αντίγραφο ασφαλείας σας παγώνει κατά το στάδιο αντιγράφου ασφαλείας, ίσως χρειαστεί να απενεργοποιήσετε αυτή την επιλογή."
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_TITLE="Αποθήκευση PROCEDUREs, FUNCTIONs και TRIGGERs"
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TIP="Αφαιρεί τα USING BTREE και USING HASH από τους ορισμούς ευρετηρίων πινάκων στα αρχεία dump. Αυτό απαιτείται για επαναφορά σε διακομιστές που έχουν απενεργοποιήσει οποιαδήποτε μηχανή ευρετηριοποίησης (π.χ. σε νεότερες εκδόσεις XAMPP). ΠΡΟΕΙΔΟΠΟΙΗΣΗ! ΑΥΤΟ ΜΠΟΡΕΙ ΝΑ ΠΡΟΚΑΛΕΣΕΙ ΠΡΟΒΛΗΜΑΤΑ ΚΑΤΑ ΤΗΝ ΕΠΑΝΑΦΟΡΑ ΣΕ ΟΡΙΣΜΕΝΟΥΣ ΔΙΑΚΟΜΙΣΤΕΣ."
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TITLE="Παράλειψη μηχανής ευρετηρίου"
COM_AKEEBA_CONFIG_NODEPENDENCIES_DESCRIPTION="Όταν είναι ενεργοποιημένο, το Akeeba Backup δεν θα παρακολουθεί εξαρτήσεις μεταξύ πινάκων και προβολών. Χρησιμοποιήστε αυτό μόνο όταν έχετε εκατοντάδες πίνακες βάσης δεδομένων και δεν χρησιμοποιείτε MySQL VIEWs, FUNCTIONs, PROCEDUREs, TRIGGERs ή πίνακες που χρησιμοποιούν τις μηχανές TEMPORARY, MEMORY, MERGE ή FEDERATED (που χρησιμοποιούνται εξαιρετικά σπάνια)."
COM_AKEEBA_CONFIG_NODEPENDENCIES_TITLE="Χωρίς παρακολούθηση εξαρτήσεων"
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_DESCRIPTION="Συνολικός αριθμός απαρχαιωμένων εγγραφών (αντίγραφα ασφαλείας των οποίων τα αρχεία έχουν διαγραφεί) που θα διατηρούνται στη σελίδα Διαχείριση αντιγράφων ασφαλείας. Ορίστε σε 0 για χωρίς όριο."
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_TITLE="Απαρχαιωμένες εγγραφές προς διατήρηση"
COM_AKEEBA_CONFIG_LOGFILES_TITLE="Διαγραφή απαρχαιωμένων αρχείων καταγραφής"
COM_AKEEBA_CONFIG_LOGFILES_DESCRIPTION="Αυτόματη διαγραφή των αρχείων καταγραφής επιτυχημένων εγγραφών αντιγράφων ασφαλείας. Το αρχείο καταγραφής της τελευταίας εγγραφής αντιγράφου ασφαλείας συμμετέχει στους υπολογισμούς αλλά δεν διαγράφεται ποτέ. Εάν το προφίλ αντιγράφου ασφαλείας σας διαθέτει μηχανή μετά-επεξεργασίας διαφορετική από Κανένα ή Αποστολή μέσω Email, μόνο οι εγγραφές με κατάσταση Απομακρυσμένου αντιγράφου ασφαλείας συμμετέχουν σε αυτή τη ρύθμιση ορίου αρχείων καταγραφής. Εάν το προφίλ αντιγράφου ασφαλείας σας έχει μηχανή μετά-επεξεργασίας Κανένα ή Αποστολή μέσω Email, μόνο οι εγγραφές με κατάσταση ΟΚ ή Απομακρυσμένου αντιγράφου ασφαλείας συμμετέχουν σε αυτή τη ρύθμιση. Αυτή η λειτουργία εκτελείται μετά το όριο απαρχαιωμένων εγγραφών. Το όριο απαρχαιωμένων εγγραφών μπορεί επίσης να αφαιρέσει παλαιά αρχεία καταγραφής."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_TITLE="Τύπος ορίου απαρχαιωμένων αρχείων καταγραφής"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DESCRIPTION="Επιλέξτε τη μέθοδο που χρησιμοποιείται για τον προσδιορισμό των παλαιών αρχείων καταγραφής προς κατάργηση."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_SIZE="Μέγιστο μέγεθος"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_COUNT="Πλήθος"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DAYS="Μέγιστη ηλικία"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_TITLE="Πλήθος αρχείων καταγραφής"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_DESCRIPTION="Πόσα αρχεία καταγραφής θα διατηρούνται. Το αρχείο καταγραφής του τελευταίου αντιγράφου ασφαλείας που δημιουργήθηκε μπορεί να συμμετέχει στο πλήθος αλλά δεν θα διαγραφεί ποτέ. Μόνο τα αρχεία καταγραφής επιτυχημένων εγγραφών αντιγράφων ασφαλείας θα λαμβάνονται υπόψη για κατάργηση."
COM_AKEEBA_CONFIG_LOGFILES_SIZE_TITLE="Μέγεθος αρχείων καταγραφής (Megabytes)"
COM_AKEEBA_CONFIG_LOGFILES_SIZE_DESCRIPTION="Το μέγιστο συνολικό μέγεθος αρχείων καταγραφής που θα διατηρούνται. Το αρχείο καταγραφής του τελευταίου αντιγράφου ασφαλείας που δημιουργήθηκε μπορεί να συμμετέχει στον υπολογισμό αλλά δεν θα διαγραφεί ποτέ. Μόνο τα αρχεία καταγραφής επιτυχημένων εγγραφών αντιγράφων ασφαλείας θα λαμβάνονται υπόψη για κατάργηση."
COM_AKEEBA_CONFIG_LOGFILES_DAYS_TITLE="Παλαιότητα αρχείων καταγραφής (ημέρες)"
COM_AKEEBA_CONFIG_LOGFILES_DAYS_DESCRIPTION="Η μέγιστη παλαιότητα σε ημέρες των αρχείων καταγραφής που θα διατηρούνται. Το αρχείο καταγραφής του τελευταίου αντιγράφου ασφαλείας που δημιουργήθηκε δεν θα διαγράφεται ποτέ. Για κατάργηση λαμβάνονται υπόψη μόνο τα αρχεία καταγραφής επιτυχημένων εγγραφών αντιγράφων ασφαλείας."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_DESCRIPTION="Συμπληρώνεται αυτόματα όταν ολοκληρώσετε το Βήμα 1 του ελέγχου ταυτότητας παραπάνω. ΜΗΝ μοιράζεστε το ίδιο διακριτικό σε πολλούς ιστότοπους. Αντ' αυτού, πραγματοποιήστε έλεγχο ταυτότητας για κάθε ιστότοπο ξεχωριστά."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_TITLE="Διακριτικό πρόσβασης"
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_DESCRIPTION="Ο φάκελος εντός του χώρου αποθήκευσης Microsoft OneDrive στον οποίο θα αποθηκεύονται τα αρχεία αντιγράφων ασφαλείας. Χρησιμοποιήστε κάθετο (/) και όχι ανάστροφη κάθετο (\) και πάντα τοποθετείτε μια κάθετο στην αρχή. Σωστό: /κάποιο/μονοπάτι. Λάθος: κάποιο\μονοπάτι. Μία μόνο κάθετος σημαίνει ότι τα αρχεία αντιγράφων θα αποθηκεύονται στον ριζικό φάκελο του χώρου αποθήκευσης."
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_TITLE="Φάκελος"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_DESCRIPTION="Επιλέξτε σε ποιον χώρο αποθήκευσης (OneDrive Personal, OneDrive for Business ή SharePoint) στον οποίο έχει πρόσβαση ο λογαριασμός σας θα αποθηκεύονται τα αντίγραφα ασφαλείας. Πρέπει να ολοκληρώσετε τον έλεγχο ταυτότητας πριν συμπληρωθεί αυτή η λίστα. Έχει νόημα μόνο όταν έχετε πρόσβαση σε περισσότερους από έναν χώρους αποθήκευσης OneDrive (π.χ. ο λογαριασμός Microsoft σας ανήκει στη συνδρομή ενός οργανισμού). Εάν δεν είστε σίγουροι, χρησιμοποιήστε την επιλογή «Προεπιλεγμένος χώρος αποθήκευσης» που χρησιμοποιεί τον προσωπικό σας προεπιλεγμένο χώρο αποθήκευσης — συνήθως αντιστοιχεί στην πρώτη επιλογή «Χώρος αποθήκευσης (OneDrive Personal)» που εμφανίζεται παρακάτω."
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_OPT_PERSONAL="Προεπιλεγμένος χώρος αποθήκευσης"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_TITLE="Χώρος αποθήκευσης"
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_DESCRIPTION="Συμπληρώνεται αυτόματα όταν ολοκληρώσετε το Βήμα 1 του ελέγχου ταυτότητας παραπάνω. ΜΗΝ μοιράζεστε το ίδιο διακριτικό σε πολλούς ιστότοπους. Αντ' αυτού, πραγματοποιήστε έλεγχο ταυτότητας για κάθε ιστότοπο ξεχωριστά."
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_TITLE="Διακριτικό ανανέωσης"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_DESCRIPTION="Αυτό το φίλτρο εφαρμόζεται μόνο εάν προσπαθείτε να δημιουργήσετε αντίγραφο ασφαλείας μιας εγκατάστασης Joomla!, π.χ. ενός ιστότοπου Joomla! σε υποφάκελο / υποτομέα του ιστότοπού σας. Στο Joomla! 3.9 και νεότερα, οι ενέργειες χρηστών καταγράφονται στη βάση δεδομένων, δημιουργώντας έναν πίνακα με εκατομμύρια γραμμές που επιβραδύνουν το αντίγραφο ασφαλείας. Επιλέξτε αυτήν την επιλογή για να εξαιρέσετε τέτοια δεδομένα."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_TITLE="Αρχείο καταγραφής ενεργειών χρηστών Joomla!"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_DESCRIPTION="Όταν είναι ενεργοποιημένο, θα δημιουργείται αντίγραφο ασφαλείας μόνο για αρχεία που τροποποιήθηκαν μετά από μια συγκεκριμένη ημερομηνία και ώρα."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_TITLE="Φίλτρο ημερομηνίας"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_DESCRIPTION="Το Akeeba Backup θα δημιουργεί αντίγραφο ασφαλείας για αρχεία που τροποποιήθηκαν μετά από αυτή την ημερομηνία και ώρα. Η μορφή είναι ΕΕΕΕ-ΜΜ-ΗΗ ωω:λλ:δδ. Όλες οι ημερομηνίες και ώρες εκφράζονται στην ζώνη ώρας του διακομιστή σας."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_TITLE="Αντίγραφο ασφαλείας αρχείων που τροποποιήθηκαν μετά από"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_DESCRIPTION="Αυτόματη εξαίρεση αρχείων καταγραφής σφαλμάτων, π.χ. <code>error_log</code>, ανεξάρτητα από τη θέση τους στον ιστότοπο για τον οποίο δημιουργείται αντίγραφο ασφαλείας. Αυτά τα αρχεία αλλάζουν μέγεθος κατά τη διάρκεια του αντιγράφου ασφαλείας, κάτι που μπορεί να οδηγήσει σε κατεστραμμένα αρχεία αντιγράφων."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_TITLE="Εξαίρεση αρχείων καταγραφής σφαλμάτων"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_DESCRIPTION="Όταν είναι ενεργοποιημένο, το Akeeba Backup θα εξαιρεί αυτόματα τους πιο κοινούς φακέλους αποθήκευσης στατιστικών πρόσβασης που είναι ειδικοί για τον διακομιστή. Αυτοί οι φάκελοι είναι μόνο για ανάγνωση από τον χρήστη του ιστότοπού σας, γεγονός που προκαλεί προβλήματα κατά την επαναφορά εάν συμπεριληφθούν στο αντίγραφο ασφαλείας."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_TITLE="Εξαίρεση φακέλων στατιστικών ειδικών για τον διακομιστή"
COM_AKEEBA_CONFIG_OUTDIR_DESCRIPTION="Αυτός είναι ο φάκελος στον διακομιστή σας όπου το Akeeba Backup θα αποθηκεύει τα αρχεία αντιγράφων ασφαλείας και το αρχείο καταγραφής. Μπορείτε να χρησιμοποιήσετε τις παρακάτω μακροεντολές:<ul><li><b>[DEFAULT_OUTPUT]</b> Ο προεπιλεγμένος φάκελος εξόδου</li><li><b>[SITEROOT]</b> Ο ριζικός φάκελος του ιστότοπού σας</li><li><b>[ROOTPARENT]</b> Ένας φάκελος πάνω από τον ριζικό φάκελο του ιστότοπού σας</li></ul>"
COM_AKEEBA_CONFIG_OUTDIR_TITLE="Φάκελος εξόδου"
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_DESCRIPTION="ΑΥΤΟ ΔΕΝ ΕΙΝΑΙ ΤΟ ΟΝΟΜΑ ΤΟΥ ΚΟΝΤΕΙΝΕΡ ΑΠΟΘΗΚΕΥΣΗΣ! Μεταβείτε στον διαχειριστή cloud OVH, Διακομιστές, αναπτύξτε τον διακομιστή σας, κάντε κλικ στο Αποθήκευση. Θα δείτε εκεί το URL κοντέινερ πάνω από τη λίστα των αρχείων σας. Αντιγράψτε το εδώ."
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_TITLE="URL κοντέινερ"
COM_AKEEBA_CONFIG_OVH_DIRECTORY_DESCRIPTION="Ο φάκελος εντός του κοντέινερ αντικειμένων OVH στον οποίο θα αποθηκεύονται τα αρχεία αντιγράφων ασφαλείας. Για αποθήκευση στον ριζικό φάκελο του κοντέινερ, αφήστε το κενό."
COM_AKEEBA_CONFIG_OVH_DIRECTORY_TITLE="Φάκελος"
COM_AKEEBA_CONFIG_OVH_PASSWORD_DESCRIPTION="ΑΥΤΟ ΔΕΝ ΕΙΝΑΙ Ο ΚΩΔΙΚΟΣ ΠΡΌΣΒΑΣΗΣ ΣΥΝΔΕΣΗΣ ΣΑΣ ΣΤΗΝ OVH! Δημιουργήστε έναν χρήστη από τον διαχειριστή cloud OVH, Διακομιστές, αναπτύξτε τον διακομιστή σας, κάντε κλικ στο OpenStack, κάντε κλικ στο Προσθήκη χρήστη. Αντιγράψτε τον κωδικό πρόσβασης του δημιουργηθέντος χρήστη εδώ."
COM_AKEEBA_CONFIG_OVH_PASSWORD_TITLE="Κωδικός πρόσβασης OpenStack"
COM_AKEEBA_CONFIG_OVH_PROJECTID_DESCRIPTION="Το αναγνωριστικό έργου του cloud διακομιστή OVH σας. Στον διαχειριστή cloud OVH αναπτύξτε τον Διακομιστή σας και κάντε κλικ στον σύνδεσμο Αποθήκευση. Στην κύρια περιοχή της σελίδας εμφανίζεται το όνομα του διακομιστή και ακριβώς από κάτω υπάρχει μια αλφαριθμητική συμβολοσειρά 32 χαρακτήρων, όπως a0b1c2d3e4f56789abcdef0123456789. Αυτό είναι το Αναγνωριστικό έργου που πρέπει να εισαγάγετε εδώ."
COM_AKEEBA_CONFIG_OVH_PROJECTID_TITLE="Αναγνωριστικό έργου"
COM_AKEEBA_CONFIG_OVH_USERNAME_DESCRIPTION="ΑΥΤΟ ΔΕΝ ΕΙΝΑΙ ΤΟ ΟΝΟΜΑ ΧΡΗΣΤΗ ΣΥΝΔΕΣΗΣ ΣΑΣ ΣΤΗΝ OVH! Δημιουργήστε έναν χρήστη από τον διαχειριστή cloud OVH, Διακομιστές, αναπτύξτε τον διακομιστή σας, κάντε κλικ στο OpenStack, κάντε κλικ στο Προσθήκη χρήστη. Αντιγράψτε το αναγνωριστικό του δημιουργηθέντος χρήστη εδώ."
COM_AKEEBA_CONFIG_OVH_USERNAME_TITLE="Όνομα χρήστη OpenStack"
COM_AKEEBA_CONFIG_PARTSIZE_DESCRIPTION="Το Akeeba Backup μπορεί να δημιουργεί τμηματικά (πολλαπλών μερών) αρχεία αντιγράφων ασφαλείας προκειμένου να παρακάμπτει περιορισμούς μεγέθους υπό διάφορες περιστάσεις. Αυτή η επιλογή ορίζει το μέγιστο μέγεθος κάθε τμήματος αρχείου. Εάν το μειώσετε σε 0, η δυνατότητα πολλαπλών τμημάτων απενεργοποιείται.</br><b>Σημαντικό:</b>Εάν χρησιμοποιείτε μηχανή επεξεργασίας δεδομένων που μεταφέρει αρχεία αντιγράφων σε απομακρυσμένη τοποθεσία (π.χ. αποθήκη cloud) χρησιμοποιήστε μια ρύθμιση περίπου 1 έως 5 Mb για βέλτιστα αποτελέσματα."
COM_AKEEBA_CONFIG_PARTSIZE_TITLE="Μέγεθος τμήματος για τμηματικά αρχεία"
COM_AKEEBA_CONFIG_PERMISSIONS_0600="0600 – Αυστηρή ασφάλεια, ενδέχεται να προκαλέσει προβλήματα σε διακομιστές χαμηλής απόδοσης"
COM_AKEEBA_CONFIG_PERMISSIONS_0644="0644 – Μέτρια ασφάλεια, για χρήση σε διακομιστές ενός μόνο ιστότοπου"
COM_AKEEBA_CONFIG_PERMISSIONS_0666="0666 – Χαλαρή ασφάλεια, μέγιστη συμβατότητα με εμπορικούς διακομιστές"
COM_AKEEBA_CONFIG_PERMISSIONS_DESCRIPTION="Ρυθμίστε τα δικαιώματα αρχείων για τα αρχεία αντιγράφων ασφαλείας. Ισχύει μόνο σε Linux, macOS, BSD και άλλους διακομιστές τύπου UNIX (ΟΧΙ Windows). Εάν δεν είστε σίγουροι, αφήστε ως 0666. Η αλλαγή αυτής της ρύθμισης ενδέχεται να καταστήσει αδύνατη τη λήψη ή/και τη διαγραφή αρχείων αντιγράφων ασφαλείας μέσω FTP και SFTP. Εάν ο διακομιστής σας χρησιμοποιεί PHP-FPM ή εκτελεί PHP κάτω από τον ίδιο χρήστη με τον λογαριασμό συστήματος του ιστότοπού σας, χρησιμοποιήστε 0600 για βέλτιστη ασφάλεια."
COM_AKEEBA_CONFIG_PERMISSIONS_TITLE="Δικαιώματα αρχείου αντιγράφου"
COM_AKEEBA_CONFIG_PGDUMP_PATH_DESCRIPTION="Η απόλυτη διαδρομή συστήματος αρχείων προς το εργαλείο γραμμής εντολών pg_dump στον διακομιστή σας. Αν αφεθεί κενή, το Akeeba Backup θα προσπαθήσει να την εντοπίσει αυτόματα."
COM_AKEEBA_CONFIG_PGDUMP_PATH_TITLE="Διαδρομή προς το pg_dump"
COM_AKEEBA_CONFIG_PLATFORM="Παρακάμψεις ιστότοπου"
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_DESCRIPTION="Εάν είναι ενεργοποιημένο, το Akeeba Backup θα προσπαθεί να συνδεθεί στον διακομιστή FTP χρησιμοποιώντας κρυπτογραφημένη σύνδεση SSL. <strong>Αυτό δεν είναι το ίδιο με SFTP, SCP ή «Ασφαλές FTP»!</strong> Σημειώστε ότι εάν ο διακομιστής σας δεν υποστηρίζει αυτή τη μέθοδο θα λαμβάνετε σφάλματα σύνδεσης."
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_TITLE="Χρήση FTP μέσω SSL (FTPS)"
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_DESCRIPTION="Το όνομα κεντρικού υπολογιστή του διακομιστή FTP, χωρίς το πρωτόκολλο. Αυτό σημαίνει ότι το <tt>ftp://example.com</tt> είναι <b>μη έγκυρο</b> και το <tt>example.com</tt> είναι έγκυρο. Αυτή η μηχανή υποστηρίζει μόνο διακομιστές FTP και FTPS. <u>Δεν</u> υποστηρίζει SFTP, SCP και άλλες παραλλαγές SSH."
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_TITLE="Όνομα κεντρικού υπολογιστή"
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_DESCRIPTION="Η απόλυτη <b>FTP</b> διαδρομή προς τον φάκελο στον οποίο θα αποστέλλονται τα αρχεία. Εάν δεν είστε σίγουροι, συνδεθείτε στον διακομιστή σας με το FileZilla, μεταβείτε στον επιθυμητό φάκελο και αντιγράψτε τη διαδρομή που εμφανίζεται στο δεξί παράθυρο πάνω από τη λίστα φακέλων. Συνήθως είναι κάτι σύντομο, όπως <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_TITLE="Αρχικός φάκελος"
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_DESCRIPTION="Η σχετική διαδρομή προς τον αρχικό φάκελο, θα δημιουργηθεί εάν δεν υπάρχει. Αφήστε κενό για αποστολή αρχείων αντιγράφων απευθείας στον αρχικό φάκελο. Μπορείτε να χρησιμοποιήσετε τις παρακάτω μακροεντολές:<ul><li><b>[HOST]</b> Το όνομα κεντρικού υπολογιστή. ΠΡΟΕΙΔΟΠΟΙΗΣΗ! Αυτή η ετικέτα δεν λειτουργεί σε λειτουργία CRON.</li><li><b>[DATE]</b> Τρέχουσα ημερομηνία</li><li><b>[TIME]</b> Τρέχουσα ώρα</li></ul>Περισσότερες είναι διαθέσιμες· συμβουλευτείτε την τεκμηρίωση."
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_TITLE="Υποφάκελος"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_DESCRIPTION="Χρήση παθητικής λειτουργίας FTP κατά τη μεταφορά δεδομένων. Είναι ενεργοποιημένη από προεπιλογή καθώς είναι η μόνη μέθοδος που λειτουργεί μέσα από τα τείχη προστασίας που εγκαθίστανται συνήθως σε διακομιστές ιστού. Μην την απενεργοποιείτε εκτός εάν είστε βέβαιοι ότι ο διακομιστής ιστού σας δεν βρίσκεται πίσω από τείχος προστασίας και ότι ο διακομιστής FTP σας απαιτεί αυστηρά μεταφορές αρχείων σε ενεργητική λειτουργία."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_TITLE="Χρήση παθητικής λειτουργίας"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_DESCRIPTION="Ο κωδικός πρόσβασης του διακομιστή FTP. Συνήθως κάνει διάκριση πεζών-κεφαλαίων. Εάν δεν είστε σίγουροι, επικοινωνήστε με τον διαχειριστή δικτύου σας."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_TITLE="Κωδικός πρόσβασης"
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_DESCRIPTION="Η θύρα του διακομιστή FTP. Η πιο συνηθισμένη ρύθμιση είναι 21. Εάν δεν είστε σίγουροι, επικοινωνήστε με τον διαχειριστή δικτύου σας."
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_TITLE="Θύρα"
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_DESCRIPTION="Χρησιμοποιήστε αυτό το κουμπί για να δοκιμάσετε τη σύνδεση FTP και να δείτε τα σφάλματα σύνδεσης σε περίπτωση αποτυχίας."
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_TITLE="Δοκιμή σύνδεσης FTP"
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_DESCRIPTION="Το όνομα χρήστη του διακομιστή FTP. Συνήθως κάνει διάκριση πεζών-κεφαλαίων. Εάν δεν είστε σίγουροι, επικοινωνήστε με τον διαχειριστή δικτύου σας."
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_TITLE="Όνομα χρήστη"
COM_AKEEBA_CONFIG_POSTPROCPARTS_DESCRIPTION="Όταν είναι ενεργοποιημένο, το Akeeba Backup θα εκτελεί τη μηχανή μετά-επεξεργασίας για κάθε τμήμα μόλις αυτό ολοκληρωθεί. Όταν είναι απενεργοποιημένο, το Akeeba Backup θα εκτελεί τη μετά-επεξεργασία για όλα τα τμήματα στο τέλος της διαδικασίας δημιουργίας αντιγράφου ασφαλείας."
COM_AKEEBA_CONFIG_POSTPROCPARTS_TITLE="Άμεση επεξεργασία κάθε τμήματος"
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_DESCRIPTION="Το όνομα κεντρικού υπολογιστή του διακομιστή SFTP, χωρίς το πρωτόκολλο. Αυτό σημαίνει ότι το <tt>sftp://example.com</tt> ή το <tt>ssh://example.com</tt> είναι <b>μη έγκυρα</b> και ΔΕΝ πρέπει να χρησιμοποιούνται, αλλά το <tt>example.com</tt> είναι έγκυρο και ΠΡΕΠΕΙ να χρησιμοποιηθεί. Αυτή η μηχανή υποστηρίζει μόνο διακομιστές SFTP (SSH). <u>Δεν</u> υποστηρίζει FTP, FTPS ή οποιαδήποτε άλλη παραλλαγή FTP. Απαιτεί την εγκατεστημένη και ενεργοποιημένη επέκταση PHP SSH2."
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_TITLE="Όνομα κεντρικού υπολογιστή"
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_DESCRIPTION="Η απόλυτη <b>SFTP</b> διαδρομή (συνήθως ίδια με τη διαδρομή του συστήματος αρχείων) προς τον φάκελο στον οποίο θα αποστέλλονται τα αρχεία. Εάν δεν είστε σίγουροι, συνδεθείτε στον διακομιστή σας με το FileZilla, μεταβείτε στον επιθυμητό φάκελο και αντιγράψτε τη διαδρομή που εμφανίζεται στο δεξί παράθυρο πάνω από τη λίστα φακέλων. Συνήθως είναι κάτι μεγαλύτερο, όπως <tt>/home/myuser/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_TITLE="Αρχικός φάκελος"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_DESCRIPTION="Ο κωδικός πρόσβασης του διακομιστή SFTP. Συνήθως κάνει διάκριση πεζών-κεφαλαίων. Εάν δεν είστε σίγουροι, επικοινωνήστε με τον διαχειριστή δικτύου σας."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_TITLE="Κωδικός πρόσβασης"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_DESCRIPTION="Η θύρα του διακομιστή SFTP. Η πιο συνηθισμένη ρύθμιση είναι 22. Εάν δεν είστε σίγουροι, επικοινωνήστε με τον διαχειριστή δικτύου σας."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_TITLE="Θύρα"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_DESCRIPTION="ΔΙΑΒΑΣΤΕ ΤΗΝ ΤΕΚΜΗΡΙΩΣΗ ΠΡΙΝ ΤΗ ΧΡΗΣΗ. Η απόλυτη διαδρομή συστήματος αρχείων σε ένα ιδιωτικό αρχείο κλειδιού RSA / DSA που χρησιμοποιείται για σύνδεση στον απομακρυσμένο διακομιστή. Εάν είναι κρυπτογραφημένο, εισαγάγετε τη φράση πρόσβασης στο πεδίο κωδικού πρόσβασης παραπάνω. Εάν δεν γνωρίζετε τι είναι αυτό ή εάν σκέφτεστε να ζητήσετε υποστήριξη για αυτό, αφήστε το κενό και μην μας ρωτάτε γι' αυτό."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_TITLE="Αρχείο ιδιωτικού κλειδιού (για προχωρημένους)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_DESCRIPTION="ΔΙΑΒΑΣΤΕ ΤΗΝ ΤΕΚΜΗΡΙΩΣΗ ΠΡΙΝ ΤΗ ΧΡΗΣΗ. Η απόλυτη διαδρομή συστήματος αρχείων σε ένα δημόσιο αρχείο κλειδιού RSA / DSA που χρησιμοποιείται για σύνδεση στον απομακρυσμένο διακομιστή. Εάν δεν γνωρίζετε τι είναι αυτό ή εάν σκέφτεστε να ζητήσετε υποστήριξη για αυτό, αφήστε το κενό και μην μας ρωτάτε γι' αυτό."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_TITLE="Αρχείο δημόσιου κλειδιού (για προχωρημένους)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_DESCRIPTION="Χρησιμοποιήστε αυτό το κουμπί για να δοκιμάσετε τη σύνδεση SFTP και να δείτε τα σφάλματα σύνδεσης σε περίπτωση αποτυχίας."
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_TITLE="Δοκιμή σύνδεσης SFTP"
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_DESCRIPTION="Το όνομα χρήστη του διακομιστή SFTP. Συνήθως κάνει διάκριση πεζών-κεφαλαίων. Εάν δεν είστε σίγουροι, επικοινωνήστε με τον διαχειριστή δικτύου σας."
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_TITLE="Όνομα χρήστη"
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_DESCRIPTION="Διακόπτει αμέσως τη διαδικασία δημιουργίας αντιγράφου ασφαλείας, σημειώνοντάς την ως αποτυχημένη, εάν προκύψει σφάλμα αποστολής. <strong>Αυτή η επιλογή μπορεί να είναι παραπλανητική και επικίνδυνη.</strong> Ενδέχεται να έχετε ένα πλήρες, έγκυρο αντίγραφο ασφαλείας που απλώς απέτυχε να αποσταλεί εν όλω ή εν μέρει. Η ενεργοποίηση αυτής της επιλογής θα αφαιρέσει τα υπόλοιπα αρχεία αντιγράφων ασφαλείας από τον διακομιστή σας και θα αφήσει πίσω τυχόν αρχεία που έχουν (μερικώς) αποσταλεί στην απομακρυσμένη αποθήκη. Με άλλα λόγια, δεν σας μένει κανένα λειτουργικό αντίγραφο ασφαλείας. Υπάρχουν ελάχιστες περιπτώσεις χρήσης όπου αυτό έχει περισσότερο νόημα από την προεπιλεγμένη συμπεριφορά, η οποία σάς επιτρέπει να συνεχίσετε την αποστολή αρχείων αντιγράφου ασφαλείας μέσω της σελίδας Διαχείριση αντιγράφων ασφαλείας. Ως εκ τούτου, συνιστάται ανεπιφύλακτα να ενεργοποιείται αυτή η επιλογή μόνο από έμπειρους χρήστες που κατανοούν πλήρως τις συνέπειές της."
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_TITLE="Αποτυχία αντιγράφου ασφαλείας σε αποτυχία αποστολής"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_DESCRIPTION="Η διεύθυνση email στην οποία θα αποστέλλονται τα αρχεία αντιγράφων ασφαλείας"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_TITLE="Διεύθυνση email"
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_DESCRIPTION="Το θέμα του email (προαιρετικό). Αυτή η επιλογή υπάρχει κυρίως για να σας βοηθά να διακρίνετε τα αντίγραφα ασφαλείας από πολλαπλούς ιστότοπους."
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_TITLE="Θέμα email"
COM_AKEEBA_CONFIG_PROCENGINE_DESCRIPTION="Οι μηχανές μετά-επεξεργασίας επιτρέπουν στο Akeeba Backup να μεταφέρει ολοκληρωμένα τμήματα αρχείων αντιγράφου ασφαλείας σε άλλους διακομιστές και παρόχους απομακρυσμένης αποθήκευσης."
COM_AKEEBA_CONFIG_PROCENGINE_TITLE="Μηχανή μετά-επεξεργασίας"
COM_AKEEBA_CONFIG_PROXY_HOST_DESC="Εάν ο ιστότοπός σας χρειάζεται να συνδεθεί μέσω διακομιστή μεσολάβησης (proxy) για να επικοινωνήσει με τον έξω κόσμο (εξερχόμενο proxy), εισάγετε εδώ το όνομα κεντρικού υπολογιστή ή τη διεύθυνση IP του proxy. Αφήστε κενό για να μην χρησιμοποιηθεί proxy."
COM_AKEEBA_CONFIG_PROXY_HOST_LABEL="Όνομα κεντρικού υπολογιστή proxy / Διεύθυνση IP"
COM_AKEEBA_CONFIG_PROXY_PASS_DESC="Εάν ο διακομιστής μεσολάβησής σας απαιτεί έλεγχο ταυτότητας, εισάγετε εδώ τον κωδικό πρόσβασης ελέγχου ταυτότητας proxy. Μην ξεχάσετε να εισάγετε ένα μη κενό όνομα χρήστη στην επιλογή παραπάνω."
COM_AKEEBA_CONFIG_PROXY_PASS_LABEL="Κωδικός πρόσβασης proxy"
COM_AKEEBA_CONFIG_PROXY_PORT_DESC="Εισάγετε τη θύρα TCP/IP στην οποία ακούει ο διακομιστής μεσολάβησης. Συνήθως αυτή είναι η 8080 ή η 3128. Εάν δεν είστε σίγουροι, ρωτήστε τον πάροχο φιλοξενίας ή τον διαχειριστή δικτύου."
COM_AKEEBA_CONFIG_PROXY_PORT_LABEL="Θύρα proxy"
COM_AKEEBA_CONFIG_PROXY_USER_DESC="Εάν ο διακομιστής μεσολάβησής σας απαιτεί έλεγχο ταυτότητας, εισάγετε εδώ το όνομα χρήστη ελέγχου ταυτότητας proxy. Αφήστε κενό για να χρησιμοποιήσετε ένα proxy που δεν απαιτεί έλεγχο ταυτότητας."
COM_AKEEBA_CONFIG_PROXY_USER_LABEL="Όνομα χρήστη proxy"
COM_AKEEBA_CONFIG_PUSH_APIKEY_DESC="Μεταβείτε στο https://www.pushbullet.com/account και αντιγράψτε το Διακριτικό πρόσβασης (Access Token) από εκείνη τη σελίδα στο πλαίσιο κειμένου εδώ. Χρησιμοποιείται για αποστολή μηνυμάτων push στον λογαριασμό σας. Μπορείτε να επικολλήσετε πολλά διακριτικά διαχωρισμένα με κόμματα. Σημείωση: το Διακριτικό πρόσβασης είναι ορατό σε όλους όσοι έχουν πρόσβαση σε αυτή τη σελίδα διαμόρφωσης."
COM_AKEEBA_CONFIG_PUSH_APIKEY_LABEL="Διακριτικό πρόσβασης Pushbullet"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_DESC="Θα πρέπει το Akeeba Backup να σας αποστέλλει ειδοποιήσεις και, εάν ναι, πώς;"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_LABEL="Προωθητικές ειδοποιήσεις"
COM_AKEEBA_CONFIG_QUICKICON_DESC="Όταν είναι ενεργοποιημένο, το Akeeba Backup θα εμφανίζει ένα εικονίδιο αντιγράφου ασφαλείας με ένα κλικ στην κορυφή της σελίδας Πίνακα ελέγχου. Κάνοντας κλικ σε αυτό θα ενεργοποιήσετε αυτό το προφίλ και θα εκκινήσετε αντίγραφο ασφαλείας χωρίς να χρειαστεί καμία περαιτέρω ενέργεια από εσάς."
COM_AKEEBA_CONFIG_QUICKICON_LABEL="Εικονίδιο αντιγράφου ασφαλείας με ένα κλικ"
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_DESCRIPTION="Όταν είναι ενεργοποιημένο, το αντίγραφο ασφαλείας που βρίσκεται σε εξέλιξη συμμετέχει στα όρια απομακρυσμένων αρχείων. Αυτό μπορεί να είναι προβληματικό· εάν το αντίγραφο ασφαλείας έχει μεταφορτωθεί εν μέρει στην απομακρυσμένη αποθήκη και οι ρυθμίσεις ορίου είναι τέτοιες ώστε να διατηρείται μόνο το τελευταίο αντίγραφο ασφαλείας, ενδέχεται να καταλήξετε χωρίς έγκυρο αντίγραφο ασφαλείας αποθηκευμένο εξ αποστάσεως. Η απενεργοποίησή του θα μειώσει την πιθανότητα να μείνετε χωρίς έγκυρο αντίγραφο ασφαλείας στην απομακρυσμένη αποθήκη, με αντίτιμο την αποθήκευση ενός επιπλέον αρχείου αντιγράφου ασφαλείας εξ αποστάσεως."
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_TITLE="Το τρέχον αντίγραφο ασφαλείας συμμετέχει στα όρια απομακρυσμένων αρχείων"
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_DESCRIPTION="Όταν είναι ενεργοποιημένο, οι παρακάτω ρυθμίσεις ορίου θα εφαρμόζονται στα αρχεία που αποθηκεύονται σε απομακρυσμένη αποθήκη, όπως Amazon S3 ή απομακρυσμένοι διακομιστές FTP."
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_TITLE="Ενεργοποίηση ορίων απομακρυσμένων αρχείων"
COM_AKEEBA_CONFIG_RUNTIMEBIAS_DESCRIPTION="Αυτό ορίζει πόσο συντηρητικό θα είναι το Akeeba Backup όταν προσπαθεί να αποφύγει υπέρβαση χρονικού ορίου. Όσο χαμηλότερη είναι αυτή η τιμή, τόσο πιο συντηρητικό γίνεται. Εάν λαμβάνετε σφάλματα υπέρβασης χρονικού ορίου, δοκιμάστε να μειώσετε τόσο τον Μέγιστο χρόνο εκτέλεσης όσο και αυτή τη ρύθμιση.<b>Συμβουλή</b>: Επιλέξτε Προσαρμοσμένο και πληκτρολογήστε την επιθυμητή τιμή εάν δεν βρίσκεται στη λίστα."
COM_AKEEBA_CONFIG_RUNTIMEBIAS_TITLE="Μεροληψία χρόνου εκτέλεσης"
COM_AKEEBA_CONFIG_S3ACCESSKEY_DESCRIPTION="Το κλειδί πρόσβασης Amazon S3, το οποίο σας παρέχεται στη σελίδα του προσωπικού σας προφίλ Amazon Web Services"
COM_AKEEBA_CONFIG_S3ACCESSKEY_TITLE="Κλειδί πρόσβασης"
COM_AKEEBA_CONFIG_S3BUCKET_DESCRIPTION="Το όνομα του κάδου Amazon S3"
COM_AKEEBA_CONFIG_S3BUCKET_TITLE="Κάδος"
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_DESCRIPTION="Για χρήση με υπηρεσίες αποθήκευσης τρίτων που υλοποιούν ένα API συμβατό με S3. Εισάγετε το τελικό σημείο (URL API) του API συμβατού με S3 της υπηρεσίας αποθήκευσης τρίτου. ΣΗΜΑΝΤΙΚΟ: Εάν χρησιμοποιείτε Amazon S3 πρέπει να <strong>ΑΦΗΣΕΤΕ ΑΥΤΟ ΤΟ ΠΕΔΙΟ ΚΕΝΟ</strong>."
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_TITLE="Προσαρμοσμένο τελικό σημείο"
COM_AKEEBA_CONFIG_S3DIRECTORY_DESCRIPTION="Ο φάκελος εντός του κάδου σας όπου θα αποθηκεύονται τα αρχεία αντιγράφου ασφαλείας. Αφήστε κενό για αποθήκευση αρχείων στον ριζικό φάκελο του κάδου."
COM_AKEEBA_CONFIG_S3DIRECTORY_TITLE="Φάκελος"
COM_AKEEBA_CONFIG_S3_ACL_TITLE="Δικαιώματα αρχείων (ACL)"
COM_AKEEBA_CONFIG_S3_ACL_DESCRIPTION="Επιλέξτε τα δικαιώματα του αρχείου που θα μεταφορτωθεί. Στις περισσότερες περιπτώσεις, οι επιλογές «Ιδιωτικό» ή «Ο κάτοχος κάδου μπορεί να διαβάσει» είναι οι πιο κατάλληλες. Εάν χρησιμοποιείτε υπηρεσία τρίτου συμβατή με S3, ίσως προτιμήσετε το «Ιδιωτικό» αντί της προεπιλεγμένης ρύθμισης."
COM_AKEEBA_CONFIG_S3_ACL_PRIVATE="Ιδιωτικό"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ="Οποιοσδήποτε μπορεί να διαβάσει"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ_WRITE="Οποιοσδήποτε μπορεί να διαβάσει και να γράψει"
COM_AKEEBA_CONFIG_S3_ACL_AUTHENTICATED_READ="Πιστοποιημένοι χρήστες IAM μπορούν να διαβάσουν"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_READ="Ο κάτοχος κάδου μπορεί να διαβάσει"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_FULL_CONTROL="Ο κάτοχος κάδου έχει πλήρη έλεγχο"
COM_AKEEBA_CONFIG_S3LEGACY_DESCRIPTION="Όταν είναι ενεργοποιημένο, όλες οι μεταφορτώσεις στο Amazon S3 θα αναγκαστούν να είναι μονοτμηματικές. Χρησιμοποιήστε το αυτό εάν λαμβάνετε σφάλματα RequestTimeout από τη μηχανή S3 κατά τη μεταφόρτωση τμημάτων αντιγράφου ασφαλείας."
COM_AKEEBA_CONFIG_S3LEGACY_TITLE="Απενεργοποίηση πολυτμηματικών μεταφορτώσεων"
COM_AKEEBA_CONFIG_S3RRS_DESCRIPTION="Επιλέξτε την κλάση αποθήκευσης για τα δεδομένα σας. Η Τυπική είναι η κανονική αποθήκευση για επιχειρηματικά κρίσιμα δεδομένα. Συμβουλευτείτε την τεκμηρίωση του Amazon S3 για την περιγραφή κάθε κλάσης αποθήκευσης."
COM_AKEEBA_CONFIG_S3RRS_TITLE="Κλάση αποθήκευσης"
COM_AKEEBA_CONFIG_S3SECRETKEY_DESCRIPTION="Το μυστικό κλειδί Amazon S3, το οποίο σας παρέχεται στη σελίδα του προσωπικού σας προφίλ Amazon Web Services"
COM_AKEEBA_CONFIG_S3SECRETKEY_TITLE="Μυστικό κλειδί"
COM_AKEEBA_CONFIG_S3USESSL_DESCRIPTION="Εάν είναι ενεργοποιημένο, θα χρησιμοποιείται ασφαλής σύνδεση (HTTPS) κατά τη μεταφόρτωση των αρχείων σας. Ενώ αυξάνει την ασφάλεια των μεταφερόμενων δεδομένων, αυξάνει επίσης την πιθανότητα αποτυχίας του αντιγράφου ασφαλείας λόγω υπέρβασης χρονικού ορίου."
COM_AKEEBA_CONFIG_S3USESSL_TITLE="Χρήση SSL"
COM_AKEEBA_CONFIG_S3_DUALSTACK_DESCRIPTION="Θα πρέπει να χρησιμοποιηθούν τα τελικά σημεία διπλής στοίβας (dual-stack) για το Amazon S3; Αυτό επιτρέπει την πρόσβαση στο S3 μέσω IPv6 για διακομιστές που υποστηρίζουν IPv6. Διακομιστές χωρίς υποστήριξη IPv6 θα εξακολουθούν να έχουν πρόσβαση στο S3 μέσω IPv4. Δεν έχει καμία επίδραση εάν χρησιμοποιείτε προσαρμοσμένο τελικό σημείο."
COM_AKEEBA_CONFIG_S3_DUALSTACK_TITLE="Ενεργοποίηση υποστήριξης IPv6 (dual-stack)"
