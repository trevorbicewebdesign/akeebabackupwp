SOLO_NOTYETRESTORED_STILLSEETHIS_LBL_P1="Παρακαλώ χρησιμοποιήστε FTP ή τη διαχείριση αρχείων του πίνακα ελέγχου του ιστότοπού σας για να αφαιρέσετε τον φάκελο <code>installation</code> από τον ιστότοπό σας. Αυτό θα κάνει αυτή τη σελίδα να εξαφανιστεί και θα μπορέσετε να δείτε πάλι τον ιστότοπό σας."
SOLO_NOTYETRESTORED_STILLSEETHIS_LBL_P2="Εάν μόλις το κάνατε αυτό και ο φάκελος «installation» δεν υπάρχει στον ριζικό φάκελο του ιστότοπού σας (όπου βρίσκεται το αρχείο wp-config.php) πιθανόν να έχετε CDN ή cache μπροστά από τον ιστότοπό σας. Παρακαλώ επικοινωνήστε με τον πάροχο φιλοξενίας σας και ζητήστε τον τον σωστό τρόπο εκκαθάρισης ή επαναφοράς αυτού του είδους cache ώστε να βλέπετε τον ιστότοπό σας αντί για αυτή τη σελίδα."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P1="Ένα πρόσθετο εγκατεστημένο στον ιστότοπό σας εντόπισε ότι υπάρχει αυτήν τη στιγμή ένας φάκελος με το όνομα <code>installation</code> στον ριζικό φάκελο του ιστότοπού σας και ότι αυτός ο φάκελος εγκατάστασης περιέχει ένα αντίγραφο της δέσμης ενεργειών επαναφοράς αντιγράφων ασφαλείας ANGIE."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P2="Αυτό σημαίνει ότι έχετε αποσυμπιέσει, αλλά δεν έχετε ολοκληρώσει την επαναφορά, ενός αντιγράφου ασφαλείας ιστότοπου. Ο ιστότοπός σας δεν θα λειτουργεί σωστά ακόμα."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P3="Θα πρέπει να ολοκληρώσετε την επαναφορά εκτελώντας τη δέσμη ενεργειών επαναφοράς που βρίσκεται στον φάκελο «installation» του ιστότοπού σας. Εάν δεν είστε σίγουροι πώς να το κάνετε, παρακαλώ κάντε κλικ στο παρακάτω κουμπί."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P4="Αφού ολοκληρώσετε την επαναφορά του ιστότοπου, παρακαλώ αφαιρέστε τον φάκελο «installation» του ιστότοπού σας. Στις περισσότερες περιπτώσεις η δέσμη ενεργειών επαναφοράς θα σας ζητήσει να το κάνει αυτό για λογαριασμό σας. Εάν αναφέρει σφάλμα κατά την προσπάθεια αυτή, παρακαλώ διαβάστε το υπόλοιπο αυτής της σελίδας."
