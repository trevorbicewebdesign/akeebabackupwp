COM_AKEEBA_LEFTOVERS_INFO="Το Akeeba Backup εντόπισε αρχεία ή/και φακέλους που φαίνεται να είναι υπολείμματα από επαναφορά ιστότοπου. Η παραμονή αυτών των αρχείων ή/και φακέλων στον ριζικό φάκελο του ιστότοπού σας μπορεί να αποτελεί πρόβλημα ασφαλείας για διάφορους λόγους."
