SOLO_UPDATE_WORDPRESS_OLDER_THAN_43="Το τυπικό σύστημα ενημέρωσης προσθέτων WordPress δεν μπορεί να χρησιμοποιηθεί για την ενημέρωση του Akeeba Backup for WordPress σε εκδόσεις WordPress πριν από την 4.3 λόγω έλλειψης απαιτούμενων δυνατοτήτων. Χρησιμοποιήστε <a href='%s'>το δικό μας σύστημα ενημέρωσης</a> για να εγκαταστήσετε την τελευταία έκδοση του Akeeba Backup for WordPress."
