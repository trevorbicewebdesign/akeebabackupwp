SOLO_MANAGE_LBL_HOWDOIRESTORE_CORE="Οι χρήστες της δωρεάν έκδοσης (Core) μπορούν να επαναφέρουν τα αντίγραφα ασφαλείας τους μόνο χειροκίνητα χρησιμοποιώντας το Akeeba Kickstart ή τον Akeeba eXtract Wizard. Για περισσότερες πληροφορίες παρακαλώ <a href='%s'>συμβουλευτείτε την τεκμηρίωσή μας</a>. Παρακαλώ εγγραφείτε στην επαγγελματική έκδοση για να αποκτήσετε πρόσβαση στην πολύ πιο εύχρηστη ενσωματωμένη λειτουργία επαναφοράς!"
