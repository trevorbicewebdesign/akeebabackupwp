COM_AKEEBA_SCHEDULE_LBL_LEGACYAPI_DISABLED="Παρακαλώ μεταβείτε στη σελίδα του Πίνακα ελέγχου, κάντε κλικ στη Διαμόρφωση συστήματος, και μετά στην καρτέλα Δημόσιο API. Ορίστε το «Ενεργοποίηση παλαιού API αντιγράφων ασφαλείας μπροστινού άκρου (απομακρυσμένες εργασίες CRON)» σε Ναι για να ενεργοποιήσετε αυτή τη λειτουργία."
COM_AKEEBA_SCHEDULE_LBL_RUN_BACKUPS="Εκτέλεση αντιγράφων ασφαλείας"
COM_AKEEBA_SFTPBROWSER_LBL_ERROR="Προέκυψε σφάλμα"
COM_AKEEBA_SFTPBROWSER_LBL_INSTRUCTIONS="Κάντε κλικ σε έναν φάκελο για να μεταβείτε σε αυτόν. Κάντε κλικ στο OK για να επιλέξετε τον φάκελο, ή Άκυρο για να ακυρώσετε τη διαδικασία."
COM_AKEEBA_TITLE_ALICES="Εργαλείο αντιμετώπισης προβλημάτων - ALICE (Akeeba Log Inspection and Cause Elimination)"
COM_AKEEBA_TRANSFER="Οδηγός μεταφοράς ιστότοπου"
COM_AKEEBA_TRANSFER_BTN_FTP_DETECT="Εντοπισμός"
COM_AKEEBA_TRANSFER_BTN_FTP_PROCEED="Συνέχεια με επαναφορά"
COM_AKEEBA_TRANSFER_BTN_OPEN_KICKSTART="Εκτέλεση Kickstart"
COM_AKEEBA_TRANSFER_BTN_RESET="Επαναφορά"
COM_AKEEBA_TRANSFER_DESC="Μεταφορά του αρχείου αντιγράφου εκτελώντας τη μηχανή μετά-επεξεργασίας «%s» στο αρχείο."
COM_AKEEBA_TRANSFER_ERR_CANNOTACCESSTESTFILE="Το Akeeba Backup δεν μπορεί να επαληθεύσει ότι οι πληροφορίες σύνδεσης που εισαγάγατε αντιστοιχούν στη URL του ιστότοπου που έχετε εισαγάγει. Εάν προσπαθείτε να εκτελέσετε επαναφορά σε έναν υποφάκελο ενός υπάρχοντος ιστότοπου, αυτό σημαίνει ότι ο κύριος ιστότοπος μπλοκάρει την πρόσβαση στον υποφάκελο· παρακαλώ επικοινωνήστε με τον διαχειριστή του ιστότοπού σας. Σε κάθε άλλη περίπτωση έχετε εισαγάγει λανθασμένες πληροφορίες σύνδεσης, πιθανότατα λανθασμένο φάκελο. Παρακαλώ επικοινωνήστε με τον πάροχο φιλοξενίας σας και ζητήστε τις σωστές πληροφορίες σύνδεσης, <em>συμπεριλαμβανομένου του φακέλου</em>, που αντιστοιχεί στη URL που εισαγάγατε σε αυτόν τον οδηγό. Έπειτα επιστρέψτε εδώ, εισαγάγετε τις σωστές πληροφορίες και συνεχίστε με την επαναφορά."
COM_AKEEBA_TRANSFER_ERR_CANNOTREADLOCALFILE="Το Akeeba Backup δεν μπορεί να διαβάσει το τοπικό αρχείο αντιγράφου ασφαλείας <code>%s</code>. Αυτός ο οδηγός απέτυχε. Παρακαλώ δημιουργήστε νέο αντίγραφο ασφαλείας και δοκιμάστε ξανά. Σημειώστε ότι αρχεία έχουν παραμείνει στον νέο διακομιστή σας· ίσως να θέλετε να τα αφαιρέσετε χειροκίνητα."
COM_AKEEBA_TRANSFER_ERR_CANNOTRUNKICKSTART="Το Akeeba Backup δεν μπορεί να εκτελέσει το Akeeba Kickstart στον νέο ιστότοπό σας. Εάν προσπαθείτε να εκτελέσετε επαναφορά σε έναν υποφάκελο ενός υπάρχοντος ιστότοπου, αυτό σημαίνει ότι ο κύριος ιστότοπος μπλοκάρει την πρόσβαση στον υποφάκελο· παρακαλώ επικοινωνήστε με τον διαχειριστή του ιστότοπού σας. Σε κάθε άλλη περίπτωση, πρέπει να επικοινωνήσετε με τον πάροχο φιλοξενίας σας και να επαληθεύσετε ότι η προεπιλεγμένη έκδοση PHP πληροί τις ελάχιστες απαιτήσεις του Kickstart."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADARCHIVE="Το Akeeba Backup δεν μπορεί να αποστείλει το αρχείο αντιγράφου ασφαλείας <code>%s</code>. Είναι πιθανό ο διακομιστής του νέου ιστότοπού σας να έχει εξαντλήσει τον αποθηκευτικό χώρο ή μια προστασία διακομιστή να μπλοκάρει τη μεταφορά δεδομένων. Παρακαλώ δοκιμάστε να μεταφέρετε τον ιστότοπό σας επιλέγοντας τη μέθοδο χειροκίνητης μεταφοράς. Σημειώστε ότι αρχεία έχουν παραμείνει στον νέο διακομιστή σας· ίσως να θέλετε να τα αφαιρέσετε χειροκίνητα."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADKICKSTART="Το Akeeba Backup δεν μπορεί να αποστείλει το Akeeba Kickstart στον ριζικό φάκελο του νέου ιστότοπού σας. Παρακαλώ ελέγξτε ότι έχετε εισαγάγει τις σωστές πληροφορίες σύνδεσης και ότι ο χρήστης FTP/SFTP μπορεί να εγγράφει αρχεία στον φάκελο που επιλέξατε. Εάν τα αρχεία kickstart.php και kickstart.transfer.php υπάρχουν ήδη στον απομακρυσμένο ιστότοπο, παρακαλώ αφαιρέστε τα πριν επαναλάβετε τη μεταφορά του ιστότοπού σας."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTEMP="Το Akeeba Backup δεν μπορεί να αποστείλει ένα τμήμα του αρχείου αντιγράφου ασφαλείας σας από το τοπικό αρχείο <code>%s</code> στο απομακρυσμένο αρχείο <code>%s</code>. Παρακαλώ ελέγξτε ότι ο απομακρυσμένος διακομιστής σας επιτρέπει την αποστολή αρχείων και ότι υπάρχει επαρκής αποθηκευτικός χώρος για το αρχείο ή τα αρχεία αντιγράφου ασφαλείας."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTESTFILE="Το Akeeba Backup δεν μπορεί να αποστείλει ένα δοκιμαστικό αρχείο με το όνομα <code>%s</code> στον ριζικό φάκελο του νέου ιστότοπού σας. Παρακαλώ ελέγξτε ότι έχετε εισαγάγει τις σωστές πληροφορίες σύνδεσης και ότι ο χρήστης FTP/SFTP μπορεί να εγγράφει αρχεία στον φάκελο που επιλέξατε."
COM_AKEEBA_TRANSFER_ERR_CANNOTWRITEREMOTEFILES="Δυστυχώς, το Akeeba Backup διαπίστωσε ότι δεν μπορεί να εγγράψει απευθείας αρχεία στον απομακρυσμένο διακομιστή σας. Αυτός ο οδηγός δεν μπορεί να συνεχίσει. Θα πρέπει να χρησιμοποιήσετε τη μέθοδο μεταφοράς «Χειροκίνητα»."
COM_AKEEBA_TRANSFER_ERR_CANTCREATETEMPCHUNK="Δεν είναι δυνατή η δημιουργία προσωρινού αρχείου σε αυτόν τον διακομιστή. Παρακαλώ ελέγξτε ότι ο προσωρινός φάκελος έχει ρυθμιστεί σωστά και είναι εγγράψιμος από τον χρήστη υπό τον οποίο εκτελείται ο διακομιστής ιστού."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP="Δεν βρέθηκε τέτοιο αντίγραφο ασφαλείας. Κάντε κλικ στο κουμπί Δημιουργία αντιγράφου ασφαλείας τώρα για να δημιουργήσετε νέο αντίγραφο ασφαλείας."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP_SPECIFIC="Το αντίγραφο ασφαλείας #%d δεν μπορεί να μεταφερθεί. Είτε δεν είναι ένα ολοκληρωμένο, πλήρες αντίγραφο ασφαλείας του ιστότοπου είτε τα αρχεία του δεν υπάρχουν πλέον σε αυτόν τον διακομιστή."
COM_AKEEBA_TRANSFER_ERR_DNS="Το όνομα τομέα της URL που εισαγάγατε (%s) δεν μπορεί να επιλυθεί από τον διακομιστή στον οποίο εκτελείται το Akeeba Backup. Εάν έχετε πρόσφατα καταχωρίσει ή μεταφέρει το όνομα τομέα, παρακαλώ αναμείνετε έως ότου ενημερωθούν οι διακομιστές DNS (συνήθως 6 έως 48 ώρες). Σε αντίθετη περίπτωση, παρακαλώ ελέγξτε τις ρυθμίσεις DNS του ονόματος τομέα σας."
COM_AKEEBA_TRANSFER_ERR_ERRORFROMREMOTE="Το Akeeba Backup έλαβε σφάλμα από τον απομακρυσμένο διακομιστή κατά την προσπάθεια αποστολής του αρχείου αντιγράφου ασφαλείας. Το σφάλμα ήταν: %s"
COM_AKEEBA_TRANSFER_ERR_EXISTINGSITE="Ένας άλλος ιστότοπος υπάρχει ήδη σε αυτή τη θέση. Παρακαλώ αφαιρέστε τον υπάρχοντα ιστότοπο πριν μεταφέρετε έναν νέο. Η προσπάθεια αντικατάστασης ενός υπάρχοντος ιστότοπου πιθανότατα θα οδηγήσει σε κατεστραμμένο ιστότοπο που δεν θα μπορείτε να επιδιορθώσετε."
COM_AKEEBA_TRANSFER_ERR_HTACCESS="Βρέθηκε αρχείο <code>%s</code> στον ριζικό φάκελο του νέου ιστότοπού σας. Αυτό το αρχείο μπορεί να παρεμβαίνει στη διαδικασία μεταφοράς του ιστότοπου. Παρακαλώ αφαιρέστε το πριν συνεχίσετε με τη μεταφορά. Σημειώστε ότι το αρχείο ενδέχεται να είναι <em>κρυμμένο</em>. Εάν δεν το βλέπετε στο πρόγραμμα περιήγησης αρχείων του πίνακα ελέγχου φιλοξενίας ή στο πρόγραμμα πελάτη FTP, παρακαλώ ζητήστε από τον πάροχο φιλοξενίας σας περισσότερες πληροφορίες σχετικά με την αφαίρεση αυτού του αρχείου."
COM_AKEEBA_TRANSFER_ERR_INVALIDID="Καθορίστηκε μη έγκυρο αναγνωριστικό αποστολής"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN="Έλεγχος"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN_IGNOREERROR="Θέλω να αγνοήσω αυτήν την προειδοποίηση και να συνεχίσω <strong>με δική μου ευθύνη</strong>"
COM_AKEEBA_TRANSFER_ERR_NEWURL_INVALID="Το URL που εισαγάγατε δεν είναι έγκυρο."
COM_AKEEBA_TRANSFER_ERR_NEWURL_NOTEXISTS="Ο διακομιστής σας δεν μπορεί να αποκτήσει πρόσβαση στο URL που εισαγάγατε. Ελέγξτε ότι το πληκτρολογήσατε σωστά. Επίσης, σημειώστε ότι τα νέα ή μεταφερθέντα ονόματα τομέα ενδέχεται να χρειαστούν <strong>έως 48 ώρες</strong> για να γίνουν ορατά σε κάθε διακομιστή και υπολογιστή συνδεδεμένο στο Διαδίκτυο."
COM_AKEEBA_TRANSFER_ERR_NEWURL_SAME="Το URL που εισαγάγατε είναι ίδιο με αυτό από το οποίο εκτελείτε επαναφορά. Αυτό δεν υποστηρίζεται από αυτόν τον οδηγό. Για επαναφορά αντιγράφου ασφαλείας χωρίς τη χρήση του οδηγού, συμβουλευθείτε το βίντεο οδηγό ακολουθώντας τον παρακάτω σύνδεσμο."
COM_AKEEBA_TRANSFER_ERR_NOTENOUGHSPACE="Η μεταφορά ιστότοπου δεν μπορεί να συνεχιστεί. Χρειάζεστε περίπου %s ελεύθερου χώρου, αλλά ο διακομιστής σας αναφέρει ότι διατίθενται μόνο %s αυτήν τη στιγμή. Ελευθερώστε περισσότερο χώρο στον διακομιστή σας."
COM_AKEEBA_TRANSFER_ERR_OVERRIDE="Αγνόηση εντοπισμένων σφαλμάτων και μεταφορά του ιστότοπου ούτως ή άλλως"
COM_AKEEBA_TRANSFER_ERR_SAMESITE="Εισαγάγατε τα στοιχεία σύνδεσης του ιστότοπου από τον οποίο μεταφέρετε. <strong>Το λάθος σας θα είχε διαγράψει τον δικό σας ιστότοπο</strong>. Πρέπει να εισαγάγετε τα στοιχεία σύνδεσης FTP/SFTP του ιστότοπου <strong>στον οποίο</strong> μεταφέρετε (νέος ιστότοπος ή νέος διακομιστής). Διορθώστε τα παραπάνω στοιχεία και δοκιμάστε ξανά."
COM_AKEEBA_TRANSFER_ERR_SPACE="Έχετε μόνο <span></span> ελεύθερου χώρου. Χρειάζεστε περισσότερο ελεύθερο χώρο για να μεταφέρετε τον ιστότοπό σας. Επικοινωνήστε με τον παροχέα φιλοξενίας σας."
COM_AKEEBA_TRANSFER_ERR_WRONGSSL="Ο ιστότοπός σας διαθέτει μη έγκυρο ή αυτο-υπογεγραμμένο πιστοποιητικό SSL. Για λόγους ασφαλείας, η μεταφορά ιστότοπου δεν μπορεί να συνεχιστεί. Κάντε κλικ στο Επαναφορά για επανεκκίνηση της μεταφοράς ιστότοπου και χρησιμοποιήστε URL χωρίς <code>https://</code>. Αυτό είναι απαραίτητο όταν προσπαθείτε να μεταφέρετε τον ιστότοπό σας πριν από τη μεταφορά του ονόματος τομέα σας στον νέο παροχέα φιλοξενίας. Εναλλακτικά, επικοινωνήστε με τον παροχέα φιλοξενίας σας για την απόκτηση έγκυρου πιστοποιητικού SSL. Ακόμα και ένα δωρεάν πιστοποιητικό που εκδίδεται μέσω της δωρεάν αρχής πιστοποίησης Let's Encrypt θα κάνει."
COM_AKEEBA_TRANSFER_FORCE_BODY="Εκτελείτε τον Οδηγό μεταφοράς ιστότοπου σε Αναγκαστική Λειτουργία. Αυτό σημαίνει ότι ορισμένοι έλεγχοι λογικής, οι οποίοι συνήθως εκτελούνται πριν από τη μεταφορά ιστότοπου, δεν θα πραγματοποιηθούν. Ως αποτέλεσμα, η μεταφορά ενδέχεται να αντικαταστήσει έναν υπάρχοντα ιστότοπο, να καταλήξει σε διαφορετικό URL από αυτό που αναμένατε ή απλώς να αποτύχει. <strong>Αυτή είναι λειτουργία για προχωρημένους χρήστες. Μην συνεχίσετε εάν δεν νιώθετε άνετα με αυτό.</strong>"
