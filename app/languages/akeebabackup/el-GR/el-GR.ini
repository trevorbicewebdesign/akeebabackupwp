COM_AKEEBA_PUSH_ENDBACKUP_WARNINGS_BODY="Το Akeeba Backup ολοκλήρωσε τη δημιουργία αντιγράφου ασφαλείας του ιστότοπού σας \"%s\" που βρίσκεται στη διεύθυνση %s στις %s, αλλά εκδόθηκαν προειδοποιήσεις. Αυτό ενδέχεται να σημαίνει ότι ορισμένα αρχεία δεν συμπεριλήφθηκαν στο αντίγραφο ασφαλείας ή, εάν ανεβάζετε αυτόματα το αντίγραφο σε απομακρυσμένη αποθήκη, η αποστολή ενδέχεται να απέτυχε.\nΘα πρέπει να εξετάσετε τις προειδοποιήσεις και να βεβαιωθείτε ότι το αντίγραφο ασφαλείας σας ολοκληρώθηκε επιτυχώς. Σας συνιστούμε να δοκιμάζετε πάντα ένα αντίγραφο ασφαλείας που προκάλεσε προειδοποιήσεις, για να βεβαιωθείτε ότι λειτουργεί σωστά. Μπορείτε να το κάνετε επαναφέροντάς το σε τοπικό διακομιστή. Θυμηθείτε ότι ένα αδοκίμαστο αντίγραφο ασφαλείας δεν αξίζει περισσότερο από το να μην έχετε κανένα αντίγραφο."
COM_AKEEBA_PUSH_ENDBACKUP_WARNINGS_SUBJECT="Το αντίγραφο ασφαλείας ολοκληρώθηκε με προειδοποιήσεις για %s"
