COM_AKEEBA_MIGREIGHT_NEEDED_FOLDERS_N="Το Akeeba Backup εντόπισε ότι τα αρχεία αντιγράφων ασφαλείας στους παρακάτω %d φακέλους χρειάζεται να μεταφερθούν:"
