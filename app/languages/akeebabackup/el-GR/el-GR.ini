COM_AKEEBA_CONFIG_SUGARSYNC_EMAIL_TITLE="Email"
COM_AKEEBA_CONFIG_SUGARSYNC_PASSWORD_DESCRIPTION="Ο κωδικός πρόσβασης για τον λογαριασμό σας στο SugarSync"
COM_AKEEBA_CONFIG_SUGARSYNC_PASSWORD_TITLE="Κωδικός πρόσβασης"
COM_AKEEBA_CONFIG_SUGARSYNC_PRIVATE_DESCRIPTION="Εισαγάγετε το Ιδιωτικό Κλειδί Πρόσβασης που αντιστοιχεί στο Αναγνωριστικό Κλειδιού Πρόσβασής σας. Δημιουργήστε ένα στη διεύθυνση https://www.sugarsync.com/developer/account"
COM_AKEEBA_CONFIG_SUGARSYNC_PRIVATE_TITLE="Ιδιωτικό Κλειδί Πρόσβασης"
COM_AKEEBA_CONFIG_SWIFT_AUTHURL_DESCRIPTION="Το τελικό σημείο (endpoint) για την υπηρεσία Keystone της εγκατάστασής σας OpenStack. ΣΥΜΠΕΡΙΛΑΒΕΤΕ την έκδοση. ΜΗΝ ΣΥΜΠΕΡΙΛΑΒΕΤΕ το επίθημα /token. Παράδειγμα: https://authentication.example.com/v2.0"
