COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING="Συνιστούμε να κλείσετε αυτό το παράθυρο διαλόγου και να χρησιμοποιήσετε FTP σε λειτουργία μεταφοράς <code>Binary</code> ή SFTP για να κατεβάσετε τα αρχεία αντιγράφων ασφαλείας σας."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD="<strong>Οι τρέχουσες ρυθμίσεις του διακομιστή σας ενδέχεται να οδηγήσουν σε κατεστραμμένο (ή σπασμένο) αρχείο κατά τη λήψη μέσω του προγράμματος περιήγησης.</strong> Η λήψη αρχείων αντιγράφων ασφαλείας μέσω του προγράμματος περιήγησης είναι απενεργοποιημένη από προεπιλογή, διότι είναι πιθανό κάποιο άλλο πρόσθετο ή η PHP να προσθέτουν απροσδόκητα δεδομένα στην αρχή ή το τέλος του αρχείου αντιγράφου ασφαλείας. Αυτό θα κατέστρεφε τα αρχεία αντιγράφων ασφαλείας που κατεβάζετε μέσω του προγράμματος περιήγησης, καθιστώντας αδύνατη την επαναφορά τους."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_ALTERNATIVE="Μπορείτε να κλείσετε αυτό το παράθυρο διαλόγου και να χρησιμοποιήσετε FTP σε λειτουργία μεταφοράς <code>Binary</code> ή SFTP για να κατεβάσετε τα αρχεία αντιγράφων ασφαλείας σας από τον διακομιστή σας."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART="Το αρχείο αντιγράφου ασφαλείας σας αποτελείται από %u αρχεία με το όνομα αρχείου <code>%s</code> και τις επεκτάσεις <code>%s</code> καθώς και <code>%s</code> έως <code>%s</code>. <strong>ΣΗΜΑΝΤΙΚΟ!</strong> Πρέπει να κατεβάσετε <em>όλα αυτά</em> τα αρχεία. Κατά την επαναφορά του ιστότοπού σας, ανεβάστε επίσης όλα αυτά τα αρχεία μαζί με το <code>kickstart.php</code>. Εάν δεν το κάνετε, δεν θα είναι δυνατή η επαναφορά του αρχείου αντιγράφου ασφαλείας σας."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_1="Το αρχείο που πρέπει να κατεβάσετε ονομάζεται <code>%s</code>"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_2="Το αρχείο αντιγράφου ασφαλείας σας αποτελείται από δύο αρχεία με το όνομα αρχείου <code>%s</code> και τις επεκτάσεις <code>%s</code> και <code>%s</code>. <strong>ΣΗΜΑΝΤΙΚΟ!</strong> Πρέπει να κατεβάσετε <em>και τα δύο</em> αρχεία. Κατά την επαναφορά του ιστότοπού σας, ανεβάστε επίσης και τα δύο αρχεία μαζί με το <code>kickstart.php</code>. Εάν δεν το κάνετε, δεν θα είναι δυνατή η επαναφορά του αρχείου αντιγράφου ασφαλείας σας."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_AKEEBADEBUG="Μπορείτε να επανενεργοποιήσετε τις λήψεις μέσω προγράμματος περιήγησης επεξεργαζόμενοι το αρχείο <code>%s/defines.php</code> και σχολιάζοντας τη γραμμή <code>define('AKEEBADEBUG', 1);</code>."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_ENABLED="<strong>Οι τρέχουσες ρυθμίσεις του διακομιστή σας ενδέχεται να οδηγήσουν σε κατεστραμμένο (ή σπασμένο) αρχείο κατά τη λήψη μέσω του προγράμματος περιήγησης.</strong> Η λήψη αρχείων αντιγράφων ασφαλείας μέσω του προγράμματος περιήγησης έχει απενεργοποιηθεί αυτόματα επειδή ο διακομιστής σας έχει ρυθμιστεί να εξάγει ειδοποιήσεις, προειδοποιήσεις και σφάλματα PHP στο πρόγραμμα περιήγησης. Αυτό θα έκανε το αρχείο αντιγράφου ασφαλείας που κατεβάσατε <em>κατεστραμμένο</em> (σπασμένο) και αδύνατο να επαναφερθεί. Κλείστε αυτό το παράθυρο διαλόγου και χρησιμοποιήστε FTP σε λειτουργία μεταφοράς <code>Binary</code> ή SFTP για να κατεβάσετε τα αρχεία αντιγράφων ασφαλείας σας από τον διακομιστή σας."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_UNKNOWN="<strong>Οι τρέχουσες ρυθμίσεις του διακομιστή σας ενδέχεται να οδηγήσουν σε κατεστραμμένο (ή σπασμένο) αρχείο κατά τη λήψη μέσω του προγράμματος περιήγησης.</strong> Η λήψη αρχείων αντιγράφων ασφαλείας μέσω του προγράμματος περιήγησης έχει απενεργοποιηθεί αυτόματα επειδή δεν είναι δυνατό να προσδιοριστεί εάν ο διακομιστής σας έχει ρυθμιστεί να εξάγει ειδοποιήσεις, προειδοποιήσεις και σφάλματα PHP στο πρόγραμμα περιήγησης. Όταν οι ειδοποιήσεις, προειδοποιήσεις και σφάλματα PHP εξάγονται στο πρόγραμμα περιήγησης, το αρχείο αντιγράφου ασφαλείας που κατεβάζετε γίνεται <em>κατεστραμμένο</em> (σπασμένο) και αδύνατο να επαναφερθεί. Κλείστε αυτό το παράθυρο διαλόγου και χρησιμοποιήστε FTP σε λειτουργία μεταφοράς <code>Binary</code> ή SFTP για να κατεβάσετε τα αρχεία αντιγράφων ασφαλείας σας από τον διακομιστή σας."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_WPDEBUG="Μπορείτε να επανενεργοποιήσετε τις λήψεις μέσω προγράμματος περιήγησης επεξεργαζόμενοι το αρχείο <code>wp-config.php</code> και ορίζοντας τη σταθερά <code>WP_DEBUG</code> σε <code>false</code>."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_REENABLE="Μπορείτε να ενεργοποιήσετε τις λήψεις μέσω του προγράμματος περιήγησης <em>με δική σας ευθύνη</em> στη σελίδα Διαμόρφωσης Συστήματος του Akeeba Backup."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_WORDPRESS="<strong>Έχετε ενεργοποιήσει χειροκίνητα τη λήψη αντιγράφων ασφαλείας μέσω του προγράμματος περιήγησης <em>με δική σας ευθύνη</em>.</strong> Πρόσθετα τρίτων και ρυθμίσεις διακομιστή μπορούν να προκαλέσουν το αποκομμένο (ελλιπές) ή κατεστραμμένο (σπασμένο) αρχείο που κατεβάζετε. Εάν επιλέξετε να κατεβάσετε τα αρχεία αντιγράφων ασφαλείας σας μέσω του προγράμματος περιήγησης αγνοώντας τις προειδοποιήσεις μας, <strong>αποδέχεστε προσωπικά πλήρη ευθύνη και υπαιτιότητα για τις ενέργειές σας</strong> και συμφωνείτε ότι η Akeeba Ltd δεν φέρει καμία ευθύνη ή υπαιτιότητα με οποιονδήποτε τρόπο και δεν θα παρέχει καμία υποστήριξη σε περίπτωση που το αρχείο αντιγράφου ασφαλείας σας δεν μπορεί να αποσυμπιεστεί ή να επαναφερθεί."
COM_AKEEBA_BUADMIN_LBL_LOGFILEID="Αναγνωριστικό αρχείου καταγραφής"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD="Λήψη"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD_CONFIRM="Η λήψη αρχείων αντιγράφων ασφαλείας μέσω του προγράμματος περιήγησης είναι επιρρεπής\nσε αποτυχία, καταστροφή αρχείων και αποκοπή αρχείων λόγω αιτιών\nαντικειμενικά εκτός του ελέγχου μας (διαμόρφωση διακομιστή, διαμόρφωση ιστότοπου,\nπρόσθετα τρίτων και διαμόρφωση προγράμματος περιήγησης).\n\nΣυνιστούμε ΑΝΕΠΙΦΥΛΑΚΤΑ να κατεβάζετε\nτα αρχεία αντιγράφων ασφαλείας μέσω FTP σε λειτουργία μεταφοράς Binary\n(μην χρησιμοποιείτε Auto ή ASCII· θα καταστρέψει τα αρχεία\nαντιγράφων ασφαλείας σας) χρησιμοποιώντας λογισμικό πελάτη όπως FileZilla,\n CyberDuck, WinSCP ή παρόμοιο· ή χρησιμοποιώντας τη\nλειτουργία διαχείρισης αρχείων του πίνακα ελέγχου φιλοξενίας σας.\n\nΕάν συνεχίσετε με αυτή τη λήψη, συμφωνείτε ρητά\nότι παραιτείστε από το δικαίωμά σας σε υποστήριξη για οποιοδήποτε\nζήτημα λήψης, αποσυμπίεσης ή επαναφοράς αρχείου αντιγράφου ασφαλείας και\nκατανοείτε ότι τέτοια αιτήματα δεν θα απαντηθούν.\n\nΕίστε βέβαιοι ότι θέλετε να συνεχίσετε;"
