SOLO_SETUP_LBL_TIMEZONE_WORDPRESS="Αυτή είναι η ζώνη ώρας που χρησιμοποιεί το WordPress. Δεν μπορείτε να την αλλάξετε στο Akeeba Backup. Πρέπει να μεταβείτε στις Ρυθμίσεις, Γενικά στην πλαϊνή γραμμή του WordPress και να την αλλάξετε εκεί. Εάν δεν έχει επιλεγεί καμία ζώνη ώρας σε εκείνη τη σελίδα, υποθέτουμε ότι πρέπει να χρησιμοποιηθεί η ζώνη ώρας GMT (UTC)."
