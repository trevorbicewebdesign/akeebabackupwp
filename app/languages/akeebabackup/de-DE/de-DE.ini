SOLO_SETUP_LBL_WELCOME="Bevor Sie Akeeba Solo verwenden können, müssen Sie es einrichten. Dieses Web-Installationsprogramm führt Sie durch alle notwendigen Schritte. Auf dieser ersten Seite prüfen wir, ob Ihre Serverkonfiguration den Mindestanforderungen für Akeeba Solo entspricht. Klicken Sie auf die Schaltfläche <strong>Weiter</strong> oben, um zur nächsten Seite des Installationsprogramms zu gelangen."
