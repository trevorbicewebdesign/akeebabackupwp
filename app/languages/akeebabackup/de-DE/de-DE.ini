COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECK_HEADERINFO="Mit dieser Funktion können Sie prüfen, ob abgeschlossene Backups vorliegen, die nicht in den Remote-Speicher (z. B. Amazon S3, Dropbox usw.) hochgeladen werden konnten, und eine E-Mail-Benachrichtigung an die Website-Administratoren senden."
COM_AKEEBA_SCHEDULE_LBL_UPLOADCHECKUSECLI="Um fehlgeschlagene Uploads in den Remote-Speicher mithilfe des nativen CLI-Skripts zu prüfen, verwenden Sie die folgende Befehlszeile:"
COM_AKEEBA_SCHEDULE_LBL_CLICRON="Befehlszeilen-CRON-Aufgaben (empfohlen)"
COM_AKEEBA_SCHEDULE_LBL_CLICRON_INFO="Dies ist die empfohlene Methode für alle Server, die Befehlszeilen-CRON-Aufgaben unterstützen. Diese Methode umgeht die Weboberfläche und erreicht so maximale Backup-Geschwindigkeit."
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICIMPROTANTINFO="Wichtig"
COM_AKEEBA_SCHEDULE_LBL_CLIGENERICINFO="Denken Sie daran, <em>%s</em> durch den tatsächlichen Pfad zur PHP-<strong>CLI (Command Line Interface)</strong>-Ausführungsdatei Ihres Hosts zu ersetzen. Beachten Sie, dass Sie die PHP-CLI-Ausführungsdatei verwenden müssen; obwohl die PHP-CGI (Common Gateway Interface)-Ausführungsdatei möglicherweise mit unseren CRON-Skripten funktioniert, ist sie anfällig für Zeitüberschreitungsfehler und Backup-Fehler. Wenn Sie nicht sicher sind, was das bedeutet, wenden Sie sich bitte an Ihren Host. Nur dieser kann Ihnen den Pfad zur PHP-CLI-Ausführungsdatei mitteilen."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP="Frontend-Backup-Funktion"
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_INFO="Diese Methode verwendet eine öffentliche URL und einen Geheimschlüssel, um ein Backup Ihrer Website auszulösen. Der Backup-Fortschritt erfolgt über HTTP-Weiterleitungen. Bitte beachten Sie, dass die meisten URL-basierten CRON-Aufgaben von Hosts sowie die meisten URL-basierten CRON-Dienste von Drittanbietern keine HTTP-Weiterleitungen unterstützen. Wenn die Beispiele mit wget und curl weiter unten bei Ihnen nicht funktionieren, verwenden Sie bitte die Frontend-Backup-URL mit dem sehr günstigen Drittanbieterdienst webcron.org."
COM_AKEEBA_SCHEDULE_LBL_FRONTENDBACKUP_MANYMETHODS="Die Frontend-Backup-Funktion kann mit einer Vielzahl von Methoden verwendet werden. Klicken Sie auf die Registerkarten unten, um die Beschreibung der einzelnen Methoden anzuzeigen. Denken Sie daran, dass alle Methoden ausführlich in unserer Dokumentation erklärt werden."
