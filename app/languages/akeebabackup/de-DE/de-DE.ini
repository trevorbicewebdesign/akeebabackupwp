COM_AKEEBA_CONFWIZ_PROGRESS="Benchmarking läuft"
COM_AKEEBA_CONFWIZ_SPLITSIZE="Ermittlung der erforderlichen Teilgröße für geteilte Archive"
COM_AKEEBA_CONFWIZ_UI_CANTDBOPT="Akeeba Backup konnte die optimalen Einstellungen für den Datenbank-Dump nicht ermitteln. Stellen Sie sicher, dass Ihr Server auf MySQL 5.0 oder höher läuft und dass Ihr Datenbankbenutzer berechtigt ist, den Befehl SHOW TABLE STATUS auszuführen, bevor Sie diesen Assistenten erneut starten."
COM_AKEEBA_CONFWIZ_UI_CANTDETERMINEMINEXEC="Die minimale Ausführungszeit konnte nicht ermittelt werden. Dies deutet auf ein schwerwiegendes Problem bei der Kommunikation mit Ihrem Server hin. Bitte versuchen Sie, Akeeba Backup manuell zu konfigurieren."
COM_AKEEBA_CONFWIZ_UI_CANTDETERMINEPARTSIZE="Akeeba Backup konnte keine für Ihren Server geeignete Teilgröße ermitteln. Stellen Sie sicher, dass Sie über ausreichend freien Speicherplatz auf Ihrem Konto verfügen, und führen Sie diesen Assistenten erneut aus."
COM_AKEEBA_CONFWIZ_UI_CANTFIXDIRECTORIES="Akeeba Backup konnte kein beschreibbares Ausgabeverzeichnis finden. Bitte erteilen Sie dem Backups-Verzeichnis im Anwendungsordner Schreibrechte und führen Sie diesen Assistenten erneut aus."
COM_AKEEBA_CONFWIZ_UI_CANTSAVEMAXEXEC="Akeeba Backup konnte die Einstellungen für die maximale Ausführungszeit nicht speichern. Sie müssen diese manuell konfigurieren."
COM_AKEEBA_CONFWIZ_UI_CANTSAVEMINEXEC="Die Einstellung für die minimale Ausführungszeit konnte nicht gespeichert werden. Sie müssen Akeeba Backup manuell konfigurieren."
COM_AKEEBA_CONFWIZ_UI_EXECTOOLOW="Akeeba Backup hat festgestellt, dass Ihr Server eine maximale Ausführungszeit erfordert, die zu niedrig für den praktischen Einsatz ist. Es empfiehlt sich, den Hosting-Anbieter zu wechseln oder Ihren Anbieter zu bitten, die maximale PHP-Ausführungszeit zu erhöhen und die CPU-Nutzungsbeschränkungen für Ihr Konto aufzuheben."
