COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEAPP_TITLE="In Microsoft OneDrive hochladen (App-spezifischer Ordner)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEAPP_DESCRIPTION="Lädt das Backup-Archiv in Microsoft OneDrive hoch, in den app-spezifischen Ordner für Akeeba Backup (<code>Apps/Akeeba Backup</code>). Dies ist eingeschränkter als die anderen OneDrive-Upload-Optionen, verursacht jedoch bei einigen Konten, die bei der anderen von uns angebotenen Integration Authentifizierungsprobleme aufweisen, weniger Probleme."
COM_AKEEBA_CONFIG_ONEDRIVEAPP_DIRECTORY_TITLE="Unterverzeichnis in <code>Apps/Akeeba Backup</code>"
COM_AKEEBA_CONFIG_ONEDRIVEAPP_DIRECTORY_DESCRIPTION="Das Unterverzeichnis innerhalb des app-spezifischen Akeeba Backup-Ordners (<code>Apps/Akeeba Backup</code>) in Ihrem Microsoft OneDrive, in das Backup-Archive hochgeladen werden. Bitte verwenden Sie Schrägstriche (<code>/</code>), keine umgekehrten Schrägstriche (<code>\\<code>), und setzen Sie immer einen Schrägstrich voran. Richtig: <code>/some/thing</code>. Falsch: <code>some\\thing</code>. Ein einzelner Schrägstrich bedeutet, dass Archive im Stammverzeichnis des Laufwerks gespeichert werden. Geben Sie NICHT den Pfad zum app-spezifischen Ordner (<code>Apps/Akeeba Backup</code>) an; dieser wird automatisch von Microsoft OneDrive selbst hinzugefügt!"

