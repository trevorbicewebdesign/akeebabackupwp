COM_AKEEBA_CONFWIZ_UI_PARTSIZE="Es wird eine Teilgröße von %s MB getestet"
COM_AKEEBA_CONFWIZ_UI_SAVEMINEXEC="Einstellung für minimale Ausführungszeit wird gespeichert"
COM_AKEEBA_CONFWIZ_UI_SAVINGMAXEXEC="Einstellung für maximale Ausführungszeit wird gespeichert"
COM_AKEEBA_CONTROLPANEL="Systemsteuerung"
COM_AKEEBA_CONTROLPANEL_BTN_HIDE="In 15 Tagen erinnern"
COM_AKEEBA_CONTROLPANEL_BTN_LEARNMORE="Mehr über <strong>Akeeba Backup Professional</strong> erfahren"
COM_AKEEBA_CONTROLPANEL_HEAD_LBL_DISCOUNT="Verwenden Sie den Gutscheincode <strong>%s</strong>, um mit einem Einführungsrabatt von <strong>20%%</strong> zu abonnieren."
COM_AKEEBA_CONTROLPANEL_HEAD_LBL_PROUPSELL_1="Fügen Sie geplante Backups, automatisches Hochladen auf 40+ Cloud-Speicheranbieter, integrierte Wiederherstellung, einen Website-Übertragungsassistenten und vieles mehr mit <strong>Akeeba Backup Professional</strong> hinzu."
COM_AKEEBA_CONTROLPANEL_HEAD_LBL_PROUPSELL_2="Eine einzelne Lizenz gilt für <strong>unbegrenzte Websites</strong>. Sie beinhaltet sogar persönlichen Support von den Entwicklern, die diese Software schreiben."
COM_AKEEBA_CONTROLPANEL_HEAD_PROUPSELL="Vereinfachen Sie Ihre Arbeit"
COM_AKEEBA_CPANEL_BTN_FESECRETWORD_RESET="Vorgeschlagenen Geheimschlüssel übernehmen"
COM_AKEEBA_CPANEL_BTN_FIXSECURITY="Sicherheit meiner Backups korrigieren"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_BANNED="Der Geheimschlüssel ist ein bekanntes unsicheres Passwort. Bitte verwenden Sie keine Wörter aus dem Wörterbuch, Namen von Filmen / Serien oder Namen von Ihnen nahestehenden Personen oder Haustieren."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_HEADER="Die Frontend- und Remote-Backup-Funktionen sind deaktiviert"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_INTRO="Ihr <em>Geheimschlüssel</em> ist unsicher und kann leicht erraten werden. Um Ihre Website zu schützen, hat Akeeba Backup den Zugriff auf Frontend- und Remote-Backup deaktiviert, bis Sie einen sicheren Geheimschlüssel eingeben. Das erkannte Problem ist:"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_RESET="Der Geheimschlüssel konnte nicht geändert werden"
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_TOOSHORT="Der Geheimschlüssel ist zu kurz. Verwenden Sie einen Geheimschlüssel mit mindestens 8 Zeichen."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_TOOSIMPLE="Der Geheimschlüssel ist zu einfach. Versuchen Sie, Klein- und Großbuchstaben, Zahlen und Satzzeichen zu verwenden."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_COMMON="Alternativ klicken Sie auf die Schaltfläche unten, um den Geheimschlüssel auf den vorgeschlagenen Wert <code>%s</code> zurückzusetzen. In beiden Fällen müssen Sie Ihre Remote-Backup-Dienste und/oder CRON-Jobs mit dem neuen Geheimschlüssel aktualisieren."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_JOOMLA="Bitte klicken Sie auf „Optionen", dann auf „Frontend", und geben Sie einen komplexeren Geheimschlüssel ein."
COM_AKEEBA_CPANEL_ERR_FESECRETWORD_WHATTODO_SOLO="Bitte klicken Sie auf „Systemkonfiguration", dann auf „Public API", und geben Sie einen komplexeren Geheimschlüssel ein."
COM_AKEEBA_CPANEL_ERR_INVALIDDOWNLOADID="Ungültiges Format der Download-ID. Bitte folgen Sie unseren Anweisungen, um Ihre Download-ID zu erhalten. Geben Sie in dieses Feld nicht Ihren Benutzernamen, Ihre E-Mail-Adresse oder Ihr Passwort ein."
COM_AKEEBA_CPANEL_ERR_MBSTRING_SOLO="<strong>Ihre PHP-Version hat die mbstring-Erweiterung nicht installiert oder aktiviert</strong>. Diese muss aktiviert sein, da sie eine Voraussetzung für Akeeba Solo ist. Akeeba Solo funktioniert möglicherweise nicht korrekt. Bitte bitten Sie Ihren Hoster, die mbstring-Erweiterung für PHP %s auf Ihrem Server zu aktivieren."
COM_AKEEBA_CPANEL_ERR_MBSTRING_WORDPRESS="<strong>Ihre PHP-Version hat die mbstring-Erweiterung nicht installiert oder aktiviert</strong>. Diese muss aktiviert sein, da sie eine Voraussetzung für WordPress ist. WordPress und Akeeba Backup funktionieren möglicherweise nicht korrekt. Bitte bitten Sie Ihren Hoster, die mbstring-Erweiterung für PHP %s auf Ihrem Server zu aktivieren."
COM_AKEEBA_CPANEL_ERR_UPDATE_STUCK="Wir haben festgestellt, dass eine oder mehrere Tabellen mit dem Präfix <strong>%sak_</strong> beschädigt sind. Akeeba Backup wird nicht korrekt funktionieren. Bitte bitten Sie Ihren Hoster, diese Tabellen zu reparieren, und <a href='%s'>klicken Sie dann hier</a>, damit Akeeba Backup seine Datenbanktabellen aktualisieren kann."
COM_AKEEBA_CPANEL_HEADER_ADVANCED="Erweiterte Operationen"
COM_AKEEBA_CPANEL_HEADER_INCLUDEEXCLUDE="Einschluss- und Ausschlussinformationen"
COM_AKEEBA_CPANEL_HEADER_QUICKBACKUP="Ein-Klick-Backup"
COM_AKEEBA_CPANEL_HEADER_TROUBLESHOOTING="Problembehandlung"
COM_AKEEBA_CPANEL_HEAD_OUTDIR_INSECURE="Unsicheres Ausgabeverzeichnis"
COM_AKEEBA_CPANEL_HEAD_OUTDIR_INSECURE_ALT="Möglicherweise unsicheres Ausgabeverzeichnis und Backup-Dateiname"
COM_AKEEBA_CPANEL_HEAD_OUTDIR_INVALID="Ungültiges Ausgabeverzeichnis"
COM_AKEEBA_CPANEL_HEAD_OUTDIR_UNFIXABLE="Nicht behebbares Sicherheitsproblem beim Ausgabeverzeichnis"
COM_AKEEBA_CPANEL_LABEL_STATUSDETAILS="Statusdetails"
COM_AKEEBA_CPANEL_LABEL_STATUSSUMMARY="Statuszusammenfassung"
COM_AKEEBA_CPANEL_LBL_INCLUDEEXCLUDE_CALLOUT="Einschluss- und Ausschlussoptionen werden nur auf das aktive Backup-Profil angewendet."
COM_AKEEBA_CPANEL_LBL_OUTDIR_CLICKTHEBUTTON="Klicken Sie auf die Schaltfläche unten, um dieses Problem zu beheben. Folgendes wird dabei ausgeführt."
COM_AKEEBA_CPANEL_LBL_OUTDIR_DELETEORBEHACKED="Bis Sie dies getan haben, empfehlen wir <strong>DRINGENDST</strong>, kein Backup Ihrer Website zu erstellen, und falls Sie bereits eines erstellt haben, alle Backup-Archive und Backup-Protokolldateien zu löschen. <strong>WENN SIE DIESE ANWEISUNGEN NICHT BEFOLGEN, WIRD IHRE WEBSITE MIT GROSSER WAHRSCHEINLICHKEIT KOMPROMITTIERT (GEHACKT).</strong>"
COM_AKEEBA_CPANEL_LBL_OUTDIR_FILEREADABLE="Akeeba Backup hat festgestellt, dass sich Ihr Backup-Ausgabeverzeichnis <code>%s</code> unterhalb des Webstammverzeichnisses Ihrer Website befindet. Sein Inhalt, einschließlich Ihrer Backup-Archive, ist über das Internet zugänglich. Es ist jedoch NICHT möglich, die Dateien im Verzeichnis mit einem Webbrowser aufzulisten. <strong>Dies kann ein Sicherheitsproblem darstellen</strong>. Ein Angreifer kann den Namen des Backup-Archivs erraten und es direkt herunterladen, wodurch die Sicherheit Ihrer Website umgangen wird."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_RANDOM="Ihr „Backup-Ausgabedateiname" wird so geändert, dass er die Variable <code>[RANDOM]</code> enthält. Dadurch wird das Erraten von Backup-Dateinamen praktisch unmöglich, da bei jedem Backup 16 verschiedene, zufällige Buchstaben und/oder Zahlen zum Dateinamen des Backup-Archivs hinzugefügt werden."
COM_AKEEBA_CPANEL_LBL_OUTDIR_FIX_SECURITYFILES="Eine <code>.htaccess</code>- und eine <code>web.config</code>-Datei werden in diesen Ordner geschrieben. Auf den meisten Servern reicht dies aus, um direkte Web-Downloads von Dateien darin zu verhindern und das Auflisten der Dateien zu deaktivieren. Wir haben auch eine Lösung für Server, auf denen diese speziellen Dateien keine Wirkung haben. Drei weitere Dateien mit den Namen <code>index.php</code>, <code>index.html</code> und <code>index.htm</code> werden ebenfalls in diesen Ordner geschrieben. Diese Indexdateien verhindern, dass der Webserver die Namen der Backup-Archive und Backup-Protokolldateien auflistet."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM="Darüber hinaus ist Ihr Ausgabeverzeichnis identisch mit oder ein Unterverzeichnis eines Ordners, der von Ihrer Website für öffentlich zugängliche System- oder Drittanbieterdateien verwendet wird."
COM_AKEEBA_CPANEL_LBL_OUTDIR_ISSYSTEM_FIX="Sie müssen zur Konfigurationsseite von Akeeba Backup wechseln und ein anderes Ausgabeverzeichnis auswählen."
COM_AKEEBA_CPANEL_LBL_OUTDIR_LISTABLE="Akeeba Backup hat festgestellt, dass sich Ihr Backup-Ausgabeverzeichnis <code>%s</code> unterhalb des Webstammverzeichnisses Ihrer Website befindet. Sein Inhalt, einschließlich Ihrer Backup-Archive, ist über das Internet zugänglich. Darüber hinaus ist es möglich, die Dateien im Verzeichnis aufzulisten, d. h. es zeigt beim Aufruf mit einem Webbrowser eine Liste Ihrer Backup-Archive an. <strong>Dies ist ein erhebliches Sicherheitsproblem</strong>. Ein Angreifer kann über einen Webbrowser auf diesen Ordner zugreifen und Ihre Backup-Archive direkt herunterladen, wodurch die Sicherheit Ihrer Website umgangen wird."
COM_AKEEBA_CPANEL_LBL_OUTDIR_TRASHHOST="Leider unterstützt Ihr Server keine vernünftige Methode zur Absicherung des Verzeichnisses. Unabhängig von unseren Maßnahmen wird es immer die Namen der enthaltenen Dateien auflisten und das Herunterladen aus dem Browser ermöglichen. Ihre einzige Option besteht darin, ein Backup-Ausgabeverzeichnis oberhalb des Stammverzeichnisses Ihrer Website zu erstellen."
COM_AKEEBA_CPANEL_LBL_STATUS_ERROR="Erkannte Fehler verhindern den beabsichtigten Betrieb"
COM_AKEEBA_CPANEL_LBL_STATUS_OK="Akeeba Backup ist bereit, Ihre Website zu sichern"
COM_AKEEBA_CPANEL_LBL_STATUS_WARNING="Akeeba Backup ist bereit, Ihre Website zu sichern, aber es gibt potenzielle Probleme"
