COM_AKEEBA_TRANSFER_LBL_CHUNKSIZE_INFO="Die Backup-Archivdateien werden in kleinen Datenblöcken auf den Remote-Server übertragen. Dies legt die Größe dieser Datenblöcke fest. Zu kleine Größen können dazu führen, dass der Remote-Server Sie blockiert und Sie als Missbraucher einstuft, was zu einem Upload-Fehler führt. Zu große Größen können zu einem Zeitüberschreitungsfehler auf dem Quell- oder dem Remote-Server führen, was einen AJAX-Fehler verursacht. Typischerweise funktionieren Werte zwischen 5M und 20M am besten."
