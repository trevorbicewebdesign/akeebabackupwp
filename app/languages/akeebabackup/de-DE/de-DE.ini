COM_AKEEBA_BACKUP_TEXT_SOLVEISSUE_PRO="Wenn dies nicht hilft, zögern Sie bitte nicht, in unserem <a href=\"%s\">Support-Ticket-System</a> um Unterstützung zu bitten. Bitte beachten Sie, dass Sie ein aktives Abonnement benötigen, um Unterstützung über das Ticket-System anzufordern. Wenn Akeeba Backup Professional von einem Dritten – z. B. Ihrem Webentwickler – auf Ihrer Website installiert wurde, wenden Sie sich bitte nicht an Akeeba Ltd, um Support zu erhalten. Wenden Sie sich stattdessen an die Person, die die Software auf Ihrer Website installiert hat, und bitten Sie um Hilfe bei der Lösung dieses Problems."
