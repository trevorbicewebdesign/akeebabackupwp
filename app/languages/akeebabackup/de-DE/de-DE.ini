COM_AKEEBA_RESTORE_LABEL_ZAPBEFORE_HELP="Versucht, alle vorhandenen Dateien und Ordner im Stammverzeichnis Ihrer Website zu löschen, bevor das Backup-Archiv entpackt wird. Es wird NICHT berücksichtigt, welche Dateien und Ordner im Backup-Archiv vorhanden sind oder welche Dateien und Ordner beim Backup ausgeschlossen wurden. Durch diese Funktion gelöschte Dateien und Ordner können NICHT wiederhergestellt werden. <strong>WARNUNG! DADURCH KÖNNEN DATEIEN UND ORDNER GELÖSCHT WERDEN, DIE NICHT ZU IHRER WEBSITE GEHÖREN. DIESE FUNKTION IST NUR FÜR SEHR ERFAHRENE BENUTZER GEDACHT, DIE DIE RISIKEN VERSTEHEN. MIT ÄUSSERSTER VORSICHT VERWENDEN. DURCH AKTIVIERUNG DIESER FUNKTION ÜBERNEHMEN SIE DIE VOLLE VERANTWORTUNG UND HAFTUNG. DARÜBER HINAUS VERZICHTEN SIE AUF JEGLICHES RECHT, SUPPORT VON Akeeba Ltd ZU BEANTRAGEN.</strong>"
