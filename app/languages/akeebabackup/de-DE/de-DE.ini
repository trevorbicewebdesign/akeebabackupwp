COM_AKEEBA_ALICE_ANALYSIS_REPORT_LBL_NEXTSTEPS="Falls die oben vorgeschlagene Lösung Ihr Problem nicht behoben hat und Sie ein aktives Support-Abonnement auf unserer Website haben, reichen Sie bitte eine Support-Anfrage ein, die Folgendes enthält: 1. eine ZIP-Datei mit Ihrer Backup-Protokolldatei; und 2. den Text auf dieser Seite. Bitte senden Sie <em>nur</em> diese Informationen, da dies unsere Antworten verlangsamt und weniger genau macht. Versuchen Sie auch, Ihr Backup-Problem ausführlicher zu beschreiben, z. B. warum Sie glauben, dass ein Problem vorliegt, wann das Problem begann, welche Korrekturmaßnahmen Sie selbst ergriffen haben und welche Informationen Ihrer Meinung nach dazu beitragen könnten, uns besser zu verstehen, was vor sich geht."
