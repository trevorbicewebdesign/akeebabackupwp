COM_AKEEBA_CONFIG_ADVANCED_SBALF_DESC="Akeeba Backup unterbricht den Verarbeitungsschritt nach der Archivierung einer großen Datei. Wenn Sie diese Option aktivieren, arbeitet Akeeba Backup schneller. Dies kann jedoch zu Zeitüberschreitungen oder internen Serverfehlern führen."
