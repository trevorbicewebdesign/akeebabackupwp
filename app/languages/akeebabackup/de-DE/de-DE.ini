SOLO_CONFIG_PLATFORM_DBPORT_DESCRIPTION="(Optional) Der Port, auf dem der Datenbankserver lauscht. Wenn Sie sich nicht sicher sind, lassen Sie dieses Feld leer, um den Standardport zu verwenden (z. B. 3306 für MySQL-Server)."
SOLO_CONFIG_PLATFORM_DBPORT_TITLE="Port des Datenbankservers"
SOLO_CONFIG_PLATFORM_DBPREFIX_DESCRIPTION="Das gemeinsame Tabellennamen-Präfix der zu sichernden Datenbank einschließlich des Unterstrichs, z. B. <tt>jos_</tt>, <tt>wp_</tt>, <tt>phpbb_</tt> usw. Wenn Ihre Webanwendung kein gemeinsames Tabellennamen-Präfix verwendet, lassen Sie dieses Feld leer."
SOLO_CONFIG_PLATFORM_DBPREFIX_TITLE="Präfix"
SOLO_CONFIG_PLATFORM_DBUSERNAME_DESCRIPTION="Der Benutzername für die Verbindung zur Datenbank."
SOLO_CONFIG_PLATFORM_DBUSERNAME_TITLE="Benutzername"
