COM_AKEEBA_MIGREIGHT_NEEDED_WHY="WordPress löscht bei jeder Aktualisierung immer den Ordner des Plugins. Infolgedessen gehen alle unter dem Plugin-Ordner gespeicherten Backup-Archive <em>für immer verloren</em>. Dies wäre dasselbe, als hätten Sie nie ein Backup erstellt."
