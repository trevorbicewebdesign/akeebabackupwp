SOLO_MAIN_ERR_CONFIGREADABLE_BODY="Es wurde festgestellt, dass Ihre Akeeba Solo-Konfigurationsdatei über das Web unter der URL <code>%s</code> lesbar ist. Dies kann ein <strong>sehr ernstes</strong> Sicherheitsrisiko darstellen. Wir empfehlen Ihnen dringend, unsere Dokumentationsanweisungen zu befolgen, um das Verzeichnis, das diese Datei enthält, zu sichern."
SOLO_MAIN_ERR_CONFIGREADABLE_HEAD="Ihre Konfigurationsdatei ist über das Web lesbar"
SOLO_MAIN_ERR_NOTINCORE="Diese Funktion ist in der Core-Version nicht verfügbar. Bitte abonnieren Sie die Professional-Version, um diese Funktion zu erhalten."
SOLO_MAIN_ERR_OUTPUTREADABLE_BODY="Es wurde festgestellt, dass Ihr Backup-Ausgabeverzeichnis über das Web unter der URL <code>%s</code> lesbar ist. Dies kann ein <strong>sehr ernstes</strong> Sicherheitsrisiko darstellen. Wir empfehlen Ihnen dringend, unsere Dokumentationsanweisungen zu befolgen, um das Backup-Ausgabeverzeichnis zu sichern oder ein Verzeichnis außerhalb Ihres Web-Stammverzeichnisses zu wählen."
SOLO_MAIN_ERR_OUTPUTREADABLE_HEAD="Ihr Backup-Ausgabeverzeichnis ist über das Web lesbar"
SOLO_MAIN_LBL_HEAD_BACKUPOPS="Hauptoperationen"
SOLO_MAIN_LBL_HEAD_SYSOPS="Systemeinstellungen"
SOLO_MAIN_LBL_LATEST_BACKUP="Letztes Backup"
SOLO_MAIN_LBL_NEEDSUPGRADE="<strong>Die Eingabe der Download-ID ist nicht ausreichend, um die erweiterten Funktionen von Akeeba Solo Professional zu aktivieren</strong>. Sie müssen das Akeeba Solo Professional-Paket auf Ihrer Website zusätzlich zu Akeeba Solo Core herunterladen und installieren, ohne die Core-Version zu deinstallieren."
SOLO_MAIN_LBL_STATUS_ERROR="Hochpriorisierte Probleme verhindern die Erstellung eines Backups"
SOLO_MAIN_LBL_STATUS_OK="Akeeba Solo ist bereit, ein Backup zu erstellen"
SOLO_MAIN_LBL_STATUS_WARNING="Mögliche Probleme erkannt, die die Erstellung eines Backups verhindern könnten"
SOLO_MAIN_LBL_SYSCONFIG="Systemkonfiguration"
SOLO_MAIN_LBL_SYSMANAGEMENT="Systemverwaltung"
SOLO_MAIN_LBL_USERS="Benutzerverwaltung"
SOLO_MAIN_LBL_WHYSUBSCRIBE="Akeeba Solo Professional verfügt über viele zusätzliche, nützliche Funktionen wie <b>integrierte Backup-Wiederherstellung</b>, das Importieren von Backup-Archiven von Amazon S3 oder Ihrem Server, <b>automatische Übertragung Ihrer Backups in den Cloud-Speicher (Amazon S3, Dropbox, Box.com und über 40 weitere Dienste)</b>, erweiterte Ein-/Ausschlussfilter und vieles mehr! Abonnenten der Professional-Version erhalten außerdem vorrangigen Support durch die Entwickler der Software auf unserer Website."
SOLO_MAIN_TITLE="Startseite"
SOLO_MANAGE_BTN_DELETE="Löschen"
SOLO_MANAGE_FIELD_DESCRIPTION="Beschreibung"
SOLO_MANAGE_LBL_CANCELMODAL="Schließen"
SOLO_MANAGE_LBL_HOWDOIRESTORE_CORE="Nutzer der kostenlosen (Core-)Version können ihre Backups nur manuell mit Akeeba Kickstart oder Akeeba eXtract Wizard wiederherstellen. Weitere Informationen finden Sie in <a href='%s'>unserer Dokumentation</a>. Bitte abonnieren Sie die Professional-Version, um Zugang zur wesentlich einfacher zu bedienenden integrierten Wiederherstellungsfunktion zu erhalten!"
SOLO_MANAGE_LBL_HOWDOIRESTORE_PRO="Sie können ein Backup aus der folgenden Liste auswählen und auf die Schaltfläche „Wiederherstellen" klicken. Für die Wiederherstellung auf einem anderen Server oder für weitere Details zum Wiederherstellungsvorgang <a href='%s'>konsultieren Sie bitte unsere Dokumentation</a>."
SOLO_MANAGE_TITLE="Backups verwalten"
SOLO_NO="Nein"
SOLO_NOTYETRESTORED_BTN_FINISH_RESTORING="Wiederherstellung des Backups dieser Website abschließen"
SOLO_NOTYETRESTORED_HEAD_STILLSEETHIS="Sehen Sie diese Seite noch nach der Wiederherstellung Ihres Backups?"
SOLO_NOTYETRESTORED_HEAD_WHYSEETHIS="Warum sehe ich diese Seite anstelle meiner Website?"
SOLO_NOTYETRESTORED_PAGE_TITLE="Die Wiederherstellung dieser Website ist nicht abgeschlossen"
SOLO_NOTYETRESTORED_STILLSEETHIS_LBL_P1="Bitte verwenden Sie FTP oder den Dateimanager Ihres Website-Kontrollpanels, um den Ordner <code>installation</code> von Ihrer Website zu entfernen. Dadurch verschwindet diese Seite und Sie sehen Ihre Website wieder."
SOLO_NOTYETRESTORED_STILLSEETHIS_LBL_P2="Wenn Sie das gerade getan haben und der Ordner „installation" im Stammverzeichnis Ihrer Website (wo sich Ihre wp-config.php-Datei befindet) nicht vorhanden ist, haben Sie wahrscheinlich ein CDN oder einen Cache vor Ihrer Website. Bitte kontaktieren Sie Ihren Hoster und fragen Sie nach der korrekten Vorgehensweise, um diesen Cache zu leeren oder zurückzusetzen, damit Sie Ihre Website anstatt dieser Seite sehen."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P1="Ein auf Ihrer Website installiertes Plugin hat festgestellt, dass sich derzeit ein Ordner namens <code>installation</code> im Stammverzeichnis Ihrer Website befindet und dass dieser Installationsordner eine Kopie des Backup-Wiederherstellungsskripts ANGIE enthält."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P2="Das bedeutet, dass Sie ein Website-Backup entpackt, aber die Wiederherstellung noch nicht abgeschlossen haben. Ihre Website funktioniert noch nicht ordnungsgemäß."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P3="Sie müssen die Wiederherstellung abschließen, indem Sie das Wiederherstellungsskript im Ordner „installation" Ihrer Website ausführen. Wenn Sie nicht sicher sind, wie das geht, klicken Sie bitte auf die Schaltfläche unten."
SOLO_NOTYETRESTORED_WHYSEETHIS_LBL_P4="Nachdem Sie die Website wiederhergestellt haben, entfernen Sie bitte den Ordner „installation" von Ihrer Website. In den meisten Fällen wird Sie das Wiederherstellungsskript dazu auffordern. Wenn dabei ein Fehler gemeldet wird, lesen Sie bitte den Rest dieser Seite."
SOLO_OFF="Aus"
