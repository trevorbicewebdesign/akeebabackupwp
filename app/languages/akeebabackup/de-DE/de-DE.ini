COM_AKEEBA_ALICE_ERR_ANALYZEFAILED_HEADER="Protokollanalyse fehlgeschlagen"
COM_AKEEBA_ALICE_ERR_ANALYZEFAILED_INFO="Die Protokollanalyse wurde abgebrochen. Der Protokollanalysator hat folgenden Fehler gemeldet:"
COM_AKEEBA_ALICE_ERR_CANNOT_OPEN_LOGFILE="Analyse der Protokolldatei fehlgeschlagen: Die Protokolldatei %s konnte nicht zum Lesen geöffnet werden."
COM_AKEEBA_ALICE_ERR_NOLOGS="Es wurden keine Protokolldateien für <strong>fehlgeschlagene</strong> Backups gefunden."
COM_AKEEBA_ALICE_HEAD_ONLYFAILED="ALICE arbeitet nur mit <em>fehlgeschlagenen</em> Backups"
COM_AKEEBA_ALICE_LBL_ONLYFAILED_IFNOFAILED="Falls Ihr Backup fehlgeschlagen ist, Sie es aber auf dieser Seite nicht sehen, warten Sie bitte <em>drei (3) Minuten</em>, kehren Sie zur Akeeba Backup-Systemsteuerungsseite zurück und navigieren Sie dann erneut hierher. Dafür gibt es einen Grund: In manchen Fällen wird der Backup-Fehler durch einen Serverfehler verursacht. In diesen Fällen wird das Backup als noch in Bearbeitung markiert statt als fehlgeschlagen, da PHP die Ausführung beendet und unser PHP-Code, der das Backup als fehlgeschlagen markieren würde, keine Gelegenheit hatte, zu laufen. Wenn Sie die Systemsteuerungsseite besuchen, wird jedes Backup, das seit mehr als 3 Minuten als noch in Bearbeitung markiert ist, als fehlgeschlagen markiert. Daher ist es notwendig, zu warten und <em>dann</em> zur Systemsteuerungsseite zurückzukehren."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_SHOWINGLOGS="ALICE ist ein Tool zur Analyse der Protokolldateien <em>fehlgeschlagener</em> Backups und gibt Ihnen – in den meisten Fällen – die wahrscheinlichste Ursache für den Backup-Fehler an. Es ist nicht dafür vorgesehen, Protokolldateien erfolgreicher Backups zu analysieren. Dies würde unsinnige, irreführende oder schlichtweg falsche Ergebnisse liefern. Aus diesem Grund zeigen wir Ihnen nur die Protokolldateien <em>fehlgeschlagener</em> Backups."
COM_AKEEBA_ALICE_LBL_ONLYFAILED_WHATISFAILED="Bitte beachten Sie, dass Backups, bei denen das Hochladen des Backup-Archivs in den Remote-Speicher nicht abgeschlossen wurde, nicht als fehlgeschlagen gelten. Die eigentliche Ursache für solche Probleme kann von ALICE ohnehin nicht erkannt werden. Bei dieser Art von Problem müssen Sie ein Support-Ticket im Support-Bereich unserer Website einreichen. Falls Akeeba Backup Professional von einer anderen Person auf Ihrer Website installiert wurde, wenden Sie sich bitte stattdessen an diese Person; in diesem Fall können Sie kein Support-Ticket auf unserer Website einreichen."
COM_AKEEBA_BACKUP="Jetzt sichern"
COM_AKEEBA_BACKUP_ANALYSELOG="Protokolldatei analysieren (ALICE)"
COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_1="Ihr Backup-Wiederherstellungsskript (ANGIE) ist nur zugänglich, wenn Sie das Passwort eingeben, das Sie auf der vorherigen Seite vor dem Klicken auf die Schaltfläche „Jetzt sichern" festgelegt haben. Falls Sie sich nicht erinnern, ein Passwort festgelegt zu haben, hat Ihr Browser das Passwort auf der Konfigurationsseite <strong>ohne Ihre Zustimmung</strong> automatisch ausgefüllt. Dies wird von vielen Passwortmanagern und Browsern so gehandhabt."
COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_2="Moderne Browser und Passwortmanager erlauben es uns nicht, dieses Verhalten zu unterbinden. Wir haben eine JavaScript-Schutzmaßnahme gegen dieses Art des unerwünschten automatischen Ausfüllens des Passwortfeldes auf der Konfigurationsseite eingerichtet. Wenn Sie die Konfigurationsseite jedoch innerhalb von etwa einer halben Sekunde nach dem Laden speichern, hat diese Schutzmaßnahme keine Gelegenheit, zu aktivieren."
COM_AKEEBA_BACKUP_ANGIE_PASSWORD_WARNING_HEADER="WARNUNG: Sie haben ein ANGIE-Passwort festgelegt"
COM_AKEEBA_BACKUP_DEFAULT_DESCRIPTION="Backup erstellt am"
COM_AKEEBA_BACKUP_ERROR_UNWRITABLEOUTPUT_AUTOBACKUP="Das automatische Backup kann nicht gestartet werden, da Ihr Ausgabeverzeichnis nicht beschreibbar ist. Bitte befolgen Sie die nachstehenden Anweisungen, um dieses Problem zu beheben."
COM_AKEEBA_BACKUP_ERROR_UNWRITABLEOUTPUT_COMMON="Um dieses Problem zu beheben, besuchen Sie bitte die <a href=\"%s\">Konfigurationsseite</a> und setzen Sie das Ausgabeverzeichnis auf <tt>[DEFAULT_OUTPUT]</tt> (in Großbuchstaben, einschließlich der eckigen Klammern). Falls dies immer noch nicht funktioniert, lesen Sie bitte <a href=\"%s\">unsere Anweisungen zur Fehlerbehebung</a>."
COM_AKEEBA_BACKUP_ERROR_UNWRITABLEOUTPUT_NORMALBACKUP="Akeeba Backup kann kein Backup Ihrer Website erstellen, da das Ausgabeverzeichnis nicht beschreibbar ist. Bitte befolgen Sie die nachstehenden Anweisungen, um dieses Problem zu beheben."
