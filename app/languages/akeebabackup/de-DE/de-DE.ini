SOLO_SETUP_LBL_ADBLOCK_WARNING="Auf dieser Website ist derzeit ein Werbe- oder Skriptblocker aktiviert. Sie sollten ihn für diese Domain deaktivieren, wenn Sie Probleme haben (z. B. wenn Schnittstellenschaltflächen nicht funktionieren)"
SOLO_SETUP_LBL_ANCIENTIENOTICE="Sie verwenden eine alte, nicht unterstützte Version des Internet Explorers. Bitte aktualisieren Sie auf <a href='%s'>die neueste Version</a> des Internet Explorers. Wenn diese für Ihre Windows-Version nicht verfügbar ist, verwenden Sie bitte einen modernen, standardkonformen Browser wie <a href='%s'>Chrome</a>. Auch wenn Sie die Installation mit Ihrer alten, nicht unterstützten Version des Internet Explorers möglicherweise fortsetzen können, können wir kein problemloses Akeeba Solo-Erlebnis garantieren."
SOLO_SETUP_LBL_APPSETUP="Anwendungskonfiguration"
SOLO_SETUP_LBL_BACKUPONUPDATE="Backup bei Aktualisierung"
SOLO_SETUP_LBL_BACKUPONUPDATE_CORE="Backup bei manueller WordPress-Aktualisierung"
SOLO_SETUP_LBL_BACKUPONUPDATE_CORE_DESC="Führt automatisch ein Backup durch, wenn ein Benutzer WordPress manuell über das Dashboard aktualisiert"
SOLO_SETUP_LBL_BACKUPONUPDATE_CORE_PROFILE="Zu verwendendes Profil"
SOLO_SETUP_LBL_BACKUPONUPDATE_CORE_PROFILE_DESC="Backup-Profil für manuelle WordPress-Aktualisierungen"
SOLO_SETUP_LBL_CLICK_TO_SHOW_HIDE="Klicken zum Ein-/Ausblenden"
SOLO_SETUP_LBL_CURRENT_SETTING="Aktuell"
SOLO_SETUP_LBL_DATABASE_DBENCRYPTION="Mit einem SSL-Zertifikat verbinden"
SOLO_SETUP_LBL_DATABASE_DBENCRYPTION_HELP="Soll die Verbindung zur Datenbank über ein SSL-Zertifikat hergestellt werden? Dies kann anstelle der Authentifizierung mit Benutzername und Passwort (verschlüsselte Verbindung mit Zertifikatsauthentifizierung) oder <em>zusätzlich zur</em> Authentifizierung mit Benutzername und Passwort (verschlüsselte Verbindung mit Passwortauthentifizierung) verwendet werden. Wenn Sie nicht wissen, was das bedeutet, setzen Sie diese Option auf „Nein" und ignorieren Sie auch die nächsten Optionen."
SOLO_SETUP_LBL_DATABASE_DBSSLCA="Zertifizierungsstellen-(CA-)Datei"
SOLO_SETUP_LBL_DATABASE_DBSSLCA_HELP="Absoluter Dateipfad zur PEM-Datei des Zertifizierungsstellen-(CA-)Zertifikats Ihres Datenbankservers, z. B. <code>/home/myuser/ca.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT="Öffentlicher Schlüssel (Zertifikat) des Datenbankbenutzers"
SOLO_SETUP_LBL_DATABASE_DBSSLCERT_HELP="Absoluter Dateipfad zur PEM-Datei des öffentlichen Schlüssels (Zertifikats) Ihres Datenbankbenutzers, z. B. <code>/home/myuser/myuser.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER="SSL/TLS-Verschlüsselungsmethoden"
SOLO_SETUP_LBL_DATABASE_DBSSLCIPHER_HELP="Geben Sie eine durch Doppelpunkte getrennte Liste von Verschlüsselungsmethoden für die Verbindung mit SSL-Zertifikaten ein. Wenn das Feld leer gelassen wird, wird die Standardliste (<code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>) verwendet (empfohlen)."
SOLO_SETUP_LBL_DATABASE_DBSSLKEY="Privater Schlüssel des Datenbankbenutzers"
SOLO_SETUP_LBL_DATABASE_DBSSLKEY_HELP="Absoluter Dateipfad zur PEM-Datei des privaten Schlüssels Ihres Datenbankbenutzers, z. B. <code>/home/myuser/myuser-key.pem</code>"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT="Serverzertifikat verifizieren"
SOLO_SETUP_LBL_DATABASE_DBSSLVERIFYSERVERCERT_HELP="Setzen Sie dies auf Ja, um das Zertifikat zu überprüfen, das der Server an uns zurücksendet. Die Überprüfung erfolgt anhand der von Ihnen angegebenen Zertifizierungsstellen-Datei (CA). Wenn Sie Verbindungsfehler erhalten, setzen Sie dies auf Nein; einige Konfigurationen (insbesondere die durch <code>mysql_ssl_rsa_setup</code> generierten) können eine Verbindung verweigern, wenn die Zertifikatsprüfung aktiviert ist. Wenn Sie die Überprüfung aktivieren und das CA-Datei-Feld leer lassen, wird das Serverzertifikat anhand der Ihrem Server bekannten Zertifizierungsstellen-Dateien überprüft; siehe die PHP-Optionen <code>openssl.cafile</code> und <code>openssl.capath</code>."
SOLO_SETUP_LBL_DATABASE_DRIVER="Datenbanktyp"
SOLO_SETUP_LBL_DATABASE_DRIVER_HELP="Dies ist normalerweise MySQLi (<em>mit</em> dem abschließenden „i")"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQL="MySQL (veralteter Treiber für MySQL – Verwendung vermeiden)"
SOLO_SETUP_LBL_DATABASE_DRIVER_MYSQLI="MySQLi (bevorzugter Treiber für MySQL)"
SOLO_SETUP_LBL_DATABASE_DRIVER_NONE="Ohne"
SOLO_SETUP_LBL_DATABASE_DRIVER_PDO="PDO"
SOLO_SETUP_LBL_DATABASE_DRIVER_PDOMYSQL="MySQL (PDO)"
SOLO_SETUP_LBL_DATABASE_DRIVER_SQLAZURE="Windows Azure SQL Database"
SOLO_SETUP_LBL_DATABASE_DRIVER_SQLITE="SQLite"
SOLO_SETUP_LBL_DATABASE_HOST="Hostname des Datenbankservers"
SOLO_SETUP_LBL_DATABASE_HOST_HELP="Der Hostname oder die IP-Adresse des Datenbankservers (in der Regel: localhost). Bitte beachten Sie, dass localhost und 127.0.0.1 aus Sicht von MySQL <em>sehr</em> unterschiedlich sind; möglicherweise müssen Sie beide ausprobieren, um herauszufinden, welche mit Ihrem Datenbankserver funktioniert. Wenn Ihr Server einen nicht standardmäßigen Port verwendet, hängen Sie diesen nach dem Hostnamen mit einem Doppelpunkt an, z. B. 127.0.0.1:1234, um einen Datenbankserver auf 127.0.0.1 zu verwenden, der auf Port 1234 lauscht."
SOLO_SETUP_LBL_DATABASE_INFO="Akeeba Solo benötigt eine Datenbank, um seine Konfigurationseinstellungen und ein Protokoll aller Backup-Versuche zu speichern. Bitte geben Sie die Verbindungsparameter zur Datenbank unten an. Sie können entweder dieselbe Datenbank wie die Website verwenden, die Sie sichern möchten, oder eine dedizierte Datenbank nur für Akeeba Solo (empfohlen)."
SOLO_SETUP_LBL_DATABASE_NAME="Datenbankname"
SOLO_SETUP_LBL_DATABASE_NAME_HELP="Der Name Ihrer Datenbank. Die meisten Anbieter, die cPanel, Plesk und andere gängige Hosting-Panels verwenden, vergeben Datenbanknamen wie abcdef_benutzername, wobei abcdef Ihr Benutzername im Hosting-Kontrollzentrum ist. Wenn Sie sich nicht sicher sind, wenden Sie sich bitte an Ihren Anbieter."
SOLO_SETUP_LBL_DATABASE_PASS="Passwort"
SOLO_SETUP_LBL_DATABASE_PASS_HELP="Das Passwort, das Sie verwenden, um eine Verbindung zu Ihrer Datenbank herzustellen."
SOLO_SETUP_LBL_DATABASE_PREFIX="Präfix der Datenbanktabellennamen"
SOLO_SETUP_LBL_DATABASE_PREFIX_HELP="Das gemeinsame Tabellennamen-Präfix aller Datenbanktabellen dieser Akeeba Solo-Installation. Sie können es ändern, wenn mehrere Akeeba Solo-Installationen dieselbe Datenbank verwenden."
SOLO_SETUP_LBL_DATABASE_USER="Benutzername"
SOLO_SETUP_LBL_DATABASE_USER_HELP="Der Benutzername, den Sie verwenden, um eine Verbindung zu Ihrer Datenbank herzustellen. Die meisten Anbieter, die cPanel, Plesk und andere gängige Hosting-Panels verwenden, vergeben Benutzernamen wie abcdef_benutzername, wobei abcdef Ihr Benutzername im Hosting-Kontrollzentrum ist. Wenn Sie sich nicht sicher sind, wenden Sie sich bitte an Ihren Anbieter."
SOLO_SETUP_LBL_FS_DRIVER="Dateisystem-Treiber"
SOLO_SETUP_LBL_FS_DRIVER_FILE="Direkte Dateischreibvorgänge"
SOLO_SETUP_LBL_FS_DRIVER_FTP="FTP-Modus – File Transfer Protocol"
SOLO_SETUP_LBL_FS_DRIVER_HELP="Bei vielen Shared-Hosting-Anbietern müssen Sie einen der in dieser Dropdown-Liste verfügbaren (S)FTP-Modi verwenden – und Ihre (S)FTP-Parameter in die Felder eingeben, die bei dieser Auswahl erscheinen –, um sicherzustellen, dass Akeeba Solo ordnungsgemäß in seine Dateien schreiben kann. Nicht alle Anbieter unterstützen SFTP. Sie benötigen sowohl SFTP-Unterstützung auf dem Server als auch die installierte PHP-Erweiterung mod_ssh2."
SOLO_SETUP_LBL_FS_DRIVER_SFTP="SFTP-Modus – Secure File Transfer Protocol (über SSH)"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY="(S)FTP-Verzeichnis"
SOLO_SETUP_LBL_FS_FTP_DIRECTORY_HELP="Das (S)FTP-Verzeichnis zur Akeeba Solo-Installation. Auf FTP-Servern ist dies nicht dasselbe wie der Dateisystempfad. Wenn Sie sich nicht sicher sind, fragen Sie Ihren Anbieter."
SOLO_SETUP_LBL_FS_FTP_HOST="(S)FTP-Server-Hostname"
SOLO_SETUP_LBL_FS_FTP_HOST_HELP="Der Hostname oder die IP-Adresse Ihres (S)FTP-Servers, z. B. <code>ftp.example.com</code> oder <code>127.0.0.1</code>. Sie MÜSSEN diesen <em>ohne</em> das Präfix <code>ftp://</code>, <code>sftp://</code> oder <code>ssh://</code> eingeben. Wenn Sie sich bei dieser und den anderen FTP-Einstellungen nicht sicher sind, wenden Sie sich bitte an Ihren Anbieter."
SOLO_SETUP_LBL_FS_FTP_PASSIVE="Passiven Modus verwenden"
SOLO_SETUP_LBL_FS_FTP_PASSIVE_HELP="Gilt nur für FTP, wird für SFTP ignoriert. Wenn ausgewählt, verwendet Akeeba Solo den passiven FTP-Modus. Die meisten FTP-Server erfordern diesen. Wenn Ihr Anbieter den aktiven FTP-Modus erfordert, deaktivieren Sie dieses Kontrollkästchen. Wenn Sie sich nicht sicher sind, wenden Sie sich bitte an Ihren Anbieter."
SOLO_SETUP_LBL_FS_FTP_PASSWORD="(S)FTP-Passwort"
SOLO_SETUP_LBL_FS_FTP_PASSWORD_HELP="Das Passwort, das Sie verwenden, um eine Verbindung zu Ihrem (S)FTP-Server herzustellen. Wenn Sie sich nicht sicher sind, fragen Sie Ihren Anbieter."
SOLO_SETUP_LBL_FS_FTP_PORT="(S)FTP-Server-Port"
SOLO_SETUP_LBL_FS_FTP_PORT_HELP="Die Portnummer, auf der Ihr (S)FTP-Server lauscht. In der Regel ist es 21 für FTP und 22 für SFTP. Wenn Sie sich nicht sicher sind, fragen Sie Ihren Anbieter."
SOLO_SETUP_LBL_FS_FTP_SSL="SSL verwenden"
SOLO_SETUP_LBL_FS_FTP_SSL_HELP="Gilt nur für FTP, wird für SFTP ignoriert. Wenn ausgewählt, verwendet Akeeba Solo FTP über Explicit SSL (FTP/S). Bitte beachten Sie, dass dies nicht mit SFTP zu verwechseln ist, welches eine völlig andere Sache ist."
SOLO_SETUP_LBL_FS_FTP_USERNAME="(S)FTP-Benutzername"
SOLO_SETUP_LBL_FS_FTP_USERNAME_HELP="Der Benutzername, den Sie verwenden, um eine Verbindung zu Ihrem (S)FTP-Server herzustellen. Wenn Sie sich nicht sicher sind, fragen Sie Ihren Anbieter."
SOLO_SETUP_LBL_LIVESITE="URL zu Akeeba Solo"
SOLO_SETUP_LBL_LIVESITE_HELP="Auf den meisten Servern können Sie dieses Feld leer lassen, und es wird automatisch bestimmt. Wenn Ihr Server zu der Minderheit gehört, bei der dies nicht funktioniert, geben Sie bitte die URL zu Akeeba Solo manuell an."
SOLO_SETUP_LBL_MANUALCONFIGINSTRUCTIONS="Markieren Sie den gesamten Text unten und kopieren Sie ihn in eine neue Nur-Text-Datei. Benennen Sie die Datei <code>config.php</code>. Laden Sie sie dann in das Verzeichnis <code>Solo/assets/private</code> innerhalb des Verzeichnisses von Akeeba Solo hoch. Sie können Akeeba Solo dann normal verwenden."
SOLO_SETUP_LBL_RECOMMENDED="Diese Einstellungen werden für PHP empfohlen, um die vollständige Kompatibilität mit Akeeba Solo sicherzustellen. Akeeba Solo funktioniert jedoch auch, wenn Ihre Einstellungen nicht ganz der empfohlenen Konfiguration entsprechen."
SOLO_SETUP_LBL_RECOMMENDED_VALUE="Empfohlen"
SOLO_SETUP_LBL_REQUIRED="Wenn eines dieser Elemente nicht unterstützt wird (als Nein markiert), ergreifen Sie bitte Maßnahmen, um es zu beheben. Andernfalls könnte Ihre Akeeba Solo-Installation nicht ordnungsgemäß funktionieren."
SOLO_SETUP_LBL_REQUIREDREDTEXT="Einige der erforderlichen Einstellungen auf Ihrem Server scheinen mit Akeeba Solo nicht kompatibel zu sein. Sie können sie ignorieren und versuchen fortzufahren, aber Akeeba Solo funktioniert möglicherweise nicht. Wenn Sie sich nicht sicher sind, was sie bedeuten und wie Sie sie beheben können, wenden Sie sich bitte an Ihren Anbieter."
SOLO_SETUP_LBL_REQ_CONFIGJSON="Solo/assets/private/config.php beschreibbar"
SOLO_SETUP_LBL_REQ_DATABASE="Datenbankunterstützung"
SOLO_SETUP_LBL_REQ_INIPARSER="INI-Parser-Unterstützung"
SOLO_SETUP_LBL_REQ_JSON="JSON-Unterstützung"
SOLO_SETUP_LBL_REQ_MCGPCOFF="Magic Quotes GPC deaktiviert"
SOLO_SETUP_LBL_REQ_PHP_VERSION="PHP-Version >= %s"
SOLO_SETUP_LBL_REQ_REGGLOBALS="Register Globals deaktiviert"
SOLO_SETUP_LBL_REQ_XML="XML-Unterstützung"
SOLO_SETUP_LBL_REQ_ZLIB="Zlib-Komprimierungsunterstützung"
SOLO_SETUP_LBL_SESSIONTIMEOUT="Sitzungs-Zeitüberschreitung (Minuten)"
SOLO_SETUP_LBL_SESSIONTIMEOUT_HELP="Sie bleiben für diese Anzahl von Minuten seit Ihrer letzten Aktivität im System in Akeeba Solo angemeldet. Der Standardwert beträgt 1440 Minuten (ein Tag). Wir empfehlen, sich nach der Verwaltung von Akeeba Solo stets abzumelden, da dies eine bewährte Sicherheitspraxis ist. Ungeachtet dieser Einstellung werden Sie möglicherweise automatisch abgemeldet, wenn sich Ihre IP-Adresse ändert, Ihr Browser aktualisiert wird oder die User-Agent-Zeichenfolge Ihres Browsers geändert wird (z. B. Betriebssystem-Update, Java-Update usw.)."
SOLO_SETUP_LBL_SETTING="Einstellung"
SOLO_SETUP_LBL_TIMEZONE="Server-Zeitzone"
