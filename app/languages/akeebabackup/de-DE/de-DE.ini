SOLO_USERS_HEAD_BASIC="Grundkonfiguration"
SOLO_USERS_HEAD_TFA="Zwei-Faktor-Authentifizierung"
SOLO_USERS_LBL_ABOUTTFA="Die Zwei-Faktor-Authentifizierung (ZFA) fügt beim Anmelden bei Akeeba Solo eine zusätzliche Sicherheitsebene hinzu. Zusätzlich zu Ihrem Benutzernamen und Passwort müssen Sie auch einen Geheimen Code eingeben, um sich anzumelden. Im Gegensatz zu Ihrem Benutzernamen und Passwort ist dieser Geheime Code nicht fest. Er ändert sich im Laufe der Zeit und wird von Ihrem Smartphone oder einem dedizierten Gerät generiert, je nach der von Ihnen gewählten Methode. Die Aktivierung der ZFA ist optional; Akeeba Solo funktioniert auch ohne sie einwandfrei."
SOLO_USERS_LBL_TFAENABLE="Zwei-Faktor-Authentifizierung aktivieren"
SOLO_USERS_LBL_TFAMETHOD="Zwei-Faktor-Authentifizierungsmethode"
SOLO_USERS_LBL_TFASECURITYCODE="Geheimer Code"
SOLO_USERS_TFA_GOOGLE="Google Authenticator"
SOLO_USERS_TFA_GOOGLE_INTRO="Diese Funktion ermöglicht Ihnen die Verwendung von Google Authenticator oder einer kompatiblen Anwendung für die Zwei-Faktor-Authentifizierung. Zusätzlich zu Ihrem Benutzernamen und Passwort müssen Sie auch einen sechsstelligen Geheimen Code eingeben, der von Google Authenticator generiert wird, um sich bei Akeeba Solo anmelden zu können. Der Geheime Code wird alle 30 Sekunden erneuert. Dies bietet zusätzlichen Schutz gegen Hacker, die sich in Ihr Konto einloggen, selbst wenn sie Ihr Passwort erlangt haben sollten."
SOLO_USERS_TFA_GOOGLE_LBL_STEP1="Schritt 1 – Google Authenticator herunterladen"
SOLO_USERS_TFA_GOOGLE_LBL_STEP2="Schritt 2 – Einrichten"
SOLO_USERS_TFA_GOOGLE_LBL_STEP3="Schritt 3 – Zwei-Faktor-Authentifizierung aktivieren"
SOLO_USERS_TFA_GOOGLE_SETUP1="Laden Sie Google Authenticator oder eine kompatible Anwendung auf Ihr Smartphone oder Ihren Desktop herunter und installieren Sie ihn. Verwenden Sie eine der folgenden Optionen:"
SOLO_USERS_TFA_GOOGLE_SETUP1_WARNING="Bitte denken Sie daran, die Uhr Ihres Geräts mit einem Zeitserver zu synchronisieren. Eine Zeitabweichung auf Ihrem Gerät kann dazu führen, dass Sie sich nicht bei Akeeba Solo anmelden können."
SOLO_USERS_TFA_GOOGLE_SETUP2A="Sie müssen die folgenden Informationen in Google Authenticator oder eine kompatible App eingeben."
SOLO_USERS_TFA_GOOGLE_SETUP2A_ACCOUNT="Konto"
SOLO_USERS_TFA_GOOGLE_SETUP2A_KEY="Schlüssel"
SOLO_USERS_TFA_GOOGLE_SETUP2B="Alternativ können Sie den folgenden QR-Code in Google Authenticator scannen."
SOLO_USERS_TFA_GOOGLE_SETUP3="Um zu überprüfen, ob alles korrekt eingerichtet ist, geben Sie bitte den in Google Authenticator angezeigten Geheimen Code in das untenstehende Feld ein und klicken Sie auf die Schaltfläche. Wenn der Code korrekt ist, wird die Zwei-Faktor-Authentifizierungsfunktion aktiviert."
SOLO_USERS_TFA_NONE="Keine (Zwei-Faktor-Authentifizierung nicht verwenden)"
SOLO_USERS_TFA_OTEPS_HEAD="Einmalige Notfallcodes"
SOLO_USERS_TFA_OTEPS_INTRO="Bitte drucken Sie jetzt eine Kopie dieser Codes aus und bewahren Sie sie an einem sicheren Ort auf. Wenn Sie Ihr Zwei-Faktor-Authentifizierungsgerät verlieren, können Sie sich nicht mehr bei Akeeba Solo anmelden. Sollte dies passieren, verwenden Sie bitte eines der folgenden einmaligen Notfall-Passwörter anstelle Ihres Zwei-Faktor-Geheimschlüssels, um sich bei Akeeba Solo anzumelden und die Zwei-Faktor-Authentifizierung zurückzusetzen. Beachten Sie, dass es sich um einmalige Notfallcodes handelt. Sobald Sie einen davon verwendet haben, können Sie ihn nie wieder verwenden. Wenn Ihnen die Notfallcodes ausgehen, deaktivieren Sie bitte die Zwei-Faktor-Authentifizierung und aktivieren Sie sie erneut, um einen neuen Satz von 10 Codes zu generieren."
SOLO_USERS_TFA_YUBIKEY="YubiKey"
SOLO_USERS_TFA_YUBIKEY_INTRO="Diese Funktion ermöglicht Ihnen die Verwendung eines YubiKey-Sicherheits-Hardware-Tokens für die Zwei-Faktor-Authentifizierung. Zusätzlich zu Ihrem Benutzernamen und Passwort müssen Sie Ihren YubiKey in den USB-Port Ihres Computers einstecken, in den Bereich „Geheimschlüssel" im Anmeldebereich von Akeeba Solo klicken und die goldene Taste des YubiKey berühren. Der vom YubiKey generierte Geheime Code ist einzigartig für Ihr Gerät und ändert sich ständig. Dies bietet zusätzlichen Schutz gegen Hacker, die sich in Ihr Konto einloggen, selbst wenn sie Ihr Passwort erlangt haben sollten."
SOLO_USERS_TFA_YUBIKEY_SETUP="Bitte stecken Sie Ihren YubiKey in den USB-Port Ihres Computers. Klicken Sie auf das Feld „Geheimer Code" unten. Berühren Sie dann die goldene Taste auf Ihrem YubiKey-Gerät für eine Sekunde. Speichern Sie anschließend Ihr Benutzerprofil. Wenn der von Ihrem YubiKey generierte Code durch YubiCloud validiert wird, wird die Zwei-Faktor-Authentifizierungsfunktion aktiviert und dieser YubiKey wird mit Ihrem Benutzerkonto verknüpft."
SOLO_WIZARD_BTN_PYTHIA="Automatisch erkennen"
SOLO_WIZARD_BTN_PYTHIA_HELP="Wenn Sie auf diese Schaltfläche klicken, versucht Akeeba Solo, den Skripttyp, den Installationstyp und die Datenbankverbindungsinformationen unten automatisch zu erkennen. Bitte überprüfen Sie die Einstellungen. Die automatische Erkennung kann in einigen Fällen nicht die korrekten Einstellungen ermitteln."
SOLO_WIZARD_ERR_DIRNOTEXIST="Das angegebene Stammverzeichnis existiert nicht oder ist für Akeeba Solo nicht lesbar"
SOLO_WIZARD_LBL_DBINFO_INTRO="Hier können Sie die Verbindungsinformationen zur Datenbank angeben, die die Daten der zu sichernden Website / Webanwendung enthält."
SOLO_WIZARD_LBL_DBINFO_TITLE="Datenbankverbindung"
