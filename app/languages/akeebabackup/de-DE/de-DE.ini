SOLO_RESTORE_BTN_INSTALLER="Wiederherstellungsskript ausführen"
SOLO_RESTORE_ERR_NOSITEROOT="Es ist kein Website-Stammverzeichnis definiert. Das Backup-Archiv kann ohne dieses nicht wiederhergestellt werden."
SOLO_RESTORE_LABEL_SUCCESS_INFO="Sie müssen nun das Wiederherstellungsskript ausführen, das Ihre Datenbankdaten wiederherstellt und andere Wartungsoperationen durchführt. Besuchen Sie dazu bitte die URL <code>http://www.example.com/installation/index.php</code>, wobei http://www.example.com die URL der Website ist, auf der Sie wiederherstellen. <strong>WICHTIG! Schließen Sie nicht das Fenster, in dem diese Meldung angezeigt wird!</strong>. Nachdem das Wiederherstellungsskript abgeschlossen ist, schließen Sie dessen Fenster und kehren Sie hierher zurück. Klicken Sie dann auf die Schaltfläche „Wiederherstellung abschließen" unten, um das Verzeichnis <tt>installation</tt> zu entfernen. Anschließend können Sie Ihre wiederhergestellte Website verwenden."
SOLO_RESTORE_LABEL_SUCCESS_INFO_HASURL="Sie müssen nun das Wiederherstellungsskript ausführen, das Ihre Datenbankdaten wiederherstellt und andere Wartungsoperationen durchführt. Besuchen Sie dazu bitte die URL <code>%s/installation/index.php</code>, wobei %s die URL der Website ist, auf der Sie wiederherstellen. Sie können diese URL besuchen, indem Sie auf die Schaltfläche „Wiederherstellungsskript ausführen" unten klicken. <strong>WICHTIG! Schließen Sie nicht das Fenster, in dem diese Meldung angezeigt wird!</strong>. Nachdem das Wiederherstellungsskript abgeschlossen ist, schließen Sie dessen Fenster und kehren Sie hierher zurück. Klicken Sie dann auf die Schaltfläche „Wiederherstellung abschließen" unten, um das Verzeichnis <tt>installation</tt> zu entfernen. Anschließend können Sie Ihre wiederhergestellte Website verwenden."
