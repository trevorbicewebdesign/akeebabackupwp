SOLO_CONFIG_PLATFORM_EXTRADIRS_TITLE="Zusätzliche zu sichernde Verzeichnisse"
SOLO_CONFIG_PLATFORM_NEWROOT_DESCRIPTION="Das Stammverzeichnis der Website/Webanwendung, die von Akeeba Solo gesichert wird. Alle Dateien und Verzeichnisse unterhalb dieses Stammverzeichnisses werden gesichert."
SOLO_CONFIG_PLATFORM_NEWROOT_TITLE="Website-Stammverzeichnis"
SOLO_CONFIG_PLATFORM_SCRIPTTYPE_DESCRIPTION="Wählen Sie den Skript-/CMS-Typ aus, den Sie sichern. Dies ermöglicht es Akeeba Solo, automatisch temporäre Inhalte und Cache-Inhalte auszuschließen, die nicht gesichert werden sollten."
SOLO_CONFIG_PLATFORM_SCRIPTTYPE_GENERIC="Generisches oder individuelles PHP-Skript"
SOLO_CONFIG_PLATFORM_SCRIPTTYPE_JOOMLA="Joomla!"
SOLO_CONFIG_PLATFORM_SCRIPTTYPE_TITLE="Skript-Typ"
SOLO_CONFIG_PLATFORM_SCRIPTTYPE_WORDPRESS="WordPress"
SOLO_CONFIG_PLATFORM_SITEURL_DESCRIPTION="(Optional) Geben Sie die URL der Website ein, die Sie sichern möchten, z. B. <code>http://www.example.com</code>. Dadurch kann das Installationsskript erkennen, ob Sie auf derselben Website wiederherstellen oder die Website klonen/übertragen. Wenn Sie keine URL angeben, wird das Wiederherstellungsskript Sie stets auffordern, die Datenbankverbindungsinformationen neu einzugeben – was etwas verwirrend sein kann, wenn Sie ein Backup auf derselben Website wiederherstellen, von der es erstellt wurde."
SOLO_CONFIG_PLATFORM_SITEURL_TITLE="URL der Website"
SOLO_CONFIG_QUICKBACKUP_PROFILE_DESCRIPTION="Das Backup-Profil, das mit dem Schnell-Backup-Symbol-Widget im WordPress-Dashboard verwendet werden soll."
SOLO_CONFIG_QUICKBACKUP_PROFILE_LABEL="Profil für das Schnell-Backup-Symbol"
SOLO_CONFIG_UNDER_TOOLS_DESCRIPTION="Nein: Akeeba Backup erscheint im WordPress-Seitenmenü als eigenständiger Menüpunkt am unteren Ende. Ja: Akeeba Backup erscheint als Untermenüpunkt unter dem Menüpunkt „Werkzeuge" im WordPress-Seitenmenü."
SOLO_CONFIG_UNDER_TOOLS_LABEL="Unter Werkzeuge einordnen"
SOLO_CONFIG_UPDATE_INTEGRATED_WP="Akeeba Backup-Aktualisierung auf der Plugins-Seite anzeigen"
SOLO_CONFIG_UPDATE_INTEGRATED_WP_DESC="Wenn aktiviert, benachrichtigt Akeeba Backup WordPress über die Verfügbarkeit von Aktualisierungen und den Speicherort der Aktualisierungsdateien. Dadurch kann WordPress Akeeba Backup-Aktualisierungen in die Anzahl der verfügbaren Aktualisierungen einbeziehen und auf der Plugins-Seite anzeigen. Auf sehr wenigen Websites kann dies zu einer leeren Seite oder einem Fehler beim Zugriff auf die Plugins-Seite führen, verursacht durch die Interaktion mit schlecht programmierten Drittanbieter-Plugins. Deaktivieren Sie in diesem Fall diese Option und kontaktieren Sie uns mit einer Liste der aktivierten Plugins und deren Versionen."
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_CONSERVATIVE="Konservativ"
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_DESCRIPTION="Wenn aktiviert, werden bei Backups, die über WP-CRON ausgeführt werden, die minimalen und maximalen Ausführungszeiten, die im Bereich „Feinabstimmung" des Backup-Profils konfiguriert sind, überschrieben. Die Einstellung „Optimistisch" versucht, die maximal mögliche Zeit auf Ihrem Server zu nutzen – bis zu 60 Sekunden –, was zu schnelleren, aber fehleranfälligeren Backups führt. Die Einstellung „Konservativ" versucht, nur halb so viel Zeit wie die optimistische Einstellung zu verwenden, was langsamere, aber weniger fehleranfällige Backups ergibt. Einige Server erfordern möglicherweise die Einstellung „Nein" und eine manuelle Anpassung der Feinabstimmungs-Einstellungen, damit das Backup fehlerfrei funktioniert."
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_LABEL="Zeitlimits in WP-CRON überschreiben"
SOLO_CONFIG_WP_CRON_OVERRIDE_TIME_OPTIMISTIC="Optimistisch"
