SOLO_UPDATE_NAGSCREEN_BODY="Sie sind dabei, eine instabile Version (%s - %s) zu installieren. Instabile Versionen wurden möglicherweise nur minimal oder gar nicht getestet und können Fehler enthalten, die sich negativ auf die Stabilität und Funktionalität der Anwendung auswirken. Wenn Sie sich nicht sicher sind, was Sie vorhaben, schließen Sie bitte dieses Browserfenster. Wenn Sie sich absolut sicher sind, dass Sie die Risiken der Installation instabiler Versionen verstehen, klicken Sie bitte auf die Schaltfläche unten, um die Installation dieser instabilen Version fortzusetzen."
