SOLO_CONFIG_DISPLAY_DARKMODE_DESCRIPTION="Zeigt Akeeba Backup mit einem dunklen Design an, das für schwache Lichtverhältnisse geeignet ist. Die Option „Auto" funktioniert derzeit nur bei neueren Safari-Versionen unter macOS und iOS-Versionen mit systemweitem Dunkelmodus."
