COM_AKEEBA_SCHEDULE_LBL_ALTCLICRON_INFO="Diese Methode wird nur empfohlen, wenn die reguläre Befehlszeilen-CRON-Aufgabe nicht abgeschlossen wird. Diese Methode verwendet intern die Frontend-Backup-Methode und ist etwas langsamer als die native CLI-Methode."
