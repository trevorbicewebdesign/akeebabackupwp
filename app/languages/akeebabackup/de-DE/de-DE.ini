COM_AKEEBA_CONFIG_PLATFORM_DBDATABASE_DESCRIPTION="Der Name der zu sichernden Datenbank. Wird nur verwendet, wenn das Kontrollkästchen „Website-Datenbank überschreiben" aktiviert ist."
