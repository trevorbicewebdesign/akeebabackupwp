COM_AKEEBA_CONFWIZ="Konfigurationsassistent"
COM_AKEEBA_CONFWIZ_CONGRATS="Herzlichen Glückwunsch! Sie haben den automatischen Konfigurationsassistenten abgeschlossen. Sie können Ihre neue Konfiguration jetzt testen, indem Sie ein Backup ausführen, oder sie auf der Konfigurationsseite weiter verfeinern."
COM_AKEEBA_CONFWIZ_DBOPT="Optimierung der Einstellungen der Datenbank-Dump-Engine"
