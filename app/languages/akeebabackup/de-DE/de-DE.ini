COM_AKEEBA_CPANEL_MSG_CLOUDFLARE_WARN1="Wir haben festgestellt, dass CloudFlare Rocket Loader auf Ihrer Website aktiviert ist. Diese Funktion beeinträchtigt JavaScript auf Ihrer Website, indem sie die Ladereihenfolge der Skripte durcheinanderbringt und dadurch JavaScript-Fehler verursacht. Bitte deaktivieren Sie die Rocket Loader-Funktion, damit das JavaScript von Akeeba Backup korrekt funktioniert. Weitere Informationen und Anweisungen finden Sie in der <a href='%s' target='_blank'>Dokumentation von CloudFlare</a>."
