COM_AKEEBA_TRANSFER_WARN_FIREWALLED_BODY="Einige der oben aufgeführten und mit &#128274; markierten Übertragungsmethoden werden durch eine Firewall auf Ihrem Server blockiert. Wenn Sie diese verwenden, wird dieser Assistent höchstwahrscheinlich fehlschlagen. Bitte wenden Sie sich an Ihren Hosting-Anbieter und bitten Sie ihn, die Firewall zu deaktivieren oder Firewall-Ausnahmen hinzuzufügen, bevor Sie Ihre Website übertragen. Alternativ wählen Sie oben „Manuell", klicken Sie auf „Weiter zur Wiederherstellung" und folgen Sie den Anweisungen für eine manuelle Website-Übertragung."
