COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BACKBLAZE_DESCRIPTION="Lädt das Backup-Archiv in BackBlaze hoch."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BACKBLAZE_TITLE="In BackBlaze B2 hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BOX_DESCRIPTION="Lädt das Backup-Archiv in Box.com hoch. Bitte lesen Sie die Dokumentation."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_BOX_TITLE="In Box.com hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_DESCRIPTION="Lädt das Backup-Archiv in RackSpace CloudFiles hoch.<br/><strong>Denken Sie daran, eine Archivteilgröße von 2–30 MB festzulegen, da Sie sonst riskieren, dass das Backup aufgrund von Zeitüberschreitungen fehlschlägt!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDFILES_TITLE="In RackSpace CloudFiles hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDME_DESCRIPTION="Lädt das Backup-Archiv in CloudMe hoch.<br/><strong>Denken Sie daran, eine Archivteilgröße von 2–30 MB festzulegen, da Sie sonst riskieren, dass das Backup aufgrund von Zeitüberschreitungen fehlschlägt!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_CLOUDME_TITLE="In CloudMe hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_DESCRIPTION="Lädt das Backup-Archiv in DreamObjects hoch.<br/><strong>Denken Sie daran, eine Archivteilgröße von 2–30 MB festzulegen, da Sie sonst riskieren, dass das Backup aufgrund von Zeitüberschreitungen fehlschlägt!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DREAMOBJECTS_TITLE="In DreamObjects hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DROPBOX2_DESCRIPTION="Lädt das Backup-Archiv über die Dropbox V2 API zu Dropbox hoch. Diese API ist schneller und ermöglicht es Ihnen, Ihr Dropbox-Konto einfach mit mehreren Websites zu verbinden."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_DROPBOX2_TITLE="Zu Dropbox hochladen (v2 API)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_DESCRIPTION="Sendet Ihnen das Backup-Archiv als E-Mail-Anhang.<br/><strong>Denken Sie daran, eine geteilte Archivgröße von 1-2 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen und Speichermangel fehlschlagen kann!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_EMAIL_TITLE="Per E-Mail senden"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_DESCRIPTION="Lädt das Backup-Archiv auf einen Remote-FTP- oder FTPS-Server (FTP über implizites SSL) hoch.<br/>Diese Nachverarbeitungs-Engine verwendet die cURL-Bibliothek, die eine bessere Kompatibilität mit einer Vielzahl von FTP-Servern bietet.<br/><strong>Denken Sie daran, eine geteilte Archivgröße von 2-30 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen fehlschlagen kann!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTPCURL_TITLE="Auf Remote-FTP-Server mit cURL hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_DESCRIPTION="Lädt das Backup-Archiv auf einen Remote-FTP- oder FTPS-Server (FTP über implizites SSL) hoch.<br/><strong>Denken Sie daran, eine geteilte Archivgröße von 2-30 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen fehlschlagen kann!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_FTP_TITLE="Auf Remote-FTP-Server hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_DESCRIPTION="Lädt das Backup-Archiv zu Google Drive hoch. Bitte lesen Sie die Dokumentation."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLEDRIVE_TITLE="Zu Google Drive hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_DESCRIPTION="Lädt das Backup-Archiv über die moderne JSON API zu Google Storage hoch. Dies ist die empfohlene Integration mit Google Storage.<br/><strong>Denken Sie daran, eine geteilte Archivgröße von 2-30 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen fehlschlagen kann!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGEJSON_TITLE="Zu Google Storage hochladen (JSON API)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_DESCRIPTION="Lädt das Backup-Archiv über die veraltete S3-API-Emulation zu Google Storage hoch. Diese Methode ist veraltet und wird in Zukunft entfernt. Bitte verwenden Sie stattdessen die JSON API-Option.<br/><strong>Denken Sie daran, eine geteilte Archivgröße von 2-30 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen fehlschlagen kann!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_GOOGLESTORAGE_TITLE="Zu Google Storage hochladen (Legacy S3 API)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_NONE_DESCRIPTION="Lässt die Backup-Archivdateien auf dem Server"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_NONE_TITLE="Keine Nachverarbeitung"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_DESCRIPTION="Lädt das Backup-Archiv zu Microsoft OneDrive oder Microsoft OneDrive for Business hoch."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVEBUSINESS_TITLE="Zu Microsoft OneDrive oder OneDrive for Business hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_DESCRIPTION="Lädt das Backup-Archiv zu Microsoft OneDrive hoch. Dies unterstützt nur persönliche Laufwerke, die mit Ihrem persönlichen Microsoft-Konto erstellt wurden. OneDrive for Business und OneDrive-Konten, die über ein Schul-/Arbeitskonto oder ein Microsoft Office 365-Abonnement erstellt wurden, werden nicht unterstützt. Diese Upload-Methode wird in einer zukünftigen Version von Akeeba Backup ENTFERNT. Verwenden Sie stattdessen die Methode „Zu Microsoft OneDrive hochladen"."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_ONEDRIVE_TITLE="Zu Microsoft OneDrive hochladen (LEGACY)"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_DESCRIPTION="Lädt das Backup-Archiv zu OVH Object Storage hoch. <br/><strong>Denken Sie daran, eine geteilte Archivgröße von 2-30 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen fehlschlagen kann!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_OVH_TITLE="Zu OVH Object Storage hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_DESCRIPTION="Lädt das Backup-Archiv zu Amazon S3 hoch. Es ermöglicht sowohl die neue (AWS4) Authentifizierung, die für neuere S3-Standorte erforderlich ist, als auch die alte (AWS2) Authentifizierung, die für Drittanbieter-Speicherdienste mit einer S3-kompatiblen API benötigt wird.<br/><strong>Wenn Sie mehrteilige Uploads deaktivieren, denken Sie daran, eine geteilte Archivgröße von 2-30 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen fehlschlagen kann!</strong><br/>Wenn Sie Amazon STS anstelle eines Zugriffs- und Geheimschlüssels verwenden möchten, lesen Sie bitte die Dokumentation."
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_S3_TITLE="Zu Amazon S3 hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_DESCRIPTION="Lädt das Backup-Archiv auf einen Remote-SFTP-Server (SSH) hoch. Dies ist eine Dateiübertragung über SSH mit einem Protokoll namens SFTP, das sich <em>grundlegend</em> von FTP und FTPS unterscheidet.<br/>Diese Nachverarbeitungs-Engine verwendet cURL für die Datenübertragung, eine Bibliothek, die mit einer Vielzahl von SFTP-Servern kompatibel ist.<br/><strong>Denken Sie daran, eine geteilte Archivgröße von 2-30 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen fehlschlagen kann!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTPCURL_TITLE="Auf Remote-SFTP-Server (SSH) mit cURL hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_DESCRIPTION="Lädt das Backup-Archiv auf einen Remote-SFTP-Server (SSH) hoch. Dies ist eine Dateiübertragung über SSH mit einem Protokoll namens SFTP, das sich <em>grundlegend</em> von FTP und FTPS unterscheidet.<br/><strong>Denken Sie daran, eine geteilte Archivgröße von 2-30 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen fehlschlagen kann!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SFTP_TITLE="Auf Remote-SFTP-Server (SSH) hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_DESCRIPTION="Lädt das Backup-Archiv zu SugarSync hoch.<br/><strong>Denken Sie daran, eine geteilte Archivgröße von 2-30 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen fehlschlagen kann!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SUGARSYNC_TITLE="Zu SugarSync hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_SWIFT_TITLE="Zu OpenStack Swift Object Storage hochladen"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_DESCRIPTION="Lädt das Backup-Archiv auf jeden Speicherdienst hoch, der das WebDAV-Protokoll unterstützt.<br/><strong>Denken Sie daran, eine geteilte Archivgröße von 2-30 MB festzulegen, da sonst das Backup aufgrund von Zeitüberschreitungen fehlschlagen kann!</strong>"
COM_AKEEBA_CONFIG_ENGINE_POSTPROC_WEBDAV_TITLE="Per WebDAV hochladen"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_DESCRIPTION="Ein Datei-Scanner, der für das Sichern von Websites mit Verzeichnissen mit Hunderten von Dateien optimiert ist (z. B. Blogs und Nachrichtenportale)"
COM_AKEEBA_CONFIG_ENGINE_SCAN_LARGE_TITLE="Large Site Scanner"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_DESCRIPTION="Bringt Scan-Geschwindigkeit und Vermeidung von Zeitüberschreitungen intelligent in Einklang"
COM_AKEEBA_CONFIG_ENGINE_SCAN_SMART_TITLE="Smart Scanner"
COM_AKEEBA_CONFIG_ERR_DECRYPTION="Einstellungen konnten nicht entschlüsselt werden. Ihr Server unterstützt keine Einstellungsverschlüsselung, oder die Verschlüsselungsschlüsseldatei wurde geändert oder gelöscht."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_DESCRIPTION="Wenn aktiviert, besteht der Datenbank-Dump aus erweiterten INSERT-Anweisungen, d. h. einer einzelnen Anweisung zum Wiederherstellen mehrerer Datenzeilen. Es wird dringend empfohlen, diese Option aktiviert zu lassen, da sie den Wiederherstellungsprozess beschleunigt und Abfragekontingentbeschränkungen auf restriktiven Hosting-Umgebungen umgeht."
COM_AKEEBA_CONFIG_EXTENDEDINSERTS_TITLE="Erweiterte INSERTs generieren"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_DESC="E-Mail an diese Adresse senden (leer lassen, um diese Funktion zu deaktivieren)"
COM_AKEEBA_CONFIG_FAILURE_EMAILADDRESS_LABEL="E-Mail-Adresse"
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_DESC="Leer lassen, um die Standardeinstellung zu verwenden. Sie können alle Solo-Variablen verwenden, die auch für die Benennung von Archivdateien verfügbar sind, z. B. [HOST] und [DATE]."
COM_AKEEBA_CONFIG_FAILURE_EMAILBODY_LABEL="E-Mail-Text"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_DESC="Leer lassen, um die Standardeinstellung zu verwenden. Sie können alle Solo-Variablen verwenden, die auch für die Benennung von Archivdateien verfügbar sind, z. B. [HOST] und [DATE]"
COM_AKEEBA_CONFIG_FAILURE_EMAILSUBJECT_LABEL="E-Mail-Betreff"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_DESC="Ein Backup gilt nach dieser Anzahl von Sekunden Inaktivität als hängengeblieben (fehlgeschlagen).<br/><strong>ÄNDERN SIE DIESEN WERT NICHT, WENN SIE NICHT WISSEN, WAS SIE TUN!</strong>"
COM_AKEEBA_CONFIG_FAILURE_TIMEOUT_LABEL="Zeitüberschreitung für hängengebliebene Backups"
COM_AKEEBA_CONFIG_FEEMAILBODY_DESC="Leer lassen, um die Standardeinstellung zu verwenden. Sie können alle Variablen von Akeeba Backup verwenden, die auch für die Benennung von Archivdateien verfügbar sind, z. B. [HOST] und [DATE]. Außerdem können Sie [PROFILENUMBER] für die Nummer des aktuellen Profils, [PROFILENAME] für den Namen des aktuellen Profils, [PARTCOUNT] für die Anzahl der insgesamt erzeugten Backup-Archiv-Teile, [FILELIST] für eine Liste der Backup-Archiv-Teile und [REMOTESTATUS] für eine Angabe dazu verwenden, ob der Upload in den Remote-Speicher erfolgreich abgeschlossen wurde."
COM_AKEEBA_CONFIG_FEEMAILBODY_LABEL="E-Mail-Text"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_DESC="Leer lassen, um die Standardeinstellung zu verwenden. Sie können alle Variablen von Akeeba Backup verwenden, die auch für die Benennung von Archivdateien verfügbar sind, z. B. [HOST] und [DATE]"
COM_AKEEBA_CONFIG_FEEMAILSUBJECT_LABEL="E-Mail-Betreff"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT="Server-Zeitzone verwenden"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULTGROUP="Voreinstellungen"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DEFAULT_WORDPRESS="WordPress-Zeitzone verwenden"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_DESC="Das Datum und die Uhrzeit des Backups – wie im Dateinamen, der Standardbeschreibung und E-Mails aufgezeichnet – werden in dieser Zeitzone ausgedrückt. Diese Option betrifft alle Backup-Ursprünge, d. h. alle Backups, unabhängig davon, wie sie erstellt wurden (über Akeeba Backup selbst, die Remote-JSON-API usw.)."
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_LABEL="Zeitzone des Backups"
COM_AKEEBA_CONFIG_FORCEDBACKUPTZ_WP_DESC="Das Datum und die Uhrzeit des Backups – wie im Dateinamen, der Standardbeschreibung und E-Mails aufgezeichnet – werden in dieser Zeitzone ausgedrückt. Diese Option betrifft alle Backup-Ursprünge, d. h. alle Backups, unabhängig davon, wie sie erstellt wurden (über Akeeba Backup selbst, die Remote-JSON-API usw.).<br>Bitte beachten Sie, dass die Option „WordPress-Zeitzone verwenden" NICHT korrekt funktioniert, wenn Sie Backups mit a. der alten Frontend-Backup-URL oder der Akeeba Backup JSON API verwenden, sofern Sie die alten Endpunkt-URLs verwenden (die index.php oder remote.php anstelle von wp-cron.php verwendet haben), und b. den CLI-Backup-Skripten (<em>nicht</em> WP-CLI). In diesen Fällen läuft das Backup technisch gesehen außerhalb von WordPress, daher gibt es keine „WordPress-Zeitzone"; das Backup verwendet in diesen Fällen stattdessen die GMT-Zeitzone. Aus diesem Grund wird dringend empfohlen, dies auf Ihre lokale Zeitzone einzustellen."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_DESC="Senden Sie nach einem Backup mit der Frontend-Backup-Funktion (Legacy API) oder der JSON API eine Benachrichtigungs-E-Mail."
COM_AKEEBA_CONFIG_FRONTENDEMAIL_LABEL="E-Mail bei Backup-Abschluss"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_ALWAYS="Immer"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_DESC="Wann soll die E-Mail beim Backup-Abschluss gesendet werden? „Immer" bedeutet jedes Mal, wenn ein Backup abgeschlossen wurde. „Upload fehlgeschlagen" bedeutet, dass die E-Mail nur gesendet wird, wenn das Backup abgeschlossen ist, der Upload in den Remote-Speicher jedoch nicht erfolgreich abgeschlossen wurde. Wenn das Backup fehlschlägt, kann durch diese Funktion keine E-Mail gesendet werden. Informationen zum Empfang von E-Mails über fehlgeschlagene Backups finden Sie auf der Seite „Automatische Backups planen"."
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_FAILEDUPLOAD="Upload fehlgeschlagen"
COM_AKEEBA_CONFIG_FRONTEND_EMAIL_WHEN_LABEL="Wann die E-Mail gesendet werden soll"
COM_AKEEBA_CONFIG_FTPTEST_BADPREFIX="Sie sollten das Präfix ftp:// NICHT zu Ihrem FTP-Hostnamen hinzufügen. Bitte entfernen Sie das Präfix ftp:// und versuchen Sie es erneut."
COM_AKEEBA_CONFIG_FTPTEST_NOUPLOAD="Akeeba Backup konnte eine Verbindung zu Ihrem Server herstellen, konnte jedoch keine Testdatei hochladen. Der Backup-Upload könnte fehlschlagen."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_DESCRIPTION="Wird automatisch ausgefüllt, wenn Sie Authentifizierungsschritt 1 oben abschließen. Wenn Sie eine andere Website mit demselben Google Drive-Konto verknüpfen, kopieren Sie NICHT das Zugriffstoken und führen Sie NICHT die Authentifizierung durch. Kopieren Sie stattdessen einfach den Aktualisierungstoken von der vorherigen Website auf diese."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_ACCESSTOKEN_TITLE="Zugriffstoken"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_DESCRIPTION="Das Verzeichnis innerhalb von Google Drive, in dem die Backup-Archive gespeichert werden sollen. Bitte verwenden Sie Schrägstriche. Richtig: some/thing. Falsch: some\thing. Ein einzelner Schrägstrich bedeutet, dass Archive im Stammverzeichnis des Laufwerks gespeichert werden. LESEN SIE DIE DOKUMENTATION: Pfade in Google Drive sind mehrdeutig!"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_DIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTEAMDRIVES_TITLE="Liste der Laufwerke neu laden"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_REFRESHTOKEN_TITLE="Aktualisierungstoken"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_DESCRIPTION="Welches Google Drive Sie für die Dateiablage verwenden möchten. Sie müssen die Authentifizierung abschließen, bevor diese Liste befüllt wird. Dies ist nur sinnvoll, wenn Sie Zugriff auf Google Team Drives haben (z. B. Nutzer des G Suite Business- oder Enterprise-Plans). Wenn Sie unsicher sind, verwenden Sie die Option „Google Drive (persönlich)"."
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_OPT_PERSONAL="Google Drive (persönlich)"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_TEAMDRIVE_TITLE="Laufwerk"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_TITLE="In „Mit mir geteilt"-Ordner hochladen"
COM_AKEEBA_CONFIG_GOOGLEDRIVE_UPLOADTOSHAREDWITHME_DESCRIPTION="Wenn aktiviert, sucht Akeeba Backup zuerst in der Sammlung „Mit mir geteilt" nach Ordnern, bevor es nach einem gleichnamigen Ordner in Ihrem Laufwerk sucht. Dies ist deutlich langsamer und kann dazu führen, dass in den falschen Ordner hochgeladen wird, wenn viele geteilte Ordner mit demselben Namen in Ihrem Google Drive-Konto vorhanden sind."
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_DESCRIPTION="Ihr Google Storage-Zugriffsschlüssel, der Ihnen über das Google Cloud Storage-Schlüsselverwaltungstool (https://code.google.com/apis/console#:storage:legacy) zur Verfügung gestellt wird"
COM_AKEEBA_CONFIG_GOOGLESTORAGEACCESSKEY_TITLE="Zugriffsschlüssel"
COM_AKEEBA_CONFIG_GOOGLESTORAGEBUCKET_DESCRIPTION="Der Name Ihres Google Storage-Buckets. Stellen Sie sicher, dass er genau so eingegeben wird, wie er in der Google Cloud Storage-Browser-Webanwendung angezeigt wird (https://sandbox.google.com/storage)"
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_DESCRIPTION="Das Verzeichnis innerhalb Ihres Buckets, in dem die Backup-Archive gespeichert werden. Lassen Sie dieses Feld leer, um Dateien im Stammverzeichnis des Buckets zu speichern."
COM_AKEEBA_CONFIG_GOOGLESTORAGEDIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_DESC="Fügen Sie hier den Inhalt der JSON-Anmeldeinformationsdatei ein, die die Google Cloud Console beim Einrichten des Dienstkontos für die Backup-Software erstellt hat. Denken Sie daran, die geschweiften Klammern am Anfang und Ende des Textes einzuschließen."
COM_AKEEBA_CONFIG_GOOGLESTORAGEJSON_CREDS_TITLE="Inhalt von googlestorage.json (Dokumentation lesen)"
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_DESCRIPTION="Wenn aktiviert, versucht Akeeba Backup, den Bucket-Namen in Kleinbuchstaben umzuwandeln, z. B. wird MeinBucket in meinbucket umgewandelt. Wenn Sie einen Bucket mit Großbuchstaben erstellt haben, z. B. MeinNeuerBucket, deaktivieren Sie diese Option und stellen Sie sicher, dass der Bucket-Name genau so geschrieben wird, wie er in Ihrer Google Cloud Storage-Browser-Webanwendung angezeigt wird (https://sandbox.google.com/storage)."
COM_AKEEBA_CONFIG_GOOGLESTORAGELOWERCASE_TITLE="Bucket-Name in Kleinbuchstaben"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_DESCRIPTION="Ihr Google Storage-Geheimschlüssel, der Ihnen im Google Cloud Storage-Schlüsselverwaltungstool zur Verfügung gestellt wird (https://code.google.com/apis/console#:storage:legacy)"
COM_AKEEBA_CONFIG_GOOGLESTORAGESECRETKEY_TITLE="Geheimschlüssel"
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_DESCRIPTION="Wenn aktiviert, wird beim Hochladen Ihrer Dateien eine sichere Verbindung (HTTPS) verwendet. Obwohl dies die Sicherheit der übertragenen Daten erhöht, steigt auch die Wahrscheinlichkeit eines Backup-Fehlers aufgrund von Zeitüberschreitung."
COM_AKEEBA_CONFIG_GOOGLESTORAGEUSESSL_TITLE="SSL verwenden"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_COLDLINE="Coldline Storage"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_DESCRIPTION="Ändern Sie die Speicherklasse der hochgeladenen Backup-Archive. „Ohne" bedeutet, dass die Dateien mit der in Ihrem Bucket festgelegten Standardspeicherklasse gespeichert werden. Bitte beachten Sie, dass andere Optionen als Standard günstiger in der Speicherung sein können, aber beim Herunterladen oder Löschen zusätzliche Gebühren anfallen können. Informationen zu Preisen erhalten Sie bei Google."
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NEARLINE="Nearline Storage"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_NONE="Ohne (Bucket entscheidet)"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_STANDARD="Standard Storage"
COM_AKEEBA_CONFIG_GOOGLESTORAGE_STORAGECLASS_TITLE="Speicherklasse"
COM_AKEEBA_CONFIG_HEADER_BASIC="Grundkonfiguration"
COM_AKEEBA_CONFIG_HEADER_CONFWIZ="Akeeba Backup selbst konfigurieren lassen?"
COM_AKEEBA_CONFIG_HEADER_OPTIONALFILTERS="Optionale Filter"
COM_AKEEBA_CONFIG_HEADER_QUOTA="Kontingent-Verwaltung"
COM_AKEEBA_CONFIG_HEADER_TUNING="Feinabstimmung"
COM_AKEEBA_CONFIG_INSTALLER_DESCRIPTION="Bei einem vollständigen Website-Backup bettet Akeeba Backup das hier definierte Wiederherstellungsskript in das Archiv ein. Dies ermöglicht die Wiederherstellung Ihrer Website von Grund auf, ohne Ihr CMS oder Akeeba Backup installieren zu müssen, selbst wenn Ihre Website oder Ihr Server vollständig zerstört wurde."
COM_AKEEBA_CONFIG_INSTALLER_TITLE="Eingebettetes Wiederherstellungsskript"
COM_AKEEBA_CONFIG_JPS_KEY_DESCRIPTION="Dieser Schlüssel wird verwendet, um den Inhalt Ihres Archivs zu verschlüsseln. Der Schlüssel unterscheidet zwischen Groß- und Kleinschreibung, d. h. ABC, abc und Abc sind drei verschiedene Passwörter. Bewahren Sie eine Kopie des Passworts an einem sicheren Ort auf! Wenn Sie es verlieren, gibt es keine Möglichkeit, es wiederherzustellen."
COM_AKEEBA_CONFIG_JPS_KEY_TITLE="Verschlüsselungsschlüssel"
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_DESCRIPTION="Wenn aktiviert (Standard), wird Ihr Passwort zu einem kryptografischen Schlüssel erweitert, der im gesamten Archiv verwendet wird. Dies ist schnell, aber im sehr unwahrscheinlichen Fall, dass ein Angreifer mit ausreichenden Ressourcen es schafft, den kryptografischen Schlüssel aus einem verschlüsselten Block in der Datei rückzuentwickeln – ohne Ihr Passwort selbst per Brute-Force zu knacken – kann er das gesamte Backup-Archiv entschlüsseln. Wenn deaktiviert, wird für jeden verschlüsselten Block ein anderer kryptografischer Schlüssel aus Ihrem Passwort abgeleitet, was VIEL langsamer ist, Sie aber gegen diese Art von Angriff schützt, da der Angreifer das Passwort per Brute-Force angreifen müsste, was wesentlich langsamer ist."
COM_AKEEBA_CONFIG_JPS_PBKDF2USESTATICSALT_TITLE="Archivweite Schlüsselerweiterung"
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_DESC="Die Akeeba Backup JSON API ermöglicht es Ihnen, Backups zu erstellen und zu verwalten sowie Akeeba Backup-Optionen remote zu konfigurieren. Sie müssen diese Option aktivieren, wenn Sie planen, Backups beispielsweise mit Akeeba Remote CLI, Akeeba UNiTE oder Backup-Planungsdiensten zu erstellen, herunterzuladen oder zu verwalten.<br><br><strong>Sicherheitshinweis:</strong> Die JSON API wird ausschließlich über den Geheimschlüssel authentifiziert. Es ist kein Benutzerkonto beteiligt, sodass keine der in der Benutzerverwaltung festgelegten Berechtigungen greift – der Inhaber erhält jede API-Methode ohne jede Einschränkung. Er kann Backups lesen, erstellen, herunterladen und löschen sowie jede Option ändern, was praktisch dem Besitz Ihres Administrator-Passworts entspricht. Aktivieren Sie diese Option nur, wenn Sie sie wirklich benötigen, und verwenden Sie einen langen, zufälligen Geheimschlüssel."
COM_AKEEBA_CONFIG_JSONAPI_ENABLED_LABEL="JSON API aktivieren (Remote-Backup)"
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_DESCRIPTION="Wenn ein Verzeichnis mehr als diese Anzahl von Dateien oder Unterverzeichnissen enthält, gilt es als „groß". Daher versucht Akeeba Backup, es im nächsten Schritt erneut zu durchsuchen, um Backup-Zeitüberschreitungen zu vermeiden. Ein zu kleiner Wert verlangsamt das Backup erheblich. Erhöhen Sie den Wert – sofern keine Zeitüberschreitungsfehler auftreten –, um das Backup zu beschleunigen."
COM_AKEEBA_CONFIG_LARGEDIRTHRESHOLD_TITLE="Schwellenwert für große Verzeichnisse"
COM_AKEEBA_CONFIG_LARGEFILE_DESCRIPTION="Dateien, die größer als dieser Schwellenwert sind, werden in einem eigenen Schritt gepackt, um die Möglichkeit einer Zeitüberschreitung zu verhindern. Werte zwischen 2 und 10 MB funktionieren auf den meisten Servern am besten."
COM_AKEEBA_CONFIG_LARGEFILE_TITLE="Schwellenwert für große Dateien"
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_DESCRIPTION="Anzahl der Verzeichnisse, die in jedem Schritt durchsucht werden. Empfohlene Einstellung: 50. Größere Werte machen das Backup geringfügig schneller, erhöhen aber die Wahrscheinlichkeit einer Zeitüberschreitung."
COM_AKEEBA_CONFIG_LARGE_DIRTHRESHOLD_TITLE="Stapelgröße für Verzeichnis-Scan"
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_DESCRIPTION="Anzahl der Dateien, die in jedem Schritt gescannt und komprimiert werden. Empfohlene Einstellung: 100. Größere Werte machen das Backup geringfügig schneller, erhöhen aber die Wahrscheinlichkeit einer Zeitüberschreitung oder eines Speichermangels."
COM_AKEEBA_CONFIG_LARGE_FILESTHRESHOLD_TITLE="Stapelgröße für Datei-Scan"
COM_AKEEBA_CONFIG_LBL_CONFWIZ_AFTER="Nachdem Akeeba Backup sich selbst konfiguriert hat, können Sie ein Backup erstellen oder die Konfiguration manuell fein abstimmen."
COM_AKEEBA_CONFIG_LBL_CONFWIZ_INTRO="Es scheint, dass Sie Akeeba Backup noch nicht konfiguriert haben. Klicken Sie auf die Schaltfläche Konfigurationsassistent unten, damit es sich selbst konfiguriert."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_DESC="Die veraltete Frontend-Backup-API ermöglicht es Ihnen, geplante Backups mithilfe von URL-Zugriffstools wie wget oder curl zu erstellen. Sie müssen diese Option aktivieren, wenn Sie planen, Backups mit dem CRON-Server Ihres Hosts über wget oder curl zu erstellen, oder wenn Sie einen Drittanbieter-CRON-Dienst wie WebCRON.org verwenden möchten. Wann immer möglich empfehlen wir stattdessen das native CLI-CRON-Skript oder die Akeeba Backup JSON API zu verwenden, da diese wesentlich sicherere Optionen darstellen."
COM_AKEEBA_CONFIG_LEGACYAPI_ENABLED_LABEL="Veraltete Frontend-Backup-API aktivieren (Remote-CRON-Aufgaben)"
COM_AKEEBA_CONFIG_LOGLEVEL_DEBUG="Alle Informationen und Debug-Meldungen"
COM_AKEEBA_CONFIG_LOGLEVEL_DESCRIPTION="Diese Option legt fest, wie ausführlich das Backup-Protokoll sein wird."
COM_AKEEBA_CONFIG_LOGLEVEL_ERROR="Nur Fehler"
COM_AKEEBA_CONFIG_LOGLEVEL_INFO="Alle Informationen"
COM_AKEEBA_CONFIG_LOGLEVEL_NONE="Keine"
COM_AKEEBA_CONFIG_LOGLEVEL_TITLE="Protokollierungsebene"
COM_AKEEBA_CONFIG_LOGLEVEL_WARNING="Fehler und Warnungen"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_DESCRIPTION="Alte Backups werden automatisch basierend auf dem Tag ihrer Erstellung entfernt. WARNUNG: WENN SIE DIESE OPTION AKTIVIEREN, WERDEN ALLE ANDEREN KONTINGENT-EINSTELLUNGEN (ANZAHL UND GRÖSSE) IGNORIERT."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_ENABLE_TITLE="Maximales Backup-Alter-Kontingent aktivieren"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_DESCRIPTION="Backups, die an diesem Tag des Monats erstellt wurden, werden nicht gelöscht. Behalten Sie die Standardeinstellung 1, um immer die Backups vom 1. Tag des Monats zu bewahren."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_KEEPDAY_TITLE="Backups von diesem Tag des Monats nicht löschen"
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_DESCRIPTION="Backups, die älter als diese Anzahl von Tagen sind, werden automatisch gelöscht. Behalten Sie die Standardeinstellung 31, um alle Backups des letzten Monats aufzubewahren."
COM_AKEEBA_CONFIG_MAXAGEQUOTA_MAXDAYS_TITLE="Maximales Backup-Alter in Tagen"
COM_AKEEBA_CONFIG_MAXEXECTIME_DESCRIPTION="Jeder Akeeba Backup-Schritt dauert <i>höchstens</i> so lange, wie hier festgelegt. Verwenden Sie einen Wert, der unter Ihrer maximalen PHP-Ausführungszeit liegt. In der Regel ist eine Einstellung von 10 Sekunden ausreichend, außer bei sehr restriktiven Hostern.<b>Tipp</b>: Wählen Sie „Benutzerdefiniert" und geben Sie Ihren gewünschten Wert ein, wenn er nicht in der Liste aufgeführt ist."
COM_AKEEBA_CONFIG_MAXEXECTIME_TITLE="Maximale Ausführungszeit"
COM_AKEEBA_CONFIG_MAXPACKET_DESCRIPTION="Die maximale Größe in Bytes jeder erweiterten INSERT-Anweisung. Es wird empfohlen, diesen Wert niedrig genug zu halten, damit MySQL beim Wiederherstellen Ihres Datenbank-Dumps keinen Fehler auslöst."
COM_AKEEBA_CONFIG_MAXPACKET_TITLE="Max. Paketgröße für erweiterte INSERTs"
COM_AKEEBA_CONFIG_MINEXECTIME_DESCRIPTION="Jeder Akeeba Backup-Schritt dauert <i>mindestens</i> so lange, wie hier festgelegt. Dies ist erforderlich, um Anti-DoS-Sicherheitslösungen zu umgehen. Wenn Sie 403 Forbidden- oder AJAX-Fehler erhalten, erhöhen Sie bitte diese Einstellung. Bei Einstellung auf 0 wird diese Funktion deaktiviert.<br/><br/><b>Tipp</b>: Wählen Sie „Benutzerdefiniert" und geben Sie Ihren gewünschten Wert ein, wenn er nicht in der Liste aufgeführt ist."
COM_AKEEBA_CONFIG_MINEXECTIME_TITLE="Minimale Ausführungszeit"
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_DESCRIPTION="Wenn aktiviert, versucht Akeeba Backup, diese erweiterten MySQL 5-Datenbankentitäten zu sichern. Wenn Ihr Backup während der Backup-Phase hängt, müssen Sie dies möglicherweise deaktivieren."
COM_AKEEBA_CONFIG_MYSQL5FEATURES_ENABLE_TITLE="PROCEDUREs, FUNCTIONs und TRIGGERs sichern"
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TIP="Entfernt USING BTREE und USING HASH aus den Tabellenindexdefinitionen in Dump-Dateien. Dies ist für die Wiederherstellung auf Servern erforderlich, auf denen eine der Indexierungs-Engines deaktiviert ist (z. B. bei neuesten XAMPP-Versionen). WARNUNG! DIES KANN AUF MANCHEN SERVERN ZU WIEDERHERSTELLUNGSPROBLEMEN FÜHREN."
COM_AKEEBA_CONFIG_MYSQLNOBTREE_TITLE="Index-Engine überspringen"
COM_AKEEBA_CONFIG_NODEPENDENCIES_DESCRIPTION="Wenn aktiviert, verfolgt Akeeba Backup keine Abhängigkeiten zwischen Tabellen und Ansichten. Verwenden Sie dies nur, wenn Sie über Hunderte von Datenbanktabellen verfügen und keine MySQL VIEWs, FUNCTIONs, PROCEDUREs, TRIGGERs oder Tabellen mit den (äußerst selten verwendeten) TEMPORARY-, MEMORY-, MERGE- oder FEDERATED-Engines verwenden."
COM_AKEEBA_CONFIG_NODEPENDENCIES_TITLE="Keine Abhängigkeitsverfolgung"
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_DESCRIPTION="Gesamtanzahl veralteter Einträge (Backups, deren Dateien gelöscht wurden), die auf der Seite „Backups verwalten" aufbewahrt werden sollen. Auf 0 setzen für kein Limit."
COM_AKEEBA_CONFIG_OBSOLETEQUOTA_ENABLE_TITLE="Veraltete Einträge aufbewahren"
COM_AKEEBA_CONFIG_LOGFILES_TITLE="Veraltete Protokolldateien löschen"
COM_AKEEBA_CONFIG_LOGFILES_DESCRIPTION="Automatisches Löschen der Protokolldateien erfolgreicher Backup-Einträge. Die Protokolldatei des neuesten Backup-Eintrags wird in Berechnungen einbezogen, aber niemals entfernt. Wenn Ihr Backup-Profil eine Nachverarbeitungs-Engine hat, die nicht „Ohne" oder „Per E-Mail senden" ist, nehmen nur Einträge mit dem Status „Remote-Backup" an dieser Protokolldatei-Kontingent-Einstellung teil. Wenn Ihr Backup-Profil die Nachverarbeitungs-Engine „Ohne" oder „Per E-Mail senden" hat, nehmen nur Einträge mit dem Status „OK" oder „Remote-Backup" an dieser Protokolldatei-Kontingent-Einstellung teil. Diese Funktion wird nach dem Kontingent für veraltete Einträge ausgeführt; das Kontingent für veraltete Einträge kann ebenfalls alte Protokolldateien entfernen."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_TITLE="Typ des Kontingents für veraltete Protokolldateien"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DESCRIPTION="Wählen Sie die Methode, mit der bestimmt wird, welche alten Protokolldateien entfernt werden sollen."
COM_AKEEBA_CONFIG_LOGFILES_TYPE_SIZE="Maximale Größe"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_COUNT="Anzahl"
COM_AKEEBA_CONFIG_LOGFILES_TYPE_DAYS="Maximales Alter"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_TITLE="Anzahl der Protokolldateien"
COM_AKEEBA_CONFIG_LOGFILES_COUNT_DESCRIPTION="Anzahl der aufzubewahrenden Protokolldateien. Die Protokolldatei des zuletzt erstellten Backups kann in die Zählung einfließen, wird aber niemals gelöscht. Nur die Protokolldateien erfolgreicher Backup-Einträge werden für die Entfernung berücksichtigt."
COM_AKEEBA_CONFIG_LOGFILES_SIZE_TITLE="Größe der Protokolldateien (Megabyte)"
COM_AKEEBA_CONFIG_LOGFILES_SIZE_DESCRIPTION="Die maximale Gesamtgröße der aufzubewahrenden Protokolldateien. Die Protokolldatei des zuletzt erstellten Backups kann in die Berechnung einfließen, wird aber niemals gelöscht. Nur die Protokolldateien erfolgreicher Backup-Einträge werden für die Entfernung berücksichtigt."
COM_AKEEBA_CONFIG_LOGFILES_DAYS_TITLE="Alter der Protokolldateien (Tage)"
COM_AKEEBA_CONFIG_LOGFILES_DAYS_DESCRIPTION="Das maximale Alter der aufzubewahrenden Protokolldateien in Tagen. Die Protokolldatei des zuletzt durchgeführten Backups wird niemals gelöscht. Nur die Protokolldateien von erfolgreichen Backup-Einträgen werden für die Löschung berücksichtigt."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_DESCRIPTION="Wird automatisch ausgefüllt, wenn Sie Authentifizierungsschritt 1 abschließen. Teilen Sie NICHT dasselbe Token auf mehreren Websites. Authentifizieren Sie stattdessen jede Website separat."
COM_AKEEBA_CONFIG_ONEDRIVE_ACCESSTOKEN_TITLE="Zugriffstoken"
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_DESCRIPTION="Das Verzeichnis im Microsoft OneDrive-Laufwerk, in dem die Backup-Archive gespeichert werden sollen. Bitte verwenden Sie Schrägstriche, keine umgekehrten Schrägstriche, und setzen Sie immer einen Schrägstrich voran. Richtig: /some/thing. Falsch: some\thing. Ein einzelner Schrägstrich bedeutet, dass Archive im Stammverzeichnis des Laufwerks gespeichert werden."
COM_AKEEBA_CONFIG_ONEDRIVE_DIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_DESCRIPTION="Wählen Sie, welches Laufwerk (OneDrive Personal, OneDrive for Business oder SharePoint), auf das Ihr Konto Zugriff hat, zum Speichern der Backups verwendet werden soll. Sie müssen die Authentifizierung abschließen, bevor diese Liste befüllt wird. Dies ist nur sinnvoll, wenn Sie Zugriff auf mehr als ein OneDrive-Laufwerk haben (z. B. wenn Ihr Microsoft-Konto Teil des Abonnements einer Organisation ist). Wenn Sie unsicher sind, verwenden Sie die Option „Standard-Laufwerk", die Ihr persönliches Standard-Laufwerk verwendet – in der Regel gleichbedeutend mit der ersten Option „Laufwerk (OneDrive Personal)", die Sie unten sehen."
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_OPT_PERSONAL="Standard-Laufwerk"
COM_AKEEBA_CONFIG_ONEDRIVE_DRIVE_TITLE="Laufwerk"
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_DESCRIPTION="Wird automatisch ausgefüllt, wenn Sie Authentifizierungsschritt 1 abschließen. Teilen Sie NICHT dasselbe Token auf mehreren Websites. Authentifizieren Sie stattdessen jede Website separat."
COM_AKEEBA_CONFIG_ONEDRIVE_REFRESHTOKEN_TITLE="Aktualisierungstoken"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_DESCRIPTION="Dieser Filter gilt nur, wenn Sie versuchen, eine Joomla!-Installation zu sichern, z. B. eine Joomla!-Website in einem Unterverzeichnis/einer Subdomain Ihrer Website. In Joomla! 3.9 und später werden Benutzeraktionen in der Datenbank protokolliert, wodurch eine Tabelle mit Millionen von Zeilen entsteht und Ihr Backup verlangsamt wird. Aktivieren Sie diese Option, um solche Daten auszuschließen."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ACTIONLOGS_ENABLED_TITLE="Joomla! Benutzeraktionsprotokoll"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_DESCRIPTION="Wenn aktiviert, werden nur Dateien gesichert, die nach einem bestimmten Datum und einer bestimmten Uhrzeit geändert wurden."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_ENABLED_TITLE="Datumsabhängiger Filter"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_DESCRIPTION="Akeeba Backup sichert Dateien, die nach diesem Datum und dieser Uhrzeit geändert wurden. Das Format ist JJJJ-MM-TT hh:mm:ss. Alle Datums- und Zeitangaben beziehen sich auf die Zeitzone Ihres Servers."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_DATECONDITIONAL_START_TITLE="Dateien sichern, die geändert wurden nach"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_DESCRIPTION="Fehlerprotokolldateien, z. B. <code>error_log</code>, automatisch ausschließen, unabhängig davon, wo sie sich auf der zu sichernden Website befinden. Diese Dateien ändern ihre Größe während des Backups, was zu beschädigten Backups führen kann."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_ERRORLOGS_ENABLED_TITLE="Fehlerprotokolle ausschließen"
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_DESCRIPTION="Wenn aktiviert, schließt Akeeba Backup automatisch die gängigsten hostspezifischen Ordner zur Speicherung von Zugriffsstatistiken Ihrer Website aus. Diese Ordner sind für den Benutzer Ihrer Website schreibgeschützt, was bei einer Sicherung zu Wiederherstellungsproblemen führen kann."
COM_AKEEBA_CONFIG_OPTIONALFILTERS_HOSTSTATS_ENABLED_TITLE="Hostspezifische Statistikordner ausschließen"
COM_AKEEBA_CONFIG_OUTDIR_DESCRIPTION="Dies ist das Verzeichnis auf Ihrem Server, in dem Akeeba Backup die Backup-Archive und die Backup-Protokolldatei speichert. Sie können die folgenden Makros verwenden:<ul><li><b>[DEFAULT_OUTPUT]</b> Das Standard-Ausgabeverzeichnis</li><li><b>[SITEROOT]</b> Das Stammverzeichnis Ihrer Website</li><li><b>[ROOTPARENT]</b> Ein Verzeichnis oberhalb des Stammverzeichnisses Ihrer Website</li></ul>"
COM_AKEEBA_CONFIG_OUTDIR_TITLE="Ausgabeverzeichnis"
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_DESCRIPTION="DIES IST NICHT DER NAME DES SPEICHER-CONTAINERS! Gehen Sie zu Ihrem OVH Cloud Manager, Server, erweitern Sie Ihren Server und klicken Sie auf Speicher. Dort sehen Sie die Container-URL oberhalb der Liste Ihrer Dateien. Kopieren Sie sie hierher."
COM_AKEEBA_CONFIG_OVH_CONTAINERURL_TITLE="Container-URL"
COM_AKEEBA_CONFIG_OVH_DIRECTORY_DESCRIPTION="Das Verzeichnis innerhalb des OVH Objektspeicher-Containers, in dem die Backup-Archive gespeichert werden sollen. Um alles im Stammverzeichnis des Containers zu speichern, lassen Sie dieses Feld leer."
COM_AKEEBA_CONFIG_OVH_DIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_OVH_PASSWORD_DESCRIPTION="DIES IST NICHT IHR OVH-ANMELDEKENNWORT! Erstellen Sie einen Benutzer in Ihrem OVH Cloud Manager unter Server, erweitern Sie Ihren Server, klicken Sie auf OpenStack und dann auf Benutzer hinzufügen. Kopieren Sie das Passwort des erstellten Benutzers hierher."
COM_AKEEBA_CONFIG_OVH_PASSWORD_TITLE="OpenStack-Passwort"
COM_AKEEBA_CONFIG_OVH_PROJECTID_DESCRIPTION="Die Projekt-ID Ihres OVH Cloud-Servers. Erweitern Sie im OVH Cloud Manager Ihren Server und klicken Sie auf den Link Speicher. Im Hauptbereich der Seite sehen Sie den Namen des Servers und darunter eine 32-stellige alphanumerische Zeichenfolge wie z. B. a0b1c2d3e4f56789abcdef0123456789. Dies ist die Projekt-ID, die Sie hier eingeben müssen."
COM_AKEEBA_CONFIG_OVH_PROJECTID_TITLE="Projekt-ID"
COM_AKEEBA_CONFIG_OVH_USERNAME_DESCRIPTION="DIES IST NICHT IHR OVH-ANMELDEBENUTZERNAME! Erstellen Sie einen Benutzer in Ihrem OVH Cloud Manager unter Server, erweitern Sie Ihren Server, klicken Sie auf OpenStack und dann auf Benutzer hinzufügen. Kopieren Sie die ID des erstellten Benutzers hierher."
COM_AKEEBA_CONFIG_OVH_USERNAME_TITLE="OpenStack-Benutzername"
COM_AKEEBA_CONFIG_PARTSIZE_DESCRIPTION="Akeeba Backup kann aufgeteilte (mehrteilige) Archive erstellen, um Größenbeschränkungen unter verschiedenen Umständen zu umgehen. Diese Option legt die maximale Größe jedes Archivteils fest. Wenn Sie den Wert auf 0 reduzieren, wird die Mehrteilfunktion deaktiviert.</br><b>Wichtig:</b>Wenn Sie eine Datenverarbeitungs-Engine verwenden, die Archive an einen entfernten Ort (z. B. Cloud-Speicher) überträgt, verwenden Sie für optimale Ergebnisse eine Einstellung von etwa 1 bis 5 MB."
COM_AKEEBA_CONFIG_PARTSIZE_TITLE="Teilgröße für aufgeteilte Archive"
COM_AKEEBA_CONFIG_PERMISSIONS_0600="0600 – Hohe Sicherheit. Kann auf einfachen Servern zu Problemen führen"
COM_AKEEBA_CONFIG_PERMISSIONS_0644="0644 – Mittlere Sicherheit, für den Einsatz auf Servern mit einer einzelnen Website"
COM_AKEEBA_CONFIG_PERMISSIONS_0666="0666 – Geringe Sicherheit, maximale Kompatibilität mit kommerziellen Hosts"
COM_AKEEBA_CONFIG_PERMISSIONS_DESCRIPTION="Legen Sie die Dateiberechtigungen für die Backup-Archivdateien fest. Gilt nur für Linux, macOS, BSD und andere UNIX-ähnliche Hosts (NICHT Windows). Wenn Sie unsicher sind, belassen Sie den Wert bei 0666. Eine Änderung kann das Herunterladen und/oder Löschen von Backup-Archivdateien über FTP und SFTP unmöglich machen. Wenn Ihr Server PHP-FPM verwendet oder PHP anderweitig unter demselben Benutzer wie das Systemkonto Ihrer Website ausführt, verwenden Sie 0600 für optimale Sicherheit."
COM_AKEEBA_CONFIG_PERMISSIONS_TITLE="Archivberechtigungen"
COM_AKEEBA_CONFIG_PGDUMP_PATH_DESCRIPTION="Der absolute Dateisystempfad zum Kommandozeilenwerkzeug pg_dump auf Ihrem Server. Wenn das Feld leer bleibt, versucht Akeeba Backup, ihn automatisch zu ermitteln."
COM_AKEEBA_CONFIG_PGDUMP_PATH_TITLE="Pfad zu pg_dump"
COM_AKEEBA_CONFIG_PLATFORM="Website-Überschreibungen"
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_DESCRIPTION="Wenn aktiviert, versucht Akeeba Backup, eine Verbindung zu Ihrem FTP-Server über eine SSL-verschlüsselte Verbindung herzustellen. <strong>Dies ist nicht dasselbe wie SFTP, SCP oder „Secure FTP"!</strong> Beachten Sie, dass Sie Verbindungsfehler erhalten, wenn Ihr Server diese Methode nicht unterstützt."
COM_AKEEBA_CONFIG_POSTPROCFTP_FTPS_TITLE="FTP über SSL (FTPS) verwenden"
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_DESCRIPTION="Hostname des FTP-Servers ohne Protokoll. Das bedeutet, dass <tt>ftp://example.com</tt> <b>ungültig</b> und <tt>example.com</tt> gültig ist. Diese Engine unterstützt nur FTP- und FTPS-Server. Sie unterstützt <u>keine</u> SFTP-, SCP- und anderen SSH-Varianten."
COM_AKEEBA_CONFIG_POSTPROCFTP_HOST_TITLE="Hostname"
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_DESCRIPTION="Der absolute <b>FTP</b>-Pfad zum Verzeichnis, in das die Dateien hochgeladen werden. Wenn Sie unsicher sind, verbinden Sie sich mit FileZilla mit Ihrem Server, navigieren Sie zum gewünschten Verzeichnis und kopieren Sie den Pfad, der im rechten Bereich oberhalb der Verzeichnisliste angezeigt wird. Es handelt sich in der Regel um einen kurzen Pfad wie z. B. <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCFTP_INITDIR_TITLE="Anfangsverzeichnis"
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_DESCRIPTION="Der relative Pfad zum Anfangsverzeichnis; er wird erstellt, wenn er nicht vorhanden ist. Lassen Sie das Feld leer, um Archive direkt im Anfangsverzeichnis hochzuladen. Sie können die folgenden Makros verwenden:<ul><li><b>[HOST]</b> Der Hostname. WARNUNG! Dieses Tag funktioniert nicht im CRON-Modus.</li><li><b>[DATE]</b> Aktuelles Datum</li><li><b>[TIME]</b> Aktuelle Uhrzeit</li></ul>Weitere sind verfügbar; konsultieren Sie bitte die Dokumentation."
COM_AKEEBA_CONFIG_POSTPROCFTP_OPTSUBDIR_TITLE="Unterverzeichnis"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_DESCRIPTION="Passiven FTP-Modus beim Übertragen von Daten verwenden. Dies ist standardmäßig aktiviert, da es die einzige Methode ist, die durch Firewalls funktioniert, die üblicherweise auf Webservern installiert sind. Deaktivieren Sie diese Option nur, wenn Sie sicher sind, dass sich Ihr Webserver nicht hinter einer Firewall befindet und Ihr FTP-Server zwingend aktive Dateiübertragungen erfordert."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSIVE_TITLE="Passiven Modus verwenden"
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_DESCRIPTION="Passwort des FTP-Servers. Es ist in der Regel Groß-/Kleinschreibung sensitiv. Wenn Sie unsicher sind, wenden Sie sich bitte an Ihren Netzwerkadministrator."
COM_AKEEBA_CONFIG_POSTPROCFTP_PASSWORD_TITLE="Passwort"
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_DESCRIPTION="Port des FTP-Servers. Die gebräuchlichste Einstellung ist 21. Wenn Sie unsicher sind, wenden Sie sich bitte an Ihren Netzwerkadministrator."
COM_AKEEBA_CONFIG_POSTPROCFTP_PORT_TITLE="Port"
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_DESCRIPTION="Verwenden Sie diese Schaltfläche, um die FTP-Verbindung zu testen und bei einem Fehler die Verbindungsfehler anzuzeigen."
COM_AKEEBA_CONFIG_POSTPROCFTP_TEST_TITLE="FTP-Verbindung testen"
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_DESCRIPTION="Benutzername des FTP-Servers. Er ist in der Regel Groß-/Kleinschreibung sensitiv. Wenn Sie unsicher sind, wenden Sie sich bitte an Ihren Netzwerkadministrator."
COM_AKEEBA_CONFIG_POSTPROCFTP_USER_TITLE="Benutzername"
COM_AKEEBA_CONFIG_POSTPROCPARTS_DESCRIPTION="Wenn aktiviert, führt Akeeba Backup die Nachverarbeitungs-Engine für jedes Teil aus, sobald es fertiggestellt ist. Wenn deaktiviert, führt Akeeba Backup die Nachverarbeitung für alle Teile am Ende des Backup-Vorgangs durch."
COM_AKEEBA_CONFIG_POSTPROCPARTS_TITLE="Jedes Teil sofort verarbeiten"
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_DESCRIPTION="Hostname des SFTP-Servers ohne Protokoll. Das bedeutet, dass <tt>sftp://example.com</tt> oder <tt>ssh://example.com</tt> <b>ungültig</b> ist und NICHT verwendet werden darf, aber <tt>example.com</tt> gültig ist und VERWENDET werden muss. Diese Engine unterstützt nur SFTP (SSH)-Server. Sie unterstützt <u>keine</u> FTP-, FTPS- oder anderen FTP-Varianten. Sie erfordert die Installation und Aktivierung der PHP SSH2-Erweiterung."
COM_AKEEBA_CONFIG_POSTPROCSFTP_HOST_TITLE="Hostname"
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_DESCRIPTION="Der absolute <b>SFTP</b>-Pfad (in der Regel identisch mit dem Dateisystempfad) zum Verzeichnis, in das die Dateien hochgeladen werden. Wenn Sie unsicher sind, verbinden Sie sich mit FileZilla mit Ihrem Server, navigieren Sie zum gewünschten Verzeichnis und kopieren Sie den Pfad, der im rechten Bereich oberhalb der Verzeichnisliste angezeigt wird. Es handelt sich in der Regel um einen langen Pfad wie z. B. <tt>/home/myuser/public_html</tt>."
COM_AKEEBA_CONFIG_POSTPROCSFTP_INITDIR_TITLE="Anfangsverzeichnis"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_DESCRIPTION="Passwort des SFTP-Servers. Es ist in der Regel Groß-/Kleinschreibung sensitiv. Wenn Sie unsicher sind, wenden Sie sich bitte an Ihren Netzwerkadministrator."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PASSWORD_TITLE="Passwort"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_DESCRIPTION="Port des SFTP-Servers. Die gebräuchlichste Einstellung ist 22. Wenn Sie unsicher sind, wenden Sie sich bitte an Ihren Netzwerkadministrator."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PORT_TITLE="Port"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_DESCRIPTION="LESEN SIE DIE DOKUMENTATION, BEVOR SIE DIESE FUNKTION VERWENDEN. Der absolute Dateisystempfad zu einer RSA/DSA-Privatschlüsseldatei, die für die Verbindung mit dem Remote-Server verwendet wird. Wenn sie verschlüsselt ist, geben Sie die Passphrase im Passwortfeld oben ein. Wenn Sie nicht wissen, was dies ist, oder wenn Sie glauben, dafür Support anfragen zu müssen, lassen Sie das Feld leer und fragen Sie uns nicht dazu."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PRIVKEY_TITLE="Private-Key-Datei (erweitert)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_DESCRIPTION="LESEN SIE DIE DOKUMENTATION, BEVOR SIE DIESE FUNKTION VERWENDEN. Der absolute Dateisystempfad zu einer RSA/DSA-Public-Key-Datei, die für die Verbindung mit dem Remote-Server verwendet wird. Wenn Sie nicht wissen, was dies ist, oder wenn Sie glauben, dafür Support anfragen zu müssen, lassen Sie das Feld leer und fragen Sie uns nicht dazu."
COM_AKEEBA_CONFIG_POSTPROCSFTP_PUBKEY_TITLE="Public-Key-Datei (erweitert)"
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_DESCRIPTION="Verwenden Sie diese Schaltfläche, um die SFTP-Verbindung zu testen und bei einem Fehler die Verbindungsfehler anzuzeigen."
COM_AKEEBA_CONFIG_POSTPROCSFTP_TEST_TITLE="SFTP-Verbindung testen"
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_DESCRIPTION="Benutzername des SFTP-Servers. Er ist in der Regel Groß-/Kleinschreibung sensitiv. Wenn Sie unsicher sind, wenden Sie sich bitte an Ihren Netzwerkadministrator."
COM_AKEEBA_CONFIG_POSTPROCSFTP_USER_TITLE="Benutzername"
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_DESCRIPTION="Stoppt den Backup-Vorgang sofort und markiert ihn als fehlgeschlagen, wenn ein Upload-Fehler auftritt. <strong>Diese Option kann irreführend und gefährlich sein.</strong> Es ist möglich, dass Sie ein vollständiges, gültiges Backup haben, das lediglich ganz oder teilweise nicht hochgeladen werden konnte. Wenn Sie diese Option aktivieren, werden die verbleibenden Backup-Archivdateien von Ihrem Server entfernt und alle (teilweise) in den Remote-Speicher hochgeladenen Archivdateien zurückgelassen. Mit anderen Worten: Sie haben kein funktionierendes Backup. Es gibt nur sehr wenige Anwendungsfälle, in denen dies mehr Sinn ergibt als das Standardverhalten, das es Ihnen ermöglicht, den Upload der Backup-Archivdatei über die Seite „Backups verwalten" fortzusetzen. Daher empfehlen wir dringend, dass diese Option nur von erfahrenen Benutzern aktiviert wird, die die Konsequenzen vollständig verstehen."
COM_AKEEBA_CONFIG_POSTPROC_ABORT_ON_FAIL_TITLE="Backup bei Upload-Fehler als fehlgeschlagen markieren"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_DESCRIPTION="Die E-Mail-Adresse, an die die Backup-Dateien gesendet werden"
COM_AKEEBA_CONFIG_PROCEMAIL_ADDRESS_TITLE="E-Mail-Adresse"
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_DESCRIPTION="Der Betreff der E-Mail (optional). Diese Option dient in erster Linie dazu, Backups von mehreren Websites zu unterscheiden."
COM_AKEEBA_CONFIG_PROCEMAIL_SUBJECT_TITLE="E-Mail-Betreff"
COM_AKEEBA_CONFIG_PROCENGINE_DESCRIPTION="Nachverarbeitungs-Engines ermöglichen es Akeeba Backup, fertiggestellte Backup-Archivteile auf andere Server und Remote-Speicheranbieter zu übertragen."
COM_AKEEBA_CONFIG_PROCENGINE_TITLE="Nachverarbeitungs-Engine"
COM_AKEEBA_CONFIG_PROXY_HOST_DESC="Wenn Ihre Website eine Verbindung zu einem Proxy-Server benötigt, um mit der Außenwelt zu kommunizieren (ausgehender Proxy), geben Sie hier den Proxy-Hostnamen oder die IP-Adresse ein. Lassen Sie dieses Feld leer, um keinen Proxy zu verwenden."
COM_AKEEBA_CONFIG_PROXY_HOST_LABEL="Proxy-Hostname / IP-Adresse"
COM_AKEEBA_CONFIG_PROXY_PASS_DESC="Wenn Ihr Proxy-Server eine Authentifizierung erfordert, geben Sie hier das Proxy-Authentifizierungspasswort ein. Vergessen Sie nicht, oben einen Benutzernamen einzugeben."
COM_AKEEBA_CONFIG_PROXY_PASS_LABEL="Proxy-Passwort"
COM_AKEEBA_CONFIG_PROXY_PORT_DESC="Geben Sie den TCP/IP-Port ein, den der Proxy-Server abhört. Üblicherweise ist dies 8080 oder 3128. Im Zweifelsfall fragen Sie Ihren Hoster oder Netzwerkadministrator."
COM_AKEEBA_CONFIG_PROXY_PORT_LABEL="Proxy-Port"
COM_AKEEBA_CONFIG_PROXY_USER_DESC="Wenn Ihr Proxy-Server eine Authentifizierung erfordert, geben Sie hier den Proxy-Authentifizierungs-Benutzernamen ein. Lassen Sie dieses Feld leer, um einen Proxy ohne Authentifizierung zu verwenden."
COM_AKEEBA_CONFIG_PROXY_USER_LABEL="Proxy-Benutzername"
COM_AKEEBA_CONFIG_PUSH_APIKEY_DESC="Gehen Sie zu https://www.pushbullet.com/account und kopieren Sie den Access Token von dieser Seite in das Textfeld hier. Er wird verwendet, um Push-Nachrichten an Ihr Konto zu senden. Sie können mehrere Token durch Kommas getrennt einfügen. Hinweis: Der Access Token ist für alle Personen sichtbar, die Zugang zu dieser Konfigurationsseite haben."
COM_AKEEBA_CONFIG_PUSH_APIKEY_LABEL="Pushbullet-Zugriffstoken"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_DESC="Soll Akeeba Backup Ihnen Benachrichtigungen senden, und wenn ja, wie?"
COM_AKEEBA_CONFIG_PUSH_PREFERENCE_LABEL="Push-Benachrichtigungen"
COM_AKEEBA_CONFIG_QUICKICON_DESC="Wenn aktiviert, zeigt Akeeba Backup ein Ein-Klick-Backup-Symbol oben auf der Systemsteuerungsseite an. Ein Klick darauf aktiviert dieses Profil und startet ein Backup, ohne dass weitere Aktionen Ihrerseits erforderlich sind."
COM_AKEEBA_CONFIG_QUICKICON_LABEL="Ein-Klick-Backup-Symbol"
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_DESCRIPTION="Wenn aktiviert, nimmt das laufende Backup an den Remote-Datei-Kontingenten teil. Dies kann problematisch sein: Wenn das Backup nur teilweise in den Remote-Speicher hochgeladen wurde und die Kontingenteinstellungen so konfiguriert sind, dass nur das neueste Backup aufbewahrt wird, könnten Sie ohne ein gültiges remote gespeichertes Backup dastehen. Das Deaktivieren dieser Option verringert die Wahrscheinlichkeit, dass Sie ohne ein gültiges Backup im Remote-Speicher dastehen, auf Kosten der Speicherung eines weiteren Backup-Archivs remote."
COM_AKEEBA_CONFIG_REMOTEQUOTALATEST_TITLE="Aktuelles Backup nimmt an Remote-Datei-Kontingenten teil"
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_DESCRIPTION="Wenn aktiviert, werden die unten angegebenen Kontingenteinstellungen auf Dateien angewendet, die im Remote-Speicher gespeichert sind, wie Amazon S3 oder Remote-FTP-Server."
COM_AKEEBA_CONFIG_REMOTEQUOTA_ENABLE_TITLE="Remote-Datei-Kontingente aktivieren"
COM_AKEEBA_CONFIG_RUNTIMEBIAS_DESCRIPTION="Dies legt fest, wie konservativ Akeeba Backup beim Versuch vorgeht, eine Zeitüberschreitung zu vermeiden. Je niedriger dieser Wert, desto konservativer verhält sich das Programm. Wenn Sie Zeitüberschreitungsfehler erhalten, versuchen Sie bitte, sowohl die maximale Ausführungszeit als auch diese Einstellung zu verringern.<b>Tipp</b>: Wählen Sie „Benutzerdefiniert" und geben Sie Ihren gewünschten Wert ein, wenn er nicht in der Liste vorhanden ist."
COM_AKEEBA_CONFIG_RUNTIMEBIAS_TITLE="Ausführungszeit-Toleranz"
COM_AKEEBA_CONFIG_S3ACCESSKEY_DESCRIPTION="Ihr Amazon S3 Zugriffsschlüssel, der Ihnen auf Ihrer persönlichen Amazon Web Services-Profilseite zur Verfügung gestellt wird"
COM_AKEEBA_CONFIG_S3ACCESSKEY_TITLE="Zugriffsschlüssel"
COM_AKEEBA_CONFIG_S3BUCKET_DESCRIPTION="Der Name Ihres Amazon S3-Buckets"
COM_AKEEBA_CONFIG_S3BUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_DESCRIPTION="Für die Verwendung mit Drittanbieter-Speicherdiensten, die eine S3-kompatible API implementieren. Geben Sie den Endpunkt (API-URL) der S3-kompatiblen API des Drittanbieter-Speicherdienstes ein. WICHTIG: Wenn Sie Amazon S3 verwenden, <strong>MUSS DIESES FELD LEER BLEIBEN</strong>."
COM_AKEEBA_CONFIG_S3CUSTOMENDPOINT_TITLE="Benutzerdefinierter Endpunkt"
COM_AKEEBA_CONFIG_S3DIRECTORY_DESCRIPTION="Das Verzeichnis in Ihrem Bucket, in dem die Backup-Archive gespeichert werden. Lassen Sie dieses Feld leer, um Dateien im Stammverzeichnis des Buckets zu speichern."
COM_AKEEBA_CONFIG_S3DIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_S3_ACL_TITLE="Dateiberechtigungen (ACLs)"
COM_AKEEBA_CONFIG_S3_ACL_DESCRIPTION="Wählen Sie die Berechtigungen für die hochgeladene Datei. In den meisten Fällen sind „Privat" oder „Bucket-Eigentümer kann lesen" die am besten geeigneten Optionen. Wenn Sie einen Drittanbieter-S3-kompatiblen Dienst verwenden, möchten Sie möglicherweise „Privat" anstelle der Standardeinstellung verwenden."
COM_AKEEBA_CONFIG_S3_ACL_PRIVATE="Privat"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ="Jeder kann lesen"
COM_AKEEBA_CONFIG_S3_ACL_PUBLIC_READ_WRITE="Jeder kann lesen und schreiben"
COM_AKEEBA_CONFIG_S3_ACL_AUTHENTICATED_READ="Authentifizierte IAM-Benutzer können lesen"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_READ="Bucket-Eigentümer kann lesen"
COM_AKEEBA_CONFIG_S3_ACL_BUCKET_OWNER_FULL_CONTROL="Bucket-Eigentümer hat volle Kontrolle"
COM_AKEEBA_CONFIG_S3LEGACY_DESCRIPTION="Wenn aktiviert, werden alle Uploads zu Amazon S3 als einzelne Teile erzwungen. Verwenden Sie diese Option, wenn Sie beim Hochladen von Backup-Teilen RequestTimeout-Fehler von der S3-Engine erhalten."
COM_AKEEBA_CONFIG_S3LEGACY_TITLE="Mehrteilige Uploads deaktivieren"
COM_AKEEBA_CONFIG_S3RRS_DESCRIPTION="Wählen Sie die Speicherklasse für Ihre Daten. Standard ist der reguläre Speicher für geschäftskritische Daten. Bitte konsultieren Sie die Amazon S3-Dokumentation für die Beschreibung der einzelnen Speicherklassen."
COM_AKEEBA_CONFIG_S3RRS_TITLE="Speicherklasse"
COM_AKEEBA_CONFIG_S3SECRETKEY_DESCRIPTION="Ihr Amazon S3 Geheimschlüssel, der Ihnen auf Ihrer persönlichen Amazon Web Services-Profilseite zur Verfügung gestellt wird"
COM_AKEEBA_CONFIG_S3SECRETKEY_TITLE="Geheimschlüssel"
COM_AKEEBA_CONFIG_S3USESSL_DESCRIPTION="Wenn aktiviert, wird beim Hochladen Ihrer Dateien eine sichere (HTTPS) Verbindung verwendet. Dies erhöht zwar die Sicherheit der übertragenen Daten, erhöht aber auch die Möglichkeit eines Backup-Fehlers aufgrund einer Zeitüberschreitung."
COM_AKEEBA_CONFIG_S3USESSL_TITLE="SSL verwenden"
COM_AKEEBA_CONFIG_S3_DUALSTACK_DESCRIPTION="Sollen die Dual-Stack-Endpunkte für Amazon S3 verwendet werden? Dies ermöglicht den Zugriff auf S3 über IPv6 für Server, die IPv6 unterstützen. Server ohne IPv6-Unterstützung können S3 weiterhin über IPv4 aufrufen. Diese Einstellung hat keine Auswirkung, wenn Sie einen benutzerdefinierten Endpunkt verwenden."
COM_AKEEBA_CONFIG_S3_DUALSTACK_TITLE="IPv6-Unterstützung (Dual-Stack) aktivieren"
COM_AKEEBA_CONFIG_S3_ALTERNATEDATEHEADERFORMAT_TITLE="Alternatives Datumsformat"
COM_AKEEBA_CONFIG_S3_ALTERNATEDATEHEADERFORMAT_DESCRIPTION="Deaktivieren Sie diese Einstellung nur, wenn der Support Sie dazu auffordert."
COM_AKEEBA_CONFIG_S3_USEHTTPDATEHEADER_TITLE="HTTP-Header „Date" anstelle von „X-Amz-Date" verwenden"
COM_AKEEBA_CONFIG_S3_USEHTTPDATEHEADER_DESCRIPTION="Aktivieren Sie diese Einstellung nur, wenn der Support Sie dazu auffordert."
COM_AKEEBA_CONFIG_S3_PRESIGNEDBUCKETINURL_TITLE="Bucket-Namen in vorsignierten v4-URLs einschließen"
COM_AKEEBA_CONFIG_S3_PRESIGNEDBUCKETINURL_DESCRIPTION="Aktivieren Sie diese Einstellung nur, wenn der Support Sie dazu auffordert."

COM_AKEEBA_CONFIG_SAVENEW_DEFAULT_PROFILE_NAME="Neues Backup-Profil"
COM_AKEEBA_CONFIG_SAVE_OK="Die Konfiguration wurde gespeichert"
COM_AKEEBA_CONFIG_SCANENGINE_DESCRIPTION="Legt fest, wie Akeeba Backup die Dateien und Ordner Ihrer Website durchsucht, um zu ermitteln, welche davon gesichert werden müssen."
COM_AKEEBA_CONFIG_SCANENGINE_TITLE="Dateisystem-Scan-Engine"
COM_AKEEBA_CONFIG_SECRETWORD_DESC="Dieses Passwort wird mit den Funktionen Frontend-Backup (Legacy API) und JSON API verwendet, um diese vor unbefugtem Zugriff zu schützen. Akeeba Backup aktiviert diese Funktionen NICHT, solange Sie hier kein langes, komplexes Passwort verwenden.<br><br><strong>Sicherheitshinweis:</strong> Der Geheimschlüssel ist die einzige Anmeldeinformation, die die JSON API akzeptiert, und er ist unbeschränkt. Wer ihn besitzt, kann jede Option ändern, ein Backup erstellen und das entstandene Archiv herunterladen – und ein Backup-Archiv ist eine vollständige Kopie Ihrer Website, einschließlich der Datenbank-Zugangsdaten und der Benutzerdatensätze. Behandeln Sie ihn mit derselben Sorgfalt wie Ihr Administrator-Passwort. Weitere Informationen finden Sie in der Dokumentation."
COM_AKEEBA_CONFIG_SECRETWORD_LABEL="Geheimschlüssel"
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_DESCRIPTION="Wenn aktiviert, werden Konfigurationseinstellungen mit der branchenüblichen AES-128-Verschlüsselung verschlüsselt."
COM_AKEEBA_CONFIG_SECURITY_USEENCRYPTION_LABEL="Verschlüsselung verwenden"
COM_AKEEBA_CONFIG_SFTPTEST_BADPREFIX="Sie sollten das Präfix sftp:// NICHT zu Ihrem SFTP-Hostnamen hinzufügen. Bitte entfernen Sie das Präfix sftp:// und versuchen Sie es erneut."
COM_AKEEBA_CONFIG_SFTPTEST_NOUPLOAD="Akeeba Backup konnte eine Verbindung zu Ihrem Server herstellen, konnte jedoch keine Testdatei hochladen. Der Backup-Upload könnte fehlschlagen."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_DESCRIPTION="Wenn aktiviert, löscht Akeeba Backup alte Backup-Dateien, wenn die Gesamtgröße der Backup-Archive den unten definierten Wert überschreitet. Diese Einstellung wird <b>pro Profil</b> angewendet."
COM_AKEEBA_CONFIG_SIZEQUOTA_ENABLE_TITLE="Größen-Kontingent aktivieren"
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_DESCRIPTION="Wenn die Gesamtgröße der mit dem aktuellen Profil erstellten Backup-Archive dieses Limit überschreitet, werden die ältesten Backups vom Server gelöscht.<br/><br/><b>Tipp</b>: Wählen Sie „Benutzerdefiniert" und geben Sie Ihren gewünschten Wert ein, wenn er nicht in der Liste vorhanden ist."
COM_AKEEBA_CONFIG_SIZEQUOTA_VALUE_TITLE="Größen-Kontingent"
COM_AKEEBA_CONFIG_SPLITDBDUMP_DESCRIPTION="Ihre Datenbank-Dumps werden in kleine Dateien aufgeteilt, um die Komprimierung zu verbessern und Dateigrößenprobleme auf bestimmten günstigen Hostern zu vermeiden. Idealerweise sollten Sie die Hälfte der Größe Ihres Schwellenwerts für große Dateien verwenden. Setzen Sie diesen Wert auf 0, um die Aufteilung zu deaktivieren und eine einzelne große Dump-Datei pro Datenbank zu erstellen."
