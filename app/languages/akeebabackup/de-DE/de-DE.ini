SOLO_CONFIG_PLATFORM_DBDRIVER_TITLE="Datenbanktreiber"
SOLO_CONFIG_PLATFORM_DBHOST_DESCRIPTION="Der Hostname oder die IP-Adresse des Datenbankservers. Üblicherweise localhost oder 127.0.0.1. Wenn Sie den SQLite-Treiber verwenden, geben Sie hier den Pfad zur Datenbankdatei an."
SOLO_CONFIG_PLATFORM_DBHOST_TITLE="Hostname des Datenbankservers"
