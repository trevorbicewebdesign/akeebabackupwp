COM_AKEEBA_SCHEDULE_LBL_FRONTEND_WEBCRON_TIMEOUT_INFO="180 Sekunden; wenn das Backup nicht abgeschlossen wird, erhöhen Sie diesen Wert. Die meisten Websites funktionieren mit einem Wert von 180 oder 600. Wenn Sie eine sehr große Website haben, deren Backup mehr als 5 Minuten in Anspruch nimmt, sollten Sie Akeeba Backup Professional und die native CLI-CRON-Aufgabe in Betracht ziehen, da diese deutlich kosteneffizienter ist."
