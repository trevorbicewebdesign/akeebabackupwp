SOLO_CONFIG_PLATFORM_ADDSOLO_DESCRIPTION="Standardmäßig schließt Akeeba Solo sich selbst nicht in das Backup ein. Wenn Sie diese Funktion aktivieren, wird Akeeba Solo sich selbst (Dateien und Datenbanktabellen) in das Backup Ihrer Website einschließen."
