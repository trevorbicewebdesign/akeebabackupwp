COM_AKEEBA_CONFIG_PLATFORM_DBHOST_DESCRIPTION="Der Hostname oder die IP-Adresse des Datenbankservers. Normalerweise localhost oder 127.0.0.1. Wird nur verwendet, wenn das Kontrollkästchen „Website-Datenbank überschreiben" aktiviert ist."
COM_AKEEBA_CONFIG_PLATFORM_DBHOST_TITLE="Hostname des Datenbankservers"
COM_AKEEBA_CONFIG_PLATFORM_DBPASSWORD_DESCRIPTION="Das Passwort für die Verbindung zur Datenbank der Website. Wird nur verwendet, wenn das Kontrollkästchen „Website-Datenbank überschreiben" aktiviert ist."
COM_AKEEBA_CONFIG_PLATFORM_DBPASSWORD_TITLE="Passwort"
COM_AKEEBA_CONFIG_PLATFORM_DBPORT_DESCRIPTION="(Optional) Der Port, auf dem der Datenbankserver lauscht. Wenn Sie unsicher sind, lassen Sie diese Option leer, um den Standardport zu verwenden (3306 für MySQL-Server). Wird nur verwendet, wenn das Kontrollkästchen „Website-Datenbank überschreiben" aktiviert ist."
COM_AKEEBA_CONFIG_PLATFORM_DBPORT_TITLE="Port des Datenbankservers"
COM_AKEEBA_CONFIG_PLATFORM_DBPREFIX_DESCRIPTION="Das Präfix der zu sichernden Datenbank einschließlich des Unterstrichs, z. B. <tt>jos_</tt>. Wird nur verwendet, wenn das Kontrollkästchen „Website-Datenbank überschreiben" aktiviert ist."
