COM_AKEEBA_CONFIG_ARCHIVERENGINE_DESCRIPTION="Legt das Archivformat von Akeeba Backup fest. Einige Engines, wie DirectFTP, erstellen keine Archive, sondern übertragen Ihre Dateien auf andere Server."
COM_AKEEBA_CONFIG_ARCHIVERENGINE_TITLE="Archivierungs-Engine"
COM_AKEEBA_CONFIG_AUTORESUME_DESCRIPTION="Wenn diese Option deaktiviert ist, hält Akeeba Backup das Backup an, wenn der Server mit einem Fehler antwortet. Wenn diese Option aktiviert ist, versucht Akeeba Backup, das Backup durch Wiederholung des letzten Schritts fortzusetzen. Dies gilt nur für Backend-Backups. Außerdem können damit nicht alle Backups erfolgreich fortgesetzt werden, die zu einem Fehler führen: Nur Backup-Versuche, die vorübergehend durch CPU-Nutzungsbeschränkungen des Servers oder Netzwerkausfälle blockiert werden, können fortgesetzt werden."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_DESCRIPTION="Wie oft soll Akeeba Backup versuchen, das Backup fortzusetzen, bevor es endgültig aufgibt. Bei den meisten Servern sind 3 bis 5 Versuche am besten geeignet."
COM_AKEEBA_CONFIG_AUTORESUME_MAXRETRIES_TITLE="Maximale Anzahl von Wiederholungsversuchen für einen Backup-Schritt nach einem AJAX-Fehler"
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_DESCRIPTION="Wie viele Sekunden gewartet werden soll, bevor das Backup fortgesetzt wird. Es wird empfohlen, diesen Wert auf 30 Sekunden oder mehr einzustellen (120 Sekunden werden in den meisten Fällen empfohlen), um dem Server die notwendige Zeit zu geben, den Backup-Prozess zu entsperren, bevor Akeeba Backup erneut versucht, ihn abzuschließen."
COM_AKEEBA_CONFIG_AUTORESUME_TIMEOUT_TITLE="Wartezeit vor einem erneuten Versuch des Backup-Schritts"
COM_AKEEBA_CONFIG_AUTORESUME_TITLE="Backup nach einem AJAX-Fehler fortsetzen"
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_DESCRIPTION="Der Name Ihres Kontos. Wenn Ihr Endpunkt foobar.blob.core.windows.net ist, lautet Ihr Kontoname <b>foobar</b> und Sie müssen <em>foobar</em> in dieses Feld eingeben."
COM_AKEEBA_CONFIG_AZURE_ACCOUNTNAME_TITLE="Kontoname"
COM_AKEEBA_CONFIG_AZURE_CONTAINER_DESCRIPTION="Der Windows Azure BLOB Storage-Container für die Backup-Archive. Der Container muss bereits vorhanden sein."
COM_AKEEBA_CONFIG_AZURE_CONTAINER_TITLE="Container"
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_DESCRIPTION="Das Verzeichnis innerhalb des Windows Azure BLOB Storage-Containers zum Speichern der Backup-Archive. Um alles im Stammverzeichnis des Containers zu speichern, lassen Sie dieses Feld leer."
COM_AKEEBA_CONFIG_AZURE_DIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_AZURE_KEY_DESCRIPTION="Ihren primären Zugriffsschlüssel finden Sie auf Ihrer Kontoseite auf windows.azure.com. Kopieren Sie ihn und fügen Sie ihn hier ein. Er endet immer mit zwei Gleichheitszeichen."
COM_AKEEBA_CONFIG_AZURE_KEY_TITLE="Primärer Zugriffsschlüssel"
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_DESCRIPTION="Geben Sie Ihre BackBlaze Application Key ID ein. Diese Information finden Sie auf <a href='https://secure.backblaze.com/b2_buckets.htm'>Ihrer BackBlaze-Kontoseite</a>, nachdem Sie auf 'Show Account ID and Application Key' geklickt haben. Wenn Sie Ihren Master-Schlüssel verwenden, geben Sie stattdessen Ihre Konto-ID ein."
COM_AKEEBA_CONFIG_BACKBLAZE_ACCOUNTID_TITLE="Application Key ID"
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_DESCRIPTION="Geben Sie Ihren BackBlaze Application Key ein. Diese Information finden Sie auf <a href='https://secure.backblaze.com/b2_buckets.htm'>Ihrer BackBlaze-Kontoseite</a>, nachdem Sie auf 'Show Account ID and Application Key' geklickt haben. <strong>WARNUNG</strong>! Dieser wird Ihnen von BackBlaze nur EINMAL angezeigt. Um ihn erneut anzuzeigen, müssen Sie den Application Key neu generieren, wodurch alle zuvor verknüpften Instanzen von Akeeba Backup getrennt werden, bis Sie dort den <em>neuen</em> Application Key eingeben."
COM_AKEEBA_CONFIG_BACKBLAZE_APPLICATIONKEY_TITLE="Application Key"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_DESCRIPTION="Ihr Backblaze-Bucket-Name"
COM_AKEEBA_CONFIG_BACKBLAZE_BUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_BACKBLAZE_DIRECTORY_DESCRIPTION="Das Verzeichnis in Ihrem Bucket, in dem die Backup-Archive gespeichert werden. Lassen Sie dieses Feld leer, um Dateien im Stammverzeichnis des Buckets zu speichern."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_DESCRIPTION="Wenn Sie diese Option aktivieren, führt Akeeba Backup einteilige Uploads zu Backblaze durch. Sie müssen eine kleinere Einstellung für die Teilgröße bei geteilten Archiven in der Konfiguration der Archivierungs-Engine verwenden, um zu verhindern, dass der Upload eine Zeitüberschreitung verursacht und der Backup-Prozess fehlschlägt."
COM_AKEEBA_CONFIG_BACKBLAZE_DISABLEMULTIPART_TITLE="Mehrteilige Uploads deaktivieren"
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_DESC="Soll die Backup-Startzeit auf der Seite „Backups verwalten" in die Zeitzone des aktuell angemeldeten Benutzers umgerechnet werden? Wenn auf „Nein" gesetzt, werden alle Backup-Startzeiten in der GMT-Zeitzone angezeigt. Diese Option hat KEINEN Einfluss auf die Variablen [DATE] und [TIME] für die Benennung von Backup-Dateien oder die Standardbeschreibung. Verwenden Sie die Option „Zeitzone des Backups", um das Verhalten dieser Variablen zu ändern."
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_LABEL="Lokale Uhrzeit in „Backups verwalten""
COM_AKEEBA_CONFIG_BACKEND_LOCALTIME_WP_DESC="Wenn deaktiviert, wird die Backup-Startzeit auf der Seite „Backups verwalten" in der GMT-Zeitzone angezeigt. Wenn aktiviert, wird die Backup-Startzeit in der Zeitzone angezeigt, die Sie in WordPress selbst festgelegt haben (Einstellungen, Allgemein, Zeitzone)."
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_DESC="Soll die Option zum Herunterladen der Backup-Archive über den Browser angezeigt werden, auch wenn dies nicht empfohlen wird? Bitte beachten Sie, dass diese Option NICHT verfügbar ist, wenn Sie WP_DEBUG aktiviert haben oder die Anzeige von PHP-Fehlern anderweitig aktiviert ist – als grundlegende Vorsichtsmaßnahme gegen beschädigte (defekte oder unvollständige) Downloads. <strong>WARNUNG! Durch die Aktivierung dieser Option stimmen Sie zu, keinen Support für Probleme im Zusammenhang mit dem Entpacken von Backup-Archiven zu erhalten.</strong>"
COM_AKEEBA_CONFIG_BACKEND_SHOWBROWSERDOWNLOAD_LABEL="Download von Backup-Archiven über den Browser erlauben"
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_DESC="Soll Benutzern, die eine Website wiederherstellen, die Option angeboten werden, alles vor dem Entpacken eines Archivs zu löschen? Diese Option gilt nur für die Professional-Version unserer Software. WARNUNG! DIES IST ÄUSSERST GEFÄHRLICH. LESEN SIE DIE DOKUMENTATION SEHR SORGFÄLTIG, BEVOR SIE DIESE OPTION AKTIVIEREN. WENN SIE DIESE FUNKTION WÄHREND DER WIEDERHERSTELLUNG VERWENDEN, VERZICHTEN SIE AUF JEDES RECHT AUF SUPPORT UND ÜBERNEHMEN DIE VOLLE VERANTWORTUNG UND HAFTUNG."
COM_AKEEBA_CONFIG_BACKEND_SHOWDELETEONRESTORE_LABEL="Option „Alles vor dem Entpacken löschen" anzeigen"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_ABBREVIATION="Zeitzone"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_DESC="Das Zeitzonen-Suffix, das neben der Backup-Startzeit auf der Seite „Backups verwalten" angezeigt wird.<br/>Ohne: Es wird kein Suffix angezeigt (nicht empfohlen).<br/>Zeitzone: Eine abgekürzte Zeitzone, z. B. CET für Mitteleuropäische Zeit.<br/>GMT-Offset: Der Versatz zur GMT-Zeitzone. Dieser kann sich je nach Sommerzeit ändern. Beispielsweise wird die CET-Zeitzone im Winter als GMT+01:00 (eine Stunde vor GMT) und im Sommer als GMT+02:00 (zwei Stunden vor GMT) angezeigt."
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_GMTOFFSET="GMT-Offset"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_LABEL="Zeitzonen-Suffix"
COM_AKEEBA_CONFIG_BACKEND_TIMEZONETEXT_NONE="Ohne"
COM_AKEEBA_CONFIG_BACKUPTYPE_ALLDB="Alle konfigurierten Datenbanken (Archivdatei)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DBONLY="Nur Hauptdatenbank der Website (SQL-Datei)"
COM_AKEEBA_CONFIG_BACKUPTYPE_DESCRIPTION="Welche Art von Website-Backup Akeeba Backup durchführen soll"
COM_AKEEBA_CONFIG_BACKUPTYPE_FILEONLY="Nur Website-Dateien"
COM_AKEEBA_CONFIG_BACKUPTYPE_FULL="Vollständiges Website-Backup"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFILE="Nur Dateien, inkrementell"
COM_AKEEBA_CONFIG_BACKUPTYPE_INCFULL="Vollständige Website, inkrementelle Dateien"
COM_AKEEBA_CONFIG_BACKUPTYPE_TITLE="Backup-Typ"
COM_AKEEBA_CONFIG_BACTHSIZE_DESCRIPTION="Eine Verringerung dieses Wertes schont den Arbeitsspeicher und verhindert HTTP-500-Fehler beim Sichern sehr großer Tabellen"
COM_AKEEBA_CONFIG_BACTHSIZE_TITLE="Anzahl der Zeilen pro Stapel"
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_DESCRIPTION="Dateien, die diese Größe überschreiten, werden unkomprimiert gespeichert oder ihre Verarbeitung erstreckt sich über mehrere Schritte (je nach Archivierungs-Engine), um Zeitüberschreitungen zu vermeiden. Wir empfehlen, diesen Wert nur auf schnellen und zuverlässigen Servern zu erhöhen."
COM_AKEEBA_CONFIG_BIGFILETHRESHOLD_TITLE="Schwellenwert für große Dateien"
COM_AKEEBA_CONFIG_BLANKOUTPASS_DESCRIPTION="Entfernt den Benutzernamen und das Passwort von Datenbankverbindungen aus dem Backup"
COM_AKEEBA_CONFIG_BLANKOUTPASS_TITLE="Benutzername/Passwort entfernen"
COM_AKEEBA_CONFIG_BOX_ACCESSTOKEN_TITLE="Zugriffstoken"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_ENABLE="Blockweisen Upload aktivieren"
COM_AKEEBA_CONFIG_BOX_CHUNKUPLOAD_SIZE="Blockgröße"
COM_AKEEBA_CONFIG_BOX_DIRECTORY_DESCRIPTION="Das Verzeichnis in Ihrem Box-Konto, in dem die Backup-Archive gespeichert werden. Lassen Sie dieses Feld leer, um Dateien im Stammverzeichnis des Box-Ordners zu speichern."
COM_AKEEBA_CONFIG_BOX_DIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_DESC="Klicken Sie auf diese Schaltfläche, um ein neues Fenster zu öffnen, in dem Sie sich bei Ihrem Konto beim Speicheranbieter anmelden können. Schließen Sie anschließend das Popup-Fenster und klicken Sie auf die Schaltfläche „Schritt 2" unten."
COM_AKEEBA_CONFIG_BOX_OPENOAUTH_TITLE="Authentifizierung – Schritt 1"
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_DESCRIPTION="Wird automatisch ausgefüllt, wenn Sie Schritt 1 der Authentifizierung oben abgeschlossen haben. Teilen Sie dasselbe Token NICHT auf mehreren Websites. Authentifizieren Sie stattdessen jede Website separat."
COM_AKEEBA_CONFIG_BOX_REFRESHTOKEN_TITLE="Aktualisierungstoken"
COM_AKEEBA_CONFIG_CHUNKSIZE_DESCRIPTION="Akeeba Backup verarbeitet große Dateien in kleinen Blöcken, um Zeitüberschreitungen zu vermeiden. Dieser Parameter definiert die maximale Blockgröße für diese Art der Verarbeitung."
COM_AKEEBA_CONFIG_CHUNKSIZE_TITLE="Blockgröße für die Verarbeitung großer Dateien"
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_DESCRIPTION="Wenn dieses Kontrollkästchen deaktiviert ist (Standard) und der Backup-Schritt in weniger Zeit abgeschlossen wird als die konfigurierte minimale Ausführungszeit, lässt Akeeba Backup den Server warten, bis diese Zeit erreicht ist. Auf sehr restriktiven Servern kann dies dazu führen, dass Ihr Backup abgebrochen wird. Durch Aktivieren dieses Kontrollkästchens wird die Wartezeit im Browser implementiert, wodurch diese Einschränkung umgangen wird. WICHTIG: Diese Option gilt nur für Backend-Backups. Frontend-, JSON-API-(Remote-) und Befehlszeilen-(CLI-)Backups implementieren die Wartezeit stets serverseitig."
COM_AKEEBA_CONFIG_CLIENTSIDEWAIT_TITLE="Clientseitige Implementierung der minimalen Ausführungszeit"
COM_AKEEBA_CONFIG_CLOUDFILESAPIKEY_DESCRIPTION="Ihr CloudFiles-API-Schlüssel"
COM_AKEEBA_CONFIG_CLOUDFILESAPIKEY_TITLE="API-Schlüssel"
COM_AKEEBA_CONFIG_CLOUDFILESCONTAINER_DESCRIPTION="Der CloudFiles-Container zur Aufbewahrung der Backup-Archive"
COM_AKEEBA_CONFIG_CLOUDFILESCONTAINER_TITLE="Container"
COM_AKEEBA_CONFIG_CLOUDFILESDIRECTORY_DESCRIPTION="Das Verzeichnis innerhalb des CloudFiles-Containers zur Speicherung der Backup-Archive. Um alles im Stammverzeichnis des Containers zu speichern, lassen Sie dieses Feld bitte leer."
COM_AKEEBA_CONFIG_CLOUDFILESDIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_CLOUDFILESUSERNAME_DESCRIPTION="Ihr CloudFiles-Benutzername"
COM_AKEEBA_CONFIG_CLOUDFILESUSERNAME_TITLE="Benutzername"
COM_AKEEBA_CONFIG_CLOUDME_DIRECTORY_DESCRIPTION="Das Verzeichnis in Ihrem CloudMe-Konto, in dem die Backup-Archive gespeichert werden. Lassen Sie dieses Feld leer, um Dateien im Stammverzeichnis des CloudMe-Ordners zu speichern."
COM_AKEEBA_CONFIG_CLOUDME_DIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_CLOUDME_PASSWORD_DESCRIPTION="Passwort"
COM_AKEEBA_CONFIG_CLOUDME_PASSWORD_TITLE="Passwort"
COM_AKEEBA_CONFIG_CLOUDME_USERNAME_DESCRIPTION="Benutzername"
COM_AKEEBA_CONFIG_CLOUDME_USERNAME_TITLE="Benutzername"
COM_AKEEBA_CONFIG_COUNTQUOTA_ENABLE_DESCRIPTION="Wenn aktiviert, löscht Akeeba Backup alte Backup-Dateien, wenn diese das unten definierte Limit überschreiten."
COM_AKEEBA_CONFIG_COUNTQUOTA_ENABLE_TITLE="Anzahl-Kontingent aktivieren"
COM_AKEEBA_CONFIG_COUNTQUOTA_VALUE_DESCRIPTION="Akeeba Backup löscht alte Backup-Dateien, wenn diese das in dieser Einstellung definierte Limit überschreiten. Mehrteilige Backups werden als <i>eine</i> Datei gezählt!<br/><br/><b>Tipp</b>: Wählen Sie „Benutzerdefiniert" und geben Sie den gewünschten Wert ein, wenn er nicht in der Liste vorhanden ist."
COM_AKEEBA_CONFIG_COUNTQUOTA_VALUE_TITLE="Anzahl-Kontingent"
COM_AKEEBA_CONFIG_DATEFORMAT_DESC="Ändern Sie die Anzeige des Start-Datums/-Uhrzeit von Backups auf der Seite „Backups verwalten". Lassen Sie dieses Feld leer, um die Standardformatierung zu verwenden. Sie können die Formatierungsoptionen der PHP-Funktion date verwenden, siehe: http://www.php.net/manual/en/function.date.php"
COM_AKEEBA_CONFIG_DATEFORMAT_LABEL="Datumsformat"
COM_AKEEBA_CONFIG_DELETEAFTER_DESCRIPTION="Wenn aktiviert, wird das Backup-Archiv von diesem Server entfernt, sobald die Nachverarbeitung erfolgreich abgeschlossen wurde."
COM_AKEEBA_CONFIG_DELETEAFTER_TITLE="Archiv nach Verarbeitung löschen"
COM_AKEEBA_CONFIG_DEREFERENCESYMLINKS_DESCRIPTION="Wenn aktiviert, werden symbolische Links wie normale Dateien und Verzeichnisse behandelt. Wenn nicht aktiviert, werden symbolische Links nicht verfolgt. Wenn Sie symbolische Links verwenden, die zu einer unendlichen Linkschleife führen, deaktivieren Sie diese Option."
COM_AKEEBA_CONFIG_DEREFERENCESYMLINKS_TITLE="Symbolische Links auflösen"
COM_AKEEBA_CONFIG_DESKTOP_NOTIFICATIONS_DESC="Soll die Erlaubnis zur Anzeige von Desktop-Benachrichtigungen angefragt werden? Desktop-Benachrichtigungen werden angezeigt, wenn ein Backup startet, abgeschlossen wird, eine Warnung ausgibt oder anhält. Sie werden nur in kompatiblen Browsern (in der Regel: Chrome, Safari, Firefox, Opera) angezeigt, wenn Sie Akeeba Backup die Berechtigung zur Anzeige von Desktop-Benachrichtigungen erteilen, wenn Sie auf der Systemsteuerungsseite dazu aufgefordert werden. Diese Option steuert nur, ob diese Aufforderung angezeigt werden soll. Sobald Sie die Berechtigungen für Desktop-Benachrichtigungen akzeptiert oder abgelehnt haben, hat diese Einstellung <b>keine Auswirkung</b> mehr. Desktop-Benachrichtigungen können dann nur noch über die Einstellungen Ihres Browsers aktiviert oder deaktiviert werden."
COM_AKEEBA_CONFIG_DESKTOP_NOTIFICATIONS_LABEL="Berechtigung für Desktop-Benachrichtigungen anfragen"
COM_AKEEBA_CONFIG_DIRECTFTP_FTPS_DESCRIPTION="Wenn aktiviert, versucht Akeeba Backup, eine Verbindung zu Ihrem FTP-Server über eine SSL-verschlüsselte Verbindung herzustellen. <strong>Dies ist nicht dasselbe wie SFTP, SCP oder „Secure FTP"!</strong> Bitte beachten Sie, dass Sie Verbindungsfehler erhalten, wenn Ihr Server diese Methode nicht unterstützt."
COM_AKEEBA_CONFIG_DIRECTFTP_FTPS_TITLE="FTP über SSL (FTPS) verwenden"
COM_AKEEBA_CONFIG_DIRECTFTP_HOST_DESCRIPTION="Der Hostname des FTP-Servers, ohne Protokollpräfix. Das bedeutet, dass <tt>ftp://example.com</tt> <b>ungültig</b> und <tt>example.com</tt> gültig ist. Akeeba Backup unterstützt nur FTP- und FTPS-Server. SFTP, SCP und andere SSH-Varianten werden <u>nicht</u> unterstützt."
COM_AKEEBA_CONFIG_DIRECTFTP_HOST_TITLE="Hostname"
COM_AKEEBA_CONFIG_DIRECTFTP_INITDIR_DESCRIPTION="Der absolute <b>FTP</b>-Pfad zum Verzeichnis, in das die Dateien hochgeladen werden. Falls Sie sich nicht sicher sind, stellen Sie mit FileZilla eine Verbindung zu Ihrem Server her, navigieren Sie zum gewünschten Verzeichnis und kopieren Sie den Pfad aus dem rechten Bereich oberhalb der Verzeichnisliste. Es handelt sich in der Regel um einen kurzen Pfad wie <tt>/public_html</tt>."
COM_AKEEBA_CONFIG_DIRECTFTP_INITDIR_TITLE="Ausgangsverzeichnis"
COM_AKEEBA_CONFIG_DIRECTFTP_PASSIVE_DESCRIPTION="FTP-Passivmodus für die Datenübertragung verwenden. Dies ist standardmäßig aktiviert, da es die einzige Methode ist, die durch Firewalls funktioniert, die üblicherweise auf Webservern installiert sind. Deaktivieren Sie diese Option nur, wenn Sie sicher sind, dass Ihr Webserver nicht hinter einer Firewall steht und Ihr FTP-Server den aktiven Modus für Dateiübertragungen zwingend erfordert."
COM_AKEEBA_CONFIG_DIRECTFTP_PASSIVE_TITLE="Passiven Modus verwenden"
COM_AKEEBA_CONFIG_DIRECTFTP_PASSWORD_DESCRIPTION="Das Passwort des FTP-Servers. Es wird in der Regel zwischen Groß- und Kleinschreibung unterschieden. Bei Unsicherheit wenden Sie sich bitte an Ihren Netzwerkadministrator."
COM_AKEEBA_CONFIG_DIRECTFTP_PASSWORD_TITLE="Passwort"
COM_AKEEBA_CONFIG_DIRECTFTP_PORT_DESCRIPTION="Der Port des FTP-Servers. Die häufigste Einstellung ist 21. Bei Unsicherheit wenden Sie sich bitte an Ihren Netzwerkadministrator."
COM_AKEEBA_CONFIG_DIRECTFTP_PORT_TITLE="Port"
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_DESCRIPTION="Verwenden Sie diese Schaltfläche, um die FTP-Verbindung zu testen und bei Fehlern die Verbindungsfehlermeldungen anzuzeigen."
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_FAIL="Es konnte keine Verbindung zum Remote-FTP-Server hergestellt werden."
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_OK="Die Verbindung zum Remote-FTP-Server wurde erfolgreich hergestellt!"
COM_AKEEBA_CONFIG_DIRECTFTP_TEST_TITLE="FTP-Verbindung testen"
COM_AKEEBA_CONFIG_DIRECTFTP_USER_DESCRIPTION="Benutzername des FTP-Servers. Hierbei wird in der Regel zwischen Groß- und Kleinschreibung unterschieden. Wenden Sie sich im Zweifelsfall an Ihren Netzwerkadministrator."
COM_AKEEBA_CONFIG_DIRECTFTP_USER_TITLE="Benutzername"
COM_AKEEBA_CONFIG_DIRECTSFTP_HOST_DESCRIPTION="Bitte geben Sie den Hostnamen oder die IP-Adresse Ihres SFTP-Servers ein"
COM_AKEEBA_CONFIG_DIRECTSFTP_HOST_TITLE="Hostname"
COM_AKEEBA_CONFIG_DIRECTSFTP_INITDIR_DESCRIPTION="Bitte geben Sie das Verzeichnis ein, in das die Dateien hochgeladen werden sollen. Wenn Sie unsicher sind, verwenden Sie einen SFTP-Desktop-Client, stellen Sie eine Verbindung zu Ihrem Server her, navigieren Sie zum gewünschten Verzeichnis und kopieren Sie den dort angezeigten Pfad. Der Pfad muss im absoluten Format angegeben werden, z. B. /users/meinbenutzername/public_html"
COM_AKEEBA_CONFIG_DIRECTSFTP_INITDIR_TITLE="Ausgangsverzeichnis"
COM_AKEEBA_CONFIG_DIRECTSFTP_PASSWORD_DESCRIPTION="Das SFTP-Passwort"
COM_AKEEBA_CONFIG_DIRECTSFTP_PASSWORD_TITLE="Passwort"
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_DESCRIPTION="Der übliche Port für SFTP-Verbindungen ist 22. Wenn Ihr Server einen anderen Port verwendet, geben Sie ihn hier ein."
COM_AKEEBA_CONFIG_DIRECTSFTP_PORT_TITLE="Port"
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_DESCRIPTION="Verwenden Sie diese Schaltfläche, um die SFTP-Verbindung zu testen und bei Fehlern die Verbindungsfehlermeldungen anzuzeigen."
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_FAIL="Es konnte keine Verbindung zum Remote-SFTP-Server hergestellt werden. Die Fehlermeldung lautete:"
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_OK="Verbindung zum Remote-SFTP-Server erfolgreich hergestellt. Hinweis: Die Einstellung des Ausgangsverzeichnisses wurde nicht geprüft."
COM_AKEEBA_CONFIG_DIRECTSFTP_TEST_TITLE="SFTP-Verbindung testen"
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_DESCRIPTION="Der SFTP-Benutzername. Bitte beachten Sie, dass Ihr SFTP-Server die Authentifizierung mit Benutzername und Passwort unterstützen muss."
COM_AKEEBA_CONFIG_DIRECTSFTP_USER_TITLE="Benutzername"
COM_AKEEBA_CONFIG_DOWNLOADID_DESC="Dies ist erforderlich, um Live-Aktualisierungen der Professional-Version zu aktivieren. Bitte besuchen Sie https://www.akeeba.com/my-subscriptions.html, um Ihre persönliche Download-ID zu erhalten."
COM_AKEEBA_CONFIG_DOWNLOADID_LABEL="Download-ID"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_DESCRIPTION="Ihr DreamObjects-Zugriffsschlüssel, der Ihnen im DreamHost-Kontrollpanel zur Verfügung gestellt wird"
COM_AKEEBA_CONFIG_DREAMOBJECTSACCESSKEY_TITLE="Zugriffsschlüssel"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_DESCRIPTION="Der Name Ihres DreamObjects-Buckets. Achten Sie darauf, dass er genau so eingegeben wird, wie er im DreamHost-Kontrollpanel angezeigt wird"
COM_AKEEBA_CONFIG_DREAMOBJECTSBUCKET_TITLE="Bucket"
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_DESCRIPTION="Das Verzeichnis innerhalb Ihres Buckets, in dem die Backup-Archive gespeichert werden sollen. Lassen Sie dieses Feld leer, um die Dateien im Stammverzeichnis des Buckets zu speichern."
COM_AKEEBA_CONFIG_DREAMOBJECTSDIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_DESCRIPTION="Wenn diese Option aktiviert ist, versucht Akeeba Backup, den Bucket-Namen in Kleinbuchstaben umzuwandeln, d. h. MeinBucket wird in meinbucket umgewandelt. Wenn Sie einen Bucket mit Großbuchstaben erstellt haben, z. B. MeinNeuerBucket, deaktivieren Sie diese Option und stellen Sie sicher, dass der Bucket-Name genau so geschrieben wird, wie er in Ihrem DreamHost-Kontrollpanel erscheint."
COM_AKEEBA_CONFIG_DREAMOBJECTSLOWERCASE_TITLE="Bucket-Name in Kleinbuchstaben"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_DESCRIPTION="Ihr DreamObjects-Geheimschlüssel, der Ihnen im DreamHost-Kontrollpanel zur Verfügung gestellt wird"
COM_AKEEBA_CONFIG_DREAMOBJECTSSECRETKEY_TITLE="Geheimschlüssel"
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_DESCRIPTION="Wenn aktiviert, wird beim Hochladen Ihrer Dateien eine sichere (HTTPS-)Verbindung verwendet. Dies erhöht zwar die Sicherheit der übertragenen Daten, erhöht jedoch auch die Möglichkeit eines Backup-Fehlers aufgrund von Zeitüberschreitungen."
COM_AKEEBA_CONFIG_DREAMOBJECTSUSESSL_TITLE="SSL verwenden"
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_DESCRIPTION="Das Verzeichnis in Ihrem Dropbox-Konto, in dem die Backup-Archive gespeichert werden sollen. Lassen Sie dieses Feld leer, um die Dateien im Stammverzeichnis zu speichern."
COM_AKEEBA_CONFIG_DROPBOXDIRECTORY_TITLE="Verzeichnis"
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_DESCRIPTION="Dies ist der Aktualisierungstoken, der Akeeba Backup mit Dropbox verbindet. Er ist <strong>website-spezifisch</strong> und wird verwendet, um die Dropbox-Verbindung neu zu autorisieren, wenn der kurzlebige Zugriffstoken abläuft. Wenn Sie mehrere Websites betreiben, müssen Sie die Schaltflächen von Schritt 1 auf jeder einzelnen Website verwenden, die Sie autorisieren möchten. Bitte kopieren Sie den Zugriffs- oder Aktualisierungstoken <strong>NICHT</strong> auf mehrere Websites. Dies führt dazu, dass die Dropbox-Authentifizierung nicht mehr synchron ist und Sie alle Ihre Websites erneut mit Dropbox verbinden müssen."
COM_AKEEBA_CONFIG_DROPBOXREFRESHTOKEN_TITLE="Aktualisierungstoken"
COM_AKEEBA_CONFIG_DROPBOXTOKEN_DESCRIPTION="Dieser wird automatisch von Dropbox abgerufen, wenn Sie auf die Schaltfläche von Schritt 2 klicken. Wenn Sie mehrere Websites betreiben, müssen Sie die Schaltflächen von Schritt 1 und Schritt 2 nur auf der ERSTEN Website verwenden, die Sie autorisieren möchten. Kopieren Sie dann den Token, den Token-Geheimschlüssel und die Benutzer-ID von der ersten Website auf alle anderen Websites, die Sie mit Dropbox verbinden möchten."
COM_AKEEBA_CONFIG_DROPBOXTOKEN_TITLE="Zugriffstoken"
COM_AKEEBA_CONFIG_DROPBOX_TEAM_DESC="Aktivieren Sie diese Option, wenn Sie Mitglied eines Teams sind, das Dropbox for Business verwendet, und Sie den Teamordner zum Speichern von Backups nutzen möchten. Denken Sie daran, dem unten angegebenen Verzeichnis den Namen Ihres Teamordners voranzustellen. Wenn in der Dropbox-Weboberfläche auf der Seite „Dateien" beispielsweise ein „Acme Corp Team Folder" angezeigt wird und Sie Ihre Backups in einem darin enthaltenen Ordner namens „Backups" ablegen möchten, sollten Sie den Verzeichnisnamen <code>Acme Corp Team Folder/Backups</code> und nicht nur <code>Backups</code> verwenden."
COM_AKEEBA_CONFIG_DROPBOX_TEAM_TITLE="Dropbox for Business"
COM_AKEEBA_CONFIG_DUMPENGINE_DESCRIPTION="Legt fest, wie Akeeba Backup Ihre Datenbank(en) verarbeitet, um eine Datenbank-Backup-Datei zu erstellen."
COM_AKEEBA_CONFIG_DUMPENGINE_TITLE="Datenbank-Backup-Engine"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_COMMON="Allgemeine Einstellungen"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_MYSQL="MySQL-Einstellungen"
COM_AKEEBA_CONFIG_DUMP_DIVIDER_POSTGRES="PostgreSQL-Einstellungen"
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_DESCRIPTION="Nach Abschluss oder Fehlschlagen eines Backups werden E-Mails an diese Adresse gesendet, anstatt an die in der Systemkonfigurationsseite konfigurierte Adresse, sofern zutreffend. Sie können mehrere E-Mail-Adressen durch Kommas trennen, z. B. alice@example.com, bob@example.com."
COM_AKEEBA_CONFIG_EMAILRECIPIENTS_TITLE="E-Mail-Empfänger"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_DESCRIPTION="Überträgt die Website-Dateien auf einen Remote-FTP-Server, ohne sie zuvor zu archivieren. Diese Archivierungs-Engine verwendet die cURL-Bibliothek, die eine bessere Kompatibilität mit einer Vielzahl von FTP-Servern bietet."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_DESCRIPTION="Einige schlecht konfigurierte oder fehlerhafte FTP-Server geben bei aktiviertem FTP-Passivmodus die falsche IP-Adresse zurück. Aktivieren Sie diese Option, um die FTP-Bibliothek zu zwingen, die vom FTP-Server zurückgegebene falsche IP zu ignorieren und stattdessen die öffentliche IP des FTP-Servers zu verwenden."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_PASVWORKAROUND_TITLE="Passivmodus-Workaround"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTPCURL_TITLE="DirectFTP über cURL"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_DESCRIPTION="Überträgt die Website-Dateien auf einen Remote-FTP-Server, ohne sie zuvor zu archivieren"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTFTP_TITLE="DirectFTP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_DESCRIPTION="Überträgt die Website-Dateien auf einen Remote-SFTP-Server, ohne sie zuvor zu archivieren. Diese Archivierungs-Engine verwendet die cURL-Bibliothek, die eine bessere Kompatibilität mit einer Vielzahl von FTP-Servern bietet."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTPCURL_TITLE="DirectSFTP über cURL"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_DESCRIPTION="Überträgt die Website-Dateien auf einen Remote-SFTP-Server, ohne sie zuvor zu archivieren. WARNUNG: Auf Ihrem Quellserver muss die PHP-SSL2-Erweiterung installiert sein."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_DIRECTSFTP_TITLE="DirectSFTP"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPA_DESCRIPTION="Ein Open-Source-Archivformat, das für die schnelle Archivierung und Entpackung mit PHP-Code optimiert ist"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPA_TITLE="JPA-Format (empfohlen)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_DESCRIPTION="Erstellt mit der branchenüblichen AES-128-Verschlüsselungsmethode verschlüsselte Archive in einem dem JPA sehr ähnlichen Format. Erfordert, dass auf Ihrer Website entweder die PHP-Erweiterung mcrypt oder openssl installiert und aktiviert ist."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_JPS_TITLE="Verschlüsselte Archive (JPS)"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_DESCRIPTION="Das ZIP-Archiv wird mit der ZipArchive-Klasse von PHP erstellt. WICHTIG: Diese Engine unterstützt keine Archivaufteilung oder Symlink-Verarbeitung und kann daher zu Backup-Problemen führen. Wenn Sie Zeitüberschreitungsfehler, AJAX-Fehler oder interne Serverfehler erhalten, müssen Sie zu einer anderen Archivierungs-Engine wechseln und die Archivaufteilung aktivieren."
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIPNATIVE_TITLE="ZIP mit der ZipArchive-Klasse"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIP_DESCRIPTION="Standard-ZIP-Dateien, auch bekannt als \"Komprimierte Ordner\", werden nativ von allen führenden Betriebssystemen unterstützt"
COM_AKEEBA_CONFIG_ENGINE_ARCHIVER_ZIP_TITLE="ZIP-Format"
