COM_AKEEBA_CONFIG_PLATFORM_DBDRIVER_DESCRIPTION="Wählen Sie den Datenbanktreiber aus, der für die Verbindung zur Datenbank der Website verwendet werden soll. Wird nur verwendet, wenn das Kontrollkästchen „Website-Datenbank überschreiben" aktiviert ist."
