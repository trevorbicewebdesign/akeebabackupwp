COM_AKEEBA_MIGREIGHT_NOT_NEEDED_INFO="Ihre Backup-Profile und Backup-Archive befinden sich anscheinend außerhalb des Plugin-Ordners. Das ist hervorragend! Sie können Akeeba Backup sicher aktualisieren, ohne Ihre Backup-Archive zu verlieren."
