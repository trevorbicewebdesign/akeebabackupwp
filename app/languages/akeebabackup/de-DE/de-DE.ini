COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_HEAD="Die Standardkonfiguration des WordPress-CRON-Systems kann zu Problemen bei geplanten Backups führen"
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P1="Gemäß der <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">WordPress-Dokumentation</a> werden kritische Aufgaben – wie Backups –, die mit WP-CRON in der Standardkonfiguration von WordPress (Ausführung geplanter Aufgaben wird nur beim Seitenaufruf ausgewertet) geplant sind, möglicherweise nicht zum richtigen Zeitpunkt oder gar nicht ausgeführt. Aufgrund dieses inhärenten Designproblems, das WordPress offen eingesteht, können mit WP-CRON unter dieser Konfiguration geplante Backups nicht zum richtigen Zeitpunkt (oder überhaupt nicht) starten, deutlich länger dauern, inkonsistent oder beschädigt werden, sich überschneiden oder zwar starten, aber nicht abgeschlossen werden. Bitte lesen Sie unsere Dokumentation für detaillierte Informationen."
COM_AKEEBA_CRONS_DEFAULT_SETUP_WARNING_P2="Wir empfehlen <strong>sehr dringend</strong>, der Empfehlung in der <a href=\"https://developer.wordpress.org/plugins/cron/hooking-wp-cron-into-the-system-task-scheduler/\">offiziellen WordPress-Dokumentation</a> zu folgen: Deaktivieren Sie die standardmäßige, aktivitätsbasierte Aufgabenausführung und verwenden Sie den Windows Task Scheduler oder den macOS/Linux-CRON-Daemon, um die Ausführung des WordPress-CRON-Hilfsprogramms (<code>wp-cron.php</code>) jede Minute zu planen. Diese Konfiguration überwindet das inhärente Designproblem der WordPress-Standardkonfiguration für WP-CRON und macht Ihre geplanten Backups genauso zuverlässig wie manuell im Backend erstellte Backups oder Backups, die über die Frontend-Backup- oder JSON-API-Methoden geplant wurden."
