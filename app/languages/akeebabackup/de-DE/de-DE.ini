COM_AKEEBA_CONFIG_UPLOADKICKSTART_DESCRIPTION="Wenn diese Option aktiviert ist, wird eine Kopie von Akeeba Kickstart Professional in den oben im Nachverarbeitungs-Engine angegebenen Remote-Speicher hochgeladen (außer bei den Engines „Ohne" und „E-Mail"). Dies ist sinnvoll, wenn Sie FTP oder SFTP verwenden, um Ihre Website auf einen anderen Server zu übertragen: Sowohl Ihr Backup-Archiv als auch Kickstart zum Entpacken werden auf Ihren Remote-Server hochgeladen. Nach Abschluss des Backups können Sie Kickstart einfach auf der Remote-Website starten und die Wiederherstellung durchführen. So einfach ist das!"
COM_AKEEBA_CONFIG_UPLOADKICKSTART_TITLE="Kickstart in Remote-Speicher hochladen"
COM_AKEEBA_CONFIG_USAGESTATS_SOLO_DESC="Helfen Sie uns, unsere Software zu verbessern, indem Sie Ihre PHP- und MySQL-Versionen anonym und automatisch übermitteln. Diese Informationen helfen uns zu entscheiden, welche Versionen von PHP und MySQL wir in zukünftigen Versionen unterstützen. Hinweis: Wir erfassen NICHT Ihren Website-Namen, Ihre IP-Adresse oder andere direkt oder indirekt eindeutig identifizierende Informationen."
COM_AKEEBA_CONFIG_USAGESTATS_SOLO_LABEL="Anonyme Meldung von PHP- und MySQL-Versionen aktivieren"
COM_AKEEBA_CONFIG_ACCURATE_PHP_CLI_LABEL="Genauer PHP-CLI-Pfad"
COM_AKEEBA_CONFIG_ACCURATE_PHP_CLI_DESC="Aktivieren Sie diese Option, damit Akeeba Solo versucht, den genauen PHP-CLI-Pfad auf Ihrem Server zu erkennen. Deaktivieren Sie diese Option, wenn Ihr Server dies nicht zulässt und dabei Ihre IP-Adresse für mehrere Minuten bis Stunden von Ihrer Website ausgesperrt wird (zum Beispiel bei IONOS)."
COM_AKEEBA_CONFIG_VIRTUALFOLDER_DESCRIPTION="Wenn Sie externe Verzeichnisse konfiguriert haben, erscheinen deren Inhalte im Archiv als Unterverzeichnisse dieses virtuellen Verzeichnisses. Es ist virtuell, weil es auf Ihrem Server nicht wirklich existiert. Es existiert nur innerhalb des Backup-Archivs. Stellen Sie sicher, dass der Name des virtuellen Verzeichnisses nicht mit einem vorhandenen Verzeichnis in Konflikt gerät, um Datenverlust zu vermeiden."
COM_AKEEBA_CONFIG_VIRTUALFOLDER_TITLE="Virtuelles Verzeichnis für externe Dateien"
