COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_CORE="<p>Sie können Ihre Backups auf jedem Server wiederherstellen, auch auf einem anderen als dem, auf dem Sie das Backup erstellt haben. Folgen Sie unserem <a href=\"%s\" target=\"_blank\">Video-Tutorial</a>. Sie müssen <a href=\"%3$s\" target=\"_blank\">Akeeba Kickstart Core (kostenlos) herunterladen</a>, um die Backup-Archive zu entpacken, genau wie im Tutorial beschrieben.</p>"
COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_CORE_INFO_ABOUT_PRO="<strong>Es <em>kann</em> einfacher sein als das.</strong>Sie können Backup-Archive auf demselben oder einem anderen Server über die Benutzeroberfläche von Akeeba Backup wiederherstellen. Sie müssen keine Dateien selbst übertragen. Erfahren Sie mehr über diese und viele weitere Funktionen, die exklusiv in <a href=\"%s\">Akeeba Backup Professional</a> verfügbar sind!"
COM_AKEEBA_BUADMIN_LABEL_HOWDOIRESTORE_TEXT_PRO="<p>Ganz einfach! Aktivieren Sie das Kontrollkästchen neben einem Backup-Eintrag. Klicken Sie nun auf die Schaltfläche <em>Wiederherstellen</em> in der Symbolleiste.</p><p>Wenn Sie auf einem neuen, öffentlichen Server wiederherstellen möchten, können Sie den <a href=\"%2$s\">Website-Übertragungsassistenten</a> verwenden. Wenn Sie es lieber manuell oder auf Ihrem eigenen Computer oder Intranet wiederherstellen möchten, schauen Sie sich unser <a href=\"%1$s\" target=\"_blank\">Video-Tutorial</a> an und <a href=\"%3$s\" target=\"_blank\">laden Sie Akeeba Kickstart Core (kostenlos) herunter</a>, um die Backup-Archive zu entpacken.</p>"
