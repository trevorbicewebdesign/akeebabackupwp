COM_AKEEBA_CONFWIZ_HEADER_FAILED="Fehler beim Konfigurationsassistenten"
COM_AKEEBA_CONFWIZ_HEADER_FINISHED="Benchmarking abgeschlossen"
COM_AKEEBA_CONFWIZ_INTROTEXT="Der Konfigurationsassistent führt eine Reihe von Benchmarks auf Ihrem Server durch, um die optimalen Backup-Einstellungen für Ihre Website zu ermitteln. Verlassen Sie diese Seite bitte nicht. Es ist normal, dass sie je nach Servergeschwindigkeit für bis zu drei (3) Minuten eingefroren erscheint."
