COM_AKEEBA_CONFIG_UI_ROOTDIR="Die Verwendung des Website-Stammverzeichnisses für die Backup-Ausgabe oder die temporäre Dateispeicherung führt zu einem Backup-Fehler. Ihre Einstellung wird überschrieben."
COM_AKEEBA_CONFIG_UI_SETTINGS_NOTSECURED="Ihr Server unterstützt keine Verschlüsselung Ihrer Konfigurationseinstellungen. Wir empfehlen dringend, keine Passwörter in der Konfiguration zu speichern."
