COM_AKEEBA_CONFIG_WHERE_ARE_THE_FILTERS="Wenn Sie nach den Filtern suchen &ndash;z. B. zum Ausschließen von Dateien, Verzeichnissen und Datenbanktabellen&ndash; klicken Sie bitte auf die Schaltfläche „Abbrechen", um zur Systemsteuerungsseite zurückzukehren, wo Sie direkt auf diese Funktionen zugreifen können."
COM_AKEEBA_CONFIG_ZIPCDGLUECHUNKSIZE_DESCRIPTION="ZIP-Dateien bestehen aus einem Datenbereich und einem „Verzeichnis"-Bereich. Diese Bereiche werden von Akeeba Backup parallel verarbeitet und während der Archiv-Abschlussphase zusammengefügt. Dieser Parameter bestimmt, wie viele Daten in dieser Phase auf einmal verarbeitet werden. Sie müssen diese Einstellung nur ändern, wenn Sie schwerwiegende Speichermangel-Probleme haben."
