COM_AKEEBA_CONFIG_ADVANCED_SBBD_LABEL="Schrittunterbrechung zwischen Domänen deaktivieren"
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_DESC="Akeeba Backup unterbricht den Verarbeitungsschritt vor der Archivierung einer großen Datei. Wenn Sie diese Option aktivieren, arbeitet Akeeba Backup schneller. Dies kann jedoch zu Zeitüberschreitungen oder internen Serverfehlern führen."
COM_AKEEBA_CONFIG_ADVANCED_SBBLF_LABEL="Schrittunterbrechung vor großen Dateien deaktivieren"
COM_AKEEBA_CONFIG_ADVANCED_SBPA_DESC="Akeeba Backup unterbricht den Verarbeitungsschritt, wenn es der Meinung ist, dass die Zeit nicht ausreicht, um eine Datei zu archivieren. Diese Berechnung ist nicht vollständig genau und kann zu langsameren Backups führen. Wenn Sie diese Option aktivieren, arbeitet Akeeba Backup schneller. Dies kann jedoch zu Zeitüberschreitungen oder internen Serverfehlern führen."
COM_AKEEBA_CONFIG_ADVANCED_SBPA_LABEL="Proaktive Schrittunterbrechung deaktivieren"
COM_AKEEBA_CONFIG_ADVANCED_SBPP_DESC="Akeeba Backup unterbricht den Verarbeitungsschritt zwischen Teilschritten der Backup-Abschlussung und Nachverarbeitung. Dies kann die Gesamtbackup-Zeit um etwa 10 Sekunden verlängern. Wenn Sie diese Option aktivieren, arbeitet Akeeba Backup schneller. Dies kann jedoch zu Zeitüberschreitungen oder internen Serverfehlern führen."
COM_AKEEBA_CONFIG_ADVANCED_SBPP_LABEL="Schrittunterbrechung beim Abschluss deaktivieren"
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_DESC="Weist Akeeba Backup an, das PHP-Speicherlimit auf einen sehr hohen Wert (16 GB) zu erhöhen. Dies ermöglicht die Komprimierung größerer Dateien und das Hochladen größerer Backup-Archive mit speicherintensiven Remote-Speicheroptionen wie WebDAV. Hinweis: Dies legt nur das Limit für den maximalen Speicherverbrauch fest. In den meisten Fällen verbraucht die Backup-Engine von Akeeba Backup <em>weit weniger</em> Speicher, typischerweise im Bereich von 20 MB. Für die Komprimierung und das Hochladen größerer Dateien müssen auch andere Optionen auf der Konfigurationsseite des Backup-Profils geändert werden."
COM_AKEEBA_CONFIG_ADVANCED_SETMEMLIMIT_LABEL="Großes Speicherlimit setzen"
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_DESC="Wenn Ihr Server PHP nicht im Safe Mode ausführt und set_time_limit() unterstützt, versucht Akeeba Backup, eine unbegrenzte maximale PHP-Ausführungszeit einzustellen, um potenzielle Zeitüberschreitungsprobleme zu umgehen."
COM_AKEEBA_CONFIG_ADVANCED_SETTIMELIMIT_LABEL="Unbegrenztes PHP-Zeitlimit setzen"
COM_AKEEBA_CONFIG_ANGIE_KEY_DESCRIPTION="Wenn Sie das eingebettete ANGIE-Installationsskript verwenden, können Sie es optional mit einem Passwort schützen, um unbefugten Zugriff auf das Installationsprogramm zu verhindern. Wenn Sie das Installationsprogramm ausführen, werden Sie aufgefordert, dieses Passwort einzugeben. Bitte beachten Sie, dass das Passwort Groß-/Kleinschreibung unterscheidet, d. h. ABC, abc und Abc sind drei verschiedene Passwörter."
COM_AKEEBA_CONFIG_ANGIE_KEY_TITLE="ANGIE Passwort"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_DESC="E-Mail an diese Adresse senden (wenn dieses Feld leer gelassen wird, ist diese Funktion deaktiviert)"
COM_AKEEBA_CONFIG_ARBITRARYFEEMAIL_LABEL="E-Mail-Adresse"
COM_AKEEBA_CONFIG_ARCHIVENAME_DESCRIPTION="Benennungsvorlage für das Backup-Archiv, sofern zutreffend. Sie können die folgenden Makros verwenden:<ul><li><b>[HOST]</b> Der Hostname. WARNUNG! Dieses Tag funktioniert nicht im CRON-Modus.</li><li><b>[DATE]</b> Aktuelles Datum</li><li><b>[TIME_TZ]</b> Aktuelle Uhrzeit und Zeitzone</li></ul>Es sind weitere verfügbar; bitte konsultieren Sie die Dokumentation."
