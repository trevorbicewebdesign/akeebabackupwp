COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_PARTS="Ihr Backup besteht aus %d Teildateien. Sie <em>müssen</em> alle herunterladen und in dasselbe Verzeichnis legen, damit das Entpacken des Archivs und die Wiederherstellung des Backups erfolgreich sind."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE="Das Herunterladen über Ihren Browser kann die Dateien beschädigen"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE_NODOWNLOAD="Das Herunterladen von Backups über den Browser ist standardmäßig deaktiviert"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_TITLE_NODOWNLOAD_PHPERRORDISPLAY="Das Herunterladen von Backups über den Browser wird automatisch deaktiviert"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING="Wir empfehlen, dieses Dialogfeld zu schließen und FTP im <code>Binär</code>-Übertragungsmodus oder SFTP zu verwenden, um Ihre Backup-Archive herunterzuladen."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD="<strong>Ihre aktuellen Servereinstellungen können dazu führen, dass beim Herunterladen über den Browser eine beschädigte (oder fehlerhafte) Datei entsteht.</strong> Das Herunterladen von Backup-Archiven über den Browser ist standardmäßig deaktiviert, da es wahrscheinlich ist, dass ein anderes Plugin oder PHP am Anfang oder Ende des Backup-Archivs unerwartete Daten hinzufügt. Dadurch würden die über den Browser heruntergeladenen Backup-Archive beschädigt (unbrauchbar) und eine Wiederherstellung wäre unmöglich."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_ALTERNATIVE="Sie können dieses Dialogfeld schließen und FTP im <code>Binär</code>-Übertragungsmodus oder SFTP verwenden, um Ihre Backup-Archive vom Server herunterzuladen."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART="Ihr Backup-Archiv besteht aus %u Dateien mit dem Dateinamen <code>%s</code> und den Erweiterungen <code>%s</code> sowie <code>%s</code> bis <code>%s</code>. <strong>WICHTIG!</strong> Sie müssen <em>alle diese</em> Dateien herunterladen. Laden Sie bei der Wiederherstellung Ihrer Website auch alle diese Dateien zusammen mit <code>kickstart.php</code> hoch. Wenn Sie dies versäumen, kann Ihr Backup-Archiv nicht wiederhergestellt werden."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_1="Die Datei, die Sie herunterladen müssen, heißt <code>%s</code>"
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_MULTIPART_2="Ihr Backup-Archiv besteht aus zwei Dateien mit dem Dateinamen <code>%s</code> und den Erweiterungen <code>%s</code> und <code>%s</code>. <strong>WICHTIG!</strong> Sie müssen <em>beide</em> Dateien herunterladen. Laden Sie bei der Wiederherstellung Ihrer Website auch beide Dateien zusammen mit <code>kickstart.php</code> hoch. Wenn Sie dies versäumen, kann Ihr Backup-Archiv nicht wiederhergestellt werden."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_AKEEBADEBUG="Sie können Browser-Downloads wieder aktivieren, indem Sie Ihre Datei <code>%s/defines.php</code> bearbeiten und die Zeile <code>define('AKEEBADEBUG', 1);</code> auskommentieren."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_ENABLED="<strong>Ihre aktuellen Servereinstellungen können dazu führen, dass beim Herunterladen über den Browser eine beschädigte (oder fehlerhafte) Datei entsteht.</strong> Das Herunterladen von Backup-Archiven über den Browser wurde automatisch deaktiviert, da Ihr Server so konfiguriert ist, dass PHP-Hinweise, -Warnungen und -Fehler im Browser ausgegeben werden. Dadurch würde Ihr heruntergeladenes Archiv <em>beschädigt</em> (unbrauchbar) und eine Wiederherstellung wäre unmöglich. Bitte schließen Sie dieses Dialogfeld und verwenden Sie FTP im <code>Binär</code>-Übertragungsmodus oder SFTP, um Ihre Backup-Archive vom Server herunterzuladen."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_UNKNOWN="<strong>Ihre aktuellen Servereinstellungen können dazu führen, dass beim Herunterladen über den Browser eine beschädigte (oder fehlerhafte) Datei entsteht.</strong> Das Herunterladen von Backup-Archiven über den Browser wurde automatisch deaktiviert, da nicht festgestellt werden kann, ob Ihr Server so konfiguriert ist, dass PHP-Hinweise, -Warnungen und -Fehler im Browser ausgegeben werden. Wenn PHP-Hinweise, -Warnungen und -Fehler im Browser ausgegeben werden, wird Ihr heruntergeladenes Archiv <em>beschädigt</em> (unbrauchbar) und eine Wiederherstellung ist unmöglich. Bitte schließen Sie dieses Dialogfeld und verwenden Sie FTP im <code>Binär</code>-Übertragungsmodus oder SFTP, um Ihre Backup-Archive vom Server herunterzuladen."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_PHPERRORDISPLAY_WPDEBUG="Sie können Browser-Downloads wieder aktivieren, indem Sie Ihre Datei <code>wp-config.php</code> bearbeiten und die Konstante <code>WP_DEBUG</code> auf <code>false</code> setzen."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_NODOWNLOAD_REENABLE="Sie können Downloads über den Browser <em>auf eigenes Risiko</em> auf der Systemkonfigurationsseite von Akeeba Backup aktivieren."
COM_AKEEBA_BUADMIN_LBL_DOWNLOAD_WARNING_WORDPRESS="<strong>Sie haben das Herunterladen von Backups über den Browser <em>auf eigenes Risiko</em> manuell aktiviert.</strong> Drittanbieter-Plugins und Servereinstellungen können dazu führen, dass die heruntergeladene Datei abgeschnitten (unvollständig) oder beschädigt (unbrauchbar) ist. Wenn Sie sich dazu entscheiden, Ihre Backup-Archive trotz unserer Warnungen über den Browser herunterzuladen, <strong>übernehmen Sie persönlich die volle Verantwortung und Haftung für Ihre Handlungen</strong> und erklären sich damit einverstanden, dass Akeeba Ltd in keiner Weise verantwortlich oder haftbar ist und Ihnen keinerlei Support leisten wird, falls Ihr Backup-Archiv nicht entpackt oder wiederhergestellt werden kann."
COM_AKEEBA_BUADMIN_LBL_LOGFILEID="Protokolldatei-ID"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD="Herunterladen"
COM_AKEEBA_BUADMIN_LOG_DOWNLOAD_CONFIRM="Das Herunterladen von Backup-Archiven über Ihren Browser ist anfällig\nfür Fehler, Dateikorruption und abgeschnittene Dateien, aus Gründen,\ndie objektiv außerhalb unserer Kontrolle liegen (Serverkonfiguration,\nWebsite-Konfiguration, Drittanbieter-Plugins und Browser-Konfiguration).\n\nWir empfehlen DRINGEND, Backup-Archive ausschließlich über FTP im Binär-\nÜbertragungsmodus herunterzuladen (verwenden Sie nicht Auto oder ASCII,\nda dies Ihre Backup-Archive beschädigt) mithilfe von Client-Software wie\nFileZilla, CyberDuck, WinSCP oder Ähnlichem; oder über den\nDateimanager des Hosting-Kontrollpanels Ihres Anbieters.\n\nWenn Sie mit diesem Download fortfahren, erklären Sie sich ausdrücklich\ndamit einverstanden, dass Sie auf Ihr Recht auf Support bei Problemen\nmit dem Herunterladen, Entpacken oder Wiederherstellen von Backup-Archiven\nverzichten, und Sie verstehen, dass solche Anfragen nicht beantwortet werden.\n\nSind Sie sicher, dass Sie fortfahren möchten?"
