COM_AKEEBA_CRONS_LBL_CRON_EXPRESSION_TIMEZONE="CRON-Ausdrücke werden in der Zeitzone %s ausgewertet. Lokales Datum und Uhrzeit: %2$s"
COM_AKEEBA_CRONS_LBL_CRON_EXPRESSION_TIP="Gibt an, wann und wie oft WP-CRON ein Backup ausführen soll. <a href=\"https://en.wikipedia.org/wiki/Cron#Cron_expression\" target=\"_blank\">CRON-Ausdrücke</a> sind entweder eine Voreinstellung (z. B. <code>@daily</code>) oder fünf durch Leerzeichen getrennte Felder in dieser Reihenfolge: <code>Minute Stunde Tag Monat Wochentag</code>. Beispiele und Tests Ihrer CRON-Ausdrücke finden Sie im Drittanbieter-Tool <a href=\"https://crontab.guru\" target=\"_blank\">Crontab Guru</a>. Weitere Details entnehmen Sie unserer Dokumentation."
