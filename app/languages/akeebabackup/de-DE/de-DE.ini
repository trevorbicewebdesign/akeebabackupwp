COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEDB_DESCRIPTION="Wenn diese Option deaktiviert ist (Standardeinstellung), sichert Akeeba Backup automatisch die Datenbank, mit der die Website verbunden ist, auf der es installiert ist (Ihre Joomla!-Datenbank). Wenn sie aktiviert ist, wird eine andere Datenbank gesichert, wobei die unten angegebenen Verbindungsdetails verwendet werden."
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEDB_TITLE="Website-Datenbank überschreiben"
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEROOT_DESCRIPTION="Wenn diese Option deaktiviert ist (Standardeinstellung), sichert Akeeba Backup alle Dateien und Verzeichnisse unter dem Stammverzeichnis der Website, auf der es installiert ist. Wenn sie aktiviert ist, werden Dateien und Verzeichnisse unter dem im Feld „Website-Stammverzeichnis erzwingen" ausgewählten Verzeichnis gesichert."
COM_AKEEBA_CONFIG_PLATFORM_OVERRIDEROOT_TITLE="Website-Stammverzeichnis überschreiben"
COM_AKEEBA_CONFIG_PLATFORM_NEWROOT_DESCRIPTION="Wenn Sie die Option „Website-Stammverzeichnis überschreiben" oben aktiviert haben, sichert Akeeba Backup alle Dateien und Verzeichnisse unter dem Stammverzeichnis dieser Website."
