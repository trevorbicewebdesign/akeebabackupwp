COM_AKEEBA_TRANSFER_DESC="Überträgt das Archiv, indem die Nachverarbeitungs-Engine „%s" auf das Archiv angewendet wird."
COM_AKEEBA_TRANSFER_ERR_CANNOTACCESSTESTFILE="Akeeba Backup kann nicht überprüfen, ob die eingegebenen Verbindungsinformationen der eingegebenen Website-URL entsprechen. Wenn Sie versuchen, in einem Unterverzeichnis einer bestehenden Website wiederherzustellen, bedeutet dies, dass die Hauptwebsite den Zugriff auf das Unterverzeichnis blockiert; bitte kontaktieren Sie Ihren Website-Administrator. In jedem anderen Fall haben Sie falsche Verbindungsinformationen eingegeben, wahrscheinlich ein falsches Verzeichnis. Bitte kontaktieren Sie Ihren Host und fragen Sie nach den korrekten Verbindungsinformationen, <em>einschließlich des Verzeichnisses</em>, das der in diesem Assistenten eingegebenen URL entspricht. Kehren Sie dann hierher zurück, geben Sie die korrekten Informationen ein und fahren Sie mit der Wiederherstellung fort."
COM_AKEEBA_TRANSFER_ERR_CANNOTREADLOCALFILE="Akeeba Backup kann die lokale Backup-Datei <code>%s</code> nicht lesen. Dieser Assistent ist fehlgeschlagen. Bitte erstellen Sie ein neues Backup und versuchen Sie es erneut. Beachten Sie, dass Dateien auf Ihrem neuen Server zurückgelassen wurden; Sie sollten diese möglicherweise manuell entfernen."
COM_AKEEBA_TRANSFER_ERR_CANNOTRUNKICKSTART="Akeeba Backup kann Akeeba Kickstart auf Ihrer neuen Website nicht ausführen. Wenn Sie versuchen, in einem Unterverzeichnis einer bestehenden Website wiederherzustellen, bedeutet dies, dass die Hauptwebsite den Zugriff auf das Unterverzeichnis blockiert; bitte kontaktieren Sie Ihren Website-Administrator. Andernfalls müssen Sie Ihren Host kontaktieren und sicherstellen, dass Ihre Standard-PHP-Version den Mindestanforderungen von Kickstart entspricht."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADARCHIVE="Akeeba Backup kann die Backup-Datei <code>%s</code> nicht hochladen. Möglicherweise ist auf dem Server Ihrer neuen Website der Speicherplatz erschöpft, oder ein Serverschutz blockiert die Datenübertragung. Bitte versuchen Sie, Ihre Website mit der Option „Manuell übertragen" zu übertragen. Beachten Sie, dass Dateien auf Ihrem neuen Server zurückgelassen wurden; Sie sollten diese möglicherweise manuell entfernen."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADKICKSTART="Akeeba Backup kann Akeeba Kickstart nicht in das Stammverzeichnis Ihrer neuen Website hochladen. Bitte überprüfen Sie, ob Sie die korrekten Verbindungsinformationen eingegeben haben und ob der FTP/SFTP-Benutzer Dateien in das ausgewählte Verzeichnis schreiben kann. Wenn sich bereits kickstart.php und kickstart.transfer.php auf der Remote-Website befinden, entfernen Sie diese bitte, bevor Sie die Website-Übertragung erneut versuchen."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTEMP="Akeeba Backup kann einen Teil Ihres Backup-Archivs nicht von der lokalen Datei <code>%s</code> in die Remote-Datei <code>%s</code> hochladen. Bitte überprüfen Sie, ob Ihr Remote-Server das Hochladen von Dateien erlaubt und ob ausreichend Speicherplatz für Ihre Backup-Archivdatei(en) vorhanden ist."
COM_AKEEBA_TRANSFER_ERR_CANNOTUPLOADTESTFILE="Akeeba Backup kann eine Testdatei namens <code>%s</code> nicht in das Stammverzeichnis Ihrer neuen Website hochladen. Bitte überprüfen Sie, ob Sie die korrekten Verbindungsinformationen eingegeben haben und ob der FTP/SFTP-Benutzer Dateien in das ausgewählte Verzeichnis schreiben kann."
COM_AKEEBA_TRANSFER_ERR_CANNOTWRITEREMOTEFILES="Leider hat Akeeba Backup festgestellt, dass keine Dateien direkt auf Ihrem Remote-Server geschrieben werden können. Dieser Assistent kann nicht fortfahren. Sie müssen die Übertragungsmethode „Manuell" verwenden."
COM_AKEEBA_TRANSFER_ERR_CANTCREATETEMPCHUNK="Es kann keine temporäre Datei auf diesem Server erstellt werden. Bitte überprüfen Sie, ob Ihr temporäres Verzeichnis korrekt eingerichtet ist und vom Benutzer, unter dem der Webserver aktuell ausgeführt wird, beschreibbar ist."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP="Es wurde kein solches Backup gefunden. Klicken Sie auf die Schaltfläche „Jetzt sichern", um sofort ein neues Backup zu erstellen."
COM_AKEEBA_TRANSFER_ERR_COMPLETEBACKUP_SPECIFIC="Backup #%d kann nicht übertragen werden. Entweder handelt es sich nicht um ein vollständiges Backup der gesamten Website, oder die Archivdateien sind auf diesem Server nicht mehr vorhanden."
COM_AKEEBA_TRANSFER_ERR_DNS="Der Domainname der eingegebenen URL (%s) kann vom Server, auf dem Akeeba Backup ausgeführt wird, nicht aufgelöst werden. Wenn Sie den Domainnamen kürzlich registriert oder übertragen haben, warten Sie bitte, bis die DNS-Server aktualisiert wurden (in der Regel 6 bis 48 Stunden). Überprüfen Sie andernfalls die DNS-Einstellungen Ihres Domainnamens."
COM_AKEEBA_TRANSFER_ERR_ERRORFROMREMOTE="Akeeba Backup hat beim Versuch, das Backup-Archiv hochzuladen, einen Fehler vom Remote-Server erhalten. Der Fehler lautete: %s"
COM_AKEEBA_TRANSFER_ERR_EXISTINGSITE="An diesem Speicherort ist bereits eine andere Website vorhanden. Bitte entfernen Sie die bestehende Website, bevor Sie eine neue Website dorthin übertragen. Der Versuch, eine bestehende Website zu überschreiben, führt höchstwahrscheinlich zu einer defekten Website, die nicht mehr repariert werden kann."
COM_AKEEBA_TRANSFER_ERR_HTACCESS="Im Stammverzeichnis Ihrer neuen Website wurde eine <code>%s</code>-Datei gefunden. Diese Datei kann den Website-Übertragungsprozess beeinträchtigen. Bitte entfernen Sie sie, bevor Sie mit der Website-Übertragung fortfahren. Beachten Sie, dass die Datei möglicherweise <em>ausgeblendet</em> ist. Wenn Sie diese Datei nicht im Datei-Browser Ihres Hosting-Kontrollbereichs oder in Ihrer FTP-Client-Software sehen, wenden Sie sich bitte an Ihren Host, um weitere Informationen zum Entfernen dieser Datei zu erhalten."
COM_AKEEBA_TRANSFER_ERR_INVALIDID="Ungültige Upload-ID angegeben"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN="Prüfen"
COM_AKEEBA_TRANSFER_ERR_NEWURL_BTN_IGNOREERROR="Ich möchte diese Warnung ignorieren und <strong>auf eigenes Risiko</strong> fortfahren"
COM_AKEEBA_TRANSFER_ERR_NEWURL_INVALID="Die eingegebene URL ist ungültig."
COM_AKEEBA_TRANSFER_ERR_NEWURL_NOTEXISTS="Ihr Server kann die eingegebene URL nicht erreichen. Bitte überprüfen Sie, ob Sie diese korrekt eingegeben haben. Beachten Sie auch, dass neu zugewiesene oder übertragene Domainnamen bis zu <strong>48 Stunden</strong> benötigen können, bevor sie für alle mit dem Internet verbundenen Server und Computer sichtbar sind."
COM_AKEEBA_TRANSFER_ERR_NEWURL_SAME="Die eingegebene URL ist dieselbe, von der Sie die Wiederherstellung durchführen. Dies wird von diesem Assistenten nicht unterstützt. Zur Backup-Wiederherstellung ohne Assistenten konsultieren Sie bitte unser Video-Tutorial über den unten stehenden Link."
COM_AKEEBA_TRANSFER_ERR_NOTENOUGHSPACE="Die Website-Übertragung kann nicht fortgesetzt werden. Sie benötigen ungefähr %s freien Speicherplatz, aber Ihr Server meldet, dass derzeit nur %s verfügbar sind. Bitte schaffen Sie mehr Speicherplatz auf Ihrem Server."
COM_AKEEBA_TRANSFER_ERR_OVERRIDE="Erkannte Fehler ignorieren und die Website trotzdem übertragen"
COM_AKEEBA_TRANSFER_ERR_SAMESITE="Sie haben die Verbindungsdaten der Website eingegeben, von der Sie übertragen. <strong>Ihr Fehler hätte Ihre eigene Website gelöscht</strong>. Sie müssen die FTP/SFTP-Verbindungsdaten der Website eingeben, zu der Sie übertragen <strong>(neue Website oder neuer Server)</strong>. Bitte korrigieren Sie die obigen Angaben und versuchen Sie es erneut."
COM_AKEEBA_TRANSFER_ERR_SPACE="Sie haben nur <span></span> freien Speicherplatz. Sie benötigen mehr freien Speicherplatz, um Ihre Website zu übertragen. Bitte wenden Sie sich an Ihren Hosting-Anbieter."
COM_AKEEBA_TRANSFER_ERR_WRONGSSL="Ihre Website verfügt über ein ungültiges oder selbst signiertes SSL-Zertifikat. Aus Sicherheitsgründen kann die Website-Übertragung nicht fortgesetzt werden. Bitte klicken Sie auf „Zurücksetzen", um die Website-Übertragung neu zu starten, und verwenden Sie eine URL ohne <code>https://</code>. Dies ist erforderlich, wenn Sie Ihre Website übertragen möchten, bevor Sie Ihren Domainnamen zum neuen Hosting-Anbieter wechseln. Alternativ wenden Sie sich bitte an Ihren Hosting-Anbieter, um ein gültiges SSL-Zertifikat zu erhalten. Auch ein kostenloses, von der kostenlosen Zertifizierungsstelle Let's Encrypt ausgestelltes Zertifikat ist ausreichend."
COM_AKEEBA_TRANSFER_FORCE_BODY="Sie führen den Website-Übertragungsassistenten im Erzwungenen Modus aus. Das bedeutet, dass einige Prüfungen, die normalerweise vor der Website-Übertragung durchgeführt werden, nicht ausgeführt werden. Als Ergebnis kann die Übertragung eine vorhandene Website überschreiben, unter einer anderen URL als erwartet enden oder einfach fehlschlagen. <strong>Dies ist eine Funktion für erfahrene Benutzer. Bitte fahren Sie nicht fort, wenn Sie sich damit nicht sicher fühlen.</strong>"
COM_AKEEBA_TRANSFER_FORCE_HEADER="Erzwungener Modus aktiviert"
